er! So what then? How then? What can I say? Where's your proof? You can't possibly see this, even if they were as horny as goats, as hot as monkeys, as lustful as wolves in heat, and as stupid as drunken idiots. But still, I say, if strong evidence and circumstances that lead straight to the door of truth will satisfy you, you can have that."}, {"t": "sp", "who": "OTHELLO", "lines": ["Give me a living reason she's disloyal."], "id": 619, "m": "Give me real proof that she's unfaithful."}, {"t": "sp", "who": "IAGO", "lines": ["I do not like the office;", "But sith I am enter'd in this cause so far,", "Prick'd to't by foolish honesty and love,", "I will go on. I lay with Cassio lately", "And, being troubled with a raging tooth,", "I could not sleep.", "There are a kind of men so loose of soul,", "That in their sleeps will mutter their affairs;", "One of this kind is Cassio.", "In sleep I heard him say, \"Sweet Desdemona,", "Let us be wary, let us hide our loves\";", "And then, sir, would he gripe and wring my hand,", "Cry, \"O sweet creature!\" and then kiss me hard,", "As if he pluck'd up kisses by the roots,", "That grew upon my lips; then laid his leg", "Over my thigh, and sigh'd and kiss'd; and then", "Cried, \"Cursed fate that gave thee to the Moor!\""], "id": 620, "m": "I don't like this job. But since I've gone this far into it, driven by foolish honesty and love, I'll go on. I was sharing a bed with Cassio recently, and since I had a terrible toothache, I couldn't sleep. There are some men so loose-lipped that they talk about their affairs in their sleep. Cassio is one of them. In his sleep I heard him say, \"Sweet Desdemona, let's be careful; let's hide our love.\" And then, sir, he'd grab and squeeze my hand, cry out, \"Oh, sweet creature!\" and kiss me hard, as if he were pulling up kisses by the roots that grew on my lips. Then he laid his leg over my thigh, and sighed, and kissed, and then cried, \"Cursed fate that gave you to the Moor!\""}, {"t": "sp", "who": "OTHELLO", "lines": ["O monstrous! monstrous!"], "id": 621, "m": "Oh, monstrous! Monstrous!"}, {"t": "sp", "who": "IAGO", "lines": ["Nay, this was but his dream."], "id": 622, "m": "No, this was only his dream."}, {"t": "sp", "who": "OTHELLO", "lines": ["But this denoted a foregone conclusion.", "'Tis a shrewd doubt, though it be but a dream."], "id": 623, "m": "But it showed something that had already happened. It's a strong reason to suspect, even if it was only a dream."}, {"t": "sp", "who": "IAGO", "lines": ["And this may help to thicken other proofs", "That do demonstrate thinly."], "id": 624, "m": "And this may help strengthen other proofs that are thinner."}, {"t": "sp", "who": "OTHELLO", "lines": ["I'll tear her all to pieces."], "id": 625, "m": "I'll tear her to pieces."}, {"t": "sp", "who": "IAGO", "lines": ["Nay, but be wise; yet we see nothing done;", "She may be honest yet. Tell me but this;", "Have you not sometimes seen a handkerchief", "Spotted with strawberries in your wife's hand?"], "id": 626, "m": "No, be sensible. We haven't seen her do anything yet. She may still be faithful. Just tell me this: haven't you sometimes seen a handkerchief embroidered with strawberries in your wife's hand?"}, {"t": "sp", "who": "OTHELLO", "lines": ["I gave her such a one; 'twas my first gift."], "id": 627, "m": "I gave her one like that. It was my first gift."}, {"t": "sp", "who": "IAGO", "lines": ["I know not that; but such a handkerchief-", "I am sure it was your wife's- did I today", "See Cassio wipe his beard with."], "id": 628, "m": "I didn't know that. But I saw Cassio wipe his beard today with a handkerchief like that, and I'm sure it was your wife's."}, {"t": "sp", "who": "OTHELLO", "lines": ["If it be that-"], "id": 629, "m": "If it's that one—"}, {"t": "sp", "who": "IAGO", "lines": ["If it be that, or any that was hers,", "It speaks against her with the other proofs."], "id": 630, "m": "If it's that one, or any of hers, it's evidence against her, along with the other proofs."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, that the slave had forty thousand lives!", "One is too poor, too weak for my revenge.", "Now do I see 'tis true. Look here, Iago,", "All my fond love thus do I blow to heaven.", "'Tis gone.", "Arise, black vengeance, from thy hollow hell!", "Yield up, O love, thy crown and hearted throne", "To tyrannous hate! Swell, bosom, with thy fraught,", "For 'tis of aspics' tongues!"], "id": 631, "m": "Oh, I wish the villain had forty thousand lives! One is too poor, too weak for my revenge. Now I see it's true. Look here, Iago: I blow all my foolish love away to heaven. It's gone. Rise, black vengeance, from your hollow hell! Give up, love, your crown and your throne in my heart to tyrannical hate! Swell, my heart, with your cargo, because it's made of snakes' tongues!"}, {"t": "sp", "who": "IAGO", "lines": ["Yet be content."], "id": 632, "m": "Calm down."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, blood, blood, blood!"], "id": 633, "m": "Oh, blood, blood, blood!"}, {"t": "sp", "who": "IAGO", "lines": ["Patience, I say; your mind perhaps may change."], "id": 634, "m": "Patience, I say. Maybe you'll change your mind."}, {"t": "sp", "who": "OTHELLO", "lines": ["Never, Iago. Like to the Pontic Sea,", "Whose icy current and compulsive course", "Ne'er feels retiring ebb, but keeps due on", "To the Propontic and the Hellespont,", "Even so my bloody thoughts, with violent pace,", "Shall ne'er look back, ne'er ebb to humble love,", "Till that a capable and wide revenge", "Swallow them up. Now, by yond marble heaven,", "In the due reverence of a sacred vow [Kneels.]", "I here engage my words."], "id": 635, "m": "Never, Iago. Like the Black Sea, whose icy, unstoppable current never flows back but keeps on to the Sea of Marmara and the Dardanelles, my bloody thoughts, at their violent pace, will never look back or ebb into gentle love until a full and complete revenge swallows them up. Now, by that marble heaven above, [He kneels.] with the reverence a sacred vow deserves, I give my word."}, {"t": "sp", "who": "IAGO", "lines": ["Do not rise yet. [Kneels.]", "Witness, you ever-burning lights above,", "You elements that clip us round about,", "Witness that here Iago doth give up", "The execution of his wit, hands, heart,", "To wrong'd Othello's service! Let him command,", "And to obey shall be in me remorse,", "What bloody business ever. [They rise.]"], "id": 636, "m": "Don't get up yet. [He kneels.] Witness, you stars burning forever above, you elements that surround us, witness that Iago here dedicates all his intelligence, his hands, and his heart to the service of wronged Othello! Let him command, and I'll obey out of compassion for him, whatever bloody deed it is. [They stand.]"}, {"t": "sp", "who": "OTHELLO", "lines": ["I greet thy love,", "Not with vain thanks, but with acceptance bounteous,", "And will upon the instant put thee to't:", "Within these three days let me hear thee say", "That Cassio's not alive."], "id": 637, "m": "I welcome your loyalty, not with empty thanks but with full acceptance, and I'll put you to the test right now. Within the next three days, let me hear you say that Cassio is dead."}, {"t": "sp", "who": "IAGO", "lines": ["My friend is dead, 'tis done at your request;", "But let her live."], "id": 638, "m": "My friend is dead; it's done, since you ask. But let her live."}, {"t": "sp", "who": "OTHELLO", "lines": ["Damn her, lewd minx! O, damn her!", "Come, go with me apart; I will withdraw,", "To furnish me with some swift means of death", "For the fair devil. Now art thou my lieutenant."], "id": 639, "m": "Damn her, the lewd slut! Oh, damn her! Come, come away with me. I'll go and figure out some quick way to kill the beautiful devil. Now you're my lieutenant."}, {"t": "sp", "who": "IAGO", "lines": ["I am your own forever."], "id": 640, "m": "I'm yours forever."}, {"t": "sd", "text": "Exeunt.", "id": 641}, {"t": "scene", "act": 3, "scene": "IV", "loc": "Before the castle.", "id": 642}, {"t": "sd", "text": "Enter Desdemona, Emilia, and Clown.", "id": 643}, {"t": "sp", "who": "DESDEMONA", "lines": ["Do you know, sirrah, where Lieutenant Cassio lies?"], "id": 644, "m": "Do you know, fellow, where Lieutenant Cassio lies?"}, {"t": "sp", "who": "CLOWN", "lines": ["I dare not say he lies anywhere."], "id": 645, "m": "I wouldn't dare say he lies anywhere."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why, man?"], "id": 646, "m": "Why, man?"}, {"t": "sp", "who": "CLOWN", "lines": ["He's a soldier; and for one to say a soldier lies, is", "stabbing."], "id": 647, "m": "He's a soldier, and if you say a soldier lies, he'll stab you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Go to! Where lodges he?"], "id": 648, "m": "Come on! Where is he staying?"}, {"t": "sp", "who": "CLOWN", "lines": ["To tell you where he lodges, is to tell you where I lie."], "id": 649, "m": "To tell you where he's staying would be telling you where I lie."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Can anything be made of this?"], "id": 650, "m": "Can anyone make sense of this?"}, {"t": "sp", "who": "CLOWN", "lines": ["I know not where he lodges, and for me to devise a lodging,", "and say he lies here or he lies there, were to lie in mine own", "throat."], "id": 651, "m": "I don't know where he's staying, and if I made up a place and said he lies here or lies there, I'd be lying through my teeth."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Can you inquire him out and be edified by report?"], "id": 652, "m": "Can you ask around for him and find out?"}, {"t": "sp", "who": "CLOWN", "lines": ["I will catechize the world for him; that is, make questions", "and by them answer."], "id": 653, "m": "I'll quiz the whole world for him, which means I'll ask questions and then answer them myself."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Seek him, bid him come hither. Tell him I have moved my", "lord on his behalf and hope all will be well."], "id": 654, "m": "Find him and tell him to come here. Tell him I've spoken to my husband on his behalf and I hope everything will be fine."}, {"t": "sp", "who": "CLOWN", "lines": ["To do this is within the compass of man's wit, and therefore", "I will attempt the doing it."], "id": 655, "m": "Doing this is within a man's abilities, so I'll attempt it."}, {"t": "sd", "text": "Exit.", "id": 656}, {"t": "sp", "who": "DESDEMONA", "lines": ["Where should I lose that handkerchief, Emilia?"], "id": 657, "m": "Where could I have lost that handkerchief, Emilia?"}, {"t": "sp", "who": "EMILIA", "lines": ["I know not, madam."], "id": 658, "m": "I don't know, madam."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Believe me, I had rather have lost my purse", "Full of crusadoes; and, but my noble Moor", "Is true of mind and made of no such baseness", "As jealous creatures are, it were enough", "To put him to ill thinking."], "id": 659, "m": "Believe me, I'd rather have lost my purse full of gold coins. If my noble Moor weren't so honest-minded and free of the meanness that jealous people have, it would be enough to make him think bad thoughts."}, {"t": "sp", "who": "EMILIA", "lines": ["Is he not jealous?"], "id": 660, "m": "Isn't he jealous?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Who, he? I think the sun where he was born", "Drew all such humors from him."], "id": 661, "m": "Who, him? I think the sun where he was born dried all those moods out of him."}, {"t": "sp", "who": "EMILIA", "lines": ["Look, where he comes."], "id": 662, "m": "Look, here he comes."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I will not leave him now till Cassio", "Be call'd to him."], "id": 663, "m": "I won't leave him alone now until Cassio is called back to him."}, {"t": "sd", "text": "Enter Othello.", "id": 664}, {"t": "sp", "who": "DESDEMONA", "cont": 1, "lines": ["How is't with you, my lord?"], "id": 665, "m": "How are you, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Well, my good lady. [Aside.] O, hardness to dissemble!", "How do you, Desdemona?"], "id": 666, "m": "Fine, my good lady. [Aside.] Oh, how hard it is to pretend! How are you, Desdemona?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Well, my good lord."], "id": 667, "m": "Fine, my good lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["Give me your hand. This hand is moist, my lady."], "id": 668, "m": "Give me your hand. This hand is moist, my lady."}, {"t": "sp", "who": "DESDEMONA", "lines": ["It yet has felt no age nor known no sorrow."], "id": 669, "m": "It hasn't felt age or known sorrow yet."}, {"t": "sp", "who": "OTHELLO", "lines": ["This argues fruitfulness and liberal heart;", "Hot, hot, and moist. This hand of yours requires", "A sequester from liberty, fasting, and prayer,", "Much castigation, exercise devout,", "For here's a young and sweating devil here", "That commonly rebels. 'Tis a good hand,", "A frank one."], "id": 670, "m": "This suggests a passionate and generous heart. Hot, hot, and moist. This hand of yours needs to be kept away from freedom, with fasting and prayer, a lot of discipline, and religious exercise, because there's a young, sweating devil here that often rebels. It's a good hand, a very open one."}, {"t": "sp", "who": "DESDEMONA", "lines": ["You may, indeed, say so;", "For 'twas that hand that gave away my heart."], "id": 671, "m": "You can certainly say that, because it was that hand that gave my heart away."}, {"t": "sp", "who": "OTHELLO", "lines": ["A liberal hand. The hearts of old gave hands;", "But our new heraldry is hands, not hearts."], "id": 672, "m": "A generous hand. In the old days, people gave their hands along with their hearts. But in today's fashion, it's hands without hearts."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I cannot speak of this. Come now, your promise."], "id": 673, "m": "I don't know about that. Come now, your promise."}, {"t": "sp", "who": "OTHELLO", "lines": ["What promise, chuck?"], "id": 674, "m": "What promise, dear?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I have sent to bid Cassio come speak with you."], "id": 675, "m": "I've sent for Cassio to come and speak with you."}, {"t": "sp", "who": "OTHELLO", "lines": ["I have a salt and sorry rheum offends me;", "Lend me thy handkerchief."], "id": 676, "m": "I have an annoying runny nose that's bothering me. Lend me your handkerchief."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Here, my lord."], "id": 677, "m": "Here, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["That which I gave you."], "id": 678, "m": "The one I gave you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I have it not about me."], "id": 679, "m": "I don't have it with me."}, {"t": "sp", "who": "OTHELLO", "lines": ["Not?"], "id": 680, "m": "No?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, faith, my lord."], "id": 681, "m": "No, truly, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["That's a fault. That handkerchief", "Did an Egyptian to my mother give;", "She was a charmer, and could almost read", "The thoughts of people. She told her, while she kept it,", "'Twould make her amiable and subdue my father", "Entirely to her love, but if she lost it", "Or made a gift of it, my father's eye", "Should hold her loathed and his spirits should hunt", "After new fancies. She dying gave it me,", "And bid me, when my fate would have me wive,", "To give it her. I did so, and take heed on't;", "Make it a darling like your precious eye;", "To lose't or give't away were such perdition", "As nothing else could match."], "id": 682, "m": "That's a mistake. An Egyptian woman gave that handkerchief to my mother. She was a sorceress who could almost read people's minds. She told my mother that as long as she kept it, it would make her desirable and keep my father completely in love with her. But if she lost it or gave it away, my father would look at her with disgust and his desires would go chasing after new loves. When she was dying, she gave it to me and told me to give it to my wife when I married. I did, so take good care of it. Treasure it like your own precious eyes. To lose it or give it away would be a disaster like no other."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Is't possible?"], "id": 683, "m": "Is that possible?"}, {"t": "sp", "who": "OTHELLO", "lines": ["'Tis true; there's magic in the web of it.", "A sibyl, that had number'd in the world", "The sun to course two hundred compasses,", "In her prophetic fury sew'd the work;", "The worms were hallow'd that did breed the silk,", "And it was dyed in mummy which the skillful", "Conserved of maiden's hearts."], "id": 684, "m": "It's true. There's magic woven into it. A prophetess who had lived two hundred years sewed it in a prophetic trance. The silkworms that made the silk were sacred, and it was dyed with fluid from mummified virgins' hearts."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Indeed! is't true?"], "id": 685, "m": "Really! Is it true?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Most veritable; therefore look to't well."], "id": 686, "m": "Absolutely true. So take good care of it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Then would to God that I had never seen't!"], "id": 687, "m": "Then I wish to God I'd never seen it!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ha! wherefore?"], "id": 688, "m": "Ha! Why?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why do you speak so startingly and rash?"], "id": 689, "m": "Why are you speaking so suddenly and sharply?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Is't lost? is't gone? speak, is it out o' the way?"], "id": 690, "m": "Is it lost? Is it gone? Tell me, is it missing?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Heaven bless us!"], "id": 691, "m": "Heaven help us!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Say you?"], "id": 692, "m": "What did you say?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["It is not lost; but what an if it were?"], "id": 693, "m": "It isn't lost. But what if it were?"}, {"t": "sp", "who": "OTHELLO", "lines": ["How?"], "id": 694, "m": "What?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I say, it is not lost."], "id": 695, "m": "I said it isn't lost."}, {"t": "sp", "who": "OTHELLO", "lines": ["Fetch't, let me see it."], "id": 696, "m": "Get it. Let me see it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why, so I can, sir, but I will not now.", "This is a trick to put me from my suit.", "Pray you, let Cassio be received again."], "id": 697, "m": "Well, I could, sir, but I won't right now. This is a trick to distract me from my request. Please, take Cassio back."}, {"t": "sp", "who": "OTHELLO", "lines": ["Fetch me the handkerchief, my mind misgives."], "id": 698, "m": "Get me the handkerchief. I have a bad feeling."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Come, come,", "You'll never meet a more sufficient man."], "id": 699, "m": "Come on, come on. You'll never find a more capable man."}, {"t": "sp", "who": "OTHELLO", "lines": ["The handkerchief!"], "id": 700, "m": "The handkerchief!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I pray, talk me of Cassio."], "id": 701, "m": "Please, talk to me about Cassio."}, {"t": "sp", "who": "OTHELLO", "lines": ["The handkerchief!"], "id": 702, "m": "The handkerchief!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["A man that all his time", "Hath founded his good fortunes on your love,", "Shared dangers with you-"], "id": 703, "m": "A man who has always based his success on your friendship, who shared dangers with you—"}, {"t": "sp", "who": "OTHELLO", "lines": ["The handkerchief!"], "id": 704, "m": "The handkerchief!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["In sooth, you are to blame."], "id": 705, "m": "Honestly, you're the one in the wrong."}, {"t": "sp", "who": "OTHELLO", "lines": ["Away!"], "id": 706, "m": "Get away!"}, {"t": "sd", "text": "Exit.", "id": 707}, {"t": "sp", "who": "EMILIA", "lines": ["Is not this man jealous?"], "id": 708, "m": "Isn't this man jealous?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I ne'er saw this before.", "Sure there's some wonder in this handkerchief;", "I am most unhappy in the loss of it."], "id": 709, "m": "I never saw this before. There must be something magical about this handkerchief. I'm so unhappy that I've lost it."}, {"t": "sp", "who": "EMILIA", "lines": ["'Tis not a year or two shows us a man.", "They are all but stomachs and we all but food;", "They eat us hungerly, and when they are full", "They belch us. Look you! Cassio and my husband."], "id": 710, "m": "It doesn't take a year or two to show us what a man is. They're all just stomachs and we're just food. They eat us hungrily, and when they're full, they belch us up. Look! Cassio and my husband."}, {"t": "sd", "text": "Enter Cassio and Iago.", "id": 711}, {"t": "sp", "who": "IAGO", "lines": ["There is no other way; 'tis she must do't.", "And, lo, the happiness! Go and importune her."], "id": 712, "m": "There's no other way. She's the one who has to do it. And look, what luck! Go and beg her."}, {"t": "sp", "who": "DESDEMONA", "lines": ["How now, good Cassio! What's the news with you?"], "id": 713, "m": "Hello, good Cassio! What's your news?"}, {"t": "sp", "who": "CASSIO", "lines": ["Madam, my former suit: I do beseech you", "That by your virtuous means I may again", "Exist and be a member of his love", "Whom I with all the office of my heart", "Entirely honor. I would not be delay'd.", "If my offense be of such mortal kind", "That nor my service past nor present sorrows", "Nor purposed merit in futurity", "Can ransom me into his love again,", "But to know so must be my benefit;", "So shall I clothe me in a forced content", "And shut myself up in some other course", "To Fortune's alms."], "id": 714, "m": "Madam, the same request as before. I beg you, through your good influence, let me live again and be a part of the love of the man I honor with all my heart. I don't want any delay. If my offense is so serious that neither my past service, nor my present sorrow, nor my promise of good service in the future can buy back his love, then just knowing that will be a benefit to me. Then I'll force myself to be content and take some other path, relying on Fortune's charity."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas, thrice-gentle Cassio!", "My advocation is not now in tune;", "My lord is not my lord, nor should I know him", "Were he in favor as in humor alter'd.", "So help me every spirit sanctified,", "As I have spoken for you all my best", "And stood within the blank of his displeasure", "For my free speech! You must awhile be patient.", "What I can do I will; and more I will", "Than for myself I dare. Let that suffice you."], "id": 715, "m": "Alas, thrice-gentle Cassio! My pleading isn't working right now. My husband isn't himself. I wouldn't recognize him if his face had changed as much as his mood. So help me every holy spirit, I've spoken for you as well as I can and made myself the target of his anger for speaking so freely! You'll have to be patient for a while. What I can do, I will. And I'll do more for you than I'd dare to do for myself. Let that be enough for you."}, {"t": "sp", "who": "IAGO", "lines": ["Is my lord angry?"], "id": 716, "m": "Is my lord angry?"}, {"t": "sp", "who": "EMILIA", "lines": ["He went hence but now,", "And certainly in strange unquietness."], "id": 717, "m": "He just left, and he was certainly strangely upset."}, {"t": "sp", "who": "IAGO", "lines": ["Can he be angry? I have seen the cannon,", "When it hath blown his ranks into the air", "And, like the devil, from his very arm", "Puff'd his own brother. And can he be angry?", "Something of moment then. I will go meet him.", "There's matter in't indeed if he be angry."], "id": 718, "m": "Can he be angry? I've seen the cannon blow his soldiers into the air and, like the devil, blast his own brother right out of his arms. And he's angry? It must be something important, then. I'll go find him. There's really something to it if he's angry."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I prithee, do so."], "id": 719, "m": "Please, do."}, {"t": "sd", "text": "Exit Iago.", "id": 720}, {"t": "sp", "who": "DESDEMONA", "cont": 1, "lines": ["Something sure of state,", "Either from Venice or some unhatch'd practice", "Made demonstrable here in Cyprus to him,", "Hath puddled his clear spirit; and in such cases", "Men's natures wrangle with inferior things,", "Though great ones are their object. 'Tis even so;", "For let our finger ache, and it indues", "Our other healthful members even to that sense", "Of pain. Nay, we must think men are not gods,", "Nor of them look for such observancy", "As fits the bridal. Beshrew me much, Emilia,", "I was, unhandsome warrior as I am,", "Arraigning his unkindness with my soul;", "But now I find I had suborn'd the witness,", "And he's indicted falsely."], "id": 721, "m": "It must be some state business, either news from Venice or some plot uncovered here in Cyprus, that has muddied his clear mind. In cases like that, men's tempers quarrel with small things even though big things are really on their minds. That's how it is. If our finger aches, the rest of our healthy body feels the pain too. No, we have to remember men aren't gods, and we can't expect them to be as attentive as on the wedding day. Scold me, Emilia: like the clumsy soldier I am, I was accusing him of unkindness in my heart. But now I realize I bribed the witness, and he's been falsely charged."}, {"t": "sp", "who": "EMILIA", "lines": ["Pray heaven it be state matters, as you think,", "And no conception nor no jealous toy", "Concerning you."], "id": 722, "m": "Pray to heaven it's state business, as you think, and not some idea or jealous fancy about you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas the day, I never gave him cause!"], "id": 723, "m": "Oh no, I never gave him any reason!"}, {"t": "sp", "who": "EMILIA", "lines": ["But jealous souls will not be answer'd so;", "They are not ever jealous for the cause,", "But jealous for they are jealous. 'Tis a monster", "Begot upon itself, born on itself."], "id": 724, "m": "But jealous people won't accept that answer. They're not jealous for a reason; they're jealous because they're jealous. It's a monster that conceives itself and gives birth to itself."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Heaven keep that monster from Othello's mind!"], "id": 725, "m": "Heaven keep that monster away from Othello's mind!"}, {"t": "sp", "who": "EMILIA", "lines": ["Lady, amen."], "id": 726, "m": "Amen to that, lady."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I will go seek him. Cassio, walk hereabout.", "If I do find him fit, I'll move your suit,", "And seek to effect it to my uttermost."], "id": 727, "m": "I'll go look for him. Cassio, stay around here. If I find him in the right mood, I'll bring up your request and do my very best to make it happen."}, {"t": "sp", "who": "CASSIO", "lines": ["I humbly thank your ladyship."], "id": 728, "m": "I humbly thank your ladyship."}, {"t": "sd", "text": "Exeunt Desdemona and Emilia.", "id": 729}, {"t": "sd", "text": "Enter Bianca.", "id": 730}, {"t": "sp", "who": "BIANCA", "lines": ["Save you, friend Cassio!"], "id": 731, "m": "Hello, friend Cassio!"}, {"t": "sp", "who": "CASSIO", "lines": ["What make you from home?", "How is it with you, my most fair Bianca?", "I'faith, sweet love, I was coming to your house."], "id": 732, "m": "What are you doing away from home? How are you, my lovely Bianca? Honestly, sweet love, I was coming to your house."}, {"t": "sp", "who": "BIANCA", "lines": ["And I was going to your lodging, Cassio.", "What, keep a week away? seven days and nights?", "Eight score eight hours? and lovers' absent hours,", "More tedious than the dial eight score times?", "O weary reckoning!"], "id": 733, "m": "And I was going to your place, Cassio. What, stay away for a week? Seven days and nights? A hundred and sixty-eight hours? And lovers' hours apart are a hundred and sixty times longer than clock hours. Oh, what a tiring count!"}, {"t": "sp", "who": "CASSIO", "lines": ["Pardon me, Bianca.", "I have this while with leaden thoughts been press'd;", "But I shall in a more continuate time", "Strike off this score of absence. Sweet Bianca,"], "id": 734, "m": "Forgive me, Bianca. I've been weighed down with heavy thoughts lately. But when I have more uninterrupted time, I'll pay off this debt of absence. Sweet Bianca,"}, {"t": "sd", "text": "Gives her Desdemona's handkerchief.", "id": 735}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["Take me this work out."], "id": 736, "m": "copy this embroidery for me."}, {"t": "sp", "who": "BIANCA", "lines": ["O Cassio, whence came this?", "This is some token from a newer friend.", "To the felt absence now I feel a cause.", "Is't come to this? Well, well."], "id": 737, "m": "Oh, Cassio, where did this come from? This is a gift from some new girlfriend. Now I know the reason for your absence. Has it come to this? Well, well."}, {"t": "sp", "who": "CASSIO", "lines": ["Go to, woman!", "Throw your vile guesses in the devil's teeth,", "From whence you have them. You are jealous now", "That this is from some mistress, some remembrance.", "No, by my faith, Bianca."], "id": 738, "m": "Come on, woman! Throw your nasty guesses back in the devil's teeth, where you got them from. Now you're jealous that this is from some mistress, some keepsake. No, I swear, Bianca."}, {"t": "sp", "who": "BIANCA", "lines": ["Why, whose is it?"], "id": 739, "m": "Then whose is it?"}, {"t": "sp", "who": "CASSIO", "lines": ["I know not, sweet. I found it in my chamber.", "I like the work well. Ere it be demanded-", "As like enough it will- I'ld have it copied.", "Take it, and do't; and leave me for this time."], "id": 740, "m": "I don't know, sweetheart. I found it in my room. I like the embroidery. Before someone asks for it back (which they probably will), I'd like to have it copied. Take it and do it, and leave me for now."}, {"t": "sp", "who": "BIANCA", "lines": ["Leave you! wherefore?"], "id": 741, "m": "Leave you? Why?"}, {"t": "sp", "who": "CASSIO", "lines": ["I do attend here on the general;", "And think it no addition, nor my wish,", "To have him see me woman'd."], "id": 742, "m": "I'm waiting here for the general, and I don't think it would help me, nor do I want, to have him see me with a woman."}, {"t": "sp", "who": "BIANCA", "lines": ["Why, I pray you?"], "id": 743, "m": "Why, may I ask?"}, {"t": "sp", "who": "CASSIO", "lines": ["Not that I love you not."], "id": 744, "m": "Not that I don't love you."}, {"t": "sp", "who": "BIANCA", "lines": ["But that you do not love me.", "I pray you, bring me on the way a little,", "And say if I shall see you soon at night."], "id": 745, "m": "But that you don't love me. Please, walk me part of the way, and tell me if I'll see you tonight."}, {"t": "sp", "who": "CASSIO", "lines": ["'Tis but a little way that I can bring you,", "For I attend here, but I'll see you soon."], "id": 746, "m": "I can only walk you a little way, because I have to wait here. But I'll see you soon."}, {"t": "sp", "who": "BIANCA", "lines": ["'Tis very good; I must be circumstanced."], "id": 747, "m": "That's fine. I'll have to accept the circumstances."}, {"t": "sd", "text": "Exeunt.", "id": 748}, {"t": "scene", "act": 4, "scene": "I", "loc": "Cyprus. Before the castle.", "id": 749}, {"t": "sd", "text": "Enter Othello and Iago.", "id": 750}, {"t": "sp", "who": "IAGO", "lines": ["Will you think so?"], "id": 751, "m": "Do you really think so?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Think so, Iago?"], "id": 752, "m": "Think so, Iago?"}, {"t": "sp", "who": "IAGO", "lines": ["What,", "To kiss in private?"], "id": 753, "m": "What, to kiss in private?"}, {"t": "sp", "who": "OTHELLO", "lines": ["An unauthorized kiss."], "id": 754, "m": "An illicit kiss."}, {"t": "sp", "who": "IAGO", "lines": ["Or to be naked with her friend in bed", "An hour or more, not meaning any harm?"], "id": 755, "m": "Or to be naked in bed with her friend for an hour or more, without meaning any harm?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Naked in bed, Iago, and not mean harm!", "It is hypocrisy against the devil.", "They that mean virtuously and yet do so,", "The devil their virtue tempts and they tempt heaven."], "id": 756, "m": "Naked in bed, Iago, and not mean any harm! That's hypocrisy aimed at the devil. People who mean well and still do that are having their virtue tempted by the devil, and they're tempting heaven."}, {"t": "sp", "who": "IAGO", "lines": ["So they do nothing, 'tis a venial slip.", "But if I give my wife a handkerchief-"], "id": 757, "m": "If they don't do anything, it's a minor slip. But if I give my wife a handkerchief—"}, {"t": "sp", "who": "OTHELLO", "lines": ["What then?"], "id": 758, "m": "What then?"}, {"t": "sp", "who": "IAGO", "lines": ["Why, then, 'tis hers, my lord, and being hers,", "She may, I think, bestow't on any man."], "id": 759, "m": "Why, then it's hers, my lord. And since it's hers, I think she can give it to any man she wants."}, {"t": "sp", "who": "OTHELLO", "lines": ["She is protectress of her honor too.", "May she give that?"], "id": 760, "m": "She's the guardian of her honor too. Can she give that away?"}, {"t": "sp", "who": "IAGO", "lines": ["Her honor is an essence that's not seen;", "They have it very oft that have it not.", "But for the handkerchief-"], "id": 761, "m": "Her honor is something you can't see. Plenty of women seem to have it who don't. But as for the handkerchief—"}, {"t": "sp", "who": "OTHELLO", "lines": ["By heaven, I would most gladly have forgot it.", "Thou said'st- O, it comes o'er my memory,", "As doth the raven o'er the infected house,", "Boding to all- he had my handkerchief."], "id": 762, "m": "By heaven, I'd gladly have forgotten it. You said (oh, it hangs over my memory like a raven over a plague-stricken house, a bad omen for everyone) that he had my handkerchief."}, {"t": "sp", "who": "IAGO", "lines": ["Ay, what of that?"], "id": 763, "m": "Yes, so what?"}, {"t": "sp", "who": "OTHELLO", "lines": ["That's not so good now."], "id": 764, "m": "That doesn't look so good now."}, {"t": "sp", "who": "IAGO", "lines": ["What,", "If I had said I had seen him do you wrong?", "Or heard him say- as knaves be such abroad,", "Who having, by their own importunate suit,", "Or voluntary dotage of some mistress,", "Convinced or supplied them, cannot choose", "But they must blab-"], "id": 765, "m": "What if I'd said I'd seen him wrong you? Or heard him say... There are scoundrels out there who, once they've seduced a woman by their own persistent pleading or because she willingly fell for them, can't help bragging about it—"}, {"t": "sp", "who": "OTHELLO", "lines": ["Hath he said anything?"], "id": 766, "m": "Has he said anything?"}, {"t": "sp", "who": "IAGO", "lines": ["He hath, my lord; but be you well assured,", "No more than he'll unswear."], "id": 767, "m": "He has, my lord. But rest assured, nothing more than he'd deny under oath."}, {"t": "sp", "who": "OTHELLO", "lines": ["What hath he said?"], "id": 768, "m": "What has he said?"}, {"t": "sp", "who": "IAGO", "lines": ["Faith, that he did- I know not what he did."], "id": 769, "m": "Well, that he did... I don't know what he did."}, {"t": "sp", "who": "OTHELLO", "lines": ["What? what?"], "id": 770, "m": "What? What?"}, {"t": "sp", "who": "IAGO", "lines": ["Lie-"], "id": 771, "m": "Lie—"}, {"t": "sp", "who": "OTHELLO", "lines": ["With her?"], "id": 772, "m": "With her?"}, {"t": "sp", "who": "IAGO", "lines": ["With her, on her, what you will."], "id": 773, "m": "With her, on her, whatever you like."}, {"t": "sp", "who": "OTHELLO", "lines": ["Lie with her! lie on her! We say lie on her, when they", "belie her. Lie with her! 'Zounds, that's fulsome! Handkerchief-", "confessions- handkerchief! To confess and be hanged for his labor-", "first, to be hanged, and then to confess. I tremble at it.", "Nature would not invest herself in such shadowing passion without", "some instruction. It is not words that shakes me thus. Pish!", "Noses, ears, and lips. Is't possible? Confess? Handkerchief? O", "devil!"], "id": 774, "m": "Lie with her! Lie on her! We say \"lie on her\" when people tell lies about her. Lie with her! Damn it, that's disgusting! Handkerchief... confessions... handkerchief! Let him confess and be hanged for it. No, first hang him, and then let him confess. I'm shaking. My body wouldn't be overcome by such dark passion if there weren't some truth to this. It isn't just words that shake me like this. Ugh! Noses, ears, and lips. Is it possible? Confess? Handkerchief? Oh, devil!"}, {"t": "sd", "text": "Falls in a trance.", "id": 775}, {"t": "sp", "who": "IAGO", "lines": ["Work on,", "My medicine, work! Thus credulous fools are caught,", "And many worthy and chaste dames even thus,", "All guiltless, meet reproach. What, ho! My lord!", "My lord, I say! Othello!"], "id": 776, "m": "Keep working, my medicine, keep working! This is how gullible fools are caught. And this is how many worthy, chaste women, completely innocent, get disgraced. Hey! My lord! My lord, I say! Othello!"}, {"t": "sd", "text": "Enter Cassio.", "id": 777}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["How now, Cassio!"], "id": 778, "m": "Hello, Cassio!"}, {"t": "sp", "who": "CASSIO", "lines": ["What's the matter?"], "id": 779, "m": "What's the matter?"}, {"t": "sp", "who": "IAGO", "lines": ["My lord is fall'n into an epilepsy.", "This is his second fit; he had one yesterday."], "id": 780, "m": "My lord has had an epileptic fit. This is his second one; he had one yesterday."}, {"t": "sp", "who": "CASSIO", "lines": ["Rub him about the temples."], "id": 781, "m": "Rub his temples."}, {"t": "sp", "who": "IAGO", "lines": ["No, forbear;", "The lethargy must have his quiet course.", "If not, he foams at mouth, and by and by", "Breaks out to savage madness. Look, he stirs.", "Do you withdraw yourself a little while,", "He will recover straight. When he is gone,", "I would on great occasion speak with you."], "id": 782, "m": "No, don't. The fit has to run its course quietly. Otherwise he foams at the mouth and soon breaks out into savage madness. Look, he's moving. Step away for a little while. He'll recover soon. When he's gone, I need to talk to you about something important."}, {"t": "sd", "text": "Exit Cassio.", "id": 783}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["How is it, general? Have you not hurt your head?"], "id": 784, "m": "How are you, general? Did you hurt your head?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Dost thou mock me?"], "id": 785, "m": "Are you mocking me?"}, {"t": "sp", "who": "IAGO", "lines": ["I mock you? No, by heaven.", "Would you would bear your fortune like a man!"], "id": 786, "m": "Me, mock you? No, by heaven. I just wish you'd take your bad luck like a man!"}, {"t": "sp", "who": "OTHELLO", "lines": ["A horned man's a monster and a beast."], "id": 787, "m": "A man with horns is a monster and a beast."}, {"t": "sp", "who": "IAGO", "lines": ["There's many a beast then in a populous city,", "And many a civil monster."], "id": 788, "m": "Then there are a lot of beasts in a crowded city, and plenty of well-mannered monsters."}, {"t": "sp", "who": "OTHELLO", "lines": ["Did he confess it?"], "id": 789, "m": "Did he confess it?"}, {"t": "sp", "who": "IAGO", "lines": ["Good sir, be a man;", "Think every bearded fellow that's but yoked", "May draw with you. There's millions now alive", "That nightly lie in those unproper beds", "Which they dare swear peculiar. Your case is better.", "O, 'tis the spite of hell, the fiend's arch-mock,", "To lip a wanton in a secure couch,", "And to suppose her chaste! No, let me know,", "And knowing what I am, I know what she shall be."], "id": 790, "m": "Good sir, be a man. Think of every bearded man who's married: he's pulling the same cart you are. There are millions of men alive right now who go to bed every night in beds others have used, and they'd swear those beds were theirs alone. Your situation is better. Oh, it's hell's own spite, the devil's greatest joke, to kiss a slut in a bed you think is safe and believe she's chaste! No, I'd rather know. And knowing what I am, I know what she'll get."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, thou art wise; 'tis certain."], "id": 791, "m": "Oh, you're wise. That's certain."}, {"t": "sp", "who": "IAGO", "lines": ["Stand you awhile apart,", "Confine yourself but in a patient list.", "Whilst you were here o'erwhelmed with your grief-", "A passion most unsuiting such a man-", "Cassio came hither. I shifted him away,", "And laid good 'scuse upon your ecstasy;", "Bade him anon return and here speak with me", "The which he promised. Do but encave yourself", "And mark the fleers, the gibes, and notable scorns,", "That dwell in every region of his face;", "For I will make him tell the tale anew,", "Where, how, how oft, how long ago, and when", "He hath and is again to cope your wife.", "I say, but mark his gesture. Marry, patience,", "Or I shall say you are all in all in spleen,", "And nothing of a man."], "id": 792, "m": "Stand aside for a while and keep yourself under control. While you were lying here overcome by your grief (a passion that doesn't suit a man like you), Cassio came by. I got rid of him and gave a good excuse for your fit. I told him to come back soon and talk to me here, which he promised to do. Just hide yourself and watch the sneers, the mockery, and the obvious contempt all over his face. Because I'll get him to tell the story again: where, how, how often, how long ago, and when he has slept with your wife and will again. Just watch his gestures, I say. But be patient, or I'll say you're nothing but temper and not a man at all."}, {"t": "sp", "who": "OTHELLO", "lines": ["Dost thou hear, Iago?", "I will be found most cunning in my patience;", "But (dost thou hear?) most bloody."], "id": 793, "m": "Do you hear me, Iago? I'll be very clever in my patience. But (do you hear?) very bloody."}, {"t": "sp", "who": "IAGO", "lines": ["That's not amiss;", "But yet keep time in all. Will you withdraw?"], "id": 794, "m": "That's fine, but keep control of yourself through all of it. Will you step back?"}, {"t": "sd", "text": "Othello retires.", "id": 795}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["Now will I question Cassio of Bianca,", "A housewife that by selling her desires", "Buys herself bread and clothes. It is a creature", "That dotes on Cassio, as 'tis the strumpet's plague", "To beguile many and be beguiled by one.", "He, when he hears of her, cannot refrain", "From the excess of laughter. Here he comes."], "id": 796, "m": "Now I'll ask Cassio about Bianca, a woman who sells her body to buy herself bread and clothes. She's crazy about Cassio, since it's a whore's curse to fool many men and be fooled by one. When he hears her name, he can't help laughing his head off. Here he comes."}, {"t": "sd", "text": "Re-enter Cassio.", "id": 797}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["As he shall smile, Othello shall go mad;", "And his unbookish jealousy must construe", "Poor Cassio's smiles, gestures, and light behavior", "Quite in the wrong. How do you now, lieutenant?"], "id": 798, "m": "When he smiles, Othello will go mad. And his ignorant jealousy will completely misread poor Cassio's smiles, gestures, and lighthearted behavior. How are you now, lieutenant?"}, {"t": "sp", "who": "CASSIO", "lines": ["The worser that you give me the addition", "Whose want even kills me."], "id": 799, "m": "Worse, since you call me by the title whose loss is killing me."}, {"t": "sp", "who": "IAGO", "lines": ["Ply Desdemona well, and you are sure on't.", "Now, if this suit lay in Bianco's power,", "How quickly should you speed!"], "id": 800, "m": "Keep working on Desdemona, and you'll get it for sure. Now, if this request were up to Bianca, how quickly you'd succeed!"}, {"t": "sp", "who": "CASSIO", "lines": ["Alas, poor caitiff!"], "id": 801, "m": "Oh, the poor wretch!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Look, how he laughs already!"], "id": 802, "m": "Look how he's laughing already!"}, {"t": "sp", "who": "IAGO", "lines": ["I never knew a woman love man so."], "id": 803, "m": "I never knew a woman to love a man so much."}, {"t": "sp", "who": "CASSIO", "lines": ["Alas, poor rogue! I think, i'faith, she loves me."], "id": 804, "m": "Oh, poor thing! I really think she does love me."}, {"t": "sp", "who": "OTHELLO", "lines": ["Now he denies it faintly and laughs it out."], "id": 805, "m": "Now he weakly denies it and laughs it off."}, {"t": "sp", "who": "IAGO", "lines": ["Do you hear, Cassio?"], "id": 806, "m": "Do you hear me, Cassio?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Now he importunes him", "To tell it o'er. Go to; well said, well said."], "id": 807, "m": "Now Iago's urging him to tell it again. Go on. Well done, well done."}, {"t": "sp", "who": "IAGO", "lines": ["She gives it out that you shall marry her.", "Do you intend it?"], "id": 808, "m": "She's telling everyone you're going to marry her. Do you intend to?"}, {"t": "sp", "who": "CASSIO", "lines": ["Ha, ha, ha!"], "id": 809, "m": "Ha, ha, ha!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Do you triumph, Roman? Do you triumph?"], "id": 810, "m": "Are you gloating, like a Roman conqueror? Are you gloating?"}, {"t": "sp", "who": "CASSIO", "lines": ["I marry her! What? A customer! I prithee, bear some charity", "to my wit; do not think it so unwholesome. Ha, ha, ha!"], "id": 811, "m": "Me, marry her? What? A prostitute? Please, give my judgment some credit. Don't think I'm that far gone. Ha, ha, ha!"}, {"t": "sp", "who": "OTHELLO", "lines": ["So, so, so, so. They laugh that win."], "id": 812, "m": "So, so, so, so. The winner gets to laugh."}, {"t": "sp", "who": "IAGO", "lines": ["Faith, the cry goes that you shall marry her."], "id": 813, "m": "Honestly, the word is that you'll marry her."}, {"t": "sp", "who": "CASSIO", "lines": ["Prithee, say true."], "id": 814, "m": "Please, tell me the truth."}, {"t": "sp", "who": "IAGO", "lines": ["I am a very villain else."], "id": 815, "m": "I'm a complete villain if I'm not."}, {"t": "sp", "who": "OTHELLO", "lines": ["Have you scored me? Well."], "id": 816, "m": "Have you marked me as a cuckold? Fine."}, {"t": "sp", "who": "CASSIO", "lines": ["This is the monkey's own giving out. She is persuaded I", "will marry her, out of her own love and flattery, not out of my", "promise."], "id": 817, "m": "This is the monkey's own story. She's convinced I'll marry her because she loves me and flatters herself, not because I promised."}, {"t": "sp", "who": "OTHELLO", "lines": ["Iago beckons me; now he begins the story."], "id": 818, "m": "Iago's signaling to me. Now he's starting the story."}, {"t": "sp", "who": "CASSIO", "lines": ["She was here even now; she haunts me in every place. I was", "the other day talking on the sea bank with certain Venetians, and", "thither comes the bauble, and, by this hand, she falls me thus", "about my neck-"], "id": 819, "m": "She was here just now. She follows me everywhere. The other day I was talking with some Venetians on the beach, and along comes the silly thing, and I swear, she throws her arms around my neck like this—"}, {"t": "sp", "who": "OTHELLO", "lines": ["Crying, \"O dear Cassio!\" as it were; his gesture imports", "it."], "id": 820, "m": "Crying, \"Oh, dear Cassio!\" or something like that. His gestures show it."}, {"t": "sp", "who": "CASSIO", "lines": ["So hangs and lolls and weeps upon me; so hales and pulls", "me. Ha, ha, ha!"], "id": 821, "m": "She hangs on me and drapes herself over me and cries on me, and tugs and pulls at me. Ha, ha, ha!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Now he tells how she plucked him to my chamber. O, I see", "that nose of yours, but not that dog I shall throw it to."], "id": 822, "m": "Now he's telling how she dragged him to my bedroom. Oh, I see that nose of yours, but not the dog I'll throw it to."}, {"t": "sp", "who": "CASSIO", "lines": ["Well, I must leave her company."], "id": 823, "m": "Well, I have to stop seeing her."}, {"t": "sp", "who": "IAGO", "lines": ["Before me! look where she comes."], "id": 824, "m": "Look! Here she comes."}, {"t": "sp", "who": "CASSIO", "lines": ["'Tis such another fitchew! marry, a perfumed one."], "id": 825, "m": "She's a real polecat! A perfumed one, though."}, {"t": "sd", "text": "Enter Bianca.", "id": 826}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["What do you mean by this haunting of me?"], "id": 827, "m": "What do you mean by following me around like this?"}, {"t": "sp", "who": "BIANCA", "lines": ["Let the devil and his dam haunt you! What did you mean by", "that same handkerchief you gave me even now? I was a fine fool to", "take it. I must take out the work? A likely piece of work that", "you should find it in your chamber and not know who left it", "there! This is some minx's token, and I must take out the work?", "There, give it your hobbyhorse. Wheresoever you had it, I'll take", "out no work on't."], "id": 828, "m": "Let the devil and his mother follow you around! What did you mean by that handkerchief you just gave me? I was a real fool to take it. I'm supposed to copy the embroidery? A likely story, that you found it in your room and don't know who left it there! This is a present from some slut, and I'm supposed to copy it? Here, give it to your little whore. Wherever you got it, I won't copy any of it."}, {"t": "sp", "who": "CASSIO", "lines": ["How now, my sweet Bianca! how now! how now!"], "id": 829, "m": "What's this, my sweet Bianca? What's going on? What's the matter?"}, {"t": "sp", "who": "OTHELLO", "lines": ["By heaven, that should be my handkerchief!"], "id": 830, "m": "By heaven, that must be my handkerchief!"}, {"t": "sp", "who": "BIANCA", "lines": ["An you'll come to supper tonight, you may; an you will not,", "come when you are next prepared for."], "id": 831, "m": "If you want to come to supper tonight, you can. If you don't, come whenever you're next invited, which will be never."}, {"t": "sd", "text": "Exit.", "id": 832}, {"t": "sp", "who": "IAGO", "lines": ["After her, after her."], "id": 833, "m": "Go after her, go after her."}, {"t": "sp", "who": "CASSIO", "lines": ["Faith, I must; she'll rail i' the street else."], "id": 834, "m": "Honestly, I have to. Otherwise she'll scream at me in the street."}, {"t": "sp", "who": "IAGO", "lines": ["Will you sup there?"], "id": 835, "m": "Will you have supper there?"}, {"t": "sp", "who": "CASSIO", "lines": ["Faith, I intend so."], "id": 836, "m": "Yes, I plan to."}, {"t": "sp", "who": "IAGO", "lines": ["Well, I may chance to see you, for I would very fain speak", "with you."], "id": 837, "m": "Well, I might see you there, because I really need to talk to you."}, {"t": "sp", "who": "CASSIO", "lines": ["Prithee, come; will you?"], "id": 838, "m": "Please come, will you?"}, {"t": "sp", "who": "IAGO", "lines": ["Go to; say no more."], "id": 839, "m": "Go on. Say no more."}, {"t": "sd", "text": "Exit Cassio.", "id": 840}, {"t": "sp", "who": "OTHELLO", "lines": ["[Advancing.] How shall I murther him, Iago?"], "id": 841, "m": "[Coming forward.] How should I kill him, Iago?"}, {"t": "sp", "who": "IAGO", "lines": ["Did you perceive how he laughed at his vice?"], "id": 842, "m": "Did you see how he laughed about his sin?"}, {"t": "sp", "who": "OTHELLO", "lines": ["O Iago!"], "id": 843, "m": "Oh, Iago!"}, {"t": "sp", "who": "IAGO", "lines": ["And did you see the handkerchief?"], "id": 844, "m": "And did you see the handkerchief?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Was that mine?"], "id": 845, "m": "Was that mine?"}, {"t": "sp", "who": "IAGO", "lines": ["Yours, by this hand. And to see how he prizes the foolish", "woman your wife! She gave it him, and he hath given it his whore."], "id": 846, "m": "Yours, I swear. And look how little he values your foolish wife! She gave it to him, and he gave it to his whore."}, {"t": "sp", "who": "OTHELLO", "lines": ["I would have him nine years akilling. A fine woman! a fair", "woman! a sweet woman!"], "id": 847, "m": "I want to spend nine years killing him. A fine woman! A beautiful woman! A sweet woman!"}, {"t": "sp", "who": "IAGO", "lines": ["Nay, you must forget that."], "id": 848, "m": "No, you have to forget that."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, let her rot, and perish, and be damned tonight, for", "she shall not live. No, my heart is turned to stone; I strike it,", "and it hurts my hand. O, the world hath not a sweeter creature.", "She might lie by an emperor's side, and command him tasks."], "id": 849, "m": "Yes, let her rot and perish and be damned tonight, because she won't live. No, my heart has turned to stone. I hit it, and it hurts my hand. Oh, the world has no sweeter creature. She could lie beside an emperor and give him orders."}, {"t": "sp", "who": "IAGO", "lines": ["Nay, that's not your way."], "id": 850, "m": "No, that's not the way to think."}, {"t": "sp", "who": "OTHELLO", "lines": ["Hang her! I do but say what she is. So delicate with her", "needle, an admirable musician. O, she will sing the savageness", "out of a bear. Of so high and plenteous wit and invention-"], "id": 851, "m": "Hang her! I'm only saying what she is. So skillful with her needle, a wonderful musician. Oh, her singing could tame a savage bear. So intelligent and imaginative—"}, {"t": "sp", "who": "IAGO", "lines": ["She's the worse for all this."], "id": 852, "m": "She's all the worse for all this."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, a thousand, a thousand times. And then, of so gentle a", "condition!"], "id": 853, "m": "Oh, a thousand, a thousand times worse. And she has such a gentle nature!"}, {"t": "sp", "who": "IAGO", "lines": ["Ay, too gentle."], "id": 854, "m": "Yes, too gentle, too easily yielding."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nay, that's certain. But yet the pity of it, Iago!", "O Iago, the pity of it, Iago!"], "id": 855, "m": "No, that's certain. But still, the pity of it, Iago! Oh, Iago, the pity of it, Iago!"}, {"t": "sp", "who": "IAGO", "lines": ["If you are so fond over her iniquity, give her patent to", "offend, for, if it touch not you, it comes near nobody."], "id": 856, "m": "If you're so fond of her sins, give her a license to sin. Because if it doesn't bother you, it doesn't bother anyone."}, {"t": "sp", "who": "OTHELLO", "lines": ["I will chop her into messes. Cuckold me!"], "id": 857, "m": "I'll chop her into little pieces. Make me a cuckold!"}, {"t": "sp", "who": "IAGO", "lines": ["O, 'tis foul in her."], "id": 858, "m": "Oh, it's disgusting of her."}, {"t": "sp", "who": "OTHELLO", "lines": ["With mine officer!"], "id": 859, "m": "With my own officer!"}, {"t": "sp", "who": "IAGO", "lines": ["That's fouler."], "id": 860, "m": "That's even worse."}, {"t": "sp", "who": "OTHELLO", "lines": ["Get me some poison, Iago, this night. I'll not expostulate", "with her, lest her body and beauty unprovide my mind again. This", "night, Iago."], "id": 861, "m": "Get me some poison tonight, Iago. I won't argue with her, in case her body and beauty weaken my resolve again. Tonight, Iago."}, {"t": "sp", "who": "IAGO", "lines": ["Do it not with poison, strangle her in her bed, even the bed", "she hath contaminated."], "id": 862, "m": "Don't use poison. Strangle her in her bed, the very bed she has contaminated."}, {"t": "sp", "who": "OTHELLO", "lines": ["Good, good, the justice of it pleases, very good."], "id": 863, "m": "Good, good. I like the justice of it. Very good."}, {"t": "sp", "who": "IAGO", "lines": ["And for Cassio, let me be his undertaker. You shall hear more", "by midnight."], "id": 864, "m": "And as for Cassio, let me take care of him. You'll hear more by midnight."}, {"t": "sp", "who": "OTHELLO", "lines": ["Excellent good. [A trumpet within.] What trumpet is that", "same?"], "id": 865, "m": "Excellent. [A trumpet offstage.] What's that trumpet?"}, {"t": "sp", "who": "IAGO", "lines": ["Something from Venice, sure. 'Tis Lodovico", "Come from the Duke. And, see your wife is with him."], "id": 866, "m": "Something from Venice, I'm sure. It's Lodovico, sent by the Duke. And look, your wife is with him."}, {"t": "sd", "text": "Enter Lodovico, Desdemona, and Attendants.", "id": 867}, {"t": "sp", "who": "LODOVICO", "lines": ["God save the worthy general!"], "id": 868, "m": "God save the worthy general!"}, {"t": "sp", "who": "OTHELLO", "lines": ["With all my heart, sir."], "id": 869, "m": "With all my heart, sir."}, {"t": "sp", "who": "LODOVICO", "lines": ["The Duke and Senators of Venice greet you."], "id": 870, "m": "The Duke and Senators of Venice send their greetings."}, {"t": "sd", "text": "Gives him a letter.", "id": 871}, {"t": "sp", "who": "OTHELLO", "lines": ["I kiss the instrument of their pleasures."], "id": 872, "m": "I kiss this document of their orders."}, {"t": "sd", "text": "Opens the letter, and reads.", "id": 873}, {"t": "sp", "who": "DESDEMONA", "lines": ["And what's the news, good cousin Lodovico?"], "id": 874, "m": "And what's the news, good cousin Lodovico?"}, {"t": "sp", "who": "IAGO", "lines": ["I am very glad to see you, signior;", "Welcome to Cyprus."], "id": 875, "m": "I'm very glad to see you, sir. Welcome to Cyprus."}, {"t": "sp", "who": "LODOVICO", "lines": ["I thank you. How does Lieutenant Cassio?"], "id": 876, "m": "Thank you. How is Lieutenant Cassio?"}, {"t": "sp", "who": "IAGO", "lines": ["Lives, sir."], "id": 877, "m": "Alive, sir."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Cousin, there's fall'n between him and my lord", "An unkind breech; but you shall make all well."], "id": 878, "m": "Cousin, there's been an unfortunate falling-out between him and my husband. But you'll make everything right."}, {"t": "sp", "who": "OTHELLO", "lines": ["Are you sure of that?"], "id": 879, "m": "Are you sure of that?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord?"], "id": 880, "m": "My lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["[Reads.] \"This fail you not to do, as you will-\""], "id": 881, "m": "[Reading.] \"Do not fail to do this, as you will—\""}, {"t": "sp", "who": "LODOVICO", "lines": ["He did not call; he's busy in the paper.", "Is there division 'twixt my lord and Cassio?"], "id": 882, "m": "He wasn't talking to you; he's busy with the letter. Is there a quarrel between my lord and Cassio?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["A most unhappy one. I would do much", "To atone them, for the love I bear to Cassio."], "id": 883, "m": "A very unhappy one. I'd do a lot to reconcile them, because of the affection I have for Cassio."}, {"t": "sp", "who": "OTHELLO", "lines": ["Fire and brimstone!"], "id": 884, "m": "Fire and brimstone!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord?"], "id": 885, "m": "My lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Are you wise?"], "id": 886, "m": "Are you in your right mind?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["What, is he angry?"], "id": 887, "m": "What, is he angry?"}, {"t": "sp", "who": "LODOVICO", "lines": ["May be the letter moved him;", "For, as I think, they do command him home,", "Deputing Cassio in his government."], "id": 888, "m": "Maybe the letter upset him. As I understand it, they're ordering him home and putting Cassio in charge here in his place."}, {"t": "sp", "who": "DESDEMONA", "lines": ["By my troth, I am glad on't."], "id": 889, "m": "Honestly, I'm glad of that."}, {"t": "sp", "who": "OTHELLO", "lines": ["Indeed!"], "id": 890, "m": "Really!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord?"], "id": 891, "m": "My lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["I am glad to see you mad."], "id": 892, "m": "I'm glad to see you've lost your mind."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why, sweet Othello?"], "id": 893, "m": "Why, sweet Othello?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Devil! [Strikes her.]"], "id": 894, "m": "Devil! [He hits her.]"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I have not deserved this."], "id": 895, "m": "I haven't deserved this."}, {"t": "sp", "who": "LODOVICO", "lines": ["My lord, this would not be believed in Venice,", "Though I should swear I saw't. 'Tis very much.", "Make her amends; she weeps."], "id": 896, "m": "My lord, no one in Venice would believe this, even if I swore I saw it. This is too much. Apologize to her. She's crying."}, {"t": "sp", "who": "OTHELLO", "lines": ["O devil, devil!", "If that the earth could teem with woman's tears,", "Each drop she falls would prove a crocodile.", "Out of my sight!"], "id": 897, "m": "Oh, devil, devil! If the earth could be made pregnant by women's tears, every tear she drops would turn into a crocodile. Get out of my sight!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["[Going.] I will not stay to offend you."], "id": 898, "m": "[Going.] I won't stay and offend you."}, {"t": "sp", "who": "LODOVICO", "lines": ["Truly, an obedient lady.", "I do beseech your lordship, call her back."], "id": 899, "m": "Truly, an obedient lady. I beg you, my lord, call her back."}, {"t": "sp", "who": "OTHELLO", "lines": ["Mistress!"], "id": 900, "m": "Madam!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord?"], "id": 901, "m": "My lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["What would you with her, sir?"], "id": 902, "m": "What do you want with her, sir?"}, {"t": "sp", "who": "LODOVICO", "lines": ["Who, I, my lord?"], "id": 903, "m": "Who, me, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, you did wish that I would make her turn.", "Sir, she can turn and turn, and yet go on,", "And turn again; and she can weep, sir, weep;", "And she's obedient, as you say, obedient,", "Very obedient. Proceed you in your tears.", "Concerning this, sir- O well-painted passion!-", "I am commanded home. Get you away;", "I'll send for you anon. Sir, I obey the mandate,", "And will return to Venice. Hence, avaunt!"], "id": 904, "m": "Yes, you wanted me to make her turn around. Sir, she can turn and turn, and still keep going, and turn again. And she can cry, sir, cry. And she's obedient, as you say, obedient, very obedient. Go on with your tears. About this letter, sir... Oh, what a well-acted show of grief! I'm ordered home. Get out of here; I'll send for you soon. Sir, I'll obey the order and return to Venice. Go, get out!"}, {"t": "sd", "text": "Exit Desdemona.", "id": 905}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["Cassio shall have my place. And, sir, tonight,", "I do entreat that we may sup together.", "You are welcome, sir, to Cyprus. Goats and monkeys!"], "id": 906, "m": "Cassio will take over my position. And, sir, I invite you to have supper with me tonight. Welcome to Cyprus, sir. Goats and monkeys!"}, {"t": "sd", "text": "Exit.", "id": 907}, {"t": "sp", "who": "LODOVICO", "lines": ["Is this the noble Moor whom our full Senate", "Call all in all sufficient? This the nature", "Whom passion could not shake? whose solid virtue", "The shot of accident nor dart of chance", "Could neither graze nor pierce?"], "id": 908, "m": "Is this the noble Moor whom our whole Senate calls completely capable? Is this the man whom passion couldn't shake, whose solid virtue couldn't be grazed or pierced by the bullets of accident or the arrows of chance?"}, {"t": "sp", "who": "IAGO", "lines": ["He is much changed."], "id": 909, "m": "He's changed a lot."}, {"t": "sp", "who": "LODOVICO", "lines": ["Are his wits safe? Is he not light of brain?"], "id": 910, "m": "Is he in his right mind? Has he gone mad?"}, {"t": "sp", "who": "IAGO", "lines": ["He's that he is. I may not breathe my censure", "What he might be: if what he might he is not,", "I would to heaven he were!"], "id": 911, "m": "He is what he is. It's not my place to say what he might be. If he isn't what he should be, I wish to heaven he were!"}, {"t": "sp", "who": "LODOVICO", "lines": ["What, strike his wife!"], "id": 912, "m": "What, hitting his wife!"}, {"t": "sp", "who": "IAGO", "lines": ["Faith, that was not so well; yet would I knew", "That stroke would prove the worst!"], "id": 913, "m": "Honestly, that wasn't good. But I wish I knew that blow would be the worst of it!"}, {"t": "sp", "who": "LODOVICO", "lines": ["Is it his use?", "Or did the letters work upon his blood,", "And new create this fault?"], "id": 914, "m": "Is this his habit? Or did the letters stir up his temper and create this fault?"}, {"t": "sp", "who": "IAGO", "lines": ["Alas, alas!", "It is not honesty in me to speak", "What I have seen and known. You shall observe him,", "And his own courses will denote him so", "That I may save my speech. Do but go after,", "And mark how he continues."], "id": 915, "m": "Alas, alas! It wouldn't be honest of me to tell you what I've seen and known. You watch him, and his own actions will show you what he is, so I won't have to say anything. Just follow him and see how he goes on."}, {"t": "sp", "who": "LODOVICO", "lines": ["I am sorry that I am deceived in him."], "id": 916, "m": "I'm sorry I was so wrong about him."}, {"t": "sd", "text": "Exeunt.", "id": 917}, {"t": "scene", "act": 4, "scene": "II", "loc": "A room in the castle.", "id": 918}, {"t": "sd", "text": "Enter Othello and Emilia.", "id": 919}, {"t": "sp", "who": "OTHELLO", "lines": ["You have seen nothing, then?"], "id": 920, "m": "So you haven't seen anything?"}, {"t": "sp", "who": "EMILIA", "lines": ["Nor ever heard, nor ever did suspect."], "id": 921, "m": "Nor heard anything, nor ever suspected anything."}, {"t": "sp", "who": "OTHELLO", "lines": ["Yes, you have seen Cassio and she together."], "id": 922, "m": "Yes, you've seen Cassio and her together."}, {"t": "sp", "who": "EMILIA", "lines": ["But then I saw no harm, and then I heard", "Each syllable that breath made up between them."], "id": 923, "m": "But I didn't see anything wrong, and I heard every syllable they said to each other."}, {"t": "sp", "who": "OTHELLO", "lines": ["What, did they never whisper?"], "id": 924, "m": "What, did they never whisper?"}, {"t": "sp", "who": "EMILIA", "lines": ["Never, my lord."], "id": 925, "m": "Never, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nor send you out o' the way?"], "id": 926, "m": "Or send you away?"}, {"t": "sp", "who": "EMILIA", "lines": ["Never."], "id": 927, "m": "Never."}, {"t": "sp", "who": "OTHELLO", "lines": ["To fetch her fan, her gloves, her mask, nor nothing?"], "id": 928, "m": "To get her fan, her gloves, her mask, or anything?"}, {"t": "sp", "who": "EMILIA", "lines": ["Never, my lord."], "id": 929, "m": "Never, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["That's strange."], "id": 930, "m": "That's strange."}, {"t": "sp", "who": "EMILIA", "lines": ["I durst, my lord, to wager she is honest,", "Lay down my soul at stake. If you think other,", "Remove your thought; it doth abuse your bosom.", "If any wretch have put this in your head,", "Let heaven requite it with the serpent's curse!", "For if she be not honest, chaste, and true,", "There's no man happy; the purest of their wives", "Is foul as slander."], "id": 931, "m": "My lord, I'd bet my soul that she's faithful. If you think otherwise, get rid of the thought; it's poisoning your heart. If some wretch has put this into your head, let heaven punish him with the curse it gave the serpent! Because if she isn't honest, chaste, and true, no husband is happy; the purest wife is as foul as slander."}, {"t": "sp", "who": "OTHELLO", "lines": ["Bid her come hither; go."], "id": 932, "m": "Tell her to come here. Go."}, {"t": "sd", "text": "Exit Emilia.", "id": 933}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["She says enough; yet she's a simple bawd", "That cannot say as much. This is a subtle whore,", "A closet lock and key of villainous secrets.", "And yet she'll kneel and pray; I have seen her do't."], "id": 934, "m": "She says enough. But any brothel-keeper who couldn't say as much would be a simple one. This woman's a clever whore, a locked cabinet full of wicked secrets. And yet she'll kneel and pray; I've seen her do it."}, {"t": "sd", "text": "Enter Desdemona with Emilia.", "id": 935}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord, what is your will?"], "id": 936, "m": "My lord, what do you want?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Pray, chuck, come hither."], "id": 937, "m": "Please, darling, come here."}, {"t": "sp", "who": "DESDEMONA", "lines": ["What is your pleasure?"], "id": 938, "m": "What would you like?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Let me see your eyes;", "Look in my face."], "id": 939, "m": "Let me see your eyes. Look at my face."}, {"t": "sp", "who": "DESDEMONA", "lines": ["What horrible fancy's this?"], "id": 940, "m": "What horrible idea is this?"}, {"t": "sp", "who": "OTHELLO", "lines": ["[To Emilia.] Some of your function, mistress,", "Leave procreants alone and shut the door;", "Cough, or cry \"hem,\" if anybody come.", "Your mystery, your mystery; nay, dispatch."], "id": 941, "m": "[To Emilia.] Do your job, madam. Leave the lovers alone and shut the door. Cough or say \"ahem\" if anyone comes. Your trade, your trade! Go on, hurry."}, {"t": "sd", "text": "Exit Emilia.", "id": 942}, {"t": "sp", "who": "DESDEMONA", "lines": ["Upon my knees, what doth your speech import?", "I understand a fury in your words,", "But not the words."], "id": 943, "m": "I beg you on my knees, what do your words mean? I can hear the fury in them, but I don't understand the words."}, {"t": "sp", "who": "OTHELLO", "lines": ["Why, what art thou?"], "id": 944, "m": "Why, what are you?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Your wife, my lord, your true and loyal wife."], "id": 945, "m": "Your wife, my lord, your true and loyal wife."}, {"t": "sp", "who": "OTHELLO", "lines": ["Come, swear it, damn thyself;", "Lest, being like one of heaven, the devils themselves", "Should fear to seize thee. Therefore be double-damn'd;", "Swear thou art honest."], "id": 946, "m": "Come on, swear it, and damn yourself. Because you look like an angel, the devils themselves might be afraid to grab you. So be doubly damned: swear you're faithful."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Heaven doth truly know it."], "id": 947, "m": "Heaven truly knows I am."}, {"t": "sp", "who": "OTHELLO", "lines": ["Heaven truly knows that thou art false as hell."], "id": 948, "m": "Heaven truly knows you're as false as hell."}, {"t": "sp", "who": "DESDEMONA", "lines": ["To whom, my lord? with whom? how am I false?"], "id": 949, "m": "False to whom, my lord? With whom? How am I false?"}, {"t": "sp", "who": "OTHELLO", "lines": ["O Desdemona! Away! away! away!"], "id": 950, "m": "Oh, Desdemona! Away! Away! Away!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas the heavy day! Why do you weep?", "Am I the motive of these tears, my lord?", "If haply you my father do suspect", "An instrument of this your calling back,", "Lay not your blame on me. If you have lost him,", "Why, I have lost him too."], "id": 951, "m": "Oh, what a terrible day! Why are you crying? Am I the reason for these tears, my lord? If you suspect my father had a hand in your being called home, don't blame me. If you've lost his friendship, well, I've lost him too."}, {"t": "sp", "who": "OTHELLO", "lines": ["Had it pleased heaven", "To try me with affliction, had they rain'd", "All kinds of sores and shames on my bare head,", "Steep'd me in poverty to the very lips,", "Given to captivity me and my utmost hopes,", "I should have found in some place of my soul", "A drop of patience; but, alas, to make me", "A fixed figure for the time of scorn", "To point his slow unmoving finger at!", "Yet could I bear that too, well, very well;", "But there, where I have garner'd up my heart,", "Where either I must live or bear no life;", "The fountain from the which my current runs,", "Or else dries up; to be discarded thence!", "Or keep it as a cistern for foul toads", "To knot and gender in! Turn thy complexion there,", "Patience, thou young and rose-lipp'd cherubin,", "Ay, there, look grim as hell!"], "id": 952, "m": "If heaven had wanted to test me with suffering, if it had rained every kind of sore and shame on my bare head, drowned me in poverty up to my lips, made a prisoner of me and all my highest hopes, I'd have found somewhere in my soul a drop of patience. But, alas, to make me a fixed target for the scornful world to point its slow, unmoving finger at! Still, I could bear that too, well, very well. But there, where I've stored up my heart, where I must either live or not live at all, the spring my life flows from or else dries up: to be thrown out of there! Or to have to keep it as a tank where filthy toads tangle and breed! Change color at that, Patience, you young, rosy-lipped angel. Yes, at that, look as grim as hell!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I hope my noble lord esteems me honest."], "id": 953, "m": "I hope my noble lord thinks I'm faithful."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, ay, as summer flies are in the shambles,", "That quicken even with blowing. O thou weed,", "Who art so lovely fair and smell'st so sweet", "That the sense aches at thee, would thou hadst ne'er been born!"], "id": 954, "m": "Oh, yes, as faithful as summer flies in a slaughterhouse, which breed again the moment their eggs are laid. Oh, you weed, who are so lovely and beautiful and smell so sweet that it makes the senses ache, I wish you'd never been born!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas, what ignorant sin have I committed?"], "id": 955, "m": "Alas, what sin have I committed without knowing it?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Was this fair paper, this most goodly book,", "Made to write \"whore\" upon? What committed?", "Committed? O thou public commoner!", "I should make very forges of my cheeks,", "That would to cinders burn up modesty,", "Did I but speak thy deeds. What committed!", "Heaven stops the nose at it, and the moon winks;", "The bawdy wind, that kisses all it meets,", "Is hush'd within the hollow mine of earth,", "And will not hear it. What committed?", "Impudent strumpet!"], "id": 956, "m": "Was this beautiful paper, this lovely book, made to have \"whore\" written on it? Committed? What have you committed? Oh, you common prostitute! If I just named what you've done, my cheeks would burn like furnaces and turn modesty to ashes. What have you committed! Heaven holds its nose at it, and the moon shuts its eyes. The promiscuous wind, which kisses everything it meets, hides in the hollow caves of the earth and won't listen to it. What have you committed? Shameless whore!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["By heaven, you do me wrong."], "id": 957, "m": "By heaven, you're wronging me."}, {"t": "sp", "who": "OTHELLO", "lines": ["Are not you a strumpet?"], "id": 958, "m": "Aren't you a whore?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, as I am a Christian.", "If to preserve this vessel for my lord", "From any other foul unlawful touch", "Be not to be a strumpet, I am none."], "id": 959, "m": "No, as I'm a Christian. If keeping this body for my husband alone, away from any other foul, unlawful touch, means I'm not a whore, then I'm not one."}, {"t": "sp", "who": "OTHELLO", "lines": ["What, not a whore?"], "id": 960, "m": "What, not a whore?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, as I shall be saved."], "id": 961, "m": "No, as I hope to be saved."}, {"t": "sp", "who": "OTHELLO", "lines": ["Is't possible?"], "id": 962, "m": "Is it possible?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, heaven forgive us!"], "id": 963, "m": "Oh, heaven forgive us!"}, {"t": "sp", "who": "OTHELLO", "lines": ["I cry you mercy then;", "I took you for that cunning whore of Venice", "That married with Othello. [Raises his voice.] You, mistress,", "That have the office opposite to Saint Peter,", "And keep the gate of hell!"], "id": 964, "m": "Then I beg your pardon. I mistook you for that cunning whore of Venice who married Othello. [Raising his voice.] You, madam, whose job is the opposite of Saint Peter's, guarding the gate of hell!"}, {"t": "sd", "text": "Re-enter Emilia.", "id": 965}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["You, you, ay, you!", "We have done our course; there's money for your pains.", "I pray you, turn the key, and keep our counsel."], "id": 966, "m": "You, you, yes, you! We're finished. Here's money for your trouble. Please, turn the key and keep our secret."}, {"t": "sd", "text": "Exit.", "id": 967}, {"t": "sp", "who": "EMILIA", "lines": ["Alas, what does this gentleman conceive?", "How do you, madam? How do you, my good lady?"], "id": 968, "m": "Oh, what is this gentleman imagining? How are you, madam? How are you, my good lady?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Faith, half asleep."], "id": 969, "m": "Honestly, half asleep."}, {"t": "sp", "who": "EMILIA", "lines": ["Good madam, what's the matter with my lord?"], "id": 970, "m": "Good madam, what's the matter with my lord?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["With who?"], "id": 971, "m": "With whom?"}, {"t": "sp", "who": "EMILIA", "lines": ["Why, with my lord, madam."], "id": 972, "m": "Why, with my lord, madam."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Who is thy lord?"], "id": 973, "m": "Who is your lord?"}, {"t": "sp", "who": "EMILIA", "lines": ["He that is yours, sweet lady."], "id": 974, "m": "The one who's yours, sweet lady."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I have none. Do not talk to me, Emilia;", "I cannot weep, nor answer have I none", "But what should go by water. Prithee, tonight", "Lay on my bed my wedding sheets. Remember,", "And call thy husband hither."], "id": 975, "m": "I have none. Don't talk to me, Emilia. I can't cry, and I have no answers except tears. Please, tonight, put my wedding sheets on my bed. Remember. And call your husband here."}, {"t": "sp", "who": "EMILIA", "lines": ["Here's a change indeed!"], "id": 976, "m": "This is a change indeed!"}, {"t": "sd", "text": "Exit.", "id": 977}, {"t": "sp", "who": "DESDEMONA", "lines": ["'Tis meet I should be used so, very meet.", "How have I been behaved, that he might stick", "The small'st opinion on my least misuse?"], "id": 978, "m": "It's right that I should be treated like this, very right. How have I behaved that he could attach even the slightest suspicion to my smallest fault?"}, {"t": "sd", "text": "Re-enter Emilia with Iago.", "id": 979}, {"t": "sp", "who": "IAGO", "lines": ["What is your pleasure, madam? How is't with you?"], "id": 980, "m": "What can I do for you, madam? How are you?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I cannot tell. Those that do teach young babes", "Do it with gentle means and easy tasks.", "He might have chid me so, for in good faith,", "I am a child to chiding."], "id": 981, "m": "I don't know. People who teach young children do it gently and with easy tasks. He could have scolded me that way, because honestly, I'm a child when it comes to being scolded."}, {"t": "sp", "who": "IAGO", "lines": ["What's the matter, lady?"], "id": 982, "m": "What's the matter, lady?"}, {"t": "sp", "who": "EMILIA", "lines": ["Alas, Iago, my lord hath so bewhored her,", "Thrown such despite and heavy terms upon her,", "As true hearts cannot bear."], "id": 983, "m": "Oh, Iago, my lord has called her a whore and heaped such abuse and harsh words on her that no true heart could bear it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Am I that name, Iago?"], "id": 984, "m": "Am I that name, Iago?"}, {"t": "sp", "who": "IAGO", "lines": ["What name, fair lady?"], "id": 985, "m": "What name, fair lady?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Such as she says my lord did say I was."], "id": 986, "m": "The one she says my lord called me."}, {"t": "sp", "who": "EMILIA
