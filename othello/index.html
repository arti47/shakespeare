ld be told about it. Maybe he doesn't see it, or his good nature values the good qualities in Cassio and overlooks his faults. Isn't that right?"}, {"t": "sd", "text": "Enter Roderigo.", "id": 350}, {"t": "sp", "who": "IAGO", "lines": ["[Aside to him.] How now, Roderigo!", "I pray you, after the lieutenant; go."], "id": 351, "m": "[Aside to Roderigo.] Hello, Roderigo! Please, go after the lieutenant. Go."}, {"t": "sd", "text": "Exit Roderigo.", "id": 352}, {"t": "sp", "who": "MONTANO", "lines": ["And 'tis great pity that the noble Moor", "Should hazard such a place as his own second", "With one of an ingraft infirmity.", "It were an honest action to say", "So to the Moor."], "id": 353, "m": "And it's a great pity that the noble Moor would risk such an important post as his second-in-command on a man with such an ingrained weakness. It would be the honest thing to tell the Moor."}, {"t": "sp", "who": "IAGO", "lines": ["Not I, for this fair island.", "I do love Cassio well, and would do much", "To cure him of this evil- But, hark! What noise?"], "id": 354, "m": "Not me, not for this whole beautiful island. I like Cassio very much and would do a lot to cure him of this problem. But listen! What's that noise?"}, {"t": "sd", "text": "A cry within, \"Help, help!\"", "id": 355}, {"t": "sd", "text": "Re-enter Cassio, driving in Roderigo.", "id": 356}, {"t": "sp", "who": "CASSIO", "lines": ["'Zounds! You rogue! You rascal!"], "id": 357, "m": "Damn it! You rogue! You rascal!"}, {"t": "sp", "who": "MONTANO", "lines": ["What's the matter, lieutenant?"], "id": 358, "m": "What's the matter, lieutenant?"}, {"t": "sp", "who": "CASSIO", "lines": ["A knave teach me my duty! But I'll beat the knave into a", "twiggen bottle."], "id": 359, "m": "A lowlife telling me my duty! I'll beat that lowlife into a wicker bottle."}, {"t": "sp", "who": "RODERIGO", "lines": ["Beat me!"], "id": 360, "m": "Beat me?"}, {"t": "sp", "who": "CASSIO", "lines": ["Dost thou prate, rogue? [Strikes Roderigo.]"], "id": 361, "m": "Are you talking back, you rogue? [Hits Roderigo.]"}, {"t": "sp", "who": "MONTANO", "lines": ["Nay, good lieutenant; I pray you, sir, hold your hand."], "id": 362, "m": "No, good lieutenant. Please, sir, stop."}, {"t": "sp", "who": "CASSIO", "lines": ["Let me go, sir, or I'll knock you o'er the mazzard."], "id": 363, "m": "Let go of me, sir, or I'll knock you on the head."}, {"t": "sp", "who": "MONTANO", "lines": ["Come, come, you're drunk."], "id": 364, "m": "Come on, come on, you're drunk."}, {"t": "sp", "who": "CASSIO", "lines": ["Drunk? [They fight.]"], "id": 365, "m": "Drunk? [They fight.]"}, {"t": "sp", "who": "IAGO", "lines": ["[Aside to Roderigo.] Away, I say; go out and cry a mutiny."], "id": 366, "m": "[Aside to Roderigo.] Go, I tell you. Go out and shout that there's a riot."}, {"t": "sd", "text": "Exit Roderigo.", "id": 367}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["Nay, good lieutenant! God's will, gentlemen!", "Help, ho!- Lieutenant- sir- Montano- sir-", "Help, masters!- Here's a goodly watch indeed!"], "id": 368, "m": "No, good lieutenant! For God's sake, gentlemen! Help! Lieutenant, sir, Montano, sir! Help, gentlemen! What a fine watch this is!"}, {"t": "sd", "text": "A bell rings.", "id": 369}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["Who's that that rings the bell?- Diablo, ho!", "The town will rise. God's will, lieutenant, hold!", "You will be shamed forever."], "id": 370, "m": "Who's ringing the bell? Devil take it! The whole town will wake up. For God's sake, lieutenant, stop! You'll be disgraced forever."}, {"t": "sd", "text": "Re-enter Othello and Attendants.", "id": 371}, {"t": "sp", "who": "OTHELLO", "lines": ["What is the matter here?"], "id": 372, "m": "What's going on here?"}, {"t": "sp", "who": "MONTANO", "lines": ["'Zounds, I bleed still; I am hurt to the death.", "[Faints.]"], "id": 373, "m": "Damn it, I'm still bleeding. I'm mortally wounded. [He collapses.]"}, {"t": "sp", "who": "OTHELLO", "lines": ["Hold, for your lives!"], "id": 374, "m": "Stop, if you value your lives!"}, {"t": "sp", "who": "IAGO", "lines": ["Hold, ho! Lieutenant- sir- Montano- gentlemen-", "Have you forgot all place of sense and duty?", "Hold! the general speaks to you! Hold, hold, for shame!"], "id": 375, "m": "Stop! Lieutenant, sir, Montano, gentlemen! Have you forgotten all sense of rank and duty? Stop! The general is speaking to you! Stop, stop, for shame!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Why, how now, ho! from whence ariseth this?", "Are we turn'd Turks, and to ourselves do that", "Which heaven hath forbid the Ottomites?", "For Christian shame, put by this barbarous brawl.", "He that stirs next to carve for his own rage", "Holds his soul light; he dies upon his motion.", "Silence that dreadful bell; it frights the isle", "From her propriety. What is the matter, masters?", "Honest Iago, that look'st dead with grieving,", "Speak: who began this? On thy love, I charge thee."], "id": 376, "m": "Why, what's this? How did this start? Have we turned into Turks and done to ourselves what heaven stopped the Turks from doing? For the sake of Christian decency, stop this savage brawl. The next man who moves to strike out of his own anger doesn't value his life; he dies the moment he moves. Silence that terrible bell; it's scaring the island out of its wits. What's the matter, gentlemen? Honest Iago, you look dead with grief. Speak: who started this? I order you, by your loyalty."}, {"t": "sp", "who": "IAGO", "lines": ["I do not know. Friends all but now, even now,", "In quarter, and in terms like bride and groom", "Devesting them for bed; and then, but now", "(As if some planet had unwitted men),", "Swords out, and tilting one at other's breast,", "In opposition bloody. I cannot speak", "Any beginning to this peevish odds;", "And would in action glorious I had lost", "Those legs that brought me to a part of it!"], "id": 377, "m": "I don't know. Everyone was friends just a moment ago, getting along like a bride and groom undressing for bed. And then, just now, as if some planet had driven men insane, swords were out and they were lunging at each other's chests in a bloody fight. I can't tell you how this stupid quarrel began. I wish I'd lost my legs in some glorious battle rather than have them bring me here to see any part of it!"}, {"t": "sp", "who": "OTHELLO", "lines": ["How comes it, Michael, you are thus forgot?"], "id": 378, "m": "Michael, how is it that you've forgotten yourself like this?"}, {"t": "sp", "who": "CASSIO", "lines": ["I pray you, pardon me; I cannot speak."], "id": 379, "m": "Please, forgive me. I can't speak."}, {"t": "sp", "who": "OTHELLO", "lines": ["Worthy Montano, you were wont be civil;", "The gravity and stillness of your youth", "The world hath noted, and your name is great", "In mouths of wisest censure. What's the matter,", "That you unlace your reputation thus,", "And spend your rich opinion for the name", "Of a night-brawler? Give me answer to it."], "id": 380, "m": "Worthy Montano, you used to be well-behaved. The world has noticed your seriousness and calm since your youth, and the wisest judges speak highly of you. What's going on, that you throw away your reputation like this and trade your good name for that of a night-time brawler? Answer me."}, {"t": "sp", "who": "MONTANO", "lines": ["Worthy Othello, I am hurt to danger.", "Your officer, Iago, can inform you-", "While I spare speech, which something now offends me-", "Of all that I do know. Nor know I aught", "By me that's said or done amiss this night,", "Unless self-charity be sometimes a vice,", "And to defend ourselves it be a sin", "When violence assails us."], "id": 381, "m": "Worthy Othello, I'm seriously hurt. Your officer Iago can tell you everything I know, while I save my breath, since talking hurts me right now. I don't know of anything I've said or done wrong tonight, unless looking after yourself is sometimes a vice, and defending ourselves is a sin when violence attacks us."}, {"t": "sp", "who": "OTHELLO", "lines": ["Now, by heaven,", "My blood begins my safer guides to rule,", "And passion, having my best judgement collied,", "Assays to lead the way. If I once stir,", "Or do but lift this arm, the best of you", "Shall sink in my rebuke. Give me to know", "How this foul rout began, who set it on,", "And he that is approved in this offense,", "Though he had twinn'd with me, both at a birth,", "Shall lose me. What! in a town of war,", "Yet wild, the people's hearts brimful of fear,", "To manage private and domestic quarrel,", "In night, and on the court and guard of safety!", "'Tis monstrous. Iago, who began't?"], "id": 382, "m": "Now, by heaven, my temper is starting to overrule my better judgment, and anger, having clouded my reason, is trying to take over. If I move, or even lift this arm, the best of you will fall under my punishment. Tell me how this disgraceful riot started and who began it. Whoever is proven guilty, even if he were my twin brother, born at the same moment, will lose me. What? In a garrison town, still unsettled, with the people's hearts full of fear, to start a private, personal quarrel at night, at the very guard post meant to keep the peace! It's outrageous. Iago, who started it?"}, {"t": "sp", "who": "MONTANO", "lines": ["If partially affined, or leagued in office,", "Thou dost deliver more or less than truth,", "Thou art no soldier."], "id": 383, "m": "If you shade the truth one way or the other out of friendship or loyalty to a fellow officer, you're no soldier."}, {"t": "sp", "who": "IAGO", "lines": ["Touch me not so near:", "I had rather have this tongue cut from my mouth", "Than it should do offense to Michael Cassio;", "Yet, I persuade myself, to speak the truth", "Shall nothing wrong him. Thus it is, general.", "Montano and myself being in speech,", "There comes a fellow crying out for help,", "And Cassio following him with determined sword,", "To execute upon him. Sir, this gentleman", "Steps in to Cassio and entreats his pause.", "Myself the crying fellow did pursue,", "Lest by his clamor- as it so fell out-", "The town might fall in fright. He, swift of foot,", "Outran my purpose; and I return'd the rather", "For that I heard the clink and fall of swords,", "And Cassio high in oath, which till tonight", "I ne'er might say before. When I came back-", "For this was brief- I found them close together,", "At blow and thrust, even as again they were", "When you yourself did part them.", "More of this matter cannot I report.", "But men are men; the best sometimes forget.", "Though Cassio did some little wrong to him,", "As men in rage strike those that wish them best,", "Yet surely Cassio, I believe, received", "From him that fled some strange indignity,", "Which patience could not pass."], "id": 384, "m": "Don't hit me where it hurts. I'd rather have my tongue cut out than have it harm Michael Cassio. Still, I'm sure telling the truth won't hurt him. Here's what happened, general. Montano and I were talking when a man came running in shouting for help, with Cassio chasing him, sword drawn, ready to strike him. Sir, this gentleman stepped in front of Cassio and begged him to stop. I went after the screaming man so his shouting wouldn't frighten the town, which is what happened anyway. He was too fast for me, and I came back all the quicker because I heard swords clashing and Cassio swearing loudly, which I'd never heard him do before tonight. When I got back (all this happened quickly), I found them fighting at close quarters, striking and thrusting, just as they were when you yourself separated them. I can't tell you any more than that. But men are men; even the best sometimes forget themselves. Though Cassio did him some small wrong, as men in a rage strike even those who mean them well, I do believe Cassio must have received some outrageous insult from the man who ran away, something he couldn't let pass."}, {"t": "sp", "who": "OTHELLO", "lines": ["I know, Iago,", "Thy honesty and love doth mince this matter,", "Making it light to Cassio. Cassio, I love thee,", "But never more be officer of mine."], "id": 385, "m": "I know, Iago, that your honesty and affection are softening this story to make it easier on Cassio. Cassio, I love you, but you'll never be my officer again."}, {"t": "sd", "text": "Re-enter Desdemona, attended.", "id": 386}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["Look, if my gentle love be not raised up!", "I'll make thee an example."], "id": 387, "m": "Look, my gentle love has been woken up! [To Cassio.] I'll make an example of you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["What's the matter?"], "id": 388, "m": "What's the matter?"}, {"t": "sp", "who": "OTHELLO", "lines": ["All's well now, sweeting; come away to bed.", "Sir, for your hurts, myself will be your surgeon.", "Lead him off."], "id": 389, "m": "Everything's fine now, sweetheart. Come back to bed. [To Montano.] Sir, I'll personally see that your wounds are treated. Take him away."}, {"t": "sd", "text": "Exit Montano, attended.", "id": 390}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["Iago, look with care about the town,", "And silence those whom this vile brawl distracted.", "Come, Desdemona, 'tis the soldiers' life.", "To have their balmy slumbers waked with strife."], "id": 391, "m": "Iago, look carefully around the town and calm down anyone this ugly brawl has upset. Come, Desdemona. This is the soldier's life: having peaceful sleep broken by fighting."}, {"t": "sd", "text": "Exeunt all but Iago and Cassio.", "id": 392}, {"t": "sp", "who": "IAGO", "lines": ["What, are you hurt, lieutenant?"], "id": 393, "m": "What, are you hurt, lieutenant?"}, {"t": "sp", "who": "CASSIO", "lines": ["Ay, past all surgery."], "id": 394, "m": "Yes, beyond any cure."}, {"t": "sp", "who": "IAGO", "lines": ["Marry, heaven forbid!"], "id": 395, "m": "Heaven forbid!"}, {"t": "sp", "who": "CASSIO", "lines": ["Reputation, reputation, reputation! O, I have lost my", "reputation! I have lost the immortal part of myself, and what", "remains is bestial. My reputation, Iago, my reputation!"], "id": 396, "m": "Reputation, reputation, reputation! Oh, I've lost my reputation! I've lost the immortal part of myself, and what's left is animal. My reputation, Iago, my reputation!"}, {"t": "sp", "who": "IAGO", "lines": ["As I am an honest man, I thought you had received some bodily", "wound; there is more sense in that than in reputation. Reputation", "is an idle and most false imposition; oft got without merit and", "lost without deserving. You have lost no reputation at all,", "unless you repute yourself such a loser. What, man! there are", "ways to recover the general again. You are but now cast in his", "mood, a punishment more in policy than in malice; even so as one", "would beat his offenseless dog to affright an imperious lion. Sue", "to him again, and he's yours."], "id": 397, "m": "Honestly, I thought you'd been physically wounded; that matters more than reputation. Reputation is a worthless and completely false burden, often gained without merit and lost without deserving it. You haven't lost any reputation at all unless you think of yourself as having lost it. Come on, man! There are ways to win the general back. He's just dismissed you in a bad mood, a punishment more for show than out of anger, the way someone beats his innocent dog to scare off a threatening lion. Appeal to him again, and he's yours."}, {"t": "sp", "who": "CASSIO", "lines": ["I will rather sue to be despised than to deceive so good a", "commander with so slight, so drunken, and so indiscreet an", "officer. Drunk? and speak parrot? and squabble? swagger? swear?", "and discourse fustian with one's own shadow? O thou invisible", "spirit of wine, if thou hast no name to be known by, let us call", "thee devil!"], "id": 398, "m": "I'd rather ask to be despised than trick such a good commander into keeping such a worthless, drunken, reckless officer. Drunk? Babbling like a parrot? Squabbling, swaggering, swearing, ranting nonsense at my own shadow? Oh, you invisible spirit of wine, if you don't have a name yet, let's call you devil!"}, {"t": "sp", "who": "IAGO", "lines": ["What was he that you followed with your sword?", "What had he done to you?"], "id": 399, "m": "Who was the man you chased with your sword? What had he done to you?"}, {"t": "sp", "who": "CASSIO", "lines": ["I know not."], "id": 400, "m": "I don't know."}, {"t": "sp", "who": "IAGO", "lines": ["Is't possible?"], "id": 401, "m": "Is that possible?"}, {"t": "sp", "who": "CASSIO", "lines": ["I remember a mass of things, but nothing distinctly; a", "quarrel, but nothing wherefore. O God, that men should put an", "enemy in their mouths to steal away their brains! that we should,", "with joy, pleasance, revel, and applause, transform ourselves", "into beasts!"], "id": 402, "m": "I remember a jumble of things, but nothing clearly. A quarrel, but not what it was about. Oh God, that men should put an enemy in their mouths to steal their brains! That we should turn ourselves into animals with joy, pleasure, partying, and applause!"}, {"t": "sp", "who": "IAGO", "lines": ["Why, but you are now well enough. How came you thus", "recovered?"], "id": 403, "m": "But you seem fine now. How did you recover so quickly?"}, {"t": "sp", "who": "CASSIO", "lines": ["It hath pleased the devil drunkenness to give place to the", "devil wrath: one unperfectness shows me another, to make me", "frankly despise myself."], "id": 404, "m": "The devil Drunkenness was kind enough to make way for the devil Anger. One flaw shows me another, so I can thoroughly despise myself."}, {"t": "sp", "who": "IAGO", "lines": ["Come, you are too severe a moraler. As the time, the place,", "and the condition of this country stands, I could heartily wish", "this had not befallen; but since it is as it is, mend it for your", "own good."], "id": 405, "m": "Come on, you're being too hard on yourself. Given the time, the place, and the state this country is in, I sincerely wish this hadn't happened. But since it has, fix it for your own good."}, {"t": "sp", "who": "CASSIO", "lines": ["I will ask him for my place again; he shall tell me I am a", "drunkard! Had I as many mouths as Hydra, such an answer would", "stop them all. To be now a sensible man, by and by a fool, and", "presently a beast! O strange! Every inordinate cup is unblest,", "and the ingredient is a devil."], "id": 406, "m": "If I ask him to give me my job back, he'll tell me I'm a drunk! If I had as many mouths as the Hydra, that answer would shut them all. To be a sensible man one moment, then a fool, and then an animal! How strange! Every cup too many is cursed, and what's in it is a devil."}, {"t": "sp", "who": "IAGO", "lines": ["Come, come, good wine is a good familiar creature, if it be", "well used. Exclaim no more against it. And, good lieutenant, I", "think you think I love you."], "id": 407, "m": "Come on, come on. Good wine is a good friend if it's used well. Stop complaining about it. And, good lieutenant, I think you know I care about you."}, {"t": "sp", "who": "CASSIO", "lines": ["I have well approved it, sir. I drunk!"], "id": 408, "m": "I've seen proof of it, sir. Me, drunk!"}, {"t": "sp", "who": "IAGO", "lines": ["You or any man living may be drunk at some time, man. I'll", "tell you what you shall do. Our general's wife is now the", "general. I may say so in this respect, for that he hath devoted", "and given up himself to the contemplation, mark, and denotement", "of her parts and graces. Confess yourself freely to her;", "importune her help to put you in your place again. She is of so", "free, so kind, so apt, so blessed a disposition, she holds it a", "vice in her goodness not to do more than she is requested. This", "broken joint between you and her husband entreat her to splinter;", "and, my fortunes against any lay worth naming, this crack of your", "love shall grow stronger than it was before."], "id": 409, "m": "You or any man alive can get drunk sometimes, man. I'll tell you what to do. Our general's wife is now the general. I can say that because he has devoted himself completely to admiring and studying her qualities and charms. Confess everything to her. Beg her to help you get your job back. She's so generous, so kind, so willing, so good-natured that she thinks it's a fault in her goodness not to do more than she's asked. Ask her to set this broken bone between you and her husband, and I'll bet everything I have that this crack in your friendship will heal stronger than before."}, {"t": "sp", "who": "CASSIO", "lines": ["You advise me well."], "id": 410, "m": "That's good advice."}, {"t": "sp", "who": "IAGO", "lines": ["I protest, in the sincerity of love and honest kindness."], "id": 411, "m": "I swear it's given with sincere friendship and honest kindness."}, {"t": "sp", "who": "CASSIO", "lines": ["I think it freely; and betimes in the morning I will beseech", "the virtuous Desdemona to undertake for me. I am desperate of my", "fortunes if they check me here."], "id": 412, "m": "I believe that completely. Early in the morning I'll beg the virtuous Desdemona to take up my case. My career is hopeless if it's stopped here."}, {"t": "sp", "who": "IAGO", "lines": ["You are in the right. Good night, lieutenant, I must to the", "watch."], "id": 413, "m": "You're right. Good night, lieutenant. I have to go keep watch."}, {"t": "sp", "who": "CASSIO", "lines": ["Good night, honest Iago."], "id": 414, "m": "Good night, honest Iago."}, {"t": "sd", "text": "Exit.", "id": 415}, {"t": "sp", "who": "IAGO", "lines": ["And what's he then that says I play the villain?", "When this advice is free I give and honest,", "Probal to thinking, and indeed the course", "To win the Moor again? For 'tis most easy", "The inclining Desdemona to subdue", "In any honest suit. She's framed as fruitful", "As the free elements. And then for her", "To win the Moor, were't to renounce his baptism,", "All seals and symbols of redeemed sin,", "His soul is so enfetter'd to her love,", "That she may make, unmake, do what she list,", "Even as her appetite shall play the god", "With his weak function. How am I then a villain", "To counsel Cassio to this parallel course,", "Directly to his good? Divinity of hell!", "When devils will the blackest sins put on,", "They do suggest at first with heavenly shows,", "As I do now. For whiles this honest fool", "Plies Desdemona to repair his fortune,", "And she for him pleads strongly to the Moor,", "I'll pour this pestilence into his ear,", "That she repeals him for her body's lust;", "And by how much she strives to do him good,", "She shall undo her credit with the Moor.", "So will I turn her virtue into pitch,", "And out of her own goodness make the net", "That shall enmesh them all."], "id": 416, "m": "So who can say I'm playing the villain, when the advice I give is free and honest, reasonable, and really the way to win the Moor back? Because it's very easy to get the willing Desdemona to support any honest request. She's as generous as the free elements. And it's just as easy for her to win over the Moor; even if it meant renouncing his baptism and every sign and symbol of his salvation, his soul is so chained to his love for her that she can make, unmake, or do whatever she likes with him, as her desire plays god over his weak will. So how am I a villain for advising Cassio to take this path, which leads straight to his own good? The theology of hell! When devils want to commit the blackest sins, they first tempt with heavenly appearances, as I'm doing now. Because while this honest fool begs Desdemona to fix his fortunes, and she pleads hard for him with the Moor, I'll pour this poison into the Moor's ear: that she wants Cassio back because she lusts for him. And the harder she tries to help Cassio, the more she'll destroy the Moor's trust in her. That's how I'll turn her goodness into tar, and from her own kindness make the net that will catch them all."}, {"t": "sd", "text": "Enter Roderigo.", "id": 417}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["How now, Roderigo!"], "id": 418, "m": "Hello, Roderigo!"}, {"t": "sp", "who": "RODERIGO", "lines": ["I do follow here in the chase, not like a hound that", "hunts, but one that fills up the cry. My money is almost spent; I", "have been tonight exceedingly well cudgeled; and I think the", "issue will be, I shall have so much experience for my pains; and", "so, with no money at all and a little more wit, return again to", "Venice."], "id": 419, "m": "I'm following along in this hunt not as a hound that's actually hunting, but as one that just adds to the barking. My money is almost gone. I've been thoroughly beaten tonight. And I think the result will be that I'll get some experience for my trouble, and then go back to Venice with no money and a little more sense."}, {"t": "sp", "who": "IAGO", "lines": ["How poor are they that have not patience!", "What wound did ever heal but by degrees?", "Thou know'st we work by wit and not by witchcraft,", "And wit depends on dilatory time.", "Does't not go well? Cassio hath beaten thee,", "And thou by that small hurt hast cashier'd Cassio.", "Though other things grow fair against the sun,", "Yet fruits that blossom first will first be ripe.", "Content thyself awhile. By the mass, 'tis morning;", "Pleasure and action make the hours seem short.", "Retire thee; go where thou art billeted.", "Away, I say. Thou shalt know more hereafter.", "Nay, get thee gone. [Exit Roderigo.] Two things are to be done:", "My wife must move for Cassio to her mistress-", "I'll set her on;", "Myself the while to draw the Moor apart,", "And bring him jump when he may Cassio find", "Soliciting his wife. Ay, that's the way;", "Dull not device by coldness and delay."], "id": 420, "m": "How poor are those who have no patience! What wound ever healed except gradually? You know we work with brains and not with witchcraft, and brains have to wait for the right time. Isn't it going well? Cassio beat you, and with that small injury you've gotten Cassio fired. Other things may grow well in the sun, but the fruits that blossom first will ripen first. Be patient for a while. By God, it's morning. Pleasure and action make the hours fly by. Go away, go to where you're staying. Go, I said. You'll find out more later. No, get out of here. [Roderigo leaves.] Two things need to be done. My wife has to plead for Cassio with her mistress; I'll get her to do it. Meanwhile I'll draw the Moor aside and bring him in at exactly the moment he can find Cassio pleading with his wife. Yes, that's the way. Don't let the plan go stale through hesitation and delay."}, {"t": "sd", "text": "Exit.", "id": 421}, {"t": "scene", "act": 3, "scene": "I", "loc": "Before the castle.", "id": 422}, {"t": "sd", "text": "Enter Cassio and some Musicians.", "id": 423}, {"t": "sp", "who": "CASSIO", "lines": ["Masters, play here, I will content your pains; Something", "that's brief; and bid \"Good morrow, general.\"", "Music."], "id": 424, "m": "Gentlemen, play here; I'll pay you for your trouble. Something short, and wish the general \"Good morning.\" [Music.]"}, {"t": "sd", "text": "Enter Clown.", "id": 425}, {"t": "sp", "who": "CLOWN", "lines": ["Why, masters, have your instruments been in Naples, that", "they speak i' the nose thus?"], "id": 426, "m": "Well, gentlemen, have your instruments been to Naples, that they sound so nasal?"}, {"t": "sp", "who": "FIRST MUSICIAN", "lines": ["How, sir, how?"], "id": 427, "m": "What's that, sir?"}, {"t": "sp", "who": "CLOWN", "lines": ["Are these, I pray you, wind instruments?"], "id": 428, "m": "Are these, may I ask, wind instruments?"}, {"t": "sp", "who": "FIRST MUSICIAN", "lines": ["Ay, marry, are they, sir."], "id": 429, "m": "Yes, indeed they are, sir."}, {"t": "sp", "who": "CLOWN", "lines": ["O, thereby hangs a tail."], "id": 430, "m": "Oh, so that's where the tail hangs."}, {"t": "sp", "who": "FIRST MUSICIAN", "lines": ["Whereby hangs a tale, sir?"], "id": 431, "m": "Where hangs a tale, sir?"}, {"t": "sp", "who": "CLOWN", "lines": ["Marry, sir, by many a wind instrument that I know. But,", "masters, here's money for you; and the general so likes your", "music, that he desires you, for love's sake, to make no more", "noise with it."], "id": 432, "m": "Why, sir, by many a wind instrument I know of. But, gentlemen, here's some money for you. The general likes your music so much that he asks you, for love's sake, to stop making noise with it."}, {"t": "sp", "who": "FIRST MUSICIAN", "lines": ["Well, sir, we will not."], "id": 433, "m": "All right, sir, we'll stop."}, {"t": "sp", "who": "CLOWN", "lines": ["If you have any music that may not be heard, to't again;", "but, as they say, to hear music the general does not greatly", "care."], "id": 434, "m": "If you have any music that can't be heard, go ahead and play it. But, as they say, the general doesn't much care to hear music."}, {"t": "sp", "who": "FIRST MUSICIAN", "lines": ["We have none such, sir."], "id": 435, "m": "We don't have any like that, sir."}, {"t": "sp", "who": "CLOWN", "lines": ["Then put up your pipes in your bag, for I'll away.", "Go, vanish into air, away!"], "id": 436, "m": "Then put your pipes back in your bag, because I'm leaving. Go, vanish into thin air, away!"}, {"t": "sd", "text": "Exeunt Musicians.", "id": 437}, {"t": "sp", "who": "CASSIO", "lines": ["Dost thou hear, my honest friend?"], "id": 438, "m": "Do you hear me, my honest friend?"}, {"t": "sp", "who": "CLOWN", "lines": ["No, I hear not your honest friend; I hear you."], "id": 439, "m": "No, I don't hear your honest friend; I hear you."}, {"t": "sp", "who": "CASSIO", "lines": ["Prithee, keep up thy quillets. There's a poor piece of gold", "for thee. If the gentlewoman that attends the general's wife be", "stirring, tell her there's one Cassio entreats her a little favor", "of speech. Wilt thou do this?"], "id": 440, "m": "Please, enough of your wordplay. Here's a small gold coin for you. If the lady who attends the general's wife is up, tell her that someone named Cassio asks the favor of a word with her. Will you do this?"}, {"t": "sp", "who": "CLOWN", "lines": ["She is stirring, sir. If she will stir hither, I shall seem", "to notify unto her."], "id": 441, "m": "She's up, sir. If she'll come down here, I'll see about letting her know."}, {"t": "sp", "who": "CASSIO", "lines": ["Do, good my friend."], "id": 442, "m": "Do, my good friend."}, {"t": "sd", "text": "Exit Clown.", "id": 443}, {"t": "sd", "text": "Enter Iago.", "id": 444}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["In happy time, Iago."], "id": 445, "m": "Good timing, Iago."}, {"t": "sp", "who": "IAGO", "lines": ["You have not been abed, then?"], "id": 446, "m": "You haven't been to bed, then?"}, {"t": "sp", "who": "CASSIO", "lines": ["Why, no; the day had broke", "Before we parted. I have made bold, Iago,", "To send in to your wife. My suit to her", "Is that she will to virtuous Desdemona", "Procure me some access."], "id": 447, "m": "Why, no. The sun was up before we split up. I've taken the liberty, Iago, of sending for your wife. I want to ask her to get me a chance to speak to virtuous Desdemona."}, {"t": "sp", "who": "IAGO", "lines": ["I'll send her to you presently;", "And I'll devise a mean to draw the Moor", "Out of the way, that your converse and business", "May be more free."], "id": 448, "m": "I'll send her to you right away. And I'll come up with a way to get the Moor out of the way, so you two can talk business more freely."}, {"t": "sp", "who": "CASSIO", "lines": ["I humbly thank you for't. [Exit Iago.] I never knew", "A Florentine more kind and honest."], "id": 449, "m": "Thank you very much. [Iago leaves.] I never knew a Florentine more kind and honest."}, {"t": "sd", "text": "Enter Emilia.", "id": 450}, {"t": "sp", "who": "EMILIA", "lines": ["Good morrow, good lieutenant. I am sorry", "For your displeasure, but all will sure be well.", "The general and his wife are talking of it,", "And she speaks for you stoutly. The Moor replies", "That he you hurt is of great fame in Cyprus", "And great affinity and that in wholesome wisdom", "He might not but refuse you; but he protests he loves you", "And needs no other suitor but his likings", "To take the safest occasion by the front", "To bring you in again."], "id": 451, "m": "Good morning, good lieutenant. I'm sorry you're out of favor, but I'm sure everything will be fine. The general and his wife are talking about it, and she's defending you strongly. The Moor says the man you injured is well known in Cyprus and well connected, and that the wise thing was to dismiss you. But he insists he cares for you, and needs no one to plead for you but his own affection to take the first safe chance to bring you back."}, {"t": "sp", "who": "CASSIO", "lines": ["Yet, I beseech you,", "If you think fit, or that it may be done,", "Give me advantage of some brief discourse", "With Desdemona alone."], "id": 452, "m": "Still, please, if you think it's appropriate and it can be done, let me have a short private talk with Desdemona."}, {"t": "sp", "who": "EMILIA", "lines": ["Pray you, come in.", "I will bestow you where you shall have time", "To speak your bosom freely."], "id": 453, "m": "Please come in. I'll put you somewhere you'll have time to speak your mind freely."}, {"t": "sp", "who": "CASSIO", "lines": ["I am much bound to you.", "[Exeunt.]"], "id": 454, "m": "I'm very grateful to you. [They leave.]"}, {"t": "scene", "act": 3, "scene": "II", "loc": "A room in the castle.", "id": 455}, {"t": "sd", "text": "Enter Othello, Iago, and Gentlemen.", "id": 456}, {"t": "sp", "who": "OTHELLO", "lines": ["These letters give, Iago, to the pilot,", "And by him do my duties to the Senate.", "That done, I will be walking on the works;", "Repair there to me."], "id": 457, "m": "Iago, give these letters to the ship's pilot and have him send my respects to the Senate. When that's done, I'll be walking on the fortifications. Meet me there."}, {"t": "sp", "who": "IAGO", "lines": ["Well, my good lord, I'll do't."], "id": 458, "m": "Very well, my good lord, I'll do it."}, {"t": "sp", "who": "OTHELLO", "lines": ["This fortification, gentlemen, shall we see't?"], "id": 459, "m": "Gentlemen, shall we go see the fortifications?"}, {"t": "sp", "who": "GENTLEMEN", "lines": ["We'll wait upon your lordship."], "id": 460, "m": "We'll accompany you, my lord."}, {"t": "sd", "text": "Exeunt.", "id": 461}, {"t": "scene", "act": 3, "scene": "III", "loc": "The garden of the castle.", "id": 462}, {"t": "sd", "text": "Enter Desdemona, Cassio, and Emilia.", "id": 463}, {"t": "sp", "who": "DESDEMONA", "lines": ["Be thou assured, good Cassio, I will do", "All my abilities in thy behalf."], "id": 464, "m": "Rest assured, good Cassio, I'll do everything I can for you."}, {"t": "sp", "who": "EMILIA", "lines": ["Good madam, do. I warrant it grieves my husband", "As if the cause were his."], "id": 465, "m": "Please do, madam. I promise you it upsets my husband as if it were his own problem."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, that's an honest fellow. Do not doubt, Cassio,", "But I will have my lord and you again", "As friendly as you were."], "id": 466, "m": "Oh, he's an honest man. Don't doubt it, Cassio: I'll make you and my husband as friendly as you were before."}, {"t": "sp", "who": "CASSIO", "lines": ["Bounteous madam,", "Whatever shall become of Michael Cassio,", "He's never anything but your true servant."], "id": 467, "m": "Generous madam, whatever happens to Michael Cassio, he'll always be your true servant."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I know't: I thank you. You do love my lord:", "You have known him long; and be you well assured", "He shall in strangeness stand no farther off", "Than in a politic distance."], "id": 468, "m": "I know it, and I thank you. You love my husband. You've known him a long time. And rest assured, he'll keep his distance from you only as long as is politically necessary."}, {"t": "sp", "who": "CASSIO", "lines": ["Ay, but, lady,", "That policy may either last so long,", "Or feed upon such nice and waterish diet,", "Or breed itself so out of circumstances,", "That I being absent and my place supplied,", "My general will forget my love and service."], "id": 469, "m": "Yes, but, lady, that policy might last so long, or survive on such trivial excuses, or keep finding new reasons, that with me gone and my job filled, my general will forget my love and service."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Do not doubt that. Before Emilia here", "I give thee warrant of thy place, assure thee,", "If I do vow a friendship, I'll perform it", "To the last article. My lord shall never rest;", "I'll watch him tame and talk him out of patience;", "His bed shall seem a school, his board a shrift;", "I'll intermingle everything he does", "With Cassio's suit. Therefore be merry, Cassio,", "For thy solicitor shall rather die", "Than give thy cause away."], "id": 470, "m": "Don't worry about that. With Emilia here as witness, I guarantee you'll get your position back. I promise you, if I swear friendship, I'll keep it to the letter. My husband will never get any rest. I'll keep him awake until he gives in, and talk until he runs out of patience. His bed will feel like a school and his dinner table like a confessional. I'll mix Cassio's case into everything he does. So cheer up, Cassio, because your advocate would rather die than give up on you."}, {"t": "sd", "text": "Enter Othello and Iago, at a distance.", "id": 471}, {"t": "sp", "who": "EMILIA", "lines": ["Madam, here comes my lord."], "id": 472, "m": "Madam, here comes my husband."}, {"t": "sp", "who": "CASSIO", "lines": ["Madam, I'll take my leave."], "id": 473, "m": "Madam, I'll go."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Nay, stay and hear me speak."], "id": 474, "m": "No, stay and listen to me speak for you."}, {"t": "sp", "who": "CASSIO", "lines": ["Madam, not now. I am very ill at ease,", "Unfit for mine own purposes."], "id": 475, "m": "Madam, not now. I'm very uncomfortable, and not in a state to plead my own case."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Well, do your discretion."], "id": 476, "m": "Well, do what you think best."}, {"t": "sd", "text": "Exit Cassio.", "id": 477}, {"t": "sp", "who": "IAGO", "lines": ["Ha! I like not that."], "id": 478, "m": "Ha! I don't like that."}, {"t": "sp", "who": "OTHELLO", "lines": ["What dost thou say?"], "id": 479, "m": "What did you say?"}, {"t": "sp", "who": "IAGO", "lines": ["Nothing, my lord; or if- I know not what."], "id": 480, "m": "Nothing, my lord. Or if... I don't know."}, {"t": "sp", "who": "OTHELLO", "lines": ["Was not that Cassio parted from my wife?"], "id": 481, "m": "Wasn't that Cassio who just left my wife?"}, {"t": "sp", "who": "IAGO", "lines": ["Cassio, my lord! No, sure, I cannot think it,", "That he would steal away so guilty-like,", "Seeing you coming."], "id": 482, "m": "Cassio, my lord? No, surely not. I can't believe he'd sneak away so guiltily when he saw you coming."}, {"t": "sp", "who": "OTHELLO", "lines": ["I do believe 'twas he."], "id": 483, "m": "I do think it was him."}, {"t": "sp", "who": "DESDEMONA", "lines": ["How now, my lord!", "I have been talking with a suitor here,", "A man that languishes in your displeasure."], "id": 484, "m": "Hello, my lord! I've been talking with someone with a request, a man who's suffering because you're displeased with him."}, {"t": "sp", "who": "OTHELLO", "lines": ["Who is't you mean?"], "id": 485, "m": "Who do you mean?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why, your lieutenant, Cassio. Good my lord,", "If I have any grace or power to move you,", "His present reconciliation take;", "For if he be not one that truly loves you,", "That errs in ignorance and not in cunning,", "I have no judgement in an honest face.", "I prithee, call him back."], "id": 486, "m": "Why, your lieutenant, Cassio. My good lord, if I have any charm or power to persuade you, make up with him now. Because if he isn't someone who truly loves you, who made a mistake out of ignorance and not on purpose, then I can't judge an honest face. Please, call him back."}, {"t": "sp", "who": "OTHELLO", "lines": ["Went he hence now?"], "id": 487, "m": "Did he just leave?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Ay, sooth; so humbled", "That he hath left part of his grief with me", "To suffer with him. Good love, call him back."], "id": 488, "m": "Yes, truly, and so humbled that he's left part of his grief with me to suffer along with him. My love, call him back."}, {"t": "sp", "who": "OTHELLO", "lines": ["Not now, sweet Desdemona; some other time."], "id": 489, "m": "Not now, sweet Desdemona. Some other time."}, {"t": "sp", "who": "DESDEMONA", "lines": ["But shall't be shortly?"], "id": 490, "m": "But will it be soon?"}, {"t": "sp", "who": "OTHELLO", "lines": ["The sooner, sweet, for you."], "id": 491, "m": "As soon as possible, sweet, for your sake."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Shall't be tonight at supper?"], "id": 492, "m": "Will it be tonight at supper?"}, {"t": "sp", "who": "OTHELLO", "lines": ["No, not tonight."], "id": 493, "m": "No, not tonight."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Tomorrow dinner then?"], "id": 494, "m": "Tomorrow at lunch, then?"}, {"t": "sp", "who": "OTHELLO", "lines": ["I shall not dine at home;", "I meet the captains at the citadel."], "id": 495, "m": "I won't be eating at home. I'm meeting the captains at the fort."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why then tomorrow night, or Tuesday morn,", "On Tuesday noon, or night, on Wednesday morn.", "I prithee, name the time, but let it not", "Exceed three days. In faith, he's penitent;", "And yet his trespass, in our common reason-", "Save that, they say, the wars must make example", "Out of their best- is not almost a fault", "To incur a private check. When shall he come?", "Tell me, Othello. I wonder in my soul,", "What you would ask me, that I should deny,", "Or stand so mammering on. What? Michael Cassio,", "That came awooing with you, and so many a time", "When I have spoke of you dispraisingly", "Hath ta'en your part- to have so much to do", "To bring him in! Trust me, I could do much-"], "id": 496, "m": "Then tomorrow night, or Tuesday morning, or Tuesday noon, or night, or Wednesday morning. Please name the time, but don't let it be more than three days. Honestly, he's sorry. And by ordinary standards his offense (except that they say in wartime you have to make an example of the best men) is hardly a fault worth even a private scolding. When can he come? Tell me, Othello. I really wonder what you could ask of me that I'd refuse, or hesitate over like this. What? Michael Cassio, who came with you when you were courting me, and who so many times took your side when I criticized you? And to have to work this hard to bring him back! Believe me, I could do a lot more—"}, {"t": "sp", "who": "OTHELLO", "lines": ["Prithee, no more. Let him come when he will;", "I will deny thee nothing."], "id": 497, "m": "Please, no more. Let him come whenever he wants. I won't refuse you anything."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why, this is not a boon;", "'Tis as I should entreat you wear your gloves,", "Or feed on nourishing dishes, or keep you warm,", "Or sue to you to do a peculiar profit", "To your own person. Nay, when I have a suit", "Wherein I mean to touch your love indeed,", "It shall be full of poise and difficult weight,", "And fearful to be granted."], "id": 498, "m": "Why, this isn't a favor. It's like asking you to wear your gloves, or eat healthy food, or keep warm, or begging you to do something good for yourself. No, when I have a request that really tests your love, it'll be serious and difficult, and risky to grant."}, {"t": "sp", "who": "OTHELLO", "lines": ["I will deny thee nothing,", "Whereon, I do beseech thee, grant me this,", "To leave me but a little to myself."], "id": 499, "m": "I won't refuse you anything. And in return, please grant me this: leave me alone for a little while."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Shall I deny you? No. Farewell, my lord."], "id": 500, "m": "Would I refuse you? No. Goodbye, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["Farewell, my Desdemona; I'll come to thee straight."], "id": 501, "m": "Goodbye, my Desdemona. I'll come to you soon."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Emilia, come. Be as your fancies teach you;", "Whate'er you be, I am obedient."], "id": 502, "m": "Emilia, come. Do whatever you feel like; whatever you do, I'll obey."}, {"t": "sd", "text": "Exeunt Desdemona and Emilia.", "id": 503}, {"t": "sp", "who": "OTHELLO", "lines": ["Excellent wretch! Perdition catch my soul,", "But I do love thee! and when I love thee not,", "Chaos is come again."], "id": 504, "m": "Wonderful creature! Let my soul be damned if I don't love you! And when I stop loving you, the world will return to chaos."}, {"t": "sp", "who": "IAGO", "lines": ["My noble lord-"], "id": 505, "m": "My noble lord—"}, {"t": "sp", "who": "OTHELLO", "lines": ["What dost thou say, Iago?"], "id": 506, "m": "What is it, Iago?"}, {"t": "sp", "who": "IAGO", "lines": ["Did Michael Cassio, when you woo'd my lady,", "Know of your love?"], "id": 507, "m": "When you were courting my lady, did Michael Cassio know about your love?"}, {"t": "sp", "who": "OTHELLO", "lines": ["He did, from first to last. Why dost thou ask?"], "id": 508, "m": "He did, from beginning to end. Why do you ask?"}, {"t": "sp", "who": "IAGO", "lines": ["But for a satisfaction of my thought;", "No further harm."], "id": 509, "m": "Just to satisfy a thought of mine. No other reason."}, {"t": "sp", "who": "OTHELLO", "lines": ["Why of thy thought, Iago?"], "id": 510, "m": "What thought, Iago?"}, {"t": "sp", "who": "IAGO", "lines": ["I did not think he had been acquainted with her."], "id": 511, "m": "I didn't think he knew her."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, yes, and went between us very oft."], "id": 512, "m": "Oh, yes, and he carried messages between us very often."}, {"t": "sp", "who": "IAGO", "lines": ["Indeed!"], "id": 513, "m": "Really!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Indeed? ay, indeed. Discern'st thou aught in that?", "Is he not honest?"], "id": 514, "m": "Really? Yes, really. Do you see something in that? Isn't he honest?"}, {"t": "sp", "who": "IAGO", "lines": ["Honest, my lord?"], "id": 515, "m": "Honest, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Honest? Ay, honest."], "id": 516, "m": "Honest? Yes, honest."}, {"t": "sp", "who": "IAGO", "lines": ["My lord, for aught I know."], "id": 517, "m": "My lord, as far as I know."}, {"t": "sp", "who": "OTHELLO", "lines": ["What dost thou think?"], "id": 518, "m": "What are you thinking?"}, {"t": "sp", "who": "IAGO", "lines": ["Think, my lord?"], "id": 519, "m": "Thinking, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Think, my lord? By heaven, he echoes me,", "As if there were some monster in his thought", "Too hideous to be shown. Thou dost mean something.", "I heard thee say even now, thou like'st not that,", "When Cassio left my wife. What didst not like?", "And when I told thee he was of my counsel", "In my whole course of wooing, thou criedst, \"Indeed!\"", "And didst contract and purse thy brow together,", "As if thou then hadst shut up in thy brain", "Some horrible conceit. If thou dost love me,", "Show me thy thought."], "id": 520, "m": "\"Thinking, my lord?\" By heaven, he echoes me, as if there were some monster in his mind too hideous to show. You mean something. I heard you say just now that you didn't like it when Cassio left my wife. What didn't you like? And when I told you he was in my confidence during my whole courtship, you said, \"Really!\" and frowned and wrinkled your brow, as if you'd locked some horrible idea in your brain. If you love me, tell me what you're thinking."}, {"t": "sp", "who": "IAGO", "lines": ["My lord, you know I love you."], "id": 521, "m": "My lord, you know I love you."}, {"t": "sp", "who": "OTHELLO", "lines": ["I think thou dost;", "And for I know thou'rt full of love and honesty", "And weigh'st thy words before thou givest them breath,", "Therefore these stops of thine fright me the more;", "For such things in a false disloyal knave", "Are tricks of custom; but in a man that's just", "They're close dilations, working from the heart,", "That passion cannot rule."], "id": 522, "m": "I think you do. And because I know you're full of love and honesty, and weigh your words before you say them, these pauses of yours frighten me all the more. In a lying, disloyal villain, things like this are just habitual tricks. But in an honest man, they're secret signals coming from the heart, which feelings can't control."}, {"t": "sp", "who": "IAGO", "lines": ["For Michael Cassio,", "I dare be sworn I think that he is honest."], "id": 523, "m": "As for Michael Cassio, I'd swear I think he's honest."}, {"t": "sp", "who": "OTHELLO", "lines": ["I think so too."], "id": 524, "m": "I think so too."}, {"t": "sp", "who": "IAGO", "lines": ["Men should be what they seem;", "Or those that be not, would they might seem none!"], "id": 525, "m": "Men should be what they seem. Or those who aren't honest, I wish they wouldn't look like it!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Certain, men should be what they seem."], "id": 526, "m": "Certainly, men should be what they seem."}, {"t": "sp", "who": "IAGO", "lines": ["Why then I think Cassio's an honest man."], "id": 527, "m": "Well then, I think Cassio is an honest man."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nay, yet there's more in this.", "I prithee, speak to me as to thy thinkings,", "As thou dost ruminate, and give thy worst of thoughts", "The worst of words."], "id": 528, "m": "No, there's more to this. Please tell me what you're thinking, as you're turning it over, and put your worst thoughts into your worst words."}, {"t": "sp", "who": "IAGO", "lines": ["Good my lord, pardon me;", "Though I am bound to every act of duty,", "I am not bound to that all slaves are free to.", "Utter my thoughts? Why, say they are vile and false;", "As where's that palace whereinto foul things", "Sometimes intrude not? Who has a breast so pure,", "But some uncleanly apprehensions", "Keep leets and law-days, and in session sit", "With meditations lawful?"], "id": 529, "m": "My good lord, forgive me. Though I'm bound to perform every duty, I'm not bound to do what even slaves aren't required to do. Speak my thoughts? Why, suppose they're vile and false? After all, where's the palace that dirty things don't sometimes get into? Who has a heart so pure that some unclean suspicions don't hold court there and sit in judgment alongside fair thoughts?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Thou dost conspire against thy friend, Iago,", "If thou but think'st him wrong'd and makest his ear", "A stranger to thy thoughts."], "id": 530, "m": "You're betraying your friend, Iago, if you even think he's been wronged and you keep your thoughts from him."}, {"t": "sp", "who": "IAGO", "lines": ["I do beseech you-", "Though I perchance am vicious in my guess,", "As, I confess, it is my nature's plague", "To spy into abuses, and oft my jealousy", "Shapes faults that are not- that your wisdom yet,", "From one that so imperfectly conceits,", "Would take no notice, nor build yourself a trouble", "Out of his scattering and unsure observance.", "It were not for your quiet nor your good,", "Nor for my manhood, honesty, or wisdom,", "To let you know my thoughts."], "id": 531, "m": "I beg you, since I may be wrong in my guess (I admit it's a curse of my nature to look for wrongdoing, and my suspicion often invents faults that aren't there), that your wisdom ignore someone whose ideas are so unreliable, and not create trouble for yourself out of my scattered, uncertain observations. It wouldn't be good for your peace of mind or your well-being, or for my manhood, honesty, or wisdom, to tell you what I'm thinking."}, {"t": "sp", "who": "OTHELLO", "lines": ["What dost thou mean?"], "id": 532, "m": "What do you mean?"}, {"t": "sp", "who": "IAGO", "lines": ["Good name in man and woman, dear my lord,", "Is the immediate jewel of their souls.", "Who steals my purse steals trash; 'tis something, nothing;", "'Twas mine, 'tis his, and has been slave to thousands;", "But he that filches from me my good name", "Robs me of that which not enriches him", "And makes me poor indeed."], "id": 533, "m": "A good reputation, for a man or a woman, my dear lord, is the most precious jewel of their souls. Whoever steals my wallet steals trash. It's something, yet nothing; it was mine, now it's his, and it's been owned by thousands. But whoever steals my good name takes something that doesn't make him any richer and leaves me truly poor."}, {"t": "sp", "who": "OTHELLO", "lines": ["By heaven, I'll know thy thoughts."], "id": 534, "m": "By heaven, I'll know what you're thinking."}, {"t": "sp", "who": "IAGO", "lines": ["You cannot, if my heart were in your hand;", "Nor shall not, whilst 'tis in my custody."], "id": 535, "m": "You can't, even if you held my heart in your hand. And you won't, as long as it's in my keeping."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ha!"], "id": 536, "m": "Ha!"}, {"t": "sp", "who": "IAGO", "lines": ["O, beware, my lord, of jealousy!", "It is the green-eyed monster, which doth mock", "The meat it feeds on. That cuckold lives in bliss", "Who, certain of his fate, loves not his wronger;", "But O, what damned minutes tells he o'er", "Who dotes, yet doubts, suspects, yet strongly loves!"], "id": 537, "m": "Oh, beware of jealousy, my lord! It's the green-eyed monster that mocks the very food it feeds on. The husband whose wife cheats on him is happy if he knows the truth and doesn't love the woman who betrays him. But oh, what damned minutes a man counts out who adores his wife yet doubts her, suspects her yet loves her deeply!"}, {"t": "sp", "who": "OTHELLO", "lines": ["O misery!"], "id": 538, "m": "Oh, misery!"}, {"t": "sp", "who": "IAGO", "lines": ["Poor and content is rich, and rich enough;", "But riches fineless is as poor as winter", "To him that ever fears he shall be poor.", "Good heaven, the souls of all my tribe defend", "From jealousy!"], "id": 539, "m": "A man who's poor and content is rich, and rich enough. But endless riches are as poor as winter to a man who's always afraid he'll become poor. Good heaven, protect the souls of all my kind from jealousy!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Why, why is this?", "Think'st thou I'ld make a life of jealousy,", "To follow still the changes of the moon", "With fresh suspicions? No! To be once in doubt", "Is once to be resolved. Exchange me for a goat", "When I shall turn the business of my soul", "To such exsufflicate and blown surmises,", "Matching thy inference. 'Tis not to make me jealous", "To say my wife is fair, feeds well, loves company,", "Is free of speech, sings, plays, and dances well;", "Where virtue is, these are more virtuous.", "Nor from mine own weak merits will I draw", "The smallest fear or doubt of her revolt;", "For she had eyes and chose me. No, Iago,", "I'll see before I doubt; when I doubt, prove;", "And on the proof, there is no more but this-", "Away at once with love or jealousy!"], "id": 540, "m": "Why, why are you saying this? Do you think I'd live a life of jealousy, changing my suspicions with every phase of the moon? No! Once I'm in doubt, I'll settle it at once. Trade me for a goat if I ever let my soul be taken up with inflated, overblown suspicions like the ones you're hinting at. It doesn't make me jealous to hear that my wife is beautiful, has a good appetite, enjoys company, speaks freely, sings, plays, and dances well. Where there's virtue, these things only make it more virtuous. And I won't take the smallest fear or doubt of her unfaithfulness from my own shortcomings, because she had eyes and she chose me. No, Iago, I'll see before I doubt. When I doubt, I'll get proof. And once there's proof, that's it: away with either love or jealousy!"}, {"t": "sp", "who": "IAGO", "lines": ["I am glad of it, for now I shall have reason", "To show the love and duty that I bear you", "With franker spirit. Therefore, as I am bound,", "Receive it from me. I speak not yet of proof.", "Look to your wife; observe her well with Cassio;", "Wear your eye thus, not jealous nor secure.", "I would not have your free and noble nature", "Out of self-bounty be abused. Look to't.", "I know our country disposition well;", "In Venice they do let heaven see the pranks", "They dare not show their husbands; their best conscience", "Is not to leave't undone, but keep't unknown."], "id": 541, "m": "I'm glad to hear it, because now I'll have reason to show my love and loyalty to you more openly. So, as is my duty, hear this from me. I'm not talking about proof yet. Watch your wife. Watch her closely with Cassio. Keep your eyes like this, neither jealous nor too trusting. I wouldn't want your open and noble nature to be taken advantage of because of your own generosity. Watch out. I know our Venetian ways well. In Venice women let heaven see the tricks they don't dare show their husbands. Their idea of conscience isn't to avoid doing it, but to keep it secret."}, {"t": "sp", "who": "OTHELLO", "lines": ["Dost thou say so?"], "id": 542, "m": "Do you really say so?"}, {"t": "sp", "who": "IAGO", "lines": ["She did deceive her father, marrying you;", "And when she seem'd to shake and fear your looks,", "She loved them most."], "id": 543, "m": "She deceived her father by marrying you. And when she seemed to tremble and fear your looks, she loved them most."}, {"t": "sp", "who": "OTHELLO", "lines": ["And so she did."], "id": 544, "m": "So she did."}, {"t": "sp", "who": "IAGO", "lines": ["Why, go to then.", "She that so young could give out such a seeming,", "To seel her father's eyes up close as oak-", "He thought 'twas witchcraft- but I am much to blame;", "I humbly do beseech you of your pardon", "For too much loving you."], "id": 545, "m": "Well, there you go. She was so young, yet she could put on such a show and blind her father's eyes as tight as oak grain; he thought it was witchcraft. But I'm very much to blame. I humbly beg your pardon for loving you too much."}, {"t": "sp", "who": "OTHELLO", "lines": ["I am bound to thee forever."], "id": 546, "m": "I'm forever in your debt."}, {"t": "sp", "who": "IAGO", "lines": ["I see this hath a little dash'd your spirits."], "id": 547, "m": "I see this has dampened your spirits a little."}, {"t": "sp", "who": "OTHELLO", "lines": ["Not a jot, not a jot."], "id": 548, "m": "Not a bit, not a bit."}, {"t": "sp", "who": "IAGO", "lines": ["I'faith, I fear it has.", "I hope you will consider what is spoke", "Comes from my love. But I do see you're moved;", "I am to pray you not to strain my speech", "To grosser issues nor to larger reach", "Than to suspicion."], "id": 549, "m": "Honestly, I'm afraid it has. I hope you'll consider that what I've said comes from my love for you. But I can see you're upset. I have to ask you not to stretch what I've said to bigger conclusions or wider meaning than mere suspicion."}, {"t": "sp", "who": "OTHELLO", "lines": ["I will not."], "id": 550, "m": "I won't."}, {"t": "sp", "who": "IAGO", "lines": ["Should you do so, my lord,", "My speech should fall into such vile success", "Which my thoughts aim not at. Cassio's my worthy friend-", "My lord, I see you're moved."], "id": 551, "m": "If you did, my lord, my words would have terrible results that I never intended. Cassio's my good friend. My lord, I see you're upset."}, {"t": "sp", "who": "OTHELLO", "lines": ["No, not much moved.", "I do not think but Desdemona's honest."], "id": 552, "m": "No, not very upset. I can't help but think Desdemona is faithful."}, {"t": "sp", "who": "IAGO", "lines": ["Long live she so! and long live you to think so!"], "id": 553, "m": "May she always be so! And may you live long thinking so!"}, {"t": "sp", "who": "OTHELLO", "lines": ["And yet, how nature erring from itself-"], "id": 554, "m": "And yet, how a nature can stray from itself—"}, {"t": "sp", "who": "IAGO", "lines": ["Ay, there's the point, as- to be bold with you-", "Not to affect many proposed matches", "Of her own clime, complexion, and degree,", "Whereto we see in all things nature tends-", "Foh, one may smell in such a will most rank,", "Foul disproportion, thoughts unnatural.", "But pardon me. I do not in position", "Distinctly speak of her; though I may fear,", "Her will, recoiling to her better judgement,", "May fall to match you with her country forms,", "And happily repent."], "id": 555, "m": "Yes, that's the point. To be blunt with you: she rejected many proposed matches with men of her own country, color, and rank, which is what nature tends toward in all things. Ugh, you can smell in a desire like that something rotten, a foul mismatch, unnatural thoughts. But forgive me. I'm not speaking specifically about her, although I may fear that her desire, returning to her better judgment, may start to compare you with men from her own country, and maybe regret her choice."}, {"t": "sp", "who": "OTHELLO", "lines": ["Farewell, farewell.", "If more thou dost perceive, let me know more;", "Set on thy wife to observe. Leave me, Iago."], "id": 556, "m": "Goodbye, goodbye. If you notice anything else, let me know more. Have your wife watch her. Leave me, Iago."}, {"t": "sp", "who": "IAGO", "lines": ["[Going.] My lord, I take my leave."], "id": 557, "m": "[Going.] My lord, I'll leave you."}, {"t": "sp", "who": "OTHELLO", "lines": ["Why did I marry? This honest creature doubtless", "Sees and knows more, much more, than he unfolds."], "id": 558, "m": "Why did I marry? This honest man surely sees and knows more, much more, than he's telling."}, {"t": "sp", "who": "IAGO", "lines": ["[Returning.] My lord, I would I might entreat your honor", "To scan this thing no further; leave it to time.", "Though it be fit that Cassio have his place,", "For sure he fills it up with great ability,", "Yet, if you please to hold him off awhile,", "You shall by that perceive him and his means.", "Note if your lady strain his entertainment", "With any strong or vehement importunity;", "Much will be seen in that. In the meantime,", "Let me be thought too busy in my fears-", "As worthy cause I have to fear I am-", "And hold her free, I do beseech your honor."], "id": 559, "m": "[Returning.] My lord, I wish I could beg you not to look into this any further. Leave it to time. Although Cassio should have his job back, since he certainly does it very well, if you would keep him waiting for a while, you'll learn a lot about him and his methods. Notice if your lady pushes hard for him to be reinstated with strong or urgent pleading. That will tell you a lot. In the meantime, think of me as too quick to fear the worst (as I have good reason to think I am), and consider her innocent, I beg you."}, {"t": "sp", "who": "OTHELLO", "lines": ["Fear not my government."], "id": 560, "m": "Don't worry about my self-control."}, {"t": "sp", "who": "IAGO", "lines": ["I once more take my leave."], "id": 561, "m": "Once again, I'll leave you."}, {"t": "sd", "text": "Exit.", "id": 562}, {"t": "sp", "who": "OTHELLO", "lines": ["This fellow's of exceeding honesty,", "And knows all qualities, with a learned spirit,", "Of human dealings. If I do prove her haggard,", "Though that her jesses were my dear heartstrings,", "I'ld whistle her off and let her down the wind", "To prey at fortune. Haply, for I am black", "And have not those soft parts of conversation", "That chamberers have, or for I am declined", "Into the vale of years- yet that's not much-", "She's gone. I am abused, and my relief", "Must be to loathe her. O curse of marriage,", "That we can call these delicate creatures ours,", "And not their appetites! I had rather be a toad,", "And live upon the vapor of a dungeon,", "Than keep a corner in the thing I love", "For others' uses. Yet, 'tis the plague of great ones:", "Prerogatived are they less than the base;", "'Tis destiny unshunnable, like death.", "Even then this forked plague is fated to us", "When we do quicken. Desdemona comes:"], "id": 563, "m": "This fellow is extremely honest, and he knows all kinds of people and understands human behavior. If I find out she's wild like an untamed hawk, even if her leashes were tied to my own heartstrings, I'd release her and let her fly off on the wind to fend for herself. Maybe because I'm black, and don't have the smooth way of talking that courtiers have, or because I'm getting on in years (though not by much), she's gone. I've been betrayed, and my only relief must be to hate her. Oh, the curse of marriage, that we can call these delicate creatures ours but not their desires! I'd rather be a toad living on the stale air of a dungeon than keep a corner of the thing I love for others to use. Yet it's the plague of great men; they have fewer privileges than ordinary men. It's an inescapable destiny, like death. We're fated to wear the cuckold's horns from the moment we're born. Here comes Desdemona."}, {"t": "sd", "text": "Re-enter Desdemona and Emilia.", "id": 564}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["If she be false, O, then heaven mocks itself!", "I'll not believe't."], "id": 565, "m": "If she's unfaithful, then heaven is mocking itself! I won't believe it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["How now, my dear Othello!", "Your dinner, and the generous islanders", "By you invited, do attend your presence."], "id": 566, "m": "Hello, my dear Othello! Your dinner and the noble islanders you invited are waiting for you."}, {"t": "sp", "who": "OTHELLO", "lines": ["I am to blame."], "id": 567, "m": "I'm at fault."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Why do you speak so faintly?", "Are you not well?"], "id": 568, "m": "Why are you speaking so weakly? Aren't you well?"}, {"t": "sp", "who": "OTHELLO", "lines": ["I have a pain upon my forehead here."], "id": 569, "m": "I have a pain here on my forehead."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Faith, that's with watching; 'twill away again.", "Let me but bind it hard, within this hour", "It will be well."], "id": 570, "m": "That's from staying up all night. It'll go away. Just let me wrap it tightly, and within the hour it'll be fine."}, {"t": "sp", "who": "OTHELLO", "lines": ["Your napkin is too little;"], "id": 571, "m": "Your handkerchief is too small."}, {"t": "sd", "text": "He puts the handkerchief from him, and she drops it.", "id": 572}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["Let it alone. Come, I'll go in with you."], "id": 573, "m": "Leave it. Come, I'll go in with you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I am very sorry that you are not well."], "id": 574, "m": "I'm very sorry you're not well."}, {"t": "sd", "text": "Exeunt Othello and Desdemona.", "id": 575}, {"t": "sp", "who": "EMILIA", "lines": ["I am glad I have found this napkin;", "This was her first remembrance from the Moor.", "My wayward husband hath a hundred times", "Woo'd me to steal it; but she so loves the token,", "For he conjured her she should ever keep it,", "That she reserves it evermore about her", "To kiss and talk to. I'll have the work ta'en out,", "And give't Iago. What he will do with it", "Heaven knows, not I;", "I nothing but to please his fantasy."], "id": 576, "m": "I'm glad I found this handkerchief. It was her first keepsake from the Moor. My unpredictable husband has asked me a hundred times to steal it. But she loves it so much (because he made her swear to always keep it) that she always has it with her to kiss and talk to. I'll have the embroidery copied and give it to Iago. What he'll do with it heaven knows, not me. I only want to satisfy his whims."}, {"t": "sd", "text": "Re-enter Iago.", "id": 577}, {"t": "sp", "who": "IAGO", "lines": ["How now, what do you here alone?"], "id": 578, "m": "Well, what are you doing here alone?"}, {"t": "sp", "who": "EMILIA", "lines": ["Do not you chide; I have a thing for you."], "id": 579, "m": "Don't scold me. I have something for you."}, {"t": "sp", "who": "IAGO", "lines": ["A thing for me? It is a common thing-"], "id": 580, "m": "Something for me? It's a common thing—"}, {"t": "sp", "who": "EMILIA", "lines": ["Ha!"], "id": 581, "m": "Ha!"}, {"t": "sp", "who": "IAGO", "lines": ["To have a foolish wife."], "id": 582, "m": "—to have a foolish wife."}, {"t": "sp", "who": "EMILIA", "lines": ["O, is that all? What will you give me now", "For that same handkerchief?"], "id": 583, "m": "Oh, is that all? What will you give me now for that handkerchief?"}, {"t": "sp", "who": "IAGO", "lines": ["What handkerchief?"], "id": 584, "m": "What handkerchief?"}, {"t": "sp", "who": "EMILIA", "lines": ["What handkerchief?", "Why, that the Moor first gave to Desdemona,", "That which so often you did bid me steal."], "id": 585, "m": "What handkerchief? Why, the one the Moor first gave Desdemona, the one you so often told me to steal."}, {"t": "sp", "who": "IAGO", "lines": ["Hast stol'n it from her?"], "id": 586, "m": "Have you stolen it from her?"}, {"t": "sp", "who": "EMILIA", "lines": ["No, faith; she let it drop by negligence,", "And, to the advantage, I being here took't up.", "Look, here it is."], "id": 587, "m": "No, honestly. She dropped it by accident, and since I happened to be here, I picked it up. Look, here it is."}, {"t": "sp", "who": "IAGO", "lines": ["A good wench; give it me."], "id": 588, "m": "Good girl. Give it to me."}, {"t": "sp", "who": "EMILIA", "lines": ["What will you do with't, that you have been so earnest", "To have me filch it?"], "id": 589, "m": "What will you do with it, since you've been so eager for me to steal it?"}, {"t": "sp", "who": "IAGO", "lines": ["[Snatching it.] Why, what is that to you?"], "id": 590, "m": "[Snatching it.] Why, what's it to you?"}, {"t": "sp", "who": "EMILIA", "lines": ["If't be not for some purpose of import,", "Give't me again. Poor lady, she'll run mad", "When she shall lack it."], "id": 591, "m": "If it isn't for something important, give it back to me. Poor lady, she'll go crazy when she finds it missing."}, {"t": "sp", "who": "IAGO", "lines": ["Be not acknown on't; I have use for it.", "Go, leave me."], "id": 592, "m": "Don't admit you know anything about it. I have a use for it. Go, leave me."}, {"t": "sd", "text": "Exit Emilia.", "id": 593}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["I will in Cassio's lodging lose this napkin,", "And let him find it. Trifles light as air", "Are to the jealous confirmations strong", "As proofs of holy writ; this may do something.", "The Moor already changes with my poison:", "Dangerous conceits are in their natures poisons,", "Which at the first are scarce found to distaste,", "But with a little act upon the blood", "Burn like the mines of sulphur. I did say so.", "Look, where he comes!"], "id": 594, "m": "I'll drop this handkerchief in Cassio's room and let him find it. Things as light as air seem to the jealous as strong a proof as Holy Scripture. This may do something. The Moor is already changing under my poison. Dangerous ideas are by nature poisons, which at first barely taste bad, but once they start working on the blood, they burn like sulfur mines. I said so. Look, here he comes!"}, {"t": "sd", "text": "Re-enter Othello.", "id": 595}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["Not poppy, nor mandragora,", "Nor all the drowsy syrups of the world,", "Shall ever medicine thee to that sweet sleep", "Which thou owedst yesterday."], "id": 596, "m": "Not opium, nor mandrake, nor all the sleeping potions in the world will ever give you back the sweet sleep you had yesterday."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ha, ha, false to me?"], "id": 597, "m": "Ha! Unfaithful to me?"}, {"t": "sp", "who": "IAGO", "lines": ["Why, how now, general! No more of that."], "id": 598, "m": "Why, what's this, general? Enough of that."}, {"t": "sp", "who": "OTHELLO", "lines": ["Avaunt! be gone! Thou hast set me on the rack.", "I swear 'tis better to be much abused", "Than but to know't a little."], "id": 599, "m": "Get away! Go! You've put me on the torture rack. I swear it's better to be betrayed a lot than to know only a little about it."}, {"t": "sp", "who": "IAGO", "lines": ["How now, my lord?"], "id": 600, "m": "What's the matter, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["What sense had I of her stol'n hours of lust?", "I saw't not, thought it not, it harm'd not me;", "I slept the next night well, was free and merry;", "I found not Cassio's kisses on her lips.", "He that is robb'd, not wanting what is stol'n,", "Let him not know't and he's not robb'd at all."], "id": 601, "m": "What did I know about her stolen hours of lust? I didn't see it or think it, and it didn't hurt me. I slept well the next night, was carefree and happy. I didn't find Cassio's kisses on her lips. If a man who's been robbed doesn't miss what was stolen, don't tell him, and he hasn't been robbed at all."}, {"t": "sp", "who": "IAGO", "lines": ["I am sorry to hear this."], "id": 602, "m": "I'm sorry to hear this."}, {"t": "sp", "who": "OTHELLO", "lines": ["I had been happy if the general camp,", "Pioners and all, had tasted her sweet body,", "So I had nothing known. O, now forever", "Farewell the tranquil mind! Farewell content!", "Farewell the plumed troop and the big wars", "That make ambition virtue! O, farewell,", "Farewell the neighing steed and the shrill trump,", "The spirit-stirring drum, the ear-piercing fife,", "The royal banner, and all quality,", "Pride, pomp, and circumstance of glorious war!", "And O you mortal engines, whose rude throats", "The immortal Jove's dread clamors counterfeit,", "Farewell! Othello's occupation's gone!"], "id": 603, "m": "I'd have been happy if the whole army, down to the lowest ditch-diggers, had tasted her sweet body, as long as I knew nothing about it. Oh, now, forever, goodbye to a peaceful mind! Goodbye to contentment! Goodbye to the plumed troops and the great wars that make ambition a virtue! Oh, goodbye, goodbye to the neighing horse and the shrill trumpet, the spirit-stirring drum, the ear-piercing flute, the royal flag, and all the qualities, pride, pageantry, and ceremony of glorious war! And you deadly cannons, whose rough throats imitate the terrifying thunder of immortal Jove, goodbye! Othello's career is over!"}, {"t": "sp", "who": "IAGO", "lines": ["Is't possible, my lord?"], "id": 604, "m": "Is it possible, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Villain, be sure thou prove my love a whore;", "Be sure of it. Give me the ocular proof;", "Or, by the worth of man's eternal soul,", "Thou hadst been better have been born a dog", "Than answer my waked wrath!"], "id": 605, "m": "Villain, you'd better prove my love is a whore. Make sure of it. Give me proof I can see with my own eyes. Or, by the value of man's eternal soul, you'd have been better off born a dog than face my awakened fury!"}, {"t": "sp", "who": "IAGO", "lines": ["Is't come to this?"], "id": 606, "m": "Has it come to this?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Make me to see't; or at the least so prove it,", "That the probation bear no hinge nor loop", "To hang a doubt on; or woe upon thy life!"], "id": 607, "m": "Make me see it, or at least prove it so that the proof has no hinge or loop to hang a doubt on. Or your life will be miserable!"}, {"t": "sp", "who": "IAGO", "lines": ["My noble lord-"], "id": 608, "m": "My noble lord—"}, {"t": "sp", "who": "OTHELLO", "lines": ["If thou dost slander her and torture me,", "Never pray more; abandon all remorse;", "On horror's head horrors accumulate;", "Do deeds to make heaven weep, all earth amazed;", "For nothing canst thou to damnation add", "Greater than that."], "id": 609, "m": "If you're slandering her and torturing me, never pray again. Give up all conscience. Pile horrors on top of horrors. Do things that make heaven weep and astonish the whole earth. Because you can't add anything to your damnation worse than that."}, {"t": "sp", "who": "IAGO", "lines": ["O grace! O heaven defend me!", "Are you a man? have you a soul or sense?", "God be wi' you; take mine office. O wretched fool,", "That livest to make thine honesty a vice!", "O monstrous world! Take note, take note, O world,", "To be direct and honest is not safe.", "I thank you for this profit, and from hence", "I'll love no friend sith love breeds such offense."], "id": 610, "m": "Oh, mercy! Heaven protect me! Are you a man? Do you have a soul or any sense? God be with you; take my job. Oh, miserable fool, to live to see your honesty turned into a crime! Oh, monstrous world! Take note, take note, world: being direct and honest isn't safe. Thank you for this lesson. From now on I'll love no friend, since love leads to such insults."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nay, stay; thou shouldst be honest."], "id": 611, "m": "No, stay. You ought to be honest."}, {"t": "sp", "who": "IAGO", "lines": ["I should be wise; for honesty's a fool,", "And loses that it works for."], "id": 612, "m": "I ought to be wise, because honesty is a fool and loses the very thing it works for."}, {"t": "sp", "who": "OTHELLO", "lines": ["By the world,", "I think my wife be honest, and think she is not;", "I think that thou art just, and think thou art not.", "I'll have some proof. Her name, that was as fresh", "As Dian's visage, is now begrimed and black", "As mine own face. If there be cords or knives,", "Poison or fire, or suffocating streams,", "I'll not endure it. Would I were satisfied!"], "id": 613, "m": "By the world, I think my wife is faithful, and I think she isn't. I think you're honest, and I think you're not. I'll have some proof. Her reputation, which was as fresh as the face of Diana, goddess of chastity, is now as dirty and black as my own face. As long as there are ropes or knives, poison or fire or drowning streams, I won't put up with it. I wish I knew for sure!"}, {"t": "sp", "who": "IAGO", "lines": ["I see, sir, you are eaten up with passion;", "I do repent me that I put it to you.", "You would be satisfied?"], "id": 614, "m": "I see, sir, you're consumed by passion. I'm sorry I brought this up. You want to know for sure?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Would? Nay, I will."], "id": 615, "m": "Want to? No, I will."}, {"t": "sp", "who": "IAGO", "lines": ["And may. But, how? how satisfied, my lord?", "Would you, the supervisor, grossly gape on?", "Behold her topp'd?"], "id": 616, "m": "And you can. But how? How would you know for sure, my lord? Would you stand there watching, gaping? See her getting mounted?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Death and damnation! O!"], "id": 617, "m": "Death and damnation! Oh!"}, {"t": "sp", "who": "IAGO", "lines": ["It were a tedious difficulty, I think,", "To bring them to that prospect. Damn them then,", "If ever mortal eyes do see them bolster", "More than their own! What then? how then?", "What shall I say? Where's satisfaction?", "It is impossible you should see this", "Were they as prime as goats, as hot as monkeys,", "As salt as wolves in pride, and fools as gross", "As ignorance made drunk. But yet, I say,", "If imputation and strong circumstances,", "Which lead directly to the door of truth,", "Will give you satisfaction, you may have't."], "id": 618, "m": "I think it would be very hard to arrange for you to see that. Damn them if any eyes but their own ever see them in bed togeth
