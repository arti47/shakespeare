", "lines": ["He call'd her whore; a beggar in his drink", "Could not have laid such terms upon his callet."], "id": 987, "m": "He called her a whore. A drunken beggar couldn't have called his trashy girlfriend worse names."}, {"t": "sp", "who": "IAGO", "lines": ["Why did he so?"], "id": 988, "m": "Why did he do that?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I do not know; I am sure I am none such."], "id": 989, "m": "I don't know. I'm sure I'm not one."}, {"t": "sp", "who": "IAGO", "lines": ["Do not weep, do not weep. Alas the day!"], "id": 990, "m": "Don't cry, don't cry. What a terrible day!"}, {"t": "sp", "who": "EMILIA", "lines": ["Hath she forsook so many noble matches,", "Her father and her country and her friends,", "To be call'd whore? Would it not make one weep?"], "id": 991, "m": "Did she give up so many noble marriage offers, her father, her country, and her friends, to be called a whore? Wouldn't that make anyone cry?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["It is my wretched fortune."], "id": 992, "m": "It's my miserable luck."}, {"t": "sp", "who": "IAGO", "lines": ["Beshrew him for't!", "How comes this trick upon him?"], "id": 993, "m": "Curse him for it! How did he get this idea?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Nay, heaven doth know."], "id": 994, "m": "Heaven only knows."}, {"t": "sp", "who": "EMILIA", "lines": ["I will be hang'd, if some eternal villain,", "Some busy and insinuating rogue,", "Some cogging, cozening slave, to get some office,", "Have not devised this slander; I'll be hang'd else."], "id": 995, "m": "I'll be hanged if some damned villain, some meddling, scheming scoundrel, some lying, cheating slave, didn't invent this slander to get himself some promotion. I'll be hanged if it isn't so."}, {"t": "sp", "who": "IAGO", "lines": ["Fie, there is no such man; it is impossible."], "id": 996, "m": "Come on, there's no such man. It's impossible."}, {"t": "sp", "who": "DESDEMONA", "lines": ["If any such there be, heaven pardon him!"], "id": 997, "m": "If there is, may heaven forgive him!"}, {"t": "sp", "who": "EMILIA", "lines": ["A halter pardon him! And hell gnaw his bones!", "Why should he call her whore? Who keeps her company?", "What place? What time? What form? What likelihood?", "The Moor's abused by some most villainous knave,", "Some base notorious knave, some scurvy fellow.", "O heaven, that such companions thou'ldst unfold,", "And put in every honest hand a whip", "To lash the rascals naked through the world", "Even from the east to the west!"], "id": 998, "m": "May a noose forgive him! And may hell gnaw his bones! Why would he call her a whore? Who has she been with? Where? When? How? What's the evidence? The Moor's been tricked by some vicious villain, some low, notorious villain, some scummy creep. Oh heaven, I wish you'd expose such men and put a whip in every honest hand to lash those rascals naked across the world, from east to west!"}, {"t": "sp", "who": "IAGO", "lines": ["Speak within door."], "id": 999, "m": "Keep your voice down."}, {"t": "sp", "who": "EMILIA", "lines": ["O, fie upon them! Some such squire he was", "That turn'd your wit the seamy side without,", "And made you to suspect me with the Moor."], "id": 1000, "m": "Oh, to hell with them! It was a guy like that who turned your brain inside out and made you suspect me with the Moor."}, {"t": "sp", "who": "IAGO", "lines": ["You are a fool; go to."], "id": 1001, "m": "You're a fool. Enough."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O good Iago,", "What shall I do to win my lord again?", "Good friend, go to him, for by this light of heaven,", "I know not how I lost him. Here I kneel:", "If e'er my will did trespass 'gainst his love", "Either in discourse of thought or actual deed,", "Or that mine eyes, mine ears, or any sense,", "Delighted them in any other form,", "Or that I do not yet, and ever did,", "And ever will, though he do shake me off", "To beggarly divorcement, love him dearly,", "Comfort forswear me! Unkindness may do much,", "And his unkindness may defeat my life,", "But never taint my love. I cannot say \"whore.\"", "It doth abhor me now I speak the word;", "To do the act that might the addition earn", "Not the world's mass of vanity could make me."], "id": 1002, "m": "Oh, good Iago, what should I do to win my husband back? Good friend, go to him, because by the light of heaven, I don't know how I lost him. Here I kneel. If my heart ever betrayed his love, either in thought or in action, or if my eyes, my ears, or any of my senses ever took pleasure in any other man, or if I don't still love him dearly, and always did, and always will, even if he throws me off into a beggarly divorce, may I never know comfort again! Unkindness can do a lot, and his unkindness may destroy my life, but it will never spoil my love. I can't say \"whore.\" It disgusts me just to say the word. Not all the riches in the world could make me do what would earn that name."}, {"t": "sp", "who": "IAGO", "lines": ["I pray you, be content; 'tis but his humor:", "The business of the state does him offense,", "And he does chide with you."], "id": 1003, "m": "Please, calm down. It's just his mood. Government business is upsetting him, and he's taking it out on you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["If 'twere no other-"], "id": 1004, "m": "If it were only that—"}, {"t": "sp", "who": "IAGO", "lines": ["'Tis but so, I warrant. [Trumpets within.]", "Hark, how these instruments summon to supper!", "The messengers of Venice stay the meat.", "Go in, and weep not; all things shall be well."], "id": 1005, "m": "That's all it is, I promise. [Trumpets offstage.] Listen, those trumpets are calling everyone to supper! The messengers from Venice are waiting to eat. Go in, and don't cry. Everything will be fine."}, {"t": "sd", "text": "Exeunt Desdemona and Emilia.", "id": 1006}, {"t": "sd", "text": "Enter Roderigo.", "id": 1007}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["How now, Roderigo!"], "id": 1008, "m": "Hello, Roderigo!"}, {"t": "sp", "who": "RODERIGO", "lines": ["I do not find that thou dealest justly with me."], "id": 1009, "m": "I don't think you're dealing fairly with me."}, {"t": "sp", "who": "IAGO", "lines": ["What in the contrary?"], "id": 1010, "m": "How so?"}, {"t": "sp", "who": "RODERIGO", "lines": ["Every day thou daffest me with some device, Iago; and", "rather, as it seems to me now, keepest from me all conveniency", "than suppliest me with the least advantage of hope. I will indeed", "no longer endure it; nor am I yet persuaded to put up in peace", "what already I have foolishly suffered."], "id": 1011, "m": "Every day you put me off with some trick, Iago. And now it seems to me you're keeping me from any opportunity rather than giving me even the slightest hope. I really won't put up with it anymore. And I'm not ready to quietly accept what I've already foolishly suffered."}, {"t": "sp", "who": "IAGO", "lines": ["Will you hear me, Roderigo?"], "id": 1012, "m": "Will you listen to me, Roderigo?"}, {"t": "sp", "who": "RODERIGO", "lines": ["Faith, I have heard too much, for your words and", "performances are no kin together."], "id": 1013, "m": "Honestly, I've listened too much already, because your words and your actions have nothing to do with each other."}, {"t": "sp", "who": "IAGO", "lines": ["You charge me most unjustly."], "id": 1014, "m": "Your accusation is very unfair."}, {"t": "sp", "who": "RODERIGO", "lines": ["With nought but truth. I have wasted myself out of my", "means. The jewels you have had from me to deliver to Desdemona", "would half have corrupted a votarist. You have told me she hath", "received them and returned me expectations and comforts of sudden", "respect and acquaintance; but I find none."], "id": 1015, "m": "It's nothing but the truth. I've spent everything I had. The jewels you got from me to give to Desdemona would have half corrupted a nun. You told me she'd received them and sent back hopes and promises of special attention and getting to know me soon. But I haven't seen any of that."}, {"t": "sp", "who": "IAGO", "lines": ["Well, go to, very well."], "id": 1016, "m": "Well, go on, very well."}, {"t": "sp", "who": "RODERIGO", "lines": ["Very well! go to! I cannot go to, man; nor 'tis not very", "well. By this hand, I say 'tis very scurvy, and begin to find", "myself fopped in it."], "id": 1017, "m": "Very well! Go on! I can't go on, man, and it's not very well. I swear, I say it's very rotten, and I'm beginning to realize I've been made a fool of."}, {"t": "sp", "who": "IAGO", "lines": ["Very well."], "id": 1018, "m": "Very well."}, {"t": "sp", "who": "RODERIGO", "lines": ["I tell you 'tis not very well. I will make myself known", "to Desdemona. If she will return me my jewels, I will give over", "my suit and repent my unlawful solicitation; if not, assure", "yourself I will seek satisfaction of you."], "id": 1019, "m": "I'm telling you it's not very well. I'm going to make myself known to Desdemona. If she'll give me back my jewels, I'll give up my courtship and repent of my unlawful pursuit. If not, you can be sure I'll demand satisfaction from you."}, {"t": "sp", "who": "IAGO", "lines": ["You have said now."], "id": 1020, "m": "You've said your piece."}, {"t": "sp", "who": "RODERIGO", "lines": ["Ay, and said nothing but what I protest intendment of", "doing."], "id": 1021, "m": "Yes, and I've said nothing I don't fully intend to do."}, {"t": "sp", "who": "IAGO", "lines": ["Why, now I see there's mettle in thee; and even from this", "instant do build on thee a better opinion than ever before. Give", "me thy hand, Roderigo. Thou hast taken against me a most just", "exception; but yet, I protest, have dealt most directly in thy", "affair."], "id": 1022, "m": "Why, now I see there's some backbone in you. And from this moment on I think more of you than ever before. Give me your hand, Roderigo. You've raised a very fair objection against me. But I swear, I've dealt with your business very honestly."}, {"t": "sp", "who": "RODERIGO", "lines": ["It hath not appeared."], "id": 1023, "m": "It hasn't looked like it."}, {"t": "sp", "who": "IAGO", "lines": ["I grant indeed it hath not appeared, and your suspicion is", "not without wit and judgement. But, Roderigo, if thou hast that", "in thee indeed, which I have greater reason to believe now than", "ever, I mean purpose, courage, and valor, this night show it; if", "thou the next night following enjoy not Desdemona, take me from", "this world with treachery and devise engines for my life."], "id": 1024, "m": "I admit it hasn't looked like it, and your suspicion shows some intelligence and judgment. But, Roderigo, if you really have in you what I now have more reason than ever to believe (I mean determination, courage, and bravery), show it tonight. If you don't enjoy Desdemona the following night, then kill me by treachery and plot against my life."}, {"t": "sp", "who": "RODERIGO", "lines": ["Well, what is it? Is it within reason and compass?"], "id": 1025, "m": "Well, what is it? Is it reasonable and possible?"}, {"t": "sp", "who": "IAGO", "lines": ["Sir, there is especial commission come from Venice to depute", "Cassio in Othello's place."], "id": 1026, "m": "Sir, a special order has come from Venice to put Cassio in Othello's place."}, {"t": "sp", "who": "RODERIGO", "lines": ["Is that true? Why then Othello and Desdemona return again", "to Venice."], "id": 1027, "m": "Is that true? Then Othello and Desdemona will go back to Venice."}, {"t": "sp", "who": "IAGO", "lines": ["O, no; he goes into Mauritania, and takes away with him the", "fair Desdemona, unless his abode be lingered here by some", "accident; wherein none can be so determinate as the removing of", "Cassio."], "id": 1028, "m": "Oh, no. He's going to Mauritania and taking the beautiful Desdemona with him, unless something happens to keep him here. And nothing could do that more decisively than removing Cassio."}, {"t": "sp", "who": "RODERIGO", "lines": ["How do you mean, removing of him?"], "id": 1029, "m": "What do you mean, removing him?"}, {"t": "sp", "who": "IAGO", "lines": ["Why, by making him uncapable of Othello's place; knocking out", "his brains."], "id": 1030, "m": "Why, by making him unable to take Othello's place: knocking his brains out."}, {"t": "sp", "who": "RODERIGO", "lines": ["And that you would have me to do?"], "id": 1031, "m": "And you want me to do that?"}, {"t": "sp", "who": "IAGO", "lines": ["Ay, if you dare do yourself a profit and a right. He sups", "tonight with a harlotry, and thither will I go to him. He knows", "not yet of his honorable fortune. If you will watch his going", "thence, which his will fashion to fall out between twelve and", "one, you may take him at your pleasure; I will be near to second", "your attempt, and he shall fall between us. Come, stand not", "amazed at it, but go along with me; I will show you such a", "necessity in his death that you shall think yourself bound to put", "it on him. It is now high supper-time, and the night grows to", "waste. About it."], "id": 1032, "m": "Yes, if you dare to do yourself some good and get what you deserve. He's having supper tonight with a whore, and I'll meet him there. He doesn't know about his promotion yet. If you watch for him leaving, which I'll arrange to happen between twelve and one, you can attack him however you like. I'll be nearby to back you up, and between us he'll go down. Come on, don't stand there stunned. Come with me. I'll show you why his death is so necessary that you'll feel obligated to kill him. It's well past supper time, and the night's wasting away. Let's get to it."}, {"t": "sp", "who": "RODERIGO", "lines": ["I will hear further reason for this."], "id": 1033, "m": "I want to hear more reasons for this."}, {"t": "sp", "who": "IAGO", "lines": ["And you shall be satisfied."], "id": 1034, "m": "And you will, to your satisfaction."}, {"t": "sd", "text": "Exeunt.", "id": 1035}, {"t": "scene", "act": 4, "scene": "III", "loc": "Another room in the castle.", "id": 1036}, {"t": "sd", "text": "Enter Othello, Lodovico, Desdemona, Emilia, and Attendants.", "id": 1037}, {"t": "sp", "who": "LODOVICO", "lines": ["I do beseech you, sir, trouble yourself no further."], "id": 1038, "m": "Please, sir, don't trouble yourself any further."}, {"t": "sp", "who": "OTHELLO", "lines": ["O, pardon me; 'twill do me good to walk."], "id": 1039, "m": "Oh, excuse me. It'll do me good to walk."}, {"t": "sp", "who": "LODOVICO", "lines": ["Madam, good night; I humbly thank your ladyship."], "id": 1040, "m": "Good night, madam. I humbly thank your ladyship."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Your honor is most welcome."], "id": 1041, "m": "You're very welcome, sir."}, {"t": "sp", "who": "OTHELLO", "lines": ["Will you walk, sir?", "O- Desdemona-"], "id": 1042, "m": "Shall we walk, sir? Oh, Desdemona—"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My lord?"], "id": 1043, "m": "My lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Get you to bed on the instant; I will be returned", "forthwith. Dismiss your attendant there; look it be done."], "id": 1044, "m": "Go to bed right away. I'll be back soon. Send your attendant away. Make sure it's done."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I will, my lord."], "id": 1045, "m": "I will, my lord."}, {"t": "sd", "text": "Exeunt Othello, Lodovico, and Attendants.", "id": 1046}, {"t": "sp", "who": "EMILIA", "lines": ["How goes it now? He looks gentler than he did."], "id": 1047, "m": "How are things now? He looks gentler than he did."}, {"t": "sp", "who": "DESDEMONA", "lines": ["He says he will return incontinent.", "He hath commanded me to go to bed,", "And bade me to dismiss you."], "id": 1048, "m": "He says he'll be back right away. He's ordered me to go to bed and told me to send you away."}, {"t": "sp", "who": "EMILIA", "lines": ["Dismiss me?"], "id": 1049, "m": "Send me away?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["It was his bidding; therefore, good Emilia,", "Give me my nightly wearing, and adieu.", "We must not now displease him."], "id": 1050, "m": "Those were his orders. So, good Emilia, give me my nightclothes, and goodbye. We mustn't upset him now."}, {"t": "sp", "who": "EMILIA", "lines": ["I would you had never seen him!"], "id": 1051, "m": "I wish you'd never seen him!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["So would not I. My love doth so approve him,", "That even his stubbornness, his checks, his frowns-", "Prithee, unpin me- have grace and favor in them."], "id": 1052, "m": "I don't. I love him so much that even his stubbornness, his scolding, his frowns (please, unpin me) have a grace and charm to them."}, {"t": "sp", "who": "EMILIA", "lines": ["I have laid those sheets you bade me on the bed."], "id": 1053, "m": "I've put those sheets you asked for on the bed."}, {"t": "sp", "who": "DESDEMONA", "lines": ["All's one. Good faith, how foolish are our minds!", "If I do die before thee, prithee shroud me", "In one of those same sheets."], "id": 1054, "m": "It doesn't matter. Honestly, how foolish our minds are! If I die before you, please wrap me in one of those sheets."}, {"t": "sp", "who": "EMILIA", "lines": ["Come, come, you talk."], "id": 1055, "m": "Come on, come on, you're just talking."}, {"t": "sp", "who": "DESDEMONA", "lines": ["My mother had a maid call'd Barbary;", "She was in love, and he she loved proved mad", "And did forsake her. She had a song of \"willow\";", "An old thing 'twas, but it express'd her fortune,", "And she died singing it. That song tonight", "Will not go from my mind; I have much to do", "But to go hang my head all at one side", "And sing it like poor Barbary. Prithee, dispatch."], "id": 1056, "m": "My mother had a maid named Barbary. She was in love, and the man she loved went mad and left her. She had a song called \"Willow.\" It was an old song, but it described her situation, and she died singing it. Tonight I can't get that song out of my head. It's all I can do not to hang my head to one side and sing it like poor Barbary. Please, hurry."}, {"t": "sp", "who": "EMILIA", "lines": ["Shall I go fetch your nightgown?"], "id": 1057, "m": "Shall I go get your nightgown?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, unpin me here.", "This Lodovico is a proper man."], "id": 1058, "m": "No, unpin me here. This Lodovico is a fine man."}, {"t": "sp", "who": "EMILIA", "lines": ["A very handsome man."], "id": 1059, "m": "A very handsome man."}, {"t": "sp", "who": "DESDEMONA", "lines": ["He speaks well."], "id": 1060, "m": "He speaks well."}, {"t": "sp", "who": "EMILIA", "lines": ["I know a lady in Venice would have walked barefoot to", "Palestine for a touch of his nether lip."], "id": 1061, "m": "I know a lady in Venice who would have walked barefoot to Palestine for one touch of his lower lip."}, {"t": "sp", "who": "DESDEMONA", "lines": ["[Sings.]", "~\"The poor soul sat sighing by a sycamore tree,", "~Sing all a green willow;", "~Her hand on her bosom, her head on her knee,", "~Sing willow, willow, willow.", "~The fresh streams ran by her, and murmur'd her moans,", "~Sing willow, willow, willow;", "~Her salt tears fell from her, and soften'd the stones-\"", "Lay be these-", "~\"Sing willow, willow, willow-\"", "Prithee, hie thee; he'll come anon-", "~\"Sing all a green willow must be my garland.", "~Let nobody blame him; his scorn I approve-\"", "Nay, that's not next. Hark, who is't that knocks?"], "id": 1062, "m": "[Singing.] \"The poor soul sat sighing by a sycamore tree, sing all a green willow; her hand on her chest, her head on her knee, sing willow, willow, willow. The fresh streams ran by her and murmured her moans, sing willow, willow, willow; her salt tears fell from her and softened the stones.\" Put these away. \"Sing willow, willow, willow.\" Please, hurry; he'll be here soon. \"Sing all a green willow must be my garland. Let nobody blame him; I accept his scorn.\" No, that's not the next line. Listen, who's knocking?"}, {"t": "sp", "who": "EMILIA", "lines": ["It's the wind."], "id": 1063, "m": "It's the wind."}, {"t": "sp", "who": "DESDEMONA", "lines": ["[Sings.]", "~\"I call'd my love false love; but what said he then?", "~Sing willow, willow, willow.", "~If I court moe women, you'll couch with moe men-\"", "So get thee gone; good night. Mine eyes do itch;", "Doth that bode weeping?"], "id": 1064, "m": "[Singing.] \"I called my love false love; but what did he say then? Sing willow, willow, willow. If I court more women, you'll sleep with more men.\" So go now. Good night. My eyes itch. Does that mean I'll cry?"}, {"t": "sp", "who": "EMILIA", "lines": ["'Tis neither here nor there."], "id": 1065, "m": "It doesn't mean anything."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I have heard it said so. O, these men, these men!", "Dost thou in conscience think- tell me, Emilia-", "That there be women do abuse their husbands", "In such gross kind?"], "id": 1066, "m": "I've heard it said that it does. Oh, these men, these men! Do you honestly think (tell me, Emilia) that there are women who cheat on their husbands so grossly?"}, {"t": "sp", "who": "EMILIA", "lines": ["There be some such, no question."], "id": 1067, "m": "There are some, no doubt about it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Wouldst thou do such a deed for all the world?"], "id": 1068, "m": "Would you do such a thing for the whole world?"}, {"t": "sp", "who": "EMILIA", "lines": ["Why, would not you?"], "id": 1069, "m": "Why, wouldn't you?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, by this heavenly light!"], "id": 1070, "m": "No, by this heavenly light!"}, {"t": "sp", "who": "EMILIA", "lines": ["Nor I neither by this heavenly light; I might do't as well", "i' the dark."], "id": 1071, "m": "Neither would I, by this heavenly light. I'd rather do it in the dark."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Wouldst thou do such a deed for all the world?"], "id": 1072, "m": "Would you do such a thing for the whole world?"}, {"t": "sp", "who": "EMILIA", "lines": ["The world's a huge thing; it is a great price", "For a small vice."], "id": 1073, "m": "The world's a huge thing. It's a big reward for a small sin."}, {"t": "sp", "who": "DESDEMONA", "lines": ["In troth, I think thou wouldst not."], "id": 1074, "m": "Honestly, I don't think you would."}, {"t": "sp", "who": "EMILIA", "lines": ["In troth, I think I should, and undo't when I had done.", "Marry, I would not do such a thing for a joint-ring, nor for", "measures of lawn, nor for gowns, petticoats, nor caps, nor any", "petty exhibition; but, for the whole world- why, who would not", "make her husband a cuckold to make him a monarch? I should", "venture purgatory for't."], "id": 1075, "m": "Honestly, I think I would, and undo it once I'd done it. Of course, I wouldn't do it for a cheap ring, or for some fine linen, or for dresses, petticoats, hats, or any little gift. But for the whole world? Why, who wouldn't cheat on her husband to make him a king? I'd risk purgatory for that."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Beshrew me, if I would do such a wrong", "For the whole world."], "id": 1076, "m": "Damn me if I'd do such a wrong for the whole world."}, {"t": "sp", "who": "EMILIA", "lines": ["Why, the wrong is but a wrong i' the world; and having the", "world for your labor, 'tis a wrong in your own world, and you", "might quickly make it right."], "id": 1077, "m": "Why, the wrong is only a wrong in the world's eyes. And if you get the world for your trouble, it's a wrong in your own world, and you could quickly make it right."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I do not think there is any such woman."], "id": 1078, "m": "I don't think there's any such woman."}, {"t": "sp", "who": "EMILIA", "lines": ["Yes, a dozen, and as many to the vantage as would store the", "world they played for.", "But I do think it is their husbands' faults", "If wives do fall; say that they slack their duties", "And pour our treasures into foreign laps,", "Or else break out in peevish jealousies,", "Throwing restraint upon us, or say they strike us,", "Or scant our former having in despite,", "Why, we have galls, and though we have some grace,", "Yet have we some revenge. Let husbands know", "Their wives have sense like them; they see and smell", "And have their palates both for sweet and sour,", "As husbands have. What is it that they do", "When they change us for others? Is it sport?", "I think it is. And doth affection breed it?", "I think it doth. Is't frailty that thus errs?", "It is so too. And have not we affections,", "Desires for sport, and frailty, as men have?", "Then let them use us well; else let them know,", "The ills we do, their ills instruct us so."], "id": 1079, "m": "Yes, a dozen, and as many more as would fill the world they gambled for. But I do think it's the husbands' fault when wives go wrong. Say they neglect their duties and pour what's ours into other women's laps; or they break out in petty jealousy and lock us up; or say they hit us, or cut our allowance out of spite. Why, we have tempers, and though we have some kindness, we can also take revenge. Husbands should know their wives have senses like them. They see and smell and have tastes for both sweet and sour, just like husbands. What are they doing when they trade us for other women? Is it for fun? I think it is. Does desire drive it? I think it does. Is it weakness that makes them stray? That too. And don't we have desires, a wish for fun, and weakness, just like men? So let them treat us well. Otherwise, let them know that the wrongs we do, they taught us."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Good night, good night. Heaven me such uses send,", "Not to pick bad from bad, but by bad mend!"], "id": 1080, "m": "Good night, good night. May heaven help me not to learn bad from bad, but to become better because of it!"}, {"t": "sd", "text": "Exeunt.", "id": 1081}, {"t": "scene", "act": 5, "scene": "I", "loc": "Cyprus. A street.", "id": 1082}, {"t": "sd", "text": "Enter Iago and Roderigo:", "id": 1083}, {"t": "sp", "who": "IAGO", "lines": ["Here, stand behind this bulk; straight will he come.", "Wear thy good rapier bare, and put it home.", "Quick, quick; fear nothing; I'll be at thy elbow.", "It makes us, or it mars us; think on that,", "And fix most firm thy resolution."], "id": 1084, "m": "Here, stand behind this wall. He'll be here any minute. Have your sword drawn, and drive it in deep. Quick, quick. Don't be afraid; I'll be right beside you. This makes us or breaks us. Think about that, and keep your resolve firm."}, {"t": "sp", "who": "RODERIGO", "lines": ["Be near at hand; I may miscarry in't."], "id": 1085, "m": "Stay close. I might mess it up."}, {"t": "sp", "who": "IAGO", "lines": ["Here, at thy hand, be bold, and take thy stand.", "[Retires.]"], "id": 1086, "m": "I'm right here, close at hand. Be brave and take your position. [He steps back.]"}, {"t": "sp", "who": "RODERIGO", "lines": ["I have no great devotion to the deed;", "And yet he hath given me satisfying reasons.", "'Tis but a man gone. Forth, my sword; he dies."], "id": 1087, "m": "I'm not very keen on doing this, and yet he's given me convincing reasons. It's just one man gone. Out, my sword. He dies."}, {"t": "sp", "who": "IAGO", "lines": ["I have rubb'd this young quat almost to the sense,", "And he grows angry. Now, whether he kill Cassio,", "Or Cassio him, or each do kill the other,", "Every way makes my gain. Live Roderigo,", "He calls me to a restitution large", "Of gold and jewels that I bobb'd from him,", "As gifts to Desdemona;", "It must not be. If Cassio do remain,", "He hath a daily beauty in his life", "That makes me ugly; and besides, the Moor", "May unfold me to him; there stand I in much peril.", "No, he must die. Be't so. I hear him coming."], "id": 1088, "m": "I've rubbed this young pimple almost raw, and he's getting angry. Now, whether he kills Cassio, or Cassio kills him, or they kill each other, I win either way. If Roderigo lives, he'll demand I pay back all the gold and jewels I swindled from him as gifts for Desdemona. That can't happen. If Cassio survives, he has a daily goodness in his life that makes me look ugly. Besides, the Moor might reveal my story to him, and then I'm in great danger. No, he has to die. So be it. I hear him coming."}, {"t": "sd", "text": "Enter Cassio.", "id": 1089}, {"t": "sp", "who": "RODERIGO", "lines": ["I know his gait; 'tis he. Villain, thou diest!"], "id": 1090, "m": "I know his walk. It's him. Villain, you die!"}, {"t": "sd", "text": "Makes a pass at Cassio.", "id": 1091}, {"t": "sp", "who": "CASSIO", "lines": ["That thrust had been mine enemy indeed,", "But that my coat is better than thou know'st;", "I will make proof of thine. [Draws, and wounds Roderigo.]"], "id": 1092, "m": "That thrust would have been the end of me if my coat weren't stronger than you think. Now I'll test yours. [He draws and wounds Roderigo.]"}, {"t": "sp", "who": "RODERIGO", "lines": ["O, I am slain!"], "id": 1093, "m": "Oh, I'm killed!"}, {"t": "sd", "text": "Iago from behind wounds Cassio in the leg, and exit.", "id": 1094}, {"t": "sp", "who": "CASSIO", "lines": ["I am maim'd forever. Help, ho! Murther! Murther!", "[Falls.]"], "id": 1095, "m": "I'm crippled for life. Help! Murder! Murder! [He falls.]"}, {"t": "sd", "text": "Enter Othello.", "id": 1096}, {"t": "sp", "who": "OTHELLO", "lines": ["The voice of Cassio; Iago keeps his word."], "id": 1097, "m": "That's Cassio's voice. Iago is keeping his word."}, {"t": "sp", "who": "RODERIGO", "lines": ["O, villain that I am!"], "id": 1098, "m": "Oh, what a villain I am!"}, {"t": "sp", "who": "OTHELLO", "lines": ["It is even so."], "id": 1099, "m": "That's right."}, {"t": "sp", "who": "CASSIO", "lines": ["O, help, ho! Light! A surgeon!"], "id": 1100, "m": "Oh, help! A light! A doctor!"}, {"t": "sp", "who": "OTHELLO", "lines": ["'Tis he. O brave Iago, honest and just,", "That hast such noble sense of thy friend's wrong!", "Thou teachest me. Minion, your dear lies dead,", "And your unblest fate hies. Strumpet, I come!", "Forth of my heart those charms, thine eyes, are blotted;", "Thy bed lust-stain'd shall with lust's blood be spotted."], "id": 1101, "m": "It's him. Oh, brave Iago, honest and fair, who feels his friend's wrong so nobly! You're teaching me. You slut, your lover lies dead, and your own cursed fate is coming fast. Whore, I'm coming! Those charms of yours, your eyes, are wiped from my heart. Your bed, stained with lust, will be spattered with lust's blood."}, {"t": "sd", "text": "Exit.", "id": 1102}, {"t": "sd", "text": "Enter Lodovico and Gratiano.", "id": 1103}, {"t": "sp", "who": "CASSIO", "lines": ["What, ho! No watch? No passage? Murther! Murther!"], "id": 1104, "m": "Hey! No watchmen? No one passing by? Murder! Murder!"}, {"t": "sp", "who": "GRATIANO", "lines": ["'Tis some mischance; the cry is very direful."], "id": 1105, "m": "Something bad has happened. That cry sounds terrible."}, {"t": "sp", "who": "CASSIO", "lines": ["O, help!"], "id": 1106, "m": "Oh, help!"}, {"t": "sp", "who": "LODOVICO", "lines": ["Hark!"], "id": 1107, "m": "Listen!"}, {"t": "sp", "who": "RODERIGO", "lines": ["O wretched villain!"], "id": 1108, "m": "Oh, miserable villain!"}, {"t": "sp", "who": "LODOVICO", "lines": ["Two or three groan; it is a heavy night.", "These may be counterfeits; let's think't unsafe", "To come in to the cry without more help."], "id": 1109, "m": "Two or three people are groaning. It's a dark night. These could be fakes; let's not risk going toward the cries without more help."}, {"t": "sp", "who": "RODERIGO", "lines": ["Nobody come? Then shall I bleed to death."], "id": 1110, "m": "Is nobody coming? Then I'll bleed to death."}, {"t": "sp", "who": "LODOVICO", "lines": ["Hark!"], "id": 1111, "m": "Listen!"}, {"t": "sd", "text": "Re-enter Iago, with a light.", "id": 1112}, {"t": "sp", "who": "GRATIANO", "lines": ["Here's one comes in his shirt, with light and weapons."], "id": 1113, "m": "Someone's coming in his shirt, with a light and weapons."}, {"t": "sp", "who": "IAGO", "lines": ["Who's there? Whose noise is this that cries on murther?"], "id": 1114, "m": "Who's there? Who's making this noise, shouting murder?"}, {"t": "sp", "who": "LODOVICO", "lines": ["We do not know."], "id": 1115, "m": "We don't know."}, {"t": "sp", "who": "IAGO", "lines": ["Did not you hear a cry?"], "id": 1116, "m": "Didn't you hear someone cry out?"}, {"t": "sp", "who": "CASSIO", "lines": ["Here, here! for heaven's sake, help me!"], "id": 1117, "m": "Here, here! For heaven's sake, help me!"}, {"t": "sp", "who": "IAGO", "lines": ["What's the matter?"], "id": 1118, "m": "What's the matter?"}, {"t": "sp", "who": "GRATIANO", "lines": ["This is Othello's ancient, as I take it."], "id": 1119, "m": "I think this is Othello's ensign."}, {"t": "sp", "who": "LODOVICO", "lines": ["The same indeed; a very valiant fellow."], "id": 1120, "m": "It is. A very brave fellow."}, {"t": "sp", "who": "IAGO", "lines": ["What are you here that cry so grievously?"], "id": 1121, "m": "Who's there, crying out so painfully?"}, {"t": "sp", "who": "CASSIO", "lines": ["Iago? O, I am spoil'd, undone by villains!", "Give me some help."], "id": 1122, "m": "Iago? Oh, I've been ruined, destroyed by villains! Help me."}, {"t": "sp", "who": "IAGO", "lines": ["O me, lieutenant! What villains have done this?"], "id": 1123, "m": "Oh no, lieutenant! What villains did this?"}, {"t": "sp", "who": "CASSIO", "lines": ["I think that one of them is hereabout,", "And cannot make away."], "id": 1124, "m": "I think one of them is around here and can't get away."}, {"t": "sp", "who": "IAGO", "lines": ["O treacherous villains!", "[To Lodovico and Gratiano.] What are you there?", "Come in and give some help."], "id": 1125, "m": "Oh, treacherous villains! [To Lodovico and Gratiano.] Who are you there? Come here and help."}, {"t": "sp", "who": "RODERIGO", "lines": ["O, help me here!"], "id": 1126, "m": "Oh, help me here!"}, {"t": "sp", "who": "CASSIO", "lines": ["That's one of them."], "id": 1127, "m": "That's one of them."}, {"t": "sp", "who": "IAGO", "lines": ["O murtherous slave! O villain!"], "id": 1128, "m": "Oh, murdering slave! Oh, villain!"}, {"t": "sd", "text": "Stabs Roderigo.", "id": 1129}, {"t": "sp", "who": "RODERIGO", "lines": ["O damn'd Iago! O inhuman dog!"], "id": 1130, "m": "Oh, damned Iago! Oh, inhuman dog!"}, {"t": "sp", "who": "IAGO", "lines": ["Kill men i' the dark! Where be these bloody thieves?", "How silent is this town! Ho! Murther! Murther!", "What may you be? Are you of good or evil?"], "id": 1131, "m": "Killing men in the dark! Where are these bloody thieves? How quiet this town is! Hey! Murder! Murder! Who are you? Are you good or bad?"}, {"t": "sp", "who": "LODOVICO", "lines": ["As you shall prove us, praise us."], "id": 1132, "m": "Judge us by what we do."}, {"t": "sp", "who": "IAGO", "lines": ["Signior Lodovico?"], "id": 1133, "m": "Signior Lodovico?"}, {"t": "sp", "who": "LODOVICO", "lines": ["He, sir."], "id": 1134, "m": "Yes, sir."}, {"t": "sp", "who": "IAGO", "lines": ["I cry you mercy. Here's Cassio hurt by villains."], "id": 1135, "m": "I beg your pardon. Here's Cassio, wounded by villains."}, {"t": "sp", "who": "GRATIANO", "lines": ["Cassio?"], "id": 1136, "m": "Cassio?"}, {"t": "sp", "who": "IAGO", "lines": ["How is't, brother?"], "id": 1137, "m": "How are you, brother?"}, {"t": "sp", "who": "CASSIO", "lines": ["My leg is cut in two."], "id": 1138, "m": "My leg is cut in two."}, {"t": "sp", "who": "IAGO", "lines": ["Marry, heaven forbid!", "Light, gentlemen; I'll bind it with my shirt."], "id": 1139, "m": "Heaven forbid! A light, gentlemen. I'll bandage it with my shirt."}, {"t": "sd", "text": "Enter Bianca.", "id": 1140}, {"t": "sp", "who": "BIANCA", "lines": ["What is the matter, ho? Who is't that cried?"], "id": 1141, "m": "What's the matter? Who cried out?"}, {"t": "sp", "who": "IAGO", "lines": ["Who is't that cried?"], "id": 1142, "m": "Who cried out?"}, {"t": "sp", "who": "BIANCA", "lines": ["O my dear Cassio, my sweet Cassio! O Cassio, Cassio,", "Cassio!"], "id": 1143, "m": "Oh, my dear Cassio, my sweet Cassio! Oh, Cassio, Cassio, Cassio!"}, {"t": "sp", "who": "IAGO", "lines": ["O notable strumpet! Cassio, may you suspect", "Who they should be that have thus mangled you?"], "id": 1144, "m": "Oh, you obvious whore! Cassio, do you have any idea who did this to you?"}, {"t": "sp", "who": "CASSIO", "lines": ["No."], "id": 1145, "m": "No."}, {"t": "sp", "who": "GRATIANO", "lines": ["I am sorry to find you thus; I have been to seek you."], "id": 1146, "m": "I'm sorry to find you like this. I've been looking for you."}, {"t": "sp", "who": "IAGO", "lines": ["Lend me a garter. So. O, for a chair,", "To bear him easily hence!"], "id": 1147, "m": "Give me a garter. There. Oh, if only we had a chair to carry him away gently!"}, {"t": "sp", "who": "BIANCA", "lines": ["Alas, he faints! O Cassio, Cassio, Cassio!"], "id": 1148, "m": "Oh no, he's fainting! Oh, Cassio, Cassio, Cassio!"}, {"t": "sp", "who": "IAGO", "lines": ["Gentlemen all, I do suspect this trash", "To be a party in this injury.", "Patience awhile, good Cassio. Come, come;", "Lend me a light. Know we this face or no?", "Alas, my friend and my dear countryman", "Roderigo? No- yes, sure. O heaven! Roderigo."], "id": 1149, "m": "Gentlemen, I suspect this trash had a part in this attack. Be patient a little while, good Cassio. Come, come, give me a light. Do we know this face or not? Oh no, my friend and dear countryman Roderigo? No... yes, it is. Oh heaven! Roderigo."}, {"t": "sp", "who": "GRATIANO", "lines": ["What, of Venice?"], "id": 1150, "m": "What, Roderigo of Venice?"}, {"t": "sp", "who": "IAGO", "lines": ["Even he, sir. Did you know him?"], "id": 1151, "m": "The very same, sir. Did you know him?"}, {"t": "sp", "who": "GRATIANO", "lines": ["Know him! ay."], "id": 1152, "m": "Know him? Yes."}, {"t": "sp", "who": "IAGO", "lines": ["Signior Gratiano? I cry you gentle pardon;", "These bloody accidents must excuse my manners,", "That so neglected you."], "id": 1153, "m": "Signior Gratiano? I beg your pardon. These bloody events must excuse my bad manners in ignoring you."}, {"t": "sp", "who": "GRATIANO", "lines": ["I am glad to see you."], "id": 1154, "m": "I'm glad to see you."}, {"t": "sp", "who": "IAGO", "lines": ["How do you, Cassio? O, a chair, a chair!"], "id": 1155, "m": "How are you, Cassio? Oh, a chair, a chair!"}, {"t": "sp", "who": "GRATIANO", "lines": ["Roderigo!"], "id": 1156, "m": "Roderigo!"}, {"t": "sp", "who": "IAGO", "lines": ["He, he, 'tis he. [A chair brought in.] O, that's well said:", "the chair.", "Some good man bear him carefully from hence;", "I'll fetch the general's surgeon. [To Bianca.] For you, mistress,", "Save you your labor. He that lies slain here, Cassio,", "Was my dear friend; what malice was between you?"], "id": 1157, "m": "It's him, it's him. [A chair is brought in.] Oh, good, the chair. Someone carry him carefully away from here. I'll get the general's surgeon. [To Bianca.] As for you, madam, don't bother. Cassio, the man lying dead here was my dear friend. What quarrel was there between you?"}, {"t": "sp", "who": "CASSIO", "lines": ["None in the world; nor do I know the man."], "id": 1158, "m": "None at all. I don't even know the man."}, {"t": "sp", "who": "IAGO", "lines": ["[To Bianca.] What, look you pale? O, bear him out o' the air."], "id": 1159, "m": "[To Bianca.] What, are you pale? Oh, get him out of the night air."}, {"t": "sd", "text": "Cassio and Roderigo are borne off.", "id": 1160}, {"t": "sp", "who": "IAGO", "cont": 1, "lines": ["Stay you, good gentlemen. Look you pale, mistress?", "Do you perceive the gastness of her eye?", "Nay, if you stare, we shall hear more anon.", "Behold her well; I pray you, look upon her.", "Do you see, gentlemen? Nay, guiltiness will speak,", "Though tongues were out of use."], "id": 1161, "m": "Stay, good gentlemen. Are you pale, madam? Do you see the terror in her eyes? No, if you stare like that, we'll hear more soon. Look at her closely; please, look at her. Do you see, gentlemen? Guilt will speak for itself, even if no one says a word."}, {"t": "sd", "text": "Enter Emilia.", "id": 1162}, {"t": "sp", "who": "EMILIA", "lines": ["'Las, what's the matter? What's the matter, husband?"], "id": 1163, "m": "Oh no, what's the matter? What's the matter, husband?"}, {"t": "sp", "who": "IAGO", "lines": ["Cassio hath here been set on in the dark", "By Roderigo, and fellows that are 'scaped;", "He's almost slain, and Roderigo dead."], "id": 1164, "m": "Cassio was attacked here in the dark by Roderigo and some men who escaped. He's nearly dead, and Roderigo is dead."}, {"t": "sp", "who": "EMILIA", "lines": ["Alas, good gentleman! alas, good Cassio!"], "id": 1165, "m": "Oh no, the good gentleman! Oh, good Cassio!"}, {"t": "sp", "who": "IAGO", "lines": ["This is the fruit of whoring. Prithee, Emilia,", "Go know of Cassio where he supp'd tonight.", "What, do you shake at that?"], "id": 1166, "m": "This is what comes of whoring. Please, Emilia, go find out from Cassio where he had supper tonight. What, does that make you shake?"}, {"t": "sp", "who": "BIANCA", "lines": ["He supp'd at my house; but I therefore shake not."], "id": 1167, "m": "He had supper at my house, but that's not why I'm shaking."}, {"t": "sp", "who": "IAGO", "lines": ["O, did he so? I charge you, go with me."], "id": 1168, "m": "Oh, did he? I order you to come with me."}, {"t": "sp", "who": "EMILIA", "lines": ["Fie, fie upon thee, strumpet!"], "id": 1169, "m": "Shame on you, you whore!"}, {"t": "sp", "who": "BIANCA", "lines": ["I am no strumpet, but of life as honest", "As you that thus abuse me."], "id": 1170, "m": "I'm no whore. I live as honestly as you, who insult me like this."}, {"t": "sp", "who": "EMILIA", "lines": ["As I! foh! fie upon thee!"], "id": 1171, "m": "As me! Ugh! Shame on you!"}, {"t": "sp", "who": "IAGO", "lines": ["Kind gentlemen, let's go see poor Cassio dress'd.", "Come, mistress, you must tell's another tale.", "Emilia, run you to the citadel,", "And tell my lord and lady what hath happ'd!", "Will you go on? [Aside.] This is the night", "That either makes me or fordoes me quite."], "id": 1172, "m": "Kind gentlemen, let's go see poor Cassio's wounds dressed. Come, madam, you'll have to tell us a different story. Emilia, run to the fort and tell my lord and lady what's happened! Will you go ahead? [Aside.] This is the night that either makes me or completely ruins me."}, {"t": "sd", "text": "Exeunt.", "id": 1173}, {"t": "scene", "act": 5, "scene": "II", "loc": "A bedchamber in the castle. Desdemona in bed asleep; a light burning.", "id": 1174}, {"t": "sd", "text": "Enter Othello.", "id": 1175}, {"t": "sp", "who": "OTHELLO", "lines": ["It is the cause, it is the cause, my soul.", "Let me not name it to you, you chaste stars!", "It is the cause. Yet I'll not shed her blood,", "Nor scar that whiter skin of hers than snow", "And smooth as monumental alabaster.", "Yet she must die, else she'll betray more men.", "Put out the light, and then put out the light.", "If I quench thee, thou flaming minister,", "I can again thy former light restore,", "Should I repent me; but once put out thy light,", "Thou cunning'st pattern of excelling nature,", "I know not where is that Promethean heat", "That can thy light relume. When I have pluck'd the rose,", "I cannot give it vital growth again,", "It must needs wither; I'll smell it on the tree. [Kisses her.]", "O, balmy breath, that dost almost persuade", "Justice to break her sword! One more, one more;", "Be thus when thou art dead, and I will kill thee,", "And love thee after. One more, and this the last;", "So sweet was ne'er so fatal. I must weep,", "But they are cruel tears; this sorrow's heavenly,", "It strikes where it doth love. She wakes."], "id": 1176, "m": "It's the cause, it's the cause, my soul. Let me not name it to you, you chaste stars! It's the cause. Yet I won't shed her blood, or scar that skin of hers, whiter than snow and smooth as marble on a tomb. Yet she must die, or she'll betray more men. Put out the light, and then put out the light. If I put you out, you flaming candle, I can light you again if I change my mind. But once I put out your light, you most perfect model of nature's best work, I don't know where to find the divine fire that could relight you. Once I've picked the rose, I can't make it grow again. It has to wither. I'll smell it while it's still on the bush. [He kisses her.] Oh, sweet breath, that almost persuades Justice to break her sword! One more, one more. Be like this when you're dead, and I'll kill you and love you afterward. One more, and this is the last. Nothing so sweet was ever so deadly. I have to cry, but these are cruel tears. This sorrow is like heaven's: it punishes what it loves. She's waking up."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Who's there? Othello?"], "id": 1177, "m": "Who's there? Othello?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, Desdemona."], "id": 1178, "m": "Yes, Desdemona."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Will you come to bed, my lord?"], "id": 1179, "m": "Are you coming to bed, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Have you pray'd tonight, Desdemona?"], "id": 1180, "m": "Have you said your prayers tonight, Desdemona?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Ay, my lord."], "id": 1181, "m": "Yes, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["If you bethink yourself of any crime", "Unreconciled as yet to heaven and grace,", "Solicit for it straight."], "id": 1182, "m": "If you can think of any sin you haven't yet confessed to heaven and been forgiven for, pray for forgiveness right now."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas, my lord, what may you mean by that?"], "id": 1183, "m": "Oh, my lord, what do you mean by that?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Well, do it, and be brief; I will walk by.", "I would not kill thy unprepared spirit.", "No, heaven forfend! I would not kill thy soul."], "id": 1184, "m": "Well, do it, and be quick. I'll walk over here. I wouldn't want to kill your soul unprepared. No, heaven forbid! I wouldn't kill your soul."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Talk you of killing?"], "id": 1185, "m": "Are you talking about killing?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, I do."], "id": 1186, "m": "Yes, I am."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Then heaven have mercy on me!"], "id": 1187, "m": "Then heaven have mercy on me!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Amen, with all my heart!"], "id": 1188, "m": "Amen, with all my heart!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["If you say so, I hope you will not kill me."], "id": 1189, "m": "If you say that, I hope you won't kill me."}, {"t": "sp", "who": "OTHELLO", "lines": ["Hum!"], "id": 1190, "m": "Hmm!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["And yet I fear you, for you are fatal then", "When your eyes roll so. Why I should fear I know not,", "Since guiltiness I know not; but yet I feel I fear."], "id": 1191, "m": "And yet I'm afraid of you, because you're deadly when your eyes roll like that. I don't know why I should be afraid, since I know I'm not guilty. But still, I feel afraid."}, {"t": "sp", "who": "OTHELLO", "lines": ["Think on thy sins."], "id": 1192, "m": "Think about your sins."}, {"t": "sp", "who": "DESDEMONA", "lines": ["They are loves I bear to you."], "id": 1193, "m": "My only sins are the love I have for you."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, and for that thou diest."], "id": 1194, "m": "Yes, and that's why you die."}, {"t": "sp", "who": "DESDEMONA", "lines": ["That death's unnatural that kills for loving.", "Alas, why gnaw you so your nether lip?", "Some bloody passion shakes your very frame.", "These are portents; but yet I hope, I hope,", "They do not point on me."], "id": 1195, "m": "It's an unnatural death that kills someone for loving. Oh, why are you biting your lower lip like that? Some violent passion is shaking your whole body. These are bad signs. But still I hope, I hope, they aren't aimed at me."}, {"t": "sp", "who": "OTHELLO", "lines": ["Peace, and be still!"], "id": 1196, "m": "Quiet, and be still!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I will so. What's the matter?"], "id": 1197, "m": "I will. What's the matter?"}, {"t": "sp", "who": "OTHELLO", "lines": ["That handkerchief which I so loved and gave thee", "Thou gavest to Cassio."], "id": 1198, "m": "That handkerchief that I loved so much and gave you, you gave to Cassio."}, {"t": "sp", "who": "DESDEMONA", "lines": ["No, by my life and soul!", "Send for the man, and ask him."], "id": 1199, "m": "No, I swear on my life and soul! Send for him and ask him."}, {"t": "sp", "who": "OTHELLO", "lines": ["Sweet soul, take heed,", "Take heed of perjury; thou are on thy deathbed."], "id": 1200, "m": "Sweet soul, be careful. Be careful not to lie under oath. You're on your deathbed."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Ay, but not yet to die."], "id": 1201, "m": "Yes, but not to die yet."}, {"t": "sp", "who": "OTHELLO", "lines": ["Yes, presently:", "Therefore confess thee freely of thy sin,", "For to deny each article with oath", "Cannot remove nor choke the strong conception", "That I do groan withal. Thou art to die."], "id": 1202, "m": "Yes, right now. So confess your sin freely, because denying each charge under oath can't remove or smother the strong belief that's tormenting me. You are going to die."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Then Lord have mercy on me!"], "id": 1203, "m": "Then Lord have mercy on me!"}, {"t": "sp", "who": "OTHELLO", "lines": ["I say, amen."], "id": 1204, "m": "I say amen."}, {"t": "sp", "who": "DESDEMONA", "lines": ["And have you mercy too! I never did", "Offend you in my life; never loved Cassio", "But with such general warranty of heaven", "As I might love. I never gave him token."], "id": 1205, "m": "And you have mercy too! I never wronged you in my life. I never loved Cassio except in the general way heaven allows. I never gave him any keepsake."}, {"t": "sp", "who": "OTHELLO", "lines": ["By heaven, I saw my handkerchief in 's hand.", "O perjured woman! Thou dost stone my heart,", "And makest me call what I intend to do", "A murther, which I thought a sacrifice.", "I saw the handkerchief."], "id": 1206, "m": "By heaven, I saw my handkerchief in his hand. Oh, lying woman! You turn my heart to stone, and make me call what I'm going to do a murder, when I thought it was a sacrifice. I saw the handkerchief."}, {"t": "sp", "who": "DESDEMONA", "lines": ["He found it then;", "I never gave it him. Send for him hither;", "Let him confess a truth."], "id": 1207, "m": "Then he found it. I never gave it to him. Send for him. Let him confess the truth."}, {"t": "sp", "who": "OTHELLO", "lines": ["He hath confess'd."], "id": 1208, "m": "He has confessed."}, {"t": "sp", "who": "DESDEMONA", "lines": ["What, my lord?"], "id": 1209, "m": "Confessed what, my lord?"}, {"t": "sp", "who": "OTHELLO", "lines": ["That he hath used thee."], "id": 1210, "m": "That he has slept with you."}, {"t": "sp", "who": "DESDEMONA", "lines": ["How? unlawfully?"], "id": 1211, "m": "What? Unlawfully?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay."], "id": 1212, "m": "Yes."}, {"t": "sp", "who": "DESDEMONA", "lines": ["He will not say so."], "id": 1213, "m": "He won't say that."}, {"t": "sp", "who": "OTHELLO", "lines": ["No, his mouth is stopp'd;", "Honest Iago hath ta'en order for't."], "id": 1214, "m": "No, his mouth has been shut. Honest Iago has taken care of that."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, my fear interprets! What, is he dead?"], "id": 1215, "m": "Oh, my fear tells me what that means! What, is he dead?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Had all his hairs been lives, my great revenge", "Had stomach for them all."], "id": 1216, "m": "If every hair on his head had been a life, my great revenge would have had an appetite for all of them."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas, he is betray'd, and I undone!"], "id": 1217, "m": "Oh no, he's been betrayed, and I'm ruined!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Out, strumpet! Weep'st thou for him to my face?"], "id": 1218, "m": "Get out, whore! Are you crying for him to my face?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, banish me, my lord, but kill me not!"], "id": 1219, "m": "Oh, banish me, my lord, but don't kill me!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Down, strumpet!"], "id": 1220, "m": "Down, whore!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Kill me tomorrow; let me live tonight!"], "id": 1221, "m": "Kill me tomorrow; let me live tonight!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Nay, if you strive-"], "id": 1222, "m": "No, if you struggle—"}, {"t": "sp", "who": "DESDEMONA", "lines": ["But half an hour!"], "id": 1223, "m": "Just half an hour!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Being done, there is no pause."], "id": 1224, "m": "Now that it's started, there's no stopping."}, {"t": "sp", "who": "DESDEMONA", "lines": ["But while I say one prayer!"], "id": 1225, "m": "Just while I say one prayer!"}, {"t": "sp", "who": "OTHELLO", "lines": ["It is too late. [He stifles her.]"], "id": 1226, "m": "It's too late. [He smothers her.]"}, {"t": "sp", "who": "EMILIA", "lines": ["[Within.] My lord, my lord! What, ho! my lord, my lord!"], "id": 1227, "m": "[Offstage.] My lord, my lord! Hello! My lord, my lord!"}, {"t": "sp", "who": "OTHELLO", "lines": ["What noise is this? Not dead? not yet quite dead?", "I that am cruel am yet merciful;", "I would not have thee linger in thy pain.", "So, so."], "id": 1228, "m": "What's that noise? Not dead? Not quite dead yet? I may be cruel, but I'm still merciful. I don't want you to linger in pain. There, there."}, {"t": "sp", "who": "EMILIA", "lines": ["[Within.] What, ho! my lord, my lord!"], "id": 1229, "m": "[Offstage.] Hello! My lord, my lord!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Who's there?"], "id": 1230, "m": "Who's there?"}, {"t": "sp", "who": "EMILIA", "lines": ["[Within.] O, good my lord, I would speak a word with you!"], "id": 1231, "m": "[Offstage.] Oh, my good lord, I need to speak with you!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Yes, 'tis Emilia. By and by. She's dead.", "'Tis like she comes to speak of Cassio's death.", "The noise was here. Ha! no more moving?", "Still as the grave. Shall she come in? were't good?", "I think she stirs again. No. What's best to do?", "If she come in, she'll sure speak to my wife.", "My wife! My wife! What wife? I have no wife.", "O, insupportable! O heavy hour!", "Methinks it should be now a huge eclipse", "Of sun and moon, and that the affrighted globe", "Should yawn at alteration."], "id": 1232, "m": "Yes, it's Emilia. In a moment. She's dead. She's probably coming to tell me about Cassio's death. The noise was loud. Ha! No more moving? Still as the grave. Should I let her in? Would that be wise? I think she's moving again. No. What's the best thing to do? If she comes in, she'll certainly speak to my wife. My wife! My wife! What wife? I have no wife. Oh, unbearable! Oh, terrible hour! I think there should be a huge eclipse of the sun and moon right now, and the terrified earth should split open at this change."}, {"t": "sp", "who": "EMILIA", "lines": ["[Within.] I do beseech you", "That I may speak with you, O, good my lord!"], "id": 1233, "m": "[Offstage.] I beg you, let me speak with you. Oh, my good lord!"}, {"t": "sp", "who": "OTHELLO", "lines": ["I had forgot thee. O, come in, Emilia.", "Soft, by and by. Let me the curtains draw.", "Where art thou? [Unlocks the door.]"], "id": 1234, "m": "I forgot about you. Oh, come in, Emilia. Wait, just a moment. Let me close the bed curtains. Where are you? [He unlocks the door.]"}, {"t": "sd", "text": "Enter Emilia.", "id": 1235}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["What's the matter with thee now?"], "id": 1236, "m": "What's the matter with you now?"}, {"t": "sp", "who": "EMILIA", "lines": ["O, my good lord, yonder's foul murthers done!"], "id": 1237, "m": "Oh, my good lord, terrible murders have been committed out there!"}, {"t": "sp", "who": "OTHELLO", "lines": ["What, now?"], "id": 1238, "m": "What, just now?"}, {"t": "sp", "who": "EMILIA", "lines": ["But now, my lord."], "id": 1239, "m": "Just now, my lord."}, {"t": "sp", "who": "OTHELLO", "lines": ["It is the very error of the moon;", "She comes more nearer earth than she was wont", "And makes men mad."], "id": 1240, "m": "It's the moon going off course. She's come closer to the earth than usual, and it drives men mad."}, {"t": "sp", "who": "EMILIA", "lines": ["Cassio, my lord, hath kill'd a young Venetian", "Call'd Roderigo."], "id": 1241, "m": "My lord, Cassio has killed a young Venetian named Roderigo."}, {"t": "sp", "who": "OTHELLO", "lines": ["Roderigo kill'd?", "And Cassio kill'd?"], "id": 1242, "m": "Roderigo killed? And Cassio killed?"}, {"t": "sp", "who": "EMILIA", "lines": ["No, Cassio is not kill'd."], "id": 1243, "m": "No, Cassio's not killed."}, {"t": "sp", "who": "OTHELLO", "lines": ["Not Cassio kill'd! Then murther's out of tune,", "And sweet revenge grows harsh."], "id": 1244, "m": "Cassio's not killed! Then murder is out of tune, and sweet revenge turns harsh."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, falsely, falsely murther'd!"], "id": 1245, "m": "Oh, wrongly, wrongly murdered!"}, {"t": "sp", "who": "EMILIA", "lines": ["Alas, what cry is that?"], "id": 1246, "m": "Oh no, what was that cry?"}, {"t": "sp", "who": "OTHELLO", "lines": ["That? what?"], "id": 1247, "m": "That? What?"}, {"t": "sp", "who": "EMILIA", "lines": ["Out, and alas! That was my lady's voice.", "Help! help, ho! help! O lady, speak again!", "Sweet Desdemona! O sweet mistress, speak!"], "id": 1248, "m": "Oh, no! That was my lady's voice. Help! Help! Help! Oh, lady, speak again! Sweet Desdemona! Oh, sweet mistress, speak!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["A guiltless death I die."], "id": 1249, "m": "I die an innocent death."}, {"t": "sp", "who": "EMILIA", "lines": ["O, who hath done this deed?"], "id": 1250, "m": "Oh, who has done this?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["Nobody; I myself. Farewell;", "Commend me to my kind lord. O, farewell! [Dies.]"], "id": 1251, "m": "No one. I did it myself. Goodbye. Give my love to my kind husband. Oh, goodbye! [She dies.]"}, {"t": "sp", "who": "OTHELLO", "lines": ["Why, how should she be murther'd?"], "id": 1252, "m": "Why, how could she have been murdered?"}, {"t": "sp", "who": "EMILIA", "lines": ["Alas, who knows?"], "id": 1253, "m": "Oh, who knows?"}, {"t": "sp", "who": "OTHELLO", "lines": ["You heard her say herself, it was not I."], "id": 1254, "m": "You heard her say it herself: it wasn't me."}, {"t": "sp", "who": "EMILIA", "lines": ["She said so; I must needs report the truth."], "id": 1255, "m": "She said so. I have to report the truth."}, {"t": "sp", "who": "OTHELLO", "lines": ["She's like a liar gone to burning hell;", "'Twas I that kill'd her."], "id": 1256, "m": "She's gone to burning hell like the liar she was. It was I who killed her."}, {"t": "sp", "who": "EMILIA", "lines": ["O, the more angel she,", "And you the blacker devil!"], "id": 1257, "m": "Oh, then she's even more of an angel, and you're an even blacker devil!"}, {"t": "sp", "who": "OTHELLO", "lines": ["She turn'd to folly, and she was a whore."], "id": 1258, "m": "She turned to sin, and she was a whore."}, {"t": "sp", "who": "EMILIA", "lines": ["Thou dost belie her, and thou art a devil."], "id": 1259, "m": "You're lying about her, and you're a devil."}, {"t": "sp", "who": "OTHELLO", "lines": ["She was false as water."], "id": 1260, "m": "She was as unfaithful as water."}, {"t": "sp", "who": "EMILIA", "lines": ["Thou art rash as fire, to say", "That she was false. O, she was heavenly true!"], "id": 1261, "m": "You're as reckless as fire to say she was unfaithful. Oh, she was heavenly true!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Cassio did top her; ask thy husband else.", "O, I were damn'd beneath all depth in hell,", "But that I did proceed upon just grounds", "To this extremity. Thy husband knew it all."], "id": 1262, "m": "Cassio slept with her. Ask your husband if you don't believe me. Oh, I'd be damned to the lowest depths of hell if I hadn't had good reason to go this far. Your husband knew all about it."}, {"t": "sp", "who": "EMILIA", "lines": ["My husband?"], "id": 1263, "m": "My husband?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Thy husband."], "id": 1264, "m": "Your husband."}, {"t": "sp", "who": "EMILIA", "lines": ["That she was false to wedlock?"], "id": 1265, "m": "That she was unfaithful to her marriage?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, with Cassio. Nay, had she been true,", "If heaven would make me such another world", "Of one entire and perfect chrysolite,", "I'ld not have sold her for it."], "id": 1266, "m": "Yes, with Cassio. No, if she'd been faithful, I wouldn't have traded her even if heaven had made me another world out of a single perfect jewel."}, {"t": "sp", "who": "EMILIA", "lines": ["My husband?"], "id": 1267, "m": "My husband?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Ay, 'twas he that told me first.", "An honest man he is, and hates the slime", "That sticks on filthy deeds."], "id": 1268, "m": "Yes, he was the one who told me first. He's an honest man, and he hates the filth that sticks to dirty deeds."}, {"t": "sp", "who": "EMILIA", "lines": ["My husband?"], "id": 1269, "m": "My husband?"}, {"t": "sp", "who": "OTHELLO", "lines": ["What needs this iteration, woman? I say thy husband."], "id": 1270, "m": "Why do you keep repeating it, woman? I said your husband."}, {"t": "sp", "who": "EMILIA", "lines": ["O mistress, villainy hath made mocks with love!", "My husband say that she was false!"], "id": 1271, "m": "Oh, mistress, villainy has made a mockery of love! My husband said she was unfaithful!"}, {"t": "sp", "who": "OTHELLO", "lines": ["He, woman;", "I say thy husband. Dost understand the word?", "My friend, thy husband, honest, honest Iago."], "id": 1272, "m": "Him, woman. I said your husband. Do you understand the word? My friend, your husband, honest, honest Iago."}, {"t": "sp", "who": "EMILIA", "lines": ["If he say so, may his pernicious soul", "Rot half a grain a day! He lies to the heart.", "She was too fond of her most filthy bargain."], "id": 1273, "m": "If he says so, may his evil soul rot a little bit every day! He's lying through his teeth. She loved her filthy bargain far too much."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ha!"], "id": 1274, "m": "Ha!"}, {"t": "sp", "who": "EMILIA", "lines": ["Do thy worst;", "This deed of thine is no more worthy heaven", "Than thou wast worthy her."], "id": 1275, "m": "Do your worst. This deed of yours is no more worthy of heaven than you were worthy of her."}, {"t": "sp", "who": "OTHELLO", "lines": ["Peace, you were best."], "id": 1276, "m": "You'd better keep quiet."}, {"t": "sp", "who": "EMILIA", "lines": ["Thou hast not half that power to do me harm", "As I have to be hurt. O gull! O dolt!", "As ignorant as dirt! Thou hast done a deed-", "I care not for thy sword; I'll make thee known,", "Though I lost twenty lives. Help! help, ho! help!", "The Moor hath kill'd my mistress! Murther, murther!"], "id": 1277, "m": "You don't have half the power to hurt me that I have to endure it. Oh, you idiot! You fool! As ignorant as dirt! You've done a deed... I don't care about your sword. I'll expose you, even if I lose twenty lives. Help! Help! Help! The Moor has killed my mistress! Murder, murder!"}, {"t": "sd", "text": "Enter Montano, Gratiano, Iago, and others.", "id": 1278}, {"t": "sp", "who": "MONTANO", "lines": ["What is the matter? How now, general?"], "id": 1279, "m": "What's the matter? What's going on, general?"}, {"t": "sp", "who": "EMILIA", "lines": ["O, are you come, Iago? You have done well,", "That men must lay their murthers on your neck."], "id": 1280, "m": "Oh, there you are, Iago? You've done well, so that men have to blame you for their murders."}, {"t": "sp", "who": "GRATIANO", "lines": ["What is the matter?"], "id": 1281, "m": "What's the matter?"}, {"t": "sp", "who": "EMILIA", "lines": ["Disprove this villain, if thou be'st a man.", "He says thou told'st him that his wife was false;", "I know thou didst not, thou'rt not such a villain.", "Speak, for my heart is full."], "id": 1282, "m": "Prove this villain wrong, if you're a man. He says you told him his wife was unfaithful. I know you didn't; you're not that kind of villain. Speak, because my heart is about to burst."}, {"t": "sp", "who": "IAGO", "lines": ["I told him what I thought, and told no more", "Than what he found himself was apt and true."], "id": 1283, "m": "I told him what I thought, and told him nothing more than what he found to be plausible and true himself."}, {"t": "sp", "who": "EMILIA", "lines": ["But did you ever tell him she was false?"], "id": 1284, "m": "But did you ever tell him she was unfaithful?"}, {"t": "sp", "who": "IAGO", "lines": ["I did."], "id": 1285, "m": "I did."}, {"t": "sp", "who": "EMILIA", "lines": ["You told a lie, an odious, damned lie;", "Upon my soul, a lie, a wicked lie!", "She false with Cassio? Did you say with Cassio?"], "id": 1286, "m": "You told a lie, a hateful, damned lie. I swear on my soul, a lie, a wicked lie! She was unfaithful with Cassio? Did you say with Cassio?"}, {"t": "sp", "who": "IAGO", "lines": ["With Cassio, mistress. Go to, charm your tongue."], "id": 1287, "m": "With Cassio, woman. Go on, hold your tongue."}, {"t": "sp", "who": "EMILIA", "lines": ["I will not charm my tongue; I am bound to speak.", "My mistress here lies murther'd in her bed-"], "id": 1288, "m": "I won't hold my tongue. I have to speak. My mistress is lying here murdered in her bed—"}, {"t": "sp", "who": "ALL", "lines": ["O heavens forfend!"], "id": 1289, "m": "Oh, heaven forbid!"}, {"t": "sp", "who": "EMILIA", "lines": ["And your reports have set the murther on."], "id": 1290, "m": "And your stories led to the murder."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nay, stare not, masters; it is true indeed."], "id": 1291, "m": "No, don't stare, gentlemen. It's true."}, {"t": "sp", "who": "GRATIANO", "lines": ["'Tis a strange truth."], "id": 1292, "m": "It's a strange truth."}, {"t": "sp", "who": "MONTANO", "lines": ["O monstrous act!"], "id": 1293, "m": "Oh, monstrous deed!"}, {"t": "sp", "who": "EMILIA", "lines": ["Villainy, villainy, villainy!", "I think upon't, I think, I smell't, O villainy!", "I thought so then. I'll kill myself for grief.", "O villainy, villainy!"], "id": 1294, "m": "Villainy, villainy, villainy! I'm thinking about it, I'm thinking, I can smell it. Oh, villainy! I suspected it back then. I'll kill myself with grief. Oh, villainy, villainy!"}, {"t": "sp", "who": "IAGO", "lines": ["What, are you mad? I charge you, get you home."], "id": 1295, "m": "What, are you crazy? I order you, go home."}, {"t": "sp", "who": "EMILIA", "lines": ["Good gentlemen, let me have leave to speak;", "'Tis proper I obey him, but not now.", "Perchance, Iago, I will ne'er go home."], "id": 1296, "m": "Good gentlemen, let me speak. It's right for me to obey him, but not now. Maybe, Iago, I'll never go home."}, {"t": "sp", "who": "OTHELLO", "lines": ["O! O! O! [Falls on the bed.]"], "id": 1297, "m": "Oh! Oh! Oh! [He falls on the bed.]"}, {"t": "sp", "who": "EMILIA", "lines": ["Nay, lay thee down and roar;", "For thou hast kill'd the sweetest innocent", "That e'er did lift up eye."], "id": 1298, "m": "Yes, lie down and roar, because you've killed the sweetest innocent woman who ever looked up to heaven."}, {"t": "sp", "who": "OTHELLO", "lines": ["[Rises.] O, she was foul!", "I scarce did know you, uncle; there lies your niece,", "Whose breath indeed these hands have newly stopp'd.", "I know this act shows horrible and grim."], "id": 1299, "m": "[Standing.] Oh, she was filthy! I hardly recognized you, uncle. There lies your niece, whose breath these hands have just stopped. I know this looks horrible and grim."}, {"t": "sp", "who": "GRATIANO", "lines": ["Poor Desdemon! I am glad thy father's dead.", "Thy match was mortal to him, and pure grief", "Shore his old thread in twain; did he live now,", "This sight would make him do a desperate turn,", "Yea, curse his better angel from his side,", "And fall to reprobation."], "id": 1300, "m": "Poor Desdemona! I'm glad your father's dead. Your marriage killed him; pure grief cut his old thread of life in two. If he were alive now, this sight would drive him to some desperate act. He'd curse his guardian angel away and fall into damnation."}, {"t": "sp", "who": "OTHELLO", "lines": ["'Tis pitiful, but yet Iago knows", "That she with Cassio hath the act of shame", "A thousand times committed. Cassio confess'd it,", "And she did gratify his amorous works", "With that recognizance and pledge of love", "Which I first gave her. I saw it in his hand,", "It was a handkerchief, an antique token", "My father gave my mother."], "id": 1301, "m": "It's pitiful. But Iago knows that she committed the shameful act with Cassio a thousand times. Cassio confessed it. And she rewarded his lovemaking with the keepsake and token of love I first gave her. I saw it in his hand. It was a handkerchief, an old token my father gave my mother."}, {"t": "sp", "who": "EMILIA", "lines": ["O heaven! O heavenly powers!"], "id": 1302, "m": "Oh, heaven! Oh, heavenly powers!"}, {"t": "sp", "who": "IAGO", "lines": ["'Zounds! Hold your peace."], "id": 1303, "m": "Damn it! Be quiet."}, {"t": "sp", "who": "EMILIA", "lines": ["'Twill out, 'twill. I peace?", "No, I will speak as liberal as the north;", "Let heaven and men and devils, let them all,", "All, all, cry shame against me, yet I'll speak."], "id": 1304, "m": "It'll come out, it will. Me, be quiet? No, I'll speak as freely as the north wind. Let heaven and men and devils, let all of them, all, all, cry shame on me, and I'll still speak."}, {"t": "sp", "who": "IAGO", "lines": ["Be wise, and get you home."], "id": 1305, "m": "Be smart and go home."}, {"t": "sp", "who": "EMILIA", "lines": ["I will not."], "id": 1306, "m": "I won't."}, {"t": "sd", "text": "Iago offers to stab Emilia.", "id": 1307}, {"t": "sp", "who": "GRATIANO", "lines": ["Fie!", "Your sword upon a woman?"], "id": 1308, "m": "Shame! Drawing your sword on a woman?"}, {"t": "sp", "who": "EMILIA", "lines": ["O thou dull Moor! That handkerchief thou speak'st of", "I found by fortune and did give my husband,", "For often with a solemn earnestness,", "More than indeed belong'd to such a trifle,", "He begg'd of me to steal it."], "id": 1309, "m": "Oh, you stupid Moor! That handkerchief you're talking about, I found by chance and gave to my husband. Because he often begged me, with a seriousness far too great for such a trivial thing, to steal it."}, {"t": "sp", "who": "IAGO", "lines": ["Villainous whore!"], "id": 1310, "m": "Wicked whore!"}, {"t": "sp", "who": "EMILIA", "lines": ["She give it Cassio? No, alas, I found it,", "And I did give't my husband."], "id": 1311, "m": "She gave it to Cassio? No, I found it, and I gave it to my husband."}, {"t": "sp", "who": "IAGO", "lines": ["Filth, thou liest!"], "id": 1312, "m": "Filth, you're lying!"}, {"t": "sp", "who": "EMILIA", "lines": ["By heaven, I do not, I do not, gentlemen.", "O murtherous coxcomb! What should such a fool", "Do with so good a wife?"], "id": 1313, "m": "By heaven, I'm not, I'm not, gentlemen. Oh, murderous idiot! What was a fool like you doing with such a good wife?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Are there not stones in heaven", "But what serve for thunder? Precious villain!"], "id": 1314, "m": "Aren't there any thunderbolts in heaven except the ones used for thunder? Absolute villain!"}, {"t": "sd", "text": "He runs at Iago, but Montano disarms him. Iago stabs Emilia.", "id": 1315}, {"t": "sp", "who": "GRATIANO", "lines": ["The woman falls; sure, he hath kill'd his wife."], "id": 1316, "m": "The woman's falling. He must have killed his wife."}, {"t": "sp", "who": "EMILIA", "lines": ["Ay, ay! O, lay me by my mistress' side."], "id": 1317, "m": "Yes, yes! Oh, lay me beside my mistress."}, {"t": "sd", "text": "Exit Iago.", "id": 1318}, {"t": "sp", "who": "GRATIANO", "lines": ["He's gone, but his wife's kill'd."], "id": 1319, "m": "He's gone, but his wife is killed."}, {"t": "sp", "who": "MONTANO", "lines": ["'Tis a notorious villain. Take you this weapon,", "Which I have here recover'd from the Moor.", "Come, guard the door without; let him not pass,", "But kill him rather. I'll after that same villain,", "For 'tis a damned slave."], "id": 1320, "m": "He's an infamous villain. Take this weapon, which I've just taken from the Moor. Come, guard the door from outside. Don't let him pass; kill him first. I'll go after that villain, because he's a damned slave."}, {"t": "sd", "text": "Exeunt all but Othello and Emilia.", "id": 1321}, {"t": "sp", "who": "OTHELLO", "lines": ["I am not valiant neither,", "But every puny whipster gets my sword.", "But why should honor outlive honesty?", "Let it go all."], "id": 1322, "m": "I'm not brave anymore either; any puny little fighter can take my sword. But why should my reputation outlive my honor? Let it all go."}, {"t": "sp", "who": "EMILIA", "lines": ["What did thy song bode, lady?", "Hark, canst thou hear me? I will play the swan,", "And die in music. [Sings.] \"Willow, willow, willow.\"", "Moor, she was chaste; she loved thee, cruel Moor;", "So come my soul to bliss, as I speak true;", "So speaking as I think, I die, I die. [Dies.]"], "id": 1323, "m": "What did your song predict, lady? Listen, can you hear me? I'll be like the swan and die singing. [Singing.] \"Willow, willow, willow.\" Moor, she was chaste. She loved you, cruel Moor. May my soul go to heaven as I'm telling the truth. Saying what I believe, I die, I die. [She dies.]"}, {"t": "sp", "who": "OTHELLO", "lines": ["I have another weapon in this chamber;", "It is a sword of Spain, the ice-brook's temper-", "O, here it is. Uncle, I must come forth."], "id": 1324, "m": "I have another weapon in this room. It's a Spanish sword, tempered in icy water. Oh, here it is. Uncle, I have to come out."}, {"t": "sp", "who": "GRATIANO", "lines": ["[Within.] If thou attempt it, it will cost thee dear.", "Thou hast no weapon, and perforce must suffer."], "id": 1325, "m": "[Offstage.] If you try, it'll cost you. You have no weapon, so you'll have to accept what happens."}, {"t": "sp", "who": "OTHELLO", "lines": ["Look in upon me then, and speak with me,", "Or, naked as I am, I will assault thee."], "id": 1326, "m": "Then come in and talk to me, or, unarmed as I am, I'll attack you."}, {"t": "sd", "text": "Re-enter Gratiano.", "id": 1327}, {"t": "sp", "who": "GRATIANO", "lines": ["What is the matter?"], "id": 1328, "m": "What's the matter?"}, {"t": "sp", "who": "OTHELLO", "lines": ["Behold, I have a weapon;", "A better never did itself sustain", "Upon a soldier's thigh. I have seen the day", "That with this little arm and this good sword", "I have made my way through more impediments", "Than twenty times your stop. But, O vain boast!", "Who can control his fate? 'Tis not so now.", "Be not afraid, though you do see me weapon'd;", "Here is my journey's end, here is my butt", "And very sea-mark of my utmost sail.", "Do you go back dismay'd? 'Tis a lost fear.", "Man but a rush against Othello's breast,", "And he retires. Where should Othello go?", "Now, how dost thou look now? O ill-starr'd wench!", "Pale as thy smock! When we shall meet at compt,", "This look of thine will hurl my soul from heaven,", "And fiends will snatch at it. Cold, cold, my girl?", "Even like thy chastity. O cursed, cursed slave!", "Whip me, ye devils,", "From the possession of this heavenly sight!", "Blow me about in winds! Roast me in sulphur!", "Wash me in steep-down gulfs of liquid fire!", "O Desdemon! dead, Desdemon! dead!", "O! O! O!"], "id": 1329, "m": "Look, I have a weapon. A better one never hung at a soldier's side. I've seen the day when, with this little arm and this good sword, I fought my way through obstacles twenty times stronger than you. But, oh, what an empty boast! Who can control his fate? It's not like that now. Don't be afraid, even though you see me armed. This is the end of my journey, my final goal, the landmark of my last voyage. Are you backing away in fear? There's no need. Just point a reed at Othello's chest, and he'll retreat. Where would Othello go? Now, how do you look now? Oh, unlucky girl! Pale as your nightgown! When we meet on Judgment Day, this look of yours will hurl my soul out of heaven, and devils will snatch it up. Cold, cold, my girl? Just like your chastity. Oh, cursed, cursed slave that I am! Whip me, you devils, away from the sight of this heavenly creature! Blow me around in the winds! Roast me in sulfur! Wash me in deep pits of liquid fire! Oh, Desdemona! Dead, Desdemona! Dead! Oh! Oh! Oh!"}, {"t": "sd", "text": "Enter Lodovico, Montano, Cassio carried in a chair, and Officers with Iago, prisoner.", "id": 1330}, {"t": "sp", "who": "LODOVICO", "lines": ["Where is this rash and most unfortunate man?"], "id": 1331, "m": "Where is this reckless and most unfortunate man?"}, {"t": "sp", "who": "OTHELLO", "lines": ["That's he that was Othello. Here I am."], "id": 1332, "m": "That's the man who used to be Othello. Here I am."}, {"t": "sp", "who": "LODOVICO", "lines": ["Where is that viper? Bring the villain forth."], "id": 1333, "m": "Where's that snake? Bring the villain
