 I am charged withal-", "I won his daughter."], "id": 127, "m": "Most powerful, serious, and respected lords, my noble and proven masters: it's true that I've taken this old man's daughter. It's true; I've married her. That's the full extent of my offense, no more. I'm rough in my speech and not gifted with the smooth language of peacetime. Since I was seven years old, until about nine months ago, these arms have done their best work on the battlefield, and I can say little about the wider world beyond fighting and battle. So I won't help my case much by speaking for myself. Still, with your kind patience, I'll tell you a plain, unpolished story of my whole courtship: what drugs, what charms, what spells, and what powerful magic (since that's what I'm accused of) I used to win his daughter."}, {"t": "sp", "who": "BRABANTIO", "lines": ["A maiden never bold,", "Of spirit so still and quiet that her motion", "Blush'd at herself; and she- in spite of nature,", "Of years, of country, credit, everything-", "To fall in love with what she fear'd to look on!", "It is judgement maim'd and most imperfect,", "That will confess perfection so could err", "Against all rules of nature, and must be driven", "To find out practices of cunning hell", "Why this should be. I therefore vouch again", "That with some mixtures powerful o'er the blood,", "Or with some dram conjured to this effect,", "He wrought upon her."], "id": 128, "m": "A girl who was never bold, so quiet and shy that she blushed at her own feelings. And she, against her nature, her age, her country, her reputation, everything, fell in love with what she was afraid to look at! Only a crippled and faulty judgment would claim that perfection could go so wrong against all the rules of nature. One has to look to the tricks of cunning hell to explain it. So I swear again that he worked on her with some potion that affects the blood, or some drug enchanted for this purpose."}, {"t": "sp", "who": "DUKE", "lines": ["To vouch this is no proof,", "Without more certain and more overt test", "Than these thin habits and poor likelihoods", "Of modern seeming do prefer against him."], "id": 129, "m": "Swearing it isn't proof. You need clearer and more direct evidence than these flimsy appearances and weak assumptions you're bringing against him."}, {"t": "sp", "who": "FIRST SENATOR", "lines": ["But, Othello, speak.", "Did you by indirect and forced courses", "Subdue and poison this young maid's affections?", "Or came it by request, and such fair question", "As soul to soul affordeth?"], "id": 130, "m": "But Othello, speak. Did you use underhanded and forced methods to overpower and poison this young woman's affections? Or did it come through courtship and honest conversation, soul to soul?"}, {"t": "sp", "who": "OTHELLO", "lines": ["I do beseech you,", "Send for the lady to the Sagittary,", "And let her speak of me before her father.", "If you do find me foul in her report,", "The trust, the office I do hold of you,", "Not only take away, but let your sentence", "Even fall upon my life."], "id": 131, "m": "I beg you, send for the lady at the Sagittary and let her speak about me in front of her father. If her account shows me guilty, don't just take away the trust and command you've given me: let your sentence fall on my life."}, {"t": "sp", "who": "DUKE", "lines": ["Fetch Desdemona hither."], "id": 132, "m": "Bring Desdemona here."}, {"t": "sp", "who": "OTHELLO", "lines": ["Ancient, conduct them; you best know the place."], "id": 133, "m": "Ensign, take them; you know the place best."}, {"t": "sd", "text": "Exeunt Iago and Attendants.", "id": 134}, {"t": "sp", "who": "OTHELLO", "cont": 1, "lines": ["And till she come, as truly as to heaven", "I do confess the vices of my blood,", "So justly to your grave ears I'll present", "How I did thrive in this fair lady's love", "And she in mine."], "id": 135, "m": "And until she comes, as honestly as I confess my sins to heaven, I'll tell your serious ears how I won this fair lady's love, and she won mine."}, {"t": "sp", "who": "DUKE", "lines": ["Say it, Othello."], "id": 136, "m": "Tell us, Othello."}, {"t": "sp", "who": "OTHELLO", "lines": ["Her father loved me, oft invited me,", "Still question'd me the story of my life", "From year to year, the battles, sieges, fortunes,", "That I have pass'd.", "I ran it through, even from my boyish days", "To the very moment that he bade me tell it:", "Wherein I spake of most disastrous chances,", "Of moving accidents by flood and field,", "Of hair-breadth 'scapes i' the imminent deadly breach,", "Of being taken by the insolent foe", "And sold to slavery, of my redemption thence", "And portance in my travels' history;", "Wherein of antres vast and deserts idle,", "Rough quarries, rocks, and hills whose heads touch heaven,", "It was my hint to speak- such was the process-", "And of the Cannibals that each other eat,", "The Anthropophagi, and men whose heads", "Do grow beneath their shoulders. This to hear", "Would Desdemona seriously incline;", "But still the house affairs would draw her thence,", "Which ever as she could with haste dispatch,", "She'ld come again, and with a greedy ear", "Devour up my discourse; which I observing,", "Took once a pliant hour, and found good means", "To draw from her a prayer of earnest heart", "That I would all my pilgrimage dilate,", "Whereof by parcels she had something heard,", "But not intentively. I did consent,", "And often did beguile her of her tears", "When I did speak of some distressful stroke", "That my youth suffer'd. My story being done,", "She gave me for my pains a world of sighs;", "She swore, in faith, 'twas strange, 'twas passing strange;", "'Twas pitiful, 'twas wondrous pitiful.", "She wish'd she had not heard it, yet she wish'd", "That heaven had made her such a man; she thank'd me,", "And bade me, if I had a friend that loved her,", "I should but teach him how to tell my story,", "And that would woo her. Upon this hint I spake:", "She loved me for the dangers I had pass'd,", "And I loved her that she did pity them.", "This only is the witchcraft I have used.", "Here comes the lady; let her witness it."], "id": 137, "m": "Her father loved me and often invited me over. He kept asking me the story of my life, year by year: the battles, sieges, and fortunes I'd been through. I told it all, from my boyhood up to the moment he asked. I talked about terrible disasters, thrilling adventures at sea and on land, narrow escapes from death when the walls were breached, being captured by an arrogant enemy and sold into slavery, buying my freedom, and how I behaved in all my travels. I described huge caves and empty deserts, rough quarries, rocks, and mountains so high they touch heaven; that was my story. And I told of the cannibals who eat each other, the Anthropophagi, and men whose heads grow beneath their shoulders. Desdemona would lean in eagerly to hear all this. But household chores would keep pulling her away, and whenever she could finish them quickly, she'd come back and devour my words with a hungry ear. Noticing that, I found a good moment and got her to beg me sincerely to tell her my whole journey in full, since she'd only heard bits and pieces, not the whole story. I agreed, and often brought her to tears when I talked about some painful blow I suffered in my youth. When I finished, she gave me a world of sighs for my trouble. She swore it was strange, truly strange, pitiful, so incredibly pitiful. She wished she hadn't heard it, yet she wished heaven had made her a man like that. She thanked me and told me that if I had a friend who loved her, I should just teach him how to tell my story, and that would win her. With that hint, I spoke up. She loved me for the dangers I had been through, and I loved her because she pitied them. That's the only witchcraft I've used. Here comes the lady; let her confirm it."}, {"t": "sd", "text": "Enter Desdemona, Iago, and Attendants.", "id": 138}, {"t": "sp", "who": "DUKE", "lines": ["I think this tale would win my daughter too.", "Good Brabantio,", "Take up this mangled matter at the best:", "Men do their broken weapons rather use", "Than their bare hands."], "id": 139, "m": "I think a story like that would win my daughter too. Good Brabantio, make the best of this messy situation. Men would rather fight with broken weapons than with their bare hands."}, {"t": "sp", "who": "BRABANTIO", "lines": ["I pray you, hear her speak.", "If she confess that she was half the wooer,", "Destruction on my head, if my bad blame", "Light on the man! Come hither, gentle mistress.", "Do you perceive in all this noble company", "Where most you owe obedience?"], "id": 140, "m": "Please, hear her speak. If she admits she was half the wooer, let me be destroyed if I blame the man! Come here, gentle lady. Do you see, in this noble company, to whom you owe the most obedience?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My noble father,", "I do perceive here a divided duty.", "To you I am bound for life and education;", "My life and education both do learn me", "How to respect you; you are the lord of duty,", "I am hitherto your daughter. But here's my husband,", "And so much duty as my mother show'd", "To you, preferring you before her father,", "So much I challenge that I may profess", "Due to the Moor, my lord."], "id": 141, "m": "My noble father, I see that my duty is divided here. To you I owe my life and upbringing, and both teach me to respect you. You're the one I owe duty to; so far I've been your daughter. But here is my husband. And just as much duty as my mother showed you, putting you before her own father, I claim the right to show to the Moor, my husband."}, {"t": "sp", "who": "BRABANTIO", "lines": ["God be with you! I have done.", "Please it your Grace, on to the state affairs;", "I had rather to adopt a child than get it.", "Come hither, Moor.", "I here do give thee that with all my heart", "Which, but thou hast already, with all my heart", "I would keep from thee. For your sake, jewel,", "I am glad at soul I have no other child;", "For thy escape would teach me tyranny,", "To hang clogs on them. I have done, my lord."], "id": 142, "m": "God be with you! I'm done. Your Grace, please, go on to the state business. I'd rather adopt a child than have one of my own. Come here, Moor. I give you, with all my heart, what I'd keep from you with all my heart if you didn't already have it. Because of you, my jewel, I'm glad in my soul I have no other children, because your escape would make me a tyrant, chaining them up. I'm done, my lord."}, {"t": "sp", "who": "DUKE", "lines": ["Let me speak like yourself, and lay a sentence", "Which, as a grise or step, may help these lovers", "Into your favor.", "When remedies are past, the griefs are ended", "By seeing the worst, which late on hopes depended.", "To mourn a mischief that is past and gone", "Is the next way to draw new mischief on.", "What cannot be preserved when Fortune takes,", "Patience her injury a mockery makes.", "The robb'd that smiles steals something from the thief;", "He robs himself that spends a bootless grief."], "id": 143, "m": "Let me speak as you would, and offer some wise sayings that might be a step to help these lovers back into your good graces. When there's no cure left, grief ends once we see the worst that we used to hope wouldn't happen. Mourning a misfortune that's past and gone is the surest way to bring a new one. When Fortune takes what can't be saved, patience makes a joke of the injury. The robbed man who smiles steals something back from the thief; the one who wastes time on useless grief robs himself."}, {"t": "sp", "who": "BRABANTIO", "lines": ["So let the Turk of Cyprus us beguile;", "We lose it not so long as we can smile.", "He bears the sentence well, that nothing bears", "But the free comfort which from thence he hears;", "But he bears both the sentence and the sorrow", "That, to pay grief, must of poor patience borrow.", "These sentences, to sugar or to gall,", "Being strong on both sides, are equivocal.", "But words are words; I never yet did hear", "That the bruised heart was pierced through the ear.", "I humbly beseech you, proceed to the affairs of state."], "id": 144, "m": "So let the Turks cheat us out of Cyprus; we haven't lost it as long as we can smile. A man takes this advice well when it costs him nothing and he only hears the free comfort in it. But a man who must pay off his grief by borrowing from his poor patience has to bear both the advice and the sorrow. These sayings, sweet or bitter, cut both ways, so they mean nothing. Words are just words. I've never heard of a bruised heart being healed through the ear. I humbly beg you, go on with the affairs of state."}, {"t": "sp", "who": "DUKE", "lines": ["The Turk with a most mighty preparation makes for Cyprus.", "Othello, the fortitude of the place is best known to you; and", "though we have there a substitute of most allowed sufficiency,", "yet opinion, a sovereign mistress of effects, throws a more safer", "voice on you. You must therefore be content to slubber the gloss", "of your new fortunes with this more stubborn and boisterous", "expedition."], "id": 145, "m": "The Turk is heading for Cyprus with a huge force. Othello, you know that place's defenses best. Although we have a highly capable deputy there, public opinion, which ultimately decides things, has more confidence in you. So you'll have to accept tarnishing the shine of your new happiness with this rougher, more violent expedition."}, {"t": "sp", "who": "OTHELLO", "lines": ["The tyrant custom, most grave senators,", "Hath made the flinty and steel couch of war", "My thrice-driven bed of down. I do agnize", "A natural and prompt alacrity", "I find in hardness and do undertake", "These present wars against the Ottomites.", "Most humbly therefore bending to your state,", "I crave fit disposition for my wife,", "Due reference of place and exhibition,", "With such accommodation and besort", "As levels with her breeding."], "id": 146, "m": "Habit, that tyrant, most serious senators, has made the hard, stony, steel bed of war feel to me like the softest feather bed. I admit I feel a natural, eager readiness for hardship, and I take on this war against the Turks. So, humbly bowing to your authority, I ask for proper arrangements for my wife: suitable lodging, an allowance, and the kind of accommodation and company that fits her upbringing."}, {"t": "sp", "who": "DUKE", "lines": ["If you please,", "Be't at her father's."], "id": 147, "m": "If you like, she can stay at her father's."}, {"t": "sp", "who": "BRABANTIO", "lines": ["I'll not have it so."], "id": 148, "m": "I won't have it."}, {"t": "sp", "who": "OTHELLO", "lines": ["Nor I."], "id": 149, "m": "Nor will I."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Nor I. I would not there reside", "To put my father in impatient thoughts", "By being in his eye. Most gracious Duke,", "To my unfolding lend your prosperous ear,", "And let me find a charter in your voice", "To assist my simpleness."], "id": 150, "m": "Nor will I. I wouldn't live there and upset my father by being in his sight. Most gracious Duke, listen kindly to what I have to say, and let your support help my inexperience."}, {"t": "sp", "who": "DUKE", "lines": ["What would you, Desdemona?"], "id": 151, "m": "What do you want, Desdemona?"}, {"t": "sp", "who": "DESDEMONA", "lines": ["That I did love the Moor to live with him,", "My downright violence and storm of fortunes", "May trumpet to the world. My heart's subdued", "Even to the very quality of my lord.", "I saw Othello's visage in his mind,", "And to his honors and his valiant parts", "Did I my soul and fortunes consecrate.", "So that, dear lords, if I be left behind,", "A moth of peace, and he go to the war,", "The rites for which I love him are bereft me,", "And I a heavy interim shall support", "By his dear absence. Let me go with him."], "id": 152, "m": "That I loved the Moor enough to live with him, my bold break with convention and my reckless gamble with my future can announce to the world. My heart has been won over by his very nature. I saw Othello's true face in his mind, and I dedicated my soul and fortune to his honor and his courage. So, dear lords, if I'm left behind, a useless moth living in peace while he goes to war, I'm robbed of the very things I love him for, and I'll have to endure a heavy wait in his absence. Let me go with him."}, {"t": "sp", "who": "OTHELLO", "lines": ["Let her have your voices.", "Vouch with me, heaven, I therefore beg it not", "To please the palate of my appetite,", "Nor to comply with heat- the young affects", "In me defunct- and proper satisfaction;", "But to be free and bounteous to her mind.", "And heaven defend your good souls, that you think", "I will your serious and great business scant", "For she is with me. No, when light-wing'd toys", "Of feather'd Cupid seel with wanton dullness", "My speculative and officed instruments,", "That my disports corrupt and taint my business,", "Let housewives make a skillet of my helm,", "And all indign and base adversities", "Make head against my estimation!"], "id": 153, "m": "Give her your approval. Heaven be my witness, I don't ask this to satisfy my appetite or my passions (the urges of youth are dead in me) or for my own pleasure, but to be generous to her wishes. And heaven forbid you good men think I'll neglect your serious and important business because she's with me. No: if the light-winged toys of feathered Cupid ever blind my eyes and dull my mind with lust, so that my pleasures corrupt and spoil my work, let housewives turn my helmet into a cooking pot, and let every shameful and humiliating misfortune rise up against my reputation!"}, {"t": "sp", "who": "DUKE", "lines": ["Be it as you shall privately determine,", "Either for her stay or going. The affair cries haste,", "And speed must answer't: you must hence tonight."], "id": 154, "m": "Decide it privately, whether she stays or goes. The situation is urgent and needs a fast response. You have to leave tonight."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Tonight, my lord?"], "id": 155, "m": "Tonight, my lord?"}, {"t": "sp", "who": "DUKE", "lines": ["This night."], "id": 156, "m": "Tonight."}, {"t": "sp", "who": "OTHELLO", "lines": ["With all my heart."], "id": 157, "m": "With all my heart."}, {"t": "sp", "who": "DUKE", "lines": ["At nine i' the morning here we'll meet again.", "Othello, leave some officer behind,", "And he shall our commission bring to you,", "With such things else of quality and respect", "As doth import you."], "id": 158, "m": "We'll meet here again at nine in the morning. Othello, leave an officer behind, and he'll bring you our official orders and whatever else concerns your rank and position."}, {"t": "sp", "who": "OTHELLO", "lines": ["So please your Grace, my ancient;", "A man he is of honesty and trust.", "To his conveyance I assign my wife,", "With what else needful your good Grace shall think", "To be sent after me."], "id": 159, "m": "If it please your Grace, my ensign. He's an honest and trustworthy man. I'll leave my wife in his care, along with anything else your Grace thinks should be sent after me."}, {"t": "sp", "who": "DUKE", "lines": ["Let it be so.", "Good night to everyone. [To Brabantio.] And, noble signior,", "If virtue no delighted beauty lack,", "Your son-in-law is far more fair than black."], "id": 160, "m": "So be it. Good night, everyone. [To Brabantio.] And, noble sir, if goodness has its own beauty, your son-in-law is far more fair than black."}, {"t": "sp", "who": "FIRST SENATOR", "lines": ["Adieu, brave Moor, use Desdemona well."], "id": 161, "m": "Goodbye, brave Moor. Treat Desdemona well."}, {"t": "sp", "who": "BRABANTIO", "lines": ["Look to her, Moor, if thou hast eyes to see;", "She has deceived her father, and may thee."], "id": 162, "m": "Keep an eye on her, Moor, if you have eyes to see. She deceived her father, and she may deceive you."}, {"t": "sd", "text": "Exeunt Duke, Senators, and Officers.", "id": 163}, {"t": "sp", "who": "OTHELLO", "lines": ["My life upon her faith! Honest Iago,", "My Desdemona must I leave to thee.", "I prithee, let thy wife attend on her,", "And bring them after in the best advantage.", "Come, Desdemona, I have but an hour", "Of love, of worldly matters and direction,", "To spend with thee. We must obey the time."], "id": 164, "m": "I'd bet my life on her loyalty! Honest Iago, I have to leave my Desdemona with you. Please have your wife look after her, and bring them after me when it's most convenient. Come, Desdemona, I have only an hour to spend with you on love, practical matters, and instructions. We must do what the time demands."}, {"t": "sd", "text": "Exeunt Othello and Desdemona.", "id": 165}, {"t": "sp", "who": "RODERIGO", "lines": ["Iago!"], "id": 166, "m": "Iago!"}, {"t": "sp", "who": "IAGO", "lines": ["What say'st thou, noble heart?"], "id": 167, "m": "What do you say, noble heart?"}, {"t": "sp", "who": "RODERIGO", "lines": ["What will I do, thinkest thou?"], "id": 168, "m": "What do you think I'm going to do?"}, {"t": "sp", "who": "IAGO", "lines": ["Why, go to bed and sleep."], "id": 169, "m": "Why, go to bed and sleep."}, {"t": "sp", "who": "RODERIGO", "lines": ["I will incontinently drown myself."], "id": 170, "m": "I'm going to drown myself immediately."}, {"t": "sp", "who": "IAGO", "lines": ["If thou dost, I shall never love thee after.", "Why, thou silly gentleman!"], "id": 171, "m": "If you do, I'll never like you again. Why, you silly gentleman!"}, {"t": "sp", "who": "RODERIGO", "lines": ["It is silliness to live when to live is torment, and then", "have we a prescription to die when death is our physician."], "id": 172, "m": "It's silly to live when living is torture. And we have a prescription to die when death is our doctor."}, {"t": "sp", "who": "IAGO", "lines": ["O villainous! I have looked upon the world for four times", "seven years, and since I could distinguish betwixt a benefit and", "an injury, I never found man that knew how to love himself. Ere I", "would say I would drown myself for the love of a guinea hen, I", "would change my humanity with a baboon."], "id": 173, "m": "Oh, nonsense! I've looked at the world for twenty-eight years, and ever since I could tell the difference between a benefit and an injury, I've never found a man who knew how to love himself. Before I'd say I'd drown myself for the love of some floozy, I'd trade my humanity with a baboon."}, {"t": "sp", "who": "RODERIGO", "lines": ["What should I do? I confess it is my shame to be so fond,", "but it is not in my virtue to amend it."], "id": 174, "m": "What should I do? I admit it's shameful to be so infatuated, but I don't have the strength to fix it."}, {"t": "sp", "who": "IAGO", "lines": ["Virtue? a fig! 'Tis in ourselves that we are thus or thus.", "Our bodies are gardens, to the which our wills are gardeners; so", "that if we will plant nettles or sow lettuce, set hyssop and weed", "up thyme, supply it with one gender of herbs or distract it with", "many, either to have it sterile with idleness or manured with", "industry, why, the power and corrigible authority of this lies in", "our wills. If the balance of our lives had not one scale of", "reason to poise another of sensuality, the blood and baseness of", "our natures would conduct us to most preposterous conclusions.", "But we have reason to cool our raging motions, our carnal stings,", "our unbitted lusts; whereof I take this, that you call love, to", "be a sect or scion."], "id": 175, "m": "Strength? Nonsense! It's up to us whether we're one way or another. Our bodies are gardens, and our wills are the gardeners. Whether we plant nettles or lettuce, grow hyssop or weed out thyme, fill it with one kind of herb or many, let it go barren through laziness or fertilize it with hard work, the power to control all this lies in our wills. If our lives didn't have reason on one side of the scale to balance our desires on the other, our lust and baser nature would lead us to absurd results. But we have reason to cool our raging urges, our sexual desires, our unbridled lusts. And I think what you call love is just an offshoot of that."}, {"t": "sp", "who": "RODERIGO", "lines": ["It cannot be."], "id": 176, "m": "It can't be."}, {"t": "sp", "who": "IAGO", "lines": ["It is merely a lust of the blood and a permission of the", "will. Come, be a man! Drown thyself? Drown cats and blind", "puppies. I have professed me thy friend, and I confess me knit to", "thy deserving with cables of perdurable toughness; I could never", "better stead thee than now. Put money in thy purse; follow thou", "the wars; defeat thy favor with an usurped beard. I say, put", "money in thy purse. It cannot be that Desdemona should long", "continue her love to the Moor- put money in thy purse- nor he his", "to her. It was a violent commencement, and thou shalt see an", "answerable sequestration- put but money in thy purse. These Moors", "are changeable in their wills- fill thy purse with money. The", "food that to him now is as luscious as locusts, shall be to him", "shortly as acerb as the coloquintida. She must change for youth;", "when she is sated with his body, she will find the error of her", "choice. She must have change, she must; therefore put money in", "thy purse. If thou wilt needs damn thyself, do it a more delicate", "way than drowning. Make all the money thou canst. If sanctimony", "and a frail vow betwixt an erring barbarian and a supersubtle", "Venetian be not too hard for my wits and all the tribe of hell,", "thou shalt enjoy her- therefore make money. A pox of drowning", "thyself! It is clean out of the way. Seek thou rather to be", "hanged in compassing thy joy than to be drowned and go without", "her."], "id": 177, "m": "It's nothing but lust of the blood that the will allows. Come on, be a man! Drown yourself? Drown cats and blind puppies. I've said I'm your friend, and I admit I'm bound to you with unbreakable cables. I've never been more useful to you than now. Put money in your wallet. Follow the army to the wars. Disguise your face with a fake beard. I'm telling you, put money in your wallet. Desdemona can't go on loving the Moor for long (put money in your wallet), nor he her. It started violently, and you'll see it end just as abruptly (just put money in your wallet). These Moors are fickle (fill your wallet with money). The food that tastes as sweet as candy to him now will soon taste as bitter as poison. She'll want someone younger. When she's had enough of his body, she'll realize her mistake. She has to have a change, she must, so put money in your wallet. If you're set on damning yourself, do it in a more pleasant way than drowning. Raise all the money you can. If a holy ceremony and a fragile vow between a wandering barbarian and an overly clever Venetian girl aren't too much for my wits and all the powers of hell, you'll have her. So make money. To hell with drowning yourself! It's completely beside the point. You'd be better off being hanged for getting what you want than drowning without her."}, {"t": "sp", "who": "RODERIGO", "lines": ["Wilt thou be fast to my hopes, if I depend on the issue?"], "id": 178, "m": "Will you stand by me if I count on this working out?"}, {"t": "sp", "who": "IAGO", "lines": ["Thou art sure of me- go, make money. I have told thee often,", "and I retell thee again and again, I hate the Moor. My cause is", "hearted; thine hath no less reason. Let us be conjunctive in our", "revenge against him. If thou canst cuckold him, thou dost thyself", "a pleasure, me a sport. There are many events in the womb of time", "which will be delivered. Traverse, go, provide thy money. We will", "have more of this tomorrow. Adieu."], "id": 179, "m": "You can count on me. Go, raise money. I've told you often, and I'll tell you again and again: I hate the Moor. My reasons come from the heart; yours are just as strong. Let's join together in revenge against him. If you can sleep with his wife, you get pleasure and I get a laugh. Time is pregnant with many events that will be born. Go on, march! Get your money. We'll talk more tomorrow. Goodbye."}, {"t": "sp", "who": "RODERIGO", "lines": ["Where shall we meet i' the morning?"], "id": 180, "m": "Where should we meet in the morning?"}, {"t": "sp", "who": "IAGO", "lines": ["At my lodging."], "id": 181, "m": "At my place."}, {"t": "sp", "who": "RODERIGO", "lines": ["I'll be with thee betimes."], "id": 182, "m": "I'll be there early."}, {"t": "sp", "who": "IAGO", "lines": ["Go to, farewell. Do you hear, Roderigo?"], "id": 183, "m": "Go on, goodbye. Do you hear me, Roderigo?"}, {"t": "sp", "who": "RODERIGO", "lines": ["What say you?"], "id": 184, "m": "What?"}, {"t": "sp", "who": "IAGO", "lines": ["No more of drowning, do you hear?"], "id": 185, "m": "No more talk of drowning, you hear?"}, {"t": "sp", "who": "RODERIGO", "lines": ["I am changed; I'll go sell all my land."], "id": 186, "m": "I've changed my mind. I'll go sell all my land."}, {"t": "sd", "text": "Exit.", "id": 187}, {"t": "sp", "who": "IAGO", "lines": ["Thus do I ever make my fool my purse;", "For I mine own gain'd knowledge should profane", "If I would time expend with such a snipe", "But for my sport and profit. I hate the Moor,", "And it is thought abroad that 'twixt my sheets", "He has done my office. I know not if't be true,", "But I for mere suspicion in that kind", "Will do as if for surety. He holds me well,", "The better shall my purpose work on him.", "Cassio's a proper man. Let me see now-", "To get his place, and to plume up my will", "In double knavery- How, how?- Let's see-", "After some time, to abuse Othello's ear", "That he is too familiar with his wife.", "He hath a person and a smooth dispose", "To be suspected- framed to make women false.", "The Moor is of a free and open nature,", "That thinks men honest that but seem to be so,", "And will as tenderly be led by the nose", "As asses are.", "I have't. It is engender'd. Hell and night", "Must bring this monstrous birth to the world's light."], "id": 188, "m": "This is how I always make my fool pay my way. I'd be wasting what I've learned if I spent time with such an idiot except for my own fun and profit. I hate the Moor. And people say he's slept with my wife. I don't know if it's true, but just the suspicion is enough for me; I'll act as if it were certain. He thinks well of me; that will make my plan work on him all the better. Cassio's a handsome man. Let me see now: how to get his job and pull off my plan in a double scam. How? How? Let's see. After a while, I'll whisper in Othello's ear that Cassio is too familiar with his wife. Cassio has the looks and smooth manner to be suspected; he's made to make women unfaithful. The Moor is open and trusting by nature. He thinks men are honest if they only seem to be, and he can be led by the nose as easily as a donkey. I've got it. It's conceived. Hell and darkness must bring this monstrous birth into the light of the world."}, {"t": "sd", "text": "Exit.", "id": 189}, {"t": "scene", "act": 2, "scene": "I", "loc": "A seaport in Cyprus. An open place near the quay.", "id": 190}, {"t": "sd", "text": "Enter Montano and two Gentlemen.", "id": 191}, {"t": "sp", "who": "MONTANO", "lines": ["What from the cape can you discern at sea?"], "id": 192, "m": "What can you see out at sea from the cliff?"}, {"t": "sp", "who": "FIRST GENTLEMAN", "lines": ["Nothing at all. It is a high-wrought flood;", "I cannot, 'twixt the heaven and the main,", "Descry a sail."], "id": 193, "m": "Nothing at all. The waves are huge. I can't spot a single sail between the sky and the sea."}, {"t": "sp", "who": "MONTANO", "lines": ["Methinks the wind hath spoke aloud at land;", "A fuller blast ne'er shook our battlements.", "If it hath ruffian'd so upon the sea,", "What ribs of oak, when mountains melt on them,", "Can hold the mortise? What shall we hear of this?"], "id": 194, "m": "I think the wind has roared loudly on land too; a stronger gust never shook our walls. If it has been this violent at sea, what oak ships can hold together when mountains of water crash down on them? What news will we hear after this?"}, {"t": "sp", "who": "SECOND GENTLEMAN", "lines": ["A segregation of the Turkish fleet.", "For do but stand upon the foaming shore,", "The chidden billow seems to pelt the clouds;", "The wind-shaked surge, with high and monstrous mane,", "Seems to cast water on the burning bear,", "And quench the guards of the ever-fixed pole.", "I never did like molestation view", "On the enchafed flood."], "id": 195, "m": "That the Turkish fleet has been scattered. Just stand on the foaming shore: the battered waves seem to hit the clouds, and the wind-whipped surge, with its huge monstrous mane, seems to throw water on the stars of the Great Bear and put out the stars that guard the fixed North Star. I've never seen such turmoil on the raging sea."}, {"t": "sp", "who": "MONTANO", "lines": ["If that the Turkish fleet", "Be not enshelter'd and embay'd, they are drown'd;", "It is impossible to bear it out."], "id": 196, "m": "If the Turkish fleet isn't sheltered in some bay, they've drowned. They can't possibly ride this out."}, {"t": "sd", "text": "Enter a third Gentleman.", "id": 197}, {"t": "sp", "who": "THIRD GENTLEMAN", "lines": ["News, lads! Our wars are done.", "The desperate tempest hath so bang'd the Turks,", "That their designment halts. A noble ship of Venice", "Hath seen a grievous wreck and sufferance", "On most part of their fleet."], "id": 198, "m": "News, men! Our war is over. This furious storm has smashed the Turks so badly that their plans are finished. A noble ship from Venice saw most of their fleet wrecked and ruined."}, {"t": "sp", "who": "MONTANO", "lines": ["How? Is this true?"], "id": 199, "m": "What? Is this true?"}, {"t": "sp", "who": "THIRD GENTLEMAN", "lines": ["The ship is here put in,", "A Veronesa. Michael Cassio,", "Lieutenant to the warlike Moor, Othello,", "Is come on shore; the Moor himself at sea,", "And is in full commission here for Cyprus."], "id": 200, "m": "The ship has docked here, a ship from Verona. Michael Cassio, lieutenant to the warlike Moor Othello, has come ashore. The Moor himself is still at sea, and he's been given full command here in Cyprus."}, {"t": "sp", "who": "MONTANO", "lines": ["I am glad on't; 'tis a worthy governor."], "id": 201, "m": "I'm glad. He's a worthy governor."}, {"t": "sp", "who": "THIRD GENTLEMAN", "lines": ["But this same Cassio, though he speak of comfort", "Touching the Turkish loss, yet he looks sadly", "And prays the Moor be safe; for they were parted", "With foul and violent tempest."], "id": 202, "m": "But this Cassio, though he brings good news about the Turkish losses, looks worried and prays the Moor is safe, because they were separated by a terrible, violent storm."}, {"t": "sp", "who": "MONTANO", "lines": ["Pray heavens he be,", "For I have served him, and the man commands", "Like a full soldier. Let's to the seaside, ho!", "As well to see the vessel that's come in", "As to throw out our eyes for brave Othello,", "Even till we make the main and the aerial blue", "An indistinct regard."], "id": 203, "m": "I pray to heaven he is. I've served under him, and the man commands like a true soldier. Let's go to the shore! We'll see the ship that's come in, and look out for brave Othello until the sea and the sky blur together."}, {"t": "sp", "who": "THIRD GENTLEMAN", "lines": ["Come, let's do so,", "For every minute is expectancy", "Of more arrivance."], "id": 204, "m": "Come on, let's go. Any minute now more ships could arrive."}, {"t": "sd", "text": "Enter Cassio.", "id": 205}, {"t": "sp", "who": "CASSIO", "lines": ["Thanks, you the valiant of this warlike isle,", "That so approve the Moor! O, let the heavens", "Give him defense against the elements,", "For I have lost him on a dangerous sea."], "id": 206, "m": "Thank you, brave men of this warlike island, for praising the Moor so highly! Oh, may the heavens protect him from the elements, because I lost him on a dangerous sea."}, {"t": "sp", "who": "MONTANO", "lines": ["I she well shipp'd?"], "id": 207, "m": "Is his ship sound?"}, {"t": "sp", "who": "CASSIO", "lines": ["His bark is stoutly timber'd, and his pilot", "Of very expert and approved allowance;", "Therefore my hopes, not surfeited to death,", "Stand in bold cure."], "id": 208, "m": "His ship is solidly built, and his pilot is highly skilled and experienced. So my hopes, which aren't yet dead, are still strong."}, {"t": "sd", "text": "A cry within, \"A sail, a sail, a sail!\"", "id": 209}, {"t": "sd", "text": "Enter a fourth Gentleman.", "id": 210}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["What noise?"], "id": 211, "m": "What's that noise?"}, {"t": "sp", "who": "FOURTH GENTLEMAN", "lines": ["The town is empty; on the brow o' the sea", "Stand ranks of people, and they cry, \"A sail!\""], "id": 212, "m": "The town is empty. Crowds of people stand on the cliff by the sea, and they're shouting, \"A sail!\""}, {"t": "sp", "who": "CASSIO", "lines": ["My hopes do shape him for the governor."], "id": 213, "m": "I hope it's the governor."}, {"t": "sd", "text": "Guns heard.", "id": 214}, {"t": "sp", "who": "SECOND GENTLEMAN", "lines": ["They do discharge their shot of courtesy-", "Our friends at least."], "id": 215, "m": "They're firing a friendly salute. At least they're friends."}, {"t": "sp", "who": "CASSIO", "lines": ["I pray you, sir, go forth,", "And give us truth who 'tis that is arrived."], "id": 216, "m": "Please, sir, go and tell us truthfully who has arrived."}, {"t": "sp", "who": "SECOND GENTLEMAN", "lines": ["I shall."], "id": 217, "m": "I will."}, {"t": "sd", "text": "Exit.", "id": 218}, {"t": "sp", "who": "MONTANO", "lines": ["But, good lieutenant, is your general wived?"], "id": 219, "m": "But, good lieutenant, is your general married?"}, {"t": "sp", "who": "CASSIO", "lines": ["Most fortunately: he hath achieved a maid", "That paragons description and wild fame,", "One that excels the quirks of blazoning pens,", "And in the essential vesture of creation", "Does tire the ingener."], "id": 220, "m": "Very luckily. He has won a woman who surpasses any description or wild rumor, who outdoes the flourishes of the most flattering writers, and whose natural beauty would exhaust any artist trying to praise it."}, {"t": "sd", "text": "Re-enter second Gentleman.", "id": 221}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["How now! who has put in?"], "id": 222, "m": "Well! Who's landed?"}, {"t": "sp", "who": "SECOND GENTLEMAN", "lines": ["'Tis one Iago, ancient to the general."], "id": 223, "m": "It's Iago, the general's ensign."}, {"t": "sp", "who": "CASSIO", "lines": ["He has had most favorable and happy speed:", "Tempests themselves, high seas, and howling winds,", "The gutter'd rocks, and congregated sands,", "Traitors ensteep'd to clog the guiltless keel,", "As having sense of beauty, do omit", "Their mortal natures, letting go safely by", "The divine Desdemona."], "id": 224, "m": "He's had a very quick and lucky voyage. Storms, high seas, howling winds, jagged rocks, and sandbars (traitors lying underwater to trap innocent ships) all seem to have a sense of beauty and set aside their deadly nature to let the divine Desdemona pass safely."}, {"t": "sp", "who": "MONTANO", "lines": ["What is she?"], "id": 225, "m": "Who is she?"}, {"t": "sp", "who": "CASSIO", "lines": ["She that I spake of, our great captain's captain,", "Left in the conduct of the bold Iago,", "Whose footing here anticipates our thoughts", "A se'nnight's speed. Great Jove, Othello guard,", "And swell his sail with thine own powerful breath,", "That he may bless this bay with his tall ship,", "Make love's quick pants in Desdemona's arms,", "Give renew'd fire to our extincted spirits,", "And bring all Cyprus comfort."], "id": 226, "m": "The one I told you about, our great captain's captain, left in the care of bold Iago. He's arrived a week sooner than we expected. Great Jove, protect Othello and fill his sail with your own powerful breath, so he can bless this bay with his tall ship, breathe quick with love in Desdemona's arms, give new fire to our dampened spirits, and bring comfort to all of Cyprus."}, {"t": "sd", "text": "Enter Desdemona, Emilia Iago, Roderigo, and Attendants.", "id": 227}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["O, behold,", "The riches of the ship is come on shore!", "Ye men of Cyprus, let her have your knees.", "Hall to thee, lady! And the grace of heaven,", "Before, behind thee, and on every hand,", "Enwheel thee round!"], "id": 228, "m": "Oh, look! The ship's treasure has come ashore! Men of Cyprus, kneel to her. Hail to you, lady! May heaven's grace surround you, in front, behind, and on every side!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["I thank you, valiant Cassio.", "What tidings can you tell me of my lord?"], "id": 229, "m": "Thank you, brave Cassio. What news can you give me of my husband?"}, {"t": "sp", "who": "CASSIO", "lines": ["He is not yet arrived, nor know I aught", "But that he's well and will be shortly here."], "id": 230, "m": "He hasn't arrived yet. All I know is that he's well and will be here soon."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, but I fear- How lost you company?"], "id": 231, "m": "Oh, but I'm afraid... How did you get separated?"}, {"t": "sp", "who": "CASSIO", "lines": ["The great contention of the sea and skies", "Parted our fellowship- But, hark! a sail."], "id": 232, "m": "The great battle between the sea and the sky split us up. But listen! A ship."}, {"t": "sd", "text": "A cry within, \"A sail, a sail!\" Guns heard.", "id": 233}, {"t": "sp", "who": "SECOND GENTLEMAN", "lines": ["They give their greeting to the citadel;", "This likewise is a friend."], "id": 234, "m": "They're saluting the fort. This one's a friend too."}, {"t": "sp", "who": "CASSIO", "lines": ["See for the news."], "id": 235, "m": "Go and get the news."}, {"t": "sd", "text": "Exit Gentleman.", "id": 236}, {"t": "sp", "who": "CASSIO", "cont": 1, "lines": ["Good ancient, you are welcome. [To Emilia.] Welcome, mistress.", "Let it not gall your patience, good Iago,", "That I extend my manners; 'tis my breeding", "That gives me this bold show of courtesy. [Kisses her.]"], "id": 237, "m": "Good ensign, welcome. [To Emilia.] Welcome, madam. Don't be offended, good Iago, that I'm being so forward with my manners. It's my upbringing that makes me show such bold courtesy. [Kisses her.]"}, {"t": "sp", "who": "IAGO", "lines": ["Sir, would she give you so much of her lips", "As of her tongue she oft bestows on me,", "You'ld have enough."], "id": 238, "m": "Sir, if she gave you as much of her lips as she gives me of her tongue, you'd have had enough."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Alas, she has no speech."], "id": 239, "m": "Come on, she hardly says anything."}, {"t": "sp", "who": "IAGO", "lines": ["In faith, too much;", "I find it still when I have list to sleep.", "Marry, before your ladyship I grant,", "She puts her tongue a little in her heart", "And chides with thinking."], "id": 240, "m": "Honestly, she says too much. I notice it whenever I want to sleep. Of course, in front of you, my lady, I admit she bites her tongue a bit and only scolds in her thoughts."}, {"t": "sp", "who": "EMILIA", "lines": ["You have little cause to say so."], "id": 241, "m": "You have no reason to say that."}, {"t": "sp", "who": "IAGO", "lines": ["Come on, come on. You are pictures out of doors,", "Bells in your parlors, wildcats in your kitchens,", "Saints in your injuries, devils being offended,", "Players in your housewifery, and housewives in your beds."], "id": 242, "m": "Come on, come on. You women are pretty as pictures in public, chattering like bells in your living rooms, wildcats in your kitchens. You act like saints when you hurt someone, and like devils when someone offends you. You play at keeping house, and you're only serious about business in bed."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O, fie upon thee, slanderer!"], "id": 243, "m": "Oh, shame on you, you slanderer!"}, {"t": "sp", "who": "IAGO", "lines": ["Nay, it is true, or else I am a Turk:", "You rise to play, and go to bed to work."], "id": 244, "m": "No, it's true, or I'm a Turk. You get up to play and go to bed to work."}, {"t": "sp", "who": "EMILIA", "lines": ["You shall not write my praise."], "id": 245, "m": "I won't have you write my praises."}, {"t": "sp", "who": "IAGO", "lines": ["No, let me not."], "id": 246, "m": "No, don't let me."}, {"t": "sp", "who": "DESDEMONA", "lines": ["What wouldst thou write of me, if thou shouldst", "praise me?"], "id": 247, "m": "What would you write about me, if you had to praise me?"}, {"t": "sp", "who": "IAGO", "lines": ["O gentle lady, do not put me to't,", "For I am nothing if not critical."], "id": 248, "m": "Oh, gentle lady, don't ask me to. I'm nothing if not critical."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Come on, assay- There's one gone to the harbor?"], "id": 249, "m": "Come on, try. Has someone gone to the harbor?"}, {"t": "sp", "who": "IAGO", "lines": ["Ay, madam."], "id": 250, "m": "Yes, madam."}, {"t": "sp", "who": "DESDEMONA", "lines": ["I am not merry, but I do beguile", "The thing I am by seeming otherwise.", "Come, how wouldst thou praise me?"], "id": 251, "m": "I'm not cheerful, but I'm distracting myself from how I feel by pretending otherwise. Come on, how would you praise me?"}, {"t": "sp", "who": "IAGO", "lines": ["I am about it, but indeed my invention", "Comes from my pate as birdlime does from frieze;", "It plucks out brains and all. But my Muse labors,", "And thus she is deliver'd.", "If she be fair and wise, fairness and wit,", "The one's for use, the other useth it."], "id": 252, "m": "I'm working on it, but my ideas come out of my head like glue off a wool cloth: they pull my brains out with them. But my Muse is in labor, and here's what she gives birth to: If a woman is fair and wise, with beauty and brains, her beauty is for using, and her brains know how to use it."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Well praised! How if she be black and witty?"], "id": 253, "m": "Nicely praised! What if she's dark and clever?"}, {"t": "sp", "who": "IAGO", "lines": ["If she be black, and thereto have a wit,", "She'll find a white that shall her blackness fit."], "id": 254, "m": "If she's dark and also clever, she'll find a fair man who fits her darkness."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Worse and worse."], "id": 255, "m": "Worse and worse."}, {"t": "sp", "who": "EMILIA", "lines": ["How if fair and foolish?"], "id": 256, "m": "What if she's beautiful and foolish?"}, {"t": "sp", "who": "IAGO", "lines": ["She never yet was foolish that was fair,", "For even her folly help'd her to an heir."], "id": 257, "m": "No beautiful woman was ever foolish, because her foolishness helped her get a child."}, {"t": "sp", "who": "DESDEMONA", "lines": ["These are old fond paradoxes to make fools laugh i' the", "alehouse. What miserable praise hast thou for her that's foul and", "foolish?"], "id": 258, "m": "These are silly old jokes to make fools laugh in the pub. What awful praise do you have for a woman who's ugly and foolish?"}, {"t": "sp", "who": "IAGO", "lines": ["There's none so foul and foolish thereunto,", "But does foul pranks which fair and wise ones do."], "id": 259, "m": "No woman is so ugly and foolish that she doesn't get up to the same dirty tricks the beautiful and wise ones do."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O heavy ignorance! Thou praisest the worst best. But what", "praise couldst thou bestow on a deserving woman indeed, one that", "in the authority of her merit did justly put on the vouch of very", "malice itself?"], "id": 260, "m": "Oh, what ignorance! You praise the worst one best. But what praise could you give a truly deserving woman, one so good that even malice itself would have to admit her worth?"}, {"t": "sp", "who": "IAGO", "lines": ["She that was ever fair and never proud,", "Had tongue at will and yet was never loud,", "Never lack'd gold and yet went never gay,", "Fled from her wish and yet said, \"Now I may\";", "She that, being anger'd, her revenge being nigh,", "Bade her wrong stay and her displeasure fly;", "She that in wisdom never was so frail", "To change the cod's head for the salmon's tail;", "She that could think and ne'er disclose her mind,", "See suitors following and not look behind;", "She was a wight, if ever such wight were-"], "id": 261, "m": "A woman who was always beautiful but never proud, who could speak her mind but was never loud, who always had money but never dressed flashy, who held back from what she wanted even when she could have it; a woman who, when angered and able to take revenge, let the insult go and her anger fade; a woman who was never so foolish as to trade something good for something worthless; who could think without blurting out her thoughts, and could have men chasing her without looking back. She'd be the kind of woman, if such a woman ever existed..."}, {"t": "sp", "who": "DESDEMONA", "lines": ["To do what?"], "id": 262, "m": "To do what?"}, {"t": "sp", "who": "IAGO", "lines": ["To suckle fools and chronicle small beer."], "id": 263, "m": "To breastfeed idiots and keep track of trivial household accounts."}, {"t": "sp", "who": "DESDEMONA", "lines": ["O most lame and impotent conclusion! Do not learn of him,", "Emilia, though he be thy husband. How say you, Cassio? Is he not", "a most profane and liberal counselor?"], "id": 264, "m": "Oh, what a lame and feeble ending! Don't learn from him, Emilia, even if he is your husband. What do you think, Cassio? Isn't he a crude, foul-mouthed advisor?"}, {"t": "sp", "who": "CASSIO", "lines": ["He speaks home, madam. You may relish him more in the", "soldier than in the scholar."], "id": 265, "m": "He speaks bluntly, madam. You'll appreciate him more as a soldier than as a scholar."}, {"t": "sp", "who": "IAGO", "lines": ["[Aside.] He takes her by the palm; ay, well said, whisper.", "With as little a web as this will I ensnare as great a fly as", "Cassio. Ay, smile upon her, do; I will gyve thee in thine own", "courtship. You say true; 'tis so, indeed. If such tricks as these", "strip you out of your lieutenantry, it had been better you had", "not kissed your three fingers so oft, which now again you are", "most apt to play the sir in. Very good. Well kissed! an excellent", "courtesy! 'tis so, indeed. Yet again your fingers to your lips?", "Would they were clyster-pipes for your sake! [Trumpet within.]", "The Moor! I know his trumpet."], "id": 266, "m": "[Aside.] He takes her by the hand. Yes, that's it, whisper. With a web this small I'll catch a fly as big as Cassio. Yes, smile at her, go on. I'll trap you in your own courtly manners. That's right, exactly. If tricks like these cost you your lieutenancy, you'd have been better off not kissing your fingers so often, which you're now so eager to do again like a fine gentleman. Very good. Nicely kissed! Excellent manners! Exactly. Your fingers to your lips again? I wish they were enema tubes, for your sake! [Trumpet offstage.] The Moor! I know his trumpet."}, {"t": "sp", "who": "CASSIO", "lines": ["'Tis truly so."], "id": 267, "m": "That's right."}, {"t": "sp", "who": "DESDEMONA", "lines": ["Let's meet him and receive him."], "id": 268, "m": "Let's go meet him."}, {"t": "sp", "who": "CASSIO", "lines": ["Lo, where he comes!"], "id": 269, "m": "Look, here he comes!"}, {"t": "sd", "text": "Enter Othello and Attendants.", "id": 270}, {"t": "sp", "who": "OTHELLO", "lines": ["O my fair warrior!"], "id": 271, "m": "Oh, my beautiful warrior!"}, {"t": "sp", "who": "DESDEMONA", "lines": ["My dear Othello!"], "id": 272, "m": "My dear Othello!"}, {"t": "sp", "who": "OTHELLO", "lines": ["It gives me wonder great as my content", "To see you here before me. O my soul's joy!", "If after every tempest come such calms,", "May the winds blow till they have waken'd death!", "And let the laboring bark climb hills of seas", "Olympus-high, and duck again as low", "As hell's from heaven! If it were now to die,", "'Twere now to be most happy; for I fear", "My soul hath her content so absolute", "That not another comfort like to this", "Succeeds in unknown fate."], "id": 273, "m": "It's as amazing as it is wonderful to find you here before me. Oh, my soul's joy! If every storm is followed by a calm like this, let the winds blow until they wake the dead! Let the struggling ship climb mountains of waves as high as Olympus and then drop as low as hell is from heaven! If I were to die right now, I'd die the happiest man alive, because I'm afraid my soul is so completely content that I'll never feel happiness like this again in my unknown future."}, {"t": "sp", "who": "DESDEMONA", "lines": ["The heavens forbid", "But that our loves and comforts should increase,", "Even as our days do grow!"], "id": 274, "m": "Heaven forbid! May our love and happiness only grow as our days go on!"}, {"t": "sp", "who": "OTHELLO", "lines": ["Amen to that, sweet powers!", "I cannot speak enough of this content;", "It stops me here; it is too much of joy.", "And this, and this, the greatest discords be [Kisses her.]", "That e'er our hearts shall make!"], "id": 275, "m": "Amen to that, sweet heaven! I can't say enough about how happy I am. It catches me here; it's too much joy. And may this, and this [Kisses her], be the worst conflict our hearts ever have!"}, {"t": "sp", "who": "IAGO", "lines": ["[Aside.] O, you are well tuned now!", "But I'll set down the pegs that make this music,", "As honest as I am."], "id": 276, "m": "[Aside.] Oh, you're in perfect harmony now! But I'll loosen the strings that make this music, as honest as I am."}, {"t": "sp", "who": "OTHELLO", "lines": ["Come, let us to the castle.", "News, friends: our wars are done, the Turks are drown'd.", "How does my old acquaintance of this isle?", "Honey, you shall be well desired in Cyprus;", "I have found great love amongst them. O my sweet,", "I prattle out of fashion, and I dote", "In mine own comforts. I prithee, good Iago,", "Go to the bay and disembark my coffers.", "Bring thou the master to the citadel;", "He is a good one, and his worthiness", "Does challenge much respect. Come, Desdemona,", "Once more well met at Cyprus."], "id": 277, "m": "Come, let's go to the castle. News, friends: the war is over; the Turks have drowned. How are my old friends on this island? Darling, you'll be very welcome in Cyprus; I've found great affection here. Oh, my sweet, I'm babbling and going on about my own happiness. Please, good Iago, go to the bay and unload my chests. Bring the ship's captain to the fort; he's a good man, and his ability deserves a lot of respect. Come, Desdemona. Once again, welcome to Cyprus."}, {"t": "sd", "text": "Exeunt all but Iago and Roderigo.", "id": 278}, {"t": "sp", "who": "IAGO", "lines": ["Do thou meet me presently at the harbor. Come hither. If thou", "be'st valiant- as they say base men being in love have then a", "nobility in their natures more than is native to them- list me.", "The lieutenant tonight watches on the court of guard. First, I", "must tell thee this: Desdemona is directly in love with him."], "id": 279, "m": "Meet me at the harbor right away. Come here. If you're brave (and they say even lowborn men get a nobility from being in love that they don't normally have), listen to me. The lieutenant is on guard duty tonight. First, I have to tell you this: Desdemona is definitely in love with him."}, {"t": "sp", "who": "RODERIGO", "lines": ["With him? Why, 'tis not possible."], "id": 280, "m": "With him? Why, that's impossible."}, {"t": "sp", "who": "IAGO", "lines": ["Lay thy finger thus, and let thy soul be instructed. Mark me", "with what violence she first loved the Moor, but for bragging and", "telling her fantastical lies. And will she love him still for", "prating? Let not thy discreet heart think it. Her eye must be", "fed; and what delight shall she have to look on the devil? When", "the blood is made dull with the act of sport, there should be,", "again to inflame it and to give satiety a fresh appetite,", "loveliness in favor, sympathy in years, manners, and beauties-", "all which the Moor is defective in. Now, for want of these", "required conveniences, her delicate tenderness will find itself", "abused, begin to heave the gorge, disrelish and abhor the Moor;", "very nature will instruct her in it and compel her to some second", "choice. Now sir, this granted- as it is a most pregnant and", "unforced position- who stands so eminently in the degree of this", "fortune as Cassio does? A knave very voluble; no further", "conscionable than in putting on the mere form of civil and humane", "seeming, for the better compass of his salt and most hidden loose", "affection? Why, none, why, none- a slipper and subtle knave, a", "finder out of occasions, that has an eye can stamp and", "counterfeit advantages, though true advantage never present", "itself- a devilish knave! Besides, the knave is handsome, young,", "and hath all those requisites in him that folly and green minds", "look after- a pestilent complete knave, and the woman hath found", "him already."], "id": 281, "m": "Put your finger to your lips like this, and let your soul learn something. Remember how violently she first loved the Moor, just because he bragged and told her fantastic lies. Will she keep loving him for his chatter? Don't you believe it. Her eyes need feeding, and what pleasure will she get from looking at the devil? When sex has dulled the passion, it takes good looks, a similar age, manners, and beauty to rekindle it and give a full stomach a fresh appetite, and the Moor lacks all of these. Without these necessary qualities, her delicate sensibilities will feel cheated. She'll start to feel sick, lose her taste for the Moor, and loathe him. Nature itself will teach her this and push her to a second choice. Now, sir, given that (and it's a very obvious and natural conclusion), who is better placed to get lucky than Cassio? A smooth-talking rascal, with no more conscience than it takes to put on a show of politeness and manners to hide his lustful, secret desires. Nobody, nobody! A slippery, cunning rascal, an opportunist, with an eye that can create and fake opportunities even when no real ones exist. A devilish rascal! Besides, he's handsome, young, and has everything that foolish, inexperienced women look for. A thoroughly rotten rascal, and the woman has already got her eye on him."}, {"t": "sp", "who": "RODERIGO", "lines": ["I cannot believe that in her; she's full of most blest", "condition."], "id": 282, "m": "I can't believe that of her. She's full of the most blessed qualities."}, {"t": "sp", "who": "IAGO", "lines": ["Blest fig's-end! The wine she drinks is made of grapes. If", "she had been blest, she would never have loved the Moor. Blest", "pudding! Didst thou not see her paddle with the palm of his hand?", "Didst not mark that?"], "id": 283, "m": "Blessed nonsense! The wine she drinks is made of grapes like anyone else's. If she were so blessed, she'd never have loved the Moor. Blessed pudding! Didn't you see her stroking the palm of his hand? Didn't you notice that?"}, {"t": "sp", "who": "RODERIGO", "lines": ["Yes, that I did; but that was but courtesy."], "id": 284, "m": "Yes, I did, but that was just politeness."}, {"t": "sp", "who": "IAGO", "lines": ["Lechery, by this hand; an index and obscure prologue to the", "history of lust and foul thoughts. They met so near with their", "lips that their breaths embraced together. Villainous thoughts,", "Roderigo! When these mutualities so marshal the way, hard at hand", "comes the master and main exercise, the incorporate conclusion.", "Pish! But, sir, be you ruled by me. I have brought you from", "Venice. Watch you tonight; for the command, I'll lay't upon you.", "Cassio knows you not. I'll not be far from you. Do you find some", "occasion to anger Cassio, either by speaking too loud, or", "tainting his discipline, or from what other course you please,", "which the time shall more favorably minister."], "id": 285, "m": "It was lust, I swear by this hand. A preview and secret prologue to a story of lust and dirty thoughts. Their lips came so close that their breath embraced. Villainous thoughts, Roderigo! When these intimacies lead the way, soon after comes the main event, the joining of bodies. Disgusting! But, sir, do as I say. I brought you from Venice. Be on guard duty tonight; I'll arrange for you to be posted. Cassio doesn't know you. I won't be far away. Find some way to make Cassio angry, either by talking too loudly, or mocking his discipline, or any other way you like that the moment offers."}, {"t": "sp", "who": "RODERIGO", "lines": ["Well."], "id": 286, "m": "All right."}, {"t": "sp", "who": "IAGO", "lines": ["Sir, he is rash and very sudden in choler, and haply may", "strike at you. Provoke him, that he may; for even out of that", "will I cause these of Cyprus to mutiny, whose qualification shall", "come into no true taste again but by the displanting of Cassio.", "So shall you have a shorter journey to your desires by the means", "I shall then have to prefer them, and the impediment most", "profitably removed, without the which there were no expectation", "of our prosperity."], "id": 287, "m": "Sir, he's reckless and quick-tempered, and he may well hit you. Provoke him so he does. Because from that alone I'll get the people of Cyprus to riot, and they won't be calmed down again until Cassio is removed. That way you'll have a shorter path to what you want, through the means I'll then have to advance you, and the obstacle will be conveniently removed. Without that, we'd have no hope of success."}, {"t": "sp", "who": "RODERIGO", "lines": ["I will do this, if I can bring it to any opportunity."], "id": 288, "m": "I'll do it, if I can find a chance."}, {"t": "sp", "who": "IAGO", "lines": ["I warrant thee. Meet me by and by at the citadel. I must", "fetch his necessaries ashore. Farewell."], "id": 289, "m": "I guarantee it. Meet me at the fort soon. I have to bring his luggage ashore. Goodbye."}, {"t": "sp", "who": "RODERIGO", "lines": ["Adieu."], "id": 290, "m": "Goodbye."}, {"t": "sd", "text": "Exit.", "id": 291}, {"t": "sp", "who": "IAGO", "lines": ["That Cassio loves her, I do well believe it;", "That she loves him, 'tis apt and of great credit.", "The Moor, howbeit that I endure him not,", "Is of a constant, loving, noble nature,", "And I dare think he'll prove to Desdemona", "A most dear husband. Now, I do love her too,", "Not out of absolute lust, though peradventure", "I stand accountant for as great a sin,", "But partly led to diet my revenge,", "For that I do suspect the lusty Moor", "Hath leap'd into my seat; the thought whereof", "Doth like a poisonous mineral gnaw my inwards,", "And nothing can or shall content my soul", "Till I am even'd with him, wife for wife.", "Or failing so, yet that I put the Moor", "At least into a jealousy so strong", "That judgement cannot cure. Which thing to do,", "If this poor trash of Venice, whom I trace", "For his quick hunting, stand the putting on,", "I'll have our Michael Cassio on the hip,", "Abuse him to the Moor in the rank garb", "(For I fear Cassio with my nightcap too),", "Make the Moor thank me, love me, and reward me", "For making him egregiously an ass", "And practicing upon his peace and quiet", "Even to madness. 'Tis here, but yet confused:", "Knavery's plain face is never seen till used."], "id": 292, "m": "That Cassio loves her, I can well believe. That she loves him is likely and very believable. The Moor, though I can't stand him, is faithful, loving, and noble by nature, and I'd guess he'll be a very loving husband to Desdemona. Now, I love her too, not purely out of lust (though I may be guilty of just as great a sin), but partly to feed my revenge, because I suspect the lusty Moor has slept with my wife. The thought of it eats at my insides like poison, and nothing can or will satisfy my soul until I get even with him, wife for wife. Or if I fail at that, then at least I'll make the Moor so jealous that reason can't cure him. To do that, if this Venetian trash Roderigo, whom I keep on a leash so he'll hunt eagerly, does what I push him to do, I'll have Michael Cassio at my mercy. I'll slander him to the Moor as a womanizer (because I suspect Cassio with my wife too), and make the Moor thank me, love me, and reward me for making a complete fool of him and scheming against his peace of mind until he goes mad. The plan is here in my head, but still muddled. Villainy never shows its full face until it's put to use."}, {"t": "sd", "text": "Exit.", "id": 293}, {"t": "scene", "act": 2, "scene": "II", "loc": "A street.", "id": 294}, {"t": "sd", "text": "Enter a Herald with a proclamation; people following.", "id": 295}, {"t": "sp", "who": "HERALD", "lines": ["It is Othello's pleasure, our noble and valiant general,", "that upon certain tidings now arrived, importing the mere", "perdition of the Turkish fleet, every man put himself into", "triumph; some to dance, some to make bonfires, each man to what", "sport and revels his addiction leads him; for besides these", "beneficial news, it is the celebration of his nuptial. So much", "was his pleasure should be proclaimed. All offices are open, and", "there is full liberty of feasting from this present hour of five", "till the bell have told eleven. Heaven bless the isle of Cyprus", "and our noble general Othello!"], "id": 296, "m": "Our noble and brave general Othello wishes that, following news just received of the complete destruction of the Turkish fleet, everyone should celebrate: some by dancing, some by lighting bonfires, each person with whatever games and partying he likes. Because in addition to this good news, it's also the celebration of his wedding. That's what he wanted announced. All the kitchens and storerooms are open, and everyone is free to feast from now, five o'clock, until the bell strikes eleven. Heaven bless the island of Cyprus and our noble general Othello!"}, {"t": "sd", "text": "Exeunt.", "id": 297}, {"t": "scene", "act": 2, "scene": "III", "loc": "A hall in the castle.", "id": 298}, {"t": "sd", "text": "Enter Othello, Desdemona, Cassio, and Attendants.", "id": 299}, {"t": "sp", "who": "OTHELLO", "lines": ["Good Michael, look you to the guard tonight.", "Let's teach ourselves that honorable stop,", "Not to outsport discretion."], "id": 300, "m": "Good Michael, take charge of the guard tonight. Let's practice the honorable restraint of not letting the partying get out of hand."}, {"t": "sp", "who": "CASSIO", "lines": ["Iago hath direction what to do;", "But notwithstanding with my personal eye", "Will I look to't."], "id": 301, "m": "Iago has his instructions, but I'll still check on it personally."}, {"t": "sp", "who": "OTHELLO", "lines": ["Iago is most honest.", "Michael, good night. Tomorrow with your earliest", "Let me have speech with you. Come, my dear love,", "The purchase made, the fruits are to ensue;", "That profit's yet to come 'tween me and you.", "Good night."], "id": 302, "m": "Iago is very honest. Michael, good night. Come talk to me first thing tomorrow. Come, my dear love. The deal is made; now the rewards are to follow. That pleasure is still to come between you and me. Good night."}, {"t": "sd", "text": "Exeunt Othello, Desdemona, and Attendants.", "id": 303}, {"t": "sd", "text": "Enter Iago.", "id": 304}, {"t": "sp", "who": "CASSIO", "lines": ["Welcome, Iago; we must to the watch."], "id": 305, "m": "Welcome, Iago. We have to go on watch."}, {"t": "sp", "who": "IAGO", "lines": ["Not this hour, lieutenant; 'tis not yet ten o' the clock. Our", "general cast us thus early for the love of his Desdemona; who let", "us not therefore blame. He hath not yet made wanton the night", "with her, and she is sport for Jove."], "id": 306, "m": "Not yet, lieutenant. It's not even ten o'clock. The general sent us off this early because of his love for Desdemona, and we can't blame him. He hasn't had a night of fun with her yet, and she's good enough for Jove himself."}, {"t": "sp", "who": "CASSIO", "lines": ["She's a most exquisite lady."], "id": 307, "m": "She's a very exquisite lady."}, {"t": "sp", "who": "IAGO", "lines": ["And, I'll warrant her, full of game."], "id": 308, "m": "And I bet she's full of fun in bed."}, {"t": "sp", "who": "CASSIO", "lines": ["Indeed she's a most fresh and delicate creature."], "id": 309, "m": "She really is a fresh and delicate creature."}, {"t": "sp", "who": "IAGO", "lines": ["What an eye she has! Methinks it sounds a parley to", "provocation."], "id": 310, "m": "What eyes she has! They seem to invite you in."}, {"t": "sp", "who": "CASSIO", "lines": ["An inviting eye; and yet methinks right modest."], "id": 311, "m": "An inviting look, and yet very modest, I think."}, {"t": "sp", "who": "IAGO", "lines": ["And when she speaks, is it not an alarum to love?"], "id": 312, "m": "And when she speaks, isn't it a call to love?"}, {"t": "sp", "who": "CASSIO", "lines": ["She is indeed perfection."], "id": 313, "m": "She's perfection, truly."}, {"t": "sp", "who": "IAGO", "lines": ["Well, happiness to their sheets! Come, lieutenant, I have a", "stope of wine, and here without are a brace of Cyprus gallants", "that would fain have a measure to the health of black Othello."], "id": 314, "m": "Well, happiness to their bed! Come, lieutenant, I have a jug of wine, and outside there are a couple of young men from Cyprus who'd love to drink a toast to black Othello."}, {"t": "sp", "who": "CASSIO", "lines": ["Not tonight, good Iago. I have very poor and unhappy brains", "for drinking. I could well wish courtesy would invent some other", "custom of entertainment."], "id": 315, "m": "Not tonight, good Iago. I have a weak head for drinking. I wish people would come up with some other way to be social."}, {"t": "sp", "who": "IAGO", "lines": ["O, they are our friends! But one cup; I'll drink for you."], "id": 316, "m": "Oh, they're our friends! Just one cup. I'll drink the rest for you."}, {"t": "sp", "who": "CASSIO", "lines": ["I have drunk but one cup tonight, and that was craftily", "qualified too, and behold what innovation it makes here. I am", "unfortunate in the infirmity, and dare not task my weakness with", "any more."], "id": 317, "m": "I've had just one cup tonight, and that was carefully watered down, and look what a change it's made in me. I have this weakness, unfortunately, and I don't dare test it any further."}, {"t": "sp", "who": "IAGO", "lines": ["What, man! 'Tis a night of revels, the gallants desire it."], "id": 318, "m": "Come on, man! It's a night for partying. The gentlemen want it."}, {"t": "sp", "who": "CASSIO", "lines": ["Where are they?"], "id": 319, "m": "Where are they?"}, {"t": "sp", "who": "IAGO", "lines": ["Here at the door; I pray you, call them in."], "id": 320, "m": "Right here at the door. Please, invite them in."}, {"t": "sp", "who": "CASSIO", "lines": ["I'll do't, but it dislikes me."], "id": 321, "m": "I'll do it, but I don't like it."}, {"t": "sd", "text": "Exit.", "id": 322}, {"t": "sp", "who": "IAGO", "lines": ["If I can fasten but one cup upon him,", "With that which he hath drunk tonight already,", "He'll be as full of quarrel and offense", "As my young mistress' dog. Now my sick fool Roderigo,", "Whom love hath turn'd almost the wrong side out,", "To Desdemona hath tonight caroused", "Potations pottle-deep; and he's to watch.", "Three lads of Cyprus, noble swelling spirits,", "That hold their honors in a wary distance,", "The very elements of this warlike isle,", "Have I tonight fluster'd with flowing cups,", "And they watch too. Now, 'mongst this flock of drunkards,", "Am I to put our Cassio in some action", "That may offend the isle. But here they come.", "If consequence do but approve my dream,", "My boat sails freely, both with wind and stream."], "id": 323, "m": "If I can just get one more cup into him, on top of what he's already had tonight, he'll be as quarrelsome and touchy as a little lady's lapdog. Now my lovesick fool Roderigo, whom love has turned almost inside out, has tonight been drinking toasts to Desdemona by the jugful, and he's on guard duty. Three young men of Cyprus, proud and touchy about their honor, the very essence of this warlike island, I've gotten drunk tonight with overflowing cups, and they're on watch too. Now, among this flock of drunks, I'll get Cassio to do something that will offend the island. But here they come. If things turn out the way I've imagined, my boat will sail freely with both wind and current behind it."}, {"t": "sd", "text": "Re-enter Cassio; with him Montano and Gentlemen; Servants following with wine.", "id": 324}, {"t": "sp", "who": "CASSIO", "lines": ["'Fore God, they have given me a rouse already."], "id": 325, "m": "By God, they've already made me drink a toast."}, {"t": "sp", "who": "MONTANO", "lines": ["Good faith, a little one; not past a pint, as I am a", "soldier."], "id": 326, "m": "Honestly, a small one, no more than a pint, I swear as a soldier."}, {"t": "sp", "who": "IAGO", "lines": ["Some wine, ho!", "~\"And let me the canakin clink, clink;", "~And let me the canakin clink.", "~A soldier's a man;", "~O, man's life's but a span;", "~Why then let a soldier drink.\"", "Some wine, boys!"], "id": 327, "m": "Some wine, here! [Sings.] \"And let me clink the drinking cup, clink, clink; and let me clink the drinking cup. A soldier's a man; a man's life is short; so let a soldier drink.\" Some wine, boys!"}, {"t": "sp", "who": "CASSIO", "lines": ["'Fore God, an excellent song."], "id": 328, "m": "By God, that's an excellent song."}, {"t": "sp", "who": "IAGO", "lines": ["I learned it in England, where indeed they are most potent in", "potting. Your Dane, your German, and your swag-bellied Hollander-", "Drink, ho!- are nothing to your English."], "id": 329, "m": "I learned it in England, where they're serious drinkers. Your Dane, your German, and your pot-bellied Dutchman (drink up!) are nothing compared to your Englishman."}, {"t": "sp", "who": "CASSIO", "lines": ["Is your Englishman so expert in his drinking?"], "id": 330, "m": "Is your Englishman really that good at drinking?"}, {"t": "sp", "who": "IAGO", "lines": ["Why, he drinks you with facility your Dane dead drunk; he", "sweats not to overthrow your Almain; he gives your Hollander a", "vomit ere the next pottle can be filled."], "id": 331, "m": "Why, he'll easily drink your Dane under the table. He doesn't break a sweat beating your German. He'll have your Dutchman throwing up before the next jug can be filled."}, {"t": "sp", "who": "CASSIO", "lines": ["To the health of our general!"], "id": 332, "m": "To the health of our general!"}, {"t": "sp", "who": "MONTANO", "lines": ["I am for it, lieutenant, and I'll do you justice."], "id": 333, "m": "I'll drink to that, lieutenant, and match you drink for drink."}, {"t": "sp", "who": "IAGO", "lines": ["O sweet England!", "~\"King Stephen was and-a worthy peer,", "~His breeches cost him but a crown;", "~He held them sixpence all too dear,", "~With that he call'd the tailor lown.", "~\"He was a wight of high renown,", "~And thou art but of low degree.", "~'Tis pride that pulls the country down;", "~Then take thine auld cloak about thee.\"", "Some wine, ho!"], "id": 334, "m": "Oh, sweet England! [Sings.] \"King Stephen was a worthy lord; his pants cost him only a crown. He thought them sixpence overpriced, and so he called the tailor a clown. He was a man of high renown, and you are just of low degree. It's pride that brings the country down, so wrap your old cloak around thee.\" Some wine, here!"}, {"t": "sp", "who": "CASSIO", "lines": ["Why, this is a more exquisite song than the other."], "id": 335, "m": "Why, this song is even better than the other one."}, {"t": "sp", "who": "IAGO", "lines": ["Will you hear't again?"], "id": 336, "m": "Do you want to hear it again?"}, {"t": "sp", "who": "CASSIO", "lines": ["No, for I hold him to be unworthy of his place that does", "those things. Well, God's above all, and there be souls must be", "saved, and there be souls must not be saved."], "id": 337, "m": "No, because I think a man who does those things is unworthy of his position. Well, God is above everything, and some souls will be saved, and some souls won't be saved."}, {"t": "sp", "who": "IAGO", "lines": ["It's true, good lieutenant."], "id": 338, "m": "That's true, good lieutenant."}, {"t": "sp", "who": "CASSIO", "lines": ["For mine own part- no offense to the general, nor any man", "of quality- I hope to be saved."], "id": 339, "m": "As for me, no offense to the general or any other man of rank, I hope to be saved."}, {"t": "sp", "who": "IAGO", "lines": ["And so do I too, lieutenant."], "id": 340, "m": "And so do I, lieutenant."}, {"t": "sp", "who": "CASSIO", "lines": ["Ay, but, by your leave, not before me; the lieutenant is to", "be saved before the ancient. Let's have no more of this; let's to", "our affairs. God forgive us our sins! Gentlemen, let's look to", "our business. Do not think, gentlemen, I am drunk: this is my", "ancient, this is my right hand, and this is my left. I am not", "drunk now; I can stand well enough, and I speak well enough."], "id": 341, "m": "Yes, but if you don't mind, not before me. The lieutenant has to be saved before the ensign. Enough of this; let's get to work. God forgive us our sins! Gentlemen, let's see to our duties. Don't think I'm drunk, gentlemen. This is my ensign, this is my right hand, and this is my left. I'm not drunk now. I can stand fine, and I speak fine."}, {"t": "sp", "who": "ALL", "lines": ["Excellent well."], "id": 342, "m": "Very well indeed."}, {"t": "sp", "who": "CASSIO", "lines": ["Why, very well then; you must not think then that I am", "drunk."], "id": 343, "m": "Well, all right then. You mustn't think I'm drunk."}, {"t": "sd", "text": "Exit.", "id": 344}, {"t": "sp", "who": "MONTANO", "lines": ["To the platform, masters; come, let's set the watch."], "id": 345, "m": "To the guard platform, gentlemen. Come, let's post the watch."}, {"t": "sp", "who": "IAGO", "lines": ["You see this fellow that is gone before;", "He is a soldier fit to stand by Caesar", "And give direction. And do but see his vice;", "'Tis to his virtue a just equinox,", "The one as long as the other. 'Tis pity of him.", "I fear the trust Othello puts him in", "On some odd time of his infirmity", "Will shake this island."], "id": 346, "m": "You see that fellow who just left? He's a soldier fit to stand beside Caesar and give orders. And yet look at his vice. It exactly balances his virtue, like day and night at the equinox, one as long as the other. It's a pity. I'm afraid the trust Othello places in him, at some moment when his weakness takes hold, will shake this island."}, {"t": "sp", "who": "MONTANO", "lines": ["But is he often thus?"], "id": 347, "m": "But is he often like this?"}, {"t": "sp", "who": "IAGO", "lines": ["'Tis evermore the prologue to his sleep.", "He'll watch the horologe a double set,", "If drink rock not his cradle."], "id": 348, "m": "It's always how he gets ready for bed. He'll stay awake around the clock twice over unless drink rocks him to sleep."}, {"t": "sp", "who": "MONTANO", "lines": ["It were well", "The general were put in mind of it.", "Perhaps he sees it not, or his good nature", "Prizes the virtue that appears in Cassio", "And looks not on his evils. Is not this true?"], "id": 349, "m": "The general shou
