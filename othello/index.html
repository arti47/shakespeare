d body?"], "id": 1343, "m": "I believe it, and I ask your forgiveness. Will you please ask that half-devil why he trapped my soul and body like this?"}, {"t": "sp", "who": "IAGO", "lines": ["Demand me nothing; what you know, you know.", "From this time forth I never will speak word."], "id": 1344, "m": "Don't ask me anything. What you know, you know. From now on, I'll never say a word."}, {"t": "sp", "who": "LODOVICO", "lines": ["What, not to pray?"], "id": 1345, "m": "What, not even to pray?"}, {"t": "sp", "who": "GRATIANO", "lines": ["Torments will ope your lips."], "id": 1346, "m": "Torture will open your lips."}, {"t": "sp", "who": "OTHELLO", "lines": ["Well, thou dost best."], "id": 1347, "m": "Well, that's the best thing you can do."}, {"t": "sp", "who": "LODOVICO", "lines": ["Sir, you shall understand what hath befall'n,", "Which, as I think, you know not. Here is a letter", "Found in the pocket of the slain Roderigo,", "And here another. The one of them imports", "The death of Cassio to be undertook", "By Roderigo."], "id": 1348, "m": "Sir, you'll understand what has happened, which I don't think you know yet. Here's a letter found in the pocket of the dead Roderigo, and here's another. One of them says that Roderigo was to kill Cassio."}, {"t": "sp", "who": "OTHELLO", "lines": ["O villain!"], "id": 1349, "m": "Oh, villain!"}, {"t": "sp", "who": "CASSIO", "lines": ["Most heathenish and most gross!"], "id": 1350, "m": "Utterly barbaric and monstrous!"}, {"t": "sp", "who": "LODOVICO", "lines": ["Now here's another discontented paper,", "Found in his pocket too; and this, it seems,", "Roderigo meant to have sent this damned villain;", "But that, belike, Iago in the interim", "Came in and satisfied him."], "id": 1351, "m": "Now here's another angry letter, also found in his pocket. It seems Roderigo meant to send it to this damned villain, but Iago probably came along in the meantime and calmed him down."}, {"t": "sp", "who": "OTHELLO", "lines": ["O the pernicious caitiff!", "How came you, Cassio, by that handkerchief", "That was my wife's?"], "id": 1352, "m": "Oh, the evil wretch! Cassio, how did you get that handkerchief that was my wife's?"}, {"t": "sp", "who": "CASSIO", "lines": ["I found it in my chamber;", "And he himself confess'd but even now", "That there he dropp'd it for a special purpose", "Which wrought to his desire."], "id": 1353, "m": "I found it in my room. And he himself confessed just now that he dropped it there for a specific purpose, which worked out the way he wanted."}, {"t": "sp", "who": "OTHELLO", "lines": ["O fool! fool! fool!"], "id": 1354, "m": "Oh, fool! Fool! Fool!"}, {"t": "sp", "who": "CASSIO", "lines": ["There is besides in Roderigo's letter,", "How he upbraids Iago, that he made him", "Brave me upon the watch, whereon it came", "That I was cast. And even but now he spake", "After long seeming dead, Iago hurt him,", "Iago set him on."], "id": 1355, "m": "Roderigo's letter also says that he blamed Iago for making him provoke me while I was on watch, which led to my being dismissed. And just now, after seeming to be dead for a long time, he said that Iago had stabbed him, and that Iago put him up to it."}, {"t": "sp", "who": "LODOVICO", "lines": ["You must forsake this room, and go with us.", "Your power and your command is taken off,", "And Cassio rules in Cyprus. For this slave,", "If there be any cunning cruelty", "That can torment him much and hold him long,", "It shall be his. You shall close prisoner rest,", "Till that the nature of your fault be known", "To the Venetian state. Come, bring away."], "id": 1356, "m": "You have to leave this room and come with us. Your power and command are taken away, and Cassio rules in Cyprus. As for this slave, if there's any clever cruelty that can torture him a lot and keep him alive a long time, it will be his. You will remain a closely guarded prisoner until the Venetian government learns the nature of your crime. Come, bring him away."}, {"t": "sp", "who": "OTHELLO", "lines": ["Soft you; a word or two before you go.", "I have done the state some service, and they know't.", "No more of that. I pray you, in your letters,", "When you shall these unlucky deeds relate,", "Speak of me as I am; nothing extenuate,", "Nor set down aught in malice. Then must you speak", "Of one that loved not wisely but too well;", "Of one not easily jealous, but, being wrought,", "Perplex'd in the extreme; of one whose hand,", "Like the base Indian, threw a pearl away", "Richer than all his tribe; of one whose subdued eyes,", "Albeit unused to the melting mood,", "Drop tears as fast as the Arabian trees", "Their medicinal gum. Set you down this;", "And say besides, that in Aleppo once,", "Where a malignant and a turban'd Turk", "Beat a Venetian and traduced the state,", "I took by the throat the circumcised dog", "And smote him, thus. [Stabs himself.]"], "id": 1357, "m": "Wait. A word or two before you go. I've done the state some service, and they know it. Enough of that. I ask you, in your letters, when you report these unhappy events, describe me as I am. Don't make excuses for me, and don't write anything out of malice. Then you must speak of a man who loved not wisely but too well; of a man not easily made jealous, but who, once manipulated, was driven to extreme confusion; of a man whose hand, like the ignorant Indian, threw away a pearl worth more than his whole tribe; of a man whose defeated eyes, though not used to weeping, now drop tears as fast as Arabian trees drip their healing gum. Write that down. And say also that once in Aleppo, when a hostile, turbaned Turk beat a Venetian and insulted the state, I took the circumcised dog by the throat and struck him, like this. [He stabs himself.]"}, {"t": "sp", "who": "LODOVICO", "lines": ["O bloody period!"], "id": 1358, "m": "Oh, bloody ending!"}, {"t": "sp", "who": "GRATIANO", "lines": ["All that's spoke is marr'd."], "id": 1359, "m": "Everything we said is ruined."}, {"t": "sp", "who": "OTHELLO", "lines": ["I kiss'd thee ere I kill'd thee. No way but this,", "Killing myself, to die upon a kiss."], "id": 1360, "m": "I kissed you before I killed you. There's no other way than this: killing myself, to die upon a kiss."}, {"t": "sd", "text": "Falls on the bed, and dies.", "id": 1361}, {"t": "sp", "who": "CASSIO", "lines": ["This did I fear, but thought he had no weapon;", "For he was great of heart."], "id": 1362, "m": "I was afraid of this, but I thought he had no weapon. He had a great heart."}, {"t": "sp", "who": "LODOVICO", "lines": ["[To Iago.] O Spartan dog,", "More fell than anguish, hunger, or the sea!", "Look on the tragic loading of this bed;", "This is thy work. The object poisons sight;", "Let it be hid. Gratiano, keep the house,", "And seize upon the fortunes of the Moor,", "For they succeed on you. To you, Lord Governor,", "Remains the censure of this hellish villain,", "The time, the place, the torture. O, enforce it!", "Myself will straight aboard, and to the state", "This heavy act with heavy heart relate."], "id": 1363, "m": "[To Iago.] Oh, you vicious dog, more cruel than pain, hunger, or the sea! Look at the tragic load on this bed. This is your work. The sight poisons the eyes; cover it up. Gratiano, take charge of the house and take possession of the Moor's property, because you inherit it. To you, Lord Governor, falls the sentencing of this hellish villain: the time, the place, the torture. Oh, carry it out! I'll go aboard ship right away, and with a heavy heart report this heavy deed to the state."}, {"t": "sd", "text": "Exeunt.", "id": 1364}];

"a3s3": {
"sum": "The turning point. Desdemona promises to press Cassio's case without rest. Cassio slips away as Othello and Iago arrive, and Iago mutters 'I like not that.' Through hints, echoes and pretended reluctance, Iago plants suspicion until Othello demands proof. Desdemona drops the handkerchief Othello gave her; Emilia picks it up and gives it to Iago. Othello, now tormented, threatens Iago if he cannot prove it. Iago invents Cassio's sleep-talking and claims he saw Cassio with the handkerchief. Othello vows revenge, and Iago kneels with him, promising to kill Cassio. Othello makes Iago his lieutenant.",

"sum": "Othello kisses the sleeping Desdemona, tells her to pray, and despite her pleas smothers her. Emilia brings news of the night's attack. Desdemona briefly revives, says she is innocent and that no one killed her, then dies. Othello admits the murder, citing Iago. Emilia realizes the truth and exposes Iago, explaining the handkerchief. Iago kills Emilia and flees but is captured. Letters found on Roderigo confirm everything. Othello asks to be remembered as one who 'loved not wisely but too well,' stabs himself, and dies on the bed. Cassio becomes governor, and Iago is left for torture.",

"notes": {
"9": "Iago's credo. He serves Othello only to exploit him. 'I am not what I am' reverses God's 'I am that I am' (Exodus 3:14), marking Iago as a kind of anti-God and announcing the play's theme of appearance versus reality.",
"21": "Iago uses crude animal imagery and racist language to disgust Brabantio. Animal images (rams, horses, goats, monkeys) run through the play and later infect Othello's own speech.",
"34": "An image of sex as something bestial, again designed to shock. Iago reduces love to animal lust throughout.",
"57": "Othello says he gave up his free, wandering soldier's life only out of love. His confidence in his royal birth and service will be what Iago undermines.",
"84": "A famous example of Othello's calm command. He defuses a street fight with a single elegant line, which makes his later loss of control more shocking.",
"137": "Othello's 'witchcraft' was storytelling. The speech shows his eloquence and that Desdemona fell for his experiences. Note how much power stories have in this play: Iago will defeat Othello with a better (false) story.",
"141": "Desdemona speaks publicly and clearly, unusual for a young woman in a Venetian council. She shifts her duty from father to husband just as her mother did, which is reasonable but becomes evidence for 'deception' in Iago's hands.",
"162": "Brabantio's parting warning. Iago later repeats this argument almost word for word in 3.3 ('She did deceive her father, marrying you').",
"177": "The repeated 'put money in thy purse' shows Iago's real interest in Roderigo: his money. Note also his claim that love is just 'a lust of the blood.'",
"188": "Iago's first soliloquy. He offers a vague new motive (rumors about Othello and Emilia), admits it may be untrue, and says suspicion is enough. Critics like Coleridge called this 'the motive-hunting of a motiveless malignity.' The closing couplet frames the plot as a monstrous birth.",
"273": "Othello's joy is so complete he fears nothing can match it. It's dramatic irony: it will be the last moment of perfect happiness, and death does follow.",
"396": "Cassio values reputation as 'the immortal part' of himself. Compare 3.3, where Iago tells Othello the opposite: a good name is the soul's jewel. Iago adjusts his philosophy to whatever his listener needs.",
"416": "Iago addresses the audience and dares us to call him a villain, since his advice is technically good. 'Divinity of hell' explains his method: devils tempt with heavenly appearances. 'Turn her virtue into pitch' (black tar) sums up his whole plan.",
"504": "'Wretch' is affectionate here. 'Chaos is come again' is chilling foreshadowing: when he stops loving her, his whole ordered world will collapse, which is exactly what happens.",
"533": "Iago praises reputation to Othello, contradicting what he told Cassio in 2.3. The speech makes Othello fear losing his honor, not just his wife.",
"537": "The origin of 'green-eyed monster' for jealousy. The monster 'mocks the meat it feeds on': jealousy torments the very person who feels it. Iago warns against jealousy to provoke it.",
"540": "Othello insists he needs proof and won't be a jealous man. His certainty about his own reason is exactly what Iago exploits next, by supplying 'proof.'",
"563": "Othello's first soliloquy of doubt. He begins to see himself through Venetian prejudice: being Black, unpolished in speech, and older. The falconry image (haggard = a wild hawk) shows him imagining releasing her.",
"594": "Iago states the principle the plot runs on: to a jealous mind, trivial objects become 'proofs of holy writ.' The handkerchief is such a trifle.",
"596": "Iago gloats as Othello re-enters. Poppy and mandragora were sleeping drugs; Othello's peace of mind is gone for good.",
"603": "Othello's farewell to his military identity. Because his sense of self rested on honor and war, losing faith in Desdemona feels like losing his profession too: 'Othello's occupation's gone.'",
"605": "'Ocular proof' means proof he can see. Iago cannot provide it, so he provides stories and the handkerchief instead.",
"635": "An epic simile: his revenge flows one way like the Black Sea current. The kneeling vow with Iago in the next speech is a dark parody of a marriage ceremony.",
"640": "Iago's 'I am your own forever' echoes a marriage vow. Iago has replaced Desdemona as Othello's partner.",
"684": "The handkerchief's origin story makes it a symbol of marital faithfulness and of Othello's heritage. Some readers note he gives a different origin in 5.2 (his father gave it to his mother).",
"710": "Emilia's bitter view of men, from experience with Iago. Her cynicism contrasts with Desdemona's idealism.",
"724": "Emilia's definition of jealousy as self-generating: it needs no real cause. This is the play's core psychological insight.",
"774": "Othello's speech breaks into prose and fragments, a sign of his mind falling apart. Compare the grand verse of 1.3.",
"855": "A moment where his love briefly breaks through his rage.",
"906": "'Goats and monkeys' were symbols of lust. He echoes Iago's words from 3.3 ('as prime as goats, as hot as monkeys'), showing how fully Iago's language has taken him over.",
"956": "Othello imagines Desdemona as a beautiful book with 'whore' written in it. He can't even bring himself to describe what he thinks she did.",
"1062": "The Willow song (a traditional ballad) was sung by a woman abandoned by a mad lover. Willow was a symbol of lost love. It foreshadows Desdemona's death.",
"1079": "Emilia argues women have the same desires and weaknesses as men, and that men who mistreat wives teach them to do wrong. A surprisingly modern argument about double standards.",
"1088": "Iago admits envy of Cassio's goodness. This may be the most honest motive he ever gives.",
"1176": "Othello's soliloquy presents the murder as justice ('the cause') rather than revenge. 'Put out the light, and then put out the light': first the candle, then her life. Unlike the candle, her life can't be relit.",
"1251": "Desdemona's final act is to protect Othello. Her loyalty is total even at her death.",
"1260": "'False as water' (water takes any shape). Emilia's reply, 'rash as fire,' turns the elements back on him.",
"1343": "Othello now sees Iago as half-devil. Iago's refusal to explain keeps his motives a mystery forever.",
"1357": "Othello's final speech. He asks to be remembered honestly, 'one that loved not wisely but too well.' He casts himself as both a Venetian hero and the 'circumcised dog' enemy he once killed, and executes himself as an enemy of the state. Critics debate whether this is nobility or self-dramatizing.",
"1360": "He links the kiss before the murder with his own death, ending the play on the bed where it began for them."
},

const ALIGN={"5": [[0, 3, "Despise me if I don't. Three important men of this city went to him personally, hats in hand, asking him to make me his lieutenant. And I swear, I know what I'm worth: I deserve no lower rank."], [4, 9, "But he, loving his own pride and his own plans, dodged them with a pompous, roundabout speech stuffed with military jargon, and in the end turned my supporters down. \"Truly,\" he says, \"I've already chosen my officer."], [10, 10, "And who was it?"], [11, 19, "A real mathematician, Michael Cassio from Florence (a guy who's nearly ruined by a pretty woman), who has never led a squad in battle and knows no more about deploying troops than an old maid does. All he knows is book theory, which any toga-wearing politician can talk about as well as he can. His whole soldiering is talk without practice. But he got the job."], [20, 25, "And I, whom Othello saw prove myself at Rhodes, at Cyprus, and on other battlefields, Christian and pagan, have to be left dead in the water by a bookkeeper. This number-cruncher gets to be his lieutenant, and I (God help me! am stuck as his Moorship's flag-bearer."]], "9": [[0, 0, "Oh, relax."], [1, 1, "I serve him so I can use him for my own ends."], [2, 7, "We can't all be masters, and not every master can be faithfully served. You've seen plenty of loyal, bowing servants who love their own slavish obedience and wear themselves out like their master's donkey, working for nothing but food, and when they're old they get fired."], [8, 14, "Whip those honest fools, I say. There are others who put on the costume and face of duty while keeping their hearts focused on themselves. They put on a show of service to their lords, profit from it, and once they've lined their pockets they serve only themselves. Those guys have some spirit, and I'm one of them."], [15, 17, "Because, sir, as sure as you're Roderigo, if I were the Moor, I wouldn't want to be Iago."], [18, 18, "In serving him, I'm really serving myself."], [19, 20, "Heaven knows I'm not doing it out of love and duty; I only seem to, for my own private purpose."], [21, 25, "Because when my outward actions start to reveal what's really in my heart, I might as well wear my heart on my sleeve for birds to peck at. I am not what I seem."]], "21": [[0, 0, "Damn it, sir, you've been robbed! For shame, put on your robe."], [1, 1, "Your heart is broken; you've lost half your soul."], [2, 3, "Right now, this very minute, an old black ram is mating with your white ewe. Get up, get up!"], [4, 5, "Ring the bell and wake the snoring citizens, or the devil will make you a grandfather."], [6, 6, "Get up, I tell you!"]], "26": [[0, 0, "All the less welcome."], [1, 1, "I've told you not to hang around my door."], [2, 6, "I've told you plainly that my daughter isn't for you. And now, out of your mind, full of dinner and too much drink, you come here out of spite to disturb my peace."]], "38": [[0, 8, "Sir, I'll answer for anything. But please, if it's with your approval and wise consent (as it partly seems to be) that your lovely daughter, at this dead hour of the night, was carried off with no better protection than a hired gondolier into the crude embrace of a lustful Moor, if you know about this and allowed it, then we've done you a bold and rude wrong."], [9, 12, "But if you don't know, my manners tell me you're scolding us unfairly. Don't think I'd abandon all decency to play games with an honorable man like you."], [13, 17, "Your daughter, if you haven't given her permission, has committed a gross rebellion, tying her duty, beauty, intelligence, and fortune to a wandering foreigner with no home."], [18, 20, "Check for yourself right now: if she's in her room or in your house, let the law punish me for deceiving you."]], "39": [[0, 0, "Strike a light!"], [1, 1, "Give me a candle! Wake up all my servants!"], [2, 2, "This is a lot like my dream."], [3, 3, "Just believing it is crushing me already."], [4, 4, "Light, I say, light!"]], "41": [[0, 0, "Goodbye; I have to leave you."], [1, 15, "It wouldn't be right, or good for my position, to be called as a witness against the Moor, which I will be if I stay. I know the state can't afford to dismiss him, even if this gets him a reprimand. He's been sent off with such urgency to the wars in Cyprus, which are already underway, that they couldn't find anyone else of his caliber to lead them if their souls depended on it. So even though I hate him like the pains of hell, for practical reasons I have to show a flag of loyalty, which really is just a flag. To be sure of finding him, lead the search party to the Sagittary inn. I'll be there with him. Goodbye."]], "44": [[0, 3, "It's horribly true. She's gone, and what's left of my miserable life will be nothing but bitterness. Now, Roderigo, where did you see her? Oh, unhappy girl!"], [4, 4, "With the Moor, you say? Who would want to be a father!"], [5, 6, "How did you know it was her? Oh, she's deceived me beyond belief! What did she say to you? Get more candles."], [7, 7, "Wake all my relatives. Do you think they're married?"]], "46": [[0, 0, "Oh heaven! How did she get out? Oh, betrayal by my own flesh and blood!"], [1, 5, "Fathers, from now on, don't trust your daughters' minds just by how they act. Aren't there spells that can corrupt young virgins? Haven't you read about something like that, Roderigo?"]], "50": [[0, 0, "Please, lead the way. I'll call at every house; most of them will obey me."], [1, 1, "Get weapons!"], [2, 2, "And wake some of the night watch officers."], [3, 3, "Go on, good Roderigo. I'll reward you for your trouble."]], "57": [[0, 0, "Let him do his worst."], [1, 11, "The services I've done for the state will drown out his complaints. People don't know yet (and I'll announce it only when boasting becomes honorable) that I come from royal ancestors, and my merits entitle me, without hat in hand, to as proud a fortune as the one I've won. Because know this, Iago: if I didn't love gentle Desdemona, I wouldn't give up my free, unattached life for all the treasure in the sea. But look! What are those lights over there?"]], "65": [[0, 0, "Something from Cyprus, I'd guess."], [1, 3, "It's urgent business. The warships have sent a dozen messengers tonight, one right after the other, and many of the senators have been woken and are already at the Duke's."], [4, 8, "You've been urgently called for. When you weren't at your lodging, the Senate sent out three separate search parties to find you."]], "85": [[0, 0, "You filthy thief, where have you hidden my daughter?"], [1, 9, "Damned as you are, you've bewitched her. I appeal to common sense: if she weren't bound by magic chains, would a girl so gentle, beautiful, and happy, so against marriage that she rejected the rich, curly-haired young men of our nation, ever run from her father's protection, making herself a public joke, to the sooty chest of a thing like you, something to fear, not to enjoy?"], [10, 13, "Let the world judge if it isn't obvious that you've worked foul spells on her, abused her young innocence with drugs or potions that dull the senses."], [14, 14, "I'll have it tried in court."], [15, 17, "It's probable and obvious. So I arrest you as a corrupter of society, a practitioner of forbidden, illegal arts."], [18, 19, "Seize him. If he resists, subdue him by force."]], "86": [[0, 1, "Hold it, both my side and the rest of you."], [2, 4, "If it were my cue to fight, I'd have known it without a prompter. Where do you want me to go to answer your charge?"]], "88": [[0, 0, "And if I obey?"], [1, 4, "How would that satisfy the Duke, whose messengers are standing here beside me, to bring me to him on urgent state business?"]], "90": [[0, 0, "What?"], [1, 1, "The Duke in council at this time of night? Bring him along."], [2, 4, "My case isn't trivial. The Duke himself, or any of my fellow senators, can't help but feel this wrong as if it were their own."], [5, 6, "Because if things like this are allowed, slaves and heathens will end up running our government."]], "96": [[0, 0, "And mine, two hundred."], [1, 4, "But although they don't agree on the exact number (reports based on estimates often differ), they all confirm a Turkish fleet heading for Cyprus."]], "97": [[0, 0, "Yes, that seems likely enough."], [1, 3, "I don't take false comfort from the discrepancies; I believe the main point, and it scares me."]], "116": [[0, 1, "Brave Othello, we need to send you immediately against our common enemy, the Turks."], [2, 2, "[To Brabantio. I didn't see you there; welcome, good sir."], [3, 3, "We missed your advice and help tonight."]], "117": [[0, 0, "And I missed yours."], [1, 6, "Your Grace, forgive me: it wasn't my position or any news of state business that got me out of bed, and public concerns don't grip me now. My personal grief is so overwhelming, like a flood through open gates, that it swallows up every other sorrow and remains just as huge."]], "121": [[0, 0, "Yes, to me."], [1, 2, "She's been abused, stolen from me, and corrupted by spells and potions bought from con men."], [3, 5, "For nature to go so absurdly wrong, when she isn't defective, blind, or stupid, would be impossible without witchcraft."]], "123": [[0, 0, "I humbly thank your Grace."], [1, 3, "Here is the man: this Moor, who it seems you've summoned here for state affairs."]], "127": [[0, 3, "Most powerful, serious, and respected lords, my noble and proven masters: it's true that I've taken this old man's daughter. It's true; I've married her."], [4, 6, "That's the full extent of my offense, no more. I'm rough in my speech and not gifted with the smooth language of peacetime."], [7, 11, "Since I was seven years old, until about nine months ago, these arms have done their best work on the battlefield, and I can say little about the wider world beyond fighting and battle."], [12, 18, "So I won't help my case much by speaking for myself. Still, with your kind patience, I'll tell you a plain, unpolished story of my whole courtship: what drugs, what charms, what spells, and what powerful magic (since that's what I'm accused of) I used to win his daughter."]], "128": [[0, 4, "A girl who was never bold, so quiet and shy that she blushed at her own feelings. And she, against her nature, her age, her country, her reputation, everything, fell in love with what she was afraid to look at!"], [5, 12, "Only a crippled and faulty judgment would claim that perfection could go so wrong against all the rules of nature. One has to look to the tricks of cunning hell to explain it. So I swear again that he worked on her with some potion that affects the blood, or some drug enchanted for this purpose."]], "130": [[0, 0, "But Othello, speak."], [1, 2, "Did you use underhanded and forced methods to overpower and poison this young woman's affections?"], [3, 4, "Or did it come through courtship and honest conversation, soul to soul?"]], "131": [[0, 2, "I beg you, send for the lady at the Sagittary and let her speak about me in front of her father."], [3, 6, "If her account shows me guilty, don't just take away the trust and command you've given me: let your sentence fall on my life."]], "137": [[0, 3, "Her father loved me and often invited me over. He kept asking me the story of my life, year by year: the battles, sieges, and fortunes I'd been through."], [4, 5, "I told it all, from my boyhood up to the moment he asked."], [6, 11, "I talked about terrible disasters, thrilling adventures at sea and on land, narrow escapes from death when the walls were breached, being captured by an arrogant enemy and sold into slavery, buying my freedom, and how I behaved in all my travels."], [12, 18, "I described huge caves and empty deserts, rough quarries, rocks, and mountains so high they touch heaven; that was my story. And I told of the cannibals who eat each other, the Anthropophagi, and men whose heads grow beneath their shoulders. Desdemona would lean in eagerly to hear all this."], [19, 31, "But household chores would keep pulling her away, and whenever she could finish them quickly, she'd come back and devour my words with a hungry ear. Noticing that, I found a good moment and got her to beg me sincerely to tell her my whole journey in full, since she'd only heard bits and pieces, not the whole story. I agreed, and often brought her to tears when I talked about some painful blow I suffered in my youth. When I finished, she gave me a world of sighs for my trouble."], [32, 32, "She swore it was strange, truly strange, pitiful, so incredibly pitiful."], [33, 38, "She wished she hadn't heard it, yet she wished heaven had made her a man like that. She thanked me and told me that if I had a friend who loved her, I should just teach him how to tell my story, and that would win her. With that hint, I spoke up."], [39, 40, "She loved me for the dangers I had been through, and I loved her because she pitied them."], [41, 41, "That's the only witchcraft I've used."], [42, 42, "Here comes the lady; let her confirm it."]], "139": [[0, 0, "I think a story like that would win my daughter too."], [1, 2, "Good Brabantio, make the best of this messy situation."], [3, 4, "Men would rather fight with broken weapons than with their bare hands."]], "140": [[0, 0, "Please, hear her speak."], [1, 3, "If she admits she was half the wooer, let me be destroyed if I blame the man! Come here, gentle lady."], [4, 5, "Do you see, in this noble company, to whom you owe the most obedience?"]], "141": [[0, 1, "My noble father, I see that my duty is divided here."], [2, 9, "To you I owe my life and upbringing, and both teach me to respect you. You're the one I owe duty to; so far I've been your daughter. But here is my husband. And just as much duty as my mother showed you, putting you before her own father, I claim the right to show to the Moor, my husband."]], "142": [[0, 0, "God be with you! I'm done."], [1, 1, "Your Grace, please, go on to the state business."], [2, 2, "I'd rather adopt a child than have one of my own."], [3, 3, "Come here, Moor."], [4, 7, "I give you, with all my heart, what I'd keep from you with all my heart if you didn't already have it. Because of you, my jewel, I'm glad in my soul I have no other children, because your escape would make me a tyrant, chaining them up."], [8, 9, "I'm done, my lord."]], "143": [[0, 2, "Let me speak as you would, and offer some wise sayings that might be a step to help these lovers back into your good graces."], [3, 4, "When there's no cure left, grief ends once we see the worst that we used to hope wouldn't happen."], [5, 6, "Mourning a misfortune that's past and gone is the surest way to bring a new one."], [7, 8, "When Fortune takes what can't be saved, patience makes a joke of the injury."], [9, 10, "The robbed man who smiles steals something back from the thief; the one who wastes time on useless grief robs himself."]], "144": [[0, 1, "So let the Turks cheat us out of Cyprus; we haven't lost it as long as we can smile."], [2, 3, "A man takes this advice well when it costs him nothing and he only hears the free comfort in it."], [4, 5, "But a man who must pay off his grief by borrowing from his poor patience has to bear both the advice and the sorrow."], [6, 7, "These sayings, sweet or bitter, cut both ways, so they mean nothing."], [8, 9, "Words are just words. I've never heard of a bruised heart being healed through the ear."], [10, 10, "I humbly beg you, go on with the affairs of state."]], "145": [[0, 0, "The Turk is heading for Cyprus with a huge force."], [1, 6, "Othello, you know that place's defenses best. Although we have a highly capable deputy there, public opinion, which ultimately decides things, has more confidence in you. So you'll have to accept tarnishing the shine of your new happiness with this rougher, more violent expedition."]], "146": [[0, 5, "Habit, that tyrant, most serious senators, has made the hard, stony, steel bed of war feel to me like the softest feather bed. I admit I feel a natural, eager readiness for hardship, and I take on this war against the Turks."], [6, 10, "So, humbly bowing to your authority, I ask for proper arrangements for my wife: suitable lodging, an allowance, and the kind of accommodation and company that fits her upbringing."]], "152": [[0, 3, "That I loved the Moor enough to live with him, my bold break with convention and my reckless gamble with my future can announce to the world. My heart has been won over by his very nature."], [4, 6, "I saw Othello's true face in his mind, and I dedicated my soul and fortune to his honor and his courage."], [7, 11, "So, dear lords, if I'm left behind, a useless moth living in peace while he goes to war, I'm robbed of the very things I love him for, and I'll have to endure a heavy wait in his absence. Let me go with him."]], "153": [[0, 0, "Give her your approval."], [1, 4, "Heaven be my witness, I don't ask this to satisfy my appetite or my passions (the urges of youth are dead in me) or for my own pleasure, but to be generous to her wishes."], [5, 14, "And heaven forbid you good men think I'll neglect your serious and important business because she's with me. No: if the light-winged toys of feathered Cupid ever blind my eyes and dull my mind with lust, so that my pleasures corrupt and spoil my work, let housewives turn my helmet into a cooking pot, and let every shameful and humiliating misfortune rise up against my reputation!"]], "158": [[0, 0, "We'll meet here again at nine in the morning."], [1, 4, "Othello, leave an officer behind, and he'll bring you our official orders and whatever else concerns your rank and position."]], "159": [[0, 0, "If it please your Grace, my ensign."], [1, 1, "He's an honest and trustworthy man."], [2, 4, "I'll leave my wife in his care, along with anything else your Grace thinks should be sent after me."]], "160": [[0, 0, "So be it."], [1, 3, "Good night, everyone. [To Brabantio. And, noble sir, if goodness has its own beauty, your son-in-law is far more fair than black."]], "164": [[0, 1, "I'd bet my life on her loyalty! Honest Iago, I have to leave my Desdemona with you."], [2, 3, "Please have your wife look after her, and bring them after me when it's most convenient."], [4, 6, "Come, Desdemona, I have only an hour to spend with you on love, practical matters, and instructions. We must do what the time demands."]], "175": [[0, 0, "Strength? Nonsense! It's up to us whether we're one way or another."], [1, 8, "Our bodies are gardens, and our wills are the gardeners. Whether we plant nettles or lettuce, grow hyssop or weed out thyme, fill it with one kind of herb or many, let it go barren through laziness or fertilize it with hard work, the power to control all this lies in our wills. If our lives didn't have reason on one side of the scale to balance our desires on the other, our lust and baser nature would lead us to absurd results."], [9, 11, "But we have reason to cool our raging urges, our sexual desires, our unbridled lusts. And I think what you call love is just an offshoot of that."]], "177": [[0, 12, "It's nothing but lust of the blood that the will allows. Come on, be a man! Drown yourself? Drown cats and blind puppies. I've said I'm your friend, and I admit I'm bound to you with unbreakable cables. I've never been more useful to you than now. Put money in your wallet. Follow the army to the wars. Disguise your face with a fake beard. I'm telling you, put money in your wallet. Desdemona can't go on loving the Moor for long (put money in your wallet), nor he her. It started violently, and you'll see it end just as abruptly (just put money in your wallet). These Moors are fickle (fill your wallet with money). The food that tastes as sweet as candy to him now will soon taste as bitter as poison. She'll want someone younger. When she's had enough of his body, she'll realize her mistake."], [13, 22, "She has to have a change, she must, so put money in your wallet. If you're set on damning yourself, do it in a more pleasant way than drowning. Raise all the money you can. If a holy ceremony and a fragile vow between a wandering barbarian and an overly clever Venetian girl aren't too much for my wits and all the powers of hell, you'll have her. So make money. To hell with drowning yourself! It's completely beside the point. You'd be better off being hanged for getting what you want than drowning without her."]], "188": [[0, 0, "This is how I always make my fool pay my way."], [1, 8, "I'd be wasting what I've learned if I spent time with such an idiot except for my own fun and profit. I hate the Moor. And people say he's slept with my wife. I don't know if it's true, but just the suspicion is enough for me; I'll act as if it were certain. He thinks well of me; that will make my plan work on him all the better. Cassio's a handsome man."], [9, 13, "Let me see now: how to get his job and pull off my plan in a double scam. How? How? Let's see. After a while, I'll whisper in Othello's ear that Cassio is too familiar with his wife."], [14, 15, "Cassio has the looks and smooth manner to be suspected; he's made to make women unfaithful."], [16, 19, "The Moor is open and trusting by nature. He thinks men are honest if they only seem to be, and he can be led by the nose as easily as a donkey. I've got it."], [20, 21, "It's conceived. Hell and darkness must bring this monstrous birth into the light of the world."]], "194": [[0, 0, "I think the wind has roared loudly on land too; a stronger gust never shook our walls."], [1, 4, "If it has been this violent at sea, what oak ships can hold together when mountains of water crash down on them? What news will we hear after this?"]], "195": [[0, 0, "That the Turkish fleet has been scattered."], [1, 5, "Just stand on the foaming shore: the battered waves seem to hit the clouds, and the wind-whipped surge, with its huge monstrous mane, seems to throw water on the stars of the Great Bear and put out the stars that guard the fixed North Star."], [6, 7, "I've never seen such turmoil on the raging sea."]], "198": [[0, 0, "News, men! Our war is over."], [1, 4, "This furious storm has smashed the Turks so badly that their plans are finished. A noble ship from Venice saw most of their fleet wrecked and ruined."]], "203": [[0, 2, "I pray to heaven he is. I've served under him, and the man commands like a true soldier."], [3, 6, "Let's go to the shore! We'll see the ship that's come in, and look out for brave Othello until the sea and the sky blur together."]], "208": [[0, 1, "His ship is solidly built, and his pilot is highly skilled and experienced."], [2, 3, "So my hopes, which aren't yet dead, are still strong."]], "224": [[0, 0, "He's had a very quick and lucky voyage."], [1, 6, "Storms, high seas, howling winds, jagged rocks, and sandbars (traitors lying underwater to trap innocent ships) all seem to have a sense of beauty and set aside their deadly nature to let the divine Desdemona pass safely."]], "228": [[0, 1, "Oh, look! The ship's treasure has come ashore!"], [2, 2, "Men of Cyprus, kneel to her."], [3, 5, "Hail to you, lady! May heaven's grace surround you, in front, behind, and on every side!"]], "237": [[0, 0, "Good ensign, welcome. [To Emilia. Welcome, madam."], [1, 3, "Don't be offended, good Iago, that I'm being so forward with my manners. It's my upbringing that makes me show such bold courtesy. [Kisses her.]"]], "240": [[0, 0, "Honestly, she says too much."], [1, 1, "I notice it whenever I want to sleep."], [2, 4, "Of course, in front of you, my lady, I admit she bites her tongue a bit and only scolds in her thoughts."]], "252": [[0, 1, "I'm working on it, but my ideas come out of my head like glue off a wool cloth: they pull my brains out with them."], [2, 5, "But my Muse is in labor, and here's what she gives birth to: If a woman is fair and wise, with beauty and brains, her beauty is for using, and her brains know how to use it."]], "261": [[0, 5, "A woman who was always beautiful but never proud, who could speak her mind but was never loud, who always had money but never dressed flashy, who held back from what she wanted even when she could have it; a woman who, when angered and able to take revenge, let the insult go and her anger fade; a woman who was never so foolish as to trade something good for something worthless; who could think without blurting out her thoughts, and could have men chasing her without looking back."], [6, 10, "She'd be the kind of woman, if such a woman ever existed..."]], "266": [[0, 0, "[Aside. He takes her by the hand. Yes, that's it, whisper."], [1, 7, "With a web this small I'll catch a fly as big as Cassio. Yes, smile at her, go on. I'll trap you in your own courtly manners. That's right, exactly. If tricks like these cost you your lieutenancy, you'd have been better off not kissing your fingers so often, which you're now so eager to do again like a fine gentleman. Very good. Nicely kissed! Excellent manners! Exactly. Your fingers to your lips again?"], [8, 8, "I wish they were enema tubes, for your sake! [Trumpet offstage."], [9, 9, "The Moor! I know his trumpet."]], "273": [[0, 1, "It's as amazing as it is wonderful to find you here before me. Oh, my soul's joy!"], [2, 3, "If every storm is followed by a calm like this, let the winds blow until they wake the dead!"], [4, 10, "Let the struggling ship climb mountains of waves as high as Olympus and then drop as low as hell is from heaven! If I were to die right now, I'd die the happiest man alive, because I'm afraid my soul is so completely content that I'll never feel happiness like this again in my unknown future."]], "275": [[0, 0, "Amen to that, sweet heaven!"], [1, 1, "I can't say enough about how happy I am."], [2, 2, "It catches me here; it's too much joy."], [3, 4, "And may this, and this [Kisses her], be the worst conflict our hearts ever have!"]], "277": [[0, 0, "Come, let's go to the castle."], [1, 1, "News, friends: the war is over; the Turks have drowned."], [2, 2, "How are my old friends on this island?"], [3, 7, "Darling, you'll be very welcome in Cyprus; I've found great affection here. Oh, my sweet, I'm babbling and going on about my own happiness. Please, good Iago, go to the bay and unload my chests."], [8, 11, "Bring the ship's captain to the fort; he's a good man, and his ability deserves a lot of respect. Come, Desdemona. Once again, welcome to Cyprus."]], "279": [[0, 2, "Meet me at the harbor right away. Come here. If you're brave (and they say even lowborn men get a nobility from being in love that they don't normally have), listen to me."], [3, 4, "The lieutenant is on guard duty tonight. First, I have to tell you this: Desdemona is definitely in love with him."]], "281": [[0, 10, "Put your finger to your lips like this, and let your soul learn something. Remember how violently she first loved the Moor, just because he bragged and told her fantastic lies. Will she keep loving him for his chatter? Don't you believe it. Her eyes need feeding, and what pleasure will she get from looking at the devil? When sex has dulled the passion, it takes good looks, a similar age, manners, and beauty to rekindle it and give a full stomach a fresh appetite, and the Moor lacks all of these. Without these necessary qualities, her delicate sensibilities will feel cheated. She'll start to feel sick, lose her taste for the Moor, and loathe him."], [11, 23, "Nature itself will teach her this and push her to a second choice. Now, sir, given that (and it's a very obvious and natural conclusion), who is better placed to get lucky than Cassio? A smooth-talking rascal, with no more conscience than it takes to put on a show of politeness and manners to hide his lustful, secret desires. Nobody, nobody! A slippery, cunning rascal, an opportunist, with an eye that can create and fake opportunities even when no real ones exist. A devilish rascal! Besides, he's handsome, young, and has everything that foolish, inexperienced women look for. A thoroughly rotten rascal, and the woman has already got her eye on him."]], "283": [[0, 2, "Blessed nonsense! The wine she drinks is made of grapes like anyone else's. If she were so blessed, she'd never have loved the Moor. Blessed pudding! Didn't you see her stroking the palm of his hand?"], [3, 3, "Didn't you notice that?"]], "285": [[0, 4, "It was lust, I swear by this hand. A preview and secret prologue to a story of lust and dirty thoughts. Their lips came so close that their breath embraced. Villainous thoughts, Roderigo! When these intimacies lead the way, soon after comes the main event, the joining of bodies."], [5, 6, "Disgusting! But, sir, do as I say. I brought you from Venice. Be on guard duty tonight; I'll arrange for you to be posted."], [7, 10, "Cassio doesn't know you. I won't be far away. Find some way to make Cassio angry, either by talking too loudly, or mocking his discipline, or any other way you like that the moment offers."]], "287": [[0, 3, "Sir, he's reckless and quick-tempered, and he may well hit you. Provoke him so he does. Because from that alone I'll get the people of Cyprus to riot, and they won't be calmed down again until Cassio is removed."], [4, 7, "That way you'll have a shorter path to what you want, through the means I'll then have to advance you, and the obstacle will be conveniently removed. Without that, we'd have no hope of success."]], "292": [[0, 0, "That Cassio loves her, I can well believe."], [1, 1, "That she loves him is likely and very believable."], [2, 13, "The Moor, though I can't stand him, is faithful, loving, and noble by nature, and I'd guess he'll be a very loving husband to Desdemona. Now, I love her too, not purely out of lust (though I may be guilty of just as great a sin), but partly to feed my revenge, because I suspect the lusty Moor has slept with my wife. The thought of it eats at my insides like poison, and nothing can or will satisfy my soul until I get even with him, wife for wife. Or if I fail at that, then at least I'll make the Moor so jealous that reason can't cure him."], [14, 25, "To do that, if this Venetian trash Roderigo, whom I keep on a leash so he'll hunt eagerly, does what I push him to do, I'll have Michael Cassio at my mercy. I'll slander him to the Moor as a womanizer (because I suspect Cassio with my wife too), and make the Moor thank me, love me, and reward me for making a complete fool of him and scheming against his peace of mind until he goes mad. The plan is here in my head, but still muddled."], [26, 26, "Villainy never shows its full face until it's put to use."]], "302": [[0, 0, "Iago is very honest."], [1, 3, "Michael, good night. Come talk to me first thing tomorrow. Come, my dear love. The deal is made; now the rewards are to follow."], [4, 4, "That pleasure is still to come between you and me."], [5, 5, "Good night."]], "323": [[0, 6, "If I can just get one more cup into him, on top of what he's already had tonight, he'll be as quarrelsome and touchy as a little lady's lapdog. Now my lovesick fool Roderigo, whom love has turned almost inside out, has tonight been drinking toasts to Desdemona by the jugful, and he's on guard duty."], [7, 13, "Three young men of Cyprus, proud and touchy about their honor, the very essence of this warlike island, I've gotten drunk tonight with overflowing cups, and they're on watch too. Now, among this flock of drunks, I'll get Cassio to do something that will offend the island. But here they come."], [14, 15, "If things turn out the way I've imagined, my boat will sail freely with both wind and current behind it."]], "327": [[0, 0, "Some wine, here!"], [1, 1, "[Sings."], [2, 2, "\"And let me clink the drinking cup, clink, clink; and let me clink the drinking cup."], [3, 5, "A soldier's a man; a man's life is short; so let a soldier drink."], [6, 6, "Some wine, boys!"]], "334": [[0, 0, "Oh, sweet England!"], [1, 2, "[Sings. \"King Stephen was a worthy lord; his pants cost him only a crown."], [3, 4, "He thought them sixpence overpriced, and so he called the tailor a clown."], [5, 6, "He was a man of high renown, and you are just of low degree."], [7, 7, "It's pride that brings the country down, so wrap your old cloak around thee."], [8, 9, "Some wine, here!"]], "346": [[0, 0, "You see that fellow who just left?"], [1, 2, "He's a soldier fit to stand beside Caesar and give orders. And yet look at his vice."], [3, 4, "It exactly balances his virtue, like day and night at the equinox, one as long as the other. It's a pity."], [5, 7, "I'm afraid the trust Othello places in him, at some moment when his weakness takes hold, will shake this island."]], "349": [[0, 1, "The general should be told about it."], [2, 4, "Maybe he doesn't see it, or his good nature values the good qualities in Cassio and overlooks his faults. Isn't that right?"]], "353": [[0, 2, "And it's a great pity that the noble Moor would risk such an important post as his second-in-command on a man with such an ingrained weakness."], [3, 4, "It would be the honest thing to tell the Moor."]], "376": [[0, 0, "Why, what's this? How did this start?"], [1, 2, "Have we turned into Turks and done to ourselves what heaven stopped the Turks from doing?"], [3, 3, "For the sake of Christian decency, stop this savage brawl."], [4, 5, "The next man who moves to strike out of his own anger doesn't value his life; he dies the moment he moves."], [6, 7, "Silence that terrible bell; it's scaring the island out of its wits. What's the matter, gentlemen?"], [8, 9, "Honest Iago, you look dead with grief. Speak: who started this? I order you, by your loyalty."]], "377": [[0, 6, "I don't know. Everyone was friends just a moment ago, getting along like a bride and groom undressing for bed. And then, just now, as if some planet had driven men insane, swords were out and they were lunging at each other's chests in a bloody fight. I can't tell you how this stupid quarrel began."], [7, 8, "I wish I'd lost my legs in some glorious battle rather than have them bring me here to see any part of it!"]], "380": [[0, 0, "Worthy Montano, you used to be well-behaved."], [1, 6, "The world has noticed your seriousness and calm since your youth, and the wisest judges speak highly of you. What's going on, that you throw away your reputation like this and trade your good name for that of a night-time brawler? Answer me."]], "381": [[0, 0, "Worthy Othello, I'm seriously hurt."], [1, 7, "Your officer Iago can tell you everything I know, while I save my breath, since talking hurts me right now. I don't know of anything I've said or done wrong tonight, unless looking after yourself is sometimes a vice, and defending ourselves is a sin when violence attacks us."]], "382": [[0, 12, "Now, by heaven, my temper is starting to overrule my better judgment, and anger, having clouded my reason, is trying to take over. If I move, or even lift this arm, the best of you will fall under my punishment. Tell me how this disgraceful riot started and who began it. Whoever is proven guilty, even if he were my twin brother, born at the same moment, will lose me. What? In a garrison town, still unsettled, with the people's hearts full of fear, to start a private, personal quarrel at night, at the very guard post meant to keep the peace!"], [13, 13, "It's outrageous. Iago, who started it?"]], "384": [[0, 0, "Don't hit me where it hurts."], [1, 2, "I'd rather have my tongue cut out than have it harm Michael Cassio."], [3, 4, "Still, I'm sure telling the truth won't hurt him. Here's what happened, general."], [5, 9, "Montano and I were talking when a man came running in shouting for help, with Cassio chasing him, sword drawn, ready to strike him. Sir, this gentleman stepped in front of Cassio and begged him to stop."], [10, 19, "I went after the screaming man so his shouting wouldn't frighten the town, which is what happened anyway. He was too fast for me, and I came back all the quicker because I heard swords clashing and Cassio swearing loudly, which I'd never heard him do before tonight. When I got back (all this happened quickly), I found them fighting at close quarters, striking and thrusting, just as they were when you yourself separated them. I can't tell you any more than that."], [20, 21, "But men are men; even the best sometimes forget themselves."], [22, 26, "Though Cassio did him some small wrong, as men in a rage strike even those who mean them well, I do believe Cassio must have received some outrageous insult from the man who ran away, something he couldn't let pass."]], "391": [[0, 1, "Iago, look carefully around the town and calm down anyone this ugly brawl has upset."], [2, 2, "Come, Desdemona."], [3, 3, "This is the soldier's life: having peaceful sleep broken by fighting."]], "398": [[0, 2, "I'd rather ask to be despised than trick such a good commander into keeping such a worthless, drunken, reckless officer. Drunk? Babbling like a parrot?"], [3, 5, "Squabbling, swaggering, swearing, ranting nonsense at my own shadow? Oh, you invisible spirit of wine, if you don't have a name yet, let's call you devil!"]], "409": [[0, 4, "You or any man alive can get drunk sometimes, man. I'll tell you what to do. Our general's wife is now the general. I can say that because he has devoted himself completely to admiring and studying her qualities and charms. Confess everything to her."], [5, 8, "Beg her to help you get your job back. She's so generous, so kind, so willing, so good-natured that she thinks it's a fault in her goodness not to do more than she's asked."], [9, 10, "Ask her to set this broken bone between you and her husband, and I'll bet everything I have that this crack in your friendship will heal stronger than before."]], "416": [[0, 14, "So who can say I'm playing the villain, when the advice I give is free and honest, reasonable, and really the way to win the Moor back? Because it's very easy to get the willing Desdemona to support any honest request. She's as generous as the free elements. And it's just as easy for her to win over the Moor; even if it meant renouncing his baptism and every sign and symbol of his salvation, his soul is so chained to his love for her that she can make, unmake, or do whatever she likes with him, as her desire plays god over his weak will. So how am I a villain for advising Cassio to take this path, which leads straight to his own good? The theology of hell!"], [15, 21, "When devils want to commit the blackest sins, they first tempt with heavenly appearances, as I'm doing now. Because while this honest fool begs Desdemona to fix his fortunes, and she pleads hard for him with the Moor, I'll pour this poison into the Moor's ear: that she wants Cassio back because she lusts for him."], [22, 23, "And the harder she tries to help Cassio, the more she'll destroy the Moor's trust in her."], [24, 26, "That's how I'll turn her goodness into tar, and from her own kindness make the net that will catch them all."]], "420": [[0, 0, "How poor are those who have no patience!"], [1, 1, "What wound ever healed except gradually?"], [2, 3, "You know we work with brains and not with witchcraft, and brains have to wait for the right time."], [4, 5, "Isn't it going well? Cassio beat you, and with that small injury you've gotten Cassio fired."], [6, 7, "Other things may grow well in the sun, but the fruits that blossom first will ripen first."], [8, 8, "Be patient for a while. By God, it's morning."], [9, 9, "Pleasure and action make the hours fly by. Go away, go to where you're staying."], [10, 10, "Go, I said. You'll find out more later."], [11, 11, "No, get out of here. [Roderigo leaves."], [12, 12, "Two things need to be done. My wife has to plead for Cassio with her mistress; I'll get her to do it."], [13, 17, "Meanwhile I'll draw the Moor aside and bring him in at exactly the moment he can find Cassio pleading with his wife. Yes, that's the way."], [18, 18, "Don't let the plan go stale through hesitation and delay."]], "448": [[0, 0, "I'll send her to you right away."], [1, 3, "And I'll come up with a way to get the Moor out of the way, so you two can talk business more freely."]], "451": [[0, 1, "Good morning, good lieutenant. I'm sorry you're out of favor, but I'm sure everything will be fine."], [2, 9, "The general and his wife are talking about it, and she's defending you strongly. The Moor says the man you injured is well known in Cyprus and well connected, and that the wise thing was to dismiss you. But he insists he cares for you, and needs no one to plead for you but his own affection to take the first safe chance to bring you back."]], "457": [[0, 1, "Iago, give these letters to the ship's pilot and have him send my respects to the Senate."], [2, 2, "When that's done, I'll be walking on the fortifications."], [3, 3, "Meet me there."]], "468": [[0, 0, "I know it, and I thank you. You love my husband."], [1, 3, "You've known him a long time. And rest assured, he'll keep his distance from you only as long as is politically necessary."]], "470": [[0, 3, "Don't worry about that. With Emilia here as witness, I guarantee you'll get your position back. I promise you, if I swear friendship, I'll keep it to the letter. My husband will never get any rest."], [4, 4, "I'll keep him awake until he gives in, and talk until he runs out of patience."], [5, 5, "His bed will feel like a school and his dinner table like a confessional."], [6, 9, "I'll mix Cassio's case into everything he does. So cheer up, Cassio, because your advocate would rather die than give up on you."]], "486": [[0, 2, "Why, your lieutenant, Cassio. My good lord, if I have any charm or power to persuade you, make up with him now."], [3, 5, "Because if he isn't someone who truly loves you, who made a mistake out of ignorance and not on purpose, then I can't judge an honest face."], [6, 6, "Please, call him back."]], "496": [[0, 1, "Then tomorrow night, or Tuesday morning, or Tuesday noon, or night, or Wednesday morning."], [2, 3, "Please name the time, but don't let it be more than three days. Honestly, he's sorry."], [4, 7, "And by ordinary standards his offense (except that they say in wartime you have to make an example of the best men) is hardly a fault worth even a private scolding. When can he come?"], [8, 14, "Tell me, Othello. I really wonder what you could ask of me that I'd refuse, or hesitate over like this. What? Michael Cassio, who came with you when you were courting me, and who so many times took your side when I criticized you? And to have to work this hard to bring him back! Believe me, I could do a lot more—"]], "498": [[0, 0, "Why, this isn't a favor."], [1, 7, "It's like asking you to wear your gloves, or eat healthy food, or keep warm, or begging you to do something good for yourself. No, when I have a request that really tests your love, it'll be serious and difficult, and risky to grant."]], "520": [[0, 2, "\"Thinking, my lord? By heaven, he echoes me, as if there were some monster in his mind too hideous to show. You mean something."], [3, 4, "I heard you say just now that you didn't like it when Cassio left my wife. What didn't you like?"], [5, 6, "And when I told you he was in my confidence during my whole courtship, you said, \"Really!"], [7, 10, "and frowned and wrinkled your brow, as if you'd locked some horrible idea in your brain. If you love me, tell me what you're thinking."]], "522": [[0, 0, "I think you do."], [1, 3, "And because I know you're full of love and honesty, and weigh your words before you say them, these pauses of yours frighten me all the more."], [4, 7, "In a lying, disloyal villain, things like this are just habitual tricks. But in an honest man, they're secret signals coming from the heart, which feelings can't control."]], "528": [[0, 0, "No, there's more to this."], [1, 3, "Please tell me what you're thinking, as you're turning it over, and put your worst thoughts into your worst words."]], "529": [[0, 0, "My good lord, forgive me."], [1, 2, "Though I'm bound to perform every duty, I'm not bound to do what even slaves aren't required to do."], [3, 3, "Speak my thoughts? Why, suppose they're vile and false?"], [4, 8, "After all, where's the palace that dirty things don't sometimes get into? Who has a heart so pure that some unclean suspicions don't hold court there and sit in judgment alongside fair thoughts?"]], "531": [[0, 7, "I beg you, since I may be wrong in my guess (I admit it's a curse of my nature to look for wrongdoing, and my suspicion often invents faults that aren't there), that your wisdom ignore someone whose ideas are so unreliable, and not create trouble for yourself out of my scattered, uncertain observations."], [8, 10, "It wouldn't be good for your peace of mind or your well-being, or for my manhood, honesty, or wisdom, to tell you what I'm thinking."]], "533": [[0, 1, "A good reputation, for a man or a woman, my dear lord, is the most precious jewel of their souls."], [2, 2, "Whoever steals my wallet steals trash."], [3, 3, "It's something, yet nothing; it was mine, now it's his, and it's been owned by thousands."], [4, 6, "But whoever steals my good name takes something that doesn't make him any richer and leaves me truly poor."]], "537": [[0, 0, "Oh, beware of jealousy, my lord!"], [1, 3, "It's the green-eyed monster that mocks the very food it feeds on. The husband whose wife cheats on him is happy if he knows the truth and doesn't love the woman who betrays him."], [4, 5, "But oh, what damned minutes a man counts out who adores his wife yet doubts her, suspects her yet loves her deeply!"]], "539": [[0, 0, "A man who's poor and content is rich, and rich enough."], [1, 2, "But endless riches are as poor as winter to a man who's always afraid he'll become poor."], [3, 4, "Good heaven, protect the souls of all my kind from jealousy!"]], "540": [[0, 0, "Why, why are you saying this?"], [1, 9, "Do you think I'd live a life of jealousy, changing my suspicions with every phase of the moon? No! Once I'm in doubt, I'll settle it at once. Trade me for a goat if I ever let my soul be taken up with inflated, overblown suspicions like the ones you're hinting at. It doesn't make me jealous to hear that my wife is beautiful, has a good appetite, enjoys company, speaks freely, sings, plays, and dances well."], [10, 10, "Where there's virtue, these things only make it more virtuous."], [11, 12, "And I won't take the smallest fear or doubt of her unfaithfulness from my own shortcomings, because she had eyes and she chose me."], [13, 14, "No, Iago, I'll see before I doubt."], [15, 16, "When I doubt, I'll get proof. And once there's proof, that's it: away with either love or jealousy!"]], "541": [[0, 3, "I'm glad to hear it, because now I'll have reason to show my love and loyalty to you more openly. So, as is my duty, hear this from me. I'm not talking about proof yet. Watch your wife."], [4, 4, "Watch her closely with Cassio."], [5, 5, "Keep your eyes like this, neither jealous nor too trusting."], [6, 7, "I wouldn't want your open and noble nature to be taken advantage of because of your own generosity."], [8, 8, "Watch out. I know our Venetian ways well."], [9, 11, "In Venice women let heaven see the tricks they don't dare show their husbands. Their idea of conscience isn't to avoid doing it, but to keep it secret."]], "545": [[0, 0, "Well, there you go."], [1, 3, "She was so young, yet she could put on such a show and blind her father's eyes as tight as oak grain; he thought it was witchcraft."], [4, 5, "But I'm very much to blame. I humbly beg your pardon for loving you too much."]], "549": [[0, 0, "Honestly, I'm afraid it has."], [1, 2, "I hope you'll consider that what I've said comes from my love for you. But I can see you're upset."], [3, 5, "I have to ask you not to stretch what I've said to bigger conclusions or wider meaning than mere suspicion."]], "555": [[0, 5, "Yes, that's the point. To be blunt with you: she rejected many proposed matches with men of her own country, color, and rank, which is what nature tends toward in all things. Ugh, you can smell in a desire like that something rotten, a foul mismatch, unnatural thoughts."], [6, 10, "But forgive me. I'm not speaking specifically about her, although I may fear that her desire, returning to her better judgment, may start to compare you with men from her own country, and maybe regret her choice."]], "559": [[0, 1, "[Returning. My lord, I wish I could beg you not to look into this any further. Leave it to time."], [2, 5, "Although Cassio should have his job back, since he certainly does it very well, if you would keep him waiting for a while, you'll learn a lot about him and his methods."], [6, 7, "Notice if your lady pushes hard for him to be reinstated with strong or urgent pleading."], [8, 11, "That will tell you a lot. In the meantime, think of me as too quick to fear the worst (as I have good reason to think I am), and consider her innocent, I beg you."]], "563": [[0, 15, "This fellow is extremely honest, and he knows all kinds of people and understands human behavior. If I find out she's wild like an untamed hawk, even if her leashes were tied to my own heartstrings, I'd release her and let her fly off on the wind to fend for herself. Maybe because I'm black, and don't have the smooth way of talking that courtiers have, or because I'm getting on in years (though not by much), she's gone. I've been betrayed, and my only relief must be to hate her. Oh, the curse of marriage, that we can call these delicate creatures ours but not their desires! I'd rather be a toad living on the stale air of a dungeon than keep a corner of the thing I love for others to use. Yet it's the plague of great men; they have fewer privileges than ordinary men."], [16, 17, "It's an inescapable destiny, like death."], [18, 19, "We're fated to wear the cuckold's horns from the moment we're born. Here comes Desdemona."]], "576": [[0, 0, "I'm glad I found this handkerchief."], [1, 1, "It was her first keepsake from the Moor."], [2, 8, "My unpredictable husband has asked me a hundred times to steal it. But she loves it so much (because he made her swear to always keep it) that she always has it with her to kiss and talk to. I'll have the embroidery copied and give it to Iago. What he'll do with it heaven knows, not me."], [9, 9, "I only want to satisfy his whims."]], "594": [[0, 3, "I'll drop this handkerchief in Cassio's room and let him find it. Things as light as air seem to the jealous as strong a proof as Holy Scripture. This may do something."], [4, 4, "The Moor is already changing under my poison."], [5, 8, "Dangerous ideas are by nature poisons, which at first barely taste bad, but once they start working on the blood, they burn like sulfur mines. I said so."], [9, 9, "Look, here he comes!"]], "601": [[0, 0, "What did I know about her stolen hours of lust?"], [1, 1, "I didn't see it or think it, and it didn't hurt me."], [2, 2, "I slept well the next night, was carefree and happy."], [3, 3, "I didn't find Cassio's kisses on her lips."], [4, 5, "If a man who's been robbed doesn't miss what was stolen, don't tell him, and he hasn't been robbed at all."]], "603": [[0, 3, "I'd have been happy if the whole army, down to the lowest ditch-diggers, had tasted her sweet body, as long as I knew nothing about it. Oh, now, forever, goodbye to a peaceful mind!"], [4, 9, "Goodbye to contentment! Goodbye to the plumed troops and the great wars that make ambition a virtue! Oh, goodbye, goodbye to the neighing horse and the shrill trumpet, the spirit-stirring drum, the ear-piercing flute, the royal flag, and all the qualities, pride, pageantry, and ceremony of glorious war!"], [10, 12, "And you deadly cannons, whose rough throats imitate the terrifying thunder of immortal Jove, goodbye! Othello's career is over!"]], "605": [[0, 0, "Villain, you'd better prove my love is a whore."], [1, 1, "Make sure of it. Give me proof I can see with my own eyes."], [2, 4, "Or, by the value of man's eternal soul, you'd have been better off born a dog than face my awakened fury!"]], "609": [[0, 1, "If you're slandering her and torturing me, never pray again. Give up all conscience."], [2, 2, "Pile horrors on top of horrors."], [3, 3, "Do things that make heaven weep and astonish the whole earth."], [4, 5, "Because you can't add anything to your damnation worse than that."]], "610": [[0, 0, "Oh, mercy! Heaven protect me!"], [1, 1, "Are you a man? Do you have a soul or any sense?"], [2, 3, "God be with you; take my job. Oh, miserable fool, to live to see your honesty turned into a crime!"], [4, 5, "Oh, monstrous world! Take note, take note, world: being direct and honest isn't safe."], [6, 7, "Thank you for this lesson. From now on I'll love no friend, since love leads to such insults."]], "613": [[0, 1, "By the world, I think my wife is faithful, and I think she isn't."], [2, 2, "I think you're honest, and I think you're not. I'll have some proof."], [3, 7, "Her reputation, which was as fresh as the face of Diana, goddess of chastity, is now as dirty and black as my own face. As long as there are ropes or knives, poison or fire or drowning streams, I won't put up with it. I wish I knew for sure!"]], "618": [[0, 3, "I think it would be very hard to arrange for you to see that. Damn them if any eyes but their own ever see them in bed together! So what then? How then?"], [4, 4, "What can I say? Where's your proof?"], [5, 11, "You can't possibly see this, even if they were as horny as goats, as hot as monkeys, as lustful as wolves in heat, and as stupid as drunken idiots. But still, I say, if strong evidence and circumstances that lead straight to the door of truth will satisfy you, you can have that."]], "620": [[0, 0, "I don't like this job."], [1, 5, "But since I've gone this far into it, driven by foolish honesty and love, I'll go on. I was sharing a bed with Cassio recently, and since I had a terrible toothache, I couldn't sleep."], [6, 7, "There are some men so loose-lipped that they talk about their affairs in their sleep."], [8, 8, "Cassio is one of them."], [9, 10, "In his sleep I heard him say, \"Sweet Desdemona, let's be careful; let's hide our love."], [11, 16, "And then, sir, he'd grab and squeeze my hand, cry out, \"Oh, sweet creature! and kiss me hard, as if he were pulling up kisses by the roots that grew on my lips. Then he laid his leg over my thigh, and sighed, and kissed, and then cried, \"Cursed fate that gave you to the Moor!\""]], "626": [[0, 0, "No, be sensible. We haven't seen her do anything yet."], [1, 1, "She may still be faithful."], [2, 3, "Just tell me this: haven't you sometimes seen a handkerchief embroidered with strawberries in your wife's hand?"]], "631": [[0, 0, "Oh, I wish the villain had forty thousand lives!"], [1, 1, "One is too poor, too weak for my revenge."], [2, 3, "Now I see it's true. Look here, Iago: I blow all my foolish love away to heaven. It's gone."], [4, 5, "Rise, black vengeance, from your hollow hell!"], [6, 8, "Give up, love, your crown and your throne in my heart to tyrannical hate! Swell, my heart, with your cargo, because it's made of snakes' tongues!"]], "636": [[0, 0, "Don't get up yet. [He kneels."], [1, 7, "Witness, you stars burning forever above, you elements that surround us, witness that Iago here dedicates all his intelligence, his hands, and his heart to the service of wronged Othello! Let him command, and I'll obey out of compassion for him, whatever bloody deed it is. [They stand.]"]], "637": [[0, 2, "I welcome your loyalty, not with empty thanks but with full acceptance, and I'll put you to the test right now."], [3, 4, "Within the next three days, let me hear you say that Cassio is dead."]], "639": [[0, 0, "Damn her, the lewd slut! Oh, damn her!"], [1, 3, "Come, come away with me. I'll go and figure out some quick way to kill the beautiful devil. Now you're my lieutenant."]], "670": [[0, 0, "This suggests a passionate and generous heart."], [1, 6, "Hot, hot, and moist. This hand of yours needs to be kept away from freedom, with fasting and prayer, a lot of discipline, and religious exercise, because there's a young, sweating devil here that often rebels. It's a good hand, a very open one."]], "682": [[0, 1, "That's a mistake. An Egyptian woman gave that handkerchief to my mother."], [2, 10, "She was a sorceress who could almost read people's minds. She told my mother that as long as she kept it, it would make her desirable and keep my father completely in love with her. But if she lost it or gave it away, my father would look at her with disgust and his desires would go chasing after new loves. When she was dying, she gave it to me and told me to give it to my wife when I married."], [11, 11, "I did, so take good care of it. Treasure it like your own precious eyes."], [12, 13, "To lose it or give it away would be a disaster like no other."]], "684": [[0, 0, "It's true. There's magic woven into it."], [1, 3, "A prophetess who had lived two hundred years sewed it in a prophetic trance."], [4, 6, "The silkworms that made the silk were sacred, and it was dyed with fluid from mummified virgins' hearts."]], "710": [[0, 0, "It doesn't take a year or two to show us what a man is."], [1, 1, "They're all just stomachs and we're just food."], [2, 3, "They eat us hungrily, and when they're full, they belch us up. Look! Cassio and my husband."]], "714": [[0, 4, "Madam, the same request as before. I beg you, through your good influence, let me live again and be a part of the love of the man I honor with all my heart. I don't want any delay."], [5, 9, "If my offense is so serious that neither my past service, nor my present sorrow, nor my promise of good service in the future can buy back his love, then just knowing that will be a benefit to me."], [10, 12, "Then I'll force myself to be content and take some other path, relying on Fortune's charity."]], "715": [[0, 0, "Alas, thrice-gentle Cassio!"], [1, 1, "My pleading isn't working right now."], [2, 3, "My husband isn't himself. I wouldn't recognize him if his face had changed as much as his mood."], [4, 7, "So help me every holy spirit, I've spoken for you as well as I can and made myself the target of his anger for speaking so freely! You'll have to be patient for a while. What I can do, I will."], [8, 9, "And I'll do more for you than I'd dare to do for myself. Let that be enough for you."]], "718": [[0, 3, "Can he be angry? I've seen the cannon blow his soldiers into the air and, like the devil, blast his own brother right out of his arms. And he's angry?"], [4, 4, "It must be something important, then. I'll go find him."], [5, 5, "There's really something to it if he's angry."]], "721": [[0, 5, "It must be some state business, either news from Venice or some plot uncovered here in Cyprus, that has muddied his clear mind. In cases like that, men's tempers quarrel with small things even though big things are really on their minds. That's how it is."], [6, 12, "If our finger aches, the rest of our healthy body feels the pain too. No, we have to remember men aren't gods, and we can't expect them to be as attentive as on the wedding day. Scold me, Emilia: like the clumsy soldier I am, I was accusing him of unkindness in my heart."], [13, 14, "But now I realize I bribed the witness, and he's been falsely charged."]], "724": [[0, 0, "But jealous people won't accept that answer."], [1, 3, "They're not jealous for a reason; they're jealous because they're jealous. It's a monster that conceives itself and gives birth to itself."]], "733": [[0, 0, "And I was going to your place, Cassio."], [1, 1, "What, stay away for a week? Seven days and nights?"], [2, 3, "A hundred and sixty-eight hours? And lovers' hours apart are a hundred and sixty times longer than clock hours."], [4, 4, "Oh, what a tiring count!"]], "734": [[0, 0, "Forgive me, Bianca."], [1, 1, "I've been weighed down with heavy thoughts lately."], [2, 3, "But when I have more uninterrupted time, I'll pay off this debt of absence. Sweet Bianca,"]], "737": [[0, 0, "Oh, Cassio, where did this come from?"], [1, 1, "This is a gift from some new girlfriend."], [2, 2, "Now I know the reason for your absence."], [3, 3, "Has it come to this? Well, well."]], "738": [[0, 0, "Come on, woman!"], [1, 3, "Throw your nasty guesses back in the devil's teeth, where you got them from. Now you're jealous that this is from some mistress, some keepsake."], [4, 4, "No, I swear, Bianca."]], "740": [[0, 0, "I don't know, sweetheart. I found it in my room."], [1, 2, "I like the embroidery. Before someone asks for it back (which they probably will), I'd like to have it copied."], [3, 3, "Take it and do it, and leave me for now."]], "756": [[0, 0, "Naked in bed, Iago, and not mean any harm!"], [1, 1, "That's hypocrisy aimed at the devil."], [2, 3, "People who mean well and still do that are having their virtue tempted by the devil, and they're tempting heaven."]], "762": [[0, 0, "By heaven, I'd gladly have forgotten it."], [1, 3, "You said (oh, it hangs over my memory like a raven over a plague-stricken house, a bad omen for everyone) that he had my handkerchief."]], "765": [[0, 1, "What if I'd said I'd seen him wrong you?"], [2, 6, "Or heard him say... There are scoundrels out there who, once they've seduced a woman by their own persistent pleading or because she willingly fell for them, can't help bragging about it—"]], "774": [[0, 3, "Lie with her! Lie on her! We say \"lie on her\" when people tell lies about her. Lie with her! Damn it, that's disgusting! Handkerchief... confessions... handkerchief! Let him confess and be hanged for it. No, first hang him, and then let him confess. I'm shaking."], [4, 5, "My body wouldn't be overcome by such dark passion if there weren't some truth to this. It isn't just words that shake me like this."], [6, 7, "Ugh! Noses, ears, and lips. Is it possible? Confess? Handkerchief? Oh, devil!"]], "776": [[0, 3, "Keep working, my medicine, keep working! This is how gullible fools are caught. And this is how many worthy, chaste women, completely innocent, get disgraced. Hey! My lord!"], [4, 4, "My lord, I say! Othello!"]], "782": [[0, 0, "No, don't."], [1, 1, "The fit has to run its course quietly."], [2, 3, "Otherwise he foams at the mouth and soon breaks out into savage madness. Look, he's moving."], [4, 6, "Step away for a little while. He'll recover soon. When he's gone, I need to talk to you about something important."]], "790": [[0, 0, "Good sir, be a man."], [1, 4, "Think of every bearded man who's married: he's pulling the same cart you are. There are millions of men alive right now who go to bed every night in beds others have used, and they'd swear those beds were theirs alone."], [5, 8, "Your situation is better. Oh, it's hell's own spite, the devil's greatest joke, to kiss a slut in a bed you think is safe and believe she's chaste! No, I'd rather know. And knowing what I am, I know what she'll get."]], "792": [[0, 1, "Stand aside for a while and keep yourself under control."], [2, 5, "While you were lying here overcome by your grief (a passion that doesn't suit a man like you), Cassio came by. I got rid of him and gave a good excuse for your fit."], [6, 9, "I told him to come back soon and talk to me here, which he promised to do. Just hide yourself and watch the sneers, the mockery, and the obvious contempt all over his face."], [10, 12, "Because I'll get him to tell the story again: where, how, how often, how long ago, and when he has slept with your wife and will again."], [13, 15, "Just watch his gestures, I say. But be patient, or I'll say you're nothing but temper and not a man at all."]], "796": [[0, 4, "Now I'll ask Cassio about Bianca, a woman who sells her body to buy herself bread and clothes. She's crazy about Cassio, since it's a whore's curse to fool many men and be fooled by one."], [5, 6
