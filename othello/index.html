, "When he hears her name, he can't help laughing his head off. Here he comes."]], "798": [[0, 0, "When he smiles, Othello will go mad."], [1, 3, "And his ignorant jealousy will completely misread poor Cassio's smiles, gestures, and lighthearted behavior. How are you now, lieutenant?"]], "828": [[0, 4, "Let the devil and his mother follow you around! What did you mean by that handkerchief you just gave me? I was a real fool to take it. I'm supposed to copy the embroidery? A likely story, that you found it in your room and don't know who left it there! This is a present from some slut, and I'm supposed to copy it?"], [5, 6, "Here, give it to your little whore. Wherever you got it, I won't copy any of it."]], "849": [[0, 2, "Yes, let her rot and perish and be damned tonight, because she won't live. No, my heart has turned to stone. I hit it, and it hurts my hand. Oh, the world has no sweeter creature."], [3, 3, "She could lie beside an emperor and give him orders."]], "897": [[0, 0, "Oh, devil, devil!"], [1, 2, "If the earth could be made pregnant by women's tears, every tear she drops would turn into a crocodile."], [3, 3, "Get out of my sight!"]], "904": [[0, 0, "Yes, you wanted me to make her turn around."], [1, 2, "Sir, she can turn and turn, and still keep going, and turn again. And she can cry, sir, cry."], [3, 4, "And she's obedient, as you say, obedient, very obedient. Go on with your tears."], [5, 6, "About this letter, sir... Oh, what a well-acted show of grief! I'm ordered home."], [7, 8, "Get out of here; I'll send for you soon. Sir, I'll obey the order and return to Venice. Go, get out!"]], "915": [[0, 0, "Alas, alas!"], [1, 5, "It wouldn't be honest of me to tell you what I've seen and known. You watch him, and his own actions will show you what he is, so I won't have to say anything. Just follow him and see how he goes on."]], "931": [[0, 2, "My lord, I'd bet my soul that she's faithful. If you think otherwise, get rid of the thought; it's poisoning your heart."], [3, 4, "If some wretch has put this into your head, let heaven punish him with the curse it gave the serpent!"], [5, 7, "Because if she isn't honest, chaste, and true, no husband is happy; the purest wife is as foul as slander."]], "934": [[0, 2, "She says enough. But any brothel-keeper who couldn't say as much would be a simple one. This woman's a clever whore, a locked cabinet full of wicked secrets."], [3, 3, "And yet she'll kneel and pray; I've seen her do it."]], "941": [[0, 1, "[To Emilia. Do your job, madam. Leave the lovers alone and shut the door."], [2, 2, "Cough or say \"ahem\" if anyone comes."], [3, 3, "Your trade, your trade! Go on, hurry."]], "946": [[0, 0, "Come on, swear it, and damn yourself."], [1, 2, "Because you look like an angel, the devils themselves might be afraid to grab you."], [3, 3, "So be doubly damned: swear you're faithful."]], "951": [[0, 0, "Oh, what a terrible day! Why are you crying?"], [1, 1, "Am I the reason for these tears, my lord?"], [2, 5, "If you suspect my father had a hand in your being called home, don't blame me. If you've lost his friendship, well, I've lost him too."]], "952": [[0, 8, "If heaven had wanted to test me with suffering, if it had rained every kind of sore and shame on my bare head, drowned me in poverty up to my lips, made a prisoner of me and all my highest hopes, I'd have found somewhere in my soul a drop of patience. But, alas, to make me a fixed target for the scornful world to point its slow, unmoving finger at!"], [9, 9, "Still, I could bear that too, well, very well."], [10, 13, "But there, where I've stored up my heart, where I must either live or not live at all, the spring my life flows from or else dries up: to be thrown out of there!"], [14, 17, "Or to have to keep it as a tank where filthy toads tangle and breed! Change color at that, Patience, you young, rosy-lipped angel. Yes, at that, look as grim as hell!"]], "956": [[0, 1, "Was this beautiful paper, this lovely book, made to have \"whore\" written on it? Committed?"], [2, 2, "What have you committed? Oh, you common prostitute!"], [3, 5, "If I just named what you've done, my cheeks would burn like furnaces and turn modesty to ashes. What have you committed!"], [6, 6, "Heaven holds its nose at it, and the moon shuts its eyes."], [7, 9, "The promiscuous wind, which kisses everything it meets, hides in the hollow caves of the earth and won't listen to it. What have you committed?"], [10, 10, "Shameless whore!"]], "959": [[0, 0, "No, as I'm a Christian."], [1, 3, "If keeping this body for my husband alone, away from any other foul, unlawful touch, means I'm not a whore, then I'm not one."]], "964": [[0, 0, "Then I beg your pardon."], [1, 4, "I mistook you for that cunning whore of Venice who married Othello. [Raising his voice. You, madam, whose job is the opposite of Saint Peter's, guarding the gate of hell!"]], "975": [[0, 0, "I have none. Don't talk to me, Emilia."], [1, 4, "I can't cry, and I have no answers except tears. Please, tonight, put my wedding sheets on my bed. Remember. And call your husband here."]], "981": [[0, 1, "I don't know. People who teach young children do it gently and with easy tasks."], [2, 3, "He could have scolded me that way, because honestly, I'm a child when it comes to being scolded."]], "998": [[0, 0, "May a noose forgive him! And may hell gnaw his bones!"], [1, 1, "Why would he call her a whore?"], [2, 2, "Who has she been with? Where? When? How? What's the evidence?"], [3, 4, "The Moor's been tricked by some vicious villain, some low, notorious villain, some scummy creep."], [5, 8, "Oh heaven, I wish you'd expose such men and put a whip in every honest hand to lash those rascals naked across the world, from east to west!"]], "1002": [[0, 1, "Oh, good Iago, what should I do to win my husband back?"], [2, 3, "Good friend, go to him, because by the light of heaven, I don't know how I lost him."], [4, 13, "Here I kneel. If my heart ever betrayed his love, either in thought or in action, or if my eyes, my ears, or any of my senses ever took pleasure in any other man, or if I don't still love him dearly, and always did, and always will, even if he throws me off into a beggarly divorce, may I never know comfort again! Unkindness can do a lot, and his unkindness may destroy my life, but it will never spoil my love."], [14, 14, "I can't say \"whore. It disgusts me just to say the word."], [15, 16, "Not all the riches in the world could make me do what would earn that name."]], "1005": [[0, 0, "That's all it is, I promise. [Trumpets offstage."], [1, 1, "Listen, those trumpets are calling everyone to supper!"], [2, 2, "The messengers from Venice are waiting to eat."], [3, 3, "Go in, and don't cry. Everything will be fine."]], "1056": [[0, 0, "My mother had a maid named Barbary."], [1, 2, "She was in love, and the man she loved went mad and left her. She had a song called \"Willow."], [3, 7, "It was an old song, but it described her situation, and she died singing it. Tonight I can't get that song out of my head. It's all I can do not to hang my head to one side and sing it like poor Barbary. Please, hurry."]], "1062": [[0, 0, "[Singing."], [1, 4, "\"The poor soul sat sighing by a sycamore tree, sing all a green willow; her hand on her chest, her head on her knee, sing willow, willow, willow."], [5, 6, "The fresh streams ran by her and murmured her moans, sing willow, willow, willow; her salt tears fell from her and softened the stones."], [7, 11, "Put these away. \"Sing willow, willow, willow. Please, hurry; he'll be here soon. \"Sing all a green willow must be my garland."], [12, 13, "Let nobody blame him; I accept his scorn. No, that's not the next line. Listen, who's knocking?"]], "1064": [[0, 0, "[Singing."], [1, 1, "\"I called my love false love; but what did he say then?"], [2, 2, "Sing willow, willow, willow."], [3, 4, "If I court more women, you'll sleep with more men. So go now. Good night. My eyes itch."], [5, 5, "Does that mean I'll cry?"]], "1066": [[0, 0, "I've heard it said that it does. Oh, these men, these men!"], [1, 3, "Do you honestly think (tell me, Emilia) that there are women who cheat on their husbands so grossly?"]], "1075": [[0, 0, "Honestly, I think I would, and undo it once I'd done it."], [1, 5, "Of course, I wouldn't do it for a cheap ring, or for some fine linen, or for dresses, petticoats, hats, or any little gift. But for the whole world? Why, who wouldn't cheat on her husband to make him a king? I'd risk purgatory for that."]], "1079": [[0, 1, "Yes, a dozen, and as many more as would fill the world they gambled for."], [2, 13, "But I do think it's the husbands' fault when wives go wrong. Say they neglect their duties and pour what's ours into other women's laps; or they break out in petty jealousy and lock us up; or say they hit us, or cut our allowance out of spite. Why, we have tempers, and though we have some kindness, we can also take revenge. Husbands should know their wives have senses like them. They see and smell and have tastes for both sweet and sour, just like husbands. What are they doing when they trade us for other women? Is it for fun?"], [14, 14, "I think it is. Does desire drive it? I think it does."], [15, 15, "Is it weakness that makes them stray?"], [16, 17, "That too. And don't we have desires, a wish for fun, and weakness, just like men?"], [18, 19, "So let them treat us well. Otherwise, let them know that the wrongs we do, they taught us."]], "1084": [[0, 0, "Here, stand behind this wall. He'll be here any minute."], [1, 1, "Have your sword drawn, and drive it in deep."], [2, 2, "Quick, quick. Don't be afraid; I'll be right beside you."], [3, 4, "This makes us or breaks us. Think about that, and keep your resolve firm."]], "1088": [[0, 6, "I've rubbed this young pimple almost raw, and he's getting angry. Now, whether he kills Cassio, or Cassio kills him, or they kill each other, I win either way. If Roderigo lives, he'll demand I pay back all the gold and jewels I swindled from him as gifts for Desdemona. That can't happen."], [7, 10, "If Cassio survives, he has a daily goodness in his life that makes me look ugly. Besides, the Moor might reveal my story to him, and then I'm in great danger."], [11, 11, "No, he has to die. So be it. I hear him coming."]], "1101": [[0, 1, "It's him. Oh, brave Iago, honest and fair, who feels his friend's wrong so nobly! You're teaching me."], [2, 3, "You slut, your lover lies dead, and your own cursed fate is coming fast. Whore, I'm coming!"], [4, 4, "Those charms of yours, your eyes, are wiped from my heart."], [5, 5, "Your bed, stained with lust, will be spattered with lust's blood."]], "1149": [[0, 1, "Gentlemen, I suspect this trash had a part in this attack."], [2, 2, "Be patient a little while, good Cassio."], [3, 3, "Come, come, give me a light. Do we know this face or not?"], [4, 5, "Oh no, my friend and dear countryman Roderigo? No... yes, it is. Oh heaven! Roderigo."]], "1157": [[0, 0, "It's him, it's him. [A chair is brought in. Oh, good, the chair."], [1, 2, "Someone carry him carefully away from here."], [3, 5, "I'll get the general's surgeon. [To Bianca. As for you, madam, don't bother. Cassio, the man lying dead here was my dear friend. What quarrel was there between you?"]], "1161": [[0, 0, "Stay, good gentlemen. Are you pale, madam?"], [1, 1, "Do you see the terror in her eyes?"], [2, 2, "No, if you stare like that, we'll hear more soon."], [3, 3, "Look at her closely; please, look at her."], [4, 5, "Do you see, gentlemen? Guilt will speak for itself, even if no one says a word."]], "1172": [[0, 0, "Kind gentlemen, let's go see poor Cassio's wounds dressed."], [1, 1, "Come, madam, you'll have to tell us a different story."], [2, 3, "Emilia, run to the fort and tell my lord and lady what's happened!"], [4, 5, "Will you go ahead? [Aside. This is the night that either makes me or completely ruins me."]], "1176": [[0, 0, "It's the cause, it's the cause, my soul."], [1, 1, "Let me not name it to you, you chaste stars!"], [2, 4, "It's the cause. Yet I won't shed her blood, or scar that skin of hers, whiter than snow and smooth as marble on a tomb."], [5, 5, "Yet she must die, or she'll betray more men."], [6, 6, "Put out the light, and then put out the light."], [7, 14, "If I put you out, you flaming candle, I can light you again if I change my mind. But once I put out your light, you most perfect model of nature's best work, I don't know where to find the divine fire that could relight you. Once I've picked the rose, I can't make it grow again. It has to wither. I'll smell it while it's still on the bush. [He kisses her."], [15, 16, "Oh, sweet breath, that almost persuades Justice to break her sword! One more, one more."], [17, 18, "Be like this when you're dead, and I'll kill you and love you afterward. One more, and this is the last."], [19, 21, "Nothing so sweet was ever so deadly. I have to cry, but these are cruel tears. This sorrow is like heaven's: it punishes what it loves. She's waking up."]], "1195": [[0, 0, "It's an unnatural death that kills someone for loving."], [1, 1, "Oh, why are you biting your lower lip like that?"], [2, 2, "Some violent passion is shaking your whole body."], [3, 4, "These are bad signs. But still I hope, I hope, they aren't aimed at me."]], "1202": [[0, 0, "Yes, right now."], [1, 4, "So confess your sin freely, because denying each charge under oath can't remove or smother the strong belief that's tormenting me. You are going to die."]], "1206": [[0, 0, "By heaven, I saw my handkerchief in his hand."], [1, 3, "Oh, lying woman! You turn my heart to stone, and make me call what I'm going to do a murder, when I thought it was a sacrifice."], [4, 4, "I saw the handkerchief."]], "1228": [[0, 0, "What's that noise? Not dead? Not quite dead yet?"], [1, 1, "I may be cruel, but I'm still merciful."], [2, 2, "I don't want you to linger in pain."], [3, 3, "There, there."]], "1232": [[0, 0, "Yes, it's Emilia. In a moment. She's dead."], [1, 1, "She's probably coming to tell me about Cassio's death."], [2, 2, "The noise was loud. Ha! No more moving?"], [3, 3, "Still as the grave. Should I let her in? Would that be wise?"], [4, 4, "I think she's moving again. No. What's the best thing to do?"], [5, 5, "If she comes in, she'll certainly speak to my wife."], [6, 6, "My wife! My wife! What wife? I have no wife."], [7, 7, "Oh, unbearable! Oh, terrible hour!"], [8, 10, "I think there should be a huge eclipse of the sun and moon right now, and the terrified earth should split open at this change."]], "1262": [[0, 0, "Cassio slept with her. Ask your husband if you don't believe me."], [1, 3, "Oh, I'd be damned to the lowest depths of hell if I hadn't had good reason to go this far. Your husband knew all about it."]], "1277": [[0, 1, "You don't have half the power to hurt me that I have to endure it. Oh, you idiot!"], [2, 4, "You fool! As ignorant as dirt! You've done a deed... I don't care about your sword. I'll expose you, even if I lose twenty lives. Help! Help!"], [5, 5, "Help! The Moor has killed my mistress! Murder, murder!"]], "1282": [[0, 0, "Prove this villain wrong, if you're a man."], [1, 1, "He says you told him his wife was unfaithful."], [2, 2, "I know you didn't; you're not that kind of villain."], [3, 3, "Speak, because my heart is about to burst."]], "1294": [[0, 0, "Villainy, villainy, villainy!"], [1, 1, "I'm thinking about it, I'm thinking, I can smell it. Oh, villainy!"], [2, 2, "I suspected it back then. I'll kill myself with grief."], [3, 3, "Oh, villainy, villainy!"]], "1299": [[0, 0, "[Standing. Oh, she was filthy!"], [1, 2, "I hardly recognized you, uncle. There lies your niece, whose breath these hands have just stopped."], [3, 3, "I know this looks horrible and grim."]], "1300": [[0, 0, "Poor Desdemona! I'm glad your father's dead."], [1, 5, "Your marriage killed him; pure grief cut his old thread of life in two. If he were alive now, this sight would drive him to some desperate act. He'd curse his guardian angel away and fall into damnation."]], "1304": [[0, 0, "It'll come out, it will. Me, be quiet?"], [1, 1, "No, I'll speak as freely as the north wind."], [2, 3, "Let heaven and men and devils, let all of them, all, all, cry shame on me, and I'll still speak."]], "1320": [[0, 1, "He's an infamous villain. Take this weapon, which I've just taken from the Moor."], [2, 4, "Come, guard the door from outside. Don't let him pass; kill him first. I'll go after that villain, because he's a damned slave."]], "1322": [[0, 1, "I'm not brave anymore either; any puny little fighter can take my sword."], [2, 2, "But why should my reputation outlive my honor?"], [3, 3, "Let it all go."]], "1323": [[0, 0, "What did your song predict, lady?"], [1, 2, "Listen, can you hear me? I'll be like the swan and die singing. [Singing. \"Willow, willow, willow."], [3, 3, "Moor, she was chaste. She loved you, cruel Moor."], [4, 4, "May my soul go to heaven as I'm telling the truth."], [5, 5, "Saying what I believe, I die, I die. [She dies.]"]], "1329": [[0, 0, "Look, I have a weapon."], [1, 5, "A better one never hung at a soldier's side. I've seen the day when, with this little arm and this good sword, I fought my way through obstacles twenty times stronger than you. But, oh, what an empty boast! Who can control his fate?"], [6, 6, "It's not like that now."], [7, 7, "Don't be afraid, even though you see me armed."], [8, 9, "This is the end of my journey, my final goal, the landmark of my last voyage."], [10, 10, "Are you backing away in fear? There's no need."], [11, 12, "Just point a reed at Othello's chest, and he'll retreat. Where would Othello go?"], [13, 13, "Now, how do you look now? Oh, unlucky girl! Pale as your nightgown!"], [14, 16, "When we meet on Judgment Day, this look of yours will hurl my soul out of heaven, and devils will snatch it up. Cold, cold, my girl?"], [17, 17, "Just like your chastity. Oh, cursed, cursed slave that I am!"], [18, 19, "Whip me, you devils, away from the sight of this heavenly creature!"], [20, 20, "Blow me around in the winds! Roast me in sulfur!"], [21, 21, "Wash me in deep pits of liquid fire!"], [22, 22, "Oh, Desdemona! Dead, Desdemona! Dead!"], [23, 23, "Oh! Oh! Oh!"]], "1353": [[0, 0, "I found it in my room."], [1, 3, "And he himself confessed just now that he dropped it there for a specific purpose, which worked out the way he wanted."]], "1356": [[0, 0, "You have to leave this room and come with us."], [1, 7, "Your power and command are taken away, and Cassio rules in Cyprus. As for this slave, if there's any clever cruelty that can torture him a lot and keep him alive a long time, it will be his. You will remain a closely guarded prisoner until the Venetian government learns the nature of your crime. Come, bring him away."]], "1357": [[0, 0, "Wait. A word or two before you go."], [1, 1, "I've done the state some service, and they know it. Enough of that."], [2, 6, "I ask you, in your letters, when you report these unhappy events, describe me as I am. Don't make excuses for me, and don't write anything out of malice."], [7, 13, "Then you must speak of a man who loved not wisely but too well; of a man not easily made jealous, but who, once manipulated, was driven to extreme confusion; of a man whose hand, like the ignorant Indian, threw away a pearl worth more than his whole tribe; of a man whose defeated eyes, though not used to weeping, now drop tears as fast as Arabian trees drip their healing gum."], [14, 18, "Write that down. And say also that once in Aleppo, when a hostile, turbaned Turk beat a Venetian and insulted the state, I took the circumcised dog by the throat and struck him, like this. [He stabs himself.]"]], "1363": [[0, 1, "[To Iago. Oh, you vicious dog, more cruel than pain, hunger, or the sea!"], [2, 2, "Look at the tragic load on this bed."], [3, 3, "This is your work. The sight poisons the eyes; cover it up."], [4, 8, "Gratiano, take charge of the house and take possession of the Moor's property, because you inherit it. To you, Lord Governor, falls the sentencing of this hellish villain: the time, the place, the torture. Oh, carry it out!"], [9, 10, "I'll go aboard ship right away, and with a heavy heart report this heavy deed to the state."]]};
const PARTS={"5": [[0, 3, "Despise me if I don't. Three important men of this city went to him personally, hats in hand, asking him to make me his lieutenant. And I swear, I know what I'm worth: I deserve no lower rank."], [4, 10, "But he, loving his own pride and his own plans, dodged them with a pompous, roundabout speech stuffed with military jargon, and in the end turned my supporters down. \"Truly,\" he says, \"I've already chosen my officer. And who was it?"], [11, 19, "A real mathematician, Michael Cassio from Florence (a guy who's nearly ruined by a pretty woman), who has never led a squad in battle and knows no more about deploying troops than an old maid does. All he knows is book theory, which any toga-wearing politician can talk about as well as he can. His whole soldiering is talk without practice. But he got the job."], [20, 25, "And I, whom Othello saw prove myself at Rhodes, at Cyprus, and on other battlefields, Christian and pagan, have to be left dead in the water by a bookkeeper. This number-cruncher gets to be his lieutenant, and I (God help me! am stuck as his Moorship's flag-bearer."]], "9": [[0, 7, "Oh, relax. I serve him so I can use him for my own ends. We can't all be masters, and not every master can be faithfully served. You've seen plenty of loyal, bowing servants who love their own slavish obedience and wear themselves out like their master's donkey, working for nothing but food, and when they're old they get fired."], [8, 14, "Whip those honest fools, I say. There are others who put on the costume and face of duty while keeping their hearts focused on themselves. They put on a show of service to their lords, profit from it, and once they've lined their pockets they serve only themselves. Those guys have some spirit, and I'm one of them."], [15, 20, "Because, sir, as sure as you're Roderigo, if I were the Moor, I wouldn't want to be Iago. In serving him, I'm really serving myself. Heaven knows I'm not doing it out of love and duty; I only seem to, for my own private purpose."], [21, 25, "Because when my outward actions start to reveal what's really in my heart, I might as well wear my heart on my sleeve for birds to peck at. I am not what I seem."]], "38": [[0, 8, "Sir, I'll answer for anything. But please, if it's with your approval and wise consent (as it partly seems to be) that your lovely daughter, at this dead hour of the night, was carried off with no better protection than a hired gondolier into the crude embrace of a lustful Moor, if you know about this and allowed it, then we've done you a bold and rude wrong."], [9, 12, "But if you don't know, my manners tell me you're scolding us unfairly. Don't think I'd abandon all decency to play games with an honorable man like you."], [13, 20, "Your daughter, if you haven't given her permission, has committed a gross rebellion, tying her duty, beauty, intelligence, and fortune to a wandering foreigner with no home. Check for yourself right now: if she's in her room or in your house, let the law punish me for deceiving you."]], "41": [[0, 7, "Goodbye; I have to leave you. It wouldn't be right, or good for my position, to be called as a witness against the Moor, which I will be if I stay. I know the state can't afford to dismiss him, even if this gets him a reprimand. He's been sent off with such urgency to the wars in Cyprus, which are already underway, that they couldn't find anyone else of his caliber to lead them if their souls depended on it."], [8, 15, "So even though I hate him like the pains of hell, for practical reasons I have to show a flag of loyalty, which really is just a flag. To be sure of finding him, lead the search party to the Sagittary inn. I'll be there with him. Goodbye."]], "56": [[0, 5, "No, but he went on and said such vile, provoking things about you that, with what little holiness I have, I could barely hold back. But tell me, sir, are you really married? Be sure of this:"], [6, 11, "the old man is much loved here, and his influence is as powerful as the Duke's. He'll force a divorce, or put whatever restrictions and penalties on you the law allows, and he'll push it as far as it goes."]], "57": [[0, 3, "Let him do his worst. The services I've done for the state will drown out his complaints."], [4, 11, "People don't know yet (and I'll announce it only when boasting becomes honorable) that I come from royal ancestors, and my merits entitle me, without hat in hand, to as proud a fortune as the one I've won. Because know this, Iago: if I didn't love gentle Desdemona, I wouldn't give up my free, unattached life for all the treasure in the sea. But look! What are those lights over there?"]], "85": [[0, 9, "You filthy thief, where have you hidden my daughter? Damned as you are, you've bewitched her. I appeal to common sense: if she weren't bound by magic chains, would a girl so gentle, beautiful, and happy, so against marriage that she rejected the rich, curly-haired young men of our nation, ever run from her father's protection, making herself a public joke, to the sooty chest of a thing like you, something to fear, not to enjoy?"], [10, 14, "Let the world judge if it isn't obvious that you've worked foul spells on her, abused her young innocence with drugs or potions that dull the senses. I'll have it tried in court. It's probable and obvious."], [15, 19, "So I arrest you as a corrupter of society, a practitioner of forbidden, illegal arts. Seize him. If he resists, subdue him by force."]], "104": [[0, 6, "It can't be, by any reasoning. It's a show to make us look the wrong way."], [7, 13, "When we consider how important Cyprus is to the Turks, and remember that it matters more to them than Rhodes does, and also that they can take it more easily because it isn't as well defended and lacks Rhodes's fortifications, if we think about this, we can't believe the Turk is so foolish as to leave until last what concerns him most, giving up an easy and profitable attack to stir up a pointless danger."]], "127": [[0, 6, "Most powerful, serious, and respected lords, my noble and proven masters: it's true that I've taken this old man's daughter. It's true; I've married her. That's the full extent of my offense, no more. I'm rough in my speech and not gifted with the smooth language of peacetime."], [7, 11, "Since I was seven years old, until about nine months ago, these arms have done their best work on the battlefield, and I can say little about the wider world beyond fighting and battle."], [12, 18, "So I won't help my case much by speaking for myself. Still, with your kind patience, I'll tell you a plain, unpolished story of my whole courtship: what drugs, what charms, what spells, and what powerful magic (since that's what I'm accused of) I used to win his daughter."]], "128": [[0, 4, "A girl who was never bold, so quiet and shy that she blushed at her own feelings. And she, against her nature, her age, her country, her reputation, everything, fell in love with what she was afraid to look at!"], [5, 12, "Only a crippled and faulty judgment would claim that perfection could go so wrong against all the rules of nature. One has to look to the tricks of cunning hell to explain it. So I swear again that he worked on her with some potion that affects the blood, or some drug enchanted for this purpose."]], "137": [[0, 3, "Her father loved me and often invited me over. He kept asking me the story of my life, year by year: the battles, sieges, and fortunes I'd been through."], [4, 11, "I told it all, from my boyhood up to the moment he asked. I talked about terrible disasters, thrilling adventures at sea and on land, narrow escapes from death when the walls were breached, being captured by an arrogant enemy and sold into slavery, buying my freedom, and how I behaved in all my travels."], [12, 18, "I described huge caves and empty deserts, rough quarries, rocks, and mountains so high they touch heaven; that was my story. And I told of the cannibals who eat each other, the Anthropophagi, and men whose heads grow beneath their shoulders. Desdemona would lean in eagerly to hear all this."], [19, 25, "But household chores would keep pulling her away, and whenever she could finish them quickly, she'd come back and devour my words with a hungry ear. Noticing that, I found a good moment and got her to beg me sincerely to tell her my whole journey in full, since she'd only heard bits and pieces, not the whole story."], [26, 33, "I agreed, and often brought her to tears when I talked about some painful blow I suffered in my youth. When I finished, she gave me a world of sighs for my trouble. She swore it was strange, truly strange, pitiful, so incredibly pitiful."], [34, 42, "She wished she hadn't heard it, yet she wished heaven had made her a man like that. She thanked me and told me that if I had a friend who loved her, I should just teach him how to tell my story, and that would win her. With that hint, I spoke up. She loved me for the dangers I had been through, and I loved her because she pitied them. That's the only witchcraft I've used. Here comes the lady; let her confirm it."]], "141": [[0, 2, "My noble father, I see that my duty is divided here."], [3, 9, "To you I owe my life and upbringing, and both teach me to respect you. You're the one I owe duty to; so far I've been your daughter. But here is my husband. And just as much duty as my mother showed you, putting you before her own father, I claim the right to show to the Moor, my husband."]], "142": [[0, 3, "God be with you! I'm done. Your Grace, please, go on to the state business. I'd rather adopt a child than have one of my own. Come here, Moor."], [4, 9, "I give you, with all my heart, what I'd keep from you with all my heart if you didn't already have it. Because of you, my jewel, I'm glad in my soul I have no other children, because your escape would make me a tyrant, chaining them up. I'm done, my lord."]], "143": [[0, 4, "Let me speak as you would, and offer some wise sayings that might be a step to help these lovers back into your good graces. When there's no cure left, grief ends once we see the worst that we used to hope wouldn't happen."], [5, 10, "Mourning a misfortune that's past and gone is the surest way to bring a new one. When Fortune takes what can't be saved, patience makes a joke of the injury. The robbed man who smiles steals something back from the thief; the one who wastes time on useless grief robs himself."]], "144": [[0, 5, "So let the Turks cheat us out of Cyprus; we haven't lost it as long as we can smile. A man takes this advice well when it costs him nothing and he only hears the free comfort in it. But a man who must pay off his grief by borrowing from his poor patience has to bear both the advice and the sorrow."], [6, 10, "These sayings, sweet or bitter, cut both ways, so they mean nothing. Words are just words. I've never heard of a bruised heart being healed through the ear. I humbly beg you, go on with the affairs of state."]], "146": [[0, 5, "Habit, that tyrant, most serious senators, has made the hard, stony, steel bed of war feel to me like the softest feather bed. I admit I feel a natural, eager readiness for hardship, and I take on this war against the Turks."], [6, 10, "So, humbly bowing to your authority, I ask for proper arrangements for my wife: suitable lodging, an allowance, and the kind of accommodation and company that fits her upbringing."]], "152": [[0, 6, "That I loved the Moor enough to live with him, my bold break with convention and my reckless gamble with my future can announce to the world. My heart has been won over by his very nature. I saw Othello's true face in his mind, and I dedicated my soul and fortune to his honor and his courage."], [7, 11, "So, dear lords, if I'm left behind, a useless moth living in peace while he goes to war, I'm robbed of the very things I love him for, and I'll have to endure a heavy wait in his absence. Let me go with him."]], "153": [[0, 5, "Give her your approval. Heaven be my witness, I don't ask this to satisfy my appetite or my passions (the urges of youth are dead in me) or for my own pleasure, but to be generous to her wishes."], [6, 14, "And heaven forbid you good men think I'll neglect your serious and important business because she's with me. No: if the light-winged toys of feathered Cupid ever blind my eyes and dull my mind with lust, so that my pleasures corrupt and spoil my work, let housewives turn my helmet into a cooking pot, and let every shameful and humiliating misfortune rise up against my reputation!"]], "175": [[0, 8, "Strength? Nonsense! It's up to us whether we're one way or another. Our bodies are gardens, and our wills are the gardeners. Whether we plant nettles or lettuce, grow hyssop or weed out thyme, fill it with one kind of herb or many, let it go barren through laziness or fertilize it with hard work, the power to control all this lies in our wills. If our lives didn't have reason on one side of the scale to balance our desires on the other, our lust and baser nature would lead us to absurd results."], [9, 11, "But we have reason to cool our raging urges, our sexual desires, our unbridled lusts. And I think what you call love is just an offshoot of that."]], "177": [[0, 12, "It's nothing but lust of the blood that the will allows. Come on, be a man! Drown yourself? Drown cats and blind puppies. I've said I'm your friend, and I admit I'm bound to you with unbreakable cables. I've never been more useful to you than now. Put money in your wallet. Follow the army to the wars. Disguise your face with a fake beard. I'm telling you, put money in your wallet. Desdemona can't go on loving the Moor for long (put money in your wallet), nor he her. It started violently, and you'll see it end just as abruptly (just put money in your wallet). These Moors are fickle (fill your wallet with money). The food that tastes as sweet as candy to him now will soon taste as bitter as poison. She'll want someone younger."], [13, 22, "When she's had enough of his body, she'll realize her mistake. She has to have a change, she must, so put money in your wallet. If you're set on damning yourself, do it in a more pleasant way than drowning. Raise all the money you can. If a holy ceremony and a fragile vow between a wandering barbarian and an overly clever Venetian girl aren't too much for my wits and all the powers of hell, you'll have her. So make money. To hell with drowning yourself! It's completely beside the point. You'd be better off being hanged for getting what you want than drowning without her."]], "188": [[0, 8, "This is how I always make my fool pay my way. I'd be wasting what I've learned if I spent time with such an idiot except for my own fun and profit. I hate the Moor. And people say he's slept with my wife. I don't know if it's true, but just the suspicion is enough for me; I'll act as if it were certain. He thinks well of me; that will make my plan work on him all the better."], [9, 15, "Cassio's a handsome man. Let me see now: how to get his job and pull off my plan in a double scam. How? How? Let's see. After a while, I'll whisper in Othello's ear that Cassio is too familiar with his wife. Cassio has the looks and smooth manner to be suspected; he's made to make women unfaithful."], [16, 21, "The Moor is open and trusting by nature. He thinks men are honest if they only seem to be, and he can be led by the nose as easily as a donkey. I've got it. It's conceived. Hell and darkness must bring this monstrous birth into the light of the world."]], "261": [[0, 5, "A woman who was always beautiful but never proud, who could speak her mind but was never loud, who always had money but never dressed flashy, who held back from what she wanted even when she could have it; a woman who, when angered and able to take revenge, let the insult go and her anger fade;"], [6, 10, "a woman who was never so foolish as to trade something good for something worthless; who could think without blurting out her thoughts, and could have men chasing her without looking back. She'd be the kind of woman, if such a woman ever existed..."]], "266": [[0, 7, "[Aside. He takes her by the hand. Yes, that's it, whisper. With a web this small I'll catch a fly as big as Cassio. Yes, smile at her, go on. I'll trap you in your own courtly manners. That's right, exactly. If tricks like these cost you your lieutenancy, you'd have been better off not kissing your fingers so often, which you're now so eager to do again like a fine gentleman. Very good. Nicely kissed! Excellent manners! Exactly. Your fingers to your lips again?"], [8, 9, "I wish they were enema tubes, for your sake! [Trumpet offstage. The Moor! I know his trumpet."]], "273": [[0, 3, "It's as amazing as it is wonderful to find you here before me. Oh, my soul's joy! If every storm is followed by a calm like this, let the winds blow until they wake the dead!"], [4, 10, "Let the struggling ship climb mountains of waves as high as Olympus and then drop as low as hell is from heaven! If I were to die right now, I'd die the happiest man alive, because I'm afraid my soul is so completely content that I'll never feel happiness like this again in my unknown future."]], "277": [[0, 7, "Come, let's go to the castle. News, friends: the war is over; the Turks have drowned. How are my old friends on this island? Darling, you'll be very welcome in Cyprus; I've found great affection here. Oh, my sweet, I'm babbling and going on about my own happiness. Please, good Iago, go to the bay and unload my chests."], [8, 11, "Bring the ship's captain to the fort; he's a good man, and his ability deserves a lot of respect. Come, Desdemona. Once again, welcome to Cyprus."]], "281": [[0, 5, "Put your finger to your lips like this, and let your soul learn something. Remember how violently she first loved the Moor, just because he bragged and told her fantastic lies. Will she keep loving him for his chatter? Don't you believe it. Her eyes need feeding, and what pleasure will she get from looking at the devil?"], [6, 10, "When sex has dulled the passion, it takes good looks, a similar age, manners, and beauty to rekindle it and give a full stomach a fresh appetite, and the Moor lacks all of these. Without these necessary qualities, her delicate sensibilities will feel cheated. She'll start to feel sick, lose her taste for the Moor, and loathe him."], [11, 20, "Nature itself will teach her this and push her to a second choice. Now, sir, given that (and it's a very obvious and natural conclusion), who is better placed to get lucky than Cassio? A smooth-talking rascal, with no more conscience than it takes to put on a show of politeness and manners to hide his lustful, secret desires. Nobody, nobody! A slippery, cunning rascal, an opportunist, with an eye that can create and fake opportunities even when no real ones exist. A devilish rascal! Besides, he's handsome, young, and has everything that foolish, inexperienced women look for."], [21, 23, "A thoroughly rotten rascal, and the woman has already got her eye on him."]], "285": [[0, 4, "It was lust, I swear by this hand. A preview and secret prologue to a story of lust and dirty thoughts. Their lips came so close that their breath embraced. Villainous thoughts, Roderigo! When these intimacies lead the way, soon after comes the main event, the joining of bodies."], [5, 10, "Disgusting! But, sir, do as I say. I brought you from Venice. Be on guard duty tonight; I'll arrange for you to be posted. Cassio doesn't know you. I won't be far away. Find some way to make Cassio angry, either by talking too loudly, or mocking his discipline, or any other way you like that the moment offers."]], "292": [[0, 5, "That Cassio loves her, I can well believe. That she loves him is likely and very believable. The Moor, though I can't stand him, is faithful, loving, and noble by nature, and I'd guess he'll be a very loving husband to Desdemona."], [6, 13, "Now, I love her too, not purely out of lust (though I may be guilty of just as great a sin), but partly to feed my revenge, because I suspect the lusty Moor has slept with my wife. The thought of it eats at my insides like poison, and nothing can or will satisfy my soul until I get even with him, wife for wife."], [14, 19, "Or if I fail at that, then at least I'll make the Moor so jealous that reason can't cure him. To do that, if this Venetian trash Roderigo, whom I keep on a leash so he'll hunt eagerly, does what I push him to do, I'll have Michael Cassio at my mercy."], [20, 26, "I'll slander him to the Moor as a womanizer (because I suspect Cassio with my wife too), and make the Moor thank me, love me, and reward me for making a complete fool of him and scheming against his peace of mind until he goes mad. The plan is here in my head, but still muddled. Villainy never shows its full face until it's put to use."]], "323": [[0, 6, "If I can just get one more cup into him, on top of what he's already had tonight, he'll be as quarrelsome and touchy as a little lady's lapdog. Now my lovesick fool Roderigo, whom love has turned almost inside out, has tonight been drinking toasts to Desdemona by the jugful, and he's on guard duty."], [7, 15, "Three young men of Cyprus, proud and touchy about their honor, the very essence of this warlike island, I've gotten drunk tonight with overflowing cups, and they're on watch too. Now, among this flock of drunks, I'll get Cassio to do something that will offend the island. But here they come. If things turn out the way I've imagined, my boat will sail freely with both wind and current behind it."]], "334": [[0, 4, "Oh, sweet England! [Sings. \"King Stephen was a worthy lord; his pants cost him only a crown. He thought them sixpence overpriced, and so he called the tailor a clown."], [5, 9, "He was a man of high renown, and you are just of low degree. It's pride that brings the country down, so wrap your old cloak around thee. Some wine, here!"]], "376": [[0, 3, "Why, what's this? How did this start? Have we turned into Turks and done to ourselves what heaven stopped the Turks from doing? For the sake of Christian decency, stop this savage brawl."], [4, 9, "The next man who moves to strike out of his own anger doesn't value his life; he dies the moment he moves. Silence that terrible bell; it's scaring the island out of its wits. What's the matter, gentlemen? Honest Iago, you look dead with grief. Speak: who started this? I order you, by your loyalty."]], "382": [[0, 6, "Now, by heaven, my temper is starting to overrule my better judgment, and anger, having clouded my reason, is trying to take over. If I move, or even lift this arm, the best of you will fall under my punishment. Tell me how this disgraceful riot started and who began it."], [7, 13, "Whoever is proven guilty, even if he were my twin brother, born at the same moment, will lose me. What? In a garrison town, still unsettled, with the people's hearts full of fear, to start a private, personal quarrel at night, at the very guard post meant to keep the peace! It's outrageous. Iago, who started it?"]], "384": [[0, 4, "Don't hit me where it hurts. I'd rather have my tongue cut out than have it harm Michael Cassio. Still, I'm sure telling the truth won't hurt him. Here's what happened, general."], [5, 9, "Montano and I were talking when a man came running in shouting for help, with Cassio chasing him, sword drawn, ready to strike him. Sir, this gentleman stepped in front of Cassio and begged him to stop."], [10, 19, "I went after the screaming man so his shouting wouldn't frighten the town, which is what happened anyway. He was too fast for me, and I came back all the quicker because I heard swords clashing and Cassio swearing loudly, which I'd never heard him do before tonight. When I got back (all this happened quickly), I found them fighting at close quarters, striking and thrusting, just as they were when you yourself separated them."], [20, 26, "I can't tell you any more than that. But men are men; even the best sometimes forget themselves. Though Cassio did him some small wrong, as men in a rage strike even those who mean them well, I do believe Cassio must have received some outrageous insult from the man who ran away, something he couldn't let pass."]], "409": [[0, 4, "You or any man alive can get drunk sometimes, man. I'll tell you what to do. Our general's wife is now the general. I can say that because he has devoted himself completely to admiring and studying her qualities and charms. Confess everything to her."], [5, 10, "Beg her to help you get your job back. She's so generous, so kind, so willing, so good-natured that she thinks it's a fault in her goodness not to do more than she's asked. Ask her to set this broken bone between you and her husband, and I'll bet everything I have that this crack in your friendship will heal stronger than before."]], "416": [[0, 7, "So who can say I'm playing the villain, when the advice I give is free and honest, reasonable, and really the way to win the Moor back? Because it's very easy to get the willing Desdemona to support any honest request. She's as generous as the free elements. And it's just as easy for her to win over the Moor;"], [8, 14, "even if it meant renouncing his baptism and every sign and symbol of his salvation, his soul is so chained to his love for her that she can make, unmake, or do whatever she likes with him, as her desire plays god over his weak will. So how am I a villain for advising Cassio to take this path, which leads straight to his own good? The theology of hell!"], [15, 21, "When devils want to commit the blackest sins, they first tempt with heavenly appearances, as I'm doing now. Because while this honest fool begs Desdemona to fix his fortunes, and she pleads hard for him with the Moor, I'll pour this poison into the Moor's ear: that she wants Cassio back because she lusts for him."], [22, 26, "And the harder she tries to help Cassio, the more she'll destroy the Moor's trust in her. That's how I'll turn her goodness into tar, and from her own kindness make the net that will catch them all."]], "420": [[0, 5, "How poor are those who have no patience! What wound ever healed except gradually? You know we work with brains and not with witchcraft, and brains have to wait for the right time. Isn't it going well? Cassio beat you, and with that small injury you've gotten Cassio fired."], [6, 11, "Other things may grow well in the sun, but the fruits that blossom first will ripen first. Be patient for a while. By God, it's morning. Pleasure and action make the hours fly by. Go away, go to where you're staying. Go, I said. You'll find out more later."], [12, 18, "No, get out of here. [Roderigo leaves. Two things need to be done. My wife has to plead for Cassio with her mistress; I'll get her to do it. Meanwhile I'll draw the Moor aside and bring him in at exactly the moment he can find Cassio pleading with his wife. Yes, that's the way. Don't let the plan go stale through hesitation and delay."]], "451": [[0, 1, "Good morning, good lieutenant. I'm sorry you're out of favor, but I'm sure everything will be fine."], [2, 9, "The general and his wife are talking about it, and she's defending you strongly. The Moor says the man you injured is well known in Cyprus and well connected, and that the wise thing was to dismiss you. But he insists he cares for you, and needs no one to plead for you but his own affection to take the first safe chance to bring you back."]], "470": [[0, 4, "Don't worry about that. With Emilia here as witness, I guarantee you'll get your position back. I promise you, if I swear friendship, I'll keep it to the letter. My husband will never get any rest. I'll keep him awake until he gives in, and talk until he runs out of patience."], [5, 9, "His bed will feel like a school and his dinner table like a confessional. I'll mix Cassio's case into everything he does. So cheer up, Cassio, because your advocate would rather die than give up on you."]], "496": [[0, 7, "Then tomorrow night, or Tuesday morning, or Tuesday noon, or night, or Wednesday morning. Please name the time, but don't let it be more than three days. Honestly, he's sorry. And by ordinary standards his offense (except that they say in wartime you have to make an example of the best men) is hardly a fault worth even a private scolding. When can he come?"], [8, 14, "Tell me, Othello. I really wonder what you could ask of me that I'd refuse, or hesitate over like this. What? Michael Cassio, who came with you when you were courting me, and who so many times took your side when I criticized you? And to have to work this hard to bring him back! Believe me, I could do a lot more—"]], "520": [[0, 4, "\"Thinking, my lord? By heaven, he echoes me, as if there were some monster in his mind too hideous to show. You mean something. I heard you say just now that you didn't like it when Cassio left my wife. What didn't you like?"], [5, 10, "And when I told you he was in my confidence during my whole courtship, you said, \"Really! and frowned and wrinkled your brow, as if you'd locked some horrible idea in your brain. If you love me, tell me what you're thinking."]], "529": [[0, 2, "My good lord, forgive me. Though I'm bound to perform every duty, I'm not bound to do what even slaves aren't required to do."], [3, 8, "Speak my thoughts? Why, suppose they're vile and false? After all, where's the palace that dirty things don't sometimes get into? Who has a heart so pure that some unclean suspicions don't hold court there and sit in judgment alongside fair thoughts?"]], "531": [[0, 7, "I beg you, since I may be wrong in my guess (I admit it's a curse of my nature to look for wrongdoing, and my suspicion often invents faults that aren't there), that your wisdom ignore someone whose ideas are so unreliable, and not create trouble for yourself out of my scattered, uncertain observations."], [8, 10, "It wouldn't be good for your peace of mind or your well-being, or for my manhood, honesty, or wisdom, to tell you what I'm thinking."]], "540": [[0, 9, "Why, why are you saying this? Do you think I'd live a life of jealousy, changing my suspicions with every phase of the moon? No! Once I'm in doubt, I'll settle it at once. Trade me for a goat if I ever let my soul be taken up with inflated, overblown suspicions like the ones you're hinting at. It doesn't make me jealous to hear that my wife is beautiful, has a good appetite, enjoys company, speaks freely, sings, plays, and dances well."], [10, 16, "Where there's virtue, these things only make it more virtuous. And I won't take the smallest fear or doubt of her unfaithfulness from my own shortcomings, because she had eyes and she chose me. No, Iago, I'll see before I doubt. When I doubt, I'll get proof. And once there's proof, that's it: away with either love or jealousy!"]], "541": [[0, 5, "I'm glad to hear it, because now I'll have reason to show my love and loyalty to you more openly. So, as is my duty, hear this from me. I'm not talking about proof yet. Watch your wife. Watch her closely with Cassio. Keep your eyes like this, neither jealous nor too trusting."], [6, 11, "I wouldn't want your open and noble nature to be taken advantage of because of your own generosity. Watch out. I know our Venetian ways well. In Venice women let heaven see the tricks they don't dare show their husbands. Their idea of conscience isn't to avoid doing it, but to keep it secret."]], "555": [[0, 5, "Yes, that's the point. To be blunt with you: she rejected many proposed matches with men of her own country, color, and rank, which is what nature tends toward in all things. Ugh, you can smell in a desire like that something rotten, a foul mismatch, unnatural thoughts."], [6, 10, "But forgive me. I'm not speaking specifically about her, although I may fear that her desire, returning to her better judgment, may start to compare you with men from her own country, and maybe regret her choice."]], "559": [[0, 5, "[Returning. My lord, I wish I could beg you not to look into this any further. Leave it to time. Although Cassio should have his job back, since he certainly does it very well, if you would keep him waiting for a while, you'll learn a lot about him and his methods."], [6, 11, "Notice if your lady pushes hard for him to be reinstated with strong or urgent pleading. That will tell you a lot. In the meantime, think of me as too quick to fear the worst (as I have good reason to think I am), and consider her innocent, I beg you."]], "563": [[0, 8, "This fellow is extremely honest, and he knows all kinds of people and understands human behavior. If I find out she's wild like an untamed hawk, even if her leashes were tied to my own heartstrings, I'd release her and let her fly off on the wind to fend for herself. Maybe because I'm black, and don't have the smooth way of talking that courtiers have, or because I'm getting on in years (though not by much), she's gone."], [9, 15, "I've been betrayed, and my only relief must be to hate her. Oh, the curse of marriage, that we can call these delicate creatures ours but not their desires! I'd rather be a toad living on the stale air of a dungeon than keep a corner of the thing I love for others to use. Yet it's the plague of great men;"], [16, 19, "they have fewer privileges than ordinary men. It's an inescapable destiny, like death. We're fated to wear the cuckold's horns from the moment we're born. Here comes Desdemona."]], "576": [[0, 1, "I'm glad I found this handkerchief. It was her first keepsake from the Moor."], [2, 9, "My unpredictable husband has asked me a hundred times to steal it. But she loves it so much (because he made her swear to always keep it) that she always has it with her to kiss and talk to. I'll have the embroidery copied and give it to Iago. What he'll do with it heaven knows, not me. I only want to satisfy his whims."]], "594": [[0, 3, "I'll drop this handkerchief in Cassio's room and let him find it. Things as light as air seem to the jealous as strong a proof as Holy Scripture. This may do something."], [4, 9, "The Moor is already changing under my poison. Dangerous ideas are by nature poisons, which at first barely taste bad, but once they start working on the blood, they burn like sulfur mines. I said so. Look, here he comes!"]], "603": [[0, 3, "I'd have been happy if the whole army, down to the lowest ditch-diggers, had tasted her sweet body, as long as I knew nothing about it. Oh, now, forever, goodbye to a peaceful mind! Goodbye to contentment!"], [4, 9, "Goodbye to the plumed troops and the great wars that make ambition a virtue! Oh, goodbye, goodbye to the neighing horse and the shrill trumpet, the spirit-stirring drum, the ear-piercing flute, the royal flag, and all the qualities, pride, pageantry, and ceremony of glorious war!"], [10, 12, "And you deadly cannons, whose rough throats imitate the terrifying thunder of immortal Jove, goodbye! Othello's career is over!"]], "618": [[0, 4, "I think it would be very hard to arrange for you to see that. Damn them if any eyes but their own ever see them in bed together! So what then? How then? What can I say? Where's your proof?"], [5, 11, "You can't possibly see this, even if they were as horny as goats, as hot as monkeys, as lustful as wolves in heat, and as stupid as drunken idiots. But still, I say, if strong evidence and circumstances that lead straight to the door of truth will satisfy you, you can have that."]], "620": [[0, 5, "I don't like this job. But since I've gone this far into it, driven by foolish honesty and love, I'll go on. I was sharing a bed with Cassio recently, and since I had a terrible toothache, I couldn't sleep."], [6, 8, "There are some men so loose-lipped that they talk about their affairs in their sleep. Cassio is one of them."], [9, 16, "In his sleep I heard him say, \"Sweet Desdemona, let's be careful; let's hide our love. And then, sir, he'd grab and squeeze my hand, cry out, \"Oh, sweet creature! and kiss me hard, as if he were pulling up kisses by the roots that grew on my lips. Then he laid his leg over my thigh, and sighed, and kissed, and then cried, \"Cursed fate that gave you to the Moor!\""]], "631": [[0, 3, "Oh, I wish the villain had forty thousand lives! One is too poor, too weak for my revenge. Now I see it's true. Look here, Iago: I blow all my foolish love away to heaven."], [4, 8, "It's gone. Rise, black vengeance, from your hollow hell! Give up, love, your crown and your throne in my heart to tyrannical hate! Swell, my heart, with your cargo, because it's made of snakes' tongues!"]], "682": [[0, 8, "That's a mistake. An Egyptian woman gave that handkerchief to my mother. She was a sorceress who could almost read people's minds. She told my mother that as long as she kept it, it would make her desirable and keep my father completely in love with her. But if she lost it or gave it away, my father would look at her with disgust and his desires would go chasing after new loves. When she was dying, she gave it to me and told me to give it to my wife when I married."], [9, 13, "I did, so take good care of it. Treasure it like your own precious eyes. To lose it or give it away would be a disaster like no other."]], "714": [[0, 4, "Madam, the same request as before. I beg you, through your good influence, let me live again and be a part of the love of the man I honor with all my heart. I don't want any delay."], [5, 12, "If my offense is so serious that neither my past service, nor my present sorrow, nor my promise of good service in the future can buy back his love, then just knowing that will be a benefit to me. Then I'll force myself to be content and take some other path, relying on Fortune's charity."]], "715": [[0, 3, "Alas, thrice-gentle Cassio! My pleading isn't working right now. My husband isn't himself. I wouldn't recognize him if his face had changed as much as his mood."], [4, 9, "So help me every holy spirit, I've spoken for you as well as I can and made myself the target of his anger for speaking so freely! You'll have to be patient for a while. What I can do, I will. And I'll do more for you than I'd dare to do for myself. Let that be enough for you."]], "721": [[0, 5, "It must be some state business, either news from Venice or some plot uncovered here in Cyprus, that has muddied his clear mind. In cases like that, men's tempers quarrel with small things even though big things are really on their minds. That's how it is."], [6, 14, "If our finger aches, the rest of our healthy body feels the pain too. No, we have to remember men aren't gods, and we can't expect them to be as attentive as on the wedding day. Scold me, Emilia: like the clumsy soldier I am, I was accusing him of unkindness in my heart. But now I realize I bribed the witness, and he's been falsely charged."]], "790": [[0, 4, "Good sir, be a man. Think of every bearded man who's married: he's pulling the same cart you are. There are millions of men alive right now who go to bed every night in beds others have used, and they'd swear those beds were theirs alone. Your situation is better."], [5, 8, "Oh, it's hell's own spite, the devil's greatest joke, to kiss a slut in a bed you think is safe and believe she's chaste! No, I'd rather know. And knowing what I am, I know what she'll get."]], "792": [[0, 5, "Stand aside for a while and keep yourself under control. While you were lying here overcome by your grief (a passion that doesn't suit a man like you), Cassio came by. I got rid of him and gave a good excuse for your fit."], [6, 12, "I told him to come back soon and talk to me here, which he promised to do. Just hide yourself and watch the sneers, the mockery, and the obvious contempt all over his face. Because I'll get him to tell the story again: where, how, how often, how long ago, and when he has slept with your wife and will again."], [13, 15, "Just watch his gestures, I say. But be patient, or I'll say you're nothing but temper and not a man at all."]], "904": [[0, 4, "Yes, you wanted me to make her turn around. Sir, she can turn and turn, and still keep going, and turn again. And she can cry, sir, cry. And she's obedient, as you say, obedient, very obedient. Go on with your tears."], [5, 8, "About this letter, sir... Oh, what a well-acted show of grief! I'm ordered home. Get out of here; I'll send for you soon. Sir, I'll obey the order and return to Venice. Go, get out!"]], "952": [[0, 8, "If heaven had wanted to test me with suffering, if it had rained every kind of sore and shame on my bare head, drowned me in poverty up to my lips, made a prisoner of me and all my highest hopes, I'd have found somewhere in my soul a drop of patience. But, alas, to make me a fixed target for the scornful world to point its slow, unmoving finger at!"], [9, 13, "Still, I could bear that too, well, very well. But there, where I've stored up my heart, where I must either live or not live at all, the spring my life flows from or else dries up: to be thrown out of there!"], [14, 17, "Or to have to keep it as a tank where filthy toads tangle and breed! Change color at that, Patience, you young, rosy-lipped angel. Yes, at that, look as grim as hell!"]], "956": [[0, 5, "Was this beautiful paper, this lovely book, made to have \"whore\" written on it? Committed? What have you committed? Oh, you common prostitute! If I just named what you've done, my cheeks would burn like furnaces and turn modesty to ashes. What have you committed!"], [6, 10, "Heaven holds its nose at it, and the moon shuts its eyes. The promiscuous wind, which kisses everything it meets, hides in the hollow caves of the earth and won't listen to it. What have you committed? Shameless whore!"]], "998": [[0, 4, "May a noose forgive him! And may hell gnaw his bones! Why would he call her a whore? Who has she been with? Where? When? How? What's the evidence? The Moor's been tricked by some vicious villain, some low, notorious villain, some scummy creep."], [5, 8, "Oh heaven, I wish you'd expose such men and put a whip in every honest hand to lash those rascals naked across the world, from east to west!"]], "1002": [[0, 6, "Oh, good Iago, what should I do to win my husband back? Good friend, go to him, because by the light of heaven, I don't know how I lost him. Here I kneel."], [7, 13, "If my heart ever betrayed his love, either in thought or in action, or if my eyes, my ears, or any of my senses ever took pleasure in any other man, or if I don't still love him dearly, and always did, and always will, even if he throws me off into a beggarly divorce, may I never know comfort again! Unkindness can do a lot, and his unkindness may destroy my life, but it will never spoil my love. I can't say \"whore."], [14, 16, "It disgusts me just to say the word. Not all the riches in the world could make me do what would earn that name."]], "1062": [[0, 4, "[Singing. \"The poor soul sat sighing by a sycamore tree, sing all a green willow; her hand on her chest, her head on her knee, sing willow, willow, willow."], [5, 13, "The fresh streams ran by her and murmured her moans, sing willow, willow, willow; her salt tears fell from her and softened the stones. Put these away. \"Sing willow, willow, willow. Please, hurry; he'll be here soon. \"Sing all a green willow must be my garland. Let nobody blame him; I accept his scorn. No, that's not the next line. Listen, who's knocking?"]], "1079": [[0, 6, "Yes, a dozen, and as many more as would fill the world they gambled for. But I do think it's the husbands' fault when wives go wrong. Say they neglect their duties and pour what's ours into other women's laps; or they break out in petty jealousy and lock us up; or say they hit us, or cut our allowance out of spite."], [7, 13, "Why, we have tempers, and though we have some kindness, we can also take revenge. Husbands should know their wives have senses like them. They see and smell and have tastes for both sweet and sour, just like husbands. What are they doing when they trade us for other women? Is it for fun?"], [14, 19, "I think it is. Does desire drive it? I think it does. Is it weakness that makes them stray? That too. And don't we have desires, a wish for fun, and weakness, just like men? So let them treat us well. Otherwise, let them know that the wrongs we do, they taught us."]], "1088": [[0, 6, "I've rubbed this young pimple almost raw, and he's getting angry. Now, whether he kills Cassio, or Cassio kills him, or they kill each other, I win either way. If Roderigo lives, he'll demand I pay back all the gold and jewels I swindled from him as gifts for Desdemona. That can't happen."], [7, 11, "If Cassio survives, he has a daily goodness in his life that makes me look ugly. Besides, the Moor might reveal my story to him, and then I'm in great danger. No, he has to die. So be it. I hear him coming."]], "1176": [[0, 6, "It's the cause, it's the cause, my soul. Let me not name it to you, you chaste stars! It's the cause. Yet I won't shed her blood, or scar that skin of hers, whiter than snow and smooth as marble on a tomb. Yet she must die, or she'll betray more men. Put out the light, and then put out the light."], [7, 14, "If I put you out, you flaming candle, I can light you again if I change my mind. But once I put out your light, you most perfect model of nature's best work, I don't know where to find the divine fire that could relight you. Once I've picked the rose, I can't make it grow again. It has to wither. I'll smell it while it's still on the bush. [He kisses her."], [15, 21, "Oh, sweet breath, that almost persuades Justice to break her sword! One more, one more. Be like this when you're dead, and I'll kill you and love you afterward. One more, and this is the last. Nothing so sweet was ever so deadly. I have to cry, but these are cruel tears. This sorrow is like heaven's: it punishes what it loves. She's waking up."]], "1232": [[0, 4, "Yes, it's Emilia. In a moment. She's dead. She's probably coming to tell me about Cassio's death. The noise was loud. Ha! No more moving? Still as the grave. Should I let her in? Would that be wise? I think she's moving again. No. What's the best thing to do?"], [5, 10, "If she comes in, she'll certainly speak to my wife. My wife! My wife! What wife? I have no wife. Oh, unbearable! Oh, terrible hour! I think there should be a huge eclipse of the sun and moon right now, and the terrified earth should split open at this change."]], "1329": [[0, 5, "Look, I have a weapon. A better one never hung at a soldier's side. I've seen the day when, with this little arm and this good sword, I fought my way through obstacles twenty times stronger than you. But, oh, what an empty boast!"], [6, 10, "Who can control his fate? It's not like that now. Don't be afraid, even though you see me armed. This is the end of my journey, my final goal, the landmark of my last voyage. Are you backing away in fear? There's no need."], [11, 16, "Just point a reed at Othello's chest, and he'll retreat. Where would Othello go? Now, how do you look now? Oh, unlucky girl! Pale as your nightgown! When we meet on Judgment Day, this look of yours will hurl my soul out of heaven, and devils will snatch it up. Cold, cold, my girl?"], [17, 23, "Just like your chastity. Oh, cursed, cursed slave that I am! Whip me, you devils, away from the sight of this heavenly creature! Blow me around in the winds! Roast me in sulfur! Wash me in deep pits of liquid fire! Oh, Desdemona! Dead, Desdemona! Dead! Oh! Oh! Oh!"]], "1357": [[0, 6, "Wait. A word or two before you go. I've done the state some service, and they know it. Enough of that. I ask you, in your letters, when you report these unhappy events, describe me as I am. Don't make excuses for me, and don't write anything out of malice. Then you must speak of a man who loved not wisely but too well;"], [7, 13, "of a man not easily made jealous, but who, once manipulated, was driven to extreme confusion; of a man whose hand, like the ignorant Indian, threw away a pearl worth more than his whole tribe; of a man whose defeated eyes, though not used to weeping, now drop tears as fast as Arabian trees drip their healing gum. Write that down."], [14, 18, "And say also that once in Aleppo, when a hostile, turbaned Turk beat a Venetian and insulted the state, I took the circumcised dog by the throat and struck him, like this. [He stabs himself.]"]], "1363": [[0, 3, "[To Iago. Oh, you vicious dog, more cruel than pain, hunger, or the sea! Look at the tragic load on this bed. This is your work. The sight poisons the eyes;"], [4, 10, "cover it up. Gratiano, take charge of the house and take possession of the Moor's property, because you inherit it. To you, Lord Governor, falls the sentencing of this hellish villain: the time, the place, the torture. Oh, carry it out! I'll go aboard ship right away, and with a heavy heart report this heavy deed to the state."]]};

function findKey(key){

  let best=-1;for(let i=0;i<cur.pages.length;i++)for(const b of cur.pages[i])if(b.t==="sp"&&String(b.it.id)===sid&&b.units[b.u0][0]<= +ln)best=i;

let press=null,swallow=false;
vp.addEventListener("pointerdown",e=>{if(e.button)return;
  const sp=e.target.closest(".sp");press={x:e.clientX,y:e.clientY,t:Date.now(),sp,tgt:e.target,timer:null,moved:false};
  if(sp){press.pt=setTimeout(()=>{if(press&&press.sp===sp&&!press.moved)sp.classList.add("pressing")},160);
    press.timer=setTimeout(()=>{if(press&&press.sp===sp&&!press.moved){sp.classList.remove("pressing");swallow=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}openTools(+sp.dataset.id,partAt(press.tgt,sp))}},480)}});

function endPress(e,cancel){if(!press||pinch)return;clearTimeout(press.timer);clearTimeout(press.pt);if(press.sp)press.sp.classList.remove("pressing");
  const P=press;press=null;if(cancel)return;
  if(swallow){swallow=false;return}
  const dx=e.clientX-P.x,dy=e.clientY-P.y;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){turn(dx<0?1:-1);return}
  if(P.moved||Date.now()-P.t>450)return;
  if(gpop){hideGloss();return}
  if(S.onehand&&P.y>innerHeight*.78&&(P.x<innerWidth*.3||P.x>innerWidth*.7)){turn(P.x<innerWidth*.3?-1:1);return}
  const ea=P.tgt.closest&&P.tgt.closest("[data-endact]");if(ea){endAct(ea.dataset.endact);return}
  const pp=P.tgt.closest&&P.tgt.closest("[data-pop]");if(pp){showPop(pp,pp.dataset.pop,pp.dataset.text);return}
  const rc=P.tgt.closest&&P.tgt.closest("[data-recap]");if(rc){openSheet("Story so far",recapHTML(rc.dataset.recap));return}
  const pr=P.tgt.closest&&P.tgt.closest("[data-pred]");if(pr){const [s,i]=pr.dataset.pred.split(":");PRED[s]=+i;LS.set("oth-pred",JSON.stringify(PRED));refreshMarks();toast("Guess saved. Turn the page to find out.");return}
  const gw=nearGloss(P.tgt,P.x,P.y);if(gw){showGloss(gw);return}
  if(P.sp){const pt=P.tgt.closest(".pt")||(P.tgt.closest(".chunk")||P.sp).querySelector(".pt");
    if(pt){const id=+P.sp.dataset.id,pi=+pt.dataset.p;if(partSel&&partSel.id===id&&partSel.pi===pi&&toolsId!=null){closePanel();return}openPart(id,pi,false);return}}
  if(toolsId!=null&&wide()){closePanel();return}
  toggleChrome()}
vp.addEventListener("pointerup",e=>endPress(e,false));
vp.addEventListener("pointercancel",e=>endPress(e,true));
vp.addEventListener("contextmenu",e=>{e.preventDefault();const sp=e.target.closest(".sp");if(!sp)return;if(press){clearTimeout(press.timer);clearTimeout(press.pt);swallow=true}openTools(+sp.dataset.id,partAt(e.target,sp))});
vp.addEventListener("wheel",e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<25)return;const now=Date.now();if(now-(vp.lw||0)<450)return;vp.lw=now;turn(d>0?1:-1)},{passive:true});
/* a tap within a few pixels of an underlined word counts as tapping it */
function nearGloss(tgt,x,y){const d=tgt&&tgt.closest&&tgt.closest("abbr.g");if(d)return d;
  for(const [dx,dy] of [[0,-9],[0,9],[-12,0],[12,0],[-9,-7],[9,-7],[-9,7],[9,7],[0,-15],[0,15]]){const el=document.elementFromPoint(x+dx,y+dy);const g=el&&el.closest&&el.closest("abbr.g");if(g)return g}return null}
/* pinch with two fingers to change the text size */
let pinch=null;const SIZES=[1.15,1.3,1.5,1.75];

  let i=SIZES.indexOf(S.scale);if(i<0)i=1;const ni=r>1.15?Math.min(SIZES.length-1,i+1):r<.87?Math.max(0,i-1):i;
