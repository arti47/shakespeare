To suffer all alike. That he should dream,", "Knowing all measures, the full Caesar will", "Answer his emptiness!--Caesar, thou hast subdu'd", "His judgment too."], "id": 904, "m": "[Aside] Oh yes, very likely high-commanding Caesar will throw away his good fortune and put himself on show fighting a swordsman! I see that men's judgement is part of their fortune, and their outward circumstances drag their inner qualities down with them, so both suffer alike. That he should dream, knowing how things stand, that Caesar, with everything, would answer him, with nothing! Caesar, you've conquered his judgement too."}, {"t": "sd", "text": "Enter an Attendant.", "id": 905}, {"t": "sp", "who": "ATTENDANT", "lines": ["A messenger from Caesar."], "id": 906, "m": "A messenger from Caesar."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What, no more ceremony?--See, my women!--", "Against the blown rose may they stop their nose", "That kneel'd unto the buds.--Admit him, sir."], "id": 907, "m": "What, no more ceremony than that? See, my women! People who knelt to the rosebuds hold their noses at the full-blown rose. Let him in, sir."}, {"t": "sd", "text": "Exit Attendant.", "id": 908}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside.] Mine honesty and I begin to square.", "The loyalty well held to fools does make", "Our faith mere folly:--yet he that can endure", "To follow with allegiance a fallen lord", "Does conquer him that did his master conquer,", "And earns a place i' the story."], "id": 909, "m": "[Aside] My honesty and I are beginning to quarrel. Loyalty kept up towards fools turns faithfulness into plain foolishness. And yet the man who can bear to stay loyal to a fallen lord conquers the one who conquered his master, and earns a place in history."}, {"t": "sd", "text": "Enter Thyreus.", "id": 910}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Caesar's will?"], "id": 911, "m": "What does Caesar want?"}, {"t": "sp", "who": "THYREUS", "lines": ["Hear it apart."], "id": 912, "m": "Hear it in private."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["None but friends: say boldly."], "id": 913, "m": "There's no one here but friends. Speak boldly."}, {"t": "sp", "who": "THYREUS", "lines": ["So, haply, are they friends to Antony."], "id": 914, "m": "Then perhaps they're also friends of Antony."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["He needs as many, sir, as Caesar has;", "Or needs not us. If Caesar please, our master", "Will leap to be his friend: for us, you know", "Whose he is we are, and that is Caesar's."], "id": 915, "m": "He needs as many friends, sir, as Caesar has, or else he doesn't need us. If Caesar wishes, our master will jump at the chance to be his friend. As for us, you know we belong to whoever he belongs to, and that will be Caesar."}, {"t": "sp", "who": "THYREUS", "lines": ["So.--", "Thus then, thou most renown'd: Caesar entreats", "Not to consider in what case thou stand'st", "Further than he is Caesar."], "id": 916, "m": "So. Then, most famous queen, Caesar begs you not to worry about your situation, beyond remembering that he is Caesar."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Go on: right royal."], "id": 917, "m": "Go on. Very royal of him."}, {"t": "sp", "who": "THYREUS", "lines": ["He knows that you embrace not Antony", "As you did love, but as you fear'd him."], "id": 918, "m": "He knows that you didn't take up with Antony out of love, but out of fear."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O!"], "id": 919, "m": "Oh!"}, {"t": "sp", "who": "THYREUS", "lines": ["The scars upon your honour, therefore, he", "Does pity, as constrained blemishes,", "Not as deserv'd."], "id": 920, "m": "So he pities the scars on your honour, as stains you were forced into, not ones you deserved."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He is a god, and knows", "What is most right: mine honour was not yielded,", "But conquer'd merely."], "id": 921, "m": "He's a god and knows what's right. My honour wasn't given up, just conquered by force."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside.] To be sure of that,", "I will ask Antony.--Sir, sir, thou art so leaky", "That we must leave thee to thy sinking, for", "Thy dearest quit thee."], "id": 922, "m": "[Aside] To be sure of that, I'll ask Antony. Sir, sir, you're so leaky we'll have to leave you to sink, because your dearest is deserting you."}, {"t": "sd", "text": "Exit.", "id": 923}, {"t": "sp", "who": "THYREUS", "lines": ["Shall I say to Caesar", "What you require of him? for he partly begs", "To be desir'd to give. It much would please him", "That of his fortunes you should make a staff", "To lean upon: but it would warm his spirits", "To hear from me you had left Antony,", "And put yourself under his shroud, who is", "The universal landlord."], "id": 924, "m": "Shall I tell Caesar what you want from him? He's almost begging to be asked to give. It would please him greatly if you made his fortunes a staff to lean on. But it would warm his heart to hear from me that you'd left Antony and put yourself under his protection, since he's lord of all the world."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What's your name?"], "id": 925, "m": "What's your name?"}, {"t": "sp", "who": "THYREUS", "lines": ["My name is Thyreus."], "id": 926, "m": "My name is Thyreus."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Most kind messenger,", "Say to great Caesar this:--in deputation", "I kiss his conquring hand: tell him I am prompt", "To lay my crown at's feet, and there to kneel:", "Tell him, from his all-obeying breath I hear", "The doom of Egypt."], "id": 927, "m": "Most kind messenger, tell great Caesar this: through you, I kiss his conquering hand. Tell him I'm ready to lay my crown at his feet and kneel there. Tell him I'll hear Egypt's fate from his voice, which everyone obeys."}, {"t": "sp", "who": "THYREUS", "lines": ["'Tis your noblest course.", "Wisdom and fortune combating together,", "If that the former dare but what it can,", "No chance may shake it. Give me grace to lay", "My duty on your hand."], "id": 928, "m": "That's your noblest course. When wisdom and fortune fight each other, if wisdom dares only do what it can, nothing can shake it. Allow me to kiss your hand in respect."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Your Caesar's father", "Oft, when he hath mus'd of taking kingdoms in,", "Bestow'd his lips on that unworthy place,", "As it rain'd kisses."], "id": 929, "m": "Your Caesar's father, when he was thinking about conquering kingdoms, often put his lips on that unworthy place, as if it were raining kisses."}, {"t": "sd", "text": "Re-enter Antony and Enobarbus.", "id": 930}, {"t": "sp", "who": "ANTONY", "lines": ["Favours, by Jove that thunders!--", "What art thou, fellow?"], "id": 931, "m": "Kisses, by thundering Jupiter! Who are you, fellow?"}, {"t": "sp", "who": "THYREUS", "lines": ["One that but performs", "The bidding of the fullest man, and worthiest", "To have command obey'd."], "id": 932, "m": "Just someone who carries out the orders of the greatest man, the one most worthy of being obeyed."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside.] You will be whipp'd."], "id": 933, "m": "[Aside] You'll be whipped."}, {"t": "sp", "who": "ANTONY", "lines": ["Approach there.--Ah, you kite!--Now, gods and devils!", "Authority melts from me: of late, when I cried 'Ho!'", "Like boys unto a muss, kings would start forth", "And cry 'Your will?' Have you no ears? I am", "Antony yet."], "id": 934, "m": "Come here! Ah, you bird of prey! Now, gods and devils! My authority is melting away. Not long ago, when I shouted 'Hey!', kings would rush forward like boys scrambling for coins and cry, 'What do you want?' Are you deaf? I'm still Antony."}, {"t": "sd", "text": "Enter Attendants.", "id": 935}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Take hence this Jack and whip him."], "id": 936, "m": "Take this nobody away and whip him."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["'Tis better playing with a lion's whelp", "Than with an old one dying."], "id": 937, "m": "It's better to play with a lion cub than with an old lion that's dying."}, {"t": "sp", "who": "ANTONY", "lines": ["Moon and stars!", "Whip him.--Were't twenty of the greatest tributaries", "That do acknowledge Caesar, should I find them", "So saucy with the hand of she here,--what's her name", "Since she was Cleopatra?--Whip him, fellows,", "Till like a boy you see him cringe his face,", "And whine aloud for mercy: take him hence."], "id": 938, "m": "Moon and stars! Whip him. Even if it were twenty of the greatest kings who pay tribute to Caesar, if I found them so cheeky with the hand of her here (what's her name, since she stopped being Cleopatra?), I'd have them whipped. Whip him, men, until you see him screw up his face like a boy and whine aloud for mercy. Take him away."}, {"t": "sp", "who": "THYREUS", "lines": ["Mark Antony,--"], "id": 939, "m": "Mark Antony..."}, {"t": "sp", "who": "ANTONY", "lines": ["Tug him away: being whipp'd,", "Bring him again.--This Jack of Caesar's shall", "Bear us an errand to him.--"], "id": 940, "m": "Drag him away. When he's been whipped, bring him back. This lackey of Caesar's will take him a message from us."}, {"t": "sd", "text": "Exeunt Attendants with Thyreus.", "id": 941}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["You were half blasted ere I knew you.--Ha!", "Have I my pillow left unpress'd in Rome,", "Forborne the getting of a lawful race,", "And by a gem of women, to be abus'd", "By one that looks on feeders?"], "id": 942, "m": "You were half rotten before I met you. Ha! Did I leave my pillow in Rome untouched, give up having lawful children with a jewel of a woman, only to be deceived by someone who flirts with servants?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Good my lord,--"], "id": 943, "m": "My good lord..."}, {"t": "sp", "who": "ANTONY", "lines": ["You have been a boggler ever:--", "But when we in our viciousness grow hard,--", "O misery on't!--the wise gods seal our eyes;", "In our own filth drop our clear judgments: make us", "Adore our errors; laugh at's while we strut", "To our confusion."], "id": 944, "m": "You've always been unfaithful. But when we become hardened in our vices (oh, how miserable!), the wise gods blind us, drop our clear judgement in our own filth, make us worship our mistakes, and laugh at us while we strut towards our ruin."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, is't come to this?"], "id": 945, "m": "Oh, has it come to this?"}, {"t": "sp", "who": "ANTONY", "lines": ["I found you as a morsel cold upon", "Dead Caesar's trencher; nay, you were a fragment", "Of Cneius Pompey's; besides what hotter hours,", "Unregist'red in vulgar fame, you have", "Luxuriously pick'd out:--for I am sure,", "Though you can guess what temperance should be,", "You know not what it is."], "id": 946, "m": "I found you like a cold leftover on dead Julius Caesar's plate. No, you were a scrap left by Gnaeus Pompey, not to mention the hotter hours, not recorded in common gossip, that you lustfully picked out for yourself. Because I'm sure that though you can guess what self-control is, you don't know what it means."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Wherefore is this?"], "id": 947, "m": "Why are you saying this?"}, {"t": "sp", "who": "ANTONY", "lines": ["To let a fellow that will take rewards,", "And say 'God quit you!' be familiar with", "My playfellow, your hand; this kingly seal", "And plighter of high hearts!--O that I were", "Upon the hill of Basan, to outroar", "The horned herd! for I have savage cause;", "And to proclaim it civilly were like", "A halter'd neck which does the hangman thank", "For being yare about him."], "id": 948, "m": "Because you let a fellow who takes tips and says 'God reward you!' get familiar with my playmate, your hand, this royal seal that pledges great hearts! Oh, I wish I were on the hill of Bashan, to roar louder than the horned bulls! I have savage reasons, because I'm a cuckold, and to announce it politely would be like a man with a noose round his neck thanking the hangman for being quick."}, {"t": "sd", "text": "Re-enter Attendants with Thyreus.", "id": 949}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Is he whipp'd?"], "id": 950, "m": "Has he been whipped?"}, {"t": "sp", "who": "FIRST ATTENDANT", "lines": ["Soundly, my lord."], "id": 951, "m": "Soundly, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["Cried he? and begg'd he pardon?"], "id": 952, "m": "Did he cry? And beg for mercy?"}, {"t": "sp", "who": "FIRST ATTENDANT", "lines": ["He did ask favour."], "id": 953, "m": "He did ask for mercy."}, {"t": "sp", "who": "ANTONY", "lines": ["If that thy father live, let him repent", "Thou wast not made his daughter; and be thou sorry", "To follow Caesar in his triumph, since", "Thou hast been whipp'd for following him: henceforth", "The white hand of a lady fever thee,", "Shake thou to look on't.--Get thee back to Caesar;", "Tell him thy entertainment: look thou say", "He makes me angry with him; for he seems", "Proud and disdainful, harping on what I am,", "Not what he knew I was: he makes me angry;", "And at this time most easy 'tis to do't,", "When my good stars, that were my former guides,", "Have empty left their orbs, and shot their fires", "Into the abysm of hell. If he mislike", "My speech and what is done, tell him he has", "Hipparchus, my enfranched bondman, whom", "He may at pleasure, whip, or hang, or torture,", "As he shall like, to quit me: urge it thou:", "Hence with thy stripes, be gone."], "id": 954, "m": "If your father's alive, let him regret you weren't born his daughter. And be sorry to follow Caesar in his triumph, since you've been whipped for following him. From now on, may a lady's white hand give you a fever, and may you shake to look at one. Go back to Caesar. Tell him how you were treated. Make sure you say he's making me angry with him, because he seems proud and scornful, dwelling on what I am, not what he knew I was. He makes me angry, and right now that's very easy to do, when my lucky stars, which used to guide me, have left their places in the sky and shot their fire into the pit of hell. If he doesn't like what I've said and done, tell him he has Hipparchus, my freed slave, whom he can whip, hang or torture as he likes, to pay me back. Urge him to do it. Go, with your welts. Get out."}, {"t": "sd", "text": "Exit Thyreus.", "id": 955}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Have you done yet?"], "id": 956, "m": "Have you finished yet?"}, {"t": "sp", "who": "ANTONY", "lines": ["Alack, our terrene moon", "Is now eclips'd, and it portends alone", "The fall of Antony!"], "id": 957, "m": "Alas, our earthly moon is eclipsed now, and that alone predicts the fall of Antony!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I must stay his time."], "id": 958, "m": "I must wait until his mood passes."}, {"t": "sp", "who": "ANTONY", "lines": ["To flatter Caesar, would you mingle eyes", "With one that ties his points?"], "id": 959, "m": "To flatter Caesar, would you make eyes at the man who ties his laces?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Not know me yet?"], "id": 960, "m": "Don't you know me yet?"}, {"t": "sp", "who": "ANTONY", "lines": ["Cold-hearted toward me?"], "id": 961, "m": "Are you cold-hearted towards me?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Ah, dear, if I be so,", "From my cold heart let heaven engender hail,", "And poison it in the source; and the first stone", "Drop in my neck: as it determines, so", "Dissolve my life! The next Caesarion smite!", "Till, by degrees, the memory of my womb,", "Together with my brave Egyptians all,", "By the discandying of this pelleted storm,", "Lie graveless,--till the flies and gnats of Nile", "Have buried them for prey!"], "id": 962, "m": "Ah, dear, if I am, let heaven make hail from my cold heart and poison it at the source, and let the first hailstone fall on my neck, and as it melts, may my life melt with it! Let the next one strike Caesarion! Until, one by one, all my children, together with all my brave Egyptians, lie unburied as this storm of hailstones melts, until the flies and gnats of the Nile have buried them by eating them!"}, {"t": "sp", "who": "ANTONY", "lines": ["I am satisfied.", "Caesar sits down in Alexandria; where", "I will oppose his fate. Our force by land", "Hath nobly held: our sever'd navy to", "Have knit again, and fleet, threat'ning most sea-like.", "Where hast thou been, my heart?--Dost thou hear, lady?", "If from the field I shall return once more", "To kiss these lips, I will appear in blood:", "I and my sword will earn our chronicle:", "There's hope in't yet."], "id": 963, "m": "I'm satisfied. Caesar is camped at Alexandria, where I'll fight his destiny. Our land army has held out nobly. Our scattered navy has come together again and floats, looking threatening as a warfleet should. Where have you been, my courage? Do you hear, lady? If I come back from the battlefield once more to kiss these lips, I'll come covered in blood. My sword and I will earn our place in history. There's still hope."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That's my brave lord!"], "id": 964, "m": "That's my brave lord!"}, {"t": "sp", "who": "ANTONY", "lines": ["I will be treble-sinew'd, hearted, breath'd,", "And fight maliciously: for when mine hours", "Were nice and lucky, men did ransom lives", "Of me for jests; but now I'll set my teeth,", "And send to darkness all that stop me.--Come,", "Let's have one other gaudy night: call to me", "All my sad captains; fill our bowls; once more", "Let's mock the midnight bell."], "id": 965, "m": "I'll have three times the strength, courage and breath, and fight savagely. When my days were easy and lucky, men could buy their lives from me with a joke. But now I'll grit my teeth and send everyone who stands in my way to darkness. Come, let's have one more celebration night. Call all my sad captains to me. Fill our bowls. Let's mock the midnight bell once more."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["It is my birthday.", "I had thought t'have held it poor; but since my lord", "Is Antony again I will be Cleopatra."], "id": 966, "m": "It's my birthday. I'd thought I'd keep it quietly, but since my lord is Antony again, I'll be Cleopatra."}, {"t": "sp", "who": "ANTONY", "lines": ["We will yet do well."], "id": 967, "m": "We'll still do well."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Call all his noble captains to my lord."], "id": 968, "m": "Call all his noble captains to my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["Do so; we'll speak to them: and to-night I'll force", "The wine peep through their scars.--Come on, my queen;", "There's sap in't yet. The next time I do fight", "I'll make death love me; for I will contend", "Even with his pestilent scythe."], "id": 969, "m": "Do it. We'll speak to them. And tonight I'll make the wine shine through their scars. Come on, my queen, there's still life in us. The next time I fight, I'll make death love me, because I'll compete even with his plague-bringing scythe."}, {"t": "sd", "text": "Exeunt all but Enobarbus.", "id": 970}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Now he'll outstare the lightning. To be furious", "Is to be frighted out of fear; and in that mood", "The dove will peck the estridge; and I see still", "A diminution in our captain's brain", "Restores his heart: when valour preys on reason,", "It eats the sword it fights with. I will seek", "Some way to leave him."], "id": 971, "m": "Now he'll try to outstare the lightning. Being furious is being frightened out of fear, and in that mood a dove will peck an ostrich. I keep seeing that as our captain's brain shrinks, his courage grows. When courage feeds on reason, it eats the sword it fights with. I'll look for some way to leave him."}, {"t": "sd", "text": "Exit.", "id": 972}, {"t": "scene", "act": 4, "scene": "I", "loc": "Caesar's Camp at Alexandria.", "id": 973}, {"t": "sd", "text": "Enter Caesar reading a letter; Agrippa, Maecenas, and others.", "id": 974}, {"t": "sp", "who": "CAESAR", "lines": ["He calls me boy; and chides as he had power", "To beat me out of Egypt; my messenger", "He hath whip'd with rods; dares me to personal combat,", "Caesar to Antony:--let the old ruffian know", "I have many other ways to die; meantime", "Laugh at his challenge."], "id": 975, "m": "He calls me a boy, and scolds me as if he had the power to beat me out of Egypt. He's had my messenger whipped with rods, and challenges me to single combat, Caesar against Antony. Let the old thug know I have plenty of other ways to die. Meanwhile, I laugh at his challenge."}, {"t": "sp", "who": "MAECENAS", "lines": ["Caesar must think", "When one so great begins to rage, he's hunted", "Even to falling. Give him no breath, but now", "Make boot of his distraction:--never anger", "Made good guard for itself."], "id": 976, "m": "Caesar should realise that when someone so great starts raging, he's been hunted almost to the point of falling. Give him no breathing space, but take advantage of his frenzy right now. Anger never protected itself well."}, {"t": "sp", "who": "CAESAR", "lines": ["Let our best heads", "Know that to-morrow the last of many battles", "We mean to fight.--Within our files there are", "Of those that serv'd Mark Antony but late,", "Enough to fetch him in. See it done:", "And feast the army; we have store to do't,", "And they have earn'd the waste. Poor Antony!"], "id": 977, "m": "Let our top officers know that tomorrow we mean to fight the last of many battles. Within our ranks there are enough men who served Mark Antony until recently to capture him. See to it. And give the army a feast. We have the supplies for it, and they've earned the extravagance. Poor Antony!"}, {"t": "sd", "text": "Exeunt.", "id": 978}, {"t": "scene", "act": 4, "scene": "II", "loc": "Alexandria. A Room in the Palace.", "id": 979}, {"t": "sd", "text": "Enter Antony, Cleopatra, Enobarbus, Charmian, Iras, Alexas, and others.", "id": 980}, {"t": "sp", "who": "ANTONY", "lines": ["He will not fight with me, Domitius?"], "id": 981, "m": "He won't fight me, Domitius?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["No."], "id": 982, "m": "No."}, {"t": "sp", "who": "ANTONY", "lines": ["Why should he not?"], "id": 983, "m": "Why not?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["He thinks, being twenty times of better fortune,", "He is twenty men to one."], "id": 984, "m": "He thinks that, since his luck is twenty times better, he's worth twenty men to your one."}, {"t": "sp", "who": "ANTONY", "lines": ["To-morrow, soldier,", "By sea and land I'll fight; or I will live,", "Or bathe my dying honour in the blood", "Shall make it live again. Woo't thou fight well?"], "id": 985, "m": "Tomorrow, soldier, I'll fight by sea and land. Either I'll live, or I'll bathe my dying honour in blood that will bring it back to life. Will you fight well?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I'll strike, and cry 'Take all.'"], "id": 986, "m": "I'll strike, and shout 'Winner takes all!'"}, {"t": "sp", "who": "ANTONY", "lines": ["Well said; come on.--", "Call forth my household servants: let's to-night", "Be bounteous at our meal.--"], "id": 987, "m": "Well said. Come on. Call my household servants. Let's have a generous meal tonight."}, {"t": "sd", "text": "Enter Servants.", "id": 988}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Give me thy hand,", "Thou has been rightly honest;--so hast thou;--", "Thou,--and thou,--and thou;--you have serv'd me well,", "And kings have been your fellows."], "id": 989, "m": "Give me your hand. You've been truly honest. And so have you, and you, and you, and you. You've served me well, and kings have been your fellow servants."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["[Aside to Enobarbus.] What means this?"], "id": 990, "m": "[Aside to Enobarbus] What does he mean by this?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside to Cleopatra.] 'Tis one of those odd tricks which sorrow", "shoots", "Out of the mind."], "id": 991, "m": "[Aside to Cleopatra] It's one of those strange moods that sorrow shoots out of the mind."}, {"t": "sp", "who": "ANTONY", "lines": ["And thou art honest too.", "I wish I could be made so many men,", "And all of you clapp'd up together in", "An Antony, that I might do you service", "So good as you have done."], "id": 992, "m": "And you're honest too. I wish I could be turned into as many men as you, and all of you rolled together into one Antony, so I could serve you as well as you've served me."}, {"t": "sp", "who": "SERVANT", "lines": ["The gods forbid!"], "id": 993, "m": "The gods forbid!"}, {"t": "sp", "who": "ANTONY", "lines": ["Well, my good fellows, wait on me to-night:", "Scant not my cups; and make as much of me", "As when mine empire was your fellow too,", "And suffer'd my command."], "id": 994, "m": "Well, my good fellows, wait on me tonight. Don't be stingy with my wine, and treat me as well as when my empire was your fellow servant too, and obeyed my orders."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["[Aside to Enobarbus.] What does he mean?"], "id": 995, "m": "[Aside to Enobarbus] What does he mean?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside to Cleopatra.] To make his followers weep."], "id": 996, "m": "[Aside to Cleopatra] To make his followers cry."}, {"t": "sp", "who": "ANTONY", "lines": ["Tend me to-night;", "May be it is the period of your duty:", "Haply you shall not see me more; or if,", "A mangled shadow: perchance to-morrow", "You'll serve another master. I look on you", "As one that takes his leave. Mine honest friends,", "I turn you not away; but, like a master", "Married to your good service, stay till death:", "Tend me to-night two hours, I ask no more,", "And the gods yield you for't!"], "id": 997, "m": "Serve me tonight. Maybe it's the end of your service. Perhaps you won't see me again, or if you do, as a mangled ghost. Maybe tomorrow you'll serve another master. I look at you like a man saying goodbye. My honest friends, I'm not dismissing you. Like a master married to your good service, I'll keep you till I die. Serve me for two hours tonight, I ask no more, and may the gods reward you for it!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["What mean you, sir,", "To give them this discomfort? Look, they weep;", "And I, an ass, am onion-ey'd: for shame,", "Transform us not to women."], "id": 998, "m": "What do you mean, sir, by upsetting them like this? Look, they're crying, and I, like an ass, have eyes watering as if from onions. For shame, don't turn us into women."}, {"t": "sp", "who": "ANTONY", "lines": ["Ho, ho, ho!", "Now the witch take me, if I meant it thus!", "Grace grow where those drops fall! My hearty friends,", "You take me in too dolorous a sense;", "For I spake to you for your comfort,--did desire you", "To burn this night with torches: know, my hearts,", "I hope well of to-morrow; and will lead you", "Where rather I'll expect victorious life", "Than death and honour. Let's to supper; come,", "And drown consideration."], "id": 999, "m": "Ho, ho, ho! Now may the witch take me if I meant it like that! May grace grow where those tears fall! My dear friends, you take me too gloomily. I spoke to comfort you. I wanted you to light up this night with torches. Know this, my hearts: I have good hopes for tomorrow, and I'll lead you where I expect a victorious life rather than an honourable death. Let's go to supper. Come, and drown our worries."}, {"t": "sd", "text": "Exeunt.", "id": 1000}, {"t": "scene", "act": 4, "scene": "III", "loc": "Alexandria. Before the Palace.", "id": 1001}, {"t": "sd", "text": "Enter two Soldiers to their guard.", "id": 1002}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Brother, good night: to-morrow is the day."], "id": 1003, "m": "Good night, brother. Tomorrow's the day."}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["It will determine one way: fare you well.", "Heard you of nothing strange about the streets?"], "id": 1004, "m": "It will settle things one way or the other. Goodbye. Have you heard about anything strange in the streets?"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Nothing. What news?"], "id": 1005, "m": "Nothing. What news?"}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Belike 'tis but a rumour. Good night to you."], "id": 1006, "m": "It's probably just a rumour. Good night."}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Well, sir, good night."], "id": 1007, "m": "Well, sir, good night."}, {"t": "sd", "text": "Enter two other Soldiers.", "id": 1008}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Soldiers, have careful watch."], "id": 1009, "m": "Soldiers, keep a careful watch."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["And you. Good night, good night."], "id": 1010, "m": "You too. Good night, good night."}, {"t": "sd", "text": "The first two place themselves at their posts.", "id": 1011}, {"t": "sp", "who": "FOURTH SOLDIER", "lines": ["Here we: [The third and fourth take their posts.] and if", "to-morrow", "Our navy thrive, I have an absolute hope", "Our landmen will stand up."], "id": 1012, "m": "Here we are. [The third and fourth take their posts.] If our navy does well tomorrow, I'm absolutely sure our land army will hold out."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["'Tis a brave army,", "And full of purpose.", "[Music as of hautboys under the stage.]"], "id": 1013, "m": "It's a brave army, and very determined. [Music of oboes is heard under the stage.]"}, {"t": "sp", "who": "FOURTH SOLDIER", "lines": ["Peace, what noise?"], "id": 1014, "m": "Quiet! What's that noise?"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["List, list!"], "id": 1015, "m": "Listen, listen!"}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Hark!"], "id": 1016, "m": "Hark!"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Music i' the air."], "id": 1017, "m": "Music in the air."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Under the earth."], "id": 1018, "m": "Under the ground."}, {"t": "sp", "who": "FOURTH SOLDIER", "lines": ["It signs well, does it not?"], "id": 1019, "m": "It's a good sign, isn't it?"}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["No."], "id": 1020, "m": "No."}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Peace, I say!", "What should this mean?"], "id": 1021, "m": "Quiet, I say! What can this mean?"}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["'Tis the god Hercules, whom Antony lov'd,", "Now leaves him."], "id": 1022, "m": "It's the god Hercules, whom Antony loved, leaving him now."}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Walk; let's see if other watchmen", "Do hear what we do."], "id": 1023, "m": "Let's walk. Let's see if the other guards hear what we hear."}, {"t": "sd", "text": "They advance to another post.", "id": 1024}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["How now, masters!"], "id": 1025, "m": "What's happening, friends?"}, {"t": "sp", "who": "SOLDIERS", "lines": ["[Speaking together.] How now!", "How now! Do you hear this?"], "id": 1026, "m": "[Speaking together] What's happening! What's happening! Do you hear this?"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Ay; is't not strange?"], "id": 1027, "m": "Yes. Isn't it strange?"}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Do you hear, masters? do you hear?"], "id": 1028, "m": "Do you hear, friends? Do you hear?"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Follow the noise so far as we have quarter;", "Let's see how it will give off."], "id": 1029, "m": "Let's follow the noise as far as our post allows. Let's see how it ends."}, {"t": "sp", "who": "SOLDIERS", "lines": ["[Speaking together.] Content. 'Tis strange."], "id": 1030, "m": "[Speaking together] Agreed. It's strange."}, {"t": "sd", "text": "Exeunt.", "id": 1031}, {"t": "scene", "act": 4, "scene": "IV", "loc": "Alexandria. A Room in the Palace.", "id": 1032}, {"t": "sd", "text": "Enter Antony and Cleopatra, Charmian, Iras, and others attending.", "id": 1033}, {"t": "sp", "who": "ANTONY", "lines": ["Eros! mine armour, Eros!"], "id": 1034, "m": "Eros! My armour, Eros!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sleep a little."], "id": 1035, "m": "Sleep a little."}, {"t": "sp", "who": "ANTONY", "lines": ["No, my chuck.--Eros! Come, mine armour, Eros!"], "id": 1036, "m": "No, my chick. Eros! Come, my armour, Eros!"}, {"t": "sd", "text": "Enter Eros with armour.", "id": 1037}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Come, good fellow, put mine iron on.--", "If fortune be not ours to-day, it is", "Because we brave her.--Come."], "id": 1038, "m": "Come, good fellow, put my iron on. If fortune isn't on our side today, it's because we defy her. Come."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, I'll help too.", "What's this for?"], "id": 1039, "m": "No, I'll help too. What's this for?"}, {"t": "sp", "who": "ANTONY", "lines": ["Ah, let be, let be! Thou art", "The armourer of my heart. False, false; this, this."], "id": 1040, "m": "Ah, leave it, leave it! You're the armourer of my heart. Wrong, wrong; this one, this one."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sooth, la, I'll help: thus it must be."], "id": 1041, "m": "Really, I'll help. It must go like this."}, {"t": "sp", "who": "ANTONY", "lines": ["Well, well;", "We shall thrive now.--Seest thou, my good fellow?", "Go put on thy defences."], "id": 1042, "m": "Well, well, we'll do well now. Do you see, my good fellow? Go and put on your own armour."}, {"t": "sp", "who": "EROS", "lines": ["Briefly, sir."], "id": 1043, "m": "Right away, sir."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Is not this buckled well?"], "id": 1044, "m": "Isn't this buckled well?"}, {"t": "sp", "who": "ANTONY", "lines": ["Rarely, rarely;", "He that unbuckles this, till we do please", "To daff't for our repose, shall hear a storm.--", "Thou fumblest, Eros, and my queen's a squire", "More tight at this than thou: despatch.--O love,", "That thou couldst see my wars to-day, and knew'st", "The royal occupation! Thou shouldst see", "A workman in't.--"], "id": 1045, "m": "Excellently, excellently. Anyone who unbuckles this before we choose to take it off to rest will face a storm. You're fumbling, Eros, and my queen is a better squire at this than you. Hurry up. Oh love, I wish you could see me fight today and understood this royal trade! You'd see a real craftsman at work."}, {"t": "sd", "text": "Enter an Officer, armed.", "id": 1046}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Good-morrow to thee; welcome:", "Thou look'st like him that knows a warlike charge:", "To business that we love we rise betime,", "And go to't with delight."], "id": 1047, "m": "Good morning to you. Welcome. You look like a man who knows what a military command is. We get up early for work we love, and go to it with delight."}, {"t": "sp", "who": "OFFICER", "lines": ["A thousand, sir,", "Early though't be, have on their riveted trim,", "And at the port expect you."], "id": 1048, "m": "A thousand men, sir, early as it is, have put on their armour and are waiting for you at the gate."}, {"t": "sd", "text": "Shout. Flourish of trumpets within.", "id": 1049}, {"t": "sd", "text": "Enter other Officers and Soldiers.", "id": 1050}, {"t": "sp", "who": "SECOND OFFICER", "lines": ["The morn is fair.--Good morrow, general."], "id": 1051, "m": "It's a fine morning. Good morning, general."}, {"t": "sp", "who": "ALL", "lines": ["Good morrow, general."], "id": 1052, "m": "Good morning, general."}, {"t": "sp", "who": "ANTONY", "lines": ["'Tis well blown, lads:", "This morning, like the spirit of a youth", "That means to be of note, begins betimes.--", "So, so; come, give me that: this way; well said.--", "Fare thee well, dame, whate'er becomes of me:", "[Kisses her.]", "This is a soldier's kiss: rebukeable,", "And worthy shameful check it were, to stand", "On more mechanic compliment; I'll leave thee", "Now like a man of steel.--You that will fight,", "Follow me close; I'll bring you to't. Adieu."], "id": 1053, "m": "That's a fine blast, lads. This morning starts early, like the spirit of a young man who means to make a name for himself. So, so. Come, give me that. This way. Well done. Goodbye, lady, whatever happens to me. [He kisses her.] This is a soldier's kiss. It would deserve to be scolded and shamed if I stood here making ordinary polite speeches. I'll leave you now like a man of steel. Those of you who'll fight, follow me closely. I'll lead you to it. Goodbye."}, {"t": "sd", "text": "Exeunt Antony, Eros, Officers and Soldiers.", "id": 1054}, {"t": "sp", "who": "CHARMIAN", "lines": ["Please you, retire to your chamber."], "id": 1055, "m": "Please, go to your room."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Lead me.", "He goes forth gallantly. That he and Caesar might", "Determine this great war in single fight!", "Then, Antony,--but now--Well, on."], "id": 1056, "m": "Lead me. He goes out bravely. If only he and Caesar could settle this great war in single combat! Then, Antony... But now... Well, go on."}, {"t": "sd", "text": "Exeunt.", "id": 1057}, {"t": "scene", "act": 4, "scene": "V", "loc": "Antony's camp near Alexandria.", "id": 1058}, {"t": "sd", "text": "Trumpets sound within. Enter Antony and Eros; a Soldier meeting them.", "id": 1059}, {"t": "sp", "who": "SOLDIER", "lines": ["The gods make this a happy day to Antony!"], "id": 1060, "m": "May the gods make this a happy day for Antony!"}, {"t": "sp", "who": "ANTONY", "lines": ["Would thou and those thy scars had once prevail'd", "To make me fight at land!"], "id": 1061, "m": "I wish you and those scars of yours had persuaded me to fight on land!"}, {"t": "sp", "who": "SOLDIER", "lines": ["Hadst thou done so,", "The kings that have revolted, and the soldier", "That has this morning left thee, would have still", "Follow'd thy heels."], "id": 1062, "m": "If you had, the kings who have deserted you, and the soldier who left you this morning, would still be following at your heels."}, {"t": "sp", "who": "ANTONY", "lines": ["Who's gone this morning?"], "id": 1063, "m": "Who's gone this morning?"}, {"t": "sp", "who": "SOLDIER", "lines": ["Who.", "One ever near thee. Call for Enobarbus,", "He shall not hear thee; or from Caesar's camp", "Say 'I am none of thine.'"], "id": 1064, "m": "Who? Someone always close to you. Call for Enobarbus, and he won't hear you, or he'll answer from Caesar's camp, 'I'm not yours.'"}, {"t": "sp", "who": "ANTONY", "lines": ["What say'st thou?"], "id": 1065, "m": "What are you saying?"}, {"t": "sp", "who": "SOLDIER", "lines": ["Sir,", "He is with Caesar."], "id": 1066, "m": "Sir, he's with Caesar."}, {"t": "sp", "who": "EROS", "lines": ["Sir, his chests and treasure", "He has not with him."], "id": 1067, "m": "Sir, he didn't take his chests and treasure with him."}, {"t": "sp", "who": "ANTONY", "lines": ["Is he gone?"], "id": 1068, "m": "Has he gone?"}, {"t": "sp", "who": "SOLDIER", "lines": ["Most certain."], "id": 1069, "m": "Quite certainly."}, {"t": "sp", "who": "ANTONY", "lines": ["Go, Eros, send his treasure after; do it;", "Detain no jot, I charge thee; write to him--", "I will subscribe,--gentle adieus and greetings;", "Say that I wish he never find more cause", "To change a master.--O, my fortunes have", "Corrupted honest men!--Eros, despatch."], "id": 1070, "m": "Go, Eros, send his treasure after him. Do it. Don't keep back a scrap, I order you. Write to him (I'll sign it) with gentle farewells and greetings. Say I hope he never has reason to change masters again. Oh, my bad fortune has corrupted honest men! Hurry, Eros."}, {"t": "sd", "text": "Exeunt.", "id": 1071}, {"t": "scene", "act": 4, "scene": "VI", "loc": "Alexandria. Caesar's camp.", "id": 1072}, {"t": "sd", "text": "Flourish. Enter Agrippa, Caesar, with Dolabella and Enobarbus.", "id": 1073}, {"t": "sp", "who": "CAESAR", "lines": ["Go forth, Agrippa, and begin the fight:", "Our will is Antony be took alive;", "Make it so known."], "id": 1074, "m": "Go out, Agrippa, and start the fight. Our wish is that Antony be taken alive. Make that known."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Caesar, I shall."], "id": 1075, "m": "Caesar, I will."}, {"t": "sd", "text": "Exit.", "id": 1076}, {"t": "sp", "who": "CAESAR", "lines": ["The time of universal peace is near:", "Prove this a prosperous day, the three-nook'd world", "Shall bear the olive freely."], "id": 1077, "m": "The time of world peace is near. If this turns out to be a successful day, the three corners of the world will grow olive branches freely."}, {"t": "sd", "text": "Enter a Messenger.", "id": 1078}, {"t": "sp", "who": "MESSENGER", "lines": ["Antony", "Is come into the field."], "id": 1079, "m": "Antony has taken the field."}, {"t": "sp", "who": "CAESAR", "lines": ["Go charge Agrippa", "Plant those that have revolted in the van,", "That Antony may seem to spend his fury", "Upon himself."], "id": 1080, "m": "Go and order Agrippa to put the deserters in the front line, so that Antony seems to be spending his fury on himself."}, {"t": "sd", "text": "Exeunt Caesar and his Train.", "id": 1081}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Alexas did revolt; and went to Jewry on", "Affairs of Antony; there did dissuade", "Great Herod to incline himself to Caesar", "And leave his master Antony: for this pains", "Caesar hath hang'd him. Canidius and the rest", "That fell away, have entertainment, but", "No honourable trust. I have done ill;", "Of which I do accuse myself so sorely", "That I will joy no more."], "id": 1082, "m": "Alexas deserted. He went to Judea on Antony's business, and there persuaded great Herod to side with Caesar and abandon his master Antony. For his trouble, Caesar has hanged him. Canidius and the others who deserted are given work, but not honourable trust. I've done wrong, and I blame myself so bitterly that I'll never be happy again."}, {"t": "sd", "text": "Enter a Soldier of Caesar's.", "id": 1083}, {"t": "sp", "who": "SOLDIER", "lines": ["Enobarbus, Antony", "Hath after thee sent all thy treasure, with", "His bounty overplus: the messenger", "Came on my guard, and at thy tent is now", "Unloading of his mules."], "id": 1084, "m": "Enobarbus, Antony has sent all your treasure after you, with extra gifts of his own. The messenger came while I was on guard and is at your tent now, unloading his mules."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I give it you."], "id": 1085, "m": "I give it to you."}, {"t": "sp", "who": "SOLDIER", "lines": ["Mock not, Enobarbus.", "I tell you true: best you saf'd the bringer", "Out of the host; I must attend mine office,", "Or would have done't myself. Your emperor", "Continues still a Jove."], "id": 1086, "m": "Don't joke, Enobarbus. I'm telling the truth. You'd better see the man who brought it safely out of the camp. I must get back to my duty, or I'd have done it myself. Your commander is still like Jupiter."}, {"t": "sd", "text": "Exit.", "id": 1087}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I am alone the villain of the earth,", "And feel I am so most. O Antony,", "Thou mine of bounty, how wouldst thou have paid", "My better service, when my turpitude", "Thou dost so crown with gold! This blows my heart:", "If swift thought break it not, a swifter mean", "Shall outstrike thought: but thought will do't, I feel.", "I fight against thee!--No: I will go seek", "Some ditch wherein to die; the foul'st best fits", "My latter part of life."], "id": 1088, "m": "I'm the only villain on earth, and I feel it most of all. Oh Antony, you goldmine of generosity, how would you have paid my better service, when you crown my wickedness with gold! This makes my heart swell. If grief doesn't break it quickly, a quicker means will beat grief to it. But I feel grief will do it. Fight against you? No. I'll go and find some ditch to die in. The filthiest suits the last part of my life best."}, {"t": "sd", "text": "Exit.", "id": 1089}, {"t": "scene", "act": 4, "scene": "VII", "loc": "Field of battle between the Camps.", "id": 1090}, {"t": "sd", "text": "Alarum. Drums and trumpets. Enter Agrippa and others.", "id": 1091}, {"t": "sp", "who": "AGRIPPA", "lines": ["Retire, we have engag'd ourselves too far:", "Caesar himself has work, and our oppression", "Exceeds what we expected."], "id": 1092, "m": "Retreat! We've gone too far. Caesar himself has his hands full, and the pressure on us is greater than we expected."}, {"t": "sd", "text": "Exeunt.", "id": 1093}, {"t": "sd", "text": "Alarum. Enter Antony, and Scarus wounded.", "id": 1094}, {"t": "sp", "who": "SCARUS", "lines": ["O my brave emperor, this is fought indeed!", "Had we done so at first, we had driven them home", "With clouts about their heads."], "id": 1095, "m": "Oh my brave commander, this is real fighting! If we'd fought like this at first, we'd have driven them home with bandages on their heads."}, {"t": "sp", "who": "ANTONY", "lines": ["Thou bleed'st apace."], "id": 1096, "m": "You're bleeding fast."}, {"t": "sp", "who": "SCARUS", "lines": ["I had a wound here that was like a T,", "But now 'tis made an H."], "id": 1097, "m": "I had a wound here like a T, but now it's become an H."}, {"t": "sp", "who": "ANTONY", "lines": ["They do retire."], "id": 1098, "m": "They're retreating."}, {"t": "sp", "who": "SCARUS", "lines": ["We'll beat'em into bench-holes: I have yet", "Room for six scotches more."], "id": 1099, "m": "We'll beat them into the holes of a toilet bench. I've still got room for six more cuts."}, {"t": "sd", "text": "Enter Eros.", "id": 1100}, {"t": "sp", "who": "EROS", "lines": ["They are beaten, sir; and our advantage serves", "For a fair victory."], "id": 1101, "m": "They're beaten, sir, and our advantage means a clear victory."}, {"t": "sp", "who": "SCARUS", "lines": ["Let us score their backs", "And snatch 'em up, as we take hares, behind:", "'Tis sport to maul a runner."], "id": 1102, "m": "Let's slash their backs and grab them from behind, the way we catch hares. It's fun to beat a runner."}, {"t": "sp", "who": "ANTONY", "lines": ["I will reward thee", "Once for thy sprightly comfort, and tenfold", "For thy good valour. Come thee on."], "id": 1103, "m": "I'll reward you once for your cheerful encouragement, and ten times for your great courage. Come on."}, {"t": "sp", "who": "SCARUS", "lines": ["I'll halt after."], "id": 1104, "m": "I'll limp after you."}, {"t": "sd", "text": "Exeunt.", "id": 1105}, {"t": "scene", "act": 4, "scene": "VIII", "loc": "Under the Walls of Alexandria.", "id": 1106}, {"t": "sd", "text": "Alarum. Enter Antony, marching; Scarus and Forces.", "id": 1107}, {"t": "sp", "who": "ANTONY", "lines": ["We have beat him to his camp. Run one before", "And let the queen know of our gests.--To-morrow,", "Before the sun shall see us, we'll spill the blood", "That has to-day escap'd. I thank you all;", "For doughty-handed are you, and have fought", "Not as you serv'd the cause, but as't had been", "Each man's like mine; you have shown all Hectors.", "Enter the city, clip your wives, your friends,", "Tell them your feats; whilst they with joyful tears", "Wash the congealment from your wounds and kiss", "The honour'd gashes whole.--[To Scarus.] Give me thy hand;"], "id": 1108, "m": "We've beaten him back to his camp. Someone run ahead and tell the queen of our deeds. Tomorrow, before the sun sees us, we'll spill the blood that escaped today. I thank you all. You're brave fighters, and you fought not as if you were serving a cause, but as if it were each man's own, as it is mine. You've all been like Hector. Go into the city, hug your wives and friends, tell them your deeds, while they wash the dried blood from your wounds with tears of joy and kiss the honourable gashes until they heal. [To Scarus] Give me your hand."}, {"t": "sd", "text": "Enter Cleopatra, attended.", "id": 1109}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["To this great fairy I'll commend thy acts,", "Make her thanks bless thee. O thou day o' the world,", "Chain mine arm'd neck; leap thou, attire and all;", "Through proof of harness to my heart, and there", "Ride on the pants triumphing."], "id": 1110, "m": "I'll praise your deeds to this great enchantress and let her thanks bless you. Oh you light of the world, put your arms round my armoured neck. Leap, clothes and all, through my tested armour to my heart, and ride there in triumph on its beating."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Lord of lords!", "O infinite virtue, com'st thou smiling from", "The world's great snare uncaught?"], "id": 1111, "m": "Lord of lords! Oh endless courage, have you come smiling back from the world's great trap without being caught?"}, {"t": "sp", "who": "ANTONY", "lines": ["Mine nightingale,", "We have beat them to their beds. What, girl! though grey", "Do something mingle with our younger brown, yet ha' we", "A brain that nourishes our nerves, and can", "Get goal for goal of youth. Behold this man;", "Commend unto his lips thy favouring hand;--", "Kiss it, my warrior: he hath fought to-day", "As if a god, in hate of mankind, had", "Destroyed in such a shape."], "id": 1112, "m": "My nightingale, we've beaten them back to their beds. What, girl! Though some grey hairs mix with our younger brown, we still have a brain that strengthens our muscles and can score goal for goal against youth. Look at this man. Give him your gracious hand to kiss. Kiss it, my warrior. He's fought today as if a god who hated mankind had destroyed it in his shape."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I'll give thee, friend,", "An armour all of gold; it was a king's."], "id": 1113, "m": "Friend, I'll give you a suit of armour made entirely of gold. It belonged to a king."}, {"t": "sp", "who": "ANTONY", "lines": ["He has deserv'd it, were it carbuncled", "Like holy Phoebus' car.--Give me thy hand:", "Through Alexandria make a jolly march;", "Bear our hack'd targets like the men that owe them:", "Had our great palace the capacity", "To camp this host, we all would sup together,", "And drink carouses to the next day's fate,", "Which promises royal peril.--Trumpeters,", "With brazen din blast you the city's ear;", "Make mingle with our rattling tabourines;", "That heaven and earth may strike their sounds together,", "Applauding our approach."], "id": 1114, "m": "He'd deserve it even if it were studded with rubies like the sun god's chariot. Give me your hand. Let's march merrily through Alexandria, carrying our battered shields like the men who own them. If our great palace could hold this whole army, we'd all have supper together and drink toasts to tomorrow's fate, which promises royal danger. Trumpeters, blast the city's ears with your brass noise, and mix it with our rattling drums, so heaven and earth can echo the sound together, applauding our return."}, {"t": "sd", "text": "Exeunt.", "id": 1115}, {"t": "scene", "act": 4, "scene": "IX", "loc": "Caesar's camp.", "id": 1116}, {"t": "sd", "text": "Sentinels at their Post.", "id": 1117}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["If we be not reliev'd within this hour,", "We must return to the court of guard: the night", "Is shiny; and they say we shall embattle", "By the second hour i' the morn."], "id": 1118, "m": "If we're not relieved within the hour, we must go back to the guardroom. The night is bright, and they say we'll be lined up for battle by two in the morning."}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["This last day was", "A shrewd one to's."], "id": 1119, "m": "Yesterday was a bad day for us."}, {"t": "sd", "text": "Enter Enobarbus.", "id": 1120}, {"t": "sp", "who": "ENOBARBUS", "lines": ["O, bear me witness, night.--"], "id": 1121, "m": "Oh, be my witness, night..."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["What man is this?"], "id": 1122, "m": "Who's this?"}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Stand close and list him."], "id": 1123, "m": "Keep hidden and listen to him."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Be witness to me, O thou blessed moon,", "When men revolted shall upon record", "Bear hateful memory, poor Enobarbus did", "Before thy face repent!--"], "id": 1124, "m": "Be my witness, oh blessed moon, when deserters are remembered with hatred in the history books, that poor Enobarbus repented in front of you!"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Enobarbus!"], "id": 1125, "m": "Enobarbus!"}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Peace!", "Hark further."], "id": 1126, "m": "Quiet! Listen some more."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["O sovereign mistress of true melancholy,", "The poisonous damp of night disponge upon me,", "That life, a very rebel to my will,", "May hang no longer on me: throw my heart", "Against the flint and hardness of my fault;", "Which, being dried with grief, will break to powder,", "And finish all foul thoughts. O Antony,", "Nobler than my revolt is infamous,", "Forgive me in thine own particular;", "But let the world rank me in register", "A master-leaver and a fugitive:", "O Antony! O Antony!", "[Dies.]"], "id": 1127, "m": "Oh moon, queen of true sadness, squeeze the poisonous damp of the night onto me, so that life, which rebels against my will, may stop clinging to me. Throw my heart against the hard flint of my crime. It's so dried up with grief that it will break into powder and end all foul thoughts. Oh Antony, more noble than my desertion is shameful, forgive me yourself, but let the world record me as a deserter of his master and a runaway. Oh Antony! Oh Antony! [He dies.]"}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Let's speak to him."], "id": 1128, "m": "Let's speak to him."}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Let's hear him, for the things he speaks", "May concern Caesar."], "id": 1129, "m": "Let's listen to him, because what he says may concern Caesar."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Let's do so. But he sleeps."], "id": 1130, "m": "Let's do that. But he's asleep."}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["Swoons rather; for so bad a prayer as his", "Was never yet fore sleep."], "id": 1131, "m": "Fainted, more likely, because a prayer as miserable as his never came before sleep."}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Go we to him."], "id": 1132, "m": "Let's go to him."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Awake, sir, awake; speak to us."], "id": 1133, "m": "Wake up, sir, wake up. Speak to us."}, {"t": "sp", "who": "SECOND SOLDIER", "lines": ["Hear you, sir?"], "id": 1134, "m": "Can you hear us, sir?"}, {"t": "sp", "who": "FIRST SOLDIER", "lines": ["The hand of death hath raught him."], "id": 1135, "m": "The hand of death has taken him."}, {"t": "sd", "text": "Drums afar off.", "id": 1136}, {"t": "sp", "who": "FIRST SOLDIER", "cont": 1, "lines": ["Hark! the drums", "Do merrily wake the sleepers. Let us bear him", "To the court of guard; he is of note: our hour", "Is fully out."], "id": 1137, "m": "Listen! The drums are cheerfully waking the sleepers. Let's carry him to the guardroom. He's an important man. Our watch is over."}, {"t": "sp", "who": "THIRD SOLDIER", "lines": ["Come on, then;", "He may recover yet."], "id": 1138, "m": "Come on, then. He may still recover."}, {"t": "sd", "text": "Exeunt with the body.", "id": 1139}, {"t": "scene", "act": 4, "scene": "X", "loc": "Ground between the two Camps.", "id": 1140}, {"t": "sd", "text": "Enter Antony and Scarus, with Forces, marching.", "id": 1141}, {"t": "sp", "who": "ANTONY", "lines": ["Their preparation is to-day by sea;", "We please them not by land."], "id": 1142, "m": "They're preparing to fight at sea today. We don't suit them on land."}, {"t": "sp", "who": "SCARUS", "lines": ["For both, my lord."], "id": 1143, "m": "They're preparing for both, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["I would they'd fight i' the fire or i' the air;", "We'd fight there too. But this it is; our foot", "Upon the hills adjoining to the city", "Shall stay with us:--order for sea is given;", "They have put forth the haven:--forward now,", "Where their appointment we may best discover,", "And look on their endeavour."], "id": 1144, "m": "I wish they'd fight in fire or in the air; we'd fight there too. But here's the plan. Our foot soldiers will stay with us on the hills next to the city. Orders have been given for the navy; they've left the harbour. Let's go forward to where we can best see their positions and watch what they do."}, {"t": "sd", "text": "Exeunt.", "id": 1145}, {"t": "scene", "act": 4, "scene": "XI", "loc": "Another part of the Ground.", "id": 1146}, {"t": "sd", "text": "Enter Caesar with his Forces, marching.", "id": 1147}, {"t": "sp", "who": "CAESAR", "lines": ["But being charg'd, we will be still by land,", "Which, as I take't, we shall; for his best force", "Is forth to man his galleys. To the vales,", "And hold our best advantage."], "id": 1148, "m": "Unless we're attacked, we'll stay still on land, which I think we can, because his best troops have gone to man his ships. To the valleys, and hold our best position."}, {"t": "sd", "text": "Exeunt.", "id": 1149}, {"t": "scene", "act": 4, "scene": "XII", "loc": "Another part of the Ground.", "id": 1150}, {"t": "sd", "text": "Enter Antony and Scarus.", "id": 1151}, {"t": "sp", "who": "ANTONY", "lines": ["Yet they are not join'd: where yond pine does stand", "I shall discover all: I'll bring thee word", "Straight how 'tis like to go."], "id": 1152, "m": "They haven't engaged yet. From where that pine tree stands I'll see everything. I'll bring you word straight away of how it's likely to go."}, {"t": "sd", "text": "Exit.", "id": 1153}, {"t": "sp", "who": "SCARUS", "lines": ["Swallows have built", "In Cleopatra's sails their nests: the augurers", "Say they know not,--they cannot tell;--look grimly,", "And dare not speak their knowledge. Antony", "Is valiant and dejected; and, by starts,", "His fretted fortunes give him hope and fear", "Of what he has and has not."], "id": 1154, "m": "Swallows have built their nests in Cleopatra's sails. The fortune-tellers say they don't know, they can't tell. They look grim and don't dare say what they know. Antony is brave and depressed, and his worn-down fortunes keep giving him fits of hope and fear about what he has and what he hasn't."}, {"t": "sd", "text": "Alarum afar off, as at a sea-fight.", "id": 1155}, {"t": "sd", "text": "Re-enter Antony.", "id": 1156}, {"t": "sp", "who": "ANTONY", "lines": ["All is lost;", "This foul Egyptian hath betrayed me:", "My fleet hath yielded to the foe; and yonder", "They cast their caps up, and carouse together", "Like friends long lost.--Triple-turn'd whore! 'tis thou", "Hast sold me to this novice; and my heart", "Makes only wars on thee.--Bid them all fly;", "For when I am reveng'd upon my charm,", "I have done all.--Bid them all fly; begone."], "id": 1157, "m": "All is lost. This foul Egyptian has betrayed me. My fleet has surrendered to the enemy, and over there they're throwing their caps in the air and drinking together like long-lost friends. Three-times-unfaithful whore! You've sold me to this beginner, and my heart makes war on you alone. Tell them all to run, because once I've had my revenge on my enchantress, I'm finished. Tell them all to run. Go."}, {"t": "sd", "text": "Exit Scarus.", "id": 1158}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["O sun, thy uprise shall I see no more:", "Fortune and Antony part here; even here", "Do we shake hands.--All come to this!--The hearts", "That spaniel'd me at heels, to whom I gave", "Their wishes, do discandy, melt their sweets", "On blossoming Caesar; and this pine is bark'd", "That overtopp'd them all. Betray'd I am:", "O this false soul of Egypt! this grave charm,", "Whose eye beck'd forth my wars and call'd them home;", "Whose bosom was my crownet, my chief end,--", "Like a right gypsy, hath, at fast and loose,", "Beguil'd me to the very heart of loss.--", "What, Eros, Eros!"], "id": 1159, "m": "Oh sun, I'll never see you rise again. Fortune and Antony part here; right here we shake hands. Has it all come to this? The hearts that followed at my heels like spaniels, to whom I gave everything they wanted, are melting and dripping their sweetness onto Caesar, who's in full bloom. And this pine tree, which towered over them all, is stripped of its bark. I'm betrayed. Oh, this treacherous soul of Egypt! This deadly enchantress, whose look sent out my wars and called them home, whose breast was my crown and my goal, like a real gypsy has cheated me, with her fast-and-loose tricks, into total ruin. Hey, Eros, Eros!"}, {"t": "sd", "text": "Enter Cleopatra.", "id": 1160}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Ah, thou spell! Avaunt!"], "id": 1161, "m": "Ah, you witch! Get away!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Why is my lord enrag'd against his love?"], "id": 1162, "m": "Why is my lord so angry with his love?"}, {"t": "sp", "who": "ANTONY", "lines": ["Vanish, or I shall give thee thy deserving,", "And blemish Caesar's triumph. Let him take thee", "And hoist thee up to the shouting plebeians:", "Follow his chariot, like the greatest spot", "Of all thy sex; most monster-like, be shown", "For poor'st diminutives, for doits; and let", "Patient Octavia plough thy visage up", "With her prepared nails."], "id": 1163, "m": "Vanish, or I'll give you what you deserve, and spoil Caesar's victory parade. Let him take you and hold you up to the cheering crowds. Follow his chariot, like the greatest stain on womankind. Be shown like a freak to the poorest people for pennies, and let patient Octavia plough up your face with her sharpened nails."}, {"t": "sd", "text": "Exit Cleopatra.", "id": 1164}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["'Tis well thou'rt gone,", "If it be well to live; but better 'twere", "Thou fell'st into my fury, for one death", "Might have prevented many.--Eros, ho!--", "The shirt of Nessus is upon me: teach me,", "Alcides, thou mine ancestor, thy rage:", "Let me lodge Lichas on the horns o' the moon;", "And with those hands that grasp'd the heaviest club", "Subdue my worthiest self. The witch shall die:", "To the young Roman boy she hath sold me, and I fall", "Under this plot:--she dies for't.--Eros, ho!"], "id": 1165, "m": "It's good that you've gone, if it's good to live. But it would be better if you'd fallen victim to my fury, because one death might have prevented many. Eros, hey! The shirt of Nessus is burning me. Hercules, my ancestor, teach me your rage. Let me throw Lichas up onto the horns of the moon, and with the hands that held the heaviest club, destroy my noblest self. The witch will die. She's sold me to the young Roman boy, and I'm falling because of her plot. She'll die for it. Eros, hey!"}, {"t": "sd", "text": "Exit.", "id": 1166}, {"t": "scene", "act": 4, "scene": "XIII", "loc": "Alexandria. A Room in the Palace.", "id": 1167}, {"t": "sd", "text": "Enter Cleopatra, Charmian, Iras, and Mardian.", "id": 1168}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Help me, my women! O, he is more mad", "Than Telamon for his shield; the boar of Thessaly", "Was never so emboss'd."], "id": 1169, "m": "Help me, my women! Oh, he's madder than Ajax over the shield. The boar of Thessaly never foamed at the mouth like this."}, {"t": "sp", "who": "CHARMIAN", "lines": ["To the monument!", "There lock yourself, and send him word you are dead.", "The soul and body rive not more in parting", "Than greatness going off."], "id": 1170, "m": "To the monument! Lock yourself in there, and send him word that you're dead. The soul and body don't tear apart more painfully at death than greatness does when it leaves a man."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["To the monument!--", "Mardian, go tell him I have slain myself;", "Say that the last I spoke was 'Antony',", "And word it, pr'ythee, piteously: hence, Mardian;", "And bring me how he takes my death.--", "To the monument!"], "id": 1171, "m": "To the monument! Mardian, go and tell him I've killed myself. Say the last word I spoke was 'Antony', and please say it pitifully. Go, Mardian, and tell me how he takes my death. To the monument!"}, {"t": "sd", "text": "Exeunt.", "id": 1172}, {"t": "scene", "act": 4, "scene": "XIV", "loc": "Alexandria. Another Room.", "id": 1173}, {"t": "sd", "text": "Enter Antony and Eros.", "id": 1174}, {"t": "sp", "who": "ANTONY", "lines": ["Eros, thou yet behold'st me?"], "id": 1175, "m": "Eros, can you still see me?"}, {"t": "sp", "who": "EROS", "lines": ["Ay, noble lord."], "id": 1176, "m": "Yes, noble lord."}, {"t": "sp", "who": "ANTONY", "lines": ["Sometime we see a cloud that's dragonish;", "A vapour sometime like a bear or lion,", "A tower'd citadel, a pendant rock,", "A forked mountain, or blue promontory", "With trees upon't, that nod unto the world,", "And mock our eyes with air: thou hast seen these signs;", "They are black vesper's pageants."], "id": 1177, "m": "Sometimes we see a cloud that looks like a dragon; a mist sometimes like a bear or a lion, a towered castle, an overhanging rock, a jagged mountain, or a blue headland with trees on it, which nod to the world and fool our eyes with air. You've seen these sights; they're the shows of evening."}, {"t": "sp", "who": "EROS", "lines": ["Ay, my lord."], "id": 1178, "m": "Yes, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["That which is now a horse, even with a thought", "The rack dislimns; and makes it indistinct,", "As water is in water."], "id": 1179, "m": "What's a horse one moment, the drifting clouds blot out as fast as a thought, and make it shapeless, like water poured into water."}, {"t": "sp", "who": "EROS", "lines": ["It does, my lord."], "id": 1180, "m": "They do, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["My good knave Eros, now thy captain is", "Even such a body: here I am Antony;", "Yet cannot hold this visible shape, my knave.", "I made these wars for Egypt; and the queen,--", "Whose heart I thought I had, for she had mine;", "Which, whilst it was mine, had annex'd unto't", "A million moe, now lost,--she, Eros, has", "Pack'd cards with Caesar, and false-play'd my glory", "Unto an enemy's triumph.--", "Nay, weep not, gentle Eros; there is left us", "Ourselves to end ourselves.--"], "id": 1181, "m": "My good lad Eros, your captain is just like that kind of shape now. Here I am, Antony, but I can't keep this visible shape, my lad. I fought these wars for Egypt, and the queen, whose heart I thought I had, because she had mine (and while it was mine, a million other hearts were attached to it, now lost), she, Eros, has stacked the cards with Caesar and cheated my glory into my enemy's victory. No, don't cry, gentle Eros. We still have ourselves to end ourselves."}, {"t": "sd", "text": "Enter Mardian.", "id": 1182}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["O, thy vile lady!", "She has robb'd me of my sword."], "id": 1183, "m": "Oh, your wicked lady! She's robbed me of my sword."}, {"t": "sp", "who": "MARDIAN", "lines": ["No, Antony;", "My mistress lov'd thee, and her fortunes mingled", "With thine entirely."], "id": 1184, "m": "No, Antony. My mistress loved you, and her fortunes were completely joined with yours."}, {"t": "sp", "who": "ANTONY", "lines": ["Hence, saucy eunuch; peace!", "She hath betray'd me, and shall die the death."], "id": 1185, "m": "Get out, cheeky eunuch, quiet! She's betrayed me, and she'll die for it."}, {"t": "sp", "who": "MARDIAN", "lines": ["Death of one person can be paid but once,", "And that she has discharg'd: what thou wouldst do", "Is done unto thy hand: the last she spake", "Was 'Antony! most noble Antony!'", "Then in the midst a tearing groan did break", "The name of Antony; it was divided", "Between her heart and lips: she render'd life,", "Thy name so buried in her."], "id": 1186, "m": "A person can only pay the debt of death once, and she's already paid it. What you wanted to do has been done for you. The last thing she said was 'Antony! Most noble Antony!' Then a tearing groan broke the name of Antony in the middle. It was divided between her heart and her lips. She gave up her life with your name buried in her."}, {"t": "sp", "who": "ANTONY", "lines": ["Dead then?"], "id": 1187, "m": "Dead, then?"}, {"t": "sp", "who": "MARDIAN", "lines": ["Dead."], "id": 1188, "m": "Dead."}, {"t": "sp", "who": "ANTONY", "lines": ["Unarm, Eros; the long day's task is done,", "And we must sleep.--That thou depart'st hence safe", "Does pay thy labour richly; go."], "id": 1189, "m": "Take off my armour, Eros. The long day's work is done, and we must sleep. [To Mardian] Leaving here alive pays you well for your trouble. Go."}, {"t": "sd", "text": "Exit Mardian.", "id": 1190}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Off, pluck off;--", "The sevenfold shield of Ajax cannot keep", "The battery from my heart. O, cleave, my sides!", "Heart, once be stronger than thy continent,", "Crack thy frail case!--Apace, Eros, apace.--", "No more a soldier.--Bruised pieces, go;", "You have been nobly borne.--From me awhile.--"], "id": 1191, "m": "Off, pull it off! Not even the seven-layered shield of Ajax could keep this battering away from my heart. Oh, split open, my sides! Heart, for once be stronger than the body that holds you; crack your fragile case! Quickly, Eros, quickly. No longer a soldier. Battered pieces of armour, go; you've been worn with honour. Leave me for a while."}, {"t": "sd", "text": "Exit Eros.", "id": 1192}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["I will o'ertake thee, Cleopatra, and", "Weep for my pardon. So it must be, for now", "All length is torture.--Since the torch is out,", "Lie down, and stray no further:--now all labour", "Mars what it does; yea, very force entangles", "Itself with strength: seal then, and all is done.--", "Eros!--I come, my queen.--Eros!--stay for me:", "Where souls do couch on flowers, we'll hand in hand,", "And with our sprightly port make the ghosts gaze:", "Dido and her Aeneas shall want troops,", "And all the haunt be ours.--Come, Eros, Eros!"], "id": 1193, "m": "I'll catch up with you, Cleopatra, and weep for your forgiveness. It must be this way, because now any delay is torture. Since the torch is out, lie down and wander no further. Now every effort spoils what it does; yes, strength itself gets tangled in its own strength. Seal it, then, and all is done. Eros! I'm coming, my queen. Eros! Wait for me. Where souls lie on flowers in the afterlife, we'll walk hand in hand and make the ghosts stare at our lively bearing. Dido and her Aeneas will lose their admirers, and all the crowds will be ours. Come, Eros, Eros!"}, {"t": "sd", "text": "Re-enter Eros.", "id": 1194}, {"t": "sp", "who": "EROS", "lines": ["What would my lord?"], "id": 1195, "m": "What does my lord want?"}, {"t": "sp", "who": "ANTONY", "lines": ["Since Cleopatra died,", "I have liv'd in such dishonour that the gods", "Detest my baseness. I, that with my sword", "Quarter'd the world, and o'er green Neptune's back", "With ships made cities, condemn myself to lack", "The courage of a woman; less noble mind", "Than she which by her death our Caesar tells", "'I am conqueror of myself.' Thou art sworn, Eros,", "That, when the exigent should come,--which now", "Is come indeed--when I should see behind me", "The inevitable prosecution of", "Disgrace and horror, that, on my command,", "Thou then wouldst kill me: do't; the time is come:", "Thou strik'st not me; 'tis Caesar thou defeat'st.", "Put colour in thy cheek."], "id": 1196, "m": "Since Cleopatra died, I've lived in such dishonour that the gods hate my lowness. I, who carved up the world with my sword and built cities of ships on green Neptune's back, accuse myself of having less courage than a woman, a less noble mind than she has, who by her death tells our Caesar, 'I am my own conqueror.' You swore, Eros, that when the emergency came (and now it really has come), when I saw behind me the unavoidable chase of disgrace and horror, you would kill me when I ordered it. Do it. The time has come. You're not striking me; it's Caesar you're defeating. Put some colour in your cheeks."}, {"t": "sp", "who": "EROS", "lines": ["The gods withhold me!", "Shall I do that which all the Parthian darts,", "Though enemy, lost aim and could not?"], "id": 1197, "m": "The gods prevent me! Shall I do what all the Parthian arrows, enemies though they were, failed to do because they missed?"}, {"t": "sp", "who": "ANTONY", "lines": ["Eros,", "Wouldst thou be window'd in great Rome and see", "Thy master thus with pleach'd arms, bending down", "His corrigible neck, his face subdu'd", "To penetrative shame; whilst the wheel'd seat", "Of fortunate Caesar, drawn before him, branded", "His baseness that ensued?"], "id": 1198, "m": "Eros, would you like to stand at a window in great Rome and see your master like this, with his arms folded, bowing his tamed neck, his face lowered in burning shame, while the chariot of lucky Caesar, driven in front of him, branded the humiliation of the man following behind?"}, {"t": "sp", "who": "EROS", "lines": ["I would not see't."], "id": 1199, "m": "I wouldn't want to see it."}, {"t": "sp", "who": "ANTONY", "lines": ["Come, then; for with a wound I must be cur'd.", "Draw that thy honest sword, which thou hast worn", "Most useful for thy country."], "id": 1200, "m": "Come on, then, because I must be cured by a wound. Draw that honest sword of yours, which you've used so well for your country."}, {"t": "sp", "who": "EROS", "lines": ["O, sir, pardon me!"], "id": 1201, "m": "Oh, sir, forgive me!"}, {"t": "sp", "who": "ANTONY", "lines": ["When I did make thee free, swor'st thou not then", "To do this when I bade thee? Do it at once;", "Or thy precedent services are all", "But accidents unpurpos'd. Draw, and come."], "id": 1202, "m": "When I set you free, didn't you swear then to do this when I told you to? Do it now, or all your past service was just accident without purpose. Draw your sword, and come."}, {"t": "sp", "who": "EROS", "lines": ["Turn from me then that noble countenance,", "Wherein the worship of the whole world lies."], "id": 1203, "m": "Then turn your noble face away from me, which the whole world worships."}, {"t": "sp", "who": "ANTONY", "lines": ["Lo thee!"], "id": 1204, "m": "There you are!"}, {"t": "sd", "text": "Turning from him.", "id": 1205}, {"t": "sp", "who": "EROS", "lines": ["My sword is drawn."], "id": 1206, "m": "My sword is drawn."}, {"t": "sp", "who": "ANTONY", "lines": ["Then let it do at once", "The thing why thou hast drawn it."], "id": 1207, "m": "Then let it do at once what you drew it for."}, {"t": "sp", "who": "EROS", "lines": ["My dear master,", "My captain and my emperor, let me say,", "Before I strike this bloody stroke, farewell."], "id": 1208, "m": "My dear master, my captain and my commander, let me say goodbye before I strike this bloody blow."}, {"t": "sp", "who": "ANTONY", "lines": ["'Tis said, man;--and farewell."], "id": 1209, "m": "It's said, man. And goodbye."}, {"t": "sp", "who": "EROS", "lines": ["Farewell, great chief. Shall I strike now?"], "id": 1210, "m": "Goodbye, great leader. Shall I strike now?"}, {"t": "sp", "who": "ANTONY", "lines": ["Now, Eros."], "id": 1211, "m": "Now, Eros."}, {"t": "sp", "who": "EROS", "lines": ["Why, there then [falls on his sword]!--thus do I escape the", "sorrow", "Of Antony's death.", "[Dies.]"], "id": 1212, "m": "Why, there, then! [He falls on his sword.] That's how I escape the sorrow of Antony's death. [He dies.]"}, {"t": "sp", "who": "ANTONY", "lines": ["Thrice nobler than myself!", "Thou teachest me, O valiant Eros, what", "I should, and thou couldst not. My queen and Eros", "Have, by their brave instruction, got upon me", "A nobleness in record: but I will be", "A bridegroom in my death, and run into't", "As to a lover's bed. Come, then; and, Eros,", "Thy master dies thy scholar: to do thus"], "id": 1213, "m": "Three times nobler than me! You teach me, oh brave Eros, what I should do and you could not. My queen and Eros, by their brave example, have won a nobler place in history than me. But I'll be a bridegroom in my death and run into it as into a lover's bed. Come, then. And, Eros, your master dies as your pupil. To do this"}, {"t": "sd", "text": "Falling on his sword.", "id": 1214}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["I learn'd of thee. How? not dead? not dead?--", "The guard, ho!--O, despatch me!"], "id": 1215, "m": "I learned from you. What? Not dead? Not dead? Guards, hey! Oh, finish me off!"}, {"t": "sd", "text": "Enter Dercetas and a guard.", "id": 1216}, {"t": "sp", "who": "FIRST GUARD", "lines": ["What's the noise?"], "id": 1217, "m": "What's that noise?"}, {"t": "sp", "who": "ANTONY", "lines": ["I have done my work ill, friends: O, make an end", "Of what I have begun."], "id": 1218, "m": "I've done my work badly, friends. Oh, finish what I've started."}, {"t": "sp", "who": "SECOND GUARD", "lines": ["The star is fallen."], "id": 1219, "m": "The star has fallen."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["And time is at his period."], "id": 1220, "m": "And time has come to its end."}, {"t": "sp", "who": "ALL", "lines": ["Alas, and woe!"], "id": 1221, "m": "Alas, and woe!"}, {"t": "sp", "who": "ANTONY", "lines": ["Let him that loves me, strike me dead."], "id": 1222, "m": "Whoever loves me, strike me dead."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["Not I."], "id": 1223, "m": "Not me."}, {"t": "sp", "who": "SECOND GUARD", "lines": ["Nor I."], "id": 1224, "m": "Nor me."}, {"t": "sp", "who": "THIRD GUARD", "lines": ["Nor any one."], "id": 1225, "m": "Nor anyone."}, {"t": "sd", "text": "Exeunt guard.", "id": 1226}, {"t": "sp", "who": "DERCETAS", "lines": ["Thy death and fortunes bid thy followers fly.", "This sword but shown to Caesar, with this tidings,", "Shall enter me with him."], "id": 1227, "m": "Your death and bad fortune tell your followers to run. If I just show this sword to Caesar with this news, he'll take me into his service."}, {"t": "sd", "text": "Enter Diomedes.", "id": 1228}, {"t": "sp", "who": "DIOMEDES", "lines": ["Where's Antony?"], "id": 1229, "m": "Where's Antony?"}, {"t": "sp", "who": "DERCETAS", "lines": ["There, Diomed, there."], "id": 1230, "m": "There, Diomedes, there."}, {"t": "sp", "who": "DIOMEDES", "lines": ["Lives he?", "Wilt thou not answer, man?"], "id": 1231, "m": "Is he alive? Won't you answer, man?"}, {"t": "sd", "text": "Exit Dercetas.", "id": 1232}, {"t": "sp", "who": "ANTONY", "lines": ["Art thou there, Diomed? Draw thy sword and give me", "Sufficing strokes for death."], "id": 1233, "m": "Is that you, Diomedes? Draw your sword and give me enough blows to kill me."}, {"t": "sp", "who": "DIOMEDES", "lines": ["Most absolute lord,", "My mistress Cleopatra sent me to thee."], "id": 1234, "m": "Most absolute lord, my mistress Cleopatra sent me to you."}, {"t": "sp", "who": "ANTONY", "lines": ["When did she send thee?"], "id": 1235, "m": "When did she send you?"}, {"t": "sp", "who": "DIOMEDES", "lines": ["Now, my lord."], "id": 1236, "m": "Just now, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["Where is she?"], "id": 1237, "m": "Where is she?"}, {"t": "sp", "who": "DIOMEDES", "lines": ["Lock'd in her monument. She had a prophesying fear", "Of what hath come to pass: for when she saw,--", "Which never shall be found,--you did suspect", "She had dispos'd with Caesar, and that your rage", "Would not be purg'd, she sent you word she was dead;", "But, fearing since how it might work, hath sent", "Me to proclaim the truth; and I am come,", "I dread, too late."], "id": 1238, "m": "Locked in her monument. She had a prophetic fear of what
