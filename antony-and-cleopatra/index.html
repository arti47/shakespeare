That was in my salad days, when I was green in judgement and cold-blooded, to say what I said then! But come, let's go. Get me ink and paper. He'll have a separate greeting every day, even if I have to empty Egypt of people to send them."}, {"t": "sd", "text": "Exeunt.", "id": 229}, {"t": "scene", "act": 2, "scene": "I", "loc": "Messina. A Room in Pompey's house.", "id": 230}, {"t": "sd", "text": "Enter Pompey, Menecrates, and Menas.", "id": 231}, {"t": "sp", "who": "POMPEY", "lines": ["If the great gods be just, they shall assist", "The deeds of justest men."], "id": 232, "m": "If the great gods are fair, they'll help the actions of the fairest men."}, {"t": "sp", "who": "MENECRATES", "lines": ["Know, worthy Pompey,", "That what they do delay they not deny."], "id": 233, "m": "Remember, worthy Pompey, that what they delay they don't refuse."}, {"t": "sp", "who": "POMPEY", "lines": ["Whiles we are suitors to their throne, decays", "The thing we sue for."], "id": 234, "m": "While we're begging at their throne, the very thing we're asking for is wasting away."}, {"t": "sp", "who": "MENECRATES", "lines": ["We, ignorant of ourselves,", "Beg often our own harms, which the wise powers", "Deny us for our good; so find we profit", "By losing of our prayers."], "id": 235, "m": "We don't know ourselves, so we often pray for things that would harm us, and the wise gods refuse them for our own good. So we benefit from having our prayers turned down."}, {"t": "sp", "who": "POMPEY", "lines": ["I shall do well;", "The people love me, and the sea is mine;", "My powers are crescent, and my auguring hope", "Says it will come to the full. Mark Antony", "In Egypt sits at dinner, and will make", "No wars without doors: Caesar gets money where", "He loses hearts: Lepidus flatters both,", "Of both is flatter'd; but he neither loves", "Nor either cares for him."], "id": 236, "m": "I'll do well. The people love me, and the sea is mine. My power is growing like the new moon, and my hopes predict it will be full. Mark Antony sits at dinner in Egypt and won't fight any wars outside. Caesar raises money but loses people's love. Lepidus flatters both of them and is flattered by both, but he loves neither, and neither cares for him."}, {"t": "sp", "who": "MENAS", "lines": ["Caesar and Lepidus", "Are in the field: a mighty strength they carry."], "id": 237, "m": "Caesar and Lepidus are in the field with a huge army."}, {"t": "sp", "who": "POMPEY", "lines": ["Where have you this? 'tis false."], "id": 238, "m": "Where did you hear that? It's not true."}, {"t": "sp", "who": "MENAS", "lines": ["From Silvius, sir."], "id": 239, "m": "From Silvius, sir."}, {"t": "sp", "who": "POMPEY", "lines": ["He dreams: I know they are in Rome together,", "Looking for Antony. But all the charms of love,", "Salt Cleopatra, soften thy wan'd lip!", "Let witchcraft join with beauty, lust with both!", "Tie up the libertine in a field of feasts,", "Keep his brain fuming; Epicurean cooks", "Sharpen with cloyless sauce his appetite;", "That sleep and feeding may prorogue his honour", "Even till a Lethe'd dullness."], "id": 240, "m": "He's dreaming. I know they're in Rome together, waiting for Antony. Lustful Cleopatra, may all the charms of love sweeten your faded lips! Let witchcraft join with beauty, and lust with both! Keep the pleasure-seeker tied up in a world of feasts and keep his brain fogged with wine. May gourmet cooks sharpen his appetite with sauces that never sicken him, so that sleeping and eating put off his sense of honour until he forgets it completely."}, {"t": "sd", "text": "Enter Varrius.", "id": 241}, {"t": "sp", "who": "POMPEY", "cont": 1, "lines": ["How now, Varrius!"], "id": 242, "m": "What is it, Varrius?"}, {"t": "sp", "who": "VARRIUS", "lines": ["This is most certain that I shall deliver:--", "Mark Antony is every hour in Rome", "Expected: since he went from Egypt 'tis", "A space for further travel."], "id": 243, "m": "What I'm about to tell you is certain: Mark Antony is expected in Rome any hour. He left Egypt long enough ago to have travelled further."}, {"t": "sp", "who": "POMPEY", "lines": ["I could have given less matter", "A better ear.--Menas, I did not think", "This amorous surfeiter would have donn'd his helm", "For such a petty war; his soldiership", "Is twice the other twain: but let us rear", "The higher our opinion, that our stirring", "Can from the lap of Egypt's widow pluck", "The ne'er lust-wearied Antony."], "id": 244, "m": "I'd have been happier to hear less important news. Menas, I didn't think this overfed lover would put on his helmet for such a small war. As a soldier he's worth twice the other two. But it should make us think more highly of ourselves that our rising has torn the never-tired-of-lust Antony from the lap of Egypt's widow."}, {"t": "sp", "who": "MENAS", "lines": ["I cannot hope", "Caesar and Antony shall well greet together:", "His wife that's dead did trespasses to Caesar;", "His brother warr'd upon him; although, I think,", "Not mov'd by Antony."], "id": 245, "m": "I can't believe Caesar and Antony will get on well. Antony's dead wife wronged Caesar, and his brother made war on him, though I don't think Antony urged him to."}, {"t": "sp", "who": "POMPEY", "lines": ["I know not, Menas,", "How lesser enmities may give way to greater.", "Were't not that we stand up against them all,", "'Twere pregnant they should square between themselves;", "For they have entertained cause enough", "To draw their swords: but how the fear of us", "May cement their divisions, and bind up", "The petty difference, we yet not know.", "Be't as our gods will have't! It only stands", "Our lives upon to use our strongest hands.", "Come, Menas."], "id": 246, "m": "I don't know, Menas, how smaller quarrels may give way to bigger ones. If we weren't standing up against all of them, it's likely they'd fight among themselves, because they've got enough reasons to draw their swords. But we don't yet know how far fear of us may patch up their divisions and heal their petty differences. Let it be as the gods want! Our lives depend on using all our strength. Come, Menas."}, {"t": "sd", "text": "Exeunt.", "id": 247}, {"t": "scene", "act": 2, "scene": "II", "loc": "Rome. A Room in the House of Lepidus.", "id": 248}, {"t": "sd", "text": "Enter Enobarbus and Lepidus.", "id": 249}, {"t": "sp", "who": "LEPIDUS", "lines": ["Good Enobarbus, 'tis a worthy deed,", "And shall become you well, to entreat your captain", "To soft and gentle speech."], "id": 250, "m": "Good Enobarbus, it would be a worthy thing, and it would suit you, to ask your captain to speak calmly and gently."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I shall entreat him", "To answer like himself: if Caesar move him,", "Let Antony look over Caesar's head,", "And speak as loud as Mars. By Jupiter,", "Were I the wearer of Antonius' beard,", "I would not shave't to-day."], "id": 251, "m": "I'll ask him to answer like himself. If Caesar provokes him, let Antony look down on Caesar from above and speak as loudly as Mars. By Jupiter, if I had Antony's beard, I wouldn't shave it today."}, {"t": "sp", "who": "LEPIDUS", "lines": ["'Tis not a time", "For private stomaching."], "id": 252, "m": "This isn't the time for personal grudges."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Every time", "Serves for the matter that is then born in't."], "id": 253, "m": "Any time is right for the business that comes up in it."}, {"t": "sp", "who": "LEPIDUS", "lines": ["But small to greater matters must give way."], "id": 254, "m": "But small matters must give way to bigger ones."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Not if the small come first."], "id": 255, "m": "Not if the small ones came first."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Your speech is passion:", "But, pray you, stir no embers up. Here comes", "The noble Antony."], "id": 256, "m": "You're speaking with emotion. But please, don't stir up the embers. Here comes noble Antony."}, {"t": "sd", "text": "Enter Antony and Ventidius.", "id": 257}, {"t": "sp", "who": "ENOBARBUS", "lines": ["And yonder, Caesar."], "id": 258, "m": "And over there, Caesar."}, {"t": "sd", "text": "Enter Caesar, Maecenas, and Agrippa.", "id": 259}, {"t": "sp", "who": "ANTONY", "lines": ["If we compose well here, to Parthia;", "Hark, Ventidius."], "id": 260, "m": "If we reach an agreement here, then on to Parthia. Listen, Ventidius."}, {"t": "sp", "who": "CAESAR", "lines": ["I do not know,", "Maecenas; ask Agrippa."], "id": 261, "m": "I don't know, Maecenas. Ask Agrippa."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Noble friends,", "That which combin'd us was most great, and let not", "A leaner action rend us. What's amiss,", "May it be gently heard: when we debate", "Our trivial difference loud, we do commit", "Murder in healing wounds: then, noble partners,--", "The rather for I earnestly beseech,--", "Touch you the sourest points with sweetest terms,", "Nor curstness grow to the matter."], "id": 262, "m": "Noble friends, what united us was very great, so don't let a smaller matter tear us apart. Whatever is wrong, let it be heard calmly. When we argue loudly over petty differences, we kill the patient while trying to heal the wound. So, noble partners (and all the more because I'm begging you sincerely), deal with the sorest points in the kindest words, and don't let bad temper make things worse."}, {"t": "sp", "who": "ANTONY", "lines": ["'Tis spoken well.", "Were we before our armies, and to fight,", "I should do thus."], "id": 263, "m": "Well said. Even if we stood before our armies about to fight, I'd do the same."}, {"t": "sp", "who": "CAESAR", "lines": ["Welcome to Rome."], "id": 264, "m": "Welcome to Rome."}, {"t": "sp", "who": "ANTONY", "lines": ["Thank you."], "id": 265, "m": "Thank you."}, {"t": "sp", "who": "CAESAR", "lines": ["Sit."], "id": 266, "m": "Sit."}, {"t": "sp", "who": "ANTONY", "lines": ["Sit, sir."], "id": 267, "m": "You sit, sir."}, {"t": "sp", "who": "CAESAR", "lines": ["Nay, then."], "id": 268, "m": "Well, then."}, {"t": "sp", "who": "ANTONY", "lines": ["I learn you take things ill which are not so,", "Or being, concern you not."], "id": 269, "m": "I hear you're offended by things that aren't offensive, or if they are, they don't concern you."}, {"t": "sp", "who": "CAESAR", "lines": ["I must be laugh'd at", "If, or for nothing or a little, I", "Should say myself offended, and with you", "Chiefly i' the world; more laugh'd at that I should", "Once name you derogately, when to sound your name", "It not concern'd me."], "id": 270, "m": "I'd deserve to be laughed at if I said I was offended over nothing or very little, especially with you of all people. And I'd be laughed at even more if I spoke badly of you when it was none of my business to mention you at all."}, {"t": "sp", "who": "ANTONY", "lines": ["My being in Egypt, Caesar,", "What was't to you?"], "id": 271, "m": "What was my being in Egypt to you, Caesar?"}, {"t": "sp", "who": "CAESAR", "lines": ["No more than my residing here at Rome", "Might be to you in Egypt: yet, if you there", "Did practise on my state, your being in Egypt", "Might be my question."], "id": 272, "m": "No more than my living here in Rome was to you in Egypt. But if you were plotting against my position from there, then your being in Egypt might well concern me."}, {"t": "sp", "who": "ANTONY", "lines": ["How intend you practis'd?"], "id": 273, "m": "What do you mean, plotting?"}, {"t": "sp", "who": "CAESAR", "lines": ["You may be pleas'd to catch at mine intent", "By what did here befall me. Your wife and brother", "Made wars upon me; and their contestation", "Was theme for you, you were the word of war."], "id": 274, "m": "You can work out what I mean from what happened to me here. Your wife and brother made war on me, and their fight was in your name; you were their battle cry."}, {"t": "sp", "who": "ANTONY", "lines": ["You do mistake your business; my brother never", "Did urge me in his act: I did inquire it;", "And have my learning from some true reports", "That drew their swords with you. Did he not rather", "Discredit my authority with yours;", "And make the wars alike against my stomach,", "Having alike your cause? Of this my letters", "Before did satisfy you. If you'll patch a quarrel", "As matter whole you have not to make it with,", "It must not be with this."], "id": 275, "m": "You've got it wrong. My brother never used my name in what he did. I looked into it, and I heard from reliable men who fought on your side. Didn't he undermine my authority as much as yours, and make war against my wishes, since your cause was the same as mine? My letters already proved this to you. If you want to patch together a quarrel, and you've no real material to make one from, it can't be with this."}, {"t": "sp", "who": "CAESAR", "lines": ["You praise yourself", "By laying defects of judgment to me; but", "You patch'd up your excuses."], "id": 276, "m": "You praise yourself by blaming my judgement, but you've only patched together excuses."}, {"t": "sp", "who": "ANTONY", "lines": ["Not so, not so;", "I know you could not lack, I am certain on't,", "Very necessity of this thought, that I,", "Your partner in the cause 'gainst which he fought,", "Could not with graceful eyes attend those wars", "Which 'fronted mine own peace. As for my wife,", "I would you had her spirit in such another:", "The third o' the world is yours; which with a snaffle", "You may pace easy, but not such a wife."], "id": 277, "m": "Not so, not so. I'm certain you must have realised that I, your partner in the cause he was fighting against, couldn't look kindly on wars that threatened my own peace. As for my wife, I wish you had a wife with spirit like hers. A third of the world is yours, and you can control it easily with a light bridle, but not a wife like that."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Would we had all such wives, that the men", "Might go to wars with the women."], "id": 278, "m": "I wish we all had wives like that, so the men could go to war with the women."}, {"t": "sp", "who": "ANTONY", "lines": ["So much uncurbable, her garboils, Caesar,", "Made out of her impatience,--which not wanted", "Shrewdness of policy too,--I grieving grant", "Did you too much disquiet: for that you must", "But say I could not help it."], "id": 279, "m": "Her wild troubles, Caesar, came from her impatience, though there was some cunning in it too. I'm sorry to admit they caused you too much trouble. As for that, you'll just have to accept that I couldn't help it."}, {"t": "sp", "who": "CAESAR", "lines": ["I wrote to you", "When rioting in Alexandria; you", "Did pocket up my letters, and with taunts", "Did gibe my missive out of audience."], "id": 280, "m": "I wrote to you while you were partying in Alexandria. You put my letters in your pocket and sent my messenger away with jeers."}, {"t": "sp", "who": "ANTONY", "lines": ["Sir,", "He fell upon me ere admitted: then", "Three kings I had newly feasted, and did want", "Of what I was i' the morning: but next day", "I told him of myself; which was as much", "As to have ask'd him pardon. Let this fellow", "Be nothing of our strife; if we contend,", "Out of our question wipe him."], "id": 281, "m": "Sir, he burst in on me before he was let in. I'd just been feasting three kings and wasn't quite the man I am in the morning. But the next day I told him myself, which was as good as asking his pardon. Let's keep that fellow out of our quarrel. If we argue, let's leave him out of it."}, {"t": "sp", "who": "CAESAR", "lines": ["You have broken", "The article of your oath; which you shall never", "Have tongue to charge me with."], "id": 282, "m": "You've broken a term of your oath, which you'll never be able to accuse me of doing."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Soft, Caesar!"], "id": 283, "m": "Easy, Caesar!"}, {"t": "sp", "who": "ANTONY", "lines": ["No; Lepidus, let him speak.", "The honour is sacred which he talks on now,", "Supposing that I lack'd it.--But on, Caesar;", "The article of my oath."], "id": 284, "m": "No, Lepidus, let him speak. The honour he's talking about is sacred, if he's suggesting I lack it. But go on, Caesar: the term of my oath."}, {"t": "sp", "who": "CAESAR", "lines": ["To lend me arms and aid when I requir'd them;", "The which you both denied."], "id": 285, "m": "To lend me weapons and help when I asked for them. You refused both."}, {"t": "sp", "who": "ANTONY", "lines": ["Neglected, rather;", "And then when poison'd hours had bound me up", "From mine own knowledge. As nearly as I may,", "I'll play the penitent to you: but mine honesty", "Shall not make poor my greatness, nor my power", "Work without it. Truth is, that Fulvia,", "To have me out of Egypt, made wars here;", "For which myself, the ignorant motive, do", "So far ask pardon as befits mine honour", "To stoop in such a case."], "id": 286, "m": "Neglected, rather, and at a time when poisoned hours had made me forget myself. As far as I can, I'll apologise to you. But my honesty won't make my greatness smaller, and my power won't act without honesty. The truth is that Fulvia made war here to get me out of Egypt. Since I was the unknowing cause, I ask pardon as far as my honour allows me to stoop in such a case."}, {"t": "sp", "who": "LEPIDUS", "lines": ["'Tis noble spoken."], "id": 287, "m": "That's nobly spoken."}, {"t": "sp", "who": "MAECENAS", "lines": ["If it might please you to enforce no further", "The griefs between ye: to forget them quite", "Were to remember that the present need", "Speaks to atone you."], "id": 288, "m": "If you'd agree not to press your grievances any further, and forget them completely, you'd be remembering that the present emergency calls on you to make peace."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Worthily spoken, Maecenas."], "id": 289, "m": "Well said, Maecenas."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Or, if you borrow one another's love for the instant, you may,", "when you hear no more words of Pompey, return it again: you shall", "have time to wrangle in when you have nothing else to do."], "id": 290, "m": "Or, if you borrow each other's love for now, you can give it back when you hear no more about Pompey. You'll have time to squabble when you've nothing else to do."}, {"t": "sp", "who": "ANTONY", "lines": ["Thou art a soldier only: speak no more."], "id": 291, "m": "You're only a soldier. Say no more."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["That truth should be silent I had almost forgot."], "id": 292, "m": "I'd almost forgotten that truth should keep quiet."}, {"t": "sp", "who": "ANTONY", "lines": ["You wrong this presence; therefore speak no more."], "id": 293, "m": "You're being disrespectful to this company. So say no more."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Go to, then; your considerate stone!"], "id": 294, "m": "All right, then. I'll be your thoughtful stone."}, {"t": "sp", "who": "CAESAR", "lines": ["I do not much dislike the matter, but", "The manner of his speech; for't cannot be", "We shall remain in friendship, our conditions", "So differing in their acts. Yet if I knew", "What hoop should hold us stanch, from edge to edge", "O' the world, I would pursue it."], "id": 295, "m": "I don't object so much to what he says as to how he says it. We can't stay friends when we behave so differently. Yet if I knew of a hoop that would hold us firmly together, I'd search for it from one end of the world to the other."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Give me leave, Caesar,--"], "id": 296, "m": "Allow me, Caesar..."}, {"t": "sp", "who": "CAESAR", "lines": ["Speak, Agrippa."], "id": 297, "m": "Speak, Agrippa."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Thou hast a sister by the mother's side,", "Admir'd Octavia: great Mark Antony", "Is now a widower."], "id": 298, "m": "You have a sister on your mother's side, the admired Octavia. Great Mark Antony is now a widower."}, {"t": "sp", "who": "CAESAR", "lines": ["Say not so, Agrippa:", "If Cleopatra heard you, your reproof", "Were well deserv'd of rashness."], "id": 299, "m": "Don't say that, Agrippa. If Cleopatra heard you, you'd deserve her rebuke for being so rash."}, {"t": "sp", "who": "ANTONY", "lines": ["I am not married, Caesar: let me hear", "Agrippa further speak."], "id": 300, "m": "I'm not married, Caesar. Let me hear more from Agrippa."}, {"t": "sp", "who": "AGRIPPA", "lines": ["To hold you in perpetual amity,", "To make you brothers, and to knit your hearts", "With an unslipping knot, take Antony", "Octavia to his wife; whose beauty claims", "No worse a husband than the best of men;", "Whose virtue and whose general graces speak", "That which none else can utter. By this marriage", "All little jealousies, which now seem great,", "And all great fears, which now import their dangers,", "Would then be nothing: truths would be tales,", "Where now half tales be truths: her love to both", "Would each to other, and all loves to both,", "Draw after her. Pardon what I have spoke;", "For 'tis a studied, not a present thought,", "By duty ruminated."], "id": 301, "m": "To keep you friends forever, to make you brothers and tie your hearts with a knot that won't slip, let Antony take Octavia as his wife. Her beauty deserves nothing less than the best of men as a husband, and her virtue and graces say more than anyone else could. With this marriage, all the small suspicions that now seem great, and all the great fears that now seem dangerous, would come to nothing. True stories would be dismissed as gossip, where now half-truths are believed. Her love for both of you would draw you to each other, and draw everyone's love to you both. Forgive what I've said. It's a considered idea, not a sudden one, thought over out of duty."}, {"t": "sp", "who": "ANTONY", "lines": ["Will Caesar speak?"], "id": 302, "m": "Will Caesar speak?"}, {"t": "sp", "who": "CAESAR", "lines": ["Not till he hears how Antony is touch'd", "With what is spoke already."], "id": 303, "m": "Not until he hears how Antony feels about what's already been said."}, {"t": "sp", "who": "ANTONY", "lines": ["What power is in Agrippa,", "If I would say 'Agrippa, be it so,'", "To make this good?"], "id": 304, "m": "What power does Agrippa have to make this happen, if I said, 'Agrippa, let it be so'?"}, {"t": "sp", "who": "CAESAR", "lines": ["The power of Caesar, and", "His power unto Octavia."], "id": 305, "m": "Caesar's power, and his power over Octavia."}, {"t": "sp", "who": "ANTONY", "lines": ["May I never", "To this good purpose, that so fairly shows,", "Dream of impediment!--Let me have thy hand:", "Further this act of grace; and from this hour", "The heart of brothers govern in our loves", "And sway our great designs!"], "id": 306, "m": "May I never dream of any obstacle to this good plan, which looks so promising! Give me your hand. Help this gracious deal along, and from this hour may brotherly hearts rule our love and guide our great plans!"}, {"t": "sp", "who": "CAESAR", "lines": ["There is my hand.", "A sister I bequeath you, whom no brother", "Did ever love so dearly: let her live", "To join our kingdoms and our hearts; and never", "Fly off our loves again!"], "id": 307, "m": "There's my hand. I give you a sister, loved more dearly than any brother ever loved a sister. Let her live to join our kingdoms and our hearts, and may our friendship never fall apart again!"}, {"t": "sp", "who": "LEPIDUS", "lines": ["Happily, amen!"], "id": 308, "m": "Happily, amen!"}, {"t": "sp", "who": "ANTONY", "lines": ["I did not think to draw my sword 'gainst Pompey;", "For he hath laid strange courtesies and great", "Of late upon me. I must thank him only,", "Lest my remembrance suffer ill report;", "At heel of that, defy him."], "id": 309, "m": "I didn't expect to draw my sword against Pompey, because he's recently done me great and unusual kindnesses. I must thank him first, so that I'm not called ungrateful. Right after that, I'll challenge him."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Time calls upon's:", "Of us must Pompey presently be sought,", "Or else he seeks out us."], "id": 310, "m": "Time is pressing us. We must go after Pompey immediately, or he'll come after us."}, {"t": "sp", "who": "ANTONY", "lines": ["Where lies he?"], "id": 311, "m": "Where is he?"}, {"t": "sp", "who": "CAESAR", "lines": ["About the Mount Misenum."], "id": 312, "m": "Near Mount Misenum."}, {"t": "sp", "who": "ANTONY", "lines": ["What is his strength", "By land?"], "id": 313, "m": "How strong is he on land?"}, {"t": "sp", "who": "CAESAR", "lines": ["Great and increasing; but by sea", "He is an absolute master."], "id": 314, "m": "Strong and growing. But at sea he's in complete control."}, {"t": "sp", "who": "ANTONY", "lines": ["So is the fame.", "Would we had spoke together! Haste we for it:", "Yet, ere we put ourselves in arms, despatch we", "The business we have talk'd of."], "id": 315, "m": "So they say. I wish we'd talked earlier! Let's hurry. But before we arm ourselves, let's settle the business we've discussed."}, {"t": "sp", "who": "CAESAR", "lines": ["With most gladness;", "And do invite you to my sister's view,", "Whither straight I'll lead you."], "id": 316, "m": "Very gladly. And I invite you to meet my sister. I'll take you to her right away."}, {"t": "sp", "who": "ANTONY", "lines": ["Let us, Lepidus,", "Not lack your company."], "id": 317, "m": "Lepidus, don't deny us your company."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Noble Antony,", "Not sickness should detain me."], "id": 318, "m": "Noble Antony, not even sickness would keep me away."}, {"t": "sd", "text": "Flourish. Exeunt Caesar, Antony, and Lepidus.", "id": 319}, {"t": "sp", "who": "MAECENAS", "lines": ["Welcome from Egypt, sir."], "id": 320, "m": "Welcome back from Egypt, sir."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Half the heart of Caesar, worthy Maecenas!--my honourable friend,", "Agrippa!--"], "id": 321, "m": "Half of Caesar's heart, worthy Maecenas! My honourable friend, Agrippa!"}, {"t": "sp", "who": "AGRIPPA", "lines": ["Good Enobarbus!"], "id": 322, "m": "Good Enobarbus!"}, {"t": "sp", "who": "MAECENAS", "lines": ["We have cause to be glad that matters are so well digested. You", "stay'd well by it in Egypt."], "id": 323, "m": "We have reason to be glad that things have been so well settled. You had a good time of it in Egypt."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Ay, sir; we did sleep day out of countenance, and made the night", "light with drinking."], "id": 324, "m": "Yes, sir. We slept all day till the daylight was embarrassed, and lit up the night with drinking."}, {"t": "sp", "who": "MAECENAS", "lines": ["Eight wild boars roasted whole at a breakfast, and but twelve", "persons there. Is this true?"], "id": 325, "m": "Eight wild boars roasted whole for breakfast, and only twelve people there. Is that true?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["This was but as a fly by an eagle: we had much more monstrous", "matter of feast, which worthily deserved noting."], "id": 326, "m": "That was like a fly next to an eagle. We had far more amazing feasts, really worth talking about."}, {"t": "sp", "who": "MAECENAS", "lines": ["She's a most triumphant lady, if report be square to her."], "id": 327, "m": "She's a magnificent lady, if the stories about her are accurate."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["When she first met Mark Antony she pursed up his heart, upon the", "river of Cydnus."], "id": 328, "m": "When she first met Mark Antony, on the river Cydnus, she put his heart in her purse."}, {"t": "sp", "who": "AGRIPPA", "lines": ["There she appeared indeed; or my reporter devised well for her."], "id": 329, "m": "That's where she really showed herself, or else whoever told me made it up nicely for her."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I will tell you.", "The barge she sat in, like a burnish'd throne,", "Burn'd on the water: the poop was beaten gold;", "Purple the sails, and so perfumed that", "The winds were love-sick with them; the oars were silver,", "Which to the tune of flutes kept stroke, and made", "The water which they beat to follow faster,", "As amorous of their strokes. For her own person,", "It beggar'd all description: she did lie", "In her pavilion,--cloth-of-gold of tissue,--", "O'er-picturing that Venus where we see", "The fancy out-work nature: on each side her", "Stood pretty dimpled boys, like smiling Cupids,", "With divers-colour'd fans, whose wind did seem", "To glow the delicate cheeks which they did cool,", "And what they undid did."], "id": 330, "m": "I'll tell you. The barge she sat in shone like a polished throne and seemed to burn on the water. The stern was beaten gold. The sails were purple and so perfumed that the winds were lovesick for them. The oars were silver and kept time to the music of flutes, making the water they struck follow faster, as if it were in love with their strokes. As for her, she was beyond all description. She lay in her tent, made of gold cloth, looking more beautiful than a painting of Venus in which imagination outdoes nature. On each side of her stood pretty, dimpled boys, like smiling Cupids, with many-coloured fans whose breeze seemed to make her delicate cheeks glow even as it cooled them, undoing what it did."}, {"t": "sp", "who": "AGRIPPA", "lines": ["O, rare for Antony!"], "id": 331, "m": "Oh, what a sight for Antony!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Her gentlewomen, like the Nereids,", "So many mermaids, tended her i' the eyes,", "And made their bends adornings: at the helm", "A seeming mermaid steers: the silken tackle", "Swell with the touches of those flower-soft hands", "That yarely frame the office. From the barge", "A strange invisible perfume hits the sense", "Of the adjacent wharfs. The city cast", "Her people out upon her; and Antony,", "Enthron'd i' the market-place, did sit alone,", "Whistling to the air; which, but for vacancy,", "Had gone to gaze on Cleopatra too,", "And made a gap in nature."], "id": 332, "m": "Her ladies, like sea nymphs, like so many mermaids, waited on her every look, and made their bows look graceful. A woman like a mermaid steered at the helm. The silk ropes swelled at the touch of those flower-soft hands that handled them so skilfully. A strange, invisible perfume drifted from the barge and filled the senses of everyone on the nearby wharves. The whole city poured out its people to see her, and Antony, sitting on a throne in the market-place, was left alone, whistling to the air. The air itself would have gone to gaze at Cleopatra too, except that would have left an empty space in nature."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Rare Egyptian!"], "id": 333, "m": "Amazing Egyptian!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Upon her landing, Antony sent to her,", "Invited her to supper: she replied", "It should be better he became her guest;", "Which she entreated: our courteous Antony,", "Whom ne'er the word of 'No' woman heard speak,", "Being barber'd ten times o'er, goes to the feast,", "And, for his ordinary, pays his heart", "For what his eyes eat only."], "id": 334, "m": "When she landed, Antony sent to her and invited her to supper. She replied that it would be better if he became her guest, and she begged him to. Our polite Antony, who's never said 'No' to a woman, had himself shaved ten times over and went to the feast. And for his meal he paid with his heart, for what only his eyes ate."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Royal wench!", "She made great Caesar lay his sword to bed:", "He ploughed her, and she cropp'd."], "id": 335, "m": "Royal hussy! She made great Julius Caesar put his sword to bed. He ploughed her, and she bore his child."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I saw her once", "Hop forty paces through the public street;", "And, having lost her breath, she spoke and panted,", "That she did make defect perfection,", "And, breathless, power breathe forth."], "id": 336, "m": "I saw her once hop forty paces through the public street. She ran out of breath, and spoke and panted so charmingly that she made a fault seem perfect, and, breathless, breathed out power."}, {"t": "sp", "who": "MAECENAS", "lines": ["Now Antony must leave her utterly."], "id": 337, "m": "Now Antony will have to leave her completely."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Never; he will not:", "Age cannot wither her, nor custom stale", "Her infinite variety: other women cloy", "The appetites they feed; but she makes hungry", "Where most she satisfies: for vilest things", "Become themselves in her; that the holy priests", "Bless her when she is riggish."], "id": 338, "m": "Never. He won't. Age can't wither her, and familiarity can't make her endless variety go stale. Other women satisfy the appetites they feed until you're sick of them, but she makes you hungry the more she satisfies you. Even the most shameful things become attractive in her, so that the holy priests bless her when she's being lustful."}, {"t": "sp", "who": "MAECENAS", "lines": ["If beauty, wisdom, modesty, can settle", "The heart of Antony, Octavia is", "A blessed lottery to him."], "id": 339, "m": "If beauty, wisdom and modesty can settle Antony's heart, Octavia is a blessed prize for him."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Let us go.--", "Good Enobarbus, make yourself my guest", "Whilst you abide here."], "id": 340, "m": "Let's go. Good Enobarbus, be my guest while you're staying here."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Humbly, sir, I thank you."], "id": 341, "m": "Thank you humbly, sir."}, {"t": "sd", "text": "Exeunt.", "id": 342}, {"t": "scene", "act": 2, "scene": "III", "loc": "Rome. A Room in Caesar's House.", "id": 343}, {"t": "sd", "text": "Enter Caesar, Antony, Octavia between them, and Attendants.", "id": 344}, {"t": "sp", "who": "ANTONY", "lines": ["The world and my great office will sometimes", "Divide me from your bosom."], "id": 345, "m": "The world and my great duties will sometimes take me away from your arms."}, {"t": "sp", "who": "OCTAVIA", "lines": ["All which time", "Before the gods my knee shall bow my prayers", "To them for you."], "id": 346, "m": "All that time, I'll kneel before the gods and pray to them for you."}, {"t": "sp", "who": "ANTONY", "lines": ["Good night, sir.--My Octavia,", "Read not my blemishes in the world's report:", "I have not kept my square; but that to come", "Shall all be done by the rule. Good night, dear lady.--"], "id": 347, "m": "Good night, sir. My Octavia, don't judge me by what the world says about my faults. I haven't always kept to the rules, but from now on everything will be done properly. Good night, dear lady."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Good night, sir."], "id": 348, "m": "Good night, sir."}, {"t": "sp", "who": "CAESAR", "lines": ["Good night."], "id": 349, "m": "Good night."}, {"t": "sd", "text": "Exeunt Caesar and Octavia.", "id": 350}, {"t": "sd", "text": "Enter Soothsayer.", "id": 351}, {"t": "sp", "who": "ANTONY", "lines": ["Now, sirrah, you do wish yourself in Egypt?"], "id": 352, "m": "Now, fellow, do you wish you were in Egypt?"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["Would I had never come from thence, nor you", "Thither!"], "id": 353, "m": "I wish I'd never come from there, and that you'd never gone there!"}, {"t": "sp", "who": "ANTONY", "lines": ["If you can, your reason."], "id": 354, "m": "Tell me why, if you can."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["I see it in my motion, have it not in my tongue; but yet", "Hie you to Egypt again."], "id": 355, "m": "I feel it in my mind but can't put it into words. But hurry back to Egypt."}, {"t": "sp", "who": "ANTONY", "lines": ["Say to me,", "Whose fortunes shall rise higher, Caesar's or mine?"], "id": 356, "m": "Tell me, whose fortunes will rise higher, Caesar's or mine?"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["Caesar's.", "Therefore, O Antony, stay not by his side:", "Thy demon, that thy spirit which keeps thee, is", "Noble, courageous, high, unmatchable,", "Where Caesar's is not; but near him thy angel", "Becomes a fear, as being o'erpower'd: therefore", "Make space enough between you."], "id": 357, "m": "Caesar's. So, oh Antony, don't stay near him. Your guardian spirit, which protects you, is noble, brave, lofty and unmatched where Caesar's isn't. But near him your angel becomes fearful, as if overpowered. So keep plenty of distance between you."}, {"t": "sp", "who": "ANTONY", "lines": ["Speak this no more."], "id": 358, "m": "Don't say this again."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["To none but thee; no more but when to thee.", "If thou dost play with him at any game,", "Thou art sure to lose; and of that natural luck", "He beats thee 'gainst the odds: thy lustre thickens", "When he shines by: I say again, thy spirit", "Is all afraid to govern thee near him;", "But, he away, 'tis noble."], "id": 359, "m": "To nobody but you, and only to you. If you play any game with him, you're sure to lose. His natural luck beats you against the odds. Your brightness dims when he shines nearby. I say again: your spirit is afraid to guide you near him, but when he's away, it's noble."}, {"t": "sp", "who": "ANTONY", "lines": ["Get thee gone:", "Say to Ventidius I would speak with him:--"], "id": 360, "m": "Go away. Tell Ventidius I want to speak to him."}, {"t": "sd", "text": "Exit Soothsayer.", "id": 361}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["He shall to Parthia.--Be it art or hap,", "He hath spoken true: the very dice obey him;--", "And in our sports my better cunning faints", "Under his chance: if we draw lots, he speeds;", "His cocks do win the battle still of mine,", "When it is all to nought; and his quails ever", "Beat mine, inhoop'd, at odds. I will to Egypt:", "And though I make this marriage for my peace,", "I' the East my pleasure lies."], "id": 362, "m": "He'll go to Parthia. Whether by skill or luck, the fortune-teller's right. Even the dice obey Caesar, and in our games my greater skill gives way to his luck. If we draw lots, he wins. His fighting cocks always beat mine, even when the odds are all against him, and his quails always beat mine in the ring. I'll go to Egypt. Though I'm making this marriage for peace, my pleasure lies in the East."}, {"t": "sd", "text": "Enter Ventidius.", "id": 363}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["O, come, Ventidius,", "You must to Parthia: your commission's ready;", "Follow me and receive it."], "id": 364, "m": "Oh, come, Ventidius. You must go to Parthia. Your orders are ready. Follow me and collect them."}, {"t": "sd", "text": "Exeunt.", "id": 365}, {"t": "scene", "act": 2, "scene": "IV", "loc": "Rome. A street.", "id": 366}, {"t": "sd", "text": "Enter Lepidus, Maecenas, and Agrippa.", "id": 367}, {"t": "sp", "who": "LEPIDUS", "lines": ["Trouble yourselves no further: pray you, hasten", "Your generals after."], "id": 368, "m": "Don't trouble yourselves any further. Please, hurry after your generals."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Sir, Mark Antony", "Will e'en but kiss Octavia, and we'll follow."], "id": 369, "m": "Sir, Mark Antony will just kiss Octavia goodbye, and then we'll follow."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Till I shall see you in your soldier's dress,", "Which will become you both, farewell."], "id": 370, "m": "Until I see you in your soldiers' uniforms, which will suit you both, goodbye."}, {"t": "sp", "who": "MAECENAS", "lines": ["We shall,", "As I conceive the journey, be at the mount", "Before you, Lepidus."], "id": 371, "m": "As I understand the journey, we'll be at the mountain before you, Lepidus."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Your way is shorter;", "My purposes do draw me much about.", "You'll win two days upon me."], "id": 372, "m": "Your route is shorter. My plans take me a long way round. You'll get there two days before me."}, {"t": "sp", "who": "BOTH", "lines": ["Sir, good success!"], "id": 373, "m": "Sir, good luck!"}, {"t": "sp", "who": "LEPIDUS", "lines": ["Farewell."], "id": 374, "m": "Goodbye."}, {"t": "sd", "text": "Exeunt.", "id": 375}, {"t": "scene", "act": 2, "scene": "V", "loc": "Alexandria. A Room in the Palace.", "id": 376}, {"t": "sd", "text": "Enter Cleopatra, Charmian, Iras, Alexas, and Attendants.", "id": 377}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Give me some music,--music, moody food", "Of us that trade in love."], "id": 378, "m": "Give me some music. Music is the sad food of us who deal in love."}, {"t": "sp", "who": "ALL", "lines": ["The music, ho!"], "id": 379, "m": "The music, here!"}, {"t": "sd", "text": "Enter Mardian.", "id": 380}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Let it alone; let's to billiards:", "Come, Charmian."], "id": 381, "m": "Forget it. Let's play billiards. Come, Charmian."}, {"t": "sp", "who": "CHARMIAN", "lines": ["My arm is sore; best play with Mardian."], "id": 382, "m": "My arm's sore. Better play with Mardian."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["As well a woman with an eunuch play'd", "As with a woman.--Come, you'll play with me, sir?"], "id": 383, "m": "A woman might as well play with a eunuch as with a woman. Come, will you play with me, sir?"}, {"t": "sp", "who": "MARDIAN", "lines": ["As well as I can, madam."], "id": 384, "m": "As well as I can, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["And when good will is show'd, though't come too short,", "The actor may plead pardon. I'll none now:--", "Give me mine angle,--we'll to the river. There,", "My music playing far off, I will betray", "Tawny-finn'd fishes; my bended hook shall pierce", "Their slimy jaws; and as I draw them up", "I'll think them every one an Antony,", "And say 'Ah ha! You're caught.'"], "id": 385, "m": "And when someone shows good will, even if he falls short, the player can be forgiven. I won't play now. Give me my fishing rod. We'll go to the river. There, with my music playing in the distance, I'll trick the golden-finned fish. My curved hook will pierce their slimy jaws, and as I pull them up I'll imagine every one is an Antony, and say, 'Aha! You're caught.'"}, {"t": "sp", "who": "CHARMIAN", "lines": ["'Twas merry when", "You wager'd on your angling; when your diver", "Did hang a salt fish on his hook, which he", "With fervency drew up."], "id": 386, "m": "It was funny when you made a bet on your fishing and your diver hung a salted fish on his hook, which he pulled up so eagerly."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That time?--O times!--", "I laughed him out of patience; and that night", "I laugh'd him into patience: and next morn,", "Ere the ninth hour, I drunk him to his bed;", "Then put my tires and mantles on him, whilst", "I wore his sword Philippan."], "id": 387, "m": "That time? Oh, those times! I laughed him out of his patience, and that night I laughed him back into it. And the next morning, before nine o'clock, I drank him under the table, then dressed him in my headdresses and cloaks while I wore his sword from Philippi."}, {"t": "sd", "text": "Enter a Messenger.", "id": 388}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["O! from Italy!--", "Ram thou thy fruitful tidings in mine ears,", "That long time have been barren."], "id": 389, "m": "Oh! From Italy! Cram your rich news into my ears, which have been empty for so long."}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam, madam,--"], "id": 390, "m": "Madam, madam..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Antony's dead!--", "If thou say so, villain, thou kill'st thy mistress;", "But well and free,", "If thou so yield him, there is gold, and here", "My bluest veins to kiss,--a hand that kings", "Have lipp'd, and trembled kissing."], "id": 391, "m": "Antony's dead! If you say so, villain, you'll kill your mistress. But if you tell me he's well and free, here's gold, and here are my bluest veins for you to kiss, a hand that kings have kissed and trembled as they kissed it."}, {"t": "sp", "who": "MESSENGER", "lines": ["First, madam, he's well."], "id": 392, "m": "First, madam, he's well."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Why, there's more gold.", "But, sirrah, mark, we use", "To say the dead are well: bring it to that,", "The gold I give thee will I melt and pour", "Down thy ill-uttering throat."], "id": 393, "m": "Why, there's more gold. But, fellow, listen: we often say the dead are 'well'. If that's what you mean, I'll melt the gold I gave you and pour it down your evil-speaking throat."}, {"t": "sp", "who": "MESSENGER", "lines": ["Good madam, hear me."], "id": 394, "m": "Good madam, listen to me."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Well, go to, I will;", "But there's no goodness in thy face: if Antony", "Be free and healthful,--why so tart a favour", "To trumpet such good tidings! If not well,", "Thou shouldst come like a fury crown'd with snakes,", "Not like a formal man."], "id": 395, "m": "Well, go on, I will. But there's nothing good in your face. If Antony is free and healthy, why such a sour look to announce such good news? If he isn't well, you should come like a Fury crowned with snakes, not looking like a normal man."}, {"t": "sp", "who": "MESSENGER", "lines": ["Will't please you hear me?"], "id": 396, "m": "Will you please listen to me?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I have a mind to strike thee ere thou speak'st:", "Yet, if thou say Antony lives, is well,", "Or friends with Caesar, or not captive to him,", "I'll set thee in a shower of gold, and hail", "Rich pearls upon thee."], "id": 397, "m": "I feel like hitting you before you speak. Yet if you say Antony's alive and well, or friends with Caesar, or not his prisoner, I'll shower you with gold and rain rich pearls on you."}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam, he's well."], "id": 398, "m": "Madam, he's well."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Well said."], "id": 399, "m": "Good."}, {"t": "sp", "who": "MESSENGER", "lines": ["And friends with Caesar."], "id": 400, "m": "And friends with Caesar."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Th'art an honest man."], "id": 401, "m": "You're an honest man."}, {"t": "sp", "who": "MESSENGER", "lines": ["Caesar and he are greater friends than ever."], "id": 402, "m": "Caesar and he are greater friends than ever."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Make thee a fortune from me."], "id": 403, "m": "I'll make your fortune."}, {"t": "sp", "who": "MESSENGER", "lines": ["But yet, madam,--"], "id": 404, "m": "But yet, madam..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I do not like 'but yet', it does allay", "The good precedence; fie upon 'but yet'!", "'But yet' is as a gaoler to bring forth", "Some monstrous malefactor. Pr'ythee, friend,", "Pour out the pack of matter to mine ear,", "The good and bad together: he's friends with Caesar;", "In state of health, thou say'st; and, thou say'st, free."], "id": 405, "m": "I don't like 'but yet'. It spoils the good news that came before it. Curse 'but yet'! 'But yet' is like a jailer bringing out some monstrous criminal. Please, friend, empty the whole bag of news into my ear, good and bad together. He's friends with Caesar, he's healthy, you say, and, you say, free."}, {"t": "sp", "who": "MESSENGER", "lines": ["Free, madam! no; I made no such report:", "He's bound unto Octavia."], "id": 406, "m": "Free, madam? No. I never said that. He's bound to Octavia."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["For what good turn?"], "id": 407, "m": "Bound to do her what favour?"}, {"t": "sp", "who": "MESSENGER", "lines": ["For the best turn i' the bed."], "id": 408, "m": "The best favour, in bed."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I am pale, Charmian."], "id": 409, "m": "I'm going pale, Charmian."}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam, he's married to Octavia."], "id": 410, "m": "Madam, he's married to Octavia."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["The most infectious pestilence upon thee!", "[Strikes him down.]"], "id": 411, "m": "May the most infectious plague strike you! [She knocks him down.]"}, {"t": "sp", "who": "MESSENGER", "lines": ["Good madam, patience."], "id": 412, "m": "Good madam, be patient."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What say you?--Hence,", "[Strikes him again.]", "Horrible villain! or I'll spurn thine eyes", "Like balls before me; I'll unhair thy head:"], "id": 413, "m": "What did you say? [She hits him again.] Get out, horrible villain, or I'll kick your eyes in front of me like balls! I'll pull out your hair!"}, {"t": "sd", "text": "She hales him up and down.", "id": 414}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Thou shalt be whipp'd with wire and stew'd in brine,", "Smarting in ling'ring pickle."], "id": 415, "m": "You'll be whipped with wire, and soaked in salt water, stinging in the slow-burning pickle!"}, {"t": "sp", "who": "MESSENGER", "lines": ["Gracious madam,", "I that do bring the news made not the match."], "id": 416, "m": "Gracious madam, I only bring the news. I didn't arrange the marriage."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Say 'tis not so, a province I will give thee,", "And make thy fortunes proud: the blow thou hadst", "Shall make thy peace for moving me to rage;", "And I will boot thee with what gift beside", "Thy modesty can beg."], "id": 417, "m": "Say it isn't so, and I'll give you a province and make you rich. The blow you had will make up for making me angry, and I'll give you any other gift you're modest enough to ask for."}, {"t": "sp", "who": "MESSENGER", "lines": ["He's married, madam."], "id": 418, "m": "He's married, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Rogue, thou hast liv'd too long.", "[Draws a dagger.]"], "id": 419, "m": "Rogue, you've lived too long. [She draws a dagger.]"}, {"t": "sp", "who": "MESSENGER", "lines": ["Nay, then I'll run.--", "What mean you, madam? I have made no fault."], "id": 420, "m": "No, then I'll run. What do you mean, madam? I've done nothing wrong."}, {"t": "sd", "text": "Exit.", "id": 421}, {"t": "sp", "who": "CHARMIAN", "lines": ["Good madam, keep yourself within yourself:", "The man is innocent."], "id": 422, "m": "Good madam, control yourself. The man is innocent."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Some innocents scape not the thunderbolt.--", "Melt Egypt into Nile! and kindly creatures", "Turn all to serpents!--Call the slave again:--", "Though I am mad, I will not bite him:--call!"], "id": 423, "m": "Some innocent people don't escape the lightning. Let Egypt melt into the Nile, and let all gentle creatures turn into snakes! Call the slave back. Even though I'm mad, I won't bite him. Call him!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["He is afear'd to come."], "id": 424, "m": "He's afraid to come."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I will not hurt him."], "id": 425, "m": "I won't hurt him."}, {"t": "sd", "text": "Exit Charmian.", "id": 426}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["These hands do lack nobility, that they strike", "A meaner than myself; since I myself", "Have given myself the cause."], "id": 427, "m": "These hands lack nobility, hitting someone lower than me, when I brought this on myself."}, {"t": "sd", "text": "Re-enter Charmian and Messenger.", "id": 428}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Come hither, sir.", "Though it be honest, it is never good", "To bring bad news: give to a gracious message", "An host of tongues; but let ill tidings tell", "Themselves when they be felt."], "id": 429, "m": "Come here, sir. Even when it's honest, it's never good to bring bad news. Give good news a whole crowd of tongues, but let bad news announce itself when it's felt."}, {"t": "sp", "who": "MESSENGER", "lines": ["I have done my duty."], "id": 430, "m": "I've done my duty."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Is he married?", "I cannot hate thee worser than I do", "If thou again say 'Yes.'"], "id": 431, "m": "Is he married? I can't hate you more than I already do if you say 'Yes' again."}, {"t": "sp", "who": "MESSENGER", "lines": ["He's married, madam."], "id": 432, "m": "He's married, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["The gods confound thee! dost thou hold there still!"], "id": 433, "m": "May the gods destroy you! Do you still stick to that?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Should I lie, madam?"], "id": 434, "m": "Should I lie, madam?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, I would thou didst,", "So half my Egypt were submerg'd, and made", "A cistern for scal'd snakes! Go, get thee hence:", "Hadst thou Narcissus in thy face, to me", "Thou wouldst appear most ugly. He is married?"], "id": 435, "m": "Oh, I wish you would, even if half my Egypt were flooded and made a tank for scaly snakes! Go, get out of here. Even if you had the face of Narcissus, you'd look ugly to me. He's married?"}, {"t": "sp", "who": "MESSENGER", "lines": ["I crave your highness' pardon."], "id": 436, "m": "I beg your highness's pardon."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He is married?"], "id": 437, "m": "He's married?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Take no offence that I would not offend you:", "To punish me for what you make me do", "Seems much unequal: he's married to Octavia."], "id": 438, "m": "Don't be offended that I don't want to offend you. To punish me for what you make me do seems very unfair. He's married to Octavia."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, that his fault should make a knave of thee", "That art not what tho'rt sure of!--Get thee hence:", "The merchandise which thou hast brought from Rome", "Are all too dear for me: lie they upon thy hand,", "And be undone by 'em!"], "id": 439, "m": "Oh, that his crime should make a villain of you, when you're not guilty of the news you're so sure of! Get out of here. The goods you've brought from Rome are too expensive for me. Keep them, and may they ruin you!"}, {"t": "sd", "text": "Exit Messenger.", "id": 440}, {"t": "sp", "who": "CHARMIAN", "lines": ["Good your highness, patience."], "id": 441, "m": "Your highness, be patient."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["In praising Antony I have disprais'd Caesar."], "id": 442, "m": "In praising Antony, I've criticised Julius Caesar."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Many times, madam."], "id": 443, "m": "Many times, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I am paid for't now.", "Lead me from hence;", "I faint:--O Iras, Charmian!--'tis no matter.--", "Go to the fellow, good Alexas; bid him", "Report the feature of Octavia, her years,", "Her inclination; let him not leave out", "The colour of her hair:--bring me word quickly."], "id": 444, "m": "Now I'm paying for it. Lead me away. I'm going to faint. Oh, Iras, Charmian! It doesn't matter. Go to the man, good Alexas. Ask him to describe Octavia's looks, her age, her personality. Don't let him leave out the colour of her hair. Bring me word quickly."}, {"t": "sd", "text": "Exit Alexas.", "id": 445}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Let him for ever go:--let him not, Charmian--", "Though he be painted one way like a Gorgon,", "T'other way he's a Mars.--[To Mardian] Bid you Alexas", "Bring me word how tall she is.--Pity me, Charmian,", "But do not speak to me.--Lead me to my chamber."], "id": 446, "m": "Let him go for ever. No, don't, Charmian. Though he looks like a Gorgon from one side, from the other he's a Mars. [To Mardian] Tell Alexas to find out how tall she is. Pity me, Charmian, but don't speak to me. Take me to my room."}, {"t": "sd", "text": "Exeunt.", "id": 447}, {"t": "scene", "act": 2, "scene": "VI", "loc": "Near Misenum.", "id": 448}, {"t": "sd", "text": "Flourish. Enter Pompey and Menas at one side, with drum and trumpet; at  the other, Caesar, Antony, Lepidus, Enobarbus, Maecenas, with Soldiers marching.", "id": 449}, {"t": "sp", "who": "POMPEY", "lines": ["Your hostages I have, so have you mine;", "And we shall talk before we fight."], "id": 450, "m": "I have your hostages, and you have mine. Let's talk before we fight."}, {"t": "sp", "who": "CAESAR", "lines": ["Most meet", "That first we come to words; and therefore have we", "Our written purposes before us sent;", "Which, if thou hast consider'd, let us know", "If 'twill tie up thy discontented sword,", "And carry back to Sicily much tall youth", "That else must perish here."], "id": 451, "m": "It's right that we talk first, and so we've sent you our proposals in writing. If you've considered them, tell us whether they'll put away your discontented sword and take many fine young men back to Sicily who would otherwise die here."}, {"t": "sp", "who": "POMPEY", "lines": ["To you all three,", "The senators alone of this great world,", "Chief factors for the gods,--I do not know", "Wherefore my father should revengers want,", "Having a son and friends; since Julius Caesar,", "Who at Philippi the good Brutus ghosted,", "There saw you labouring for him. What was't", "That mov'd pale Cassius to conspire; and what", "Made the all-honour'd, honest Roman, Brutus,", "With the arm'd rest, courtiers of beauteous freedom,", "To drench the Capitol, but that they would", "Have one man but a man? And that is it", "Hath made me rig my navy; at whose burden", "The anger'd ocean foams; with which I meant", "To scourge the ingratitude that despiteful Rome", "Cast on my noble father."], "id": 452, "m": "To all three of you, the only rulers of this great world, the gods' chief agents: I don't see why my father should lack avengers, since he has a son and friends, when Julius Caesar, whose ghost appeared to good Brutus at Philippi, saw you fighting for him there. What made pale Cassius plot? And what made the honoured, honest Roman Brutus, with the other armed lovers of sweet freedom, soak the Capitol in blood, except that they wanted a man to be only a man, not a king? That's why I've rigged up my navy, whose weight makes the angry ocean foam. With it I meant to punish the ingratitude that spiteful Rome showed to my noble father."}, {"t": "sp", "who": "CAESAR", "lines": ["Take your time."], "id": 453, "m": "Take your time."}, {"t": "sp", "who": "ANTONY", "lines": ["Thou canst not fear us, Pompey, with thy sails;", "We'll speak with thee at sea: at land thou know'st", "How much we do o'er-count thee."], "id": 454, "m": "You can't frighten us with your ships, Pompey. We'll meet you at sea. On land, you know how much we outnumber you."}, {"t": "sp", "who": "POMPEY", "lines": ["At land, indeed,", "Thou dost o'er-count me of my father's house:", "But, since the cuckoo builds not for himself,", "Remain in't as thou mayst."], "id": 455, "m": "On land, it's true, you've outdone me by taking my father's house. But since the cuckoo doesn't build its own nest, stay in it while you can."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Be pleas'd to tell us,--", "For this is from the present,--how you take", "The offers we have sent you."], "id": 456, "m": "Please tell us (since this is off the point) what you think of the offers we've sent you."}, {"t": "sp", "who": "CAESAR", "lines": ["There's the point."], "id": 457, "m": "That's the point."}, {"t": "sp", "who": "ANTONY", "lines": ["Which do not be entreated to, but weigh", "What it is worth embrac'd."], "id": 458, "m": "Don't be begged into it. Weigh up what it's worth to accept."}, {"t": "sp", "who": "CAESAR", "lines": ["And what may follow,", "To try a larger fortune."], "id": 459, "m": "And what might happen if you try for more."}, {"t": "sp", "who": "POMPEY", "lines": ["You have made me offer", "Of Sicily, Sardinia; and I must", "Rid all the sea of pirates; then to send", "Measures of wheat to Rome; this 'greed upon,", "To part with unhack'd edges and bear back", "Our targes undinted."], "id": 460, "m": "You've offered me Sicily and Sardinia, and I must clear the sea of pirates and send loads of wheat to Rome. If we agree to this, we part with our swords unscratched and take our shields home undented."}, {"t": "sp", "who": "TRIUMVIRS", "lines": ["That's our offer."], "id": 461, "m": "That's our offer."}, {"t": "sp", "who": "POMPEY", "lines": ["Know, then,", "I came before you here a man prepar'd", "To take this offer: but Mark Antony", "Put me to some impatience:--though I lose", "The praise of it by telling, you must know,", "When Caesar and your brother were at blows,", "Your mother came to Sicily, and did find", "Her welcome friendly."], "id": 462, "m": "Know, then, that I came here ready to accept this offer. But Mark Antony made me a bit impatient. Though I lose the credit by telling it, you should know that when Caesar and your brother were fighting, your mother came to Sicily and was made very welcome."}, {"t": "sp", "who": "ANTONY", "lines": ["I have heard it, Pompey,", "And am well studied for a liberal thanks", "Which I do owe you."], "id": 463, "m": "I've heard about it, Pompey, and I've prepared to give you the generous thanks I owe you."}, {"t": "sp", "who": "POMPEY", "lines": ["Let me have your hand:", "I did not think, sir, to have met you here."], "id": 464, "m": "Give me your hand. I didn't expect to meet you here, sir."}, {"t": "sp", "who": "ANTONY", "lines": ["The beds i' the East are soft; and, thanks to you,", "That call'd me, timelier than my purpose, hither;", "For I have gained by it."], "id": 465, "m": "The beds in the East are soft. And thanks to you for calling me here sooner than I planned, because I've gained by it."}, {"t": "sp", "who": "CAESAR", "lines": ["Since I saw you last", "There is a change upon you."], "id": 466, "m": "You've changed since I last saw you."}, {"t": "sp", "who": "POMPEY", "lines": ["Well, I know not", "What counts harsh fortune casts upon my face;", "But in my bosom shall she never come", "To make my heart her vassal."], "id": 467, "m": "Well, I don't know what lines harsh fortune has drawn on my face, but she'll never get inside my heart to make it her slave."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Well met here."], "id": 468, "m": "Good to meet you here."}, {"t": "sp", "who": "POMPEY", "lines": ["I hope so, Lepidus.--Thus we are agreed:", "I crave our composition may be written,", "And seal'd between us."], "id": 469, "m": "I hope so, Lepidus. So, we're agreed. I want our agreement written down and sealed between us."}, {"t": "sp", "who": "CAESAR", "lines": ["That's the next to do."], "id": 470, "m": "That's the next thing to do."}, {"t": "sp", "who": "POMPEY", "lines": ["We'll feast each other ere we part; and let's", "Draw lots who shall begin."], "id": 471, "m": "Let's entertain each other with feasts before we part, and draw lots for who goes first."}, {"t": "sp", "who": "ANTONY", "lines": ["That will I, Pompey."], "id": 472, "m": "I will, Pompey."}, {"t": "sp", "who": "POMPEY", "lines": ["No, Antony, take the lot: but, first", "Or last, your fine Egyptian cookery", "Shall have the fame. I have heard that Julius Caesar", "Grew fat with feasting there."], "id": 473, "m": "No, Antony, take your chance with the lots. But whether first or last, your fine Egyptian cooking will win the prize. I've heard that Julius Caesar grew fat feasting there."}, {"t": "sp", "who": "ANTONY", "lines": ["You have heard much."], "id": 474, "m": "You've heard a lot."}, {"t": "sp", "who": "POMPEY", "lines": ["I have fair meanings, sir."], "id": 475, "m": "I mean no harm, sir."}, {"t": "sp", "who": "ANTONY", "lines": ["And fair words to them."], "id": 476, "m": "And you say it nicely."}, {"t": "sp", "who": "POMPEY", "lines": ["Then so much have I heard;", "And I have heard Apollodorus carried,--"], "id": 477, "m": "Well, that's what I've heard. And I've heard that Apollodorus carried..."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["No more of that:--he did so."], "id": 478, "m": "No more of that. He did."}, {"t": "sp", "who": "POMPEY", "lines": ["What, I pray you?"], "id": 479, "m": "Did what, please?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["A certain queen to Caesar in a mattress."], "id": 480, "m": "Carried a certain queen to Caesar rolled up in a mattress."}, {"t": "sp", "who": "POMPEY", "lines": ["I know thee now: how far'st thou, soldier?"], "id": 481, "m": "Now I know you. How are you, soldier?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Well;", "And well am like to do; for I perceive", "Four feasts are toward."], "id": 482, "m": "Well. And likely to do well, because I see four feasts coming up."}, {"t": "sp", "who": "POMPEY", "lines": ["Let me shake thy hand;", "I never hated thee: I have seen thee fight,", "When I have envied thy behaviour."], "id": 483, "m": "Let me shake your hand. I never hated you. I've seen you fight and envied your courage."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Sir,", "I never lov'd you much; but I ha' prais'd ye", "When you have well deserv'd ten times as much", "As I have said you did."], "id": 484, "m": "Sir, I never liked you much, but I've praised you when you deserved ten times more than I said."}, {"t": "sp", "who": "POMPEY", "lines": ["Enjoy thy plainness;", "It nothing ill becomes thee.--", "Aboard my galley I invite you all:", "Will you lead, lords?"], "id": 485, "m": "Enjoy your plain speaking. It suits you. I invite you all aboard my ship. Will you lead the way, lords?"}, {"t": "sp", "who": "TRIUMVIRS", "lines": ["Show's the way, sir."], "id": 486, "m": "Show us the way, sir."}, {"t": "sp", "who": "POMPEY", "lines": ["Come."], "id": 487, "m": "Come."}, {"t": "sd", "text": "Exeunt all but Enobarbus and Menas.", "id": 488}, {"t": "sp", "who": "MENAS", "lines": ["[Aside.] Thy father, Pompey, would ne'er have made this treaty.--", "You and I have known, sir."], "id": 489, "m": "[Aside] Your father, Pompey, would never have made this treaty. [To Enobarbus] We've met before, sir."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["At sea, I think."], "id": 490, "m": "At sea, I think."}, {"t": "sp", "who": "MENAS", "lines": ["We have, sir."], "id": 491, "m": "We have, sir."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["You have done well by water."], "id": 492, "m": "You've done well at sea."}, {"t": "sp", "who": "MENAS", "lines": ["And you by land."], "id": 493, "m": "And you on land."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I will praise any man that will praise me; though it cannot be", "denied what I have done by land."], "id": 494, "m": "I'll praise any man who praises me, though no one can deny what I've done on land."}, {"t": "sp", "who": "MENAS", "lines": ["Nor what I have done by water."], "id": 495, "m": "Nor what I've done at sea."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Yes, something you can deny for your own safety: you have been a", "great thief by sea."], "id": 496, "m": "Yes, there's something you'd better deny for your own safety: you've been a great thief at sea."}, {"t": "sp", "who": "MENAS", "lines": ["And you by land."], "id": 497, "m": "And you on land."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["There I deny my land service. But give me your hand, Menas: if", "our eyes had authority, here they might take two thieves kissing."], "id": 498, "m": "Then I deny my service on land. But give me your hand, Menas. If our eyes were police, they could arrest two thieves kissing."}, {"t": "sp", "who": "MENAS", "lines": ["All men's faces are true, whatsome'er their hands are."], "id": 499, "m": "All men's faces are honest, whatever their hands are."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["But there is never a fair woman has a true face."], "id": 500, "m": "But no beautiful woman has an honest face."}, {"t": "sp", "who": "MENAS", "lines": ["No slander; they steal hearts."], "id": 501, "m": "That's no slander. They steal hearts."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["We came hither to fight with you."], "id": 502, "m": "We came here to fight you."}, {"t": "sp", "who": "MENAS", "lines": ["For my part, I am sorry it is turn'd to a drinking. Pompey doth", "this day laugh away his fortune."], "id": 503, "m": "For my part, I'm sorry it's turned into a drinking party. Today Pompey is laughing away his fortune."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["If he do, sure he cannot weep it back again."], "id": 504, "m": "If he is, he certainly can't cry it back again."}, {"t": "sp", "who": "MENAS", "lines": ["You have said, sir. We look'd not for Mark Antony here: pray you,", "is he married to Cleopatra?"], "id": 505, "m": "You're right, sir. We didn't expect Mark Antony here. Please tell me, is he married to Cleopatra?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Caesar's sister is called Octavia."], "id": 506, "m": "Caesar's sister is called Octavia."}, {"t": "sp", "who": "MENAS", "lines": ["True, sir; she was the wife of Caius Marcellus."], "id": 507, "m": "True, sir. She was the wife of Caius Marcellus."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["But she is now the wife of Marcus Antonius."], "id": 508, "m": "But now she's the wife of Marcus Antonius."}, {"t": "sp", "who": "MENAS", "lines": ["Pray you, sir?"], "id": 509, "m": "What, sir?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["'Tis true."], "id": 510, "m": "It's true."}, {"t": "sp", "who": "MENAS", "lines": ["Then is Caesar and he for ever knit together."], "id": 511, "m": "Then Caesar and he are tied together for ever."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["If I were bound to divine of this unity, I would not prophesy so."], "id": 512, "m": "If I had to predict the future of this union, I wouldn't say so."}, {"t": "sp", "who": "MENAS", "lines": ["I think the policy of that purpose made more in the marriage than", "the love of the parties."], "id": 513, "m": "I think politics had more to do with this marriage than love."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I think so too. But you shall find the band that seems to tie", "their friendship together will be the very strangler of their", "amity:  Octavia is of a holy, cold, and still conversation."], "id": 514, "m": "I think so too. But you'll find that the bond which seems to tie their friendship together will be the very thing that strangles it. Octavia is pious, cold and quiet."}, {"t": "sp", "who": "MENAS", "lines": ["Who would not have his wife so?"], "id": 515, "m": "Who wouldn't want a wife like that?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Not he that himself is not so; which is Mark Antony. He will to", "his Egyptian dish again: then shall the sighs of Octavia blow the", "fire up in Caesar; and, as I said before, that which is the", "strength of their amity shall prove the immediate author of their", "variance. Antony will use his affection where it is: he married", "but his occasion here."], "id": 516, "m": "A man who isn't like that himself, which is Mark Antony. He'll go back to his Egyptian dish. Then Octavia's sighs will fan the flames of Caesar's anger, and, as I said, what now strengthens their friendship will be the direct cause of their quarrel. Antony will give his love where it really is. He only married for convenience here."}, {"t": "sp", "who": "MENAS", "lines": ["And thus it may be. Come, sir, will you aboard? I have a health", "for you."], "id": 517, "m": "That may well be. Come, sir, will you come aboard? I want to drink your health."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I shall take it, sir: we have used our throats in Egypt."], "id": 518, "m": "I'll accept, sir. We've trained our throats in Egypt."}, {"t": "sp", "who": "MENAS", "lines": ["Come, let's away."], "id": 519, "m": "Come, let's go."}, {"t": "sd", "text": "Exeunt.", "id": 520}, {"t": "scene", "act": 2, "scene": "VII", "loc": "On board Pompey's Galley, lying near Misenum.", "id": 521}, {"t": "sd", "text": "Music. Enter two or three Servants with a banquet.", "id": 522}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["Here they'll be, man. Some o' their plants are ill-rooted", "already; the least wind i' the world will blow them down."], "id": 523, "m": "Here they come, man. Some of their plants are already badly rooted; the slightest wind in the world will blow them over."}, {"t": "sp", "who": "SECOND SERVANT", "lines": ["Lepidus is high-coloured."], "id": 524, "m": "Lepidus is red in the face."}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["They have made him drink alms-drink."], "id": 525, "m": "They've made him drink the leftovers for them."}, {"t": "sp", "who": "SECOND SERVANT", "lines": ["As they pinch one another by the disposition, he cries out 'no", "more'; reconciles them to his entreaty and himself to the drink."], "id": 526, "m": "Whenever they needle each other, he shouts 'No more!', makes them make up, and has another drink himself."}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["But it raises the greater war between him and his discretion."], "id": 527, "m": "But that starts a bigger war between him and his good sense."}, {"t": "sp", "who": "SECOND SERVANT", "lines": ["Why, this it is to have a name in great men's fellowship: I had", "as lief have a reed that will do me no service as a partizan I", "could not heave."], "id": 528, "m": "That's what comes of being named as one of the great men's company. I'd rather have a reed that's no use to me than a spear I can't lift."}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["To be called into a huge sphere, and not to be seen to move in't,", "are the holes where eyes should be, which pitifully disaster the", "cheeks."], "id": 529, "m": "To be called up into a great position and not be seen to do anything there is like having empty holes where eyes should be, which ruin the face."}, {"t": "sd", "text": "A sennet sounded. Enter Caesar, Antony, Lepidus, Pompey, Agrippa, Maecenas, Enobarbus, Menas, with other Captains.", "id": 530}, {"t": "sp", "who": "ANTONY", "lines": ["[To Caesar.] Thus do they, sir: they take the flow o' the Nile", "By certain scales i' the pyramid; they know", "By the height, the lowness, or the mean, if dearth", "Or foison follow: the higher Nilus swells", "The more it promises; as it ebbs, the seedsman", "Upon the slime and ooze scatters his grain,", "And shortly comes to harvest."], "id": 531, "m": "[To Caesar] This is how they do it, sir. They measure the rise of the Nile by marks on the pyramid. They know from how high, low or medium it is whether famine or plenty will follow. The higher the Nile rises, the better the harvest promises. As it goes down, the farmer scatters his seed on the mud and slime, and soon harvests it."}, {"t": "sp", "who": "LEPIDUS", "lines": ["You've strange serpents there."], "id": 532, "m": "You have strange serpents there."}, {"t": "sp", "who": "ANTONY", "lines": ["Ay, Lepidus."], "id": 533, "m": "Yes, Lepidus."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Your serpent of Egypt is bred now of your mud by the operation of", "your sun: so is your crocodile."], "id": 534, "m": "Your Egyptian serpent is born from your mud by the power of your sun. So is your crocodile."}, {"t": "sp", "who": "ANTONY", "lines": ["They are so."], "id": 535, "m": "They are."}, {"t": "sp", "who": "POMPEY", "lines": ["Sit --and some wine!--A health to Lepidus!"], "id": 536, "m": "Sit down, and some wine! A toast to Lepidus!"}, {"t": "sp", "who": "LEPIDUS", "lines": ["I am not so well as I should be, but I'll ne'er out."], "id": 537, "m": "I'm not as well as I should be, but I'll never drop out."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Not till you have slept; I fear me you'll be in till then."], "id": 538, "m": "Not until you've slept. I'm afraid you'll be in it till then."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Nay, certainly, I have heard the Ptolemies' pyramises are very", "goodly things; without contradiction I have heard that."], "id": 539, "m": "No, certainly, I've heard the Ptolemies' pyramids are very fine things. Without contradiction, I've heard that."}, {"t": "sp", "who": "MENAS", "lines": ["[Aside to Pompey.] Pompey, a word."], "id": 540, "m": "[Aside to Pompey] Pompey, a word."}, {"t": "sp", "who": "POMPEY", "lines": ["[Aside to Menas.] Say in mine ear: what is't?"], "id": 541, "m": "[Aside to Menas] Whisper in my ear. What is it?"}, {"t": "sp", "who": "MENAS", "lines": ["[Aside to Pompey.] Forsake thy seat, I do beseech thee, captain,", "And hear me speak a word."], "id": 542, "m": "[Aside to Pompey] Leave your seat, I beg you, captain, and listen to me."}, {"t": "sp", "who": "POMPEY", "lines": ["[Aside to Menas.] Forbear me till anon--", "This wine for Lepidus!"], "id": 543, "m": "[Aside to Menas] Wait till later. This wine for Lepidus!"}, {"t": "sp", "who": "LEPIDUS", "lines": ["What manner o' thing is your crocodile?"], "id": 544, "m": "What sort of thing is your crocodile?"}, {"t": "sp", "who": "ANTONY", "lines": ["It is shaped, sir, like itself; and it is as broad as it hath", "breadth: it is just so high as it is, and moves with it own", "organs: it lives by that which nourisheth it, and the elements", "once out of it, it transmigrates."], "id": 545, "m": "It's shaped, sir, like itself, and it's as broad as it is wide. It's exactly as tall as it is, and moves with its own organs. It lives on what feeds it, and when its elements leave it, its soul passes into another body."}, {"t": "sp", "who": "LEPIDUS", "lines": ["What colour is it of?"], "id": 546, "m": "What colour is it?"}, {"t": "sp", "who": "ANTONY", "lines": ["Of its own colour too."], "id": 547, "m": "Its own colour too."}, {"t": "sp", "who": "LEPIDUS", "lines": ["'Tis a strange serpent."], "id": 548, "m": "It's a strange serpent."}, {"t": "sp", "who": "ANTONY", "lines": ["'Tis so. And the tears of it are wet."], "id": 549, "m": "It is. And its tears are wet."}, {"t": "sp", "who": "CAESAR", "lines": ["Will this description satisfy him?"], "id": 550, "m": "Will that description satisfy him?"}, {"t": "sp", "who": "ANTONY", "lines": ["With the health that Pompey gives him, else he is a very epicure."], "id": 551, "m": "Along with the toast Pompey's giving him. Otherwise he's a real glutton."}, {"t": "sp", "who": "POMPEY", "lines": ["[Aside to Menas.] Go, hang, sir, hang! Tell me of that! away!", "Do as I bid you.--Where's this cup I call'd for?"], "id": 552, "m": "[Aside to Menas] Go hang yourself, sir! Talk to me about that? Go away! Do as I say. Where's the cup I asked for?"}, {"t": "sp", "who": "MENAS", "lines": ["[Aside to Pompey.] If for the sake of merit thou wilt hear me,", "Rise from thy stool."], "id": 553, "m": "[Aside to Pompey] If you'll listen to me for the sake of my service, get up from your stool."}, {"t": "sp", "who": "POMPEY", "lines": ["[Aside to Menas.] I think thou'rt mad."], "id": 554, "m": "[Aside to Menas] I think you're mad."}, {"t": "sd", "text": "Rises and walks aside.", "id": 555}, {"t": "sp", "who": "POMPEY", "cont": 1, "lines": ["The matter?"], "id": 556, "m": "What is it?"}, {"t": "sp", "who": "MENAS", "lines": ["I have ever held my cap off to thy fortunes."], "id": 557, "m": "I've always taken my hat off to your fortunes."}, {"t": "sp", "who": "POMPEY", "lines": ["Thou hast serv'd me with much faith.", "What's else to say?--", "Be jolly, lords."], "id": 558, "m": "You've served me very faithfully. What else? Be merry, lords."}, {"t": "sp", "who": "ANTONY", "lines": ["These quicksands, Lepidus,", "Keep off them, for you sink."], "id": 559, "m": "Keep away from these quicksands, Lepidus, or you'll sink."}, {"t": "sp", "who": "MENAS", "lines": ["Wilt thou be lord of all the world?"], "id": 560, "m": "Do you want to be lord of the whole world?"}, {"t": "sp", "who": "POMPEY", "lines": ["What say'st thou?"], "id": 561, "m": "What are you saying?"}, {"t": "sp", "who": "MENAS", "lines": ["Wilt thou be lord of the whole world?", "That's twice."], "id": 562, "m": "Do you want to be lord of the whole world? That's twice I've a
