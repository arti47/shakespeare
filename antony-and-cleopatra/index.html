ay easy success be scattered at your feet!"]], "175": [[0, 0, "Let's go. Come."], [1, 3, "Our parting is such that it both stays and goes: you, staying here, go with me, and I, leaving here, stay with you."], [4, 4, "Away!"]], "180": [[0, 1, "I can't believe there are enough faults to darken all his goodness."], [2, 5, "His faults are like the stars in the sky, shining brighter against night's darkness. They're inborn rather than acquired; things he can't change rather than things he chooses."]], "181": [[0, 1, "You're too kind."], [2, 3, "Let's agree it isn't wrong to roll around in bed with Ptolemy's queen, to give away a kingdom for a joke, to take turns drinking with a slave, to stagger through the streets at noon and trade punches with rogues who stink of sweat."], [4, 17, "Say this suits him, though he'd have to be a rare man indeed not to be stained by such things. Even so, Antony can't excuse his failings when we have to carry so much weight because of his frivolity. If he filled his free time with pleasure, upset stomachs and diseased bones would make him pay for it. But to waste time that drums him back to duty, and that matters so much to his position and ours, deserves a scolding, the way we scold boys who know better but trade what they've learned for pleasure, and so rebel against good sense."]], "184": [[0, 2, "Your orders have been carried out, and every hour, noble Caesar, you'll get reports of what's happening."], [3, 6, "Pompey is strong at sea, and it seems he's loved by those who only feared you. The discontented flock to the ports, and people say he's been badly treated."]], "185": [[0, 0, "I should have expected that."], [1, 2, "History has taught us from the very beginning that the man in power was wanted only until he got power, and the man who's fallen, never loved until he's no longer worth loving, becomes dear by being missed."], [3, 7, "The common people are like a loose reed on a river, drifting back and forth, following the changing tide like a servant, until it rots from all the motion."]], "186": [[0, 5, "Caesar, I bring you news that Menecrates and Menas, famous pirates, are making the sea their servant, ploughing and cutting it with all kinds of ships. They make many fierce raids on Italy. The people on the coast turn pale at the thought, and hot-blooded young men are rebelling."], [6, 8, "No ship can set out without being captured as soon as it's seen. Pompey's name does more damage than his army could if it were fought."]], "187": [[0, 9, "Antony, give up your lustful partying. When you were defeated at Modena, where you killed the consuls Hirtius and Pansa, famine followed close behind you. You fought it, though you'd been raised in luxury, with more endurance than savages could. You drank horses' urine and slimy puddles that animals would choke on. Your taste then accepted the hardest berry on the roughest hedge."], [10, 16, "Yes, like a stag when snow covers the pasture, you ate the bark off trees. In the Alps, they say, you ate strange meat that killed some men just to look at. And all this (it hurts your honour that I mention it now) you endured so like a soldier that your face didn't even get thinner."]], "210": [[0, 1, "Not in deed, madam, because I can't do anything except what's decent."], [2, 3, "But I do have fierce desires, and think about what Venus did with Mars."]], "211": [[0, 1, "Oh, Charmian, where do you think he is now? Is he standing or sitting?"], [2, 2, "Or is he walking? Or is he on his horse?"], [3, 3, "Oh, happy horse, to carry Antony's weight!"], [4, 4, "Do well, horse! Do you know who you're carrying?"], [5, 7, "The half-Atlas who holds up the world, the arm and helmet of mankind. He's speaking now, or murmuring, 'Where's my serpent of old Nile?"], [8, 14, "That's what he calls me. Now I'm feeding myself the most delicious poison. Think of me, who am tanned black by the sun's loving pinches and deeply wrinkled with age? Julius Caesar, with your broad forehead, when you were alive I was a dish fit for a king."], [15, 16, "And great Pompey would stand and fix his eyes on my face; he'd anchor his gaze there and die looking at what he lived for."]], "214": [[0, 0, "How unlike Mark Antony you are!"], [1, 3, "Yet, coming from him, his great magic has gilded you with its colour. How is my brave Mark Antony?"]], "220": [[0, 1, "Oh, what a balanced mood! Notice that, notice that, good Charmian. That's the man exactly."], [2, 5, "Notice it: he wasn't sad, because he wanted to cheer those who copy his looks; he wasn't happy, which seemed to tell them his thoughts were in Egypt with his joy; he was in between."], [6, 8, "Oh, heavenly mixture! Whether you're sad or happy, the extremes of both suit you as they suit no other man. Did you meet my messengers?"]], "228": [[0, 2, "That was in my salad days, when I was green in judgement and cold-blooded, to say what I said then! But come, let's go."], [3, 5, "Get me ink and paper. He'll have a separate greeting every day, even if I have to empty Egypt of people to send them."]], "236": [[0, 0, "I'll do well."], [1, 1, "The people love me, and the sea is mine."], [2, 8, "My power is growing like the new moon, and my hopes predict it will be full. Mark Antony sits at dinner in Egypt and won't fight any wars outside. Caesar raises money but loses people's love. Lepidus flatters both of them and is flattered by both, but he loves neither, and neither cares for him."]], "240": [[0, 2, "He's dreaming. I know they're in Rome together, waiting for Antony. Lustful Cleopatra, may all the charms of love sweeten your faded lips!"], [3, 3, "Let witchcraft join with beauty, and lust with both!"], [4, 6, "Keep the pleasure-seeker tied up in a world of feasts and keep his brain fogged with wine."], [7, 8, "May gourmet cooks sharpen his appetite with sauces that never sicken him, so that sleeping and eating put off his sense of honour until he forgets it completely."]], "245": [[0, 1, "I can't believe Caesar and Antony will get on well."], [2, 4, "Antony's dead wife wronged Caesar, and his brother made war on him, though I don't think Antony urged him to."]], "246": [[0, 1, "I don't know, Menas, how smaller quarrels may give way to bigger ones."], [2, 3, "If we weren't standing up against all of them, it's likely they'd fight among themselves, because they've got enough reasons to draw their swords."], [4, 7, "But we don't yet know how far fear of us may patch up their divisions and heal their petty differences."], [8, 9, "Let it be as the gods want! Our lives depend on using all our strength."], [10, 10, "Come, Menas."]], "275": [[0, 1, "You've got it wrong. My brother never used my name in what he did."], [2, 4, "I looked into it, and I heard from reliable men who fought on your side. Didn't he undermine my authority as much as yours, and make war against my wishes, since your cause was the same as mine?"], [5, 9, "My letters already proved this to you. If you want to patch together a quarrel, and you've no real material to make one from, it can't be with this."]], "277": [[0, 0, "Not so, not so."], [1, 6, "I'm certain you must have realised that I, your partner in the cause he was fighting against, couldn't look kindly on wars that threatened my own peace. As for my wife, I wish you had a wife with spirit like hers."], [7, 8, "A third of the world is yours, and you can control it easily with a light bridle, but not a wife like that."]], "284": [[0, 0, "No, Lepidus, let him speak."], [1, 2, "The honour he's talking about is sacred, if he's suggesting I lack it."], [3, 3, "But go on, Caesar: the term of my oath."]], "286": [[0, 6, "Neglected, rather, and at a time when poisoned hours had made me forget myself. As far as I can, I'll apologise to you. But my honesty won't make my greatness smaller, and my power won't act without honesty. The truth is that Fulvia made war here to get me out of Egypt."], [7, 9, "Since I was the unknowing cause, I ask pardon as far as my honour allows me to stoop in such a case."]], "301": [[0, 4, "To keep you friends forever, to make you brothers and tie your hearts with a knot that won't slip, let Antony take Octavia as his wife. Her beauty deserves nothing less than the best of men as a husband, and her virtue and graces say more than anyone else could."], [5, 12, "With this marriage, all the small suspicions that now seem great, and all the great fears that now seem dangerous, would come to nothing. True stories would be dismissed as gossip, where now half-truths are believed. Her love for both of you would draw you to each other, and draw everyone's love to you both. Forgive what I've said."], [13, 14, "It's a considered idea, not a sudden one, thought over out of duty."]], "306": [[0, 2, "May I never dream of any obstacle to this good plan, which looks so promising! Give me your hand."], [3, 5, "Help this gracious deal along, and from this hour may brotherly hearts rule our love and guide our great plans!"]], "307": [[0, 0, "There's my hand."], [1, 4, "I give you a sister, loved more dearly than any brother ever loved a sister. Let her live to join our kingdoms and our hearts, and may our friendship never fall apart again!"]], "309": [[0, 3, "I didn't expect to draw my sword against Pompey, because he's recently done me great and unusual kindnesses. I must thank him first, so that I'm not called ungrateful."], [4, 4, "Right after that, I'll challenge him."]], "315": [[0, 0, "So they say."], [1, 1, "I wish we'd talked earlier! Let's hurry."], [2, 3, "But before we arm ourselves, let's settle the business we've discussed."]], "330": [[0, 0, "I'll tell you."], [1, 2, "The barge she sat in shone like a polished throne and seemed to burn on the water. The stern was beaten gold."], [3, 15, "The sails were purple and so perfumed that the winds were lovesick for them. The oars were silver and kept time to the music of flutes, making the water they struck follow faster, as if it were in love with their strokes. As for her, she was beyond all description. She lay in her tent, made of gold cloth, looking more beautiful than a painting of Venus in which imagination outdoes nature. On each side of her stood pretty, dimpled boys, like smiling Cupids, with many-coloured fans whose breeze seemed to make her delicate cheeks glow even as it cooled them, undoing what it did."]], "334": [[0, 2, "When she landed, Antony sent to her and invited her to supper. She replied that it would be better if he became her guest, and she begged him to."], [3, 7, "Our polite Antony, who's never said 'No' to a woman, had himself shaved ten times over and went to the feast. And for his meal he paid with his heart, for what only his eyes ate."]], "336": [[0, 1, "I saw her once hop forty paces through the public street."], [2, 4, "She ran out of breath, and spoke and panted so charmingly that she made a fault seem perfect, and, breathless, breathed out power."]], "338": [[0, 0, "Never. He won't."], [1, 6, "Age can't wither her, and familiarity can't make her endless variety go stale. Other women satisfy the appetites they feed until you're sick of them, but she makes you hungry the more she satisfies you. Even the most shameful things become attractive in her, so that the holy priests bless her when she's being lustful."]], "347": [[0, 1, "Good night, sir. My Octavia, don't judge me by what the world says about my faults."], [2, 3, "I haven't always kept to the rules, but from now on everything will be done properly. Good night, dear lady."]], "357": [[0, 0, "Caesar's."], [1, 1, "So, oh Antony, don't stay near him."], [2, 6, "Your guardian spirit, which protects you, is noble, brave, lofty and unmatched where Caesar's isn't. But near him your angel becomes fearful, as if overpowered. So keep plenty of distance between you."]], "359": [[0, 0, "To nobody but you, and only to you."], [1, 6, "If you play any game with him, you're sure to lose. His natural luck beats you against the odds. Your brightness dims when he shines nearby. I say again: your spirit is afraid to guide you near him, but when he's away, it's noble."]], "362": [[0, 3, "He'll go to Parthia. Whether by skill or luck, the fortune-teller's right. Even the dice obey Caesar, and in our games my greater skill gives way to his luck. If we draw lots, he wins."], [4, 6, "His fighting cocks always beat mine, even when the odds are all against him, and his quails always beat mine in the ring. I'll go to Egypt."], [7, 8, "Though I'm making this marriage for peace, my pleasure lies in the East."]], "387": [[0, 3, "That time? Oh, those times! I laughed him out of his patience, and that night I laughed him back into it."], [4, 5, "And the next morning, before nine o'clock, I drank him under the table, then dressed him in my headdresses and cloaks while I wore his sword from Philippi."]], "391": [[0, 1, "Antony's dead! If you say so, villain, you'll kill your mistress."], [2, 5, "But if you tell me he's well and free, here's gold, and here are my bluest veins for you to kiss, a hand that kings have kissed and trembled as they kissed it."]], "393": [[0, 0, "Why, there's more gold."], [1, 4, "But, fellow, listen: we often say the dead are 'well'. If that's what you mean, I'll melt the gold I gave you and pour it down your evil-speaking throat."]], "395": [[0, 0, "Well, go on, I will."], [1, 5, "But there's nothing good in your face. If Antony is free and healthy, why such a sour look to announce such good news? If he isn't well, you should come like a Fury crowned with snakes, not looking like a normal man."]], "397": [[0, 0, "I feel like hitting you before you speak."], [1, 4, "Yet if you say Antony's alive and well, or friends with Caesar, or not his prisoner, I'll shower you with gold and rain rich pearls on you."]], "405": [[0, 1, "I don't like 'but yet'. It spoils the good news that came before it."], [2, 5, "Curse 'but yet'! 'But yet' is like a jailer bringing out some monstrous criminal. Please, friend, empty the whole bag of news into my ear, good and bad together."], [6, 6, "He's friends with Caesar, he's healthy, you say, and, you say, free."]], "413": [[0, 1, "What did you say? [She hits him again."], [2, 3, "Get out, horrible villain, or I'll kick your eyes in front of me like balls! I'll pull out your hair!"]], "429": [[0, 0, "Come here, sir."], [1, 4, "Even when it's honest, it's never good to bring bad news. Give good news a whole crowd of tongues, but let bad news announce itself when it's felt."]], "435": [[0, 2, "Oh, I wish you would, even if half my Egypt were flooded and made a tank for scaly snakes! Go, get out of here."], [3, 4, "Even if you had the face of Narcissus, you'd look ugly to me. He's married?"]], "439": [[0, 1, "Oh, that his crime should make a villain of you, when you're not guilty of the news you're so sure of!"], [2, 4, "Get out of here. The goods you've brought from Rome are too expensive for me. Keep them, and may they ruin you!"]], "444": [[0, 0, "Now I'm paying for it."], [1, 1, "Lead me away."], [2, 6, "I'm going to faint. Oh, Iras, Charmian! It doesn't matter. Go to the man, good Alexas. Ask him to describe Octavia's looks, her age, her personality. Don't let him leave out the colour of her hair. Bring me word quickly."]], "451": [[0, 2, "It's right that we talk first, and so we've sent you our proposals in writing."], [3, 6, "If you've considered them, tell us whether they'll put away your discontented sword and take many fine young men back to Sicily who would otherwise die here."]], "455": [[0, 1, "On land, it's true, you've outdone me by taking my father's house."], [2, 3, "But since the cuckoo doesn't build its own nest, stay in it while you can."]], "485": [[0, 0, "Enjoy your plain speaking."], [1, 2, "It suits you. I invite you all aboard my ship."], [3, 3, "Will you lead the way, lords?"]], "566": [[0, 0, "No, Pompey, I've stayed away from the cup."], [1, 1, "If you dare, you can be Jupiter on earth."], [2, 3, "Whatever the ocean encloses or the sky embraces is yours, if you want it."]], "568": [[0, 1, "These three sharers of the world, these partners, are on your ship."], [2, 2, "Let me cut the anchor cable, and when we're out at sea, cut their throats."], [3, 3, "Then everything is yours."]], "569": [[0, 1, "Ah, you should have done this and not told me! For me it's villainy; for you it would have been good service."], [2, 3, "You must understand that my profit doesn't lead my honour; my honour leads it."], [4, 6, "Regret that your tongue gave away what you were going to do. If you'd done it without my knowing, I'd have approved afterwards."], [7, 7, "But now I must condemn it. Stop, and drink."]], "570": [[0, 1, "[Aside] Because of this, I'll never follow your faded fortunes again."], [2, 3, "Whoever looks for something and won't take it when it's offered will never find it again."]], "591": [[0, 2, "Everyone hold hands. Batter our ears with loud music, while I put you in place."], [3, 4, "Then the boy will sing, and every man will roar the chorus as loudly as his strong lungs can. [Music plays."], [5, 5, "Enobarbus places them hand in hand."], [6, 7, "SONG: Come, you king of the vine, chubby Bacchus with pink eyes!"], [8, 9, "Let our troubles be drowned in your vats, let our hair be crowned with your grapes."], [10, 11, "Fill our cups till the world spins round, fill our cups till the world spins round!"]], "592": [[0, 2, "What more do you want? Pompey, good night. Good brother, let me ask you to leave. Our serious business frowns at this frivolity. Gentle lords, let's part."], [3, 7, "You see we've all gone red in the face. Strong Enobarbus is weaker than the wine, and my own tongue trips over its words. This wild disguise has almost turned us all into clowns. Why say more? Good night. Good Antony, your hand."]], "608": [[0, 4, "Oh Silius, Silius, I've done enough. Remember, a man of lower rank can achieve too much. Learn this, Silius: better leave a thing undone than win too great a fame by it while the man we serve is away."], [5, 9, "Caesar and Antony have always won more through their officers than in person. Sossius, who held my post in Syria as Antony's lieutenant, lost his favour because he piled up glory too quickly."], [10, 13, "Whoever does more in war than his commander becomes his commander's commander. And ambition, a soldier's virtue, would rather accept a loss than a gain that puts him in the shade."], [14, 16, "I could do more to help Antony, but it would offend him, and once he was offended, all my achievements would count for nothing."]], "617": [[0, 0, "They've finished with Pompey; he's gone."], [1, 4, "The other three are sealing the agreement. Octavia is weeping to leave Rome; Caesar is sad; and Lepidus, according to Menas, has been suffering from a lovesick young girl's illness since Pompey's feast."]], "627": [[0, 0, "But he loves Caesar best. Yet he loves Antony. Wow!"], [1, 4, "Hearts, tongues, numbers, writers, bards and poets can't think, speak, calculate, write, sing or count his love for Antony. Wow! But as for Caesar, kneel down, kneel down and be amazed."]], "635": [[0, 0, "You're taking a great part of me away."], [1, 9, "Treat me well in her. Sister, be the kind of wife I think you are, the kind I'd stake my life on. Most noble Antony, don't let this model of virtue, who is set between us as the cement that holds our friendship together, become the battering ram that knocks it down. It would be better to have stayed friends without her if she isn't cherished by both of us."]], "638": [[0, 3, "However closely you look, you won't find the slightest cause for what you seem to fear. So, may the gods protect you, and make the hearts of Romans serve your purposes!"], [4, 4, "We'll part here."]], "650": [[0, 1, "[Aside to Agrippa] That year he certainly had a bad cold."], [2, 2, "He wept over what he'd been glad to destroy."], [3, 3, "Believe it when you see me crying too."]], "652": [[0, 0, "Come, sir, come."], [1, 1, "I'll wrestle with you in a contest of love."], [2, 3, "Look, I have you here; now I let you go, and give you to the gods."]], "679": [[0, 1, "She creeps. Moving or standing still, she's the same."], [2, 3, "She seems more like a body than a living thing, a statue rather than someone who breathes."]], "693": [[0, 0, "Here's gold for you."], [1, 3, "Don't hold my earlier harshness against me. I'll send you back again; I find you very good at this work. Go and get ready."], [4, 4, "Our letters are prepared."]], "705": [[0, 4, "No, no, Octavia, not just that. That would be forgivable, that and thousands more things like it. But he's started new wars against Pompey, made his will and read it out in public."], [5, 7, "He spoke slightingly of me. When he couldn't avoid praising me, he did it coldly and grudgingly and gave me as little credit as possible."], [8, 9, "When he had the best opportunity, he didn't take it, or he spoke through gritted teeth."]], "706": [[0, 4, "Oh my good lord, don't believe everything, or if you must believe it, don't resent all of it. If this split happens, there was never a more unhappy lady standing between two sides, praying for both."], [5, 6, "The good gods will surely mock me when I pray, 'Oh, bless my lord and husband!"], [7, 10, "and then cancel that prayer by crying just as loudly, 'Oh, bless my brother! 'Husband win' and 'brother win': each prayer destroys the other. There's no middle way between these extremes."]], "707": [[0, 7, "Gentle Octavia, let your love go to whoever tries hardest to keep it. If I lose my honour, I lose myself. It would be better for me not to be yours at all than to be yours with my branches cut off. But as you asked, you can go between us. Meanwhile, lady, I'll get ready for a war that will put your brother in the shade. Go as quickly as you can."], [8, 8, "You have what you wanted."]], "708": [[0, 0, "Thank you, my lord."], [1, 4, "May Jupiter, god of power, make me, so weak, so weak, the one who reconciles you! War between you two would be as if the world split apart and dead men had to fill the crack."]], "709": [[0, 3, "When you see who started this, turn your anger that way. Our faults can never be so equal that your love can be shared equally between us. Get ready to go."], [4, 5, "Choose your own companions, and spend whatever you like."]], "718": [[0, 3, "Caesar used Lepidus in the war against Pompey, then immediately refused to treat him as an equal. He wouldn't let him share in the glory of the victory. And not stopping there, he accuses him of letters he once wrote to Pompey, and on his own accusation has arrested him."], [4, 4, "So the poor third partner is locked up until death sets him free."]], "720": [[0, 1, "He's walking in the garden, like this, kicking the rushes in front of him and shouting 'Lepidus, you fool!"], [2, 3, "And he's threatening to cut the throat of the officer who murdered Pompey."]], "730": [[0, 0, "In the public stadium where they hold games."], [1, 1, "There he proclaimed his sons kings of kings."], [2, 7, "He gave Great Media, Parthia and Armenia to Alexander; to Ptolemy he gave Syria, Cilicia and Phoenicia. That day she appeared dressed as the goddess Isis, and it's said she often received visitors dressed like that before."]], "737": [[0, 0, "It's already done, and the messenger has gone."], [1, 6, "I've told him Lepidus had become too cruel, abused his great authority and deserved to lose it. I'll give him part of what I've conquered, but in return I demand the same share of his Armenia and his other conquered kingdoms."]], "750": [[0, 6, "No, my most wronged sister. Cleopatra has beckoned him to her. He's given his empire to a whore, and now they're gathering the kings of the earth for war."], [7, 11, "He's collected Bocchus, king of Libya; Archelaus of Cappadocia; Philadelphos, king of Paphlagonia; the Thracian king Adallas; King Manchus of Arabia; the King of Pontus; Herod of Judea; Mithridates, king of Commagene; Polemon and Amyntas, the kings of Media and Lycaonia, and a longer list of kings besides."]], "752": [[0, 0, "Welcome here."], [1, 3, "Your letters held us back from breaking out against him, until we saw how you were misled and how dangerously careless we were being."], [4, 5, "Cheer up. Don't be troubled by the times, which force these harsh necessities on your happiness."], [6, 7, "Let what fate has decided go its way without grieving."], [8, 11, "Welcome to Rome; nothing is dearer to me. You've been wronged beyond belief, and the high gods, to do you justice, are making us and those who love you their agents."], [12, 12, "Take comfort, and always be welcome here."]], "754": [[0, 0, "Welcome, dear madam."], [1, 1, "Every heart in Rome loves and pities you."], [2, 5, "Only adulterous Antony, so enormous in his disgusting behaviour, throws you aside and hands his great power to a slut who stirs it up against us."]], "767": [[0, 0, "Your presence is bound to distract Antony."], [1, 5, "It will take from his heart, his brain and his time what he can't spare right now. He's already criticised for being frivolous, and in Rome they say that a eunuch called Photinus and your maids are running this war."]], "768": [[0, 3, "Let Rome sink, and let the tongues that speak against us rot! I'm paying for this war, and as the ruler of my kingdom I'll be there like a man. Don't argue against it."], [4, 4, "I won't stay behind."]], "779": [[0, 0, "Your ships aren't properly manned."], [1, 3, "Your sailors are mule-drivers, farm workers, men rounded up by press-gangs. In Caesar's fleet are men who've often fought against Pompey."], [4, 6, "Their ships are quick to handle; yours are heavy. It's no disgrace to refuse to fight him at sea when you're ready to fight on land."]], "781": [[0, 1, "Most worthy sir, by doing that you throw away your complete mastery as a soldier on land."], [2, 7, "You divide your army, which is mostly made up of battle-hardened foot soldiers. You leave your famous skill unused, abandon the way that promises success, and give yourself up entirely to chance and risk instead of firm security."]], "788": [[0, 3, "Can he be there in person? It's impossible. It's strange enough that his army is. Canidius, you'll command our nineteen legions on land, and our twelve thousand cavalry. We'll go to our ship."], [4, 4, "Away, my Thetis!"]], "791": [[0, 0, "Oh noble commander, don't fight at sea."], [1, 5, "Don't trust rotten planks. Do you doubt this sword and these wounds of mine? Let the Egyptians and the Phoenicians go swimming. We're used to winning standing on the ground and fighting hand to hand."]], "797": [[0, 1, "Marcus Octavius, Marcus Justeius, Publicola and Caelius are going to sea, but we keep the rest together on land."], [2, 3, "Caesar's speed is unbelievable."]], "819": [[0, 0, "Ruin, ruin, total ruin! I can't watch any longer."], [1, 2, "The Antoniad, the Egyptian flagship, is turning and running away with all their sixty ships."], [3, 3, "Seeing it blinds my eyes."]], "827": [[0, 3, "Once she'd turned into the wind, Antony, the noble victim of her magic, spread his sails and, like a lovesick duck, left the battle at its height and flew after her."], [4, 4, "I've never seen anything so shameful."], [5, 6, "Experience, manhood and honour have never betrayed themselves like this before."]], "830": [[0, 2, "Our fortune at sea is out of breath and sinking miserably. If our general had been the man he knows himself to be, it would have gone well."], [3, 4, "Oh, he's set us an example of running away, a shameful one, by doing it himself!"]], "839": [[0, 1, "Listen! The ground tells me not to walk on it any more. It's ashamed to carry me. Friends, come here."], [2, 5, "I'm like a traveller caught out after dark; I've lost my way for ever. I have a ship loaded with gold. Take it, share it out, run, and make your peace with Caesar."]], "841": [[0, 1, "I've run away myself, and taught cowards to turn and show their backs. Friends, go."], [2, 3, "I've decided on a course that doesn't need you. Go. My treasure's in the harbour; take it."], [4, 5, "Oh, I followed what I'm ashamed to look at."], [6, 13, "Even my hair is rebelling: the white hairs scold the brown ones for being rash, and the brown ones scold the white for being cowardly and foolish. Friends, go. I'll give you letters to some friends who'll clear your way for you. Please don't look sad or show you're unwilling. Take the hint my despair is giving you. Let what abandons itself be abandoned. Go straight to the shore."], [14, 14, "I'll give you that ship and the treasure."], [15, 17, "Please leave me for a while. Please, now. No, do it, because I've lost the right to command you, so I'm asking you. I'll see you soon."]], "868": [[0, 1, "Don't let a tear fall, I tell you. One of them is worth everything that's been won and lost."], [2, 2, "Give me a kiss. Even this repays me."], [3, 5, "We sent our schoolmaster to Caesar; has he come back? Love, I feel heavy as lead. Some wine, in there, and food! Fortune knows we scorn her most when she hits us hardest."]], "873": [[0, 0, "Caesar, it's his children's tutor."], [1, 4, "That proves he's been plucked bare, if he sends such a poor feather from his wing, when not many months ago he had kings to spare as messengers."]], "876": [[0, 0, "Lowly as I am, I come from Antony."], [1, 3, "Until recently I was as unimportant to his affairs as the morning dew on a myrtle leaf is to the great sea."]], "878": [[0, 4, "He greets you as the master of his fortunes and asks to live in Egypt. If that isn't allowed, he asks for less, and begs you to let him breathe between heaven and earth as a private citizen in Athens. That's for him."], [5, 8, "Next, Cleopatra acknowledges your greatness, submits to your power, and asks you to let her heirs keep the crown of the Ptolemies, which now depends on your mercy."]], "883": [[0, 0, "[To Thyreus] Now's the time to test your skill with words. Hurry."], [1, 5, "Win Cleopatra away from Antony. Promise her in our name whatever she asks, and invent more offers of your own. Women aren't strong even when things are going well, but need will make even a pure Vestal virgin break her vows. Use your cunning, Thyreus."], [6, 7, "Name your own reward for your efforts, and we'll honour it as law."]], "893": [[0, 3, "Antony alone, who let his desire rule his reason. So what if you ran from that great face of war, where the ranks of ships terrified each other? Why did he have to follow?"], [4, 9, "The itch of his passion shouldn't have cut into his leadership at a time like that, when half the world was fighting the other half and he was the whole cause of it. It was as shameful as his defeat, to chase after your fleeing ships and leave his navy staring."]], "909": [[0, 0, "[Aside] My honesty and I are beginning to quarrel."], [1, 5, "Loyalty kept up towards fools turns faithfulness into plain foolishness. And yet the man who can bear to stay loyal to a fallen lord conquers the one who conquered his master, and earns a place in history."]], "915": [[0, 0, "He needs as many friends, sir, as Caesar has, or else he doesn't need us."], [1, 3, "If Caesar wishes, our master will jump at the chance to be his friend. As for us, you know we belong to whoever he belongs to, and that will be Caesar."]], "927": [[0, 3, "Most kind messenger, tell great Caesar this: through you, I kiss his conquering hand. Tell him I'm ready to lay my crown at his feet and kneel there."], [4, 5, "Tell him I'll hear Egypt's fate from his voice, which everyone obeys."]], "928": [[0, 0, "That's your noblest course."], [1, 4, "When wisdom and fortune fight each other, if wisdom dares only do what it can, nothing can shake it. Allow me to kiss your hand in respect."]], "934": [[0, 0, "Come here! Ah, you bird of prey! Now, gods and devils!"], [1, 1, "My authority is melting away."], [2, 4, "Not long ago, when I shouted 'Hey!', kings would rush forward like boys scrambling for coins and cry, 'What do you want? Are you deaf? I'm still Antony."]], "938": [[0, 0, "Moon and stars!"], [1, 6, "Whip him. Even if it were twenty of the greatest kings who pay tribute to Caesar, if I found them so cheeky with the hand of her here (what's her name, since she stopped being Cleopatra?), I'd have them whipped. Whip him, men, until you see him screw up his face like a boy and whine aloud for mercy. Take him away."]], "942": [[0, 0, "You were half rotten before I met you. Ha!"], [1, 4, "Did I leave my pillow in Rome untouched, give up having lawful children with a jewel of a woman, only to be deceived by someone who flirts with servants?"]], "944": [[0, 2, "You've always been unfaithful."], [3, 5, "But when we become hardened in our vices (oh, how miserable!), the wise gods blind us, drop our clear judgement in our own filth, make us worship our mistakes, and laugh at us while we strut towards our ruin."]], "948": [[0, 5, "Because you let a fellow who takes tips and says 'God reward you! get familiar with my playmate, your hand, this royal seal that pledges great hearts! Oh, I wish I were on the hill of Bashan, to roar louder than the horned bulls!"], [6, 8, "I have savage reasons, because I'm a cuckold, and to announce it politely would be like a man with a noose round his neck thanking the hangman for being quick."]], "954": [[0, 5, "If your father's alive, let him regret you weren't born his daughter. And be sorry to follow Caesar in his triumph, since you've been whipped for following him. From now on, may a lady's white hand give you a fever, and may you shake to look at one. Go back to Caesar."], [6, 9, "Tell him how you were treated. Make sure you say he's making me angry with him, because he seems proud and scornful, dwelling on what I am, not what he knew I was."], [10, 17, "He makes me angry, and right now that's very easy to do, when my lucky stars, which used to guide me, have left their places in the sky and shot their fire into the pit of hell. If he doesn't like what I've said and done, tell him he has Hipparchus, my freed slave, whom he can whip, hang or torture as he likes, to pay me back. Urge him to do it."], [18, 18, "Go, with your welts. Get out."]], "962": [[0, 4, "Ah, dear, if I am, let heaven make hail from my cold heart and poison it at the source, and let the first hailstone fall on my neck, and as it melts, may my life melt with it! Let the next one strike Caesarion!"], [5, 9, "Until, one by one, all my children, together with all my brave Egyptians, lie unburied as this storm of hailstones melts, until the flies and gnats of the Nile have buried them by eating them!"]], "963": [[0, 0, "I'm satisfied."], [1, 4, "Caesar is camped at Alexandria, where I'll fight his destiny. Our land army has held out nobly. Our scattered navy has come together again and floats, looking threatening as a warfleet should."], [5, 5, "Where have you been, my courage? Do you hear, lady?"], [6, 7, "If I come back from the battlefield once more to kiss these lips, I'll come covered in blood."], [8, 8, "My sword and I will earn our place in history."], [9, 9, "There's still hope."]], "969": [[0, 1, "Do it. We'll speak to them. And tonight I'll make the wine shine through their scars. Come on, my queen, there's still life in us."], [2, 4, "The next time I fight, I'll make death love me, because I'll compete even with his plague-bringing scythe."]], "977": [[0, 4, "Let our top officers know that tomorrow we mean to fight the last of many battles. Within our ranks there are enough men who served Mark Antony until recently to capture him. See to it."], [5, 6, "And give the army a feast. We have the supplies for it, and they've earned the extravagance. Poor Antony!"]], "992": [[0, 0, "And you're honest too."], [1, 4, "I wish I could be turned into as many men as you, and all of you rolled together into one Antony, so I could serve you as well as you've served me."]], "994": [[0, 0, "Well, my good fellows, wait on me tonight."], [1, 3, "Don't be stingy with my wine, and treat me as well as when my empire was your fellow servant too, and obeyed my orders."]], "997": [[0, 0, "Serve me tonight."], [1, 1, "Maybe it's the end of your service."], [2, 7, "Perhaps you won't see me again, or if you do, as a mangled ghost. Maybe tomorrow you'll serve another master. I look at you like a man saying goodbye. My honest friends, I'm not dismissing you. Like a master married to your good service, I'll keep you till I die."], [8, 9, "Serve me for two hours tonight, I ask no more, and may the gods reward you for it!"]], "998": [[0, 1, "What do you mean, sir, by upsetting them like this?"], [2, 3, "Look, they're crying, and I, like an ass, have eyes watering as if from onions. For shame, don't turn us into women."]], "999": [[0, 0, "Ho, ho, ho!"], [1, 1, "Now may the witch take me if I meant it like that!"], [2, 3, "May grace grow where those tears fall! My dear friends, you take me too gloomily."], [4, 9, "I spoke to comfort you. I wanted you to light up this night with torches. Know this, my hearts: I have good hopes for tomorrow, and I'll lead you where I expect a victorious life rather than an honourable death. Let's go to supper. Come, and drown our worries."]], "1045": [[0, 0, "Excellently, excellently."], [1, 7, "Anyone who unbuckles this before we choose to take it off to rest will face a storm. You're fumbling, Eros, and my queen is a better squire at this than you. Hurry up. Oh love, I wish you could see me fight today and understood this royal trade! You'd see a real craftsman at work."]], "1047": [[0, 0, "Good morning to you. Welcome."], [1, 1, "You look like a man who knows what a military command is."], [2, 3, "We get up early for work we love, and go to it with delight."]], "1053": [[0, 0, "That's a fine blast, lads."], [1, 4, "This morning starts early, like the spirit of a young man who means to make a name for himself. So, so. Come, give me that. This way. Well done. Goodbye, lady, whatever happens to me."], [5, 5, "[He kisses her."], [6, 10, "This is a soldier's kiss. It would deserve to be scolded and shamed if I stood here making ordinary polite speeches. I'll leave you now like a man of steel. Those of you who'll fight, follow me closely. I'll lead you to it. Goodbye."]], "1056": [[0, 0, "Lead me."], [1, 2, "He goes out bravely. If only he and Caesar could settle this great war in single combat!"], [3, 3, "Then, Antony... But now... Well, go on."]], "1064": [[0, 0, "Who?"], [1, 3, "Someone always close to you. Call for Enobarbus, and he won't hear you, or he'll answer from Caesar's camp, 'I'm not yours.'"]], "1070": [[0, 0, "Go, Eros, send his treasure after him. Do it."], [1, 2, "Don't keep back a scrap, I order you. Write to him (I'll sign it) with gentle farewells and greetings."], [3, 5, "Say I hope he never has reason to change masters again. Oh, my bad fortune has corrupted honest men! Hurry, Eros."]], "1082": [[0, 6, "Alexas deserted. He went to Judea on Antony's business, and there persuaded great Herod to side with Caesar and abandon his master Antony. For his trouble, Caesar has hanged him. Canidius and the others who deserted are given work, but not honourable trust."], [7, 8, "I've done wrong, and I blame myself so bitterly that I'll never be happy again."]], "1086": [[0, 0, "Don't joke, Enobarbus."], [1, 4, "I'm telling the truth. You'd better see the man who brought it safely out of the camp. I must get back to my duty, or I'd have done it myself. Your commander is still like Jupiter."]], "1088": [[0, 4, "I'm the only villain on earth, and I feel it most of all. Oh Antony, you goldmine of generosity, how would you have paid my better service, when you crown my wickedness with gold! This makes my heart swell."], [5, 6, "If grief doesn't break it quickly, a quicker means will beat grief to it. But I feel grief will do it."], [7, 9, "Fight against you? No. I'll go and find some ditch to die in. The filthiest suits the last part of my life best."]], "1108": [[0, 3, "We've beaten him back to his camp. Someone run ahead and tell the queen of our deeds. Tomorrow, before the sun sees us, we'll spill the blood that escaped today. I thank you all."], [4, 6, "You're brave fighters, and you fought not as if you were serving a cause, but as if it were each man's own, as it is mine. You've all been like Hector."], [7, 10, "Go into the city, hug your wives and friends, tell them your deeds, while they wash the dried blood from your wounds with tears of joy and kiss the honourable gashes until they heal. [To Scarus] Give me your hand."]], "1110": [[0, 2, "I'll praise your deeds to this great enchantress and let her thanks bless you. Oh you light of the world, put your arms round my armoured neck."], [3, 4, "Leap, clothes and all, through my tested armour to my heart, and ride there in triumph on its beating."]], "1112": [[0, 4, "My nightingale, we've beaten them back to their beds. What, girl! Though some grey hairs mix with our younger brown, we still have a brain that strengthens our muscles and can score goal for goal against youth."], [5, 8, "Look at this man. Give him your gracious hand to kiss. Kiss it, my warrior. He's fought today as if a god who hated mankind had destroyed it in his shape."]], "1114": [[0, 1, "He'd deserve it even if it were studded with rubies like the sun god's chariot."], [2, 2, "Give me your hand."], [3, 3, "Let's march merrily through Alexandria, carrying our battered shields like the men who own them."], [4, 8, "If our great palace could hold this whole army, we'd all have supper together and drink toasts to tomorrow's fate, which promises royal danger."], [9, 11, "Trumpeters, blast the city's ears with your brass noise, and mix it with our rattling drums, so heaven and earth can echo the sound together, applauding our return."]], "1127": [[0, 4, "Oh moon, queen of true sadness, squeeze the poisonous damp of the night onto me, so that life, which rebels against my will, may stop clinging to me. Throw my heart against the hard flint of my crime."], [5, 8, "It's so dried up with grief that it will break into powder and end all foul thoughts. Oh Antony, more noble than my desertion is shameful, forgive me yourself, but let the world record me as a deserter of his master and a runaway."], [9, 11, "Oh Antony! Oh Antony!"], [12, 12, "[He dies.]"]], "1144": [[0, 0, "I wish they'd fight in fire or in the air; we'd fight there too."], [1, 3, "But here's the plan. Our foot soldiers will stay with us on the hills next to the city."], [4, 6, "Orders have been given for the navy; they've left the harbour. Let's go forward to where we can best see their positions and watch what they do."]], "1157": [[0, 0, "All is lost."], [1, 1, "This foul Egyptian has betrayed me."], [2, 6, "My fleet has surrendered to the enemy, and over there they're throwing their caps in the air and drinking together like long-lost friends. Three-times-unfaithful whore! You've sold me to this beginner, and my heart makes war on you alone."], [7, 8, "Tell them all to run, because once I've had my revenge on my enchantress, I'm finished. Tell them all to run. Go."]], "1159": [[0, 0, "Oh sun, I'll never see you rise again."], [1, 6, "Fortune and Antony part here; right here we shake hands. Has it all come to this? The hearts that followed at my heels like spaniels, to whom I gave everything they wanted, are melting and dripping their sweetness onto Caesar, who's in full bloom. And this pine tree, which towered over them all, is stripped of its bark."], [7, 8, "I'm betrayed. Oh, this treacherous soul of Egypt!"], [9, 12, "This deadly enchantress, whose look sent out my wars and called them home, whose breast was my crown and my goal, like a real gypsy has cheated me, with her fast-and-loose tricks, into total ruin. Hey, Eros, Eros!"]], "1163": [[0, 2, "Vanish, or I'll give you what you deserve, and spoil Caesar's victory parade. Let him take you and hold you up to the cheering crowds."], [3, 7, "Follow his chariot, like the greatest stain on womankind. Be shown like a freak to the poorest people for pennies, and let patient Octavia plough up your face with her sharpened nails."]], "1165": [[0, 5, "It's good that you've gone, if it's good to live. But it would be better if you'd fallen victim to my fury, because one death might have prevented many. Eros, hey! The shirt of Nessus is burning me. Hercules, my ancestor, teach me your rage."], [6, 8, "Let me throw Lichas up onto the horns of the moon, and with the hands that held the heaviest club, destroy my noblest self. The witch will die."], [9, 10, "She's sold me to the young Roman boy, and I'm falling because of her plot. She'll die for it. Eros, hey!"]], "1170": [[0, 0, "To the monument!"], [1, 1, "Lock yourself in there, and send him word that you're dead."], [2, 3, "The soul and body don't tear apart more painfully at death than greatness does when it leaves a man."]], "1171": [[0, 1, "To the monument! Mardian, go and tell him I've killed myself."], [2, 3, "Say the last word I spoke was 'Antony', and please say it pitifully."], [4, 5, "Go, Mardian, and tell me how he takes my death. To the monument!"]], "1177": [[0, 5, "Sometimes we see a cloud that looks like a dragon; a mist sometimes like a bear or a lion, a towered castle, an overhanging rock, a jagged mountain, or a blue headland with trees on it, which nod to the world and fool our eyes with air."], [6, 6, "You've seen these sights; they're the shows of evening."]], "1181": [[0, 1, "My good lad Eros, your captain is just like that kind of shape now."], [2, 2, "Here I am, Antony, but I can't keep this visible shape, my lad."], [3, 10, "I fought these wars for Egypt, and the queen, whose heart I thought I had, because she had mine (and while it was mine, a million other hearts were attached to it, now lost), she, Eros, has stacked the cards with Caesar and cheated my glory into my enemy's victory. No, don't cry, gentle Eros. We still have ourselves to end ourselves."]], "1186": [[0, 3, "A person can only pay the debt of death once, and she's already paid it. What you wanted to do has been done for you. The last thing she said was 'Antony! Most noble Antony!"], [4, 7, "Then a tearing groan broke the name of Antony in the middle. It was divided between her heart and her lips. She gave up her life with your name buried in her."]], "1191": [[0, 2, "Off, pull it off! Not even the seven-layered shield of Ajax could keep this battering away from my heart. Oh, split open, my sides!"], [3, 5, "Heart, for once be stronger than the body that holds you; crack your fragile case! Quickly, Eros, quickly. No longer a soldier."], [6, 6, "Battered pieces of armour, go; you've been worn with honour. Leave me for a while."]], "1193": [[0, 6, "I'll catch up with you, Cleopatra, and weep for your forgiveness. It must be this way, because now any delay is torture. Since the torch is out, lie down and wander no further. Now every effort spoils what it does; yes, strength itself gets tangled in its own strength. Seal it, then, and all is done. Eros! I'm coming, my queen. Eros! Wait for me."], [7, 8, "Where souls lie on flowers in the afterlife, we'll walk hand in hand and make the ghosts stare at our lively bearing."], [9, 10, "Dido and her Aeneas will lose their admirers, and all the crowds will be ours. Come, Eros, Eros!"]], "1196": [[0, 12, "Since Cleopatra died, I've lived in such dishonour that the gods hate my lowness. I, who carved up the world with my sword and built cities of ships on green Neptune's back, accuse myself of having less courage than a woman, a less noble mind than she has, who by her death tells our Caesar, 'I am my own conqueror. You swore, Eros, that when the emergency came (and now it really has come), when I saw behind me the unavoidable chase of disgrace and horror, you would kill me when I ordered it. Do it. The time has come."], [13, 13, "You're not striking me; it's Caesar you're defeating."], [14, 14, "Put some colour in your cheeks."]], "1202": [[0, 1, "When I set you free, didn't you swear then to do this when I told you to?"], [2, 3, "Do it now, or all your past service was just accident without purpose. Draw your sword, and come."]], "1212": [[0, 2, "Why, there, then! [He falls on his sword. That's how I escape the sorrow of Antony's death."], [3, 3, "[He dies.]"]], "1213": [[0, 0, "Three times nobler than me!"], [1, 7, "You teach me, oh brave Eros, what I should do and you could not. My queen and Eros, by their brave example, have won a nobler place in history than me. But I'll be a bridegroom in my death and run into it as into a lover's bed. Come, then. And, Eros, your master dies as your pupil. To do this"]], "1238": [[0, 4, "Locked in her monument. She had a prophetic fear of what has happened. When she saw that you suspected she'd done a deal with Caesar (which will never be proved), and that your rage wouldn't calm down, she sent you word that she was dead."], [5, 7, "But afraid since then of what it might do, she's sent me to tell you the truth. And I've come, I fear, too late."]], "1245": [[0, 3, "No, my good fellows, don't please cruel fate by honouring it with your sorrow. Welcome what comes to punish us, and we punish it by seeming to bear it lightly. Pick me up."], [4, 5, "I've often led you; carry me now, good friends, and have my thanks for everything."]], "1251": [[0, 0, "No, I won't."], [1, 4, "Every strange and terrible event is welcome, but we despise comfort. The size of our sorrow, matching its cause, must be as great as what causes it."]], "1260": [[0, 5, "I don't dare, dear. My dear lord, forgive me, I don't dare come down, or I'll be captured. The proud victory parade of all-fortunate Caesar will never be decorated with me. If knives, drugs or snakes have edge, sting or power, I'm safe."], [6, 9, "Your wife Octavia, with her modest eyes and quiet judgement, will never win the honour of looking down primly on me. But come, come, Antony. Help me, my women. We must pull you up."], [10, 10, "Help, good friends."]], "1262": [[0, 0, "This is a fine game! How heavy my lord is!"], [1, 1, "All our strength has turned into heaviness, and that makes the weight."], [2, 5, "If I had great Juno's power, strong-winged Mercury would fetch you up and set you beside Jupiter. Yet come up a little. People who only wish were always fools. Oh, come, come."]], "1272": [[0, 7, "Don't grieve or mourn over the miserable change in my fortunes at my end. Instead please your thoughts by feeding them on my earlier fortunes, when I lived as the greatest prince in the world, the noblest. And now I don't die shamefully, or like a coward handing my helmet to my countryman, but as a Roman bravely conquered by a Roman. Now my spirit is leaving."], [8, 8, "I can't say more."]], "1273": [[0, 0, "Noblest of men, will you die?"], [1, 3, "Don't you care about me? Must I stay in this dull world, which without you is no better than a pigsty? Oh, look, my women,"]], "1284": [[0, 3, "No more than a woman, and ruled by the same poor emotions as the girl who milks the cows and does the lowest chores."], [4, 5, "I should throw my sceptre at the cruel gods and tell them this world was equal to theirs until they stole our jewel. Everything is worthless now."], [6, 9, "Patience is stupid, and impatience suits a mad dog. So is it a sin to rush into death's secret house before death dares to come to us? How are you, women?"], [10, 10, "What, what! Cheer up! Why, Charmian! My noble girls!"], [11, 15, "Ah, women, women, look, our lamp has burnt out; it's gone out! Good sirs, take heart. We'll bury him. And then, what's brave and noble, let's do it in the high Roman way, and make death proud to take us. Come, let's go."], [16, 16, "This body that held that huge spirit is cold now."], [17, 18, "Ah, women, women! Come. We have no friend but courage, and the quickest end."]], "1293": [[0, 0, "My name is Dercetas."], [1, 7, "I served Mark Antony, who was the most worthy of being served. While he stood and spoke, he was my master, and I wore my life to spend against his enemies. If you'll take me into your service, I'll be to you what I was to him. If not, I give you my life."]], "1297": [[0, 0, "He's dead, Caesar."], [1, 5, "Not killed by a public executioner or a hired knife, but by the same hand that wrote his honour in the deeds it did. With the courage his heart gave it, it split that heart. This is his sword."], [6, 7, "I stole it from his wound. Look, it's stained with his most noble blood."]], "1303": [[0, 0, "Oh Antony!"], [1, 14, "I've driven you to this! But we cut out diseases in our own bodies. I had no choice: I had to show you a day like this one of my decline, or watch yours. We couldn't both live in the whole world. Yet let me grieve, with tears as precious as heart's blood, that you, my brother, my partner in the highest enterprises, my fellow ruler of the empire, my friend and companion at the front of battle, the arm of my own body, and the heart that set my thoughts alight, that our stars, which could never be reconciled, should have split our equality like this. Listen to me, good friends... But I'll tell you at a better time."]], "1307": [[0, 0, "Tell her to take heart."], [1, 4, "She'll soon hear from some of our people how honourably and kindly we've decided to treat her. Caesar can't learn to be unkind."]], "1317": [[0, 1, "Never mind; I remember now what he's doing. He'll be ready soon."], [2, 3, "Come with me to my tent, where you'll see how reluctantly I was drawn into this war, and how calmly and gently I always went about it in all my letters."], [4, 6, "Come with me and see what I can show you."]], "1321": [[0, 1, "My loneliness is starting to make a better life for me. It's worthless to be Caesar."], [2, 4, "He's not Fortune, just Fortune's servant, carrying out her wishes."], [5, 7, "And it's a great thing to do the deed that ends all other deeds, that chains up accidents and locks out change, that sleeps and never again tastes the earth's breast that feeds both beggar and Caesar."]], "1327": [[0, 0, "Cheer up."], [1, 1, "You've fallen into a prince's hands; don't be afraid."], [2, 7, "Put yourself completely in my lord's hands. He's so full of grace that it overflows onto everyone in need. Let me tell him how sweetly you depend on him, and you'll find a conqueror who will ask others to help him be kind to you, when you kneel to him for mercy."]], "1337": [[0, 0, "Stop, worthy lady, stop!"], [1, 1, "[He seizes the dagger from her."], [2, 3, "Don't do yourself such harm. You've been rescued here, not betrayed."]], "1342": [[0, 0, "Sir, I won't eat food. I won't drink, sir."], [1, 4, "And if I have to talk nonsense to stay awake, I won't sleep either. I'll destroy this mortal body, whatever Caesar does. Know this, sir: I won't wait with my arms tied at your master's court, or be punished even once by the solemn look of dull Octavia."], [5, 13, "Will they hoist me up and show me to the jeering rabble of disapproving Rome? I'd rather have a ditch in Egypt as a gentle grave! I'd rather lie stark naked on the Nile's mud and let the water-flies lay their eggs on me until I'm disgusting! I'd rather make my country's high pyramids my gallows and hang there in chains!"]], "1358": [[0, 2, "His legs straddled the ocean; his raised arm was like a crest over the world. His voice had the music of all the singing spheres, and that was for his friends."], [3, 10, "But when he wanted to terrify and shake the globe, he was like rattling thunder. As for his generosity, there was no winter in it. It was an autumn that grew richer the more it was harvested. His pleasures were like dolphins: they showed his back above the element they lived in. Kings and princes walked among his servants. Kingdoms and islands were like coins dropped from his pocket."]], "1362": [[0, 0, "You lie, loudly enough for the gods to hear."], [1, 5, "But if there is, or ever was, such a man, he's beyond the size of dreams. Nature usually lacks the material to compete with imagination in creating wonderful shapes. Yet to imagine an Antony was nature's masterpiece against imagination, putting all fantasies to shame."]], "1363": [[0, 0, "Listen to me, good madam."], [1, 5, "Your loss is as great as you are, and you bear it as its weight deserves. May I never achieve what I'm aiming for if I don't feel, as an echo of your grief, a sorrow that strikes the very root of my heart."]], "1378": [[0, 0, "Don't think harshly."], [1, 3, "Though the record of the injuries you did us is written in our flesh, we'll remember them as things that happened by chance."]], "1380": [[0, 1, "Cleopatra, understand that we'll make light of your faults rather than press them."], [2, 9, "If you go along with our intentions, which are very gentle towards you, you'll benefit from this change. But if you try to make me look cruel by following Antony's example, you'll lose my good intentions, and put your children in the danger I'll protect them from if you rely on me. I'll take my leave."]], "1390": [[0, 1, "See, Caesar! Oh, look how greatness is followed!"], [2, 2, "My servants will now be yours, and if we swapped places, yours would be mine."], [3, 7, "This Seleucus's ingratitude makes me wild. Oh slave, no more to be trusted than paid-for love! What, are you backing away? You'll back away, I promise you. But I'll catch your eyes even if they had wings. Slave, soulless villain, dog!"], [8, 8, "Oh, exceptionally low!"]], "1392": [[0, 13, "Oh Caesar, what a wounding shame this is! That when you condescend to visit me here, honouring someone so humble with your lordly presence, my own servant should add to the sum of my disgraces with his malice! Say, good Caesar, that I have kept back some ladies' trinkets, unimportant toys, the kind of things we give to ordinary friends. And say I've kept some nobler gift aside for Livia and Octavia, to win them to plead for me. Must I be exposed by someone I raised myself? Gods! It strikes me lower than my fall already has."], [14, 17, "[To Seleucus] Please go away, or I'll show the sparks of my spirit through the ashes of my fortune. If you were a man, you'd have pity on me."]], "1396": [[0, 5, "Cleopatra, we won't count what you've kept back, or what you've declared, as part of our conquest. Let it stay yours. Give it away as you like, and believe me, Caesar isn't a merchant who'll bargain with you over things merchants sell."], [6, 6, "So cheer up. Don't make your thoughts your prison."], [7, 8, "No, dear queen, because we plan to treat you as you yourself advise. Eat and sleep."], [9, 10, "Our care and pity for you are so great that we remain your friend. And so, goodbye."]], "1410": [[0, 4, "Madam, as I swore to you at your command, which my love makes a religious duty to obey, I'm telling you this: Caesar plans to travel through Syria, and within three days he'll send you and your children ahead of him."], [5, 6, "Make the best use of this. I've done what you wanted and kept my promise."]], "1415": [[0, 0, "Now, Iras, what do you think?"], [1, 6, "You, an Egyptian puppet, will be put on show in Rome as well as me. Working-class slaves in greasy aprons, with rulers and hammers, will lift us up for everyone to see. We'll be wrapped in the clouds of their bad breath, stinking of coarse food, and forced to breathe it in."]], "1423": [[0, 4, "Now, Charmian! Dress me like a queen, my women. Go and fetch my best clothes. I'm going to Cydnus again, to meet Mark Antony. Go, Iras. Now, noble Charmian, we'll really finish things."], [5, 6, "And when you've done this job, I'll give you leave to play until doomsday. Bring our crown and everything."]], "1430": [[0, 1, "What a humble instrument can do a noble deed! He brings me freedom."], [2, 5, "My mind's made up, and there's nothing of a woman in me now. From head to foot I'm as steady as marble. The changing moon is no longer my planet."]], "1438": [[0, 1, "Lots, men and women too. I heard about one of them only yesterday: a very honest woman, but a bit inclined to lie, which a woman shouldn't do except honestly."], [2, 6, "She told how she died of the bite and what pain she felt. Truly, she gives the worm a very good report. But anyone who believes everything they say will never be saved by half of what they do. But this is most fallible: the worm's an odd worm."]], "1454": [[0, 7, "Give me my robe, put on my crown. I have immortal longings in me. Now the juice of Egypt's grapes will never wet this lip again. Quick, quick, good Iras, hurry. I think I hear Antony calling. I see him getting up to praise my noble act. I hear him mocking Caesar's luck, which the gods give men to excuse their anger later. Husband, I'm coming."], [8, 8, "Now let my courage prove my right to that name!"], [9, 10, "I'm fire and air; my other elements, earth and water, I leave to baser life. So, have you finished?"], [11, 11, "Come then, and take the last warmth of my lips."], [12, 12, "Goodbye, kind Charmian. Iras, a long goodbye."], [13, 13, "[She kisses them. Iras falls and dies."], [14, 14, "Do I have the snake's poison on my lips?"], [15, 17, "Are you falling? If you and life can part so gently, death's blow is like a lover's pinch, which hurts and is wanted. Are you lying still?"], [18, 19, "If you vanish like this, you tell the world it isn't worth saying goodbye to."]], "1456": [[0, 0, "This makes me look low."], [1, 4, "If she meets curly-haired Antony first, he'll ask her about me and spend on her the kiss that is my heaven to have. Come, you deadly little wretch, [to an asp, which she puts to her breast] with your sharp teeth untie this tangled knot of life at once."], [5, 9, "Poor poisonous fool, be angry and get it done. Oh, if you could speak, so I could hear you call great Caesar an ass, outwitted!"]], "1460": [[0, 2, "As sweet as perfume, as soft as air, as gentle... Oh Antony! No, I'll take you too. [She puts another asp to her arm."], [3, 4, "Why should I stay... [She falls on a bed and dies.]"]], "1461": [[0, 2, "...in this vile world? So, goodbye. Now boast, death: you have in your power a girl without equal."], [3, 4, "Soft eyelids, close, and may golden Apollo the sun never be seen by such royal eyes again! Your crown's crooked."], [5, 5, "I'll straighten it, and then play."]], "1477": [[0, 3, "Caesar, your fears have come true. You're coming yourself to see the dreaded act done which you tried so hard to prevent."], [4, 4, "[Voices offstage] Make way there, make way for Caesar!"]], "1480": [[0, 2, "Bravest at the end, she guessed our plans, and being royal, she took her own way. How did they die?"], [3, 3, "I don't see any blood."]], "1484": [[0, 1, "Oh Caesar, this Charmian was alive just now. She stood and spoke."], [2, 4, "I found her straightening the crown on her dead mistress. She stood there trembling, and suddenly dropped."]], "1488": [[0, 5, "Very likely that's how she died, because her doctor tells me she's carried out endless experiments on easy ways to die. Pick up her bed, and carry her women out of the monument. She'll be buried beside her Antony."], [6, 11, "No grave on earth will hold such a famous pair. Great events like these strike even those who caused them, and their story is no less pitiful than the glory of the man who brought them to be mourned. Our army will attend this funeral in solemn procession, and then on to Rome."], [12, 13, "Come, Dolabella, see that this great ceremony is done with dignity."]]};
const PARTS={"110": [[0, 5, "There's a great spirit gone! And I wished for it. What we throw away in contempt we often want back again. A present pleasure, as time turns, becomes its own opposite. She seems good now she's gone. The hand that pushed her away would pull her back."], [6, 8, "I must break away from this enchanting queen. My idleness is hatching ten thousand harms, beyond the troubles I already know about. Hey, Enobarbus!"]], "129": [[0, 4, "No more joking. Let our officers know what we're planning. I'll tell the queen why we must hurry, and get her permission to leave. It's not just Fulvia's death and more urgent matters that call me;"], [5, 12, "letters from many friends working for us in Rome are begging me to come home. Sextus Pompeius has challenged Caesar and controls the sea. Our fickle people, who never love a man until his great deeds are over, are starting to transfer all the honours of Pompey the Great onto his son."], [13, 20, "He's grown so powerful in name and strength, and even more in spirit and energy, that he stands as the greatest soldier of all. If his power keeps growing, the whole world may be in danger. Much is brewing, like the horse's hair that was said to come alive in water: it has life, but not yet a serpent's poison. Tell those who serve under us that we wish to leave here quickly."]], "159": [[0, 5, "Listen to me, queen. The urgent needs of the moment require my service for a while, but my whole heart stays here with you. Italy is glittering with the swords of civil war. Sextus Pompeius is advancing on Rome itself."], [6, 11, "When two powers at home are equally matched, petty factions grow. Those who were hated, now they're strong, are suddenly loved. Pompey, though condemned, is rich in his father's fame and is quickly winning the hearts of those who haven't done well under the present government, and there are enough of them to be a threat."], [12, 15, "And peace, sick of too much quiet, wants to cure itself with any desperate change. My more personal reason, and the one that should most reassure you about my going, is Fulvia's death."]], "181": [[0, 3, "You're too kind. Let's agree it isn't wrong to roll around in bed with Ptolemy's queen, to give away a kingdom for a joke, to take turns drinking with a slave, to stagger through the streets at noon and trade punches with rogues who stink of sweat."], [4, 10, "Say this suits him, though he'd have to be a rare man indeed not to be stained by such things. Even so, Antony can't excuse his failings when we have to carry so much weight because of his frivolity."], [11, 17, "If he filled his free time with pleasure, upset stomachs and diseased bones would make him pay for it. But to waste time that drums him back to duty, and that matters so much to his position and ours, deserves a scolding, the way we scold boys who know better but trade what they've learned for pleasure, and so rebel against good sense."]], "187": [[0, 9, "Antony, give up your lustful partying. When you were defeated at Modena, where you killed the consuls Hirtius and Pansa, famine followed close behind you. You fought it, though you'd been raised in luxury, with more endurance than savages could. You drank horses' urine and slimy puddles that animals would choke on. Your taste then accepted the hardest berry on the roughest hedge."], [10, 16, "Yes, like a stag when snow covers the pasture, you ate the bark off trees. In the Alps, they say, you ate strange meat that killed some men just to look at. And all this (it hurts your honour that I mention it now) you endured so like a soldier that your face didn't even get thinner."]], "211": [[0, 7, "Oh, Charmian, where do you think he is now? Is he standing or sitting? Or is he walking? Or is he on his horse? Oh, happy horse, to carry Antony's weight! Do well, horse! Do you know who you're carrying? The half-Atlas who holds up the world, the arm and helmet of mankind. He's speaking now, or murmuring, 'Where's my serpent of old Nile?"], [8, 16, "That's what he calls me. Now I'm feeding myself the most delicious poison. Think of me, who am tanned black by the sun's loving pinches and deeply wrinkled with age? Julius Caesar, with your broad forehead, when you were alive I was a dish fit for a king. And great Pompey would stand and fix his eyes on my face; he'd anchor his gaze there and die looking at what he lived for."]], "240": [[0, 3, "He's dreaming. I know they're in Rome together, waiting for Antony. Lustful Cleopatra, may all the charms of love sweeten your faded lips! Let witchcraft join with beauty, and lust with both!"], [4, 8, "Keep the pleasure-seeker tied up in a world of feasts and keep his brain fogged with wine. May gourmet cooks sharpen his appetite with sauces that never sicken him, so that sleeping and eating put off his sense of honour until he forgets it completely."]], "246": [[0, 7, "I don't know, Menas, how smaller quarrels may give way to bigger ones. If we weren't standing up against all of them, it's likely they'd fight among themselves, because they've got enough reasons to draw their swords. But we don't yet know how far fear of us may patch up their divisions and heal their petty differences."], [8, 10, "Let it be as the gods want! Our lives depend on using all our strength. Come, Menas."]], "275": [[0, 4, "You've got it wrong. My brother never used my name in what he did. I looked into it, and I heard from reliable men who fought on your side."], [5, 9, "Didn't he undermine my authority as much as yours, and make war against my wishes, since your cause was the same as mine? My letters already proved this to you. If you want to patch together a quarrel, and you've no real material to make one from, it can't be with this."]], "286": [[0, 6, "Neglected, rather, and at a time when poisoned hours had made me forget myself. As far as I can, I'll apologise to you. But my honesty won't make my greatness smaller, and my power won't act without honesty. The truth is that Fulvia made war here to get me out of Egypt."], [7, 9, "Since I was the unknowing cause, I ask pardon as far as my honour allows me to stoop in such a case."]], "301": [[0, 7, "To keep you friends forever, to make you brothers and tie your hearts with a knot that won't slip, let Antony take Octavia as his wife. Her beauty deserves nothing less than the best of men as a husband, and her virtue and graces say more than anyone else could."], [8, 14, "With this marriage, all the small suspicions that now seem great, and all the great fears that now seem dangerous, would come to nothing. True stories would be dismissed as gossip, where now half-truths are believed. Her love for both of you would draw you to each other, and draw everyone's love to you both. Forgive what I've said. It's a considered idea, not a sudden one, thought over out of duty."]], "330": [[0, 7, "I'll tell you. The barge she sat in shone like a polished throne and seemed to burn on the water. The stern was beaten gold. The sails were purple and so perfumed that the winds were lovesick for them. The oars were silver and kept time to the music of flutes, making the water they struck follow faster, as if it were in love with their strokes."], [8, 15, "As for her, she was beyond all description. She lay in her tent, made of gold cloth, looking more beautiful than a painting of Venus in which imagination outdoes nature. On each side of her stood pretty, dimpled boys, like smiling Cupids, with many-coloured fans whose breeze seemed to make her delicate cheeks glow even as it cooled them, undoing what it did."]], "332": [[0, 8, "Her ladies, like sea nymphs, like so many mermaids, waited on her every look, and made their bows look graceful. A woman like a mermaid steered at the helm. The silk ropes swelled at the touch of those flower-soft hands that handled them so skilfully. A strange, invisible perfume drifted from the barge and filled the senses of everyone on the nearby wharves."], [9, 12, "The whole city poured out its people to see her, and Antony, sitting on a throne in the market-place, was left alone, whistling to the air. The air itself would have gone to gaze at Cleopatra too, except that would have left an empty space in nature."]], "452": [[0, 8, "To all three of you, the only rulers of this great world, the gods' chief agents: I don't see why my father should lack avengers, since he has a son and friends, when Julius Caesar, whose ghost appeared to good Brutus at Philippi, saw you fighting for him there. What made pale Cassius plot?"], [9, 15, "And what made the honoured, honest Roman Brutus, with the other armed lovers of sweet freedom, soak the Capitol in blood, except that they wanted a man to be only a man, not a king? That's why I've rigged up my navy, whose weight makes the angry ocean foam. With it I meant to punish the ingratitude that spiteful Rome showed to my noble father."]], "591": [[0, 4, "Everyone hold hands. Batter our ears with loud music, while I put you in place. Then the boy will sing, and every man will roar the chorus as loudly as his strong lungs can. [Music plays. Enobarbus places them hand in hand."], [5, 11, "SONG: Come, you king of the vine, chubby Bacchus with pink eyes! Let our troubles be drowned in your vats, let our hair be crowned with your grapes. Fill our cups till the world spins round, fill our cups till the world spins round!"]], "608": [[0, 4, "Oh Silius, Silius, I've done enough. Remember, a man of lower rank can achieve too much. Learn this, Silius: better leave a thing undone than win too great a fame by it while the man we serve is away."], [5, 9, "Caesar and Antony have always won more through their officers than in person. Sossius, who held my post in Syria as Antony's lieutenant, lost his favour because he piled up glory too quickly."], [10, 16, "Whoever does more in war than his commander becomes his commander's commander. And ambition, a soldier's virtue, would rather accept a loss than a gain that puts him in the shade. I could do more to help Antony, but it would offend him, and once he was offended, all my achievements would count for nothing."]], "705": [[0, 4, "No, no, Octavia, not just that. That would be forgivable, that and thousands more things like it. But he's started new wars against Pompey, made his will and read it out in public."], [5, 9, "He spoke slightingly of me. When he couldn't avoid praising me, he did it coldly and grudgingly and gave me as little credit as possible. When he had the best opportunity, he didn't take it, or he spoke through gritted teeth."]], "706": [[0, 6, "Oh my good lord, don't believe everything, or if you must believe it, don't resent all of it. If this split happens, there was never a more unhappy lady standing between two sides, praying for both. The good gods will surely mock me when I pray, 'Oh, bless my lord and husband!"], [7, 10, "and then cancel that prayer by crying just as loudly, 'Oh, bless my brother! 'Husband win' and 'brother win': each prayer destroys the other. There's no middle way between these extremes."]], "728": [[0, 5, "Scorning Rome, he's done all this and more in Alexandria. This is how it happened. In the market-place, on a silver platform, Cleopatra and he sat publicly enthroned on golden chairs. At their feet sat Caesarion, whom they call my father's son, and all the illegitimate children their lust has produced since."], [6, 10, "He gave her the rule of Egypt and made her absolute queen of lower Syria, Cyprus and Lydia."]], "744": [[0, 5, "Why have you crept up on us like this? You don't arrive like Caesar's sister. The wife of Antony should have an army to announce her, and the neighing of horses telling of her approach long before she appeared. The trees along the road should have been full of people climbing them to see, and the crowds should have fainted with longing to see her."], [6, 13, "Why, the dust raised by your huge escort should have risen to the roof of heaven. But you've come to Rome like a girl going to market, and prevented us from showing our love, which, when it isn't shown, often goes unfelt. We should have met you by sea and land, greeting you more grandly at every stage."]], "750": [[0, 6, "No, my most wronged sister. Cleopatra has beckoned him to her. He's given his empire to a whore, and now they're gathering the kings of the earth for war. He's collected Bocchus, king of Libya; Archelaus of Cappadocia; Philadelphos, king of Paphlagonia; the Thracian king Adallas;"], [7, 11, "King Manchus of Arabia; the King of Pontus; Herod of Judea; Mithridates, king of Commagene; Polemon and Amyntas, the kings of Media and Lycaonia, and a longer list of kings besides."]], "752": [[0, 5, "Welcome here. Your letters held us back from breaking out against him, until we saw how you were misled and how dangerously careless we were being. Cheer up. Don't be troubled by the times, which force these harsh necessities on your happiness."], [6, 12, "Let what fate has decided go its way without grieving. Welcome to Rome; nothing is dearer to me. You've been wronged beyond belief, and the high gods, to do you justice, are making us and those who love you their agents. Take comfort, and always be welcome here."]], "841": [[0, 5, "I've run away myself, and taught cowards to turn and show their backs. Friends, go. I've decided on a course that doesn't need you. Go. My treasure's in the harbour; take it. Oh, I followed what I'm ashamed to look at. Even my hair is rebelling:"], [6, 14, "the white hairs scold the brown ones for being rash, and the brown ones scold the white for being cowardly and foolish. Friends, go. I'll give you letters to some friends who'll clear your way for you. Please don't look sad or show you're unwilling. Take the hint my despair is giving you. Let what abandons itself be abandoned. Go straight to the shore. I'll give you that ship and the treasure."], [15, 17, "Please leave me for a while. Please, now. No, do it, because I've lost the right to command you, so I'm asking you. I'll see you soon."]], "878": [[0, 4, "He greets you as the master of his fortunes and asks to live in Egypt. If that isn't allowed, he asks for less, and begs you to let him breathe between heaven and earth as a private citizen in Athens. That's for him."], [5, 8, "Next, Cleopatra acknowledges your greatness, submits to your power, and asks you to let her heirs keep the crown of the Ptolemies, which now depends on your mercy."]], "893": [[0, 3, "Antony alone, who let his desire rule his reason. So what if you ran from that great face of war, where the ranks of ships terrified each other? Why did he have to follow?"], [4, 9, "The itch of his passion shouldn't have cut into his leadership at a time like that, when half the world was fighting the other half and he was the whole cause of it. It was as shameful as his defeat, to chase after your fleeing ships and leave his navy staring."]], "954": [[0, 5, "If your father's alive, let him regret you weren't born his daughter. And be sorry to follow Caesar in his triumph, since you've been whipped for following him. From now on, may a lady's white hand give you a fever, and may you shake to look at one. Go back to Caesar."], [6, 9, "Tell him how you were treated. Make sure you say he's making me angry with him, because he seems proud and scornful, dwelling on what I am, not what he knew I was."], [10, 18, "He makes me angry, and right now that's very easy to do, when my lucky stars, which used to guide me, have left their places in the sky and shot their fire into the pit of hell. If he doesn't like what I've said and done, tell him he has Hipparchus, my freed slave, whom he can whip, hang or torture as he likes, to pay me back. Urge him to do it. Go, with your welts. Get out."]], "962": [[0, 4, "Ah, dear, if I am, let heaven make hail from my cold heart and poison it at the source, and let the first hailstone fall on my neck, and as it melts, may my life melt with it! Let the next
