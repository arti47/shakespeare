sked."}, {"t": "sp", "who": "POMPEY", "lines": ["How should that be?"], "id": 563, "m": "How could that happen?"}, {"t": "sp", "who": "MENAS", "lines": ["But entertain it,", "And though you think me poor, I am the man", "Will give thee all the world."], "id": 564, "m": "Just consider it, and though you think me poor, I'm the man who'll give you the whole world."}, {"t": "sp", "who": "POMPEY", "lines": ["Hast thou drunk well?"], "id": 565, "m": "Have you been drinking?"}, {"t": "sp", "who": "MENAS", "lines": ["No, Pompey, I have kept me from the cup.", "Thou art, if thou dar'st be, the earthly Jove:", "Whate'er the ocean pales or sky inclips", "Is thine, if thou wilt have't."], "id": 566, "m": "No, Pompey, I've stayed away from the cup. If you dare, you can be Jupiter on earth. Whatever the ocean encloses or the sky embraces is yours, if you want it."}, {"t": "sp", "who": "POMPEY", "lines": ["Show me which way."], "id": 567, "m": "Show me how."}, {"t": "sp", "who": "MENAS", "lines": ["These three world-sharers, these competitors,", "Are in thy vessel: let me cut the cable;", "And when we are put off, fall to their throats:", "All then is thine."], "id": 568, "m": "These three sharers of the world, these partners, are on your ship. Let me cut the anchor cable, and when we're out at sea, cut their throats. Then everything is yours."}, {"t": "sp", "who": "POMPEY", "lines": ["Ah, this thou shouldst have done,", "And not have spoke on't! In me 'tis villainy:", "In thee't had been good service. Thou must know", "'Tis not my profit that does lead mine honour:", "Mine honour it. Repent that e'er thy tongue", "Hath so betray'd thine act: being done unknown,", "I should have found it afterwards well done;", "But must condemn it now. Desist, and drink."], "id": 569, "m": "Ah, you should have done this and not told me! For me it's villainy; for you it would have been good service. You must understand that my profit doesn't lead my honour; my honour leads it. Regret that your tongue gave away what you were going to do. If you'd done it without my knowing, I'd have approved afterwards. But now I must condemn it. Stop, and drink."}, {"t": "sp", "who": "MENAS", "lines": ["[Aside.] For this,", "I'll never follow thy pall'd fortunes more.", "Who seeks, and will not take when once 'tis offer'd,", "Shall never find it more."], "id": 570, "m": "[Aside] Because of this, I'll never follow your faded fortunes again. Whoever looks for something and won't take it when it's offered will never find it again."}, {"t": "sp", "who": "POMPEY", "lines": ["This health to Lepidus!"], "id": 571, "m": "Here's to Lepidus!"}, {"t": "sp", "who": "ANTONY", "lines": ["Bear him ashore. I'll pledge it for him, Pompey."], "id": 572, "m": "Carry him ashore. I'll drink his toast for him, Pompey."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Here's to thee, Menas!"], "id": 573, "m": "Here's to you, Menas!"}, {"t": "sp", "who": "MENAS", "lines": ["Enobarbus, welcome!"], "id": 574, "m": "Welcome, Enobarbus!"}, {"t": "sp", "who": "POMPEY", "lines": ["Fill till the cup be hid."], "id": 575, "m": "Fill the cup till it overflows."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["There's a strong fellow, Menas."], "id": 576, "m": "There's a strong fellow, Menas."}, {"t": "sd", "text": "Pointing to the servant who carries off Lepidus.", "id": 577}, {"t": "sp", "who": "MENAS", "lines": ["Why?"], "id": 578, "m": "Why?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["'A bears the third part of the world, man; see'st not?"], "id": 579, "m": "He's carrying a third of the world, man. Can't you see?"}, {"t": "sp", "who": "MENAS", "lines": ["The third part, then, is drunk; would it were all,", "That it might go on wheels!"], "id": 580, "m": "Then a third of the world is drunk. I wish the whole of it were, so it could go round on wheels!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Drink thou; increase the reels."], "id": 581, "m": "Drink, then. Make it spin faster."}, {"t": "sp", "who": "MENAS", "lines": ["Come."], "id": 582, "m": "Come on."}, {"t": "sp", "who": "POMPEY", "lines": ["This is not yet an Alexandrian feast."], "id": 583, "m": "This isn't an Alexandrian feast yet."}, {"t": "sp", "who": "ANTONY", "lines": ["It ripens towards it.--Strike the vessels, ho!--", "Here is to Caesar!"], "id": 584, "m": "It's getting there. Clink the cups! Here's to Caesar!"}, {"t": "sp", "who": "CAESAR", "lines": ["I could well forbear't.", "It's monstrous labour when I wash my brain", "And it grows fouler."], "id": 585, "m": "I'd rather not. It's hard work when I wash my brain and it only gets dirtier."}, {"t": "sp", "who": "ANTONY", "lines": ["Be a child o' the time."], "id": 586, "m": "Go with the times."}, {"t": "sp", "who": "CAESAR", "lines": ["Possess it, I'll make answer:", "But I had rather fast from all four days", "Than drink so much in one."], "id": 587, "m": "'Be master of the times', I'd answer. But I'd rather fast for four days than drink so much in one."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[To Antony.] Ha, my brave emperor!", "Shall we dance now the Egyptian Bacchanals", "And celebrate our drink?"], "id": 588, "m": "[To Antony] Ha, my brave commander! Shall we dance the Egyptian Bacchanals now and celebrate our drinking?"}, {"t": "sp", "who": "POMPEY", "lines": ["Let's ha't, good soldier."], "id": 589, "m": "Let's do it, good soldier."}, {"t": "sp", "who": "ANTONY", "lines": ["Come, let's all take hands,", "Till that the conquering wine hath steep'd our sense", "In soft and delicate Lethe."], "id": 590, "m": "Come, let's all hold hands, until the conquering wine has soaked our senses in soft, sweet forgetfulness."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["All take hands.--", "Make battery to our ears with the loud music:--", "The while I'll place you: then the boy shall sing;", "The holding every man shall bear as loud", "As his strong sides can volley.", "[Music plays. Enobarbus places them hand in hand.]", "~Come, thou monarch of the vine,", "~Plumpy Bacchus with pink eyne!", "~In thy fats our cares be drown'd,", "~With thy grapes our hairs be crown'd:", "~Cup us, till the world go round,", "~Cup us, till the world go round!"], "id": 591, "m": "Everyone hold hands. Batter our ears with loud music, while I put you in place. Then the boy will sing, and every man will roar the chorus as loudly as his strong lungs can. [Music plays. Enobarbus places them hand in hand.] SONG: Come, you king of the vine, chubby Bacchus with pink eyes! Let our troubles be drowned in your vats, let our hair be crowned with your grapes. Fill our cups till the world spins round, fill our cups till the world spins round!"}, {"t": "sp", "who": "CAESAR", "lines": ["What would you more?--Pompey, good night. Good brother,", "Let me request you off: our graver business", "Frowns at this levity.--Gentle lords, let's part;", "You see we have burnt our cheeks: strong Enobarb", "Is weaker than the wine; and mine own tongue", "Splits what it speaks: the wild disguise hath almost", "Antick'd us all. What needs more words. Good night.--", "Good Antony, your hand."], "id": 592, "m": "What more do you want? Pompey, good night. Good brother, let me ask you to leave. Our serious business frowns at this frivolity. Gentle lords, let's part. You see we've all gone red in the face. Strong Enobarbus is weaker than the wine, and my own tongue trips over its words. This wild disguise has almost turned us all into clowns. Why say more? Good night. Good Antony, your hand."}, {"t": "sp", "who": "POMPEY", "lines": ["I'll try you on the shore."], "id": 593, "m": "I'll take you on, on the shore."}, {"t": "sp", "who": "ANTONY", "lines": ["And shall, sir: give's your hand."], "id": 594, "m": "So you will, sir. Give me your hand."}, {"t": "sp", "who": "POMPEY", "lines": ["O Antony,", "You have my father's house,--but, what? we are friends.", "Come, down into the boat."], "id": 595, "m": "Oh Antony, you have my father's house. But what does it matter? We're friends. Come down into the boat."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Take heed you fall not."], "id": 596, "m": "Mind you don't fall."}, {"t": "sd", "text": "Exeunt Pompey, Caesar, Antony, and Attendants.", "id": 597}, {"t": "sp", "who": "ENOBARBUS", "cont": 1, "lines": ["Menas, I'll not on shore."], "id": 598, "m": "Menas, I won't go ashore."}, {"t": "sp", "who": "MENAS", "lines": ["No, to my cabin.--", "These drums!--these trumpets, flutes! what!--", "Let Neptune hear we bid a loud farewell", "To these great fellows: sound and be hang'd, sound out!"], "id": 599, "m": "No, come to my cabin. These drums! These trumpets, flutes! Let Neptune hear us say a loud farewell to these great men. Play, and be hanged, play loud!"}, {"t": "sd", "text": "A flourish of trumpets, with drums.", "id": 600}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Hoo! says 'a.--There's my cap."], "id": 601, "m": "Hooray! he says. There goes my cap."}, {"t": "sp", "who": "MENAS", "lines": ["Hoo!--noble captain, come."], "id": 602, "m": "Hooray! Noble captain, come."}, {"t": "sd", "text": "Exeunt.", "id": 603}, {"t": "scene", "act": 3, "scene": "I", "loc": "A plain in Syria.", "id": 604}, {"t": "sd", "text": "Enter Ventidius, in triumph, with Silius and other Romans, Officers and Soldiers; the dead body of Pacorus borne in front.", "id": 605}, {"t": "sp", "who": "VENTIDIUS", "lines": ["Now, darting Parthia, art thou struck; and now", "Pleas'd fortune does of Marcus Crassus' death", "Make me revenger.--Bear the king's son's body", "Before our army.--Thy Pacorus, Orodes,", "Pays this for Marcus Crassus."], "id": 606, "m": "Now, Parthia, you who shoot your darts, you've been struck. And now kind fortune makes me the avenger of Marcus Crassus's death. Carry the king's son's body in front of our army. Orodes, your son Pacorus pays this price for Marcus Crassus."}, {"t": "sp", "who": "SILIUS", "lines": ["Noble Ventidius,", "Whilst yet with Parthian blood thy sword is warm", "The fugitive Parthians follow; spur through Media,", "Mesopotamia, and the shelters whither", "The routed fly: so thy grand captain Antony", "Shall set thee on triumphant chariots, and", "Put garlands on thy head."], "id": 607, "m": "Noble Ventidius, while your sword is still warm with Parthian blood, chase the fleeing Parthians. Ride hard through Media, Mesopotamia and every hiding place the beaten army runs to. Then your great commander Antony will set you in a victory chariot and put garlands on your head."}, {"t": "sp", "who": "VENTIDIUS", "lines": ["O Silius, Silius,", "I have done enough: a lower place, note well,", "May make too great an act; for learn this, Silius,--", "Better to leave undone, than by our deed", "Acquire too high a fame when him we serve's away.", "Caesar and Antony have ever won", "More in their officer, than person: Sossius,", "One of my place in Syria, his lieutenant,", "For quick accumulation of renown,", "Which he achiev'd by the minute, lost his favour.", "Who does i' the wars more than his captain can", "Becomes his captain's captain; and ambition,", "The soldier's virtue, rather makes choice of loss", "Than gain which darkens him.", "I could do more to do Antonius good,", "But 'twould offend him; and in his offence", "Should my performance perish."], "id": 608, "m": "Oh Silius, Silius, I've done enough. Remember, a man of lower rank can achieve too much. Learn this, Silius: better leave a thing undone than win too great a fame by it while the man we serve is away. Caesar and Antony have always won more through their officers than in person. Sossius, who held my post in Syria as Antony's lieutenant, lost his favour because he piled up glory too quickly. Whoever does more in war than his commander becomes his commander's commander. And ambition, a soldier's virtue, would rather accept a loss than a gain that puts him in the shade. I could do more to help Antony, but it would offend him, and once he was offended, all my achievements would count for nothing."}, {"t": "sp", "who": "SILIUS", "lines": ["Thou hast, Ventidius, that", "Without the which a soldier and his sword", "Grants scarce distinction. Thou wilt write to Antony?"], "id": 609, "m": "Ventidius, you have that good sense without which a soldier is hard to tell apart from his sword. Will you write to Antony?"}, {"t": "sp", "who": "VENTIDIUS", "lines": ["I'll humbly signify what in his name,", "That magical word of war, we have effected;", "How, with his banners, and his well-paid ranks,", "The ne'er-yet-beaten horse of Parthia", "We have jaded out o' the field."], "id": 610, "m": "I'll humbly tell him what we've achieved in his name, that magic word in war: how, with his banners and his well-paid troops, we've driven the never-beaten Parthian cavalry from the field until they were exhausted."}, {"t": "sp", "who": "SILIUS", "lines": ["Where is he now?"], "id": 611, "m": "Where is he now?"}, {"t": "sp", "who": "VENTIDIUS", "lines": ["He purposeth to Athens: whither, with what haste", "The weight we must convey with's will permit,", "We shall appear before him.--On, there; pass along!"], "id": 612, "m": "He's heading for Athens. We'll appear before him there, as fast as the heavy loads we must carry allow. March on!"}, {"t": "sd", "text": "Exeunt.", "id": 613}, {"t": "scene", "act": 3, "scene": "II", "loc": "Rome. An Ante-chamber in Caesar's house.", "id": 614}, {"t": "sd", "text": "Enter Agrippa and Enobarbus, meeting.", "id": 615}, {"t": "sp", "who": "AGRIPPA", "lines": ["What, are the brothers parted?"], "id": 616, "m": "So, have the brothers-in-law parted?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["They have despatch'd with Pompey; he is gone;", "The other three are sealing. Octavia weeps", "To part from Rome: Caesar is sad; and Lepidus,", "Since Pompey's feast, as Menas says, is troubled", "With the green sickness."], "id": 617, "m": "They've finished with Pompey; he's gone. The other three are sealing the agreement. Octavia is weeping to leave Rome; Caesar is sad; and Lepidus, according to Menas, has been suffering from a lovesick young girl's illness since Pompey's feast."}, {"t": "sp", "who": "AGRIPPA", "lines": ["'Tis a noble Lepidus."], "id": 618, "m": "Lepidus is a noble man."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["A very fine one: O, how he loves Caesar!"], "id": 619, "m": "A very fine one. Oh, how he loves Caesar!"}, {"t": "sp", "who": "AGRIPPA", "lines": ["Nay, but how dearly he adores Mark Antony!"], "id": 620, "m": "Yes, but how dearly he adores Mark Antony!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Caesar? Why he's the Jupiter of men."], "id": 621, "m": "Caesar? Why, he's the Jupiter of men."}, {"t": "sp", "who": "AGRIPPA", "lines": ["What's Antony? The god of Jupiter."], "id": 622, "m": "What's Antony? The god of Jupiter."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Spake you of Caesar? How! the nonpareil!"], "id": 623, "m": "Did you mention Caesar? What! The one without equal!"}, {"t": "sp", "who": "AGRIPPA", "lines": ["O, Antony! O thou Arabian bird!"], "id": 624, "m": "Oh, Antony! Oh, you phoenix, unique bird of Arabia!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Would you praise Caesar, say 'Caesar'--go no further."], "id": 625, "m": "If you want to praise Caesar, just say 'Caesar'. That's enough."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Indeed, he plied them both with excellent praises."], "id": 626, "m": "Really, he showered them both with excellent praise."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["But he loves Caesar best;--yet he loves Antony:", "Hoo! hearts, tongues, figures, scribes, bards, poets, cannot", "Think, speak, cast, write, sing, number--hoo!--", "His love to Antony. But as for Caesar,", "Kneel down, kneel down, and wonder."], "id": 627, "m": "But he loves Caesar best. Yet he loves Antony. Wow! Hearts, tongues, numbers, writers, bards and poets can't think, speak, calculate, write, sing or count his love for Antony. Wow! But as for Caesar, kneel down, kneel down and be amazed."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Both he loves."], "id": 628, "m": "He loves them both."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["They are his shards, and he their beetle."], "id": 629, "m": "They're his wings, and he's their beetle."}, {"t": "sd", "text": "Trumpets within.", "id": 630}, {"t": "sp", "who": "ENOBARBUS", "cont": 1, "lines": ["So,--", "This is to horse.--Adieu, noble Agrippa."], "id": 631, "m": "So. That's the call to mount up. Goodbye, noble Agrippa."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Good fortune, worthy soldier; and farewell."], "id": 632, "m": "Good luck, worthy soldier, and goodbye."}, {"t": "sd", "text": "Enter Caesar, Antony, Lepidus, and Octavia.", "id": 633}, {"t": "sp", "who": "ANTONY", "lines": ["No further, sir."], "id": 634, "m": "No further, sir."}, {"t": "sp", "who": "CAESAR", "lines": ["You take from me a great part of myself;", "Use me well in't.--Sister, prove such a wife", "As my thoughts make thee, and as my furthest band", "Shall pass on thy approof.--Most noble Antony,", "Let not the piece of virtue which is set", "Betwixt us as the cement of our love,", "To keep it builded, be the ram to batter", "The fortress of it; for better might we", "Have lov'd without this mean if on both parts", "This be not cherish'd."], "id": 635, "m": "You're taking a great part of me away. Treat me well in her. Sister, be the kind of wife I think you are, the kind I'd stake my life on. Most noble Antony, don't let this model of virtue, who is set between us as the cement that holds our friendship together, become the battering ram that knocks it down. It would be better to have stayed friends without her if she isn't cherished by both of us."}, {"t": "sp", "who": "ANTONY", "lines": ["Make me not offended", "In your distrust."], "id": 636, "m": "Don't offend me by distrusting me."}, {"t": "sp", "who": "CAESAR", "lines": ["I have said."], "id": 637, "m": "I've said what I wanted to."}, {"t": "sp", "who": "ANTONY", "lines": ["You shall not find,", "Though you be therein curious, the least cause", "For what you seem to fear: so, the gods keep you,", "And make the hearts of Romans serve your ends!", "We will here part."], "id": 638, "m": "However closely you look, you won't find the slightest cause for what you seem to fear. So, may the gods protect you, and make the hearts of Romans serve your purposes! We'll part here."}, {"t": "sp", "who": "CAESAR", "lines": ["Farewell, my dearest sister, fare thee well:", "The elements be kind to thee, and make", "Thy spirits all of comfort! Fare thee well."], "id": 639, "m": "Goodbye, my dearest sister, goodbye. May the weather be kind to you and fill your spirits with comfort! Goodbye."}, {"t": "sp", "who": "OCTAVIA", "lines": ["My noble brother!--"], "id": 640, "m": "My noble brother!"}, {"t": "sp", "who": "ANTONY", "lines": ["The April's in her eyes: it is love's spring,", "And these the showers to bring it on.--Be cheerful."], "id": 641, "m": "There's April in her eyes. It's the spring of love, and these are the showers that bring it on. Cheer up."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Sir, look well to my husband's house; and--"], "id": 642, "m": "Sir, look after my husband's house, and..."}, {"t": "sp", "who": "CAESAR", "lines": ["What,", "Octavia?"], "id": 643, "m": "What, Octavia?"}, {"t": "sp", "who": "OCTAVIA", "lines": ["I'll tell you in your ear."], "id": 644, "m": "I'll whisper it to you."}, {"t": "sp", "who": "ANTONY", "lines": ["Her tongue will not obey her heart, nor can", "Her heart inform her tongue,--the swan's down feather,", "That stands upon the swell at the full of tide,", "And neither way inclines."], "id": 645, "m": "Her tongue won't obey her heart, and her heart can't instruct her tongue. She's like a swan's feather floating on the high tide, leaning neither way."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside to Agrippa.] Will Caesar weep?"], "id": 646, "m": "[Aside to Agrippa] Will Caesar cry?"}, {"t": "sp", "who": "AGRIPPA", "lines": ["[Aside to Enobarbus.] He has a cloud in's face."], "id": 647, "m": "[Aside to Enobarbus] There's a cloud over his face."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside to Agrippa.] He were the worse for that, were he a horse;", "So is he, being a man."], "id": 648, "m": "[Aside to Agrippa] That would be a fault in a horse, and it's a fault in a man too."}, {"t": "sp", "who": "AGRIPPA", "lines": ["[Aside to Enobarbus.] Why, Enobarbus,", "When Antony found Julius Caesar dead,", "He cried almost to roaring; and he wept", "When at Philippi he found Brutus slain."], "id": 649, "m": "[Aside to Enobarbus] Why, Enobarbus, when Antony found Julius Caesar dead, he cried until he was almost roaring. And he wept when he found Brutus dead at Philippi."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside to Agrippa.] That year, indeed, he was troubled with a", "rheum;", "What willingly he did confound he wail'd:", "Believe't till I weep too."], "id": 650, "m": "[Aside to Agrippa] That year he certainly had a bad cold. He wept over what he'd been glad to destroy. Believe it when you see me crying too."}, {"t": "sp", "who": "CAESAR", "lines": ["No, sweet Octavia,", "You shall hear from me still; the time shall not", "Out-go my thinking on you."], "id": 651, "m": "No, sweet Octavia, you'll keep hearing from me. Time won't run faster than my thoughts of you."}, {"t": "sp", "who": "ANTONY", "lines": ["Come, sir, come;", "I'll wrestle with you in my strength of love:", "Look, here I have you; thus I let you go,", "And give you to the gods."], "id": 652, "m": "Come, sir, come. I'll wrestle with you in a contest of love. Look, I have you here; now I let you go, and give you to the gods."}, {"t": "sp", "who": "CAESAR", "lines": ["Adieu; be happy!"], "id": 653, "m": "Goodbye. Be happy!"}, {"t": "sp", "who": "LEPIDUS", "lines": ["Let all the number of the stars give light", "To thy fair way!"], "id": 654, "m": "May every star light your way!"}, {"t": "sp", "who": "CAESAR", "lines": ["Farewell, farewell!", "[Kisses Octavia.]"], "id": 655, "m": "Farewell, farewell! [He kisses Octavia.]"}, {"t": "sp", "who": "ANTONY", "lines": ["Farewell!"], "id": 656, "m": "Farewell!"}, {"t": "sd", "text": "Trumpets sound within. Exeunt.", "id": 657}, {"t": "scene", "act": 3, "scene": "III", "loc": "Alexandria. A Room in the Palace.", "id": 658}, {"t": "sd", "text": "Enter Cleopatra, Charmian, Iras, and Alexas.", "id": 659}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Where is the fellow?"], "id": 660, "m": "Where's that fellow?"}, {"t": "sp", "who": "ALEXAS", "lines": ["Half afear'd to come."], "id": 661, "m": "Half afraid to come."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Go to, go to."], "id": 662, "m": "Come on, come on."}, {"t": "sd", "text": "Enter a Messenger.", "id": 663}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Come hither, sir."], "id": 664, "m": "Come here, sir."}, {"t": "sp", "who": "ALEXAS", "lines": ["Good majesty,", "Herod of Jewry dare not look upon you", "But when you are well pleas'd."], "id": 665, "m": "Good majesty, even Herod of Judea doesn't dare look at you unless you're in a good mood."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That Herod's head", "I'll have: but how? when Antony is gone,", "Through whom I might command it?--Come thou near."], "id": 666, "m": "I'll have Herod's head. But how, when Antony is gone, through whom I could order it? Come closer."}, {"t": "sp", "who": "MESSENGER", "lines": ["Most gracious majesty,--"], "id": 667, "m": "Most gracious majesty..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Didst thou behold Octavia?"], "id": 668, "m": "Did you see Octavia?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Ay, dread queen."], "id": 669, "m": "Yes, mighty queen."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Where?"], "id": 670, "m": "Where?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam, in Rome", "I look'd her in the face, and saw her led", "Between her brother and Mark Antony."], "id": 671, "m": "Madam, in Rome. I looked her in the face, and saw her walking between her brother and Mark Antony."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Is she as tall as me?"], "id": 672, "m": "Is she as tall as me?"}, {"t": "sp", "who": "MESSENGER", "lines": ["She is not, madam."], "id": 673, "m": "She isn't, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Didst hear her speak? is she shrill-tongu'd or low?"], "id": 674, "m": "Did you hear her speak? Is her voice shrill or low?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam, I heard her speak:  she is low-voic'd."], "id": 675, "m": "Madam, I heard her speak. She has a low voice."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That's not so good:--he cannot like her long."], "id": 676, "m": "That's not so good. He can't like her for long."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Like her! O Isis! 'tis impossible."], "id": 677, "m": "Like her! Oh Isis, it's impossible."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I think so, Charmian: dull of tongue and dwarfish!--", "What majesty is in her gait? Remember,", "If e'er thou look'dst on majesty."], "id": 678, "m": "I think so, Charmian. Dull-voiced and dwarfish! Is there any majesty in the way she walks? Think back, if you've ever seen majesty."}, {"t": "sp", "who": "MESSENGER", "lines": ["She creeps,--", "Her motion and her station are as one;", "She shows a body rather than a life,", "A statue than a breather."], "id": 679, "m": "She creeps. Moving or standing still, she's the same. She seems more like a body than a living thing, a statue rather than someone who breathes."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Is this certain?"], "id": 680, "m": "Is this certain?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Or I have no observance."], "id": 681, "m": "It is, or I can't observe anything."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Three in Egypt", "Cannot make better note."], "id": 682, "m": "There aren't three people in Egypt who could judge better."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He's very knowing;", "I do perceive't:--there's nothing in her yet:--", "The fellow has good judgment."], "id": 683, "m": "He knows a lot, I can see that. There's nothing special about her yet. The fellow has good judgement."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Excellent."], "id": 684, "m": "Excellent."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Guess at her years, I pr'ythee."], "id": 685, "m": "Guess her age, please."}, {"t": "sp", "who": "MESSENGER", "lines": ["Madam,", "She was a widow."], "id": 686, "m": "Madam, she was a widow."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Widow!--Charmian, hark!"], "id": 687, "m": "A widow! Charmian, listen!"}, {"t": "sp", "who": "MESSENGER", "lines": ["And I do think she's thirty."], "id": 688, "m": "And I think she's thirty."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Bear'st thou her face in mind? is't long or round?"], "id": 689, "m": "Do you remember her face? Is it long or round?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Round even to faultiness."], "id": 690, "m": "Round, to the point of being a fault."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["For the most part, too, they are foolish that are so.--", "Her hair, what colour?"], "id": 691, "m": "People with round faces are mostly foolish, too. Her hair, what colour is it?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Brown, madam: and her forehead", "As low as she would wish it."], "id": 692, "m": "Brown, madam. And her forehead is as low as she could wish it to be."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["There's gold for thee.", "Thou must not take my former sharpness ill:--", "I will employ thee back again; I find thee", "Most fit for business:--go make thee ready;", "Our letters are prepar'd."], "id": 693, "m": "Here's gold for you. Don't hold my earlier harshness against me. I'll send you back again; I find you very good at this work. Go and get ready. Our letters are prepared."}, {"t": "sd", "text": "Exit Messenger.", "id": 694}, {"t": "sp", "who": "CHARMIAN", "lines": ["A proper man."], "id": 695, "m": "A fine man."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Indeed, he is so: I repent me much", "That so I harried him. Why, methinks, by him,", "This creature's no such thing."], "id": 696, "m": "Indeed he is. I'm very sorry I treated him so roughly. Why, according to him, this woman is nothing special."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Nothing, madam."], "id": 697, "m": "Nothing at all, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["The man hath seen some majesty, and should know."], "id": 698, "m": "The man has seen some majesty, so he should know."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Hath he seen majesty? Isis else defend,", "And serving you so long!"], "id": 699, "m": "Has he seen majesty? Isis forbid that he hasn't, after serving you so long!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I have one thing more to ask him yet, good Charmian:", "But 'tis no matter; thou shalt bring him to me", "Where I will write. All may be well enough."], "id": 700, "m": "I've one more thing to ask him, good Charmian. But it doesn't matter. Bring him to me where I'll be writing. Everything may turn out well enough."}, {"t": "sp", "who": "CHARMIAN", "lines": ["I warrant you, madam."], "id": 701, "m": "I promise you it will, madam."}, {"t": "sd", "text": "Exeunt.", "id": 702}, {"t": "scene", "act": 3, "scene": "IV", "loc": "Athens. A Room in Antony's House.", "id": 703}, {"t": "sd", "text": "Enter Antony and Octavia.", "id": 704}, {"t": "sp", "who": "ANTONY", "lines": ["Nay, nay, Octavia, not only that,--", "That were excusable, that and thousands more", "Of semblable import--but he hath wag'd", "New wars 'gainst Pompey; made his will, and read it", "To public ear:", "Spoke scandy of me: when perforce he could not", "But pay me terms of honour, cold and sickly", "He vented them: most narrow measure lent me;", "When the best hint was given him, he not took't,", "Or did it from his teeth."], "id": 705, "m": "No, no, Octavia, not just that. That would be forgivable, that and thousands more things like it. But he's started new wars against Pompey, made his will and read it out in public. He spoke slightingly of me. When he couldn't avoid praising me, he did it coldly and grudgingly and gave me as little credit as possible. When he had the best opportunity, he didn't take it, or he spoke through gritted teeth."}, {"t": "sp", "who": "OCTAVIA", "lines": ["O my good lord,", "Believe not all; or if you must believe,", "Stomach not all. A more unhappy lady,", "If this division chance, ne'er stood between,", "Praying for both parts:", "Sure the good gods will mock me presently", "When I shall pray 'O, bless my lord and husband!'", "Undo that prayer by crying out as loud", "'O, bless my brother!' Husband win, win brother,", "Prays and destroys the prayer; no mid-way", "'Twixt these extremes at all."], "id": 706, "m": "Oh my good lord, don't believe everything, or if you must believe it, don't resent all of it. If this split happens, there was never a more unhappy lady standing between two sides, praying for both. The good gods will surely mock me when I pray, 'Oh, bless my lord and husband!' and then cancel that prayer by crying just as loudly, 'Oh, bless my brother!' 'Husband win' and 'brother win': each prayer destroys the other. There's no middle way between these extremes."}, {"t": "sp", "who": "ANTONY", "lines": ["Gentle Octavia,", "Let your best love draw to that point which seeks", "Best to preserve it: if I lose mine honour,", "I lose myself: better I were not yours", "Than yours so branchless. But, as you requested,", "Yourself shall go between's: the meantime, lady,", "I'll raise the preparation of a war", "Shall stain your brother: make your soonest haste;", "So your desires are yours."], "id": 707, "m": "Gentle Octavia, let your love go to whoever tries hardest to keep it. If I lose my honour, I lose myself. It would be better for me not to be yours at all than to be yours with my branches cut off. But as you asked, you can go between us. Meanwhile, lady, I'll get ready for a war that will put your brother in the shade. Go as quickly as you can. You have what you wanted."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Thanks to my lord.", "The Jove of power make me, most weak, most weak,", "Your reconciler! Wars 'twixt you twain would be", "As if the world should cleave, and that slain men", "Should solder up the rift."], "id": 708, "m": "Thank you, my lord. May Jupiter, god of power, make me, so weak, so weak, the one who reconciles you! War between you two would be as if the world split apart and dead men had to fill the crack."}, {"t": "sp", "who": "ANTONY", "lines": ["When it appears to you where this begins,", "Turn your displeasure that way; for our faults", "Can never be so equal that your love", "Can equally move with them. Provide your going;", "Choose your own company, and command what cost", "Your heart has mind to."], "id": 709, "m": "When you see who started this, turn your anger that way. Our faults can never be so equal that your love can be shared equally between us. Get ready to go. Choose your own companions, and spend whatever you like."}, {"t": "sd", "text": "Exeunt.", "id": 710}, {"t": "scene", "act": 3, "scene": "V", "loc": "Athens. Another Room in Antony's House.", "id": 711}, {"t": "sd", "text": "Enter Enobarbus and Eros, meeting.", "id": 712}, {"t": "sp", "who": "ENOBARBUS", "lines": ["How now, friend Eros!"], "id": 713, "m": "Hello, friend Eros!"}, {"t": "sp", "who": "EROS", "lines": ["There's strange news come, sir."], "id": 714, "m": "There's strange news, sir."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["What, man?"], "id": 715, "m": "What is it, man?"}, {"t": "sp", "who": "EROS", "lines": ["Caesar and Lepidus have made wars upon Pompey."], "id": 716, "m": "Caesar and Lepidus have made war on Pompey."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["This is old: what is the success?"], "id": 717, "m": "That's old news. What's the outcome?"}, {"t": "sp", "who": "EROS", "lines": ["Caesar, having made use of him in the wars 'gainst Pompey,", "presently denied him rivality; would not let him partake in the", "glory of the action: and not resting here, accuses him of letters", "he had formerly wrote to Pompey; upon his own appeal, seizes him:", "so the poor third is up, till death enlarge his confine."], "id": 718, "m": "Caesar used Lepidus in the war against Pompey, then immediately refused to treat him as an equal. He wouldn't let him share in the glory of the victory. And not stopping there, he accuses him of letters he once wrote to Pompey, and on his own accusation has arrested him. So the poor third partner is locked up until death sets him free."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Then, world, thou hast a pair of chaps, no more;", "And throw between them all the food thou hast,", "They'll grind the one the other. Where's Antony?"], "id": 719, "m": "Then, world, you have only one pair of jaws now. Throw all the food you have between them, and they'll grind against each other. Where's Antony?"}, {"t": "sp", "who": "EROS", "lines": ["He's walking in the garden--thus; and spurns", "The rush that lies before him; cries 'Fool Lepidus!'", "And threats the throat of that his officer", "That murder'd Pompey."], "id": 720, "m": "He's walking in the garden, like this, kicking the rushes in front of him and shouting 'Lepidus, you fool!' And he's threatening to cut the throat of the officer who murdered Pompey."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Our great navy's rigg'd."], "id": 721, "m": "Our great navy's ready."}, {"t": "sp", "who": "EROS", "lines": ["For Italy and Caesar. More, Domitius;", "My lord desires you presently: my news", "I might have told hereafter."], "id": 722, "m": "For Italy and Caesar. And another thing, Domitius: my lord wants to see you at once. I could have told you my news later."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["'Twill be naught;", "But let it be.--Bring me to Antony."], "id": 723, "m": "It'll come to nothing. But never mind. Take me to Antony."}, {"t": "sp", "who": "EROS", "lines": ["Come, sir."], "id": 724, "m": "Come, sir."}, {"t": "sd", "text": "Exeunt.", "id": 725}, {"t": "scene", "act": 3, "scene": "VI", "loc": "Rome. A Room in Caesar's House.", "id": 726}, {"t": "sd", "text": "Enter Caesar, Agrippa, and Maecenas.", "id": 727}, {"t": "sp", "who": "CAESAR", "lines": ["Contemning Rome, he has done all this, and more,", "In Alexandria. Here's the manner of't:--", "I' the market-place, on a tribunal silver'd,", "Cleopatra and himself in chairs of gold", "Were publicly enthron'd: at the feet sat", "Caesarion, whom they call my father's son,", "And all the unlawful issue that their lust", "Since then hath made between them. Unto her", "He gave the 'stablishment of Egypt; made her", "Of lower Syria, Cyprus, Lydia,", "Absolute queen."], "id": 728, "m": "Scorning Rome, he's done all this and more in Alexandria. This is how it happened. In the market-place, on a silver platform, Cleopatra and he sat publicly enthroned on golden chairs. At their feet sat Caesarion, whom they call my father's son, and all the illegitimate children their lust has produced since. He gave her the rule of Egypt and made her absolute queen of lower Syria, Cyprus and Lydia."}, {"t": "sp", "who": "MAECENAS", "lines": ["This in the public eye?"], "id": 729, "m": "In public view?"}, {"t": "sp", "who": "CAESAR", "lines": ["I' the common show-place, where they exercise.", "His sons he there proclaim'd the kings of kings:", "Great Media, Parthia, and Armenia,", "He gave to Alexander; to Ptolemy he assign'd", "Syria, Cilicia, and Phoenicia: she", "In the habiliments of the goddess Isis", "That day appear'd; and oft before gave audience,", "As 'tis reported, so."], "id": 730, "m": "In the public stadium where they hold games. There he proclaimed his sons kings of kings. He gave Great Media, Parthia and Armenia to Alexander; to Ptolemy he gave Syria, Cilicia and Phoenicia. That day she appeared dressed as the goddess Isis, and it's said she often received visitors dressed like that before."}, {"t": "sp", "who": "MAECENAS", "lines": ["Let Rome be thus", "Inform'd."], "id": 731, "m": "Let Rome be told about this."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Who, queasy with his insolence", "Already, will their good thoughts call from him."], "id": 732, "m": "Rome is already sick of his arrogance and will stop thinking well of him."}, {"t": "sp", "who": "CAESAR", "lines": ["The people knows it: and have now receiv'd", "His accusations."], "id": 733, "m": "The people know about it, and they've now received his accusations."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Who does he accuse?"], "id": 734, "m": "Who is he accusing?"}, {"t": "sp", "who": "CAESAR", "lines": ["Caesar: and that, having in Sicily", "Sextus Pompeius spoil'd, we had not rated him", "His part o' the isle: then does he say he lent me", "Some shipping, unrestor'd: lastly, he frets", "That Lepidus of the triumvirate", "Should be depos'd; and, being, that we detain", "All his revenue."], "id": 735, "m": "Me. He says that after I took Sicily from Sextus Pompeius, I didn't give him his share of the island. Then he says he lent me some ships that I didn't return. Finally he's angry that Lepidus was removed from the triumvirate, and, having removed him, that we keep all his income."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Sir, this should be answer'd."], "id": 736, "m": "Sir, this should be answered."}, {"t": "sp", "who": "CAESAR", "lines": ["'Tis done already, and messenger gone.", "I have told him Lepidus was grown too cruel;", "That he his high authority abus'd,", "And did deserve his change: for what I have conquer'd", "I grant him part; but then, in his Armenia", "And other of his conquer'd kingdoms, I", "Demand the like."], "id": 737, "m": "It's already done, and the messenger has gone. I've told him Lepidus had become too cruel, abused his great authority and deserved to lose it. I'll give him part of what I've conquered, but in return I demand the same share of his Armenia and his other conquered kingdoms."}, {"t": "sp", "who": "MAECENAS", "lines": ["He'll never yield to that."], "id": 738, "m": "He'll never agree to that."}, {"t": "sp", "who": "CAESAR", "lines": ["Nor must not then be yielded to in this."], "id": 739, "m": "Then he mustn't be given what he wants either."}, {"t": "sd", "text": "Enter Octavia, with her train.", "id": 740}, {"t": "sp", "who": "OCTAVIA", "lines": ["Hail, Caesar, and my lord! hail, most dear Caesar!"], "id": 741, "m": "Greetings, Caesar, my lord! Greetings, dearest Caesar!"}, {"t": "sp", "who": "CAESAR", "lines": ["That ever I should call thee castaway!"], "id": 742, "m": "To think I should ever call you an outcast!"}, {"t": "sp", "who": "OCTAVIA", "lines": ["You have not call'd me so, nor have you cause."], "id": 743, "m": "You haven't called me that, and you have no reason to."}, {"t": "sp", "who": "CAESAR", "lines": ["Why have you stol'n upon us thus? You come not", "Like Caesar's sister: the wife of Antony", "Should have an army for an usher, and", "The neighs of horse to tell of her approach", "Long ere she did appear; the trees by the way", "Should have borne men; and expectation fainted,", "Longing for what it had not; nay, the dust", "Should have ascended to the roof of heaven,", "Rais'd by your populous troops: but you are come", "A market-maid to Rome; and have prevented", "The ostentation of our love, which left unshown", "Is often left unlov'd; we should have met you", "By sea and land; supplying every stage", "With an augmented greeting."], "id": 744, "m": "Why have you crept up on us like this? You don't arrive like Caesar's sister. The wife of Antony should have an army to announce her, and the neighing of horses telling of her approach long before she appeared. The trees along the road should have been full of people climbing them to see, and the crowds should have fainted with longing to see her. Why, the dust raised by your huge escort should have risen to the roof of heaven. But you've come to Rome like a girl going to market, and prevented us from showing our love, which, when it isn't shown, often goes unfelt. We should have met you by sea and land, greeting you more grandly at every stage."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Good my lord,", "To come thus was I not constrain'd, but did it", "On my free will. My lord, Mark Antony,", "Hearing that you prepar'd for war, acquainted", "My grieved ear withal: whereon I begg'd", "His pardon for return."], "id": 745, "m": "My good lord, I wasn't forced to come like this; I did it of my own free will. My lord, Mark Antony, hearing that you were preparing for war, told me about it, which grieved me. So I begged his permission to come back."}, {"t": "sp", "who": "CAESAR", "lines": ["Which soon he granted,", "Being an obstruct 'tween his lust and him."], "id": 746, "m": "Which he quickly gave, since you stood in the way of him and his lust."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Do not say so, my lord."], "id": 747, "m": "Don't say that, my lord."}, {"t": "sp", "who": "CAESAR", "lines": ["I have eyes upon him,", "And his affairs come to me on the wind.", "Where is he now?"], "id": 748, "m": "I have spies watching him, and news of what he does reaches me on the wind. Where is he now?"}, {"t": "sp", "who": "OCTAVIA", "lines": ["My lord, in Athens."], "id": 749, "m": "In Athens, my lord."}, {"t": "sp", "who": "CAESAR", "lines": ["No, my most wronged sister; Cleopatra", "Hath nodded him to her. He hath given his empire", "Up to a whore; who now are levying", "The kings o' the earth for war: he hath assembled", "Bocchus, the king of Libya; Archelaus", "Of Cappadocia; Philadelphos, king", "Of Paphlagonia; the Thracian king, Adallas;", "King Manchus of Arabia; King of Pont;", "Herod of Jewry; Mithridates, king", "Of Comagene; Polemon and Amyntas,", "The kings of Mede and Lycaonia, with", "More larger list of sceptres."], "id": 750, "m": "No, my most wronged sister. Cleopatra has beckoned him to her. He's given his empire to a whore, and now they're gathering the kings of the earth for war. He's collected Bocchus, king of Libya; Archelaus of Cappadocia; Philadelphos, king of Paphlagonia; the Thracian king Adallas; King Manchus of Arabia; the King of Pontus; Herod of Judea; Mithridates, king of Commagene; Polemon and Amyntas, the kings of Media and Lycaonia, and a longer list of kings besides."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Ay me, most wretched,", "That have my heart parted betwixt two friends,", "That do afflict each other!"], "id": 751, "m": "Oh, how wretched I am, with my heart divided between two people I love who are hurting each other!"}, {"t": "sp", "who": "CAESAR", "lines": ["Welcome hither:", "Your letters did withhold our breaking forth,", "Till we perceiv'd both how you were wrong led", "And we in negligent danger. Cheer your heart:", "Be you not troubled with the time, which drives", "O'er your content these strong necessities;", "But let determin'd things to destiny", "Hold unbewail'd their way. Welcome to Rome;", "Nothing more dear to me. You are abus'd", "Beyond the mark of thought: and the high gods,", "To do you justice, make their ministers", "Of us and those that love you. Best of comfort;", "And ever welcome to us."], "id": 752, "m": "Welcome here. Your letters held us back from breaking out against him, until we saw how you were misled and how dangerously careless we were being. Cheer up. Don't be troubled by the times, which force these harsh necessities on your happiness. Let what fate has decided go its way without grieving. Welcome to Rome; nothing is dearer to me. You've been wronged beyond belief, and the high gods, to do you justice, are making us and those who love you their agents. Take comfort, and always be welcome here."}, {"t": "sp", "who": "AGRIPPA", "lines": ["Welcome, lady."], "id": 753, "m": "Welcome, lady."}, {"t": "sp", "who": "MAECENAS", "lines": ["Welcome, dear madam.", "Each heart in Rome does love and pity you:", "Only the adulterous Antony, most large", "In his abominations, turns you off,", "And gives his potent regiment to a trull", "That noises it against us."], "id": 754, "m": "Welcome, dear madam. Every heart in Rome loves and pities you. Only adulterous Antony, so enormous in his disgusting behaviour, throws you aside and hands his great power to a slut who stirs it up against us."}, {"t": "sp", "who": "OCTAVIA", "lines": ["Is it so, sir?"], "id": 755, "m": "Is this true, sir?"}, {"t": "sp", "who": "CAESAR", "lines": ["Most certain. Sister, welcome: pray you", "Be ever known to patience: my dear'st sister!"], "id": 756, "m": "Quite certain. Sister, welcome. Please always be patient. My dearest sister!"}, {"t": "sd", "text": "Exeunt.", "id": 757}, {"t": "scene", "act": 3, "scene": "VII", "loc": "Antony's Camp near the Promontory of Actium.", "id": 758}, {"t": "sd", "text": "Enter Cleopatra and Enobarbus.", "id": 759}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I will be even with thee, doubt it not."], "id": 760, "m": "I'll get even with you, don't doubt it."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["But why, why, why?"], "id": 761, "m": "But why, why, why?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Thou hast forspoke my being in these wars,", "And say'st it is not fit."], "id": 762, "m": "You've spoken against my being in these wars and said it isn't right."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Well, is it, is it?"], "id": 763, "m": "Well, is it? Is it?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["If not denounc'd against us, why should not we", "Be there in person?"], "id": 764, "m": "Even if war wasn't declared on me personally, why shouldn't I be there in person?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["[Aside.] Well, I could reply:--", "If we should serve with horse and mares together", "The horse were merely lost; the mares would bear", "A soldier and his horse."], "id": 765, "m": "[Aside] Well, I could answer this: if we took stallions and mares to war together, the stallions would be completely useless, because the mares would carry a soldier and his horse."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What is't you say?"], "id": 766, "m": "What are you saying?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Your presence needs must puzzle Antony;", "Take from his heart, take from his brain, from's time,", "What should not then be spar'd. He is already", "Traduc'd for levity: and 'tis said in Rome", "That Photinus an eunuch and your maids", "Manage this war."], "id": 767, "m": "Your presence is bound to distract Antony. It will take from his heart, his brain and his time what he can't spare right now. He's already criticised for being frivolous, and in Rome they say that a eunuch called Photinus and your maids are running this war."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sink Rome, and their tongues rot", "That speak against us! A charge we bear i' the war,", "And, as the president of my kingdom, will", "Appear there for a man. Speak not against it;", "I will not stay behind."], "id": 768, "m": "Let Rome sink, and let the tongues that speak against us rot! I'm paying for this war, and as the ruler of my kingdom I'll be there like a man. Don't argue against it. I won't stay behind."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Nay, I have done.", "Here comes the emperor."], "id": 769, "m": "No, I've finished. Here comes the commander."}, {"t": "sd", "text": "Enter Antony and Canidius.", "id": 770}, {"t": "sp", "who": "ANTONY", "lines": ["Is it not strange, Canidius,", "That from Tarentum and Brundusium", "He could so quickly cut the Ionian sea,", "And take in Toryne?--You have heard on't, sweet?"], "id": 771, "m": "Isn't it strange, Canidius, that he could cross the Ionian Sea so quickly from Tarentum and Brundisium, and capture Toryne? Have you heard about it, sweet?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Celerity is never more admir'd", "Than by the negligent."], "id": 772, "m": "Speed is never more admired than by people who are slow."}, {"t": "sp", "who": "ANTONY", "lines": ["A good rebuke,", "Which might have well becom'd the best of men", "To taunt at slackness.--Canidius, we", "Will fight with him by sea."], "id": 773, "m": "A good rebuke, which would have suited the best of men, to mock slackness. Canidius, we'll fight him at sea."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["By sea! what else?"], "id": 774, "m": "At sea! Where else?"}, {"t": "sp", "who": "CANIDIUS", "lines": ["Why will my lord do so?"], "id": 775, "m": "Why will my lord do that?"}, {"t": "sp", "who": "ANTONY", "lines": ["For that he dares us to't."], "id": 776, "m": "Because he dares us to."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["So hath my lord dar'd him to single fight."], "id": 777, "m": "And my lord has dared him to fight one to one."}, {"t": "sp", "who": "CANIDIUS", "lines": ["Ay, and to wage this battle at Pharsalia,", "Where Caesar fought with Pompey. But these offers,", "Which serve not for his vantage, he shakes off;", "And so should you."], "id": 778, "m": "Yes, and to fight this battle at Pharsalia, where Julius Caesar fought Pompey. But he brushes aside these offers when they don't suit him, and so should you."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Your ships are not well mann'd:", "Your mariners are muleteers, reapers, people", "Ingross'd by swift impress; in Caesar's fleet", "Are those that often have 'gainst Pompey fought:", "Their ships are yare; yours heavy: no disgrace", "Shall fall you for refusing him at sea,", "Being prepar'd for land."], "id": 779, "m": "Your ships aren't properly manned. Your sailors are mule-drivers, farm workers, men rounded up by press-gangs. In Caesar's fleet are men who've often fought against Pompey. Their ships are quick to handle; yours are heavy. It's no disgrace to refuse to fight him at sea when you're ready to fight on land."}, {"t": "sp", "who": "ANTONY", "lines": ["By sea, by sea."], "id": 780, "m": "At sea, at sea."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Most worthy sir, you therein throw away", "The absolute soldiership you have by land;", "Distract your army, which doth most consist", "Of war-mark'd footmen; leave unexecuted", "Your own renowned knowledge; quite forgo", "The way which promises assurance; and", "Give up yourself merely to chance and hazard", "From firm security."], "id": 781, "m": "Most worthy sir, by doing that you throw away your complete mastery as a soldier on land. You divide your army, which is mostly made up of battle-hardened foot soldiers. You leave your famous skill unused, abandon the way that promises success, and give yourself up entirely to chance and risk instead of firm security."}, {"t": "sp", "who": "ANTONY", "lines": ["I'll fight at sea."], "id": 782, "m": "I'll fight at sea."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I have sixty sails, Caesar none better."], "id": 783, "m": "I have sixty ships. Caesar has none better."}, {"t": "sp", "who": "ANTONY", "lines": ["Our overplus of shipping will we burn;", "And, with the rest full-mann'd, from the head of Actium", "Beat the approaching Caesar. But if we fail,", "We then can do't at land."], "id": 784, "m": "We'll burn our extra ships, and with the rest fully manned we'll beat Caesar off the point of Actium as he approaches. But if we fail, we can still fight on land."}, {"t": "sd", "text": "Enter a Messenger.", "id": 785}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["Thy business?"], "id": 786, "m": "What's your business?"}, {"t": "sp", "who": "MESSENGER", "lines": ["The news is true, my lord: he is descried;", "Caesar has taken Toryne."], "id": 787, "m": "The news is true, my lord. He's been sighted. Caesar has taken Toryne."}, {"t": "sp", "who": "ANTONY", "lines": ["Can he be there in person? 'tis impossible--", "Strange that his power should be.--Canidius,", "Our nineteen legions thou shalt hold by land,", "And our twelve thousand horse.--We'll to our ship:", "Away, my Thetis!"], "id": 788, "m": "Can he be there in person? It's impossible. It's strange enough that his army is. Canidius, you'll command our nineteen legions on land, and our twelve thousand cavalry. We'll go to our ship. Away, my Thetis!"}, {"t": "sd", "text": "Enter a Soldier.", "id": 789}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["How now, worthy soldier?"], "id": 790, "m": "What is it, worthy soldier?"}, {"t": "sp", "who": "SOLDIER", "lines": ["O noble emperor, do not fight by sea;", "Trust not to rotten planks: do you misdoubt", "This sword and these my wounds? Let the Egyptians", "And the Phoenicians go a-ducking: we", "Have us'd to conquer standing on the earth", "And fighting foot to foot."], "id": 791, "m": "Oh noble commander, don't fight at sea. Don't trust rotten planks. Do you doubt this sword and these wounds of mine? Let the Egyptians and the Phoenicians go swimming. We're used to winning standing on the ground and fighting hand to hand."}, {"t": "sp", "who": "ANTONY", "lines": ["Well, well:--away."], "id": 792, "m": "Well, well. Away."}, {"t": "sd", "text": "Exeunt Antony, Cleopatra, and Enobarbus.", "id": 793}, {"t": "sp", "who": "SOLDIER", "lines": ["By Hercules, I think I am i' the right."], "id": 794, "m": "By Hercules, I think I'm right."}, {"t": "sp", "who": "CANIDIUS", "lines": ["Soldier, thou art: but his whole action grows", "Not in the power on't: so our leader's led,", "And we are women's men."], "id": 795, "m": "You are, soldier. But his whole campaign isn't being run by the part of the army where his strength lies. So our leader is being led, and we're women's men."}, {"t": "sp", "who": "SOLDIER", "lines": ["You keep by land", "The legions and the horse whole, do you not?"], "id": 796, "m": "You're keeping the legions and the cavalry all together on land, aren't you?"}, {"t": "sp", "who": "CANIDIUS", "lines": ["Marcus Octavius, Marcus Justeius,", "Publicola, and Caelius are for sea:", "But we keep whole by land. This speed of Caesar's", "Carries beyond belief."], "id": 797, "m": "Marcus Octavius, Marcus Justeius, Publicola and Caelius are going to sea, but we keep the rest together on land. Caesar's speed is unbelievable."}, {"t": "sp", "who": "SOLDIER", "lines": ["While he was yet in Rome", "His power went out in such distractions as", "Beguil'd all spies."], "id": 798, "m": "While he was still in Rome, his forces set out in such small groups that they fooled all our spies."}, {"t": "sp", "who": "CANIDIUS", "lines": ["Who's his lieutenant, hear you?"], "id": 799, "m": "Have you heard who his lieutenant is?"}, {"t": "sp", "who": "SOLDIER", "lines": ["They say one Taurus."], "id": 800, "m": "They say a man called Taurus."}, {"t": "sp", "who": "CANIDIUS", "lines": ["Well I know the man."], "id": 801, "m": "I know the man well."}, {"t": "sd", "text": "Enter a Messenger.", "id": 802}, {"t": "sp", "who": "MESSENGER", "lines": ["The Emperor calls Canidius."], "id": 803, "m": "The commander is calling for Canidius."}, {"t": "sp", "who": "CANIDIUS", "lines": ["With news the time's with labour; and throes forth", "Each minute some."], "id": 804, "m": "The times are in labour with news, and give birth to more every minute."}, {"t": "sd", "text": "Exeunt.", "id": 805}, {"t": "scene", "act": 3, "scene": "VIII", "loc": "A plain near Actium.", "id": 806}, {"t": "sd", "text": "Enter Caesar, Taurus, Officers, and others.", "id": 807}, {"t": "sp", "who": "CAESAR", "lines": ["Taurus,--"], "id": 808, "m": "Taurus!"}, {"t": "sp", "who": "TAURUS", "lines": ["My lord?"], "id": 809, "m": "My lord?"}, {"t": "sp", "who": "CAESAR", "lines": ["Strike not by land; keep whole; provoke not battle", "Till we have done at sea. Do not exceed", "The prescript of this scroll: our fortune lies", "Upon this jump."], "id": 810, "m": "Don't attack on land. Keep your army together. Don't start a battle until we've finished at sea. Don't go beyond the orders in this scroll. Our fortune depends on this gamble."}, {"t": "sd", "text": "Exeunt.", "id": 811}, {"t": "scene", "act": 3, "scene": "IX", "loc": "Another part of the Plain.", "id": 812}, {"t": "sd", "text": "Enter Antony and Enobarbus.", "id": 813}, {"t": "sp", "who": "ANTONY", "lines": ["Set we our squadrons on yon side o' the hill,", "In eye of Caesar's battle; from which place", "We may the number of the ships behold,", "And so proceed accordingly."], "id": 814, "m": "Let's put our troops on that side of the hill, in sight of Caesar's army. From there we can count his ships and act accordingly."}, {"t": "sd", "text": "Exeunt.", "id": 815}, {"t": "scene", "act": 3, "scene": "X", "loc": "Another part of the Plain.", "id": 816}, {"t": "sd", "text": "Enter Canidius, marching with his land Army one way; and Taurus, the Lieutenant of Caesar, with his Army, the other way. After their going in, is heard the noise of a sea-fight.", "id": 817}, {"t": "sd", "text": "Alarum. Enter Enobarbus.", "id": 818}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Naught, naught, all naught! I can behold no longer:", "The Antoniad, the Egyptian admiral,", "With all their sixty, fly and turn the rudder:", "To see't mine eyes are blasted."], "id": 819, "m": "Ruin, ruin, total ruin! I can't watch any longer. The Antoniad, the Egyptian flagship, is turning and running away with all their sixty ships. Seeing it blinds my eyes."}, {"t": "sd", "text": "Enter Scarus.", "id": 820}, {"t": "sp", "who": "SCARUS", "lines": ["Gods and goddesses,", "All the whole synod of them!"], "id": 821, "m": "Gods and goddesses, the whole council of them!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["What's thy passion?"], "id": 822, "m": "What's upsetting you?"}, {"t": "sp", "who": "SCARUS", "lines": ["The greater cantle of the world is lost", "With very ignorance; we have kiss'd away", "Kingdoms and provinces."], "id": 823, "m": "The greater part of the world has been lost through sheer stupidity. We've kissed away kingdoms and provinces."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["How appears the fight?"], "id": 824, "m": "How does the fight look?"}, {"t": "sp", "who": "SCARUS", "lines": ["On our side like the token'd pestilence,", "Where death is sure. Yon ribaudred nag of Egypt,--", "Whom leprosy o'ertake!--i' the midst o' the fight,", "When vantage like a pair of twins appear'd,", "Both as the same, or rather ours the elder,--", "The breese upon her, like a cow in June,--", "Hoists sails and flies."], "id": 825, "m": "On our side, like the plague when the spots appear and death is certain. That filthy Egyptian nag (may leprosy take her!), in the middle of the fight, when the advantages on each side were as equal as twins, or ours were greater, like a cow in June stung by a gadfly, raised her sails and ran away."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["That I beheld:", "Mine eyes did sicken at the sight, and could not", "Endure a further view."], "id": 826, "m": "I saw that. It made my eyes sick, and I couldn't bear to watch any more."}, {"t": "sp", "who": "SCARUS", "lines": ["She once being loof'd,", "The noble ruin of her magic, Antony,", "Claps on his sea-wing, and, like a doting mallard,", "Leaving the fight in height, flies after her:", "I never saw an action of such shame;", "Experience, manhood, honour, ne'er before", "Did violate so itself."], "id": 827, "m": "Once she'd turned into the wind, Antony, the noble victim of her magic, spread his sails and, like a lovesick duck, left the battle at its height and flew after her. I've never seen anything so shameful. Experience, manhood and honour have never betrayed themselves like this before."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Alack, alack!"], "id": 828, "m": "Alas, alas!"}, {"t": "sd", "text": "Enter Canidius.", "id": 829}, {"t": "sp", "who": "CANIDIUS", "lines": ["Our fortune on the sea is out of breath,", "And sinks most lamentably. Had our general", "Been what he knew himself, it had gone well:", "O, he has given example for our flight", "Most grossly by his own!"], "id": 830, "m": "Our fortune at sea is out of breath and sinking miserably. If our general had been the man he knows himself to be, it would have gone well. Oh, he's set us an example of running away, a shameful one, by doing it himself!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Ay, are you thereabouts?", "Why, then, good night indeed."], "id": 831, "m": "Oh, is that what you're thinking? Then it really is all over."}, {"t": "sp", "who": "CANIDIUS", "lines": ["Toward Peloponnesus are they fled."], "id": 832, "m": "They've fled towards the Peloponnese."}, {"t": "sp", "who": "SCARUS", "lines": ["'Tis easy to't; and there I will attend", "What further comes."], "id": 833, "m": "It's easy to get there, and I'll wait there to see what happens next."}, {"t": "sp", "who": "CANIDIUS", "lines": ["To Caesar will I render", "My legions and my horse; six kings already", "Show me the way of yielding."], "id": 834, "m": "I'll surrender my legions and cavalry to Caesar. Six kings have already shown me how to give in."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I'll yet follow", "The wounded chance of Antony, though my reason", "Sits in the wind against me."], "id": 835, "m": "I'll still follow Antony's wounded fortunes, though my reason is blowing against me."}, {"t": "sd", "text": "Exeunt.", "id": 836}, {"t": "scene", "act": 3, "scene": "XI", "loc": "Alexandria. A Room in the Palace.", "id": 837}, {"t": "sd", "text": "Enter Antony and attendants.", "id": 838}, {"t": "sp", "who": "ANTONY", "lines": ["Hark! the land bids me tread no more upon't;--", "It is asham'd to bear me.--Friends, come hither:", "I am so lated in the world that I", "Have lost my way for ever:--I have a ship", "Laden with gold; take that; divide it; fly,", "And make your peace with Caesar."], "id": 839, "m": "Listen! The ground tells me not to walk on it any more. It's ashamed to carry me. Friends, come here. I'm like a traveller caught out after dark; I've lost my way for ever. I have a ship loaded with gold. Take it, share it out, run, and make your peace with Caesar."}, {"t": "sp", "who": "ALL", "lines": ["Fly! Not we."], "id": 840, "m": "Run? Not us."}, {"t": "sp", "who": "ANTONY", "lines": ["I have fled myself, and have instructed cowards", "To run and show their shoulders.--Friends, be gone;", "I have myself resolv'd upon a course", "Which has no need of you; be gone;", "My treasure's in the harbour, take it.--O,", "I follow'd that I blush to look upon:", "My very hairs do mutiny; for the white", "Reprove the brown for rashness, and they them", "For fear and doting.--Friends, be gone: you shall", "Have letters from me to some friends that will", "Sweep your way for you. Pray you, look not sad,", "Nor make replies of loathness: take the hint", "Which my despair proclaims; let that be left", "Which leaves itself: to the sea-side straightway:", "I will possess you of that ship and treasure.", "Leave me, I pray, a little: pray you now:--", "Nay, do so; for indeed I have lost command,", "Therefore I pray you:--I'll see you by and by."], "id": 841, "m": "I've run away myself, and taught cowards to turn and show their backs. Friends, go. I've decided on a course that doesn't need you. Go. My treasure's in the harbour; take it. Oh, I followed what I'm ashamed to look at. Even my hair is rebelling: the white hairs scold the brown ones for being rash, and the brown ones scold the white for being cowardly and foolish. Friends, go. I'll give you letters to some friends who'll clear your way for you. Please don't look sad or show you're unwilling. Take the hint my despair is giving you. Let what abandons itself be abandoned. Go straight to the shore. I'll give you that ship and the treasure. Please leave me for a while. Please, now. No, do it, because I've lost the right to command you, so I'm asking you. I'll see you soon."}, {"t": "sd", "text": "Sits down.", "id": 842}, {"t": "sd", "text": "Enter Cleopatra, led by Charmian and Iras, Eros following.", "id": 843}, {"t": "sp", "who": "EROS", "lines": ["Nay, gentle madam, to him!--comfort him."], "id": 844, "m": "No, gentle madam, go to him! Comfort him."}, {"t": "sp", "who": "IRAS", "lines": ["Do, most dear queen."], "id": 845, "m": "Do, dearest queen."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Do! why, what else?"], "id": 846, "m": "Do it! What else can you do?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Let me sit down. O Juno!"], "id": 847, "m": "Let me sit down. Oh, Juno!"}, {"t": "sp", "who": "ANTONY", "lines": ["No, no, no, no, no."], "id": 848, "m": "No, no, no, no, no."}, {"t": "sp", "who": "EROS", "lines": ["See you here, sir?"], "id": 849, "m": "Do you see who's here, sir?"}, {"t": "sp", "who": "ANTONY", "lines": ["O, fie, fie, fie!"], "id": 850, "m": "Oh, shame, shame, shame!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Madam,--"], "id": 851, "m": "Madam..."}, {"t": "sp", "who": "IRAS", "lines": ["Madam, O good empress,--"], "id": 852, "m": "Madam, oh good empress..."}, {"t": "sp", "who": "EROS", "lines": ["Sir, sir,--"], "id": 853, "m": "Sir, sir..."}, {"t": "sp", "who": "ANTONY", "lines": ["Yes, my lord, yes;--he at Philippi kept", "His sword e'en like a dancer; while I struck", "The lean and wrinkled Cassius; and 'twas I", "That the mad Brutus ended; he alone", "Dealt on lieutenantry, and no practice had", "In the brave squares of war: yet now--no matter."], "id": 854, "m": "Yes, my lord, yes. At Philippi he kept his sword in its sheath like a dancer, while I struck down the thin, wrinkled Cassius, and it was I who finished off the mad Brutus. He only fought through his officers and had no experience of brave battle formations. And yet now... It doesn't matter."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Ah, stand by."], "id": 855, "m": "Ah, stand back."}, {"t": "sp", "who": "EROS", "lines": ["The queen, my lord, the queen!"], "id": 856, "m": "The queen, my lord, the queen!"}, {"t": "sp", "who": "IRAS", "lines": ["Go to him, madam, speak to him:", "He is unqualitied with very shame."], "id": 857, "m": "Go to him, madam, speak to him. He's not himself out of pure shame."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Well then,--sustain me.--O!"], "id": 858, "m": "Well then, hold me up. Oh!"}, {"t": "sp", "who": "EROS", "lines": ["Most noble sir, arise; the queen approaches:", "Her head's declin'd, and death will seize her, but", "Your comfort makes the rescue."], "id": 859, "m": "Most noble sir, get up. The queen is coming. Her head's drooping, and death will take her unless your comfort rescues her."}, {"t": "sp", "who": "ANTONY", "lines": ["I have offended reputation,--", "A most unnoble swerving."], "id": 860, "m": "I've damaged my reputation. A most dishonourable lapse."}, {"t": "sp", "who": "EROS", "lines": ["Sir, the queen."], "id": 861, "m": "Sir, the queen."}, {"t": "sp", "who": "ANTONY", "lines": ["O, whither hast thou led me, Egypt? See", "How I convey my shame out of thine eyes", "By looking back, what I have left behind", "'Stroy'd in dishonour."], "id": 862, "m": "Oh, where have you led me, Egypt? See how I hide my shame from your eyes by looking back at what I've left behind, destroyed in dishonour."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O my lord, my lord,", "Forgive my fearful sails! I little thought", "You would have follow'd."], "id": 863, "m": "Oh my lord, my lord, forgive my frightened sails! I never thought you'd follow."}, {"t": "sp", "who": "ANTONY", "lines": ["Egypt, thou knew'st too well", "My heart was to thy rudder tied by the strings,", "And thou shouldst tow me after: o'er my spirit", "Thy full supremacy thou knew'st, and that", "Thy beck might from the bidding of the gods", "Command me."], "id": 864, "m": "Egypt, you knew too well that my heart was tied to your rudder by its strings, and that you'd pull me along after you. You knew you had complete power over my spirit, and that one nod from you could make me disobey the gods."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, my pardon!"], "id": 865, "m": "Oh, forgive me!"}, {"t": "sp", "who": "ANTONY", "lines": ["Now I must", "To the young man send humble treaties, dodge", "And palter in the shifts of lowness; who", "With half the bulk o' the world play'd as I pleas'd,", "Making and marring fortunes. You did know", "How much you were my conqueror; and that", "My sword, made weak by my affection, would", "Obey it on all cause."], "id": 866, "m": "Now I must send humble peace offers to that young man, and dodge and shuffle in the tricks of the defeated: I, who played with half the world as I liked, making and breaking fortunes. You knew how completely you'd conquered me, and that my sword, weakened by my love, would obey it whatever the cause."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Pardon, pardon!"], "id": 867, "m": "Forgive me, forgive me!"}, {"t": "sp", "who": "ANTONY", "lines": ["Fall not a tear, I say; one of them rates", "All that is won and lost: give me a kiss;", "Even this repays me.--We sent our schoolmaster;", "Is he come back?--Love, I am full of lead.--", "Some wine, within there, and our viands!--Fortune knows", "We scorn her most when most she offers blows."], "id": 868, "m": "Don't let a tear fall, I tell you. One of them is worth everything that's been won and lost. Give me a kiss. Even this repays me. We sent our schoolmaster to Caesar; has he come back? Love, I feel heavy as lead. Some wine, in there, and food! Fortune knows we scorn her most when she hits us hardest."}, {"t": "sd", "text": "Exeunt.", "id": 869}, {"t": "scene", "act": 3, "scene": "XII", "loc": "Caesar's camp in Egypt.", "id": 870}, {"t": "sd", "text": "Enter Caesar, Dolabella, Thyreus, with others.", "id": 871}, {"t": "sp", "who": "CAESAR", "lines": ["Let him appear that's come from Antony.--", "Know you him?"], "id": 872, "m": "Let the man from Antony come in. Do you know him?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["Caesar, 'tis his schoolmaster:", "An argument that he is pluck'd, when hither", "He sends so poor a pinion of his wing,", "Which had superfluous kings for messengers", "Not many moons gone by."], "id": 873, "m": "Caesar, it's his children's tutor. That proves he's been plucked bare, if he sends such a poor feather from his wing, when not many months ago he had kings to spare as messengers."}, {"t": "sd", "text": "Enter Euphronius.", "id": 874}, {"t": "sp", "who": "CAESAR", "lines": ["Approach, and speak."], "id": 875, "m": "Come forward and speak."}, {"t": "sp", "who": "EUPHRONIUS", "lines": ["Such as I am, I come from Antony:", "I was of late as petty to his ends", "As is the morn-dew on the myrtle leaf", "To his grand sea."], "id": 876, "m": "Lowly as I am, I come from Antony. Until recently I was as unimportant to his affairs as the morning dew on a myrtle leaf is to the great sea."}, {"t": "sp", "who": "CAESAR", "lines": ["Be't so: declare thine office."], "id": 877, "m": "So be it. State your business."}, {"t": "sp", "who": "EUPHRONIUS", "lines": ["Lord of his fortunes he salutes thee, and", "Requires to live in Egypt: which not granted,", "He lessens his requests; and to thee sues", "To let him breathe between the heavens and earth,", "A private man in Athens: this for him.", "Next, Cleopatra does confess thy greatness;", "Submits her to thy might, and of thee craves", "The circle of the Ptolemies for her heirs,", "Now hazarded to thy grace."], "id": 878, "m": "He greets you as the master of his fortunes and asks to live in Egypt. If that isn't allowed, he asks for less, and begs you to let him breathe between heaven and earth as a private citizen in Athens. That's for him. Next, Cleopatra acknowledges your greatness, submits to your power, and asks you to let her heirs keep the crown of the Ptolemies, which now depends on your mercy."}, {"t": "sp", "who": "CAESAR", "lines": ["For Antony,", "I have no ears to his request. The queen", "Of audience nor desire shall fail; so she", "From Egypt drive her all-disgraced friend,", "Or take his life there: this if she perform,", "She shall not sue unheard. So to them both."], "id": 879, "m": "As for Antony, I won't listen to his request. The queen will get a hearing and her wishes, provided she drives her disgraced lover out of Egypt or kills him there. If she does this, she won't plead unheard. Tell them both that."}, {"t": "sp", "who": "EUPHRONIUS", "lines": ["Fortune pursue thee!"], "id": 880, "m": "May fortune follow you!"}, {"t": "sp", "who": "CAESAR", "lines": ["Bring him through the bands."], "id": 881, "m": "Escort him through the lines."}, {"t": "sd", "text": "Exit Euphronius.", "id": 882}, {"t": "sp", "who": "CAESAR", "cont": 1, "lines": ["[To Thyreus.] To try thy eloquence, now 'tis time. Despatch;", "From Antony win Cleopatra. Promise,", "And in our name, what she requires; add more,", "From thine invention, offers: women are not", "In their best fortunes strong; but want will perjure", "The ne'er-touch'd vestal: try thy cunning, Thyreus;", "Make thine own edict for thy pains, which we", "Will answer as a law."], "id": 883, "m": "[To Thyreus] Now's the time to test your skill with words. Hurry. Win Cleopatra away from Antony. Promise her in our name whatever she asks, and invent more offers of your own. Women aren't strong even when things are going well, but need will make even a pure Vestal virgin break her vows. Use your cunning, Thyreus. Name your own reward for your efforts, and we'll honour it as law."}, {"t": "sp", "who": "THYREUS", "lines": ["Caesar, I go."], "id": 884, "m": "Caesar, I'm going."}, {"t": "sp", "who": "CAESAR", "lines": ["Observe how Antony becomes his flaw,", "And what thou think'st his very action speaks", "In every power that moves."], "id": 885, "m": "Notice how Antony bears his fall, and what you think his behaviour reveals in every move he makes."}, {"t": "sp", "who": "THYREUS", "lines": ["Caesar, I shall."], "id": 886, "m": "Caesar, I will."}, {"t": "sd", "text": "Exeunt.", "id": 887}, {"t": "scene", "act": 3, "scene": "XIII", "loc": "Alexandria. A Room in the Palace.", "id": 888}, {"t": "sd", "text": "Enter Cleopatra, Enobarbus, Charmian, and Iras.", "id": 889}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What shall we do, Enobarbus?"], "id": 890, "m": "What shall we do, Enobarbus?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Think, and die."], "id": 891, "m": "Think, and die."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Is Antony or we in fault for this?"], "id": 892, "m": "Is Antony to blame for this, or me?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Antony only, that would make his will", "Lord of his reason. What though you fled", "From that great face of war, whose several ranges", "Frighted each other? why should he follow?", "The itch of his affection should not then", "Have nick'd his captainship; at such a point,", "When half to half the world oppos'd, he being", "The mered question; 'twas a shame no less", "Than was his loss, to course your flying flags", "And leave his navy gazing."], "id": 893, "m": "Antony alone, who let his desire rule his reason. So what if you ran from that great face of war, where the ranks of ships terrified each other? Why did he have to follow? The itch of his passion shouldn't have cut into his leadership at a time like that, when half the world was fighting the other half and he was the whole cause of it. It was as shameful as his defeat, to chase after your fleeing ships and leave his navy staring."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Pr'ythee, peace."], "id": 894, "m": "Please, be quiet."}, {"t": "sd", "text": "Enter Antony, with Euphronius.", "id": 895}, {"t": "sp", "who": "ANTONY", "lines": ["Is that his answer?"], "id": 896, "m": "Is that his answer?"}, {"t": "sp", "who": "EUPHRONIUS", "lines": ["Ay, my lord."], "id": 897, "m": "Yes, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["The queen shall then have courtesy, so she", "Will yield us up."], "id": 898, "m": "Then the queen will be treated kindly, if she'll hand us over."}, {"t": "sp", "who": "EUPHRONIUS", "lines": ["He says so."], "id": 899, "m": "That's what he says."}, {"t": "sp", "who": "ANTONY", "lines": ["Let her know't.--", "To the boy Caesar send this grizzled head,", "And he will fill thy wishes to the brim", "With principalities."], "id": 900, "m": "Let her know it. Send this grey head to the boy Caesar, and he'll fill your wishes to the brim with kingdoms."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That head, my lord?"], "id": 901, "m": "That head, my lord?"}, {"t": "sp", "who": "ANTONY", "lines": ["To him again: tell him he wears the rose", "Of youth upon him; from which the world should note", "Something particular: his coins, ships, legions,", "May be a coward's; whose ministers would prevail", "Under the service of a child as soon", "As i' the command of Caesar: I dare him therefore", "To lay his gay comparisons apart,", "And answer me declin'd, sword against sword,", "Ourselves alone. I'll write it: follow me."], "id": 902, "m": "Go back to him. Tell him he has the bloom of youth on him, and the world should expect something special from him. His money, ships and legions could belong to a coward, and his officers might win just as well serving a child as under Caesar's command. So I dare him to put aside these showy advantages and fight me, the older man, sword against sword, just the two of us. I'll write it. Follow me."}, {"t": "sd", "text": "Exeunt Antony and Euphronius.", "id": 903}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Yes, like enough high-battled Caesar will", "Unstate his happiness, and be stag'd to the show", "Against a sworder.--I see men's judgments are", "A parcel of their fortunes; and things outward", "Do draw the inward quality after them,", "
