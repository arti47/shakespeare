 has happened. When she saw that you suspected she'd done a deal with Caesar (which will never be proved), and that your rage wouldn't calm down, she sent you word that she was dead. But afraid since then of what it might do, she's sent me to tell you the truth. And I've come, I fear, too late."}, {"t": "sp", "who": "ANTONY", "lines": ["Too late, good Diomed.--Call my guard, I pr'ythee."], "id": 1239, "m": "Too late, good Diomedes. Call my guard, please."}, {"t": "sp", "who": "DIOMEDES", "lines": ["What, ho! the emperor's guard! The guard, what ho!", "Come, your lord calls!"], "id": 1240, "m": "Hey! The commander's guard! The guard, hey! Come, your lord is calling!"}, {"t": "sd", "text": "Enter some of the Guard.", "id": 1241}, {"t": "sp", "who": "ANTONY", "lines": ["Bear me, good friends, where Cleopatra bides;", "'Tis the last service that I shall command you."], "id": 1242, "m": "Carry me, good friends, to where Cleopatra is staying. It's the last service I'll ask of you."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["Woe, woe are we, sir, you may not live to wear", "All your true followers out."], "id": 1243, "m": "Woe is us, sir, that you won't live to outlast all your faithful followers."}, {"t": "sp", "who": "ALL", "lines": ["Most heavy day!"], "id": 1244, "m": "What a sad day!"}, {"t": "sp", "who": "ANTONY", "lines": ["Nay, good my fellows, do not please sharp fate", "To grace it with your sorrows: bid that welcome", "Which comes to punish us, and we punish it,", "Seeming to bear it lightly. Take me up:", "I have led you oft: carry me now, good friends,", "And have my thanks for all."], "id": 1245, "m": "No, my good fellows, don't please cruel fate by honouring it with your sorrow. Welcome what comes to punish us, and we punish it by seeming to bear it lightly. Pick me up. I've often led you; carry me now, good friends, and have my thanks for everything."}, {"t": "sd", "text": "Exeunt, bearing Antony.", "id": 1246}, {"t": "scene", "act": 4, "scene": "XV", "loc": "Alexandria. A monument.", "id": 1247}, {"t": "sd", "text": "Enter, above, Cleopatra, Charmian and Iras.", "id": 1248}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O Charmian, I will never go from hence!"], "id": 1249, "m": "Oh Charmian, I'll never leave this place!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Be comforted, dear madam."], "id": 1250, "m": "Be comforted, dear madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["No, I will not:", "All strange and terrible events are welcome,", "But comforts we despise; our size of sorrow,", "Proportion'd to our cause, must be as great", "As that which makes it.--"], "id": 1251, "m": "No, I won't. Every strange and terrible event is welcome, but we despise comfort. The size of our sorrow, matching its cause, must be as great as what causes it."}, {"t": "sd", "text": "Enter, below, Diomedes.", "id": 1252}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["How now! is he dead?"], "id": 1253, "m": "What is it? Is he dead?"}, {"t": "sp", "who": "DIOMEDES", "lines": ["His death's upon him, but not dead.", "Look out o' the other side your monument;", "His guard have brought him thither."], "id": 1254, "m": "Death is on him, but he's not dead. Look out the other side of your monument. His guards have brought him there."}, {"t": "sd", "text": "Enter, below, Antony, borne by the Guard.", "id": 1255}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O sun,", "Burn the great sphere thou mov'st in!--darkling stand", "The varying shore o' the world.--O Antony,", "Antony, Antony!--Help, Charmian; help, Iras, help,--", "Help, friends below;--let's draw him hither."], "id": 1256, "m": "Oh sun, burn up the great sphere you move in! Let the changing shore of the world stand in darkness. Oh Antony, Antony, Antony! Help, Charmian; help, Iras, help. Help, friends down there. Let's pull him up here."}, {"t": "sp", "who": "ANTONY", "lines": ["Peace!", "Not Caesar's valour hath o'erthrown Antony,", "But Antony's hath triumph'd on itself."], "id": 1257, "m": "Quiet! It wasn't Caesar's courage that overthrew Antony, but Antony's courage that triumphed over itself."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["So it should be, that none but Antony", "Should conquer Antony; but woe 'tis so!"], "id": 1258, "m": "That's how it should be, that no one but Antony should conquer Antony. But how sad that it's so!"}, {"t": "sp", "who": "ANTONY", "lines": ["I am dying, Egypt, dying; only", "I here importune death awhile, until", "Of many thousand kisses the poor last", "I lay upon thy lips."], "id": 1259, "m": "I'm dying, Egypt, dying. I'm only begging death to wait a while, until I lay the poor last of many thousand kisses on your lips."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I dare not, dear,--", "Dear my lord, pardon,--I dare not,", "Lest I be taken: not the imperious show", "Of the full-fortun'd Caesar ever shall", "Be brooch'd with me; if knife, drugs, serpents, have", "Edge, sting, or operation, I am safe;", "Your wife Octavia, with her modest eyes", "And still conclusion, shall acquire no honour", "Demuring upon me.--But come, come, Antony,--", "Help me, my women,--we must draw thee up;", "Assist, good friends."], "id": 1260, "m": "I don't dare, dear. My dear lord, forgive me, I don't dare come down, or I'll be captured. The proud victory parade of all-fortunate Caesar will never be decorated with me. If knives, drugs or snakes have edge, sting or power, I'm safe. Your wife Octavia, with her modest eyes and quiet judgement, will never win the honour of looking down primly on me. But come, come, Antony. Help me, my women. We must pull you up. Help, good friends."}, {"t": "sp", "who": "ANTONY", "lines": ["O, quick, or I am gone."], "id": 1261, "m": "Oh, quickly, or I'll be gone."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Here's sport indeed!--How heavy weighs my lord!", "Our strength is all gone into heaviness;", "That makes the weight: had I great Juno's power,", "The strong-wing'd Mercury should fetch thee up,", "And set thee by Jove's side. Yet come a little,--", "Wishers were ever fools,--O come, come;"], "id": 1262, "m": "This is a fine game! How heavy my lord is! All our strength has turned into heaviness, and that makes the weight. If I had great Juno's power, strong-winged Mercury would fetch you up and set you beside Jupiter. Yet come up a little. People who only wish were always fools. Oh, come, come."}, {"t": "sd", "text": "They draw Antony up.", "id": 1263}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["And welcome, welcome! die where thou hast liv'd:", "Quicken with kissing: had my lips that power,", "Thus would I wear them out."], "id": 1264, "m": "And welcome, welcome! Die where you've lived. Come back to life with kisses. If my lips had that power, I'd wear them out like this."}, {"t": "sp", "who": "ALL", "lines": ["A heavy sight!"], "id": 1265, "m": "A sad sight!"}, {"t": "sp", "who": "ANTONY", "lines": ["I am dying, Egypt, dying:", "Give me some wine, and let me speak a little."], "id": 1266, "m": "I'm dying, Egypt, dying. Give me some wine, and let me say a few words."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["No, let me speak; and let me rail so high", "That the false huswife Fortune break her wheel,", "Provok'd by my offence."], "id": 1267, "m": "No, let me speak, and let me curse so loudly that Fortune, that unfaithful housewife, breaks her wheel in anger at my insults."}, {"t": "sp", "who": "ANTONY", "lines": ["One word, sweet queen:", "Of Caesar seek your honour, with your safety.--O!"], "id": 1268, "m": "One word, sweet queen. Get Caesar to protect your honour as well as your safety. Oh!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["They do not go together."], "id": 1269, "m": "They don't go together."}, {"t": "sp", "who": "ANTONY", "lines": ["Gentle, hear me:", "None about Caesar trust but Proculeius."], "id": 1270, "m": "Gentle one, listen to me. Trust no one around Caesar except Proculeius."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["My resolution and my hands I'll trust;", "None about Caesar."], "id": 1271, "m": "I'll trust my own determination and my own hands, not anyone around Caesar."}, {"t": "sp", "who": "ANTONY", "lines": ["The miserable change now at my end", "Lament nor sorrow at: but please your thoughts", "In feeding them with those my former fortunes", "Wherein I liv'd, the greatest prince o' the world,", "The noblest; and do now not basely die,", "Not cowardly put off my helmet to", "My countryman, a Roman by a Roman", "Valiantly vanquish'd. Now my spirit is going:", "I can no more."], "id": 1272, "m": "Don't grieve or mourn over the miserable change in my fortunes at my end. Instead please your thoughts by feeding them on my earlier fortunes, when I lived as the greatest prince in the world, the noblest. And now I don't die shamefully, or like a coward handing my helmet to my countryman, but as a Roman bravely conquered by a Roman. Now my spirit is leaving. I can't say more."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Noblest of men, woo't die?", "Hast thou no care of me? shall I abide", "In this dull world, which in thy absence is", "No better than a sty?--O, see, my women,"], "id": 1273, "m": "Noblest of men, will you die? Don't you care about me? Must I stay in this dull world, which without you is no better than a pigsty? Oh, look, my women,"}, {"t": "sd", "text": "Antony dies.", "id": 1274}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["The crown o' the earth doth melt.--My lord!--", "O, wither'd is the garland of the war,", "The soldier's pole is fallen: young boys and girls", "Are level now with men: the odds is gone,", "And there is nothing left remarkable", "Beneath the visiting moon."], "id": 1275, "m": "The crown of the earth melts. My lord! Oh, the garland of war has withered. The soldier's standard has fallen. Young boys and girls are now equal with men. All difference is gone, and there's nothing remarkable left under the changing moon."}, {"t": "sd", "text": "Faints.", "id": 1276}, {"t": "sp", "who": "CHARMIAN", "lines": ["O, quietness, lady!"], "id": 1277, "m": "Oh, calm yourself, lady!"}, {"t": "sp", "who": "IRAS", "lines": ["She is dead too, our sovereign."], "id": 1278, "m": "She's dead too, our queen."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Lady!--"], "id": 1279, "m": "Lady!"}, {"t": "sp", "who": "IRAS", "lines": ["Madam!--"], "id": 1280, "m": "Madam!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["O madam, madam, madam!--"], "id": 1281, "m": "Oh madam, madam, madam!"}, {"t": "sp", "who": "IRAS", "lines": ["Royal Egypt, Empress,--"], "id": 1282, "m": "Royal Egypt! Empress!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Peace, peace, Iras!"], "id": 1283, "m": "Quiet, quiet, Iras!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["No more but e'en a woman, and commanded", "By such poor passion as the maid that milks", "And does the meanest chares.--It were for me", "To throw my sceptre at the injurious gods;", "To tell them that this world did equal theirs", "Till they had stol'n our jewel. All's but naught;", "Patience is sottish, and impatience does", "Become a dog that's mad: then is it sin", "To rush into the secret house of death", "Ere death dare come to us?--How do you, women?", "What, what! good cheer! Why, how now, Charmian!", "My noble girls!--Ah, women, women, look,", "Our lamp is spent, it's out!--Good sirs, take heart:--", "We'll bury him; and then, what's brave, what's noble,", "Let's do it after the high Roman fashion,", "And make death proud to take us. Come, away:", "This case of that huge spirit now is cold:", "Ah, women, women!--Come; we have no friend", "But resolution, and the briefest end."], "id": 1284, "m": "No more than a woman, and ruled by the same poor emotions as the girl who milks the cows and does the lowest chores. I should throw my sceptre at the cruel gods and tell them this world was equal to theirs until they stole our jewel. Everything is worthless now. Patience is stupid, and impatience suits a mad dog. So is it a sin to rush into death's secret house before death dares to come to us? How are you, women? What, what! Cheer up! Why, Charmian! My noble girls! Ah, women, women, look, our lamp has burnt out; it's gone out! Good sirs, take heart. We'll bury him. And then, what's brave and noble, let's do it in the high Roman way, and make death proud to take us. Come, let's go. This body that held that huge spirit is cold now. Ah, women, women! Come. We have no friend but courage, and the quickest end."}, {"t": "sd", "text": "Exeunt; those above bearing off Antony's body.", "id": 1285}, {"t": "scene", "act": 5, "scene": "I", "loc": "Caesar's Camp before Alexandria.", "id": 1286}, {"t": "sd", "text": "Enter Caesar, Agrippa, Dolabella, Maecenas, Gallus, Proculeius, and Others.", "id": 1287}, {"t": "sp", "who": "CAESAR", "lines": ["Go to him, Dolabella, bid him yield;", "Being so frustrate, tell him he mocks", "The pauses that he makes."], "id": 1288, "m": "Go to him, Dolabella, and tell him to surrender. Tell him that, beaten as he is, his delays only make him look ridiculous."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Caesar, I shall."], "id": 1289, "m": "Caesar, I will."}, {"t": "sd", "text": "Exit.", "id": 1290}, {"t": "sd", "text": "Enter Dercetas with the sword of Antony.", "id": 1291}, {"t": "sp", "who": "CAESAR", "lines": ["Wherefore is that? And what art thou that dar'st", "Appear thus to us?"], "id": 1292, "m": "What's that for? And who are you, who dare come before us like this?"}, {"t": "sp", "who": "DERCETAS", "lines": ["I am call'd Dercetas;", "Mark Antony I serv'd, who best was worthy", "Best to be serv'd: whilst he stood up and spoke,", "He was my master, and I wore my life", "To spend upon his haters. If thou please", "To take me to thee, as I was to him", "I'll be to Caesar; if thou pleasest not,", "I yield thee up my life."], "id": 1293, "m": "My name is Dercetas. I served Mark Antony, who was the most worthy of being served. While he stood and spoke, he was my master, and I wore my life to spend against his enemies. If you'll take me into your service, I'll be to you what I was to him. If not, I give you my life."}, {"t": "sp", "who": "CAESAR", "lines": ["What is't thou say'st?"], "id": 1294, "m": "What are you saying?"}, {"t": "sp", "who": "DERCETAS", "lines": ["I say, O Caesar, Antony is dead."], "id": 1295, "m": "I'm saying, oh Caesar, that Antony is dead."}, {"t": "sp", "who": "CAESAR", "lines": ["The breaking of so great a thing should make", "A greater crack: the round world", "Should have shook lions into civil streets,", "And citizens to their dens. The death of Antony", "Is not a single doom; in the name lay", "A moiety of the world."], "id": 1296, "m": "The breaking of something so great should make a louder crash. The whole world should have shaken lions into city streets and citizens into lions' dens. The death of Antony isn't the end of just one man. Half the world was in that name."}, {"t": "sp", "who": "DERCETAS", "lines": ["He is dead, Caesar;", "Not by a public minister of justice,", "Nor by a hired knife; but that self hand", "Which writ his honour in the acts it did", "Hath, with the courage which the heart did lend it,", "Splitted the heart.--This is his sword;", "I robb'd his wound of it; behold it stain'd", "With his most noble blood."], "id": 1297, "m": "He's dead, Caesar. Not killed by a public executioner or a hired knife, but by the same hand that wrote his honour in the deeds it did. With the courage his heart gave it, it split that heart. This is his sword. I stole it from his wound. Look, it's stained with his most noble blood."}, {"t": "sp", "who": "CAESAR", "lines": ["Look you sad, friends?", "The gods rebuke me, but it is tidings", "To wash the eyes of kings."], "id": 1298, "m": "Do you look sad, friends? The gods can scold me, but this is news to make kings weep."}, {"t": "sp", "who": "AGRIPPA", "lines": ["And strange it is", "That nature must compel us to lament", "Our most persisted deeds."], "id": 1299, "m": "And it's strange that nature forces us to grieve over the very things we worked hardest to achieve."}, {"t": "sp", "who": "MAECENAS", "lines": ["His taints and honours", "Weigh'd equal with him."], "id": 1300, "m": "His faults and his honours were equally balanced in him."}, {"t": "sp", "who": "AGRIPPA", "lines": ["A rarer spirit never", "Did steer humanity. But you, gods, will give us", "Some faults to make us men. Caesar is touch'd."], "id": 1301, "m": "A rarer spirit never guided a human being. But you gods give us some faults to make us human. Caesar is moved."}, {"t": "sp", "who": "MAECENAS", "lines": ["When such a spacious mirror's set before him,", "He needs must see himself."], "id": 1302, "m": "When such a huge mirror is held up in front of him, he can't help seeing himself."}, {"t": "sp", "who": "CAESAR", "lines": ["O Antony!", "I have follow'd thee to this!--But we do lance", "Diseases in our bodies: I must perforce", "Have shown to thee such a declining day", "Or look on thine; we could not stall together", "In the whole world: but yet let me lament,", "With tears as sovereign as the blood of hearts,", "That thou, my brother, my competitor", "In top of all design, my mate in empire,", "Friend and companion in the front of war,", "The arm of mine own body, and the heart", "Where mine his thoughts did kindle,--that our stars,", "Unreconciliable, should divide", "Our equalness to this.--Hear me, good friends,--", "But I will tell you at some meeter season."], "id": 1303, "m": "Oh Antony! I've driven you to this! But we cut out diseases in our own bodies. I had no choice: I had to show you a day like this one of my decline, or watch yours. We couldn't both live in the whole world. Yet let me grieve, with tears as precious as heart's blood, that you, my brother, my partner in the highest enterprises, my fellow ruler of the empire, my friend and companion at the front of battle, the arm of my own body, and the heart that set my thoughts alight, that our stars, which could never be reconciled, should have split our equality like this. Listen to me, good friends... But I'll tell you at a better time."}, {"t": "sd", "text": "Enter a Messenger.", "id": 1304}, {"t": "sp", "who": "CAESAR", "cont": 1, "lines": ["The business of this man looks out of him;", "We'll hear him what he says.--Whence are you?"], "id": 1305, "m": "This man's business shows in his face. We'll hear what he has to say. Where are you from?"}, {"t": "sp", "who": "MESSENGER", "lines": ["A poor Egyptian yet. The queen, my mistress,", "Confin'd in all she has, her monument,", "Of thy intents desires instruction,", "That she preparedly may frame herself", "To the way she's forc'd to."], "id": 1306, "m": "A poor Egyptian still. The queen, my mistress, shut up in all she has left, her monument, wants to know your intentions, so she can prepare herself for whatever she's forced to do."}, {"t": "sp", "who": "CAESAR", "lines": ["Bid her have good heart:", "She soon shall know of us, by some of ours,", "How honourable and how kindly we", "Determine for her; for Caesar cannot learn", "To be ungentle."], "id": 1307, "m": "Tell her to take heart. She'll soon hear from some of our people how honourably and kindly we've decided to treat her. Caesar can't learn to be unkind."}, {"t": "sp", "who": "MESSENGER", "lines": ["So the gods preserve thee!"], "id": 1308, "m": "Then may the gods keep you!"}, {"t": "sd", "text": "Exit.", "id": 1309}, {"t": "sp", "who": "CAESAR", "lines": ["Come hither, Proculeius. Go and say", "We purpose her no shame: give her what comforts", "The quality of her passion shall require", "Lest, in her greatness, by some mortal stroke", "She do defeat us; for her life in Rome", "Would be eternal in our triumph: go,", "And with your speediest bring us what she says,", "And how you find her."], "id": 1310, "m": "Come here, Proculeius. Go and tell her we mean her no shame. Give her whatever comfort her grief needs, in case, in her pride, she kills herself and defeats us. Her being alive in Rome would make our triumph remembered for ever. Go, and as quickly as you can bring us back what she says and how she seems."}, {"t": "sp", "who": "PROCULEIUS", "lines": ["Caesar, I shall."], "id": 1311, "m": "Caesar, I will."}, {"t": "sd", "text": "Exit.", "id": 1312}, {"t": "sp", "who": "CAESAR", "lines": ["Gallus, go you along.--"], "id": 1313, "m": "Gallus, go with him."}, {"t": "sd", "text": "Exit Gallus.", "id": 1314}, {"t": "sp", "who": "CAESAR", "cont": 1, "lines": ["Where's Dolabella, to second Proculeius?"], "id": 1315, "m": "Where's Dolabella, to back up Proculeius?"}, {"t": "sp", "who": "ALL", "lines": ["Dolabella!"], "id": 1316, "m": "Dolabella!"}, {"t": "sp", "who": "CAESAR", "lines": ["Let him alone, for I remember now", "How he's employ'd; he shall in time be ready.", "Go with me to my tent; where you shall see", "How hardly I was drawn into this war;", "How calm and gentle I proceeded still", "In all my writings: go with me, and see", "What I can show in this."], "id": 1317, "m": "Never mind; I remember now what he's doing. He'll be ready soon. Come with me to my tent, where you'll see how reluctantly I was drawn into this war, and how calmly and gently I always went about it in all my letters. Come with me and see what I can show you."}, {"t": "sd", "text": "Exeunt.", "id": 1318}, {"t": "scene", "act": 5, "scene": "II", "loc": "Alexandria. A Room in the Monument.", "id": 1319}, {"t": "sd", "text": "Enter Cleopatra, Charmian, and Iras.", "id": 1320}, {"t": "sp", "who": "CLEOPATRA", "lines": ["My desolation does begin to make", "A better life. 'Tis paltry to be Caesar;", "Not being Fortune, he's but Fortune's knave,", "A minister of her will: and it is great", "To do that thing that ends all other deeds;", "Which shackles accidents and bolts up change;", "Which sleeps, and never palates more the dug,", "The beggar's nurse and Caesar's."], "id": 1321, "m": "My loneliness is starting to make a better life for me. It's worthless to be Caesar. He's not Fortune, just Fortune's servant, carrying out her wishes. And it's a great thing to do the deed that ends all other deeds, that chains up accidents and locks out change, that sleeps and never again tastes the earth's breast that feeds both beggar and Caesar."}, {"t": "sd", "text": "Enter, to the gates of the Monument, Proculeius, Gallus, and Soldiers.", "id": 1322}, {"t": "sp", "who": "PROCULEIUS", "lines": ["Caesar sends greetings to the queen of Egypt;", "And bids thee study on what fair demands", "Thou mean'st to have him grant thee."], "id": 1323, "m": "Caesar sends greetings to the Queen of Egypt, and asks you to think about what fair requests you'd like him to grant you."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What's thy name?"], "id": 1324, "m": "What's your name?"}, {"t": "sp", "who": "PROCULEIUS", "lines": ["My name is Proculeius."], "id": 1325, "m": "My name is Proculeius."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Antony", "Did tell me of you, bade me trust you; but", "I do not greatly care to be deceiv'd,", "That have no use for trusting. If your master", "Would have a queen his beggar, you must tell him", "That majesty, to keep decorum, must", "No less beg than a kingdom: if he please", "To give me conquer'd Egypt for my son,", "He gives me so much of mine own as I", "Will kneel to him with thanks."], "id": 1326, "m": "Antony told me about you and said I should trust you. But I don't much mind being deceived, since I've no use for trust any more. If your master wants a queen as his beggar, you must tell him that a queen, to keep up her dignity, can't beg for less than a kingdom. If he's willing to give me conquered Egypt for my son, he'll be giving me so much of what's mine that I'll kneel and thank him."}, {"t": "sp", "who": "PROCULEIUS", "lines": ["Be of good cheer;", "You are fallen into a princely hand; fear nothing:", "Make your full reference freely to my lord,", "Who is so full of grace that it flows over", "On all that need: let me report to him", "Your sweet dependency; and you shall find", "A conqueror that will pray in aid for kindness", "Where he for grace is kneel'd to."], "id": 1327, "m": "Cheer up. You've fallen into a prince's hands; don't be afraid. Put yourself completely in my lord's hands. He's so full of grace that it overflows onto everyone in need. Let me tell him how sweetly you depend on him, and you'll find a conqueror who will ask others to help him be kind to you, when you kneel to him for mercy."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Pray you, tell him", "I am his fortune's vassal and I send him", "The greatness he has got. I hourly learn", "A doctrine of obedience; and would gladly", "Look him i' the face."], "id": 1328, "m": "Please tell him I'm the servant of his good fortune, and I acknowledge the greatness he's won. Every hour I'm learning how to obey, and I'd gladly see him face to face."}, {"t": "sp", "who": "PROCULEIUS", "lines": ["This I'll report, dear lady.", "Have comfort, for I know your plight is pitied", "Of him that caus'd it."], "id": 1329, "m": "I'll tell him that, dear lady. Take comfort, because I know the man who caused your trouble pities you."}, {"t": "sp", "who": "GALLUS", "lines": ["You see how easily she may be surpris'd:"], "id": 1330, "m": "You see how easily she can be taken by surprise."}, {"t": "sd", "text": "Here Proculeius and two of the Guard ascend the Monument by a ladder placed against a window, and, having ascended, come behind Cleopatra. Some of the Guard unbar and open the gates.", "id": 1331}, {"t": "sp", "who": "GALLUS", "cont": 1, "lines": ["[To Proculeius. and the Guard.] Guard her till Caesar come."], "id": 1332, "m": "[To Proculeius and the guard] Guard her till Caesar comes."}, {"t": "sd", "text": "Exit.", "id": 1333}, {"t": "sp", "who": "IRAS", "lines": ["Royal queen!"], "id": 1334, "m": "Royal queen!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["O Cleopatra! thou art taken, queen!"], "id": 1335, "m": "Oh Cleopatra! You're captured, queen!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Quick, quick, good hands.", "[Drawing a dagger.]"], "id": 1336, "m": "Quick, quick, good hands. [She draws a dagger.]"}, {"t": "sp", "who": "PROCULEIUS", "lines": ["Hold, worthy lady, hold;", "[Seizes and disarms her.]", "Do not yourself such wrong, who are in this", "Reliev'd, but not betray'd."], "id": 1337, "m": "Stop, worthy lady, stop! [He seizes the dagger from her.] Don't do yourself such harm. You've been rescued here, not betrayed."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What, of death too,", "That rids our dogs of languish?"], "id": 1338, "m": "Rescued even from death, which puts our dogs out of their misery?"}, {"t": "sp", "who": "PROCULEIUS", "lines": ["Cleopatra,", "Do not abuse my master's bounty by", "The undoing of yourself: let the world see", "His nobleness well acted, which your death", "Will never let come forth."], "id": 1339, "m": "Cleopatra, don't insult my master's generosity by destroying yourself. Let the world see his nobility in action, which your death would never allow."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Where art thou, death?", "Come hither, come! Come, come, and take a queen", "Worth many babes and beggars!"], "id": 1340, "m": "Where are you, death? Come here, come! Come, come and take a queen worth many babies and beggars!"}, {"t": "sp", "who": "PROCULEIUS", "lines": ["O, temperance, lady!"], "id": 1341, "m": "Oh, calm yourself, lady!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sir, I will eat no meat; I'll not drink, sir;", "If idle talk will once be accessary,", "I'll not sleep neither: this mortal house I'll ruin,", "Do Caesar what he can. Know, sir, that I", "Will not wait pinion'd at your master's court;", "Nor once be chastis'd with the sober eye", "Of dull Octavia. Shall they hoist me up,", "And show me to the shouting varletry", "Of censuring Rome? Rather a ditch in Egypt", "Be gentle grave unto me! rather on Nilus' mud", "Lay me stark-nak'd, and let the water-flies", "Blow me into abhorring! rather make", "My country's high pyramides my gibbet,", "And hang me up in chains!"], "id": 1342, "m": "Sir, I won't eat food. I won't drink, sir. And if I have to talk nonsense to stay awake, I won't sleep either. I'll destroy this mortal body, whatever Caesar does. Know this, sir: I won't wait with my arms tied at your master's court, or be punished even once by the solemn look of dull Octavia. Will they hoist me up and show me to the jeering rabble of disapproving Rome? I'd rather have a ditch in Egypt as a gentle grave! I'd rather lie stark naked on the Nile's mud and let the water-flies lay their eggs on me until I'm disgusting! I'd rather make my country's high pyramids my gallows and hang there in chains!"}, {"t": "sp", "who": "PROCULEIUS", "lines": ["You do extend", "These thoughts of horror further than you shall", "Find cause in Caesar."], "id": 1343, "m": "You're taking these horrible thoughts much further than Caesar will give you reason to."}, {"t": "sd", "text": "Enter Dolabella.", "id": 1344}, {"t": "sp", "who": "DOLABELLA", "lines": ["Proculeius,", "What thou hast done thy master Caesar knows,", "And he hath sent for thee: as for the queen,", "I'll take her to my guard."], "id": 1345, "m": "Proculeius, your master Caesar knows what you've done, and he's sent for you. As for the queen, I'll take her into my care."}, {"t": "sp", "who": "PROCULEIUS", "lines": ["So, Dolabella,", "It shall content me best: be gentle to her.--", "[To Cleopatra.] To Caesar I will speak what you shall please,", "If you'll employ me to him."], "id": 1346, "m": "Fine, Dolabella, I'm happy with that. Be gentle with her. [To Cleopatra] I'll tell Caesar whatever you want, if you'll make me your messenger to him."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Say I would die."], "id": 1347, "m": "Tell him I want to die."}, {"t": "sd", "text": "Exeunt Proculeius and Soldiers.", "id": 1348}, {"t": "sp", "who": "DOLABELLA", "lines": ["Most noble empress, you have heard of me?"], "id": 1349, "m": "Most noble empress, have you heard of me?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I cannot tell."], "id": 1350, "m": "I can't say."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Assuredly you know me."], "id": 1351, "m": "Surely you know me."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["No matter, sir, what I have heard or known.", "You laugh when boys or women tell their dreams;", "Is't not your trick?"], "id": 1352, "m": "It doesn't matter, sir, what I've heard or known. You laugh when boys or women tell you their dreams. Isn't that your habit?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["I understand not, madam."], "id": 1353, "m": "I don't understand, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I dream'd there was an Emperor Antony:--", "O, such another sleep, that I might see", "But such another man!"], "id": 1354, "m": "I dreamt there was an Emperor Antony. Oh, for another sleep like that, so I could see such a man again!"}, {"t": "sp", "who": "DOLABELLA", "lines": ["If it might please you,--"], "id": 1355, "m": "If you'd please..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["His face was as the heavens; and therein stuck", "A sun and moon, which kept their course, and lighted", "The little O, the earth."], "id": 1356, "m": "His face was like the sky, and in it were set a sun and moon, which kept their course and lit up this little O, the earth."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Most sovereign creature,--"], "id": 1357, "m": "Most royal lady..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["His legs bestrid the ocean; his rear'd arm", "Crested the world: his voice was propertied", "As all the tuned spheres, and that to friends;", "But when he meant to quail and shake the orb,", "He was as rattling thunder. For his bounty,", "There was no winter in't; an autumn 'twas", "That grew the more by reaping: his delights", "Were dolphin-like; they show'd his back above", "The element they liv'd in: in his livery", "Walk'd crowns and crownets; realms and islands were", "As plates dropp'd from his pocket."], "id": 1358, "m": "His legs straddled the ocean; his raised arm was like a crest over the world. His voice had the music of all the singing spheres, and that was for his friends. But when he wanted to terrify and shake the globe, he was like rattling thunder. As for his generosity, there was no winter in it. It was an autumn that grew richer the more it was harvested. His pleasures were like dolphins: they showed his back above the element they lived in. Kings and princes walked among his servants. Kingdoms and islands were like coins dropped from his pocket."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Cleopatra,--"], "id": 1359, "m": "Cleopatra..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Think you there was or might be such a man", "As this I dream'd of?"], "id": 1360, "m": "Do you think there was, or could be, a man like the one I dreamt of?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["Gentle madam, no."], "id": 1361, "m": "Gentle madam, no."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["You lie, up to the hearing of the gods.", "But if there be, or ever were, one such,", "It's past the size of dreaming: nature wants stuff", "To vie strange forms with fancy: yet to imagine", "An Antony were nature's piece 'gainst fancy,", "Condemning shadows quite."], "id": 1362, "m": "You lie, loudly enough for the gods to hear. But if there is, or ever was, such a man, he's beyond the size of dreams. Nature usually lacks the material to compete with imagination in creating wonderful shapes. Yet to imagine an Antony was nature's masterpiece against imagination, putting all fantasies to shame."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Hear me, good madam.", "Your loss is, as yourself, great; and you bear it", "As answering to the weight: would I might never", "O'ertake pursu'd success, but I do feel,", "By the rebound of yours, a grief that smites", "My very heart at root."], "id": 1363, "m": "Listen to me, good madam. Your loss is as great as you are, and you bear it as its weight deserves. May I never achieve what I'm aiming for if I don't feel, as an echo of your grief, a sorrow that strikes the very root of my heart."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I thank you, sir.", "Know you what Caesar means to do with me?"], "id": 1364, "m": "Thank you, sir. Do you know what Caesar plans to do with me?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["I am loath to tell you what I would you knew."], "id": 1365, "m": "I don't want to tell you what I wish you knew."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, pray you, sir,--"], "id": 1366, "m": "No, please, sir..."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Though he be honourable,--"], "id": 1367, "m": "Though he's honourable..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He'll lead me, then, in triumph?"], "id": 1368, "m": "He'll lead me in his victory parade, then?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["Madam, he will;", "I know it."], "id": 1369, "m": "Madam, he will. I know it."}, {"t": "sd", "text": "Flourish within.", "id": 1370}, {"t": "sp", "who": "DOLABELLA", "cont": 1, "lines": ["[Within.] Make way there,--Caesar!"], "id": 1371, "m": "[Offstage] Make way there! Caesar!"}, {"t": "sd", "text": "Enter Caesar, Gallus, Proculeius, Maecenas, Seleucus, and Attendants.", "id": 1372}, {"t": "sp", "who": "CAESAR", "lines": ["Which is the queen of Egypt?"], "id": 1373, "m": "Which one is the Queen of Egypt?"}, {"t": "sp", "who": "DOLABELLA", "lines": ["It is the emperor, madam."], "id": 1374, "m": "It's the emperor, madam."}, {"t": "sd", "text": "Cleopatra kneels.", "id": 1375}, {"t": "sp", "who": "CAESAR", "lines": ["Arise, you shall not kneel:--", "I pray you, rise; rise, Egypt."], "id": 1376, "m": "Get up. You shall not kneel. Please, get up. Get up, Egypt."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sir, the gods", "Will have it thus; my master and my lord", "I must obey."], "id": 1377, "m": "Sir, the gods want it this way. I must obey my master and my lord."}, {"t": "sp", "who": "CAESAR", "lines": ["Take to you no hard thoughts;", "The record of what injuries you did us,", "Though written in our flesh, we shall remember", "As things but done by chance."], "id": 1378, "m": "Don't think harshly. Though the record of the injuries you did us is written in our flesh, we'll remember them as things that happened by chance."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Sole sir o' the world,", "I cannot project mine own cause so well", "To make it clear: but do confess I have", "Been laden with like frailties which before", "Have often sham'd our sex."], "id": 1379, "m": "Only lord of the world, I can't present my own case well enough to clear myself. But I confess I've been burdened with the same weaknesses that have often shamed women before."}, {"t": "sp", "who": "CAESAR", "lines": ["Cleopatra, know", "We will extenuate rather than enforce:", "If you apply yourself to our intents,--", "Which towards you are most gentle,--you shall find", "A benefit in this change; but if you seek", "To lay on me a cruelty, by taking", "Antony's course, you shall bereave yourself", "Of my good purposes, and put your children", "To that destruction which I'll guard them from,", "If thereon you rely. I'll take my leave."], "id": 1380, "m": "Cleopatra, understand that we'll make light of your faults rather than press them. If you go along with our intentions, which are very gentle towards you, you'll benefit from this change. But if you try to make me look cruel by following Antony's example, you'll lose my good intentions, and put your children in the danger I'll protect them from if you rely on me. I'll take my leave."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["And may, through all the world: 'tis yours, and we,", "Your scutcheons and your signs of conquest, shall", "Hang in what place you please. Here, my good lord."], "id": 1381, "m": "And you may, through the whole world. It's yours, and we, your shields and trophies of conquest, will hang wherever you please. Here, my good lord."}, {"t": "sp", "who": "CAESAR", "lines": ["You shall advise me in all for Cleopatra."], "id": 1382, "m": "You'll advise me on everything to do with Cleopatra."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["This is the brief of money, plate, and jewels,", "I am possess'd of: 'tis exactly valued;", "Not petty things admitted.--Where's Seleucus?"], "id": 1383, "m": "This is the list of money, gold and silver, and jewels I own. It's valued exactly; small things aren't included. Where's Seleucus?"}, {"t": "sp", "who": "SELEUCUS", "lines": ["Here, madam."], "id": 1384, "m": "Here, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["This is my treasurer: let him speak, my lord,", "Upon his peril, that I have reserv'd", "To myself nothing. Speak the truth, Seleucus."], "id": 1385, "m": "This is my treasurer. Let him tell you, my lord, on pain of punishment, that I've kept nothing back for myself. Tell the truth, Seleucus."}, {"t": "sp", "who": "SELEUCUS", "lines": ["Madam,", "I had rather seal my lips than to my peril", "Speak that which is not."], "id": 1386, "m": "Madam, I'd rather seal my lips than say what isn't true and risk punishment."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What have I kept back?"], "id": 1387, "m": "What have I kept back?"}, {"t": "sp", "who": "SELEUCUS", "lines": ["Enough to purchase what you have made known."], "id": 1388, "m": "Enough to buy everything you've listed."}, {"t": "sp", "who": "CAESAR", "lines": ["Nay, blush not, Cleopatra; I approve", "Your wisdom in the deed."], "id": 1389, "m": "No, don't blush, Cleopatra. I approve of your good sense in doing it."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["See, Caesar! O, behold,", "How pomp is follow'd! Mine will now be yours;", "And, should we shift estates, yours would be mine.", "The ingratitude of this Seleucus does", "Even make me wild: O slave, of no more trust", "Than love that's hir'd!--What, goest thou back? thou shalt", "Go back, I warrant thee; but I'll catch thine eyes", "Though they had wings; slave, soulless villain, dog!", "O rarely base!"], "id": 1390, "m": "See, Caesar! Oh, look how greatness is followed! My servants will now be yours, and if we swapped places, yours would be mine. This Seleucus's ingratitude makes me wild. Oh slave, no more to be trusted than paid-for love! What, are you backing away? You'll back away, I promise you. But I'll catch your eyes even if they had wings. Slave, soulless villain, dog! Oh, exceptionally low!"}, {"t": "sp", "who": "CAESAR", "lines": ["Good queen, let us entreat you."], "id": 1391, "m": "Good queen, let us beg you to stop."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O Caesar, what a wounding shame is this,--", "That thou vouchsafing here to visit me,", "Doing the honour of thy lordliness", "To one so meek, that mine own servant should", "Parcel the sum of my disgraces by", "Addition of his envy! Say, good Caesar,", "That I some lady trifles have reserv'd,", "Immoment toys, things of such dignity", "As we greet modern friends withal; and say,", "Some nobler token I have kept apart", "For Livia and Octavia, to induce", "Their mediation;--must I be unfolded", "With one that I have bred? The gods! It smites me", "Beneath the fall I have.", "[To Seleucus.] Pr'ythee go hence;", "Or I shall show the cinders of my spirits", "Through the ashes of my chance.--Wert thou a man,", "Thou wouldst have mercy on me."], "id": 1392, "m": "Oh Caesar, what a wounding shame this is! That when you condescend to visit me here, honouring someone so humble with your lordly presence, my own servant should add to the sum of my disgraces with his malice! Say, good Caesar, that I have kept back some ladies' trinkets, unimportant toys, the kind of things we give to ordinary friends. And say I've kept some nobler gift aside for Livia and Octavia, to win them to plead for me. Must I be exposed by someone I raised myself? Gods! It strikes me lower than my fall already has. [To Seleucus] Please go away, or I'll show the sparks of my spirit through the ashes of my fortune. If you were a man, you'd have pity on me."}, {"t": "sp", "who": "CAESAR", "lines": ["Forbear, Seleucus."], "id": 1393, "m": "Leave us, Seleucus."}, {"t": "sd", "text": "Exit Seleucus.", "id": 1394}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Be it known that we, the greatest, are misthought", "For things that others do; and when we fall", "We answer others' merits in our name,", "Are therefore to be pitied."], "id": 1395, "m": "Let it be known that we, the greatest, are blamed for things others do. And when we fall, we answer in our own name for others' deeds, so we should be pitied."}, {"t": "sp", "who": "CAESAR", "lines": ["Cleopatra,", "Not what you have reserv'd, nor what acknowledg'd,", "Put we i' the roll of conquest: still be't yours,", "Bestow it at your pleasure; and believe", "Caesar's no merchant, to make prize with you", "Of things that merchants sold. Therefore be cheer'd;", "Make not your thoughts your prisons: no, dear queen;", "For we intend so to dispose you as", "Yourself shall give us counsel. Feed and sleep:", "Our care and pity is so much upon you", "That we remain your friend; and so, adieu."], "id": 1396, "m": "Cleopatra, we won't count what you've kept back, or what you've declared, as part of our conquest. Let it stay yours. Give it away as you like, and believe me, Caesar isn't a merchant who'll bargain with you over things merchants sell. So cheer up. Don't make your thoughts your prison. No, dear queen, because we plan to treat you as you yourself advise. Eat and sleep. Our care and pity for you are so great that we remain your friend. And so, goodbye."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["My master and my lord!"], "id": 1397, "m": "My master and my lord!"}, {"t": "sp", "who": "CAESAR", "lines": ["Not so. Adieu."], "id": 1398, "m": "Not so. Goodbye."}, {"t": "sd", "text": "Flourish. Exeunt Caesar and his Train.", "id": 1399}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He words me, girls, he words me, that I should not", "Be noble to myself: but hark thee, Charmian!"], "id": 1400, "m": "He uses words on me, girls, words, so that I won't do the noble thing for myself. But listen, Charmian!"}, {"t": "sd", "text": "Whispers Charmian.", "id": 1401}, {"t": "sp", "who": "IRAS", "lines": ["Finish, good lady; the bright day is done,", "And we are for the dark."], "id": 1402, "m": "Finish it, good lady. The bright day is over, and we're bound for the dark."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Hie thee again:", "I have spoke already, and it is provided;", "Go put it to the haste."], "id": 1403, "m": "Hurry back. I've already given the order, and it's arranged. Go and speed it up."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Madam, I will."], "id": 1404, "m": "Madam, I will."}, {"t": "sd", "text": "Re-enter Dolabella.", "id": 1405}, {"t": "sp", "who": "DOLABELLA", "lines": ["Where's the queen?"], "id": 1406, "m": "Where's the queen?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Behold, sir."], "id": 1407, "m": "Here, sir."}, {"t": "sd", "text": "Exit.", "id": 1408}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Dolabella!"], "id": 1409, "m": "Dolabella!"}, {"t": "sp", "who": "DOLABELLA", "lines": ["Madam, as thereto sworn by your command,", "Which my love makes religion to obey,", "I tell you this: Caesar through Syria", "Intends his journey; and within three days", "You with your children will he send before:", "Make your best use of this: I have perform'd", "Your pleasure and my promise."], "id": 1410, "m": "Madam, as I swore to you at your command, which my love makes a religious duty to obey, I'm telling you this: Caesar plans to travel through Syria, and within three days he'll send you and your children ahead of him. Make the best use of this. I've done what you wanted and kept my promise."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Dolabella,", "I shall remain your debtor."], "id": 1411, "m": "Dolabella, I'll always be in your debt."}, {"t": "sp", "who": "DOLABELLA", "lines": ["I your servant.", "Adieu, good queen; I must attend on Caesar."], "id": 1412, "m": "And I your servant. Goodbye, good queen. I must go back to Caesar."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Farewell, and thanks."], "id": 1413, "m": "Goodbye, and thank you."}, {"t": "sd", "text": "Exit Dolabella.", "id": 1414}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Now, Iras, what think'st thou?", "Thou, an Egyptian puppet, shall be shown", "In Rome as well as I: mechanic slaves,", "With greasy aprons, rules, and hammers, shall", "Uplift us to the view; in their thick breaths,", "Rank of gross diet, shall we be enclouded,", "And forc'd to drink their vapour."], "id": 1415, "m": "Now, Iras, what do you think? You, an Egyptian puppet, will be put on show in Rome as well as me. Working-class slaves in greasy aprons, with rulers and hammers, will lift us up for everyone to see. We'll be wrapped in the clouds of their bad breath, stinking of coarse food, and forced to breathe it in."}, {"t": "sp", "who": "IRAS", "lines": ["The gods forbid!"], "id": 1416, "m": "The gods forbid!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, 'tis most certain, Iras:--saucy lictors", "Will catch at us like strumpets; and scald rhymers", "Ballad us out o' tune: the quick comedians", "Extemporally will stage us, and present", "Our Alexandrian revels; Antony", "Shall be brought drunken forth, and I shall see", "Some squeaking Cleopatra boy my greatness", "I' the posture of a whore."], "id": 1417, "m": "No, it's quite certain, Iras. Cheeky officers will grab at us like whores, and lousy poets will sing ballads about us out of tune. Quick-witted comic actors will make up plays about us on the spot and act out our parties in Alexandria. Antony will be brought on stage drunk, and I'll see some squeaky-voiced boy playing Cleopatra, mocking my greatness in the pose of a whore."}, {"t": "sp", "who": "IRAS", "lines": ["O the good gods!"], "id": 1418, "m": "Oh, good gods!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, that's certain."], "id": 1419, "m": "No, that's certain."}, {"t": "sp", "who": "IRAS", "lines": ["I'll never see't; for I am sure mine nails", "Are stronger than mine eyes."], "id": 1420, "m": "I'll never see it, because I'm sure my nails are stronger than my eyes."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Why, that's the way", "To fool their preparation and to conquer", "Their most absurd intents."], "id": 1421, "m": "Why, that's the way to make fools of their preparations and defeat their absurd plans."}, {"t": "sd", "text": "Enter Charmian.", "id": 1422}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Now, Charmian!--", "Show me, my women, like a queen.--Go fetch", "My best attires;--I am again for Cydnus,", "To meet Mark Antony:--sirrah, Iras, go.--", "Now, noble Charmian, we'll despatch indeed;", "And when thou hast done this chare, I'll give thee leave", "To play till doomsday.--Bring our crown and all."], "id": 1423, "m": "Now, Charmian! Dress me like a queen, my women. Go and fetch my best clothes. I'm going to Cydnus again, to meet Mark Antony. Go, Iras. Now, noble Charmian, we'll really finish things. And when you've done this job, I'll give you leave to play until doomsday. Bring our crown and everything."}, {"t": "sd", "text": "Exit Iras. A noise within.", "id": 1424}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Wherefore's this noise?"], "id": 1425, "m": "What's that noise?"}, {"t": "sd", "text": "Enter one of the Guard.", "id": 1426}, {"t": "sp", "who": "GUARD", "lines": ["Here is a rural fellow", "That will not be denied your highness' presence:", "He brings you figs."], "id": 1427, "m": "There's a country fellow here who won't take no for an answer and insists on seeing your highness. He's brought you figs."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Let him come in."], "id": 1428, "m": "Let him come in."}, {"t": "sd", "text": "Exit Guard.", "id": 1429}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["What poor an instrument", "May do a noble deed! he brings me liberty.", "My resolution's plac'd, and I have nothing", "Of woman in me: now from head to foot", "I am marble-constant; now the fleeting moon", "No planet is of mine."], "id": 1430, "m": "What a humble instrument can do a noble deed! He brings me freedom. My mind's made up, and there's nothing of a woman in me now. From head to foot I'm as steady as marble. The changing moon is no longer my planet."}, {"t": "sd", "text": "Re-enter Guard, with Clown bringing a basket.", "id": 1431}, {"t": "sp", "who": "GUARD", "lines": ["This is the man."], "id": 1432, "m": "This is the man."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Avoid, and leave him."], "id": 1433, "m": "Go, and leave him here."}, {"t": "sd", "text": "Exit Guard.", "id": 1434}, {"t": "sp", "who": "CLEOPATRA", "cont": 1, "lines": ["Hast thou the pretty worm of Nilus there", "That kills and pains not?"], "id": 1435, "m": "Do you have the pretty serpent of the Nile there, the one that kills without pain?"}, {"t": "sp", "who": "CLOWN", "lines": ["Truly, I have him. But I would not be the party that should", "desire you to touch him, for his biting is immortal; those that", "do die of it do seldom or never recover."], "id": 1436, "m": "I've got him, all right. But I wouldn't want to be the one to tell you to touch him, because his bite is immortal. Those who die of it seldom or never recover."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Remember'st thou any that have died on't?"], "id": 1437, "m": "Do you remember anyone who has died of it?"}, {"t": "sp", "who": "CLOWN", "lines": ["Very many, men and women too. I heard of one of them no longer", "than yesterday: a very honest woman, but something given to lie;", "as a woman should not do but in the way of honesty: how she died", "of the biting of it, what pain she felt,--truly she makes a very", "good report o' the worm; but he that will believe all that they", "say shall never be saved by half that they do: but this is most", "falliable, the worm's an odd worm."], "id": 1438, "m": "Lots, men and women too. I heard about one of them only yesterday: a very honest woman, but a bit inclined to lie, which a woman shouldn't do except honestly. She told how she died of the bite and what pain she felt. Truly, she gives the worm a very good report. But anyone who believes everything they say will never be saved by half of what they do. But this is most fallible: the worm's an odd worm."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Get thee hence; farewell."], "id": 1439, "m": "Go now. Goodbye."}, {"t": "sp", "who": "CLOWN", "lines": ["I wish you all joy of the worm."], "id": 1440, "m": "I wish you all the joy of the worm."}, {"t": "sd", "text": "Sets down the basket.", "id": 1441}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Farewell."], "id": 1442, "m": "Goodbye."}, {"t": "sp", "who": "CLOWN", "lines": ["You must think this, look you, that the worm will do his kind."], "id": 1443, "m": "You must understand, you see, that the worm will do what it's made to do."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Ay, ay; farewell."], "id": 1444, "m": "Yes, yes. Goodbye."}, {"t": "sp", "who": "CLOWN", "lines": ["Look you, the worm is not to be trusted but in the keeping of", "wise people; for indeed there is no goodness in the worm."], "id": 1445, "m": "Look, the worm can only be trusted in the care of wise people, because there's really no goodness in the worm."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Take thou no care; it shall be heeded."], "id": 1446, "m": "Don't worry. We'll be careful with it."}, {"t": "sp", "who": "CLOWN", "lines": ["Very good. Give it nothing, I pray you, for it is not worth the", "feeding."], "id": 1447, "m": "Very good. Don't give it anything to eat, please, because it isn't worth feeding."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Will it eat me?"], "id": 1448, "m": "Will it eat me?"}, {"t": "sp", "who": "CLOWN", "lines": ["You must not think I am so simple but I know the devil himself", "will not eat a woman: I know that a woman is a dish for the gods,", "if the devil dress her not. But truly, these same whoreson devils", "do the gods great harm in their women, for in every ten that they", "make the devils mar five."], "id": 1449, "m": "You mustn't think I'm so simple that I don't know the devil himself won't eat a woman. I know that a woman is a dish fit for the gods, if the devil doesn't cook her. But truly, these same rotten devils do the gods great harm with their women, because for every ten the gods make, the devils spoil five."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Well, get thee gone; farewell."], "id": 1450, "m": "Well, go away. Goodbye."}, {"t": "sp", "who": "CLOWN", "lines": ["Yes, forsooth. I wish you joy o' the worm."], "id": 1451, "m": "Yes, indeed. I wish you joy of the worm."}, {"t": "sd", "text": "Exit.", "id": 1452}, {"t": "sd", "text": "Re-enter Iras, with a robe, crown, &c.", "id": 1453}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Give me my robe, put on my crown; I have", "Immortal longings in me: now no more", "The juice of Egypt's grape shall moist this lip:--", "Yare, yare, good Iras; quick.--Methinks I hear", "Antony call; I see him rouse himself", "To praise my noble act; I hear him mock", "The luck of Caesar, which the gods give men", "To excuse their after wrath. Husband, I come:", "Now to that name my courage prove my title!", "I am fire and air; my other elements", "I give to baser life.--So,--have you done?", "Come then, and take the last warmth of my lips.", "Farewell, kind Charmian;--Iras, long farewell.", "[Kisses them. Iras falls and dies.]", "Have I the aspic in my lips? Dost fall?", "If thus thou and nature can so gently part,", "The stroke of death is as a lover's pinch,", "Which hurts and is desir'd. Dost thou lie still?", "If thou vanishest, thou tell'st the world", "It is not worth leave-taking."], "id": 1454, "m": "Give me my robe, put on my crown. I have immortal longings in me. Now the juice of Egypt's grapes will never wet this lip again. Quick, quick, good Iras, hurry. I think I hear Antony calling. I see him getting up to praise my noble act. I hear him mocking Caesar's luck, which the gods give men to excuse their anger later. Husband, I'm coming. Now let my courage prove my right to that name! I'm fire and air; my other elements, earth and water, I leave to baser life. So, have you finished? Come then, and take the last warmth of my lips. Goodbye, kind Charmian. Iras, a long goodbye. [She kisses them. Iras falls and dies.] Do I have the snake's poison on my lips? Are you falling? If you and life can part so gently, death's blow is like a lover's pinch, which hurts and is wanted. Are you lying still? If you vanish like this, you tell the world it isn't worth saying goodbye to."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Dissolve, thick cloud, and rain; that I may say", "The gods themselves do weep!"], "id": 1455, "m": "Dissolve, thick cloud, and rain, so I can say the gods themselves are weeping!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["This proves me base:", "If she first meet the curled Antony,", "He'll make demand of her, and spend that kiss", "Which is my heaven to have.--Come, thou mortal wretch,", "[To an asp, which she applies to her breast.]", "With thy sharp teeth this knot intrinsicate", "Of life at once untie: poor venomous fool,", "Be angry and despatch. O couldst thou speak,", "That I might hear thee call great Caesar ass", "Unpolicied!"], "id": 1456, "m": "This makes me look low. If she meets curly-haired Antony first, he'll ask her about me and spend on her the kiss that is my heaven to have. Come, you deadly little wretch, [to an asp, which she puts to her breast] with your sharp teeth untie this tangled knot of life at once. Poor poisonous fool, be angry and get it done. Oh, if you could speak, so I could hear you call great Caesar an ass, outwitted!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["O eastern star!"], "id": 1457, "m": "Oh, star of the East!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Peace, peace!", "Dost thou not see my baby at my breast", "That sucks the nurse asleep?"], "id": 1458, "m": "Quiet, quiet! Don't you see my baby at my breast, sucking its nurse to sleep?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["O, break! O, break!"], "id": 1459, "m": "Oh, break! Oh, break!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["As sweet as balm, as soft as air, as gentle:--", "O Antony! Nay, I will take thee too:--", "[Applying another asp to her arm.]", "What should I stay,--", "[Falls on a bed and dies.]"], "id": 1460, "m": "As sweet as perfume, as soft as air, as gentle... Oh Antony! No, I'll take you too. [She puts another asp to her arm.] Why should I stay... [She falls on a bed and dies.]"}, {"t": "sp", "who": "CHARMIAN", "lines": ["In this vile world?--So, fare thee well.--", "Now boast thee, death, in thy possession lies", "A lass unparallel'd.--Downy windows, close;", "And golden Phoebus never be beheld", "Of eyes again so royal! Your crown's awry;", "I'll mend it and then play."], "id": 1461, "m": "...in this vile world? So, goodbye. Now boast, death: you have in your power a girl without equal. Soft eyelids, close, and may golden Apollo the sun never be seen by such royal eyes again! Your crown's crooked. I'll straighten it, and then play."}, {"t": "sd", "text": "Enter the guard, rushing in.", "id": 1462}, {"t": "sp", "who": "FIRST GUARD", "lines": ["Where's the queen?"], "id": 1463, "m": "Where's the queen?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Speak softly, wake her not."], "id": 1464, "m": "Speak softly. Don't wake her."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["Caesar hath sent,--"], "id": 1465, "m": "Caesar has sent..."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Too slow a messenger."], "id": 1466, "m": "Too slow a messenger. [She puts an asp to herself.]"}, {"t": "sd", "text": "Applies an asp.", "id": 1467}, {"t": "sp", "who": "CHARMIAN", "cont": 1, "lines": ["O, come apace, despatch: I partly feel thee."], "id": 1468, "m": "Oh, come quickly, finish it. I can partly feel you."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["Approach, ho! all's not well: Caesar's beguil'd."], "id": 1469, "m": "Come here, hey! Something's wrong. Caesar's been tricked."}, {"t": "sp", "who": "SECOND GUARD", "lines": ["There's Dolabella sent from Caesar; call him."], "id": 1470, "m": "There's Dolabella, sent by Caesar. Call him."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["What work is here!--Charmian, is this well done?"], "id": 1471, "m": "What's been done here! Charmian, is this well done?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["It is well done, and fitting for a princess", "Descended of so many royal kings.", "Ah, soldier!"], "id": 1472, "m": "It is well done, and fitting for a princess descended from so many royal kings. Ah, soldier! [She dies.]"}, {"t": "sd", "text": "Charmian dies.", "id": 1473}, {"t": "sd", "text": "Re-enter Dolabella.", "id": 1474}, {"t": "sp", "who": "DOLABELLA", "lines": ["How goes it here?"], "id": 1475, "m": "What's happening here?"}, {"t": "sp", "who": "SECOND GUARD", "lines": ["All dead."], "id": 1476, "m": "All dead."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Caesar, thy thoughts", "Touch their effects in this: thyself art coming", "To see perform'd the dreaded act which thou", "So sought'st to hinder.", "[Within.] A way there, a way for Caesar!"], "id": 1477, "m": "Caesar, your fears have come true. You're coming yourself to see the dreaded act done which you tried so hard to prevent. [Voices offstage] Make way there, make way for Caesar!"}, {"t": "sd", "text": "Re-enter Caesar and his Train.", "id": 1478}, {"t": "sp", "who": "DOLABELLA", "lines": ["O sir, you are too sure an augurer;", "That you did fear is done."], "id": 1479, "m": "Oh sir, you're too accurate a prophet. What you feared has happened."}, {"t": "sp", "who": "CAESAR", "lines": ["Bravest at the last,", "She levell'd at our purposes, and being royal,", "Took her own way.--The manner of their deaths?", "I do not see them bleed."], "id": 1480, "m": "Bravest at the end, she guessed our plans, and being royal, she took her own way. How did they die? I don't see any blood."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Who was last with them?"], "id": 1481, "m": "Who was with them last?"}, {"t": "sp", "who": "FIRST GUARD", "lines": ["A simple countryman that brought her figs.", "This was his basket."], "id": 1482, "m": "A simple countryman who brought her figs. This was his basket."}, {"t": "sp", "who": "CAESAR", "lines": ["Poison'd then."], "id": 1483, "m": "Poisoned, then."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["O Caesar,", "This Charmian liv'd but now; she stood and spake:", "I found her trimming up the diadem", "On her dead mistress; tremblingly she stood,", "And on the sudden dropp'd."], "id": 1484, "m": "Oh Caesar, this Charmian was alive just now. She stood and spoke. I found her straightening the crown on her dead mistress. She stood there trembling, and suddenly dropped."}, {"t": "sp", "who": "CAESAR", "lines": ["O noble weakness!--", "If they had swallow'd poison 'twould appear", "By external swelling: but she looks like sleep,--", "As she would catch another Antony", "In her strong toil of grace."], "id": 1485, "m": "Oh, noble weakness! If they'd swallowed poison, it would show in swelling on the outside. But she looks as if she's asleep, as if she'd catch another Antony in the strong net of her grace."}, {"t": "sp", "who": "DOLABELLA", "lines": ["Here on her breast", "There is a vent of blood, and something blown:", "The like is on her arm."], "id": 1486, "m": "Here on her breast there's a small trickle of blood, and some swelling. The same on her arm."}, {"t": "sp", "who": "FIRST GUARD", "lines": ["This is an aspic's trail: and these fig-leaves", "Have slime upon them, such as the aspic leaves", "Upon the caves of Nile."], "id": 1487, "m": "This is a snake's trail. And these fig leaves have slime on them, like the slime snakes leave on the caves of the Nile."}, {"t": "sp", "who": "CAESAR", "lines": ["Most probable", "That so she died; for her physician tells me", "She hath pursu'd conclusions infinite", "Of easy ways to die. Take up her bed,", "And bear her women from the monument:--", "She shall be buried by her Antony:", "No grave upon the earth shall clip in it", "A pair so famous. High events as these", "Strike those that make them; and their story is", "No less in pity than his glory which", "Brought them to be lamented. Our army shall", "In solemn show attend this funeral;", "And then to Rome.--Come, Dolabella, see", "High order in this great solemnity."], "id": 1488, "m": "Very likely that's how she died, because her doctor tells me she's carried out endless experiments on easy ways to die. Pick up her bed, and carry her women out of the monument. She'll be buried beside her Antony. No grave on earth will hold such a famous pair. Great events like these strike even those who caused them, and their story is no less pitiful than the glory of the man who brought them to be mourned. Our army will attend this funeral in solemn procession, and then on to Rome. Come, Dolabella, see that this great ceremony is done with dignity."}, {"t": "sd", "text": "Exeunt.", "id": 1489}];

"notes": {
"2": "The play opens with a Roman judgement before we meet the lovers. 'Dotage' (foolish infatuation) and 'gipsy's lust' set out Rome's view. The audience must decide whether Philo is right.",
"7": "Antony's love language is hyperbole: love that can be measured is poor. The idea of overflowing, limitless love runs through the play.",
"16": "Antony rejects Rome in a grand gesture. Note the image of melting, which returns at his death ('The crown o' the earth doth melt'). His words are huge, but he leaves Egypt within the act.",
"110": "Antony's first soliloquy. Fulvia's death shows how desire turns to its opposite: 'she's good, being gone'. He sees his 'idleness' clearly.",
"156": "Cleopatra's language turns love into something heavenly and eternal. She also accuses Antony of being 'the greatest liar'. Love and acting are mixed.",
"172": "A clever line: her memory has deserted her just as Antony is deserting her. Cleopatra's wit is a weapon.",
"179": "Caesar's Roman verdict on Antony. His language is cold and moral, very different from Antony's and Cleopatra's poetry.",
"187": "Caesar admires the old, hard Antony. The image of Antony drinking horse urine and eating bark contrasts with the feasts of Egypt.",
"211": "Cleopatra imagines Antony's pet name for her. The serpent links her to the Nile, to temptation, and to the asp that kills her.",
"228": "Cleopatra reinvents her past: her love of Julius Caesar was youthful 'green' judgement. She constantly rewrites her own story.",
"330": "Enobarbus, the cynic, gives the play's most lyrical description of Cleopatra. Everything around her is erotic: the winds are 'love-sick', the water is 'amorous'. She outdoes art and nature.",
"338": "Cleopatra's 'infinite variety' makes her inexhaustible. Enobarbus predicts the marriage to Octavia will fail. Even holy priests bless her when she is 'riggish' (lustful).",
"301": "The political marriage. Octavia is treated as a 'cement' or 'knot' between men. Compare how women are used in the play.",
"357": "The soothsayer explains why Antony loses near Caesar: his guardian spirit is afraid. Fate and personality seem to work together against Antony.",
"362": "Antony decides to go back to Egypt minutes after promising Octavia he will keep 'the rule'. 'I' the East my pleasure lies.'",
"411": "Cleopatra's violence is shocking and comic. The messenger becomes the target for news she cannot bear.",
"514": "Enobarbus contrasts Octavia's coldness with Cleopatra's heat. He predicts that the marriage meant to bind Antony and Caesar will 'strangle' their friendship.",
"569": "Pompey's honour is hypocritical: he would have approved the murders if done without his knowledge. Menas sees he will never seize his chance.",
"608": "Ventidius explains how power works: subordinates must not outshine their masters. Compare Enobarbus later.",
"706": "Octavia's dilemma in miniature: her two prayers cancel each other out. Women in the play are caught between powerful men.",
"719": "The triumvirate becomes two jaws that must grind each other. The world is pictured as food to be devoured.",
"728": "Caesar's report of the 'Donations of Alexandria'. Cleopatra dressed as the goddess Isis: in Roman eyes, Antony has become an Eastern king.",
"768": "Cleopatra insists on fighting 'for a man'. She challenges gender roles, but her presence at Actium proves disastrous.",
"779": "Enobarbus spells out why fighting at sea is foolish. Antony's 'By sea, by sea' shows pride and recklessness.",
"823": "Scarus's anger produces vivid images: Cleopatra as a nag stung by a gadfly, Antony as a 'doting mallard'. The battle is told, not shown.",
"864": "Antony admits Cleopatra rules him completely. The image of his heart tied to her rudder is both romantic and humiliating.",
"868": "Antony chooses love over the loss of the world. One tear 'rates' (is worth) everything won and lost.",
"909": "Enobarbus's internal debate about loyalty. He knows loyalty to a fallen lord 'earns a place i' the story'. He will lose that place by deserting.",
"946": "Antony's cruellest speech: Cleopatra as a leftover on Julius Caesar's plate. His love can turn to disgust in a moment.",
"966": "Cleopatra and Antony restore each other: 'since my lord is Antony again I will be Cleopatra'. Identity is something they perform for each other.",
"971": "Enobarbus diagnoses Antony: courage that 'preys on reason' destroys itself. He decides to desert.",
"1022": "An omen: Antony's patron god abandons him. The music under the stage creates eerie atmosphere.",
"1088": "Antony's generosity breaks Enobarbus's heart. Shakespeare invented much of Enobarbus; his death is one of the play's most moving moments.",
"1127": "Enobarbus dies calling Antony's name. He accepts the world will remember him as a 'master-leaver'.",
"1157": "Antony assumes betrayal. We never learn for certain whether Cleopatra ordered the fleet to surrender. Shakespeare keeps her a mystery.",
"1165": "Antony compares himself to Hercules, poisoned by a burning shirt and driven mad. He wants a heroic, classical death.",
"1177": "Antony feels he is losing his shape like a cloud. The play asks what makes someone 'Antony' at all.",
"1191": "Antony removes his armour: 'No more a soldier'. He imagines meeting Cleopatra in the afterlife, outshining Dido and Aeneas.",
"1213": "Antony learns from Eros and Cleopatra (as he thinks) how to die, and imagines death as a marriage bed. Then he botches it.",
"1257": "Antony insists he has conquered himself. Cleopatra agrees: 'none but Antony should conquer Antony'.",
"1272": "Antony asks to be remembered for his greatness, a Roman 'by a Roman valiantly vanquish'd'. His dying words are about reputation.",
"1275": "Cleopatra's lament: with Antony gone, there is no distinction left in the world. Note the melting image again.",
"1284": "Cleopatra sees herself as an ordinary woman in grief, then chooses death 'after the high Roman fashion'. Egypt adopts Rome's values.",
"1296": "Caesar's tribute: Antony's death should have shaken the world. Is his grief sincere, or is he writing history?",
"1321": "Cleopatra rejects Caesar's power: he is only 'Fortune's knave'. Death is the act that 'shackles accidents and bolts up change'.",
"1358": "Cleopatra's dream of Antony as a colossus. She creates the myth of Antony, more than a man. Dolabella answers honestly: no such man existed.",
"1417": "A meta-theatrical joke: in Shakespeare's theatre a boy actor played Cleopatra. She fears being mocked in plays, as she is being played now.",
"1454": "Cleopatra stages her death as a final performance and a wedding: 'Husband, I come'. She becomes 'fire and air', leaving earth and water behind.",
"1458": "The asp becomes a baby feeding: death turned into motherhood and peace. A startling, tender image.",
"1472": "Charmian's last words echo the Roman idea of a noble death and answer the guard's question with pride.",
"1488": "Caesar has the last word, but the lovers win the glory. He admits their story is as famous as his victory."
},

const ALIGN={"4": [[0, 0, "Look, here they come."], [1, 3, "Just watch carefully, and you'll see in him one of the three pillars that hold up the world turned into a whore's plaything. Look and see."]], "13": [[0, 0, "No, listen to them, Antony."], [1, 5, "Maybe Fulvia is angry. Or who knows if that barely-bearded boy Caesar has sent you his mighty orders: 'Do this, or this; conquer that kingdom and free that one; do it, or we'll condemn you.'"]], "16": [[0, 1, "Let Rome melt into the Tiber, and the great arch of its well-ordered empire fall! This is my place."], [2, 7, "Kingdoms are just dirt; this dung-heap earth feeds animals and men alike. The noblest thing in life is to do this [he embraces her], when a pair so matched in love can do it. And I order the world, on pain of punishment, to recognise that we have no equals."]], "17": [[0, 0, "What a beautiful lie!"], [1, 3, "Why did he marry Fulvia if he didn't love her? I'll pretend to be the fool I'm not. Antony will always be himself."]], "18": [[0, 2, "Yes, when Cleopatra moves him. Now, for the love of Love and her sweet hours, let's not waste time in harsh arguments."], [3, 4, "There shouldn't be a single minute of our lives now without some pleasure. What fun shall we have tonight?"]], "20": [[0, 0, "Oh, you quarrelsome queen!"], [1, 3, "Everything suits you: scolding, laughing, crying. Every mood you have strives to become beautiful and admired in you!"], [4, 6, "No messengers but yours. Tonight, just the two of us, we'll wander through the streets and watch the people."], [7, 7, "Come, my queen; you wanted to last night. Don't speak to us."]], "69": [[0, 0, "Heaven correct our dirty thoughts! Alexas, come on, his fortune, his fortune!"], [1, 2, "Oh, let him marry a woman who can't walk, sweet Isis, I beg you! And let her die too, and give him a worse one!"], [3, 6, "And let worse follow worse, until the worst of all follows him laughing to his grave, a cuckold fifty times over! Good Isis, hear this prayer, even if you refuse me something more important. Good Isis, I beg you!"]], "89": [[0, 0, "Yes."], [1, 2, "But that war soon ended, and events made them friends, joining their forces against Caesar."], [3, 4, "He won the war and drove them out of Italy at the first battle."]], "92": [[0, 1, "Only when the listener is a fool or a coward. Go on. What's past is done with as far as I'm concerned."], [2, 3, "This is how it is: if someone tells me the truth, even if his story means death, I listen as if he were flattering me."]], "93": [[0, 2, "Labienus (this is hard news) has, with his Parthian army, seized Asia from the Euphrates."], [3, 5, "His conquering flag has flown from Syria to Lydia and Ionia, while..."]], "96": [[0, 0, "Speak plainly to me; don't tone down what everyone's saying."], [1, 6, "Call Cleopatra what they call her in Rome. Abuse me in Fulvia's words, and mock my faults as freely as truth and spite can. We grow weeds when our lively minds lie idle, and hearing our faults is like ploughing them up. Goodbye for now."]], "110": [[0, 0, "There's a great spirit gone! And I wished for it."], [1, 4, "What we throw away in contempt we often want back again. A present pleasure, as time turns, becomes its own opposite. She seems good now she's gone."], [5, 5, "The hand that pushed her away would pull her back."], [6, 6, "I must break away from this enchanting queen."], [7, 8, "My idleness is hatching ten thousand harms, beyond the troubles I already know about. Hey, Enobarbus!"]], "150": [[0, 0, "I can tell by that look in your eye there's good news."], [1, 1, "What does your wife say? You may go."], [2, 2, "I wish she'd never given you permission to come here!"], [3, 4, "Don't let her say it's me keeping you here. I have no power over you. You're hers."]], "159": [[0, 0, "Listen to me, queen."], [1, 5, "The urgent needs of the moment require my service for a while, but my whole heart stays here with you. Italy is glittering with the swords of civil war. Sextus Pompeius is advancing on Rome itself."], [6, 11, "When two powers at home are equally matched, petty factions grow. Those who were hated, now they're strong, are suddenly loved. Pompey, though condemned, is rich in his father's fame and is quickly winning the hearts of those who haven't done well under the present government, and there are enough of them to be a threat."], [12, 15, "And peace, sick of too much quiet, wants to cure itself with any desperate change. My more personal reason, and the one that should most reassure you about my going, is Fulvia's death."]], "161": [[0, 0, "She's dead, my queen."], [1, 2, "Look here, and when you have time, read about the trouble she stirred up."], [3, 3, "Last of all, and best, see when and where she died."]], "162": [[0, 0, "Oh, most false love!"], [1, 3, "Where are the sacred bottles you should fill with sad tears? Now I see, I see, from how you take Fulvia's death, how mine will be received."]], "166": [[0, 0, "That's what Fulvia was told."], [1, 5, "Please, turn away and weep for her, then say goodbye to me and say the tears are for Egypt. Go on, act one scene of excellent pretending, and make it look like perfect honour."]], "170": [[0, 0, "And shield."], [1, 3, "He's getting better, but this isn't his best. Look, please, Charmian, how well this Herculean Roman acts out his rage."]], "172": [[0, 0, "Courteous lord, one word."], [1, 1, "Sir, you and I must part, but that's not it."], [2, 2, "Sir, you and I have loved, but that's not it either; you know that well."], [3, 5, "There's something I want to say... Oh, my memory is just like Antony: it deserts me, and I'm completely forgotten."]], "174": [[0, 2, "It's hard work carrying idleness like this so close to my heart."], [3, 4, "But, sir, forgive me, since my moods kill me when you don't like them. Your honour calls you away, so don't listen to my foolishness, which nobody pities."], [5, 8, "May all the gods go with you! May victory crown your sword with laurel, and m
