<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antony and Cleopatra</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>body{margin:0}:root{padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Layout: an e-reader for a Folio. Home = title page, contents, "The Names of the Actors". Reader = one screen-sized page at a time, menus hidden (tap the middle to show them, tap or swipe the edges to turn). Long-press a speech for its modern English, word meanings and notes (side panel on wide screens, bottom sheet on phones). Study = its own tab. Type: IM Fell for Shakespeare, Instrument Sans for everything modern. */
:root{
  --bg:#eceae6; --page:#ffffff; --ink:#111215; --soft:#2b2d33; --muted:#5f6270; --rule:#d9d8d4; --card:#ffffff; --nmix:#000000; --nmw:78%;
  --accent:#7a4f0e; --accent-ink:#ffffff; --accent-soft:#efe6d6;
  --hl:#f5dede; --hl-ink:#8a1f2e; --berry:#a3243a;
  --ok:#2c7048; --bad:#a83232; --shade:rgba(15,18,35,.45);
  --f-old:"IM Fell English", "IM Fell DW Pica", Georgia, serif;
  --f-sc:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --scale:1.3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101114; --page:#18191d; --ink:#f3f1ec; --soft:#dedad2; --muted:#a3a3ab; --rule:#33353c; --card:#202227; --nmix:#ffffff; --nmw:55%;
  --accent:#e2b65c; --accent-ink:#14110a; --accent-soft:#272216;
  --hl:#3a1a24; --hl-ink:#f4bcc5; --berry:#f08a9b;
  --ok:#6cc38a; --bad:#ef8a83; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="night"]{
  --bg:#130f0b; --page:#1b1510; --ink:#f1dcba; --soft:#e2cba7; --muted:#ab9470; --rule:#3a2e22; --card:#221a13; --nmix:#f1dcba; --nmw:55%;
  --accent:#e7a95a; --accent-ink:#1b1510; --accent-soft:#2f2418;
  --hl:#3e2a1e; --hl-ink:#f6c9a4; --berry:#f0a08a;
  --ok:#9cc88a; --bad:#f09a83; --shade:rgba(0,0,0,.6); color-scheme:dark}
:root[data-theme="dark"]{
  --bg:#101114; --page:#18191d; --ink:#f3f1ec; --soft:#dedad2; --muted:#a3a3ab; --rule:#33353c; --card:#202227; --nmix:#ffffff; --nmw:55%;
  --accent:#e2b65c; --accent-ink:#14110a; --accent-soft:#272216;
  --hl:#3a1a24; --hl-ink:#f4bcc5; --berry:#f08a9b;
  --ok:#6cc38a; --bad:#ef8a83; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--page)}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:400 .95rem var(--f-sc);letter-spacing:.08em;color:var(--accent)}
.lbl{font:500 .66rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:8px 14px;font-size:.85rem;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn:disabled,.btn[disabled]{opacity:.3;cursor:default;border-style:dashed}.btn:disabled:hover{border-color:var(--rule)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--page)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.icon{border:0;background:transparent;min-width:42px;height:42px;border-radius:6px;display:inline-grid;place-items:center;font-size:1.05rem;color:var(--soft);padding:0 8px}
.icon:hover{background:var(--rule);color:var(--ink)}
.icon.txt{font-size:.85rem;font-weight:600}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:.85rem;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.gpop{position:fixed;z-index:30;max-width:min(300px,86vw);background:var(--ink);color:var(--page);border-radius:10px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35);font:400 1rem/1.45 var(--f-ui)}
.gpop b{display:block;font:400 1.15rem var(--f-old);color:var(--page);margin-bottom:2px}
abbr.g.on{background:var(--accent-soft);border-radius:2px}
abbr.g{text-decoration:underline dotted color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:4px}

/* ---------- batch A: reader extras ---------- */
:root{--hl-ev:#f7e9b5;--hl-fav:#d8e7fb;--hl-cf:#f8dbe0;--lh:1.55}
:root[data-theme="dark"],:root[data-theme="night"]{--hl-ev:#3b3315;--hl-fav:#172a42;--hl-cf:#40202b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl-ev:#3b3315;--hl-fav:#172a42;--hl-cf:#40202b}}
.sp.hl.hl-ev .o,.sp.hl.hl-ev .m{background:var(--hl-ev);box-shadow:0 0 0 .25em var(--hl-ev)}
.sp.hl.hl-fav .o,.sp.hl.hl-fav .m{background:var(--hl-fav);box-shadow:0 0 0 .25em var(--hl-fav)}
.sp.hl.hl-cf .o,.sp.hl.hl-cf .m{background:var(--hl-cf);box-shadow:0 0 0 .25em var(--hl-cf)}
.hlk{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;margin-right:4px;border:1px solid var(--rule)}
.hlk.ev{background:var(--hl-ev)}.hlk.fav{background:var(--hl-fav)}.hlk.cf{background:var(--hl-cf)}
.tool .ib.hlb{padding:7px 11px}.tool .ib.hlb.on{outline:2px solid var(--ink);outline-offset:1px;background:var(--page);color:var(--ink);border-color:var(--rule)}
.o{line-height:var(--lh)}
.onstage{font:500 .62em var(--f-ui);letter-spacing:.06em;color:var(--muted);margin-top:.6em;text-align:center}
.onstage span{color:color-mix(in srgb,var(--c,var(--ink)) var(--nmw),var(--nmix));font-weight:600}
body.focusing .sp:not(.fwho){opacity:.36}
.sp.aside .o{font-style:italic;border-left:3px solid var(--berry);padding-left:.55em}
.sp.solo .o{border-left:3px solid var(--accent);padding-left:.55em}
.sp.prose .o{border-left:2px dotted var(--muted);padding-left:.55em}
.tag.pr{color:var(--muted)}
.o .l.cpl::after{content:" \2040";color:var(--accent);font-size:.8em}
body.clean .o .l[data-n]::before,body.clean .flag,body.clean .tag{display:none}
body.clean abbr.g{text-decoration:none}
body.clean .nm{color:var(--soft)}
@keyframes pulse{0%,100%{background:transparent}30%{background:var(--accent-soft)}}
.pt.pulse{animation:pulse 1.6s ease 2}
.pgbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent;pointer-events:none}
.pgbar i{display:block;height:100%;background:var(--accent);opacity:.55;transition:width .2s}
.scrub{position:fixed;z-index:14;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(420px,90vw);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:.85rem}
.scrub b{display:block;font:500 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.scrub span{font:400 1.05rem var(--f-old)}
.tool .pnav{display:flex;gap:8px;margin-top:8px}
.tool .pnav .btn{flex:1}
.tool .qn2 textarea{min-height:64px}
.jump{display:flex;gap:8px;margin:4px 0 12px}.jump input{flex:1;min-width:0}
abbr.g{padding:.2em 0;margin:-.2em 0}

/* ---------- batch B: understanding ---------- */
.stagepic{display:flex;align-items:center;justify-content:center;gap:.5em;margin-top:.5em;font:500 .6em var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stagepic svg{width:2.4em;height:2.4em;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.recapb{display:inline-block;margin-top:.7em;border:1px solid var(--rule);border-radius:999px;padding:.35em .9em;font:500 .58em var(--f-ui);letter-spacing:.06em;color:var(--soft);background:transparent}
.tag.pop{cursor:pointer;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.tag.irony{color:var(--berry)}
.gpop small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.pred{margin:1em auto 0;max-width:30em;text-align:center}
.pred p{font:italic 400 .8em var(--f-old);color:var(--soft);margin:0 0 .5em}
.pred .chips{justify-content:center}.pred .chip{font-size:.6em}
.tstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:18px 0 0;scrollbar-width:thin;scroll-snap-type:x proximity}
.tstrip button{flex:0 0 auto;max-width:170px;text-align:left;border:1px solid var(--rule);border-radius:8px;background:transparent;padding:8px 10px;scroll-snap-align:start}
.tstrip button small{display:block;font:600 .7rem var(--f-ui);letter-spacing:.06em;color:var(--accent)}
.tstrip button span{font:400 .95rem/1.3 var(--f-old)}
.tstrip button.past{opacity:.55}
.tstrip-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}.tstrip-h b{font:400 1.2rem var(--f-old)}.tstrip-h small{color:var(--muted);font-size:.78rem}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.exgrid button{text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:14px}
.exgrid button b{display:block;font:400 1.25rem var(--f-old)}
.exgrid button span{font-size:.82rem;color:var(--muted)}
.exh{display:flex;align-items:center;gap:10px;margin:0 0 10px}.exh h2{margin:0;font:400 1.7rem var(--f-old)}
.exitem{padding:12px 0;border-bottom:1px solid var(--rule)}
.exitem b{font:400 1.15rem var(--f-old)}
.exitem p{margin:4px 0 0;font-size:.92rem;color:var(--soft)}
.exitem .o2{font:400 1.08rem/1.45 var(--f-old);margin:4px 0 0}
.exitem small{color:var(--muted);font-size:.78rem}
.tick{color:var(--ok);font-weight:700}
.chart{width:100%;max-width:640px;display:block;margin:8px auto}
.chart text{font:500 11px var(--f-ui);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--soft);margin:6px 0}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}.az button{border:1px solid var(--rule);background:transparent;border-radius:4px;min-width:30px;padding:4px}

/* ---------- batch D: notes & sharing ---------- */
.icon.bm svg path{fill:none;stroke:currentColor;stroke-width:2}.icon.bm.on svg path{fill:currentColor}.icon.bm.on{color:var(--ink)}
.nfilt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.nfilt input{grid-column:1/-1}
.nfilt select,.nfilt input{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.tchips .chip[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:10px 0}
.cmp>div{border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--card)}
.cmp blockquote{margin:0 0 8px;font:400 1.25rem/1.4 var(--f-old)}.cmp select{width:100%;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:10px}
.qimg{width:100%;border:1px solid var(--rule);border-radius:8px;display:block}
#printarea{display:none}
@media print{body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block!important;color:#000;font:12pt/1.45 Georgia,serif}#printarea h1{font-size:18pt}#printarea .pi{border-bottom:1px solid #999;padding:8px 0;break-inside:avoid}#printarea small{color:#444}#printarea i{display:block;margin-top:4px}}
/* ---------- batch C: exam ---------- */
.endbtns{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin-top:1em}
.endbtns button{font-size:.62em;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:.5em 1em;color:var(--ink)}
.conf{margin-top:.9em;font-size:.62em;color:var(--muted)}
.conf button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:.35em .8em;margin:0 .15em;color:var(--ink)}
.conf button[aria-pressed="true"]{outline:2px solid var(--ink)}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.35em;vertical-align:.05em}
.dot.r{background:#d9534f}.dot.a{background:#e8a33d}.dot.g{background:#3f9a5a}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;margin-bottom:10px}
.drills button{text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:14px}
.drills button b{display:block;font:400 1.2rem var(--f-old)}.drills button span{font-size:.82rem;color:var(--muted)}
.gapq{font:400 1.35rem/1.6 var(--f-old)}
.gapq input{font:inherit;width:7em;border:0;border-bottom:2px solid var(--accent);background:transparent;text-align:center}
.ladder{font:400 1.35rem/1.6 var(--f-old);min-height:3em}
.plan textarea,.plan input,.plan select{width:100%;border:1px solid var(--rule);background:var(--page);border-radius:6px;padding:9px 10px;font-size:.95rem;color:var(--ink)}
.plan textarea{min-height:64px}
.plan .pt3{border:1px solid var(--rule);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.plan .pt3 h4{margin:0 0 6px;font:400 1.15rem var(--f-old)}
.plan label{display:block;font:600 .68rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.timer{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--page);border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-variant-numeric:tabular-nums}
.timer b{font-size:1.4rem}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400;margin:0}
.cov{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:.85rem;margin:8px 0 18px}
.cov .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}.cov .bar i{display:block;height:100%;background:var(--accent)}
.ord button{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:10px 12px;margin:6px 0;font:400 1.05rem var(--f-old)}
.ord button[disabled]{opacity:.4}
.examc{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin:12px auto 0;max-width:420px;font-size:.88rem;text-align:center}
.examc b{font:400 1.25rem var(--f-old)}
@media print{#home,#reader,.sbar,.tabs,.panel,.sheet,.toast,.noprint,.timer{display:none!important}#study{display:block!important;padding:0}body{background:#fff;color:#000}}

/* ---------- HOME ---------- */
#home{max-width:980px;margin:0 auto;padding-block:clamp(20px,5vw,56px) 80px}
.tofolio-b{text-decoration:none;color:var(--accent)}
@media (max-width:430px){.bar .icon{min-width:34px;padding:0 4px}.bar .icon.txt{padding:0 6px}}
.tofolio{display:inline-block;font:500 .9rem var(--f-ui);color:var(--accent);text-decoration:none;padding:10px 4px 0;letter-spacing:.04em}
.tp{padding:4px 0 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tp .pre{font:italic 400 1.05rem var(--f-old);color:var(--soft)}
.tp h1{font:400 clamp(2.6rem,9vw,3.6rem) var(--f-sc);letter-spacing:.06em;line-height:1;margin:2px 0 0}
.tp h1 .h1b{display:block;font-size:.5em;letter-spacing:.08em;margin-top:.18em}
.tp .post{font:italic 400 1.1rem var(--f-old);color:var(--soft)}
.tp .orn{color:var(--accent);margin:10px 0 4px;font-size:1.6rem;line-height:1}
.tp .blurb{max-width:44ch;color:var(--soft);font-size:.95rem;margin:0}
.cont{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cont .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--ink);color:var(--page);border:1px solid var(--ink);border-radius:6px;padding:12px 24px}
.go.alt{background:transparent;color:var(--ink)}
.go small{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.go b{font:400 1.3rem var(--f-old)}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.meter{width:min(280px,70%);height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.homesearch{display:flex;gap:8px;margin:18px auto 0;max-width:560px}
.homesearch input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 2px;font-size:1rem}
.homesearch input:focus{outline:none;border-bottom-color:var(--accent)}
.sec-h{text-align:center;margin:56px 0 22px}
.sec-h h2{font:italic 400 clamp(1.7rem,4vw,2.3rem) var(--f-old);margin:0}
.sec-h p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.htabs{display:flex;justify-content:center;gap:0;margin:26px auto 14px;border-bottom:1px solid var(--rule);max-width:640px}
.htabs button{flex:1;max-width:200px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 8px;font:400 1.35rem var(--f-old);color:var(--muted);cursor:pointer}
.htabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hcap{text-align:center;font-size:.85rem;color:var(--muted);margin:0 0 8px}
.acts-map{max-width:640px;margin:0 auto}
.actd{border-bottom:1px solid var(--rule)}
.actd summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 4px}
.actd summary::-webkit-details-marker{display:none}
.actd summary span{font:400 1.45rem var(--f-sc);letter-spacing:.04em}
.actd summary small{font:500 .78rem var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.actd summary small::after{content:"  ›";display:inline-block;margin-left:8px;transition:transform .2s;color:var(--accent);font-size:1.1rem}
.actd[open] summary small::after{transform:rotate(90deg)}
.actd .srows{padding:0 0 10px}
.actd .srow:last-child{border-bottom:0}
.acts-map-old{columns:2 380px;column-gap:48px}
.actcol{break-inside:avoid;margin-bottom:30px;min-width:0}
.actcol h3{margin:0 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.actcol h3 span{font:400 1.45rem var(--f-sc);letter-spacing:.04em}
.actcol h3 small{font:500 .72rem var(--f-ui);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:11px 6px}
.srow:hover{background:var(--accent-soft)}

<script>
const DATA=[{"t": "scene", "act": 1, "scene": "I", "loc": "Alexandria. A Room in Cleopatra's palace.", "id": 0}, {"t": "sd", "text": "Enter Demetrius and Philo.", "id": 1}, {"t": "sp", "who": "PHILO", "lines": ["Nay, but this dotage of our general's", "O'erflows the measure: those his goodly eyes,", "That o'er the files and musters of the war", "Have glow'd like plated Mars, now bend, now turn,", "The office and devotion of their view", "Upon a tawny front: his captain's heart,", "Which in the scuffles of great fights hath burst", "The buckles on his breast, reneges all temper,", "And is become the bellows and the fan", "To cool a gipsy's lust."], "id": 2, "m": "No, this infatuation of our general's goes too far. Those fine eyes of his, which used to blaze like Mars in armour over the ranks and parades of war, now bend and turn all their attention and devotion onto a dark-skinned face. His soldier's heart, which in the struggles of great battles has burst the buckles of his breastplate, has given up all self-control and become the bellows and the fan that cool a gypsy's lust."}, {"t": "sd", "text": "Flourish within.", "id": 3}, {"t": "sp", "who": "PHILO", "cont": 1, "lines": ["Look where they come:", "Take but good note, and you shall see in him", "The triple pillar of the world transform'd", "Into a strumpet's fool: behold and see."], "id": 4, "m": "Look, here they come. Just watch carefully, and you'll see in him one of the three pillars that hold up the world turned into a whore's plaything. Look and see."}, {"t": "sd", "text": "Enter Antony and Cleopatra, with their trains; Eunuchs fanning her.", "id": 5}, {"t": "sp", "who": "CLEOPATRA", "lines": ["If it be love indeed, tell me how much."], "id": 6, "m": "If it's really love, tell me how much."}, {"t": "sp", "who": "ANTONY", "lines": ["There's beggary in the love that can be reckon'd."], "id": 7, "m": "Love that can be counted is a poor, beggarly love."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I'll set a bourn how far to be belov'd."], "id": 8, "m": "I'll set a limit on how far I'm to be loved."}, {"t": "sp", "who": "ANTONY", "lines": ["Then must thou needs find out new heaven, new earth."], "id": 9, "m": "Then you'll have to find a new heaven and a new earth."}, {"t": "sd", "text": "Enter an Attendant.", "id": 10}, {"t": "sp", "who": "ATTENDANT", "lines": ["News, my good lord, from Rome."], "id": 11, "m": "News from Rome, my lord."}, {"t": "sp", "who": "ANTONY", "lines": ["Grates me:--the sum."], "id": 12, "m": "How annoying. Just give me the summary."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, hear them, Antony:", "Fulvia perchance is angry; or who knows", "If the scarce-bearded Caesar have not sent", "His powerful mandate to you:  'Do this or this;", "Take in that kingdom and enfranchise that;", "Perform't, or else we damn thee.'"], "id": 13, "m": "No, listen to them, Antony. Maybe Fulvia is angry. Or who knows if that barely-bearded boy Caesar has sent you his mighty orders: 'Do this, or this; conquer that kingdom and free that one; do it, or we'll condemn you.'"}, {"t": "sp", "who": "ANTONY", "lines": ["How, my love!"], "id": 14, "m": "What do you mean, my love?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Perchance! Nay, and most like:--", "You must not stay here longer,--your dismission", "Is come from Caesar; therefore hear it, Antony.  --", "Where's Fulvia's process?--Caesar's I would say?--Both?--", "Call in the messengers.--As I am Egypt's queen,", "Thou blushest, Antony; and that blood of thine", "Is Caesar's homager: else so thy cheek pays shame", "When shrill-tongu'd Fulvia scolds.--The messengers!"], "id": 15, "m": "Maybe! No, very likely. You mustn't stay here any longer; Caesar has sent your dismissal, so listen to it, Antony. Where's Fulvia's summons? Caesar's, I mean. Or both? Call in the messengers. As I'm Queen of Egypt, you're blushing, Antony, and that blood of yours bows to Caesar. Or else your cheeks pay the price of shame when shrill-voiced Fulvia scolds you. The messengers!"}, {"t": "sp", "who": "ANTONY", "lines": ["Let Rome in Tiber melt, and the wide arch", "Of the rang'd empire fall! Here is my space.", "Kingdoms are clay: our dungy earth alike", "Feeds beast as man: the nobleness of life", "Is to do thus [Embracing]; when such a mutual pair", "And such a twain can do't, in which I bind,", "On pain of punishment, the world to weet", "We stand up peerless."], "id": 16, "m": "Let Rome melt into the Tiber, and the great arch of its well-ordered empire fall! This is my place. Kingdoms are just dirt; this dung-heap earth feeds animals and men alike. The noblest thing in life is to do this [he embraces her], when a pair so matched in love can do it. And I order the world, on pain of punishment, to recognise that we have no equals."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Excellent falsehood!", "Why did he marry Fulvia, and not love her?--", "I'll seem the fool I am not; Antony", "Will be himself."], "id": 17, "m": "What a beautiful lie! Why did he marry Fulvia if he didn't love her? I'll pretend to be the fool I'm not. Antony will always be himself."}, {"t": "sp", "who": "ANTONY", "lines": ["But stirr'd by Cleopatra.--", "Now, for the love of Love and her soft hours,", "Let's not confound the time with conference harsh:", "There's not a minute of our lives should stretch", "Without some pleasure now:--what sport to-night?"], "id": 18, "m": "Yes, when Cleopatra moves him. Now, for the love of Love and her sweet hours, let's not waste time in harsh arguments. There shouldn't be a single minute of our lives now without some pleasure. What fun shall we have tonight?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Hear the ambassadors."], "id": 19, "m": "Hear the ambassadors."}, {"t": "sp", "who": "ANTONY", "lines": ["Fie, wrangling queen!", "Whom everything becomes,--to chide, to laugh,", "To weep; whose every passion fully strives", "To make itself in thee fair and admir'd!", "No messenger; but thine, and all alone", "To-night we'll wander through the streets and note", "The qualities of people. Come, my queen;", "Last night you did desire it:--speak not to us."], "id": 20, "m": "Oh, you quarrelsome queen! Everything suits you: scolding, laughing, crying. Every mood you have strives to become beautiful and admired in you! No messengers but yours. Tonight, just the two of us, we'll wander through the streets and watch the people. Come, my queen; you wanted to last night. Don't speak to us."}, {"t": "sd", "text": "Exeunt Antony and Cleopatra, with their Train.", "id": 21}, {"t": "sp", "who": "DEMETRIUS", "lines": ["Is Caesar with Antonius priz'd so slight?"], "id": 22, "m": "Does Antony think so little of Caesar?"}, {"t": "sp", "who": "PHILO", "lines": ["Sir, sometimes when he is not Antony,", "He comes too short of that great property", "Which still should go with Antony."], "id": 23, "m": "Sir, sometimes, when he isn't really himself, he falls short of the greatness that should always belong to Antony."}, {"t": "sp", "who": "DEMETRIUS", "lines": ["I am full sorry", "That he approves the common liar, who", "Thus speaks of him at Rome: but I will hope", "Of better deeds to-morrow. Rest you happy!"], "id": 24, "m": "I'm very sorry that he proves the gossips in Rome right about him. But I'll hope for better behaviour tomorrow. Goodbye!"}, {"t": "sd", "text": "Exeunt.", "id": 25}, {"t": "scene", "act": 1, "scene": "II", "loc": "Alexandria. Another Room in Cleopatra's palace.", "id": 26}, {"t": "sd", "text": "Enter Charmian, Iras, Alexas, and a Soothsayer.", "id": 27}, {"t": "sp", "who": "CHARMIAN", "lines": ["Lord Alexas, sweet Alexas, most anything Alexas, almost", "most absolute Alexas, where's the soothsayer that you praised so", "to the queen? O that I knew this husband, which you say must", "charge his horns with garlands!"], "id": 28, "m": "Lord Alexas, sweet Alexas, most wonderful Alexas, almost perfect Alexas, where's the fortune-teller you praised to the queen? Oh, I wish I knew this husband of mine, who you say will wear garlands on his cuckold's horns!"}, {"t": "sp", "who": "ALEXAS", "lines": ["Soothsayer,--"], "id": 29, "m": "Fortune-teller!"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["Your will?"], "id": 30, "m": "What do you want?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Is this the man?--Is't you, sir, that know things?"], "id": 31, "m": "Is this the man? Are you the one, sir, who knows things?"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["In nature's infinite book of secrecy", "A little I can read."], "id": 32, "m": "I can read a little in nature's endless book of secrets."}, {"t": "sp", "who": "ALEXAS", "lines": ["Show him your hand."], "id": 33, "m": "Show him your hand."}, {"t": "sd", "text": "Enter Enobarbus.", "id": 34}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Bring in the banquet quickly; wine enough", "Cleopatra's health to drink."], "id": 35, "m": "Bring in the dessert quickly, and enough wine to drink Cleopatra's health."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Good, sir, give me good fortune."], "id": 36, "m": "Good sir, give me a good fortune."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["I make not, but foresee."], "id": 37, "m": "I don't make fortunes; I only foresee them."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Pray, then, foresee me one."], "id": 38, "m": "Then please foresee one for me."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["You shall be yet far fairer than you are."], "id": 39, "m": "You'll be even fairer than you are now."}, {"t": "sp", "who": "CHARMIAN", "lines": ["He means in flesh."], "id": 40, "m": "He means fatter."}, {"t": "sp", "who": "IRAS", "lines": ["No, you shall paint when you are old."], "id": 41, "m": "No, he means you'll wear make-up when you're old."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Wrinkles forbid!"], "id": 42, "m": "Heaven forbid wrinkles!"}, {"t": "sp", "who": "ALEXAS", "lines": ["Vex not his prescience; be attentive."], "id": 43, "m": "Don't annoy him while he's seeing the future. Pay attention."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Hush!"], "id": 44, "m": "Hush!"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["You shall be more beloving than beloved."], "id": 45, "m": "You'll love more than you're loved."}, {"t": "sp", "who": "CHARMIAN", "lines": ["I had rather heat my liver with drinking."], "id": 46, "m": "I'd rather heat my liver with drink than with love."}, {"t": "sp", "who": "ALEXAS", "lines": ["Nay, hear him."], "id": 47, "m": "No, listen to him."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Good now, some excellent fortune! Let me be married to three", "kings in a forenoon, and widow them all: let me have a child at", "fifty, to whom Herod of Jewry may do homage: find me to marry me", "with Octavius Caesar, and companion me with my mistress."], "id": 48, "m": "Come on, give me a wonderful fortune! Let me marry three kings in one morning and outlive them all. Let me have a baby at fifty that Herod of Judea will bow down to. Fix it so I marry Octavius Caesar, and become my mistress's equal."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["You shall outlive the lady whom you serve."], "id": 49, "m": "You'll outlive the lady you serve."}, {"t": "sp", "who": "CHARMIAN", "lines": ["O, excellent! I love long life better than figs."], "id": 50, "m": "Oh, excellent! I like a long life better than figs."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["You have seen and prov'd a fairer former fortune", "Than that which is to approach."], "id": 51, "m": "You've already seen and enjoyed better times than the ones to come."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Then belike my children shall have no names:--pr'ythee, how many", "boys and wenches must I have?"], "id": 52, "m": "Then I suppose my children will be born out of wedlock. Please, how many boys and girls will I have?"}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["If every of your wishes had a womb,", "And fertile every wish, a million."], "id": 53, "m": "If each of your wishes had a womb, and every wish were fertile, a million."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Out, fool! I forgive thee for a witch."], "id": 54, "m": "Get away, fool! I'll let you off because you're a wizard."}, {"t": "sp", "who": "ALEXAS", "lines": ["You think none but your sheets are privy to your wishes."], "id": 55, "m": "You think only your bedsheets know what you wish for."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Nay, come, tell Iras hers."], "id": 56, "m": "Come on, tell Iras hers."}, {"t": "sp", "who": "ALEXAS", "lines": ["We'll know all our fortunes."], "id": 57, "m": "We'll all hear our fortunes."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Mine, and most of our fortunes, to-night, shall be--", "drunk to bed."], "id": 58, "m": "Mine, and most of ours, tonight, will be to go to bed drunk."}, {"t": "sp", "who": "IRAS", "lines": ["There's a palm presages chastity, if nothing else."], "id": 59, "m": "Here's a palm that predicts chastity, if nothing else."}, {"t": "sp", "who": "CHARMIAN", "lines": ["E'en as the o'erflowing Nilus presageth famine."], "id": 60, "m": "Just as the flooding Nile predicts famine."}, {"t": "sp", "who": "IRAS", "lines": ["Go, you wild bedfellow, you cannot soothsay."], "id": 61, "m": "Go on, you wild bedfellow, you can't tell fortunes."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Nay, if an oily palm be not a fruitful prognostication, I cannot", "scratch mine ear.--Pr'ythee, tell her but worky-day fortune."], "id": 62, "m": "Well, if a sweaty palm doesn't mean you'll have lots of children, I can't scratch my own ear. Please, just tell her an everyday fortune."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["Your fortunes are alike."], "id": 63, "m": "Your fortunes are the same."}, {"t": "sp", "who": "IRAS", "lines": ["But how, but how? give me particulars."], "id": 64, "m": "But how? How? Give me details."}, {"t": "sp", "who": "SOOTHSAYER", "lines": ["I have said."], "id": 65, "m": "I've said all I will."}, {"t": "sp", "who": "IRAS", "lines": ["Am I not an inch of fortune better than she?"], "id": 66, "m": "Isn't my fortune even an inch better than hers?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Well, if you were but an inch of fortune better than I, where", "would you choose it?"], "id": 67, "m": "Well, if your fortune were an inch better than mine, where would you want that inch?"}, {"t": "sp", "who": "IRAS", "lines": ["Not in my husband's nose."], "id": 68, "m": "Not on my husband's nose."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Our worser thoughts heavens mend!--Alexas,--come, his fortune!", "his fortune!--O, let him marry a woman that cannot go, sweet", "Isis, I beseech thee! And let her die too, and give him a worse!", "and let worse follow worse, till the worst of all follow him", "laughing to his grave, fiftyfold a cuckold! Good Isis, hear me", "this prayer, though thou deny me a matter of more weight; good", "Isis, I beseech thee!"], "id": 69, "m": "Heaven correct our dirty thoughts! Alexas, come on, his fortune, his fortune! Oh, let him marry a woman who can't walk, sweet Isis, I beg you! And let her die too, and give him a worse one! And let worse follow worse, until the worst of all follows him laughing to his grave, a cuckold fifty times over! Good Isis, hear this prayer, even if you refuse me something more important. Good Isis, I beg you!"}, {"t": "sp", "who": "IRAS", "lines": ["Amen. Dear goddess, hear that prayer of the people! for, as it is", "a heartbreaking to see a handsome man loose-wived, so it is a", "deadly sorrow to behold a foul knave uncuckolded: therefore, dear", "Isis, keep decorum, and fortune him accordingly!"], "id": 70, "m": "Amen. Dear goddess, hear the people's prayer! It breaks your heart to see a handsome man with an unfaithful wife, and it's terrible to see an ugly rogue whose wife is faithful. So, dear Isis, do what's proper and give him the fortune he deserves!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Amen."], "id": 71, "m": "Amen."}, {"t": "sp", "who": "ALEXAS", "lines": ["Lo now, if it lay in their hands to make me a cuckold, they would", "make themselves whores but they'd do't!"], "id": 72, "m": "Look at that! If it were up to them to make me a cuckold, they'd turn themselves into whores just to do it!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Hush! Here comes Antony."], "id": 73, "m": "Hush! Here comes Antony."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Not he; the queen."], "id": 74, "m": "It's not him; it's the queen."}, {"t": "sd", "text": "Enter Cleopatra.", "id": 75}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Saw you my lord?"], "id": 76, "m": "Have you seen my lord?"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["No, lady."], "id": 77, "m": "No, lady."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Was he not here?"], "id": 78, "m": "Wasn't he here?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["No, madam."], "id": 79, "m": "No, madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["He was dispos'd to mirth; but on the sudden", "A Roman thought hath struck him.--Enobarbus,--"], "id": 80, "m": "He was in a cheerful mood, but suddenly a Roman thought struck him. Enobarbus!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Madam?"], "id": 81, "m": "Madam?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Seek him, and bring him hither.--Where's Alexas?"], "id": 82, "m": "Find him and bring him here. Where's Alexas?"}, {"t": "sp", "who": "ALEXAS", "lines": ["Here, at your service.--My lord approaches."], "id": 83, "m": "Here, at your service. My lord is coming."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["We will not look upon him: go with us."], "id": 84, "m": "We won't look at him. Come with us."}, {"t": "sd", "text": "Exeunt Cleopatra, Enobarbus, Char., Iras, Alex., and Soothsayer.", "id": 85}, {"t": "sd", "text": "Enter Antony, with a Messenger and Attendants.", "id": 86}, {"t": "sp", "who": "MESSENGER", "lines": ["Fulvia thy wife first came into the field."], "id": 87, "m": "Your wife Fulvia was the first to take to the battlefield."}, {"t": "sp", "who": "ANTONY", "lines": ["Against my brother Lucius."], "id": 88, "m": "Against my brother Lucius."}, {"t": "sp", "who": "MESSENGER", "lines": ["Ay:", "But soon that war had end, and the time's state", "Made friends of them, jointing their force 'gainst Caesar;", "Whose better issue in the war, from Italy", "Upon the first encounter, drave them."], "id": 89, "m": "Yes. But that war soon ended, and events made them friends, joining their forces against Caesar. He won the war and drove them out of Italy at the first battle."}, {"t": "sp", "who": "ANTONY", "lines": ["Well, what worst?"], "id": 90, "m": "Well, what's the worst?"}, {"t": "sp", "who": "MESSENGER", "lines": ["The nature of bad news infects the teller."], "id": 91, "m": "Bad news makes the person who brings it hated."}, {"t": "sp", "who": "ANTONY", "lines": ["When it concerns the fool or coward.--On:--", "Things that are past are done with me.--'Tis thus;", "Who tells me true, though in his tale lie death,", "I hear him as he flatter'd."], "id": 92, "m": "Only when the listener is a fool or a coward. Go on. What's past is done with as far as I'm concerned. This is how it is: if someone tells me the truth, even if his story means death, I listen as if he were flattering me."}, {"t": "sp", "who": "MESSENGER", "lines": ["Labienus,--", "This is stiff news,--hath, with his Parthian force,", "Extended Asia from Euphrates;", "His conquering banner shook from Syria", "To Lydia and to Ionia;", "Whilst,--"], "id": 93, "m": "Labienus (this is hard news) has, with his Parthian army, seized Asia from the Euphrates. His conquering flag has flown from Syria to Lydia and Ionia, while..."}, {"t": "sp", "who": "ANTONY", "lines": ["Antony, thou wouldst say,--"], "id": 94, "m": "While Antony, you mean to say..."}, {"t": "sp", "who": "MESSENGER", "lines": ["O, my lord!"], "id": 95, "m": "Oh, my lord!"}, {"t": "sp", "who": "ANTONY", "lines": ["Speak to me home, mince not the general tongue:", "Name Cleopatra as she is call'd in Rome;", "Rail thou in Fulvia's phrase; and taunt my faults", "With such full licence as both truth and malice", "Have power to utter. O, then we bring forth weeds", "When our quick minds lie still; and our ills told us", "Is as our earing. Fare thee well awhile."], "id": 96, "m": "Speak plainly to me; don't tone down what everyone's saying. Call Cleopatra what they call her in Rome. Abuse me in Fulvia's words, and mock my faults as freely as truth and spite can. We grow weeds when our lively minds lie idle, and hearing our faults is like ploughing them up. Goodbye for now."}, {"t": "sp", "who": "MESSENGER", "lines": ["At your noble pleasure."], "id": 97, "m": "As you wish, my lord."}, {"t": "sd", "text": "Exit.", "id": 98}, {"t": "sp", "who": "ANTONY", "lines": ["From Sicyon, ho, the news! Speak there!"], "id": 99, "m": "The news from Sicyon! Bring it in!"}, {"t": "sp", "who": "FIRST ATTENDANT", "lines": ["The man from Sicyon--is there such an one?"], "id": 100, "m": "The man from Sicyon! Is there such a man here?"}, {"t": "sp", "who": "SECOND ATTENDANT", "lines": ["He stays upon your will."], "id": 101, "m": "He's waiting for your orders."}, {"t": "sp", "who": "ANTONY", "lines": ["Let him appear.--", "These strong Egyptian fetters I must break,", "Or lose myself in dotage.--"], "id": 102, "m": "Let him come in. I must break these strong Egyptian chains, or lose myself in infatuation."}, {"t": "sd", "text": "Enter another Messenger.", "id": 103}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["What are you?"], "id": 104, "m": "Who are you?"}, {"t": "sp", "who": "SECOND MESSENGER", "lines": ["Fulvia thy wife is dead."], "id": 105, "m": "Your wife Fulvia is dead."}, {"t": "sp", "who": "ANTONY", "lines": ["Where died she?"], "id": 106, "m": "Where did she die?"}, {"t": "sp", "who": "SECOND MESSENGER", "lines": ["In Sicyon:", "Her length of sickness, with what else more serious", "Importeth thee to know, this bears. [Gives a letter.]"], "id": 107, "m": "In Sicyon. This letter tells you how long she was ill, and other more serious things you need to know. [He gives a letter.]"}, {"t": "sp", "who": "ANTONY", "lines": ["Forbear me."], "id": 108, "m": "Leave me."}, {"t": "sd", "text": "Exit Messenger.", "id": 109}, {"t": "sp", "who": "ANTONY", "cont": 1, "lines": ["There's a great spirit gone! Thus did I desire it:", "What our contempts doth often hurl from us,", "We wish it ours again; the present pleasure,", "By revolution lowering, does become", "The opposite of itself: she's good, being gone;", "The hand could pluck her back that shov'd her on.", "I must from this enchanting queen break off:", "Ten thousand harms, more than the ills I know,", "My idleness doth hatch--ho, Enobarbus!"], "id": 110, "m": "There's a great spirit gone! And I wished for it. What we throw away in contempt we often want back again. A present pleasure, as time turns, becomes its own opposite. She seems good now she's gone. The hand that pushed her away would pull her back. I must break away from this enchanting queen. My idleness is hatching ten thousand harms, beyond the troubles I already know about. Hey, Enobarbus!"}, {"t": "sd", "text": "Re-enter Enobarbus.", "id": 111}, {"t": "sp", "who": "ENOBARBUS", "lines": ["What's your pleasure, sir?"], "id": 112, "m": "What do you want, sir?"}, {"t": "sp", "who": "ANTONY", "lines": ["I must with haste from hence."], "id": 113, "m": "I must leave here quickly."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Why, then we kill all our women: we see how mortal an unkindness", "is to them; if they suffer our departure, death's the word."], "id": 114, "m": "Well, then we'll kill all our women. We know how deadly any unkindness is to them. If they have to put up with our leaving, they'll die."}, {"t": "sp", "who": "ANTONY", "lines": ["I must be gone."], "id": 115, "m": "I must go."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Under a compelling occasion, let women die: it were pity to cast", "them away for nothing; though, between them and a great cause", "they should be esteemed nothing. Cleopatra, catching but the", "least noise of this, dies instantly; I have seen her die twenty", "times upon far poorer moment: I do think there is mettle in", "death, which commits some loving act upon her, she hath such a", "celerity in dying."], "id": 116, "m": "If there's an urgent reason, let the women die. It would be a shame to throw them away for nothing, though compared with a great cause they're worth nothing. Cleopatra, if she hears even a whisper of this, will die on the spot. I've seen her die twenty times for much less reason. I think death must have some special power that makes love to her, she dies so readily."}, {"t": "sp", "who": "ANTONY", "lines": ["She is cunning past man's thought."], "id": 117, "m": "She is more cunning than anyone could imagine."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Alack, sir, no: her passions are made of nothing but the finest", "part of pure love: we cannot call her winds and waters, sighs and", "tears; they are greater storms and tempests than almanacs can", "report: this cannot be cunning in her; if it be, she makes a", "shower of rain as well as Jove."], "id": 118, "m": "No, sir. Her passions are made of nothing but the purest love. We can't call her storms of feeling mere sighs and tears. They're greater storms and tempests than any calendar can predict. This can't be cunning. If it is, she makes rain as well as Jupiter does."}, {"t": "sp", "who": "ANTONY", "lines": ["Would I had never seen her!"], "id": 119, "m": "I wish I'd never seen her!"}, {"t": "sp", "who": "ENOBARBUS", "lines": ["O sir, you had then left unseen a wonderful piece of work; which", "not to have been blest withal would have discredited your travel."], "id": 120, "m": "Oh sir, then you'd have missed a marvellous masterpiece. Not to have been blessed with that would have made your travels worthless."}, {"t": "sp", "who": "ANTONY", "lines": ["Fulvia is dead."], "id": 121, "m": "Fulvia is dead."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Sir?"], "id": 122, "m": "Sir?"}, {"t": "sp", "who": "ANTONY", "lines": ["Fulvia is dead."], "id": 123, "m": "Fulvia is dead."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Fulvia?"], "id": 124, "m": "Fulvia?"}, {"t": "sp", "who": "ANTONY", "lines": ["Dead."], "id": 125, "m": "Dead."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["Why, sir, give the gods a thankful sacrifice. When it pleaseth", "their deities to take the wife of a man from him, it shows to", "man the tailors of the earth; comforting therein that when old", "robes are worn out there are members to make new. If there were", "no more women but Fulvia, then had you indeed a cut, and the case", "to be lamented: this grief is crown'd with consolation; your old", "smock brings forth a new petticoat:--and, indeed, the tears live", "in an onion that should water this sorrow."], "id": 126, "m": "Well, sir, make a sacrifice to the gods in thanks. When the gods take a man's wife from him, it shows him they're the tailors of the world: when old clothes wear out, there's material to make new ones. If there were no women except Fulvia, then you would have had a real blow and something to grieve about. But this grief comes with a consolation: your old smock produces a new petticoat. And really, the only tears for this sorrow would come from an onion."}, {"t": "sp", "who": "ANTONY", "lines": ["The business she hath broached in the state", "Cannot endure my absence."], "id": 127, "m": "The trouble she started in the state can't do without me there."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["And the business you have broached here cannot be without you;", "especially that of Cleopatra's, which wholly depends on your", "abode."], "id": 128, "m": "And the trouble you've started here can't do without you, especially Cleopatra's, which depends entirely on your staying."}, {"t": "sp", "who": "ANTONY", "lines": ["No more light answers. Let our officers", "Have notice what we purpose. I shall break", "The cause of our expedience to the queen,", "And get her leave to part. For not alone", "The death of Fulvia, with more urgent touches,", "Do strongly speak to us; but the letters too", "Of many our contriving friends in Rome", "Petition us at home: Sextus Pompeius", "Hath given the dare to Caesar, and commands", "The empire of the sea; our slippery people,--", "Whose love is never link'd to the deserver", "Till his deserts are past,--begin to throw", "Pompey the Great, and all his dignities,", "Upon his son; who, high in name and power,", "Higher than both in blood and life, stands up", "For the main soldier: whose quality, going on,", "The sides o' the world may danger: much is breeding", "Which, like the courser's hair, hath yet but life", "And not a serpent's poison. Say, our pleasure", "To such whose place is under us, requires", "Our quick remove from hence."], "id": 129, "m": "No more joking. Let our officers know what we're planning. I'll tell the queen why we must hurry, and get her permission to leave. It's not just Fulvia's death and more urgent matters that call me; letters from many friends working for us in Rome are begging me to come home. Sextus Pompeius has challenged Caesar and controls the sea. Our fickle people, who never love a man until his great deeds are over, are starting to transfer all the honours of Pompey the Great onto his son. He's grown so powerful in name and strength, and even more in spirit and energy, that he stands as the greatest soldier of all. If his power keeps growing, the whole world may be in danger. Much is brewing, like the horse's hair that was said to come alive in water: it has life, but not yet a serpent's poison. Tell those who serve under us that we wish to leave here quickly."}, {"t": "sp", "who": "ENOBARBUS", "lines": ["I shall do't."], "id": 130, "m": "I'll do it."}, {"t": "sd", "text": "Exeunt.", "id": 131}, {"t": "scene", "act": 1, "scene": "III", "loc": "Alexandria. A Room in Cleopatra's palace.", "id": 132}, {"t": "sd", "text": "Enter Cleopatra, Charmian, Iras, and Alexas.", "id": 133}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Where is he?"], "id": 134, "m": "Where is he?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["I did not see him since."], "id": 135, "m": "I haven't seen him since."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["See where he is, who's with him, what he does:--", "I did not send you:--if you find him sad,", "Say I am dancing; if in mirth, report", "That I am sudden sick: quick, and return."], "id": 136, "m": "Find out where he is, who he's with, and what he's doing. Don't say I sent you. If you find him sad, say I'm dancing. If he's cheerful, report that I've suddenly fallen ill. Quick, and come back."}, {"t": "sd", "text": "Exit Alexas.", "id": 137}, {"t": "sp", "who": "CHARMIAN", "lines": ["Madam, methinks, if you did love him dearly,", "You do not hold the method to enforce", "The like from him."], "id": 138, "m": "Madam, I think if you love him so much, you're not going the right way about making him love you the same."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What should I do, I do not?"], "id": 139, "m": "What should I be doing that I'm not?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["In each thing give him way; cross him in nothing."], "id": 140, "m": "Give in to him in everything. Never cross him."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Thou teachest like a fool,--the way to lose him."], "id": 141, "m": "You're teaching like a fool. That's the way to lose him."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Tempt him not so too far; I wish, forbear;", "In time we hate that which we often fear.", "But here comes Antony."], "id": 142, "m": "Don't push him so far. I wish you'd hold back. In time we hate what we often fear. But here comes Antony."}, {"t": "sd", "text": "Enter Antony.", "id": 143}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I am sick and sullen."], "id": 144, "m": "I'm sick and miserable."}, {"t": "sp", "who": "ANTONY", "lines": ["I am sorry to give breathing to my purpose,--"], "id": 145, "m": "I'm sorry to have to tell you my plans..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Help me away, dear Charmian; I shall fall;", "It cannot be thus long, the sides of nature", "Will not sustain it."], "id": 146, "m": "Help me out of here, dear Charmian, I'm going to faint. It can't last like this; my body can't bear it."}, {"t": "sp", "who": "ANTONY", "lines": ["Now, my dearest queen,--"], "id": 147, "m": "Now, my dearest queen..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Pray you, stand farther from me."], "id": 148, "m": "Please stand further away from me."}, {"t": "sp", "who": "ANTONY", "lines": ["What's the matter?"], "id": 149, "m": "What's the matter?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I know by that same eye there's some good news.", "What says the married woman?--You may go.", "Would she had never given you leave to come!", "Let her not say 'tis I that keep you here,--", "I have no power upon you; hers you are."], "id": 150, "m": "I can tell by that look in your eye there's good news. What does your wife say? You may go. I wish she'd never given you permission to come here! Don't let her say it's me keeping you here. I have no power over you. You're hers."}, {"t": "sp", "who": "ANTONY", "lines": ["The gods best know,--"], "id": 151, "m": "The gods know best..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, never was there queen", "So mightily betray'd! Yet at the first", "I saw the treasons planted."], "id": 152, "m": "Oh, there was never a queen so badly betrayed! Yet from the beginning I saw the seeds of treachery."}, {"t": "sp", "who": "ANTONY", "lines": ["Cleopatra,--"], "id": 153, "m": "Cleopatra..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Why should I think you can be mine and true,", "Though you in swearing shake the throned gods,", "Who have been false to Fulvia? Riotous madness,", "To be entangled with those mouth-made vows,", "Which break themselves in swearing!"], "id": 154, "m": "Why should I believe you can be mine and faithful, even if you swear so hard you shake the gods on their thrones, when you've been unfaithful to Fulvia? It's insane to be caught up in vows made only with the mouth, which break even as they're sworn!"}, {"t": "sp", "who": "ANTONY", "lines": ["Most sweet queen,--"], "id": 155, "m": "Sweetest queen..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Nay, pray you, seek no colour for your going,", "But bid farewell, and go: when you su'd staying,", "Then was the time for words: no going then;--", "Eternity was in our lips and eyes,", "Bliss in our brows' bent; none our parts so poor", "But was a race of heaven: they are so still,", "Or thou, the greatest soldier of the world,", "Art turn'd the greatest liar."], "id": 156, "m": "No, please, don't look for excuses to go. Just say goodbye and go. When you begged to stay, that was the time for words. There was no talk of going then. Eternity was in our lips and eyes, bliss in the arch of our brows. No part of us was so poor that it wasn't heavenly. They still are, or else you, the greatest soldier in the world, have become the greatest liar."}, {"t": "sp", "who": "ANTONY", "lines": ["How now, lady!"], "id": 157, "m": "What's this, lady!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["I would I had thy inches; thou shouldst know", "There were a heart in Egypt."], "id": 158, "m": "I wish I had your size; then you'd find out there's a brave heart in Egypt."}, {"t": "sp", "who": "ANTONY", "lines": ["Hear me, queen:", "The strong necessity of time commands", "Our services awhile; but my full heart", "Remains in use with you. Our Italy", "Shines o'er with civil swords:  Sextus Pompeius", "Makes his approaches to the port of Rome;", "Equality of two domestic powers", "Breed scrupulous faction: the hated, grown to strength,", "Are newly grown to love: the condemn'd Pompey,", "Rich in his father's honour, creeps apace", "Into the hearts of such as have not thriv'd", "Upon the present state, whose numbers threaten;", "And quietness, grown sick of rest, would purge", "By any desperate change. My more particular,", "And that which most with you should safe my going,", "Is Fulvia's death."], "id": 159, "m": "Listen to me, queen. The urgent needs of the moment require my service for a while, but my whole heart stays here with you. Italy is glittering with the swords of civil war. Sextus Pompeius is advancing on Rome itself. When two powers at home are equally matched, petty factions grow. Those who were hated, now they're strong, are suddenly loved. Pompey, though condemned, is rich in his father's fame and is quickly winning the hearts of those who haven't done well under the present government, and there are enough of them to be a threat. And peace, sick of too much quiet, wants to cure itself with any desperate change. My more personal reason, and the one that should most reassure you about my going, is Fulvia's death."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Though age from folly could not give me freedom,", "It does from childishness:--can Fulvia die?"], "id": 160, "m": "Though age hasn't freed me from foolishness, it has freed me from childishness. Can Fulvia die?"}, {"t": "sp", "who": "ANTONY", "lines": ["She's dead, my queen.", "Look here, and, at thy sovereign leisure, read", "The garboils she awak'd; at the last, best.", "See when and where she died."], "id": 161, "m": "She's dead, my queen. Look here, and when you have time, read about the trouble she stirred up. Last of all, and best, see when and where she died."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O most false love!", "Where be the sacred vials thou shouldst fill", "With sorrowful water? Now I see, I see,", "In Fulvia's death how mine receiv'd shall be."], "id": 162, "m": "Oh, most false love! Where are the sacred bottles you should fill with sad tears? Now I see, I see, from how you take Fulvia's death, how mine will be received."}, {"t": "sp", "who": "ANTONY", "lines": ["Quarrel no more, but be prepar'd to know", "The purposes I bear; which are, or cease,", "As you shall give the advice. By the fire", "That quickens Nilus' slime, I go from hence", "Thy soldier, servant, making peace or war", "As thou affect'st."], "id": 163, "m": "Stop quarrelling, and be ready to hear my plans, which will go ahead or stop as you advise. By the sun's fire that brings the Nile's mud to life, I leave here as your soldier and servant, making peace or war as you wish."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Cut my lace, Charmian, come;--", "But let it be: I am quickly ill and well,", "So Antony loves."], "id": 164, "m": "Cut my corset laces, Charmian, come! No, never mind. I'm quickly ill and quickly well again, just as Antony loves."}, {"t": "sp", "who": "ANTONY", "lines": ["My precious queen, forbear;", "And give true evidence to his love, which stands", "An honourable trial."], "id": 165, "m": "My precious queen, stop it. Trust my love, which will stand up to any honourable test."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["So Fulvia told me.", "I pr'ythee, turn aside and weep for her;", "Then bid adieu to me, and say the tears", "Belong to Egypt: good now, play one scene", "Of excellent dissembling; and let it look", "Like perfect honour."], "id": 166, "m": "That's what Fulvia was told. Please, turn away and weep for her, then say goodbye to me and say the tears are for Egypt. Go on, act one scene of excellent pretending, and make it look like perfect honour."}, {"t": "sp", "who": "ANTONY", "lines": ["You'll heat my blood: no more."], "id": 167, "m": "You'll make me angry. No more."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["You can do better yet; but this is meetly."], "id": 168, "m": "You can do better than that, but this is fairly good."}, {"t": "sp", "who": "ANTONY", "lines": ["Now, by my sword,--"], "id": 169, "m": "Now, by my sword..."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["And target.--Still he mends;", "But this is not the best:--look, pr'ythee, Charmian,", "How this Herculean Roman does become", "The carriage of his chafe."], "id": 170, "m": "And shield. He's getting better, but this isn't his best. Look, please, Charmian, how well this Herculean Roman acts out his rage."}, {"t": "sp", "who": "ANTONY", "lines": ["I'll leave you, lady."], "id": 171, "m": "I'll leave you, lady."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Courteous lord, one word.", "Sir, you and I must part,--but that's not it;", "Sir, you and I have lov'd,--but there's not it;", "That you know well: something it is I would,--", "O, my oblivion is a very Antony,", "And I am all forgotten."], "id": 172, "m": "Courteous lord, one word. Sir, you and I must part, but that's not it. Sir, you and I have loved, but that's not it either; you know that well. There's something I want to say... Oh, my memory is just like Antony: it deserts me, and I'm completely forgotten."}, {"t": "sp", "who": "ANTONY", "lines": ["But that your royalty", "Holds idleness your subject, I should take you", "For idleness itself."], "id": 173, "m": "If you weren't a queen who rules over idleness itself, I'd take you for Idleness in person."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["'Tis sweating labour", "To bear such idleness so near the heart", "As Cleopatra this. But, sir, forgive me;", "Since my becomings kill me, when they do not", "Eye well to you: your honour calls you hence;", "Therefore be deaf to my unpitied folly,", "And all the gods go with you! upon your sword", "Sit laurel victory! and smooth success", "Be strew'd before your feet!"], "id": 174, "m": "It's hard work carrying idleness like this so close to my heart. But, sir, forgive me, since my moods kill me when you don't like them. Your honour calls you away, so don't listen to my foolishness, which nobody pities. May all the gods go with you! May victory crown your sword with laurel, and may easy success be scattered at your feet!"}, {"t": "sp", "who": "ANTONY", "lines": ["Let us go. Come;", "Our separation so abides, and flies,", "That thou, residing here, goes yet with me,", "And I, hence fleeting, here remain with thee.", "Away!"], "id": 175, "m": "Let's go. Come. Our parting is such that it both stays and goes: you, staying here, go with me, and I, leaving here, stay with you. Away!"}, {"t": "sd", "text": "Exeunt.", "id": 176}, {"t": "scene", "act": 1, "scene": "IV", "loc": "Rome. An Apartment in Caesar's House.", "id": 177}, {"t": "sd", "text": "Enter Octavius Caesar, Lepidus, and Attendants.", "id": 178}, {"t": "sp", "who": "CAESAR", "lines": ["You may see, Lepidus, and henceforth know,", "It is not Caesar's natural vice to hate", "Our great competitor. From Alexandria", "This is the news:--he fishes, drinks, and wastes", "The lamps of night in revel: is not more manlike", "Than Cleopatra, nor the queen of Ptolemy", "More womanly than he: hardly gave audience, or", "Vouchsaf'd to think he had partners: you shall find there", "A man who is the abstract of all faults", "That all men follow."], "id": 179, "m": "You can see, Lepidus, and know from now on, that it isn't my nature to hate our great partner. This is the news from Alexandria: he goes fishing, drinks, and wastes the night in partying. He's no more manly than Cleopatra, and she, Ptolemy's widow, is no more womanly than he is. He hardly received our messengers, or bothered to remember he has partners. You'll find there a man who sums up every fault that men have."}, {"t": "sp", "who": "LEPIDUS", "lines": ["I must not think there are", "Evils enow to darken all his goodness:", "His faults in him seem as the spots of heaven,", "More fiery by night's blackness; hereditary", "Rather than purchas'd; what he cannot change", "Than what he chooses."], "id": 180, "m": "I can't believe there are enough faults to darken all his goodness. His faults are like the stars in the sky, shining brighter against night's darkness. They're inborn rather than acquired; things he can't change rather than things he chooses."}, {"t": "sp", "who": "CAESAR", "lines": ["You are too indulgent. Let's grant it is not", "Amiss to tumble on the bed of Ptolemy;", "To give a kingdom for a mirth; to sit", "And keep the turn of tippling with a slave;", "To reel the streets at noon, and stand the buffet", "With knaves that smell of sweat: say this becomes him,--", "As his composure must be rare indeed", "Whom these things cannot blemish,--yet must Antony", "No way excuse his foils when we do bear", "So great weight in his lightness. If he fill'd", "His vacancy with his voluptuousness,", "Full surfeits and the dryness of his bones", "Call on him for't: but to confound such time", "That drums him from his sport, and speaks as loud", "As his own state and ours,--'tis to be chid", "As we rate boys, who, being mature in knowledge,", "Pawn their experience to their present pleasure,", "And so rebel to judgment."], "id": 181, "m": "You're too kind. Let's agree it isn't wrong to roll around in bed with Ptolemy's queen, to give away a kingdom for a joke, to take turns drinking with a slave, to stagger through the streets at noon and trade punches with rogues who stink of sweat. Say this suits him, though he'd have to be a rare man indeed not to be stained by such things. Even so, Antony can't excuse his failings when we have to carry so much weight because of his frivolity. If he filled his free time with pleasure, upset stomachs and diseased bones would make him pay for it. But to waste time that drums him back to duty, and that matters so much to his position and ours, deserves a scolding, the way we scold boys who know better but trade what they've learned for pleasure, and so rebel against good sense."}, {"t": "sd", "text": "Enter a Messenger.", "id": 182}, {"t": "sp", "who": "LEPIDUS", "lines": ["Here's more news."], "id": 183, "m": "Here's more news."}, {"t": "sp", "who": "MESSENGER", "lines": ["Thy biddings have been done; and every hour,", "Most noble Caesar, shalt thou have report", "How 'tis abroad. Pompey is strong at sea;", "And it appears he is belov'd of those", "That only have fear'd Caesar: to the ports", "The discontents repair, and men's reports", "Give him much wrong'd."], "id": 184, "m": "Your orders have been carried out, and every hour, noble Caesar, you'll get reports of what's happening. Pompey is strong at sea, and it seems he's loved by those who only feared you. The discontented flock to the ports, and people say he's been badly treated."}, {"t": "sp", "who": "CAESAR", "lines": ["I should have known no less:", "It hath been taught us from the primal state", "That he which is was wish'd until he were;", "And the ebb'd man, ne'er lov'd till ne'er worth love,", "Comes dear'd by being lack'd. This common body,", "Like to a vagabond flag upon the stream,", "Goes to and back, lackeying the varying tide,", "To rot itself with motion."], "id": 185, "m": "I should have expected that. History has taught us from the very beginning that the man in power was wanted only until he got power, and the man who's fallen, never loved until he's no longer worth loving, becomes dear by being missed. The common people are like a loose reed on a river, drifting back and forth, following the changing tide like a servant, until it rots from all the motion."}, {"t": "sp", "who": "MESSENGER", "lines": ["Caesar, I bring thee word", "Menecrates and Menas, famous pirates,", "Make the sea serve them, which they ear and wound", "With keels of every kind: many hot inroads", "They make in Italy; the borders maritime", "Lack blood to think on't, and flush youth revolt:", "No vessel can peep forth but 'tis as soon", "Taken as seen; for Pompey's name strikes more", "Than could his war resisted."], "id": 186, "m": "Caesar, I bring you news that Menecrates and Menas, famous pirates, are making the sea their servant, ploughing and cutting it with all kinds of ships. They make many fierce raids on Italy. The people on the coast turn pale at the thought, and hot-blooded young men are rebelling. No ship can set out without being captured as soon as it's seen. Pompey's name does more damage than his army could if it were fought."}, {"t": "sp", "who": "CAESAR", "lines": ["Antony,", "Leave thy lascivious wassails. When thou once", "Was beaten from Modena, where thou slew'st", "Hirtius and Pansa, consuls, at thy heel", "Did famine follow; whom thou fought'st against,", "Though daintily brought up, with patience more", "Than savages could suffer: thou didst drink", "The stale of horses, and the gilded puddle", "Which beasts would cough at: thy palate then did deign", "The roughest berry on the rudest hedge;", "Yea, like the stag when snow the pasture sheets,", "The barks of trees thou browsed'st; on the Alps", "It is reported thou didst eat strange flesh,", "Which some did die to look on: and all this,--", "It wounds thine honour that I speak it now,--", "Was borne so like a soldier that thy cheek", "So much as lank'd not."], "id": 187, "m": "Antony, give up your lustful partying. When you were defeated at Modena, where you killed the consuls Hirtius and Pansa, famine followed close behind you. You fought it, though you'd been raised in luxury, with more endurance than savages could. You drank horses' urine and slimy puddles that animals would choke on. Your taste then accepted the hardest berry on the roughest hedge. Yes, like a stag when snow covers the pasture, you ate the bark off trees. In the Alps, they say, you ate strange meat that killed some men just to look at. And all this (it hurts your honour that I mention it now) you endured so like a soldier that your face didn't even get thinner."}, {"t": "sp", "who": "LEPIDUS", "lines": ["'Tis pity of him."], "id": 188, "m": "It's a pity about him."}, {"t": "sp", "who": "CAESAR", "lines": ["Let his shames quickly", "Drive him to Rome; 'tis time we twain", "Did show ourselves i' the field; and to that end", "Assemble we immediate council: Pompey", "Thrives in our idleness."], "id": 189, "m": "Let his shame drive him quickly back to Rome. It's time the two of us took the field, and for that we should call a council at once. Pompey grows stronger while we sit idle."}, {"t": "sp", "who": "LEPIDUS", "lines": ["To-morrow, Caesar,", "I shall be furnish'd to inform you rightly", "Both what by sea and land I can be able", "To front this present time."], "id": 190, "m": "Tomorrow, Caesar, I'll be able to tell you exactly what forces I can raise on sea and land to face this situation."}, {"t": "sp", "who": "CAESAR", "lines": ["Till which encounter", "It is my business too. Farewell."], "id": 191, "m": "Until we meet, that will be my business too. Goodbye."}, {"t": "sp", "who": "LEPIDUS", "lines": ["Farewell, my lord: what you shall know meantime", "Of stirs abroad, I shall beseech you, sir,", "To let me be partaker."], "id": 192, "m": "Goodbye, my lord. If you hear of any developments in the meantime, I beg you, sir, to share them with me."}, {"t": "sp", "who": "CAESAR", "lines": ["Doubt not, sir;", "I knew it for my bond."], "id": 193, "m": "Don't worry, sir. I know it's my duty."}, {"t": "sd", "text": "Exeunt.", "id": 194}, {"t": "scene", "act": 1, "scene": "V", "loc": "Alexandria. A Room in the Palace.", "id": 195}, {"t": "sd", "text": "Enter Cleopatra, Charmian, Iras, and Mardian.", "id": 196}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Charmian,--"], "id": 197, "m": "Charmian!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Madam?"], "id": 198, "m": "Madam?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Ha, ha!--", "Give me to drink mandragora."], "id": 199, "m": "Ha, ha! Give me mandrake to drink."}, {"t": "sp", "who": "CHARMIAN", "lines": ["Why, madam?"], "id": 200, "m": "Why, madam?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["That I might sleep out this great gap of time", "My Antony is away."], "id": 201, "m": "So I can sleep through this huge stretch of time while my Antony is away."}, {"t": "sp", "who": "CHARMIAN", "lines": ["You think of him too much."], "id": 202, "m": "You think about him too much."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O, 'tis treason!"], "id": 203, "m": "Oh, that's treason!"}, {"t": "sp", "who": "CHARMIAN", "lines": ["Madam, I trust, not so."], "id": 204, "m": "Madam, I hope not."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Thou, eunuch Mardian!"], "id": 205, "m": "You, eunuch Mardian!"}, {"t": "sp", "who": "MARDIAN", "lines": ["What's your highness' pleasure?"], "id": 206, "m": "What does your highness want?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Not now to hear thee sing; I take no pleasure", "In aught an eunuch has; 'tis well for thee", "That, being unseminar'd, thy freer thoughts", "May not fly forth of Egypt. Hast thou affections?"], "id": 207, "m": "Not to hear you sing now. I take no pleasure in anything a eunuch has. It's lucky for you that, being castrated, your thoughts can't fly out of Egypt after anyone. Do you have desires?"}, {"t": "sp", "who": "MARDIAN", "lines": ["Yes, gracious madam."], "id": 208, "m": "Yes, gracious madam."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Indeed!"], "id": 209, "m": "Indeed!"}, {"t": "sp", "who": "MARDIAN", "lines": ["Not in deed, madam; for I can do nothing", "But what indeed is honest to be done:", "Yet have I fierce affections, and think", "What Venus did with Mars."], "id": 210, "m": "Not in deed, madam, because I can't do anything except what's decent. But I do have fierce desires, and think about what Venus did with Mars."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O Charmian,", "Where think'st thou he is now? Stands he or sits he?", "Or does he walk? or is he on his horse?", "O happy horse, to bear the weight of Antony!", "Do bravely, horse! for wott'st thou whom thou mov'st?", "The demi-Atlas of this earth, the arm", "And burgonet of men.--He's speaking now,", "Or murmuring 'Where's my serpent of old Nile?'", "For so he calls me.--Now I feed myself", "With most delicious poison:--think on me,", "That am with Phoebus' amorous pinches black,", "And wrinkled deep in time? Broad-fronted Caesar,", "When thou wast here above the ground I was", "A morsel for a monarch: and great Pompey", "Would stand and make his eyes grow in my brow;", "There would he anchor his aspect and die", "With looking on his life."], "id": 211, "m": "Oh, Charmian, where do you think he is now? Is he standing or sitting? Or is he walking? Or is he on his horse? Oh, happy horse, to carry Antony's weight! Do well, horse! Do you know who you're carrying? The half-Atlas who holds up the world, the arm and helmet of mankind. He's speaking now, or murmuring, 'Where's my serpent of old Nile?' That's what he calls me. Now I'm feeding myself the most delicious poison. Think of me, who am tanned black by the sun's loving pinches and deeply wrinkled with age? Julius Caesar, with your broad forehead, when you were alive I was a dish fit for a king. And great Pompey would stand and fix his eyes on my face; he'd anchor his gaze there and die looking at what he lived for."}, {"t": "sd", "text": "Enter Alexas.", "id": 212}, {"t": "sp", "who": "ALEXAS", "lines": ["Sovereign of Egypt, hail!"], "id": 213, "m": "Queen of Egypt, greetings!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["How much unlike art thou Mark Antony!", "Yet, coming from him, that great medicine hath", "With his tinct gilded thee.--", "How goes it with my brave Mark Antony?"], "id": 214, "m": "How unlike Mark Antony you are! Yet, coming from him, his great magic has gilded you with its colour. How is my brave Mark Antony?"}, {"t": "sp", "who": "ALEXAS", "lines": ["Last thing he did, dear queen,", "He kiss'd,--the last of many doubled kisses,--", "This orient pearl: his speech sticks in my heart."], "id": 215, "m": "The last thing he did, dear queen, was kiss this precious pearl, the last of many repeated kisses. His words are stuck in my heart."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Mine ear must pluck it thence."], "id": 216, "m": "My ear must pull them out."}, {"t": "sp", "who": "ALEXAS", "lines": ["'Good friend,' quoth he", "'Say, the firm Roman to great Egypt sends", "This treasure of an oyster; at whose foot,", "To mend the petty present, I will piece", "Her opulent throne with kingdoms; all the east,", "Say thou, shall call her mistress.' So he nodded,", "And soberly did mount an arm-girt steed,", "Who neigh'd so high that what I would have spoke", "Was beastly dumb'd by him."], "id": 217, "m": "'Good friend,' he said, 'tell great Egypt that the faithful Roman sends her this treasure from an oyster. At her feet, to make up for this small present, I'll add kingdoms to her rich throne. The whole East, tell her, will call her mistress.' Then he nodded and solemnly mounted a war horse, which neighed so loudly that what I wanted to say was drowned out by the beast."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["What, was he sad or merry?"], "id": 218, "m": "Well, was he sad or happy?"}, {"t": "sp", "who": "ALEXAS", "lines": ["Like to the time o' the year between the extremes", "Of hot and cold, he was nor sad nor merry."], "id": 219, "m": "Like the time of year between the extremes of hot and cold, he was neither sad nor happy."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["O well-divided disposition!--Note him,", "Note him, good Charmian; 'tis the man; but note him:", "He was not sad,--for he would shine on those", "That make their looks by his; he was not merry,--", "Which seem'd to tell them his remembrance lay", "In Egypt with his joy; but between both:", "O heavenly mingle!--Be'st thou sad or merry,", "The violence of either thee becomes,", "So does it no man else.--Mett'st thou my posts?"], "id": 220, "m": "Oh, what a balanced mood! Notice that, notice that, good Charmian. That's the man exactly. Notice it: he wasn't sad, because he wanted to cheer those who copy his looks; he wasn't happy, which seemed to tell them his thoughts were in Egypt with his joy; he was in between. Oh, heavenly mixture! Whether you're sad or happy, the extremes of both suit you as they suit no other man. Did you meet my messengers?"}, {"t": "sp", "who": "ALEXAS", "lines": ["Ay, madam, twenty several messengers.", "Why do you send so thick?"], "id": 221, "m": "Yes, madam, twenty different messengers. Why do you send so many?"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Who's born that day", "When I forget to send to Antony", "Shall die a beggar.--Ink and paper, Charmian.--", "Welcome, my good Alexas.--Did I, Charmian,", "Ever love Caesar so?"], "id": 222, "m": "Anyone born on a day when I forget to send to Antony will die a beggar. Ink and paper, Charmian. Welcome, my good Alexas. Charmian, did I ever love Julius Caesar this much?"}, {"t": "sp", "who": "CHARMIAN", "lines": ["O that brave Caesar!"], "id": 223, "m": "Oh, that brave Caesar!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["Be chok'd with such another emphasis!", "Say 'the brave Antony.'"], "id": 224, "m": "Choke on another word like that! Say 'the brave Antony'."}, {"t": "sp", "who": "CHARMIAN", "lines": ["The valiant Caesar!"], "id": 225, "m": "The valiant Caesar!"}, {"t": "sp", "who": "CLEOPATRA", "lines": ["By Isis, I will give thee bloody teeth", "If thou with Caesar paragon again", "My man of men."], "id": 226, "m": "By Isis, I'll give you a bloody mouth if you compare Caesar with my man of men again."}, {"t": "sp", "who": "CHARMIAN", "lines": ["By your most gracious pardon,", "I sing but after you."], "id": 227, "m": "With your gracious pardon, I'm only repeating what you used to say."}, {"t": "sp", "who": "CLEOPATRA", "lines": ["My salad days,", "When I was green in judgment:--cold in blood,", "To say as I said then!--But come, away;", "Get me ink and paper: he shall have every day", "A several greeting,", "Or I'll unpeople Egypt."], "id": 228, "m": "
