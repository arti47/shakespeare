s authority I'll proclaim that whoever finds him will earn our thanks for bringing the murderous coward to execution, and whoever hides him will die."]], "375": [[0, 9, "When I tried to talk him out of it and found him set on doing it, I threatened angrily to expose him. He answered, 'You penniless bastard! Do you think that if I stood against you, anyone would believe your word because they trusted your virtue or worth? No. I'd deny it all, as I'd deny this, even if you showed my own handwriting. I'd turn it all back on you as your scheming, your plot and your damned trickery."], [10, 13, "You'd have to think the world very stupid if they didn't believe that the profits you'd get from my death were obvious, powerful reasons for you to want it.'"]], "378": [[0, 1, "Listen, the Duke's trumpets! I don't know why he's coming. I'll block all the ports. The villain won't escape."], [2, 6, "The Duke must allow me that. Besides, I'll send his picture far and wide so the whole kingdom will know him. And as for my land, my loyal and natural son, I'll find a way to make you able to inherit it."]], "388": [[0, 0, "No wonder he went bad, then."], [1, 2, "It's they who have put him up to killing the old man, so they can spend and waste his income."], [3, 6, "This very evening my sister told me all about them, with such warnings that if they come to stay at my house, I won't be there."]], "394": [[0, 4, "If he's caught, he'll never be feared again. Make your plans, using my power however you like. As for you, Edmund, whose goodness and obedience show so well right now, you'll serve me."], [5, 5, "I'll need men I can trust so deeply."], [6, 6, "You're the first I take."]], "398": [[0, 0, "...so unexpectedly, travelling through the dark night."], [1, 9, "There are matters of some weight, noble Gloster, on which we need your advice. Our father has written, and so has our sister, about their quarrels, and I thought it best to answer away from our home. The messengers are waiting here to be sent back. Our good old friend, comfort yourself, and give us the advice our business needs, as it needs it right away."]], "414": [[0, 3, "A rogue, a rascal, an eater of leftover scraps. A low, proud, shallow, beggarly servant with three suits and a hundred-pound income, a filthy rogue in cheap wool stockings. A lily-livered, cowardly, lawsuit-running son of a whore, a mirror-gazing, over-eager, fussy rogue, a slave whose whole inheritance fits in one trunk."], [4, 8, "Someone who'd be a pimp if it pleased his master, and who is nothing but a mixture of rogue, beggar, coward and pimp, and the son and heir of a mongrel bitch. I'll beat you till you whine and howl if you deny the smallest syllable of these titles."]], "416": [[0, 4, "What a shameless rascal you are to deny you know me! Is it two days since I tripped you up and beat you in front of the King? Draw, you rogue. Although it's night, the moon is shining. I'll soak you full of moonshine like bread in soup. Draw, you son-of-a-whore, contemptible dandy, draw!"], [5, 5, "[He draws his sword.]"]], "418": [[0, 1, "Draw, you rascal. You come with letters against the King, and take the side of that puppet Vanity against the royalty of her father."], [2, 3, "Draw, you rogue, or I'll slice your legs like meat for grilling. Draw, you rascal. Come on!"]], "440": [[0, 4, "That a slave like this should wear a sword when he has no honesty. Smiling rogues like him, like rats, often bite through the holy bonds that are too tight to untie. They flatter every passion that rebels in their masters' natures, bring oil to their fire and snow to their colder moods."], [5, 9, "They deny, agree and turn their beaks like a weathervane bird with every change in their masters' moods, knowing nothing, like dogs, except how to follow. A plague on your twitching face!"], [10, 10, "Are you smirking at my speeches as if I were a fool?"], [11, 12, "You goose, if I had you on Salisbury Plain, I'd chase you cackling all the way home to Camelot."]], "447": [[0, 0, "Sir, it's my job to be blunt."], [1, 3, "I've seen better faces in my time than any on the shoulders I see in front of me right now."]], "448": [[0, 4, "This is some fellow who, having been praised for his bluntness, puts on a cheeky roughness and twists his manner away from his true nature. He can't flatter, not he! An honest, plain mind, he must speak the truth!"], [5, 5, "If they'll take it, fine. If not, he's just plain."], [6, 9, "I know rogues like this, who hide more cunning and more corrupt aims in their plainness than twenty silly, bowing servants who carry out their duties with fussy care."]], "453": [[0, 0, "I never did."], [1, 2, "The King his master recently decided to hit me because he misunderstood me."], [3, 7, "Then this man, siding with him and flattering his anger, tripped me from behind. When I was down, he insulted me, abused me and made himself out such a hero that he won praise from the King for attacking a man who didn't fight back."], [8, 9, "Thrilled by this terrible exploit, he drew his sword on me again here."]], "456": [[0, 0, "Sir, I'm too old to learn."], [1, 1, "Don't send for the stocks for me."], [2, 2, "I serve the King, who sent me on business to you."], [3, 5, "You'll show little respect and too bold a malice against the dignity and person of my master if you put his messenger in the stocks."]], "463": [[0, 0, "Let me beg your grace not to do this."], [1, 7, "His fault is great, and his good master the King will punish him for it. The low punishment you intend is the kind used for the lowest, most despised wretches for petty theft and the commonest crimes. The King must take it badly that he is so little respected that his messenger is treated like this."]], "470": [[0, 0, "Please don't, sir. I've gone without sleep and travelled hard."], [1, 1, "I'll spend some of the time sleeping and the rest whistling."], [2, 2, "Even a good man's luck can wear out at the heels."], [3, 3, "Good morning to you!"]], "473": [[0, 2, "Good King, you're proving the old saying true: you are going from heaven's blessing out into the hot sun!"], [3, 12, "Come up, you sun, beacon to this world below, so that by your comforting rays I can read this letter. Almost nobody sees miracles except the miserable. I know it's from Cordelia, who has very luckily been told of my disguise, and who will find a chance to fix this monstrous situation and put right what has gone wrong. Weary and exhausted, heavy eyes, take the chance not to look at this shameful lodging."], [13, 13, "Fortune, good night. Smile once more and turn your wheel!"]], "477": [[0, 8, "I heard myself declared an outlaw, and escaped the hunt by hiding in a lucky hollow tree. No port is open, and there's no place without guards and unusually close watch waiting to catch me. While I can escape, I'll save myself. I've decided to take on the lowest and poorest appearance that poverty ever brought close to an animal in contempt of man."], [9, 11, "I'll smear my face with filth, wear only a blanket round my waist, tangle all my hair into knots, and with my body bare I'll face the winds and storms of the sky."], [12, 19, "The countryside gives me the example of Bedlam beggars, madmen who with roaring voices stick pins, wooden skewers, nails and sprigs of rosemary into their numb, deadened bare arms, and with this horrible sight, sometimes with mad curses, sometimes with prayers, force charity out of poor farms, wretched villages, sheepfolds and mills. Poor Turlygod! Poor Tom!"], [20, 20, "That's something at least. As Edgar, I am nothing."]], "497": [[0, 0, "They wouldn't dare do it."], [1, 2, "They wouldn't, couldn't do it. It's worse than murder to do such violent outrage to the respect owed to me."], [3, 5, "Tell me, as quickly as you decently can, how you could deserve or they could impose this treatment, when you came from me."]], "498": [[0, 5, "My lord, when I delivered your highness's letters to them at their home, before I'd even got up from kneeling to show my duty, a sweating messenger arrived, steaming from his hurry, half out of breath, gasping out greetings from his mistress Goneril."], [6, 8, "He handed over letters, interrupting me, which they read at once. Because of what they said, they called their servants together and got straight on their horses."], [9, 10, "They ordered me to follow and wait until they had time to answer, and gave me cold looks."], [11, 15, "Then, meeting the other messenger here, whose welcome I could see had poisoned mine, and who was the very fellow who recently behaved so insolently to your highness, I had more courage than sense and drew my sword."], [16, 16, "He woke the house with loud, cowardly screams."], [17, 18, "Your son-in-law and daughter thought this offence deserved the shame it's suffering here."]], "499": [[0, 0, "Winter isn't over yet if the wild geese are flying that way."], [1, 4, "Fathers who wear rags make their children blind, but fathers who carry money bags will see their children kind."], [5, 6, "Fortune, that total whore, never opens the door to the poor."], [7, 8, "But for all this, you'll have as many sorrows from your daughters as you can count in a year."]], "508": [[0, 6, "We'll send you to school with an ant, to teach you there's no work in winter. Everyone who follows his nose is led by his eyes, except blind men, and there isn't one nose in twenty that can't smell a man who stinks of bad luck. Let go when a great wheel is running downhill, in case it breaks your neck as you follow it. But when a great man is going up the hill, let him pull you up after him."], [7, 8, "When a wise man gives you better advice, give me mine back. I'd want only rogues to follow it, since a fool gives it."], [9, 12, "The man who serves for profit and follows only for show will pack up when it starts to rain and leave you in the storm."], [13, 14, "But I will wait, the Fool will stay, and let the wise man run away."], [15, 16, "The rogue who runs away turns out the fool; the fool, by God, is no rogue."]], "512": [[0, 0, "Refuse to speak to me? They're ill? They're tired?"], [1, 1, "They've travelled all night?"], [2, 2, "Just excuses, signs of rebellion and desertion."], [3, 3, "Get me a better answer."]], "518": [[0, 1, "The King wants to speak with Cornwall. The dear father wants to speak with his daughter, and commands her service."], [2, 4, "Have they been told this? My breath and blood! Fiery? The fiery Duke? Tell the hot Duke that... No, not yet. Maybe he isn't well."], [5, 8, "Illness always makes us neglect the duties we are bound to when healthy. We aren't ourselves when nature, overpowered, forces the mind to suffer along with the body. I'll be patient."], [9, 11, "I'm angry with my own hastier impulse for taking a sick man's fit as the act of a healthy one. Damn my royal state! Why..."]], "520": [[0, 2, "[Looking at Kent] ...should he sit here? This act convinces me that this moving away of the Duke and her is only a trick. Release my servant."], [3, 6, "Go and tell the Duke and his wife I want to speak to them, now, at once. Tell them to come out and hear me, or I'll beat the drum at their bedroom door until it kills their sleep."]], "530": [[0, 3, "Regan, I think you are. I know why I have reason to think so. If you weren't glad, I'd divorce myself from your mother's tomb, because it would hold an adulteress. [To Kent] Oh, are you free? We'll talk about that another time."], [4, 6, "Beloved Regan, your sister is wicked. Oh Regan, she has tied sharp-toothed unkindness here, like a vulture... [He points to his heart.]"]], "537": [[0, 0, "Oh, sir, you are old."], [1, 5, "Your life is at the very edge of its limit. You should be ruled and guided by someone sensible who understands your condition better than you do yourself. So please go back to our sister."], [6, 6, "Tell her you've wronged her, sir."]], "538": [[0, 0, "Ask her forgiveness?"], [1, 2, "Just look how well this suits the royal family: [kneeling] 'Dear daughter, I confess that I am old."], [3, 5, "Old people are useless. On my knees I beg you to grant me clothes, a bed and food.'"]], "540": [[0, 0, "[Rising] Never, Regan."], [1, 6, "She has cut my followers by half, looked darkly at me, and stung me with her tongue, like a snake, right in the heart. May all the stored-up vengeance of heaven fall on her ungrateful head! Strike her unborn children's bones with lameness, you infectious airs!"]], "544": [[0, 0, "No, Regan, you will never have my curse."], [1, 9, "Your gentle nature will never let you be harsh. Her eyes are fierce, but yours comfort and don't burn. It's not in you to resent my pleasures, cut down my followers, trade hasty words, reduce my allowance, and, finally, bolt the door against my coming in. You know better the duties of nature, the bonds of a child, the obligations of courtesy and the debts of gratitude."], [10, 11, "You haven't forgotten the half of the kingdom I gave you."]], "561": [[0, 0, "Please, father, since you are weak, behave like it."], [1, 3, "If you go back and stay with my sister until the end of your month, dismissing half your followers, then come to me."], [4, 5, "I'm away from home now and don't have the supplies needed to look after you."]], "562": [[0, 0, "Go back to her, with fifty men dismissed?"], [1, 2, "No, I'd rather give up all roofs and choose to fight against the hostile weather, and be the companion of the wolf and the owl."], [3, 4, "Need's sharp pinch! Go back with her?"], [5, 8, "Why, I could just as easily be brought to kneel at the throne of that hot-blooded King of France, who took my youngest without a dowry, and beg like a servant for an allowance to keep my miserable life going. Go back with her?"], [9, 10, "Rather persuade me to be a slave and a packhorse to this hateful servant."], [11, 11, "[He points at Oswald.]"]], "564": [[0, 0, "Please, daughter, don't drive me mad."], [1, 1, "I won't trouble you, my child. Goodbye."], [2, 3, "We'll never meet again, never see each other again. But you are still my flesh, my blood, my daughter."], [4, 7, "Or rather a disease in my flesh that I have to call mine. You are a boil, a plague sore, a swollen tumour in my diseased blood. But I won't scold you. Let shame come when it will, I won't call for it."], [8, 10, "I won't ask Jupiter, the thunder-bearer, to strike you, or tell tales about you to him, the highest judge."], [11, 11, "Improve when you can. Become better in your own time."], [12, 13, "I can be patient. I can stay with Regan, I and my hundred knights."]], "565": [[0, 0, "Not quite."], [1, 2, "I wasn't expecting you yet, and I'm not ready to welcome you properly. Listen to my sister, sir."], [3, 5, "Those who see your passion with reason must conclude that you are old, and so... But she knows what she's doing."]], "567": [[0, 0, "I dare say it is, sir. What, fifty followers?"], [1, 1, "Isn't that enough? What do you need more for?"], [2, 5, "Or even that many, since both cost and danger argue against so many? How can many people in one house, under two masters, keep the peace? It's hard, almost impossible."]], "574": [[0, 3, "Wicked creatures still look good when others are even more wicked. Not being the worst deserves some praise. [To Goneril] I'll go with you."], [4, 5, "Your fifty is still double twenty-five, so your love is twice hers."]], "575": [[0, 0, "Listen to me, my lord."], [1, 3, "Why do you need twenty-five, ten or five followers, in a house where twice as many have orders to serve you?"]], "577": [[0, 1, "Oh, don't argue about need! Our lowest beggars have something more than they need, even if it's the poorest thing."], [2, 3, "If you don't allow human nature more than it needs, a man's life is as cheap as an animal's."], [4, 7, "You are a lady. If being warm were all it took to be gorgeous, nature wouldn't need the gorgeous clothes you wear, which hardly keep you warm. But as for true need..."], [8, 9, "You heavens, give me patience, patience is what I need! You see me here, you gods, a poor old man, as full of grief as of years, wretched in both!"], [10, 18, "If it's you who stir these daughters' hearts against their father, don't make me such a fool as to take it meekly. Fill me with noble anger, and don't let women's weapons, tears, stain my man's cheeks! No, you unnatural witches, I'll have such revenge on you both that the whole world will... I will do such things... What they are I don't know yet, but they'll be the terror of the earth."], [19, 22, "You think I'll weep. No, I won't weep. I have every reason to weep, but this heart will break into a hundred thousand pieces before I weep. Oh Fool, I'll go mad!"]], "592": [[0, 2, "Oh, sir, stubborn men must be taught by the injuries they bring on themselves. Lock your doors."], [3, 5, "He has a desperate gang with him, and since he's ready to listen to lies, wisdom tells us to fear what they might stir him up to do."]], "600": [[0, 0, "Fighting with the furious elements."], [1, 5, "He orders the wind to blow the land into the sea, or to raise the curling waves above the mainland, so that everything might change or end. He tears his white hair, which the violent gusts, in their blind rage, catch up and toss about like nothing."], [6, 7, "In his little human world he tries to outdo the wind and rain beating back and forth."], [8, 11, "On this night, when even the bear with her cubs sucked dry would stay in her den, and the lion and the starving wolf keep their fur dry, he runs about with no hat and dares whatever will to take everything."]], "603": [[0, 4, "Sir, I know you, and on the strength of what I've observed of you I dare to trust you with something important. There is a split, though so far both sides are hiding it with cunning, between Albany and Cornwall."], [5, 9, "Like everyone whose lucky stars have raised them high, they have servants who seem loyal but are really spies for France, sending information about our state: whether about the dukes' quarrels and plots, or the harsh treatment both have given the kind old King, or something deeper, of which these are perhaps just the outward signs."], [10, 17, "But it's true that an army is coming from France into this divided kingdom. Taking advantage of our carelessness, they have already secretly landed at some of our best ports and are about to show their flag openly."], [18, 22, "Now, as for you: if you trust me enough to hurry to Dover, you'll find someone who will thank you for giving an accurate report of the unnatural, maddening sorrow the King has reason to complain of."], [23, 25, "I'm a gentleman of good family and upbringing, and I offer you this task because I know and trust you."]], "605": [[0, 0, "No, don't."], [1, 4, "To prove I'm much more than I look on the outside, open this purse and take what's in it. If you see Cordelia, and don't worry, you will, show her this ring, and she'll tell you who your companion is, whom you don't yet know."], [5, 6, "Curse this storm!"], [7, 7, "I'll go and look for the King."]], "611": [[0, 0, "Blow, winds, and crack your cheeks! Rage! Blow!"], [1, 2, "You waterspouts and hurricanes, pour down until you have drowned our church spires and the weathercocks on top!"], [3, 6, "You sulphurous lightning, quick as thought, forerunners of the thunderbolts that split oak trees, singe my white head! And you, thunder that shakes everything, strike the round, solid world flat!"], [7, 8, "Crack the moulds nature makes things in, spill all the seeds at once that make ungrateful man!"]], "613": [[0, 0, "Rumble all you like! Spit, fire! Pour, rain!"], [1, 1, "Rain, wind, thunder and fire are not my daughters."], [2, 2, "I don't accuse you elements of unkindness."], [3, 3, "I never gave you a kingdom or called you my children."], [4, 10, "You owe me no obedience. So let your horrible will fall on me. Here I stand, your slave, a poor, sick, weak and despised old man. And yet I call you slavish servants, who have joined with two wicked daughters to throw your armies from the heavens against a head as old and white as this! Oh! Oh! It's foul!"]], "614": [[0, 0, "A man with a house to put his head in has a good helmet."], [1, 3, "The man who houses his penis before he has a house for his head will end up lousy, both of them; that's how beggars get married."], [4, 8, "The man who treats his toe as he should treat his heart will cry out with the pain of a corn and lose his sleep."], [9, 10, "For there was never yet a pretty woman who didn't make faces in a mirror."]], "620": [[0, 4, "Let the great gods who keep up this dreadful uproar over our heads find their enemies now. Tremble, you wretch, who have secret crimes inside you that justice hasn't whipped!"], [5, 11, "Hide, you bloody hand, you liar who breaks his oath, you pretender to virtue who commits incest! Shake to pieces, you villain, who under a secret, convenient disguise have plotted against men's lives! Close-hidden sins, burst out of what hides you, and beg mercy from these terrible officers of justice. I am a man more sinned against than sinning."]], "621": [[0, 0, "Oh dear, bareheaded!"], [1, 1, "My gracious lord, near here there's a hut."], [2, 2, "It will give you some shelter from the storm."], [3, 7, "Rest there while I go back to that hard house, harder than the stones it's built of, which only just now refused to let me in when I asked for you, and force them to show the courtesy they've held back."]], "622": [[0, 1, "My mind is starting to go. Come on, my boy. How are you, my boy?"], [2, 2, "Are you cold? I'm cold myself. Where is this straw, my friend?"], [3, 6, "Need has a strange skill: it can make worthless things precious. Come, to your hut. Poor Fool and boy, there's a part of my heart that still feels sorry for you."]], "627": [[0, 2, "This is a fine night to cool down a prostitute. I'll make a prophecy before I go."], [3, 7, "When priests talk more than they practise, when brewers spoil their malt with water, when nobles teach their tailors fashion, when no heretics are burned, only lovers burning with disease; when every law case is fair, no squire is in debt and no knight is poor; when slander doesn't live on people's tongues, and pickpockets don't come into crowds; when moneylenders count their gold in the open, and pimps and whores build churches: then the kingdom of Britain will fall into great confusion."], [8, 15, "Then the time will come, for anyone who lives to see it, when feet will be used for walking."], [16, 16, "Merlin will make this prophecy, for I live before his time."]], "633": [[0, 9, "Hush. Don't say anything. There's a split between the dukes, and something worse than that. I received a letter tonight. It's dangerous to speak about. I've locked it in my room. These injuries the King is suffering will be fully avenged. Part of an army has already landed. We must take the King's side. I'll look for him and secretly help him. You go and keep the Duke talking, so he doesn't notice my kindness. If he asks for me, I'm ill and gone to bed. Even if I die for it, as I've been threatened, the King my old master must be helped. Something strange is about to happen, Edmund."], [10, 10, "Please be careful."]], "635": [[0, 3, "The Duke will know at once about this kindness you were forbidden to show, and about that letter too. This looks like a reward worth having, and it should bring me what my father loses: nothing less than everything."], [4, 4, "The young rise when the old fall."]], "644": [[0, 3, "You think it's a big thing that this violent storm soaks us to the skin. So it is to you. But where a greater illness has taken hold, the lesser one is hardly felt."], [4, 8, "You'd run from a bear, but if your escape led towards the raging sea, you'd turn and face the bear's mouth. When the mind is free of trouble, the body is sensitive. The storm in my mind takes away all feeling from my senses except what beats there. Children's ingratitude!"], [9, 15, "Isn't it as if this mouth should tear this hand for lifting food to it? But I'll punish them fully. No, I won't weep any more. To shut me out on a night like this! Pour on, I'll endure it. On a night like this! Oh Regan, Goneril! Your kind old father, whose generous heart gave you everything... Oh, that way madness lies. Let me avoid that."], [16, 16, "No more of that."]], "646": [[0, 0, "Please, go in yourself. Look after your own comfort."], [1, 4, "This storm won't give me time to think about things that would hurt me more. But I'll go in. [To the Fool] In, boy, you go first. You homeless poverty... No, go in. I'll pray, and then I'll sleep."]], "648": [[0, 5, "Poor naked wretches, wherever you are, who put up with the beating of this pitiless storm, how will your homeless heads and starving bodies, your clothes full of holes, protect you from weather like this? Oh, I have taken too little care of this!"], [6, 8, "Take this medicine, you great and powerful: expose yourselves to feel what wretches feel, so that you may shake off your surplus to them and show that the heavens are more just."]], "664": [[0, 3, "Death, traitor! Nothing could have brought a man so low except his unkind daughters. Is it the fashion now that rejected fathers should show so little mercy to their own flesh? A fitting punishment!"], [4, 5, "It was this flesh that fathered those pelican daughters who feed on their parent's blood."]], "669": [[0, 0, "A servant, proud in heart and mind."], [1, 5, "I curled my hair, wore my mistress's gloves in my cap, satisfied my mistress's lust and did the act of darkness with her. I swore as many oaths as I spoke words and broke them in the sweet face of heaven. I fell asleep plotting lust and woke up to do it. I loved wine deeply and dice dearly, and had more women than the Sultan of Turkey."], [6, 7, "I was false-hearted, ready to believe gossip, quick to kill; a hog in laziness, a fox in sneakiness, a wolf in greed, a dog in madness, a lion in hunting prey."], [8, 12, "Don't let the creak of shoes or the rustle of silk dresses betray your poor heart to a woman. Keep your foot out of brothels, your hand out of petticoats, your name out of moneylenders' books, and defy the foul devil. Still the cold wind blows through the hawthorn, saying suum, mun, nonny. Dolphin, my boy, my boy, stop! Let him trot by."]], "671": [[0, 4, "Why, you'd be better in your grave than facing this extreme weather with your body uncovered. Is man no more than this? Look at him closely. You owe the silkworm no silk, the animal no leather, the sheep no wool, the civet cat no perfume. Ha! Three of us here are artificial! You are the real thing."], [5, 7, "Man without the comforts of civilisation is no more than a poor, bare, two-legged animal like you. Off, off, you borrowed clothes! Come, unbutton here."], [8, 8, "[He tears off his clothes.]"]], "673": [[0, 3, "This is the foul devil Flibbertigibbet. He starts at curfew and walks until the first cock crows. He gives people cataracts in the eye, makes them squint, gives them harelips, rots the white wheat with mildew and hurts the poor creatures of the earth."], [4, 4, "Saint Withold walked over the hill three times."], [5, 8, "He met the nightmare demon and her nine imps, told her to get off the sleeper and promise to do no harm, and be gone, witch, be gone!"]], "679": [[0, 3, "Poor Tom, who eats the swimming frog, the toad, the tadpole, the wall lizard and the water newt. In the fury of his heart, when the foul devil rages, he eats cow dung as salad, swallows old rats and dead dogs from ditches, and drinks the green scum on stagnant ponds."], [4, 8, "He's whipped from parish to parish, put in the stocks, punished and imprisoned. He used to have three suits for his back, six shirts for his body, a horse to ride and a sword to wear. But mice and rats and such small animals have been Tom's food for seven long years."], [9, 9, "Beware of the devil who follows me. Quiet, Smulkin! Quiet, you devil!"]], "684": [[0, 1, "Come in with me. My duty won't let me obey all your daughters' harsh orders."], [2, 5, "Though they have ordered me to lock my doors and let this cruel night take hold of you, I have dared to come and find you, and bring you where there is both a fire and food ready."]], "691": [[0, 0, "Can you blame him?"], [1, 7, "His daughters want him dead. Ah, that good Kent! He said it would be like this, poor banished man! You say the King is going mad. I tell you, friend, I'm almost mad myself. I had a son, now disowned and outlawed. He tried to kill me only recently, very recently. I loved him, friend. No father ever loved his son more. To tell you the truth..."]], "736": [[0, 0, "I'll see their trial first. Bring in the evidence."], [1, 4, "[To Edgar] You, man of justice in your robes, take your place. [To the Fool] And you, his partner in judgement, sit by his side. [To Kent] You're one of the judges. Sit down too."]], "737": [[0, 0, "Let's be fair."], [1, 1, "Are you asleep or awake, jolly shepherd?"], [2, 4, "Your sheep are in the corn, and if you give one blow on your dainty pipe, your sheep will come to no harm."], [5, 5, "Purr! The cat is grey."]], "742": [[0, 1, "And here's another, whose twisted looks show what her heart is made of. Stop her there!"], [2, 3, "Weapons, weapons! Sword! Fire! The court is corrupt! Lying judge, why have you let her escape?"]], "747": [[0, 0, "Tom will throw his head at them. Get away, you dogs!"], [1, 6, "Whether your mouth is black or white, with a tooth that poisons when it bites, mastiff, greyhound, grim mongrel, hound or spaniel, bitch or bloodhound, short-tailed cur or curly-tailed, Tom will make them weep and wail."], [7, 8, "For when I throw my head like this, the dogs jump over the gate and all run away."], [9, 10, "Do de, de, de. Stop! Come, march to festivals, fairs and market towns. Poor Tom, your drinking horn is dry."]], "755": [[0, 0, "Good friend, please, pick him up in your arms."], [1, 1, "I've overheard a plot to kill him."], [2, 4, "There's a stretcher ready. Lay him in it and drive towards Dover, friend, where you'll find both welcome and protection. Pick up your master."], [5, 7, "If you delay half an hour, his life, and yours, and the life of anyone who tries to defend him, will certainly be lost."], [8, 9, "Pick him up, pick him up, and follow me, and I'll quickly take you to some supplies."]], "756": [[0, 3, "His overburdened nature is sleeping. This rest might have healed his shattered nerves, which will be hard to cure if circumstances don't allow it. Come, help carry your master."], [4, 4, "[To the Fool] You mustn't stay behind."]], "759": [[0, 1, "When we see our superiors suffering our sorrows, we hardly think of our own misery as our enemy."], [2, 3, "Someone who suffers alone suffers most in his mind, leaving freedom and happy sights behind."], [4, 5, "But the mind skips over much of its suffering when grief has companions and pain is shared."], [6, 7, "How light and bearable my pain seems now, when what makes me bend makes the King bow down: he has his children, as I have my father!"], [8, 8, "Tom, go!"], [9, 11, "Pay attention to the great events, and reveal yourself when the false opinion whose mistaken thought dishonours you calls you back and makes peace with you once you've been proved innocent."], [12, 12, "Whatever else happens tonight, may the King escape safely!"], [13, 13, "Hide, hide."]], "767": [[0, 4, "Leave him to my anger. Edmund, keep our sister company. The revenge we must take on your traitorous father is not fit for you to watch. Tell the Duke, where you're going, to prepare as fast as possible. We're bound to do the same. Our messengers will travel quickly and carry news between us."], [5, 5, "Goodbye, dear sister. Goodbye, my lord of Gloster."]], "770": [[0, 0, "My lord of Gloster has taken him away."], [1, 5, "Some thirty-five or thirty-six of his knights, searching eagerly for him, met him at the gate, and they, with some of the lord's servants, have gone with him towards Dover, where they claim to have well-armed friends."]], "790": [[0, 2, "Wicked lady, these hairs you're tearing from my chin will come to life and accuse you. I am your host."], [3, 4, "You shouldn't tear at my hospitable face with a robber's hands like this. What will you do?"]], "804": [[0, 2, "Because I didn't want to see your cruel nails pluck out his poor old eyes, or your fierce sister stick her boar's tusks into his holy, anointed flesh."], [3, 6, "The sea, in a storm like the one his bare head endured on this hell-black night, would have risen up and put out the stars. Yet, poor old heart, he added his tears to the rain."], [7, 8, "If wolves had howled at your gate in that dreadful time, you should have said, 'Good porter, unlock the door. Every other cruel creature would have given way."], [9, 10, "But I will see heaven's winged vengeance catch up with children like these."]], "810": [[0, 0, "Stop, my lord!"], [1, 3, "I've served you ever since I was a child, but I've never done you better service than now, telling you to stop."]], "820": [[0, 0, "Out, treacherous villain!"], [1, 2, "You're calling on someone who hates you. It was he who revealed your treasons to us."], [3, 3, "He is too good to pity you."]], "823": [[0, 2, "I've been wounded. Follow me, lady. Throw out that eyeless villain. Throw this slave on the dunghill. Regan, I'm bleeding fast."], [3, 3, "This wound comes at a bad time. Give me your arm."]], "832": [[0, 3, "Still, it's better to be like this, and know you're despised, than to be despised while being flattered. To be at the very bottom, the lowest and most downcast of fortune's creatures, still leaves room for hope and no reason for fear."], [4, 6, "The sad change is from the best. From the worst you can only return to laughter. Welcome, then, you empty air that I embrace!"], [7, 8, "The wretch you've blown down to the worst owes nothing to your storms. But who's coming?"]], "838": [[0, 0, "I have no way to go, so I don't need eyes."], [1, 4, "I stumbled when I could see. We often find that our advantages make us careless, and our simple disadvantages turn out to be benefits. Oh, dear son Edgar, the victim of your deceived father's anger!"], [5, 6, "If I could only live to see you by touching you, I'd say I had eyes again!"]], "846": [[0, 0, "He has some sense left, or he couldn't beg."], [1, 1, "In last night's storm I saw a fellow like that, who made me think a man is just a worm."], [2, 4, "My son came into my mind then, though at the time I was hardly friendly towards him. I've heard more since."], [5, 6, "We are to the gods what flies are to cruel boys. They kill us for fun."]], "861": [[0, 2, "Here, take this purse, you whom the heavens' plagues have brought so low that you accept every blow. My misery makes you happier. Heavens, always act like this!"], [3, 5, "Let the man who has too much and feeds his appetites, who treats your laws as his slaves, who won't see because he doesn't feel, feel your power quickly."], [6, 7, "Then sharing out would undo excess, and every man would have enough. Do you know Dover?"]], "863": [[0, 1, "There's a cliff whose high, overhanging top looks fearfully down into the enclosed sea below."], [2, 5, "Just bring me to the very edge of it, and I'll repair your poverty with something valuable I have on me. From that place I won't need any leading."]], "869": [[0, 0, "Inside, madam, but I've never seen a man so changed."], [1, 1, "I told him about the army that had landed."], [2, 2, "He smiled at it. I told him you were coming."], [3, 8, "His answer was 'So much the worse. When I told him about Gloster's treachery and the loyal service of his son, he called me a fool and said I'd got it all inside out. What he should dislike most seems to please him, and what he should like offends him."]], "870": [[0, 0, "[To Edmund] Then you won't go any further."], [1, 4, "It's the cowardly fear in his spirit that doesn't dare take action. He'll ignore insults that would force him to respond. What we wished for on the way here may come true. Go back, Edmund, to my brother-in-law."], [5, 5, "Hurry his gathering of troops and lead his army."], [6, 10, "I must swap weapons at home and give my husband the spinning distaff. This trustworthy servant will carry messages between us. Before long you're likely to hear, if you dare to act for your own advantage, a command from your mistress."], [11, 11, "[She gives him a token. Wear this."], [12, 14, "Don't speak. Bend your head. This kiss, if it dared to speak, would lift your spirits up into the sky. Understand me, and goodbye."]], "873": [[0, 0, "My dearest Gloster!"], [1, 1, "Oh, the difference between one man and another!"], [2, 2, "A woman's services are owed to you."], [3, 3, "My fool of a husband has taken my body like a usurper."]], "878": [[0, 0, "Oh Goneril!"], [1, 2, "You're not worth the dust the rough wind blows in your face! I'm afraid of your nature."], [3, 4, "A creature that despises its own origin can't be kept within any limits."], [5, 7, "A branch that tears itself away from the tree that feeds it must wither and end up as firewood."]], "880": [[0, 0, "Wisdom and goodness seem vile to the vile."], [1, 1, "Filth likes only the taste of itself. What have you done?"], [2, 2, "Tigers, not daughters, what have you done?"], [3, 5, "A father, a gracious old man whose dignity even a bear dragged by its head would lick, you most barbarous, most degenerate women have driven mad."], [6, 6, "Could my good brother-in-law let you do it?"], [7, 7, "A man, a prince, who owed him so much!"], [8, 12, "If the heavens don't send their spirits down in visible form, quickly, to tame these vile crimes, it will come to this: humanity will be forced to prey on itself, like monsters of the deep."]], "881": [[0, 0, "Coward with milk for a liver!"], [1, 1, "You turn your cheek to be hit and your head to be wronged."], [2, 5, "You haven't got eyes in your head to tell what's honourable from what should be put up with. You don't know that only fools pity villains who are punished before they've done their crime. Where's your drum?"], [6, 9, "The King of France spreads his banners in our silent land, and in his plumed helmet your killer starts threatening, while you, a moralising fool, sit still and cry, 'Oh dear, why does he do this?'"]], "884": [[0, 0, "You changed creature, hiding your true self, for shame!"], [1, 2, "Don't turn your face into a monster's!"], [3, 5, "If it were fitting for me to let these hands obey my anger, they'd be quite ready to tear your flesh and bones apart. Devil though you are, your woman's shape protects you."]], "891": [[0, 2, "This shows that you are up there, you heavenly judges, since you can avenge our crimes down here so quickly! But oh, poor Gloster!"], [3, 3, "Did he lose his other eye?"]], "893": [[0, 0, "[Aside] In one way I like this very much."], [1, 4, "But now she's a widow, and my Gloster is with her, all the castles I've built in my imagination may come crashing down on my hateful life. In another way, the news isn't so bitter. [Aloud] I'll read it and answer."]], "901": [[0, 2, "Gloster, I live to thank you for the love you showed the King, and to avenge your eyes. Come here, friend."], [3, 3, "Tell me what else you know."]], "910": [[0, 0, "Yes, sir."], [1, 4, "She took them and read them in front of me, and now and then a large tear trickled down her delicate cheek. She seemed to be queen over her emotion, which, like a rebel, tried to be king over her."]], "914": [[0, 1, "Yes, once or twice she sighed out the word 'father' breathlessly, as if it weighed on her heart."], [2, 2, "She cried, 'Sisters, sisters! Shame of women! Sisters! Kent!"], [3, 3, "Father! Sisters! What, in the storm? At night?"], [4, 7, "Let pity not be believed to exist! Then she shook the holy water from her heavenly eyes and soaked her cries with tears. Then she rushed away to deal with her grief alone."]], "915": [[0, 1, "It's the stars, the stars above us, that control our natures."], [2, 3, "Otherwise the same husband and wife couldn't produce such different children. Haven't you spoken to her since?"]], "919": [[0, 0, "Well, sir, poor, distressed Lear is in the town."], [1, 3, "Sometimes, in his saner moments, he remembers why we've come, and he absolutely refuses to see his daughter."]], "925": [[0, 2, "Well, sir, I'll take you to our master Lear and leave you to look after him. An important reason will keep me in disguise for a while."], [3, 5, "When I'm known for who I really am, you won't regret having trusted me. Please come with me."]], "929": [[0, 1, "Oh dear, it's him."], [2, 5, "He was seen just now, as mad as the stormy sea, singing loudly, crowned with stinking fumitory and field weeds, with burdock, hemlock, nettles, cuckoo-flowers, darnel and all the useless weeds that grow among the corn that feeds us. Send out a hundred soldiers."], [6, 7, "Search every acre of the high-grown fields and bring him to me. [An officer leaves."], [8, 9, "What can human knowledge do to restore his lost mind?"], [10, 10, "Whoever helps him can take all my worldly wealth."]], "930": [[0, 0, "There is a way, madam."], [1, 4, "Sleep is nature's nurse, and he lacks it. There are many effective herbs to bring sleep on, whose power will close the eye of pain."]], "931": [[0, 3, "All you blessed secrets, all you undiscovered healing powers of the earth, spring up, watered by my tears! Help and cure this good man's suffering!"], [4, 5, "Search, search for him, in case his uncontrolled rage ends the life that lacks the reason to guide it."]], "934": [[0, 2, "We knew that already. Our forces are ready and waiting for them. Oh, dear father, it's your business I'm about."], [3, 4, "That's why the great King of France has pitied my mourning and my pleading tears."], [5, 6, "No swollen ambition drives our army, only love, dear love, and our old father's rights."], [7, 7, "May I soon hear and see him!"]], "946": [[0, 0, "Well, he has rushed off on serious business."], [1, 6, "It was very stupid, once Gloster's eyes were out, to let him live. Wherever he goes he turns everyone's hearts against us. I think Edmund has gone, out of pity for his misery, to end his darkened life, and also to spy out the enemy's strength."]], "952": [[0, 0, "I know your lady doesn't love her husband."], [1, 3, "I'm sure of that. When she was here recently she gave strange glances and very meaningful looks to noble Edmund. I know you're in her confidence."]], "954": [[0, 0, "I know what I'm saying. You are. I know it."], [1, 1, "So I advise you, take note of this."], [2, 2, "My husband is dead."], [3, 4, "Edmund and I have talked, and he's more suitable to marry me than your lady. You can work out the rest."], [5, 5, "If you find him, please give him this."], [6, 8, "And when you tell your mistress all this, please tell her to come to her senses. So, goodbye."], [9, 10, "If you happen to hear of that blind traitor, promotion awaits the man who kills him."]], "969": [[0, 1, "Come on, sir, here's the place. Stand still. How frightening and dizzying it is to look so far down!"], [2, 4, "The crows and jackdaws flying halfway down hardly look as big as beetles. Halfway down hangs a man gathering samphire. What a dreadful job! He seems no bigger than his head."], [5, 11, "The fishermen walking on the beach look like mice, and that tall ship at anchor over there has shrunk to the size of her little rowing boat, and her rowing boat to a buoy almost too small to see. The murmuring waves that rub against the countless pebbles can't be heard from this high up."], [12, 13, "I won't look any more, in case my brain spins and my failing sight sends me toppling headfirst."]], "972": [[0, 0, "Let go of my hand."], [1, 3, "Here, friend, is another purse. There's a jewel in it worth a poor man's having. May fairies and gods make it prosper for you! Go further away."], [4, 4, "Say goodbye to me, and let me hear you going."]], "977": [[0, 0, "Oh, you mighty gods!"], [1, 2, "I give up this world, and in your sight I patiently shake off my great suffering."], [3, 7, "If I could bear it any longer without falling into rebellion against your great, unstoppable wills, the burnt-out, hated stub of my life would burn itself out naturally. If Edgar is alive, oh, bless him! Now, fellow, goodbye."]], "980": [[0, 3, "And yet I don't know whether imagination can rob life of its treasure when life itself gives in to the theft. If he'd been where he thought he was, by now he'd be past all thought. Alive or dead?"], [4, 6, "Hey, you, sir! Friend! Do you hear me, sir? Speak! He might really die like this. But he's coming round. Who are you, sir?"]], "982": [[0, 2, "If you'd been made of anything except gossamer, feathers or air, falling so many fathoms down, you'd have smashed like an egg."], [3, 3, "But you're breathing, you have a solid body, you're not bleeding, you're speaking, you're in one piece."], [4, 5, "Ten masts on top of each other wouldn't reach the height you've fallen straight down."], [6, 6, "Your life is a miracle. Speak again."]], "990": [[0, 2, "As I stood down here, I thought his eyes were like two full moons. He had a thousand noses and horns twisted and waving like the rippling sea."], [3, 5, "It was some devil. So, you lucky father, believe that the pure gods, who earn their glory by doing what is impossible for men, have saved you."]], "997": [[0, 0, "Nature is better than art in that respect. There's your enlistment money."], [1, 5, "That fellow handles his bow like a scarecrow. Draw it back a full yard for me. Look, look, a mouse! Quiet, quiet. This piece of toasted cheese will catch it. There's my glove. I'll challenge a giant with it. Bring up the pikemen. Oh, well flown, bird! In the target, in the target! Whoosh! Give the password."]], "1001": [[0, 0, "Ha! Goneril with a white beard!"], [1, 7, "They flattered me like a dog and told me I had the wisdom of white hairs in my beard before the black ones had even grown. To say 'yes' and 'no' to everything I said! Saying 'yes' and 'no' at once was bad religion too. When the rain came to soak me once, and the wind to make my teeth chatter, when the thunder wouldn't be quiet when I ordered it, then I found them out, then I smelled them out. Go on, they're not men of their word. They told me I was everything. It's a lie. I'm not immune to fever."]], "1003": [[0, 0, "Yes, every inch a king."], [1, 1, "When I stare, see how my subject trembles."], [2, 4, "I pardon that man's life. What was your crime? Adultery? You won't die. Die for adultery? No."], [5, 6, "The wren does it, and the little golden fly has sex right in front of me."], [7, 9, "Let copulation flourish, for Gloster's bastard son was kinder to his father than my daughters, conceived between lawful sheets."], [10, 12, "Go to it, lust, all together, for I need soldiers."], [13, 16, "Look at that simpering lady over there, whose face suggests she's frigid between her legs, who acts the virtuous woman and shakes her head at the very mention of pleasure. The polecat and the well-fed horse don't go at it with a wilder appetite."], [17, 18, "From the waist down they are centaurs, though they're women above."], [19, 22, "The gods own them down to the belt; below is all the devil's. There's hell, there's darkness, there's the sulphurous pit, burning, scalding, stink, disease. Shame, shame, shame!"], [23, 24, "Ugh, ugh! Give me an ounce of perfume, good chemist, to sweeten my imagination. There's money for you."]], "1014": [[0, 0, "What, are you mad? A man can see how the world goes without eyes."], [1, 4, "Look with your ears. See how that judge over there abuses that simple thief. Listen, in your ear: swap them round, and, take your pick, which is the judge and which is the thief? Have you seen a farmer's dog bark at a beggar?"]], "1016": [[0, 2, "And the poor man run from the dog? There you could see the great image of authority: even a dog is obeyed when it holds office. You rascal of a constable, stop your bloody hand!"], [3, 3, "Why are you whipping that whore? Strip your own back."], [4, 5, "You burn with lust to use her in the very way you're whipping her for. The moneylender hangs the cheat."], [6, 6, "Small sins show through ragged clothes."], [7, 8, "Robes and fur gowns hide everything. Cover sin in gold plate and the strong lance of justice breaks harmlessly against it."], [9, 9, "Dress it in rags and a pygmy's straw can pierce it."], [10, 10, "Nobody does wrong, nobody, I say nobody. I'll vouch for them."], [11, 12, "Take that from me, my friend, who has the power to seal the accuser's lips."], [13, 14, "Get yourself glass eyes, and, like a vile politician, pretend to see the things you don't. Now, now, now, now."], [15, 15, "Pull off my boots. Harder, harder. That's it."]], "1018": [[0, 0, "If you want to weep over my misfortunes, take my eyes."], [1, 1, "I know you well enough. Your name is Gloster."], [2, 2, "You must be patient. We came into the world crying."], [3, 4, "You know, the first time we smell the air, we wail and cry. I'll preach to you. Listen."]], "1020": [[0, 3, "When we're born, we cry because we've come to this great stage full of fools. This is a good hat. It would be a clever trick to shoe a troop of horses with felt."], [4, 5, "I'll try it out, and when I've crept up on these sons-in-law, then kill, kill, kill, kill, kill, kill!"]], "1023": [[0, 1, "No rescue? What, a prisoner? I'm the born plaything of fortune. Treat me well."], [2, 2, "You'll have a ransom. Get me surgeons."], [3, 3, "I'm wounded in the brain."]], "1025": [[0, 0, "No one to back me up?"], [1, 3, "All by myself? Why, this would turn a man into a man of salt tears, using his eyes as garden watering cans to settle the autumn dust."]], "1048": [[0, 0, "A wanted man with a price on his head!"], [1, 4, "What luck! That eyeless head of yours was born to make my fortune. You unhappy old traitor, say your prayers quickly. The sword is drawn that will kill you."]], "1051": [[0, 1, "Why, you bold peasant, do you dare to help a declared traitor?"], [2, 3, "Get away, in case the plague of his bad luck catches you too. Let go of his arm."]], "1058": [[0, 0, "Slave, you've killed me. Villain, take my purse."], [1, 4, "If you ever want to do well, bury my body, and give the letters you find on me to Edmund, Earl of Gloster. Look for him with the British army. Oh, death before my time!"], [5, 5, "[He dies.]"]], "1061": [[0, 4, "Sit down, father. Rest. Let's look in these pockets. The letters he talks about may help me. He's dead. I'm only sorry he had no other executioner. Let's see. Excuse me, gentle seal, and, good manners, don't blame us."], [5, 5, "To know our enemies' minds we'd tear out their hearts."], [6, 6, "Opening their letters is more lawful."], [7, 12, "[He reads] 'Remember the vows we made to each other. You have many chances to kill him. If you have the will, time and place will be offered generously. Nothing will have been done if he comes back the winner. Then I'll be the prisoner and his bed my jail. Rescue me from its hateful warmth, and take his place as your reward."], [13, 14, "Your (wife, I wish I could say) loving servant, Goneril."], [15, 15, "Oh, the boundless range of a woman's lust!"], [16, 16, "A plot against her good husband's life, and my brother to replace him!"], [17, 22, "Here in the sand I'll bury you, unholy messenger of murderous lovers. And when the time is right, I'll show this wicked letter to the Duke whose death was plotted. It's lucky for him that I can tell him of your death and your errand."]], "1063": [[0, 2, "The King is mad. How stubborn my hateful mind is, that I stay upright and keep a clear awareness of my huge sorrows! Better if I were mad."], [3, 5, "Then my thoughts would be cut off from my griefs, and through false imaginings my sufferings would forget themselves."]], "1073": [[0, 0, "Forgive me, dear madam."], [1, 1, "To be recognised now would spoil the plan I've made."], [2, 3, "I ask as a favour that you don't acknowledge me until the time is right and I think so."]], "1076": [[0, 1, "Oh, you kind gods, heal this great wound in his abused nature!"], [2, 3, "Oh, tune again the jangled, untuned senses of this father, changed by his children!"]], "1085": [[0, 2, "Even if you hadn't been their father, these white hairs should have moved them to pity. Was this a face to be set against the warring winds?"], [3, 10, "To stand against the deep, terrible thunderbolts, in the most terrible and rapid strokes of zigzag lightning? To keep watch, like a poor lost sentry, with this thin covering of hair for a helmet? My enemy's dog, even if it had bitten me, should have stood by my fire that night. And were you forced, poor father, to shelter with pigs and lost wretches in short, musty straw?"], [11, 12, "Oh dear, oh dear! It's a wonder your life and your wits didn't end together. He's waking. Speak to him."]], "1093": [[0, 3, "Where have I been? Where am I? Bright daylight? I've been badly deceived. I'd die of pity to see someone else like this. I don't know what to say. I won't swear these are my hands. Let's see."], [4, 5, "I feel this pin prick. I wish I were sure of my condition!"]], "1095": [[0, 0, "Please don't make fun of me."], [1, 2, "I'm a very foolish, silly old man, over eighty, not an hour more or less, and to be honest, I'm afraid I'm not in my right mind."], [3, 9, "I think I should know you, and know this man, but I'm not sure, because I've no idea what place this is, and no matter how hard I try I can't remember these clothes, or where I slept last night."], [10, 11, "Don't laugh at me, for as surely as I'm a man, I think this lady is my child Cordelia."]], "1097": [[0, 0, "Are your tears wet? Yes, they are. Please don't cry."], [1, 1, "If you have poison for me, I'll drink it."], [2, 3, "I know you don't love me, because your sisters, as far as I can remember, have wronged me."], [4, 4, "You have some reason. They have none."]], "1102": [[0, 2, "Take comfort, good madam. The great madness, you see, has been killed in him. But it's still dangerous to make him go over the time he's lost."], [3, 4, "Ask him to go in, and don't trouble him any more until he's more settled."]], "1118": [[0, 3, "Find out from the Duke whether his latest plan still stands, or whether something has since persuaded him to change course. He's full of changes and self-doubt. Bring back his final decision."], [4, 4, "[To an officer, who leaves.]"]], "1121": [[0, 1, "Now, sweet lord, you know the good things I intend for you."], [2, 3, "Tell me, but truthfully, tell me the truth: don't you love my sister?"]], "1145": [[0, 0, "Before you fight the battle, open this letter."], [1, 6, "If you win, let the trumpet sound for the man who brought it. Wretched as I look, I can produce a champion who will prove what it says. If you lose, your business in the world is over, and all plotting stops. May fortune love you!"]], "1151": [[0, 0, "The enemy is in sight. Get your army into position."], [1, 3, "Here's an estimate of their real strength and forces, from careful scouting. But now you must hurry."]], "1154": [[0, 0, "I've sworn my love to both these sisters."], [1, 2, "Each is suspicious of the other, as people who've been stung are of the snake. Which of them shall I take?"], [3, 5, "Both? One? Neither? Neither can be enjoyed if both are still alive."], [6, 14, "Taking the widow will enrage and madden her sister Goneril, and I'll hardly be able to win my side of the game while her husband is alive. So for now we'll use his authority for the battle. When that's over, let her who wants to be rid of him think up a way to get rid of him quickly. As for the mercy he intends to show Lear and Cordelia, once the battle is over and they're in our power, they'll never see his pardon. My position depends on me defending it, not debating it."]], "1159": [[0, 1, "Here, father, take the shade of this tree as your good host. Pray that the right side wins."], [2, 3, "If I ever come back to you, I'll bring you comfort."]], "1171": [[0, 1, "We are not the first who have met the worst while meaning the best."], [2, 2, "It's for you, oppressed King, that I am cast down."], [3, 4, "On my own I could outface false fortune's frown. Shall we not see these daughters and these sisters?"]], "1172": [[0, 0, "No, no, no, no! Come, let's go to prison."], [1, 1, "We two alone will sing like birds in a cage."], [2, 11, "When you ask me for a blessing, I'll kneel down and ask you for forgiveness. So we'll live, and pray, and sing, and tell old stories, and laugh at the courtiers in their gilded clothes like butterflies, and hear poor wretches talk about court news. And we'll talk with them too, about who's losing and who's winning, who's in favour and who's out, and take on ourselves the mystery of things, as if we were God's spies. And in a walled prison we'll outlast the gangs and factions of great people, who rise and fall like the tides with the moon."]], "1174": [[0, 1, "On sacrifices like these, my Cordelia, the gods themselves throw incense. Have I caught you?"], [2, 3, "Anyone who parts us will have to bring a burning torch from heaven and smoke us out like foxes."], [4, 5, "Wipe your eyes. The plague will devour them, flesh and skin, before they make us weep. We'll see them starve first."], [6, 6, "Come."]], "1176": [[0, 0, "Come here, captain. Listen."], [1, 1, "Take this note [giving him a paper]. Follow them to prison."], [2, 8, "I've promoted you one step already. If you do what this tells you, you'll make your way to great fortune. Understand this: men must be like the times they live in. Being soft-hearted doesn't suit a soldier. Your important task allows no questions. Either say you'll do it, or find another way to get on."]], "1182": [[0, 2, "Sir, you've shown your brave nature today, and fortune led you well. You have the captives who were our opponents in today's fight."], [3, 5, "We require you to hand them over, so we can treat them as their deserts and our safety equally decide."]], "1183": [[0, 2, "Sir, I thought it right to send the old and miserable King to be kept under a chosen guard."], [3, 6, "His age has a power, and his title even more, to win the hearts of the common people to his side and turn the lances of the soldiers we've conscripted against our own eyes, though we command them."], [7, 10, "I sent the Queen with him for the same reason. They'll be ready tomorrow, or later, to appear wherever you hold your trial. At this moment we are sweating and bleeding."], [11, 14, "Friends have lost friends, and even the best causes, in the heat of the moment, are cursed by those who feel their sharpness. The question of Cordelia and her father needs a more suitable place."]], "1185": [[0, 0, "That depends on how we choose to honour him."], [1, 2, "I think you might have asked what I wanted before you said so much."], [3, 3, "He led my armies and carried the authority of my rank and person."], [4, 5, "Being so closely connected with me, he may well stand up and call himself your brother."]], "1191": [[0, 2, "Lady, I'm not well, or I'd answer you with all my anger. General, take my soldiers, prisoners and inheritance. Do what you like with them, and with me."], [3, 3, "The fortress of my heart is yours."], [4, 5, "Let the world witness that I make you my lord and master here."]], "1197": [[0, 4, "Wait. Listen to reason. Edmund, I arrest you for high treason, and along with you this gilded snake [pointing to Goneril]. As for your claim, fair sister, I block it on behalf of my wife."], [5, 6, "She's already engaged to this lord, and I, her husband, object to your marriage."], [7, 8, "If you want to marry, court me. My lady is already spoken for."]], "1199": [[0, 0, "You are armed, Gloster. Let the trumpet sound."], [1, 6, "If no one appears to prove your terrible, obvious and many treasons on your body, there's my challenge [throwing down a glove]. I'll prove on your heart, before I eat bread again, that you are everything I've declared you to be."]], "1202": [[0, 2, "There's my answer [throwing down a glove]. Whoever in the world calls me a traitor lies like a villain."], [3, 5, "Call with your trumpet. Whoever dares come forward, him, or you, or anyone, I'll defend my truth and honour firmly."]], "1222": [[0, 1, "Know that my name is lost, gnawed bare and eaten away by the tooth of treason."], [2, 3, "Yet I'm as noble as the opponent I come to fight."]], "1226": [[0, 2, "Draw your sword, so that if my words offend a noble heart, your arm can win you justice. Here is mine."], [3, 7, "Look, it is my right as a knight, by my oath and my profession, to declare this: in spite of your strength, youth, position and high rank, in spite of your victorious sword and brand-new fortune, your courage and your spirit, you are a traitor."], [8, 15, "False to your gods, your brother and your father, a conspirator against this noble and illustrious prince, and from the very top of your head to the dust beneath your feet, a traitor spotted with venom like a toad. If you say 'No', this sword, this arm and all my courage are ready to prove on your heart, which I'm speaking to, that you lie."]], "1227": [[0, 0, "Wisdom says I should ask your name."], [1, 4, "But since you look so fine and warlike, and your speech shows some sign of good breeding, I scorn and reject the delay I could safely and properly claim under the rules of knighthood."], [5, 5, "I throw those accusations of treason back at your head, and crush your heart with the hellish lie."], [6, 9, "Since they only glance off and hardly bruise, this sword of mine will open a way for them straight into your heart, where they'll stay for ever. Trumpets, sound!"]], "1230": [[0, 0, "This is just a trick, Gloster."], [1, 3, "By the laws of combat you weren't obliged to fight an unknown opponent. You haven't been defeated, but cheated and tricked."]], "1231": [[0, 1, "Shut your mouth, woman, or I'll stop it with this paper. Wait, sir."], [2, 3, "You, worse than any name, read about your own evil. Don't tear it, lady. I see you know it."]], "1238": [[0, 0, "What you've accused me of, I have done, and more, much more."], [1, 1, "Time will reveal it."], [2, 4, "It's in the past, and so am I. But who are you, who have won this fortune over me? If you're noble, I forgive you."]], "1239": [[0, 0, "Let's exchange forgiveness."], [1, 1, "I'm no lower in birth than you, Edmund."], [2, 2, "If I'm higher, you've wronged me all the more."], [3, 3, "My name is Edgar, and I'm your father's son."], [4, 5, "The gods are just, and they make our pleasant sins into tools to punish us."], [6, 7, "The dark and sinful place where he conceived you cost him his eyes."]], "1241": [[0, 1, "I thought your very walk promised a royal nobility. I must embrace you."], [2, 3, "Let sorrow split my heart if I ever hated you or your father!"]], "1244": [[0, 3, "By looking after him, my lord. Listen to a short story, and when it's told, oh, I wish my heart would burst! To escape the bloody proclamation that hunted me so closely (oh, how sweet life is, that we'd rather suffer the pain of death every hour than die all at once!"], [4, 10, "I learned to change into a madman's rags and take on an appearance that even dogs despised. In this disguise I met my father with his bleeding eye sockets, which had just lost their precious stones. I became his guide, led him, begged for him, saved him from despair."], [11, 12, "I never, oh, what a mistake, revealed myself to him until about half an hour ago, when I was armed."], [13, 18, "Not sure, though hoping, that this would succeed, I asked his blessing, and told him the story of my journey from beginning to end. But his cracked heart, oh dear, too weak to bear the struggle between the two extremes of joy and grief, burst smiling."]], "1247": [[0, 3, "This would have seemed the limit to people who don't love sorrow. But one more sorrow, adding too much, would make it much greater and go beyond the extreme."], [4, 9, "While I was crying out loud in grief, a man came who had seen me at my lowest and avoided my hateful company. But then, finding out who it was who had suffered so much, he threw his strong arms round my neck and roared as if he would burst the sky."], [10, 14, "He threw himself on my father's body and told the most pitiful story about Lear and himself that anyone ever heard. As he told it, his grief grew overwhelming, and the strings of his heart began to crack. Then the trumpets sounded twice, and there I left him unconscious."]], "1280": [[0, 0, "Howl, howl, howl, howl! Oh, you are men of stone."], [1, 3, "If I had your tongues and eyes, I'd use them so that the dome of heaven would crack. She's gone for ever! I know when someone is dead and when someone is alive."], [4, 4, "She's as dead as earth. Lend me a mirror."], [5, 6, "If her breath mists or clouds the glass, why, then she's alive."]], "1288": [[0, 0, "A plague on you all, murderers, traitors!"], [1, 2, "I might have saved her. Now she's gone for ever! Cordelia, Cordelia! Stay a little. Ha!"], [3, 5, "What are you saying? Her voice was always soft, gentle and low, an excellent thing in a woman. I killed the slave who was hanging you."]], "1290": [[0, 0, "Didn't I, fellow?"], [1, 3, "I've seen the day when with my good sharp sword I'd have made them jump. I'm old now, and these troubles weaken me. Who are you?"], [4, 4, "My eyes aren't the best. I'll tell you in a moment."]], "1305": [[0, 1, "That's only a trifle here. You lords and noble friends, know what I intend."], [2, 6, "Whatever comfort can be given to this great ruined man will be given. As for me, I'll hand back my absolute power to this old king for the rest of his life."], [7, 10, "[To Edgar and Kent] You will have your rights restored, with extra honours, more than your noble deeds deserve. All friends will taste the rewards of their virtue, and all enemies the cup of what they deserve. Oh, look, look!"]], "1306": [[0, 0, "And my poor fool is hanged! No, no, no life!"], [1, 6, "Why should a dog, a horse, a rat have life, and you no breath at all? You'll never come back, never, never, never, never, never! Please undo this button. Thank you, sir. Do you see this? Look at her! Look, her lips! Look there, look there! [He dies.]"]], "1316": [[0, 1, "We must bear the weight of this sad time and say what we feel, not what we ought to say."], [2, 3, "The oldest have suffered most. We who are young will never see so much, or live so long."]]};
const PARTS={"21": [[0, 6, "Meanwhile, I will reveal my secret plan. Give me the map there. You should know that I have divided my kingdom into three, and it is my firm intention to shake all cares and business off my old age, handing them to younger and stronger people while I crawl towards death without a burden. My son-in-law Cornwall, and you, my equally loved son-in-law Albany…"], [7, 15, "I have decided right now to announce the dowry each of my daughters will receive, so that future quarrels are prevented. The King of France and the Duke of Burgundy, great rivals for my youngest daughter's love, have stayed at my court a long time courting her, and they will get their answer today. Tell me, my daughters, since I am now giving up power, land and the cares of state: which of you shall I say loves me most?"], [16, 18, "Then I can give the largest gift to the one whose natural love deserves it most. Goneril, my eldest, speak first."]], "34": [[0, 3, "My good lord, you gave me life, brought me up and loved me. I return those duties as is right: I obey you, love you and honour you above all."], [4, 9, "Why do my sisters have husbands if they say they love only you? When I marry, I expect the man who takes my vow will take half my love with him, and half my care and duty. I will certainly never marry like my sisters and love only my father."]], "41": [[0, 5, "Quiet, Kent! Don't come between the dragon and its rage. I loved her most, and hoped to spend my old age in her loving care. [To Cordelia] Go, get out of my sight! As I hope to rest in peace in my grave, I take my father's heart away from her. Call the King of France! Is nobody moving?"], [6, 8, "Call Burgundy! Cornwall and Albany, add this third to my two daughters' dowries. Let her pride, which she calls honesty, find her a husband."], [9, 15, "I give you both together my power, my rank and all the grand trappings of majesty. I will live with each of you in turn, a month at a time, keeping a hundred knights for whom you will provide. I keep only the name and the honours of a king."], [16, 20, "The rule, the revenue and the running of everything else are yours, beloved sons. To confirm it, share this crown between you. [He gives them the crown.]"]], "44": [[0, 2, "Let it fall, then, even if the arrowhead pierces my heart. Kent must be rude when Lear is mad. What are you doing, old man?"], [3, 10, "Do you think duty will be afraid to speak when power gives in to flattery? Honour must speak plainly when a king falls into folly. Keep your power, and think again carefully to stop this terrible rashness. I'd stake my life on my judgement: your youngest daughter does not love you least, and people who speak quietly are not empty-hearted. It's the hollow things that make the loudest echo."]], "55": [[0, 6, "Listen to me, you traitor! On your oath of loyalty, listen! Since you have tried to make me break my word, which I have never dared to do, and with arrogant pride have tried to come between my sentence and my power to enforce it, which neither my nature nor my position can tolerate, here is your reward, as my power proves itself."], [7, 13, "I give you five days to gather supplies to protect you from the hardships of the world, and on the sixth you will turn your hated back on my kingdom. If on the tenth day after that your banished body is found in my lands, you die that moment. Go! By Jupiter, this will not be taken back."]], "56": [[0, 3, "Goodbye, king. Since this is how you behave, freedom lives elsewhere and banishment is here. [To Cordelia] May the gods protect you, girl, for you think justly and have spoken rightly."], [4, 8, "[To Regan and Goneril] And may your grand speeches be proved by your actions, so that good things come from your words of love. So Kent says goodbye to you all, princes. He'll keep up his old ways in a new country."]], "75": [[0, 3, "Fairest Cordelia, you are richest because you are poor, most precious because you are rejected, and most loved because you are despised! I take you and your virtues here and now. Let it be lawful to pick up what has been thrown away."], [4, 11, "Gods, gods! It's strange that their coldest neglect should set my love on fire with burning respect. Your daughter without a dowry, king, thrown to me by chance, is queen of me, of all I have, and of fair France. All the dukes of watery Burgundy could not buy this priceless girl from me. Say goodbye to them, Cordelia, unkind as they are. You lose this place, but you'll find a better one."]], "97": [[0, 5, "You, Nature, are my goddess. I serve your law, not man's. Why should I suffer under the plague of custom and let the fussy laws of society cut me out, just because I was born twelve or fourteen months after my brother? Why 'bastard'? Why 'base'?"], [6, 9, "My body is as well made, my mind as noble, my looks as true as any honest wife's child. Why do they brand us with 'base', 'baseness', 'bastardy'? Base, base?"], [10, 17, "We, conceived in the lusty secrecy of nature, get more energy and fierce spirit than a whole tribe of idiots made in a dull, stale, tired marriage bed, half asleep. Well then, legitimate Edgar, I must have your land. Our father loves the bastard Edmund as much as the legitimate son. Fine word, 'legitimate'!"], [18, 21, "Well, my legitimate brother, if this letter works and my plan succeeds, Edmund the base will top the legitimate. I grow, I prosper. Now, gods, stand up for bastards!"]], "112": [[0, 8, "[Reads] 'This custom of respecting the old makes life bitter for us in our best years, and keeps our inheritance from us until we're too old to enjoy it. I am starting to find it a useless and foolish slavery to be oppressed by old men's tyranny, which rules not because it has power but because we put up with it. Come to me, so I can tell you more. If our father would sleep until I woke him, you would have half his income for ever and be the beloved of your brother, Edgar."], [9, 11, "Hmm! A conspiracy? 'Sleep until I woke him... you would have half his income. My son Edgar! Did he have the hand to write this? A heart and brain to think it up? When did you get this? Who brought it?"]], "275": [[0, 3, "This pretended amazement, sir, is just like your other recent tricks. Please understand what I mean properly. As you are old and respected, you should be wise."], [4, 12, "You keep a hundred knights and squires here, men so disorderly, debauched and bold that our court, infected by their behaviour, looks like a rowdy inn. Gluttony and lust make it more like a tavern or a brothel than an elegant palace. The shame itself calls for an immediate remedy. So be asked, by someone who will otherwise take what she asks for, to reduce your followers a little…"], [13, 15, "…and let those who remain be men suited to your age, who know their place and yours."]], "281": [[0, 5, "[To Goneril] Hateful vulture, you lie! My followers are excellent men of rare quality, who know every detail of their duty and take the greatest care to live up to their good names. Oh, Cordelia's tiny fault, how ugly you looked in her!"], [6, 10, "Like a crowbar, it wrenched my natural feeling out of its fixed place, drained all the love from my heart and replaced it with bitterness. Oh Lear, Lear, Lear! Beat at this door that let your folly in [striking his head] and your precious judgement out! Go, go, my people."]], "283": [[0, 4, "That may be so, my lord. Hear, Nature, hear! Dear goddess, hear! Abandon your plan if you meant to make this creature fertile! Make her womb sterile!"], [5, 9, "Dry up the organs that make children, and from her degraded body let no baby ever be born to honour her! If she must give birth, make her child out of malice, so that it lives to be a perverse, unnatural torment to her!"], [10, 15, "Let it stamp wrinkles on her young forehead and wear channels in her cheeks with falling tears. Let it turn all her motherly pains and kindness into laughter and contempt, so that she may feel how much sharper than a serpent's tooth it is to have an ungrateful child! Away, away!"]], "290": [[0, 3, "I'll tell you. Life and death! [To Goneril] I'm ashamed that you have the power to shake my manhood like this, that these hot tears, which burst out of me against my will, should make you seem worth crying over. Storms and fogs on you!"], [4, 8, "May the deep, incurable wounds of a father's curse pierce every sense you have! Foolish old eyes, if you weep over this again, I'll pluck you out and throw you, with the water you shed, to soften clay."], [9, 14, "Ha! So be it. I have another daughter who I'm sure is kind and comforting. When she hears about you, she'll claw your wolfish face with her nails. You'll find that I'll take back the power you think I've given up for ever."]], "440": [[0, 9, "That a slave like this should wear a sword when he has no honesty. Smiling rogues like him, like rats, often bite through the holy bonds that are too tight to untie. They flatter every passion that rebels in their masters' natures, bring oil to their fire and snow to their colder moods. They deny, agree and turn their beaks like a weathervane bird with every change in their masters' moods, knowing nothing, like dogs, except how to follow. A plague on your twitching face!"], [10, 12, "Are you smirking at my speeches as if I were a fool? You goose, if I had you on Salisbury Plain, I'd chase you cackling all the way home to Camelot."]], "448": [[0, 4, "This is some fellow who, having been praised for his bluntness, puts on a cheeky roughness and twists his manner away from his true nature. He can't flatter, not he! An honest, plain mind, he must speak the truth!"], [5, 9, "If they'll take it, fine. If not, he's just plain. I know rogues like this, who hide more cunning and more corrupt aims in their plainness than twenty silly, bowing servants who carry out their duties with fussy care."]], "473": [[0, 2, "Good King, you're proving the old saying true: you are going from heaven's blessing out into the hot sun!"], [3, 13, "Come up, you sun, beacon to this world below, so that by your comforting rays I can read this letter. Almost nobody sees miracles except the miserable. I know it's from Cordelia, who has very luckily been told of my disguise, and who will find a chance to fix this monstrous situation and put right what has gone wrong. Weary and exhausted, heavy eyes, take the chance not to look at this shameful lodging. Fortune, good night. Smile once more and turn your wheel!"]], "477": [[0, 8, "I heard myself declared an outlaw, and escaped the hunt by hiding in a lucky hollow tree. No port is open, and there's no place without guards and unusually close watch waiting to catch me. While I can escape, I'll save myself. I've decided to take on the lowest and poorest appearance that poverty ever brought close to an animal in contempt of man. I'll smear my face with filth…"], [9, 15, "…wear only a blanket round my waist, tangle all my hair into knots, and with my body bare I'll face the winds and storms of the sky. The countryside gives me the example of Bedlam beggars, madmen who with roaring voices stick pins, wooden skewers, nails and sprigs of rosemary into their numb, deadened bare arms…"], [16, 20, "…and with this horrible sight, sometimes with mad curses, sometimes with prayers, force charity out of poor farms, wretched villages, sheepfolds and mills. Poor Turlygod! Poor Tom! That's something at least. As Edgar, I am nothing."]], "498": [[0, 5, "My lord, when I delivered your highness's letters to them at their home, before I'd even got up from kneeling to show my duty, a sweating messenger arrived, steaming from his hurry, half out of breath, gasping out greetings from his mistress Goneril."], [6, 10, "He handed over letters, interrupting me, which they read at once. Because of what they said, they called their servants together and got straight on their horses. They ordered me to follow and wait until they had time to answer, and ga
