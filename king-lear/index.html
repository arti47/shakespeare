ve me cold looks."], [11, 18, "Then, meeting the other messenger here, whose welcome I could see had poisoned mine, and who was the very fellow who recently behaved so insolently to your highness, I had more courage than sense and drew my sword. He woke the house with loud, cowardly screams. Your son-in-law and daughter thought this offence deserved the shame it's suffering here."]], "499": [[0, 4, "Winter isn't over yet if the wild geese are flying that way. Fathers who wear rags make their children blind, but fathers who carry money bags will see their children kind."], [5, 8, "Fortune, that total whore, never opens the door to the poor. But for all this, you'll have as many sorrows from your daughters as you can count in a year."]], "508": [[0, 6, "We'll send you to school with an ant, to teach you there's no work in winter. Everyone who follows his nose is led by his eyes, except blind men, and there isn't one nose in twenty that can't smell a man who stinks of bad luck. Let go when a great wheel is running downhill, in case it breaks your neck as you follow it. But when a great man is going up the hill, let him pull you up after him."], [7, 12, "When a wise man gives you better advice, give me mine back. I'd want only rogues to follow it, since a fool gives it. The man who serves for profit and follows only for show will pack up when it starts to rain and leave you in the storm."], [13, 16, "But I will wait, the Fool will stay, and let the wise man run away. The rogue who runs away turns out the fool; the fool, by God, is no rogue."]], "562": [[0, 4, "Go back to her, with fifty men dismissed? No, I'd rather give up all roofs and choose to fight against the hostile weather, and be the companion of the wolf and the owl. Need's sharp pinch! Go back with her?"], [5, 11, "Why, I could just as easily be brought to kneel at the throne of that hot-blooded King of France, who took my youngest without a dowry, and beg like a servant for an allowance to keep my miserable life going. Go back with her? Rather persuade me to be a slave and a packhorse to this hateful servant. [He points at Oswald.]"]], "577": [[0, 7, "Oh, don't argue about need! Our lowest beggars have something more than they need, even if it's the poorest thing. If you don't allow human nature more than it needs, a man's life is as cheap as an animal's. You are a lady. If being warm were all it took to be gorgeous, nature wouldn't need the gorgeous clothes you wear, which hardly keep you warm. But as for true need... You heavens, give me patience, patience is what I need!"], [8, 9, "You see me here, you gods, a poor old man, as full of grief as of years, wretched in both!"], [10, 22, "If it's you who stir these daughters' hearts against their father, don't make me such a fool as to take it meekly. Fill me with noble anger, and don't let women's weapons, tears, stain my man's cheeks! No, you unnatural witches, I'll have such revenge on you both that the whole world will... I will do such things... What they are I don't know yet, but they'll be the terror of the earth. You think I'll weep. No, I won't weep. I have every reason to weep, but this heart will break into a hundred thousand pieces before I weep. Oh Fool, I'll go mad!"]], "600": [[0, 7, "Fighting with the furious elements. He orders the wind to blow the land into the sea, or to raise the curling waves above the mainland, so that everything might change or end. He tears his white hair, which the violent gusts, in their blind rage, catch up and toss about like nothing. In his little human world he tries to outdo the wind and rain beating back and forth."], [8, 11, "On this night, when even the bear with her cubs sucked dry would stay in her den, and the lion and the starving wolf keep their fur dry, he runs about with no hat and dares whatever will to take everything."]], "603": [[0, 4, "Sir, I know you, and on the strength of what I've observed of you I dare to trust you with something important. There is a split, though so far both sides are hiding it with cunning, between Albany and Cornwall."], [5, 9, "Like everyone whose lucky stars have raised them high, they have servants who seem loyal but are really spies for France, sending information about our state: whether about the dukes' quarrels and plots…"], [10, 17, "…or the harsh treatment both have given the kind old King, or something deeper, of which these are perhaps just the outward signs. But it's true that an army is coming from France into this divided kingdom. Taking advantage of our carelessness, they have already secretly landed at some of our best ports and are about to show their flag openly. Now, as for you:"], [18, 25, "…if you trust me enough to hurry to Dover, you'll find someone who will thank you for giving an accurate report of the unnatural, maddening sorrow the King has reason to complain of. I'm a gentleman of good family and upbringing, and I offer you this task because I know and trust you."]], "611": [[0, 2, "Blow, winds, and crack your cheeks! Rage! Blow! You waterspouts and hurricanes, pour down until you have drowned our church spires and the weathercocks on top!"], [3, 8, "You sulphurous lightning, quick as thought, forerunners of the thunderbolts that split oak trees, singe my white head! And you, thunder that shakes everything, strike the round, solid world flat! Crack the moulds nature makes things in, spill all the seeds at once that make ungrateful man!"]], "614": [[0, 4, "A man with a house to put his head in has a good helmet. The man who houses his penis before he has a house for his head will end up lousy, both of them; that's how beggars get married."], [5, 10, "The man who treats his toe as he should treat his heart will cry out with the pain of a corn and lose his sleep. For there was never yet a pretty woman who didn't make faces in a mirror."]], "644": [[0, 8, "You think it's a big thing that this violent storm soaks us to the skin. So it is to you. But where a greater illness has taken hold, the lesser one is hardly felt. You'd run from a bear, but if your escape led towards the raging sea, you'd turn and face the bear's mouth. When the mind is free of trouble, the body is sensitive. The storm in my mind takes away all feeling from my senses except what beats there. Children's ingratitude!"], [9, 16, "Isn't it as if this mouth should tear this hand for lifting food to it? But I'll punish them fully. No, I won't weep any more. To shut me out on a night like this! Pour on, I'll endure it. On a night like this! Oh Regan, Goneril! Your kind old father, whose generous heart gave you everything... Oh, that way madness lies. Let me avoid that. No more of that."]], "669": [[0, 7, "A servant, proud in heart and mind. I curled my hair, wore my mistress's gloves in my cap, satisfied my mistress's lust and did the act of darkness with her. I swore as many oaths as I spoke words and broke them in the sweet face of heaven. I fell asleep plotting lust and woke up to do it. I loved wine deeply and dice dearly, and had more women than the Sultan of Turkey. I was false-hearted, ready to believe gossip, quick to kill; a hog in laziness, a fox in sneakiness, a wolf in greed, a dog in madness, a lion in hunting prey."], [8, 12, "Don't let the creak of shoes or the rustle of silk dresses betray your poor heart to a woman. Keep your foot out of brothels, your hand out of petticoats, your name out of moneylenders' books, and defy the foul devil. Still the cold wind blows through the hawthorn, saying suum, mun, nonny. Dolphin, my boy, my boy, stop! Let him trot by."]], "673": [[0, 3, "This is the foul devil Flibbertigibbet. He starts at curfew and walks until the first cock crows. He gives people cataracts in the eye, makes them squint, gives them harelips, rots the white wheat with mildew and hurts the poor creatures of the earth."], [4, 8, "Saint Withold walked over the hill three times. He met the nightmare demon and her nine imps, told her to get off the sleeper and promise to do no harm, and be gone, witch, be gone!"]], "747": [[0, 8, "Tom will throw his head at them. Get away, you dogs! Whether your mouth is black or white, with a tooth that poisons when it bites, mastiff, greyhound, grim mongrel, hound or spaniel, bitch or bloodhound, short-tailed cur or curly-tailed, Tom will make them weep and wail. For when I throw my head like this, the dogs jump over the gate and all run away."], [9, 10, "Do de, de, de. Stop! Come, march to festivals, fairs and market towns. Poor Tom, your drinking horn is dry."]], "759": [[0, 5, "When we see our superiors suffering our sorrows, we hardly think of our own misery as our enemy. Someone who suffers alone suffers most in his mind, leaving freedom and happy sights behind. But the mind skips over much of its suffering when grief has companions and pain is shared."], [6, 13, "How light and bearable my pain seems now, when what makes me bend makes the King bow down: he has his children, as I have my father! Tom, go! Pay attention to the great events, and reveal yourself when the false opinion whose mistaken thought dishonours you calls you back and makes peace with you once you've been proved innocent. Whatever else happens tonight, may the King escape safely! Hide, hide."]], "804": [[0, 6, "Because I didn't want to see your cruel nails pluck out his poor old eyes, or your fierce sister stick her boar's tusks into his holy, anointed flesh. The sea, in a storm like the one his bare head endured on this hell-black night, would have risen up and put out the stars. Yet, poor old heart, he added his tears to the rain."], [7, 10, "If wolves had howled at your gate in that dreadful time, you should have said, 'Good porter, unlock the door. Every other cruel creature would have given way. But I will see heaven's winged vengeance catch up with children like these."]], "870": [[0, 4, "[To Edmund] Then you won't go any further. It's the cowardly fear in his spirit that doesn't dare take action. He'll ignore insults that would force him to respond. What we wished for on the way here may come true. Go back, Edmund, to my brother-in-law."], [5, 10, "Hurry his gathering of troops and lead his army. I must swap weapons at home and give my husband the spinning distaff. This trustworthy servant will carry messages between us. Before long you're likely to hear, if you dare to act for your own advantage, a command from your mistress."], [11, 14, "[She gives him a token.] Wear this. Don't speak. Bend your head. This kiss, if it dared to speak, would lift your spirits up into the sky. Understand me, and goodbye."]], "880": [[0, 5, "Wisdom and goodness seem vile to the vile. Filth likes only the taste of itself. What have you done? Tigers, not daughters, what have you done? A father, a gracious old man whose dignity even a bear dragged by its head would lick, you most barbarous, most degenerate women have driven mad."], [6, 12, "Could my good brother-in-law let you do it? A man, a prince, who owed him so much! If the heavens don't send their spirits down in visible form, quickly, to tame these vile crimes, it will come to this: humanity will be forced to prey on itself, like monsters of the deep."]], "881": [[0, 5, "Coward with milk for a liver! You turn your cheek to be hit and your head to be wronged. You haven't got eyes in your head to tell what's honourable from what should be put up with. You don't know that only fools pity villains who are punished before they've done their crime. Where's your drum?"], [6, 9, "The King of France spreads his banners in our silent land, and in his plumed helmet your killer starts threatening, while you, a moralising fool, sit still and cry, 'Oh dear, why does he do this?'"]], "929": [[0, 7, "Oh dear, it's him. He was seen just now, as mad as the stormy sea, singing loudly, crowned with stinking fumitory and field weeds, with burdock, hemlock, nettles, cuckoo-flowers, darnel and all the useless weeds that grow among the corn that feeds us. Send out a hundred soldiers. Search every acre of the high-grown fields and bring him to me. [An officer leaves."], [8, 10, "What can human knowledge do to restore his lost mind? Whoever helps him can take all my worldly wealth."]], "954": [[0, 4, "I know what I'm saying. You are. I know it. So I advise you, take note of this. My husband is dead. Edmund and I have talked, and he's more suitable to marry me than your lady. You can work out the rest."], [5, 10, "If you find him, please give him this. And when you tell your mistress all this, please tell her to come to her senses. So, goodbye. If you happen to hear of that blind traitor, promotion awaits the man who kills him."]], "969": [[0, 4, "Come on, sir, here's the place. Stand still. How frightening and dizzying it is to look so far down! The crows and jackdaws flying halfway down hardly look as big as beetles. Halfway down hangs a man gathering samphire. What a dreadful job!"], [5, 13, "He seems no bigger than his head. The fishermen walking on the beach look like mice, and that tall ship at anchor over there has shrunk to the size of her little rowing boat, and her rowing boat to a buoy almost too small to see. The murmuring waves that rub against the countless pebbles can't be heard from this high up. I won't look any more, in case my brain spins and my failing sight sends me toppling headfirst."]], "1003": [[0, 6, "Yes, every inch a king. When I stare, see how my subject trembles. I pardon that man's life. What was your crime? Adultery? You won't die. Die for adultery? No. The wren does it, and the little golden fly has sex right in front of me."], [7, 9, "Let copulation flourish, for Gloster's bastard son was kinder to his father than my daughters, conceived between lawful sheets."], [10, 16, "Go to it, lust, all together, for I need soldiers. Look at that simpering lady over there, whose face suggests she's frigid between her legs, who acts the virtuous woman and shakes her head at the very mention of pleasure. The polecat and the well-fed horse don't go at it with a wilder appetite."], [17, 24, "From the waist down they are centaurs, though they're women above. The gods own them down to the belt; below is all the devil's. There's hell, there's darkness, there's the sulphurous pit, burning, scalding, stink, disease. Shame, shame, shame! Ugh, ugh! Give me an ounce of perfume, good chemist, to sweeten my imagination. There's money for you."]], "1016": [[0, 5, "And the poor man run from the dog? There you could see the great image of authority: even a dog is obeyed when it holds office. You rascal of a constable, stop your bloody hand! Why are you whipping that whore? Strip your own back. You burn with lust to use her in the very way you're whipping her for. The moneylender hangs the cheat."], [6, 9, "Small sins show through ragged clothes. Robes and fur gowns hide everything. Cover sin in gold plate and the strong lance of justice breaks harmlessly against it. Dress it in rags and a pygmy's straw can pierce it."], [10, 15, "Nobody does wrong, nobody, I say nobody. I'll vouch for them. Take that from me, my friend, who has the power to seal the accuser's lips. Get yourself glass eyes, and, like a vile politician, pretend to see the things you don't. Now, now, now, now. Pull off my boots. Harder, harder. That's it."]], "1061": [[0, 6, "Sit down, father. Rest. Let's look in these pockets. The letters he talks about may help me. He's dead. I'm only sorry he had no other executioner. Let's see. Excuse me, gentle seal, and, good manners, don't blame us. To know our enemies' minds we'd tear out their hearts. Opening their letters is more lawful."], [7, 14, "[He reads] 'Remember the vows we made to each other. You have many chances to kill him. If you have the will, time and place will be offered generously. Nothing will have been done if he comes back the winner. Then I'll be the prisoner and his bed my jail. Rescue me from its hateful warmth, and take his place as your reward. Your (wife, I wish I could say) loving servant, Goneril."], [15, 22, "Oh, the boundless range of a woman's lust! A plot against her good husband's life, and my brother to replace him! Here in the sand I'll bury you, unholy messenger of murderous lovers. And when the time is right, I'll show this wicked letter to the Duke whose death was plotted. It's lucky for him that I can tell him of your death and your errand."]], "1085": [[0, 3, "Even if you hadn't been their father, these white hairs should have moved them to pity. Was this a face to be set against the warring winds?"], [4, 12, "To stand against the deep, terrible thunderbolts, in the most terrible and rapid strokes of zigzag lightning? To keep watch, like a poor lost sentry, with this thin covering of hair for a helmet? My enemy's dog, even if it had bitten me, should have stood by my fire that night. And were you forced, poor father, to shelter with pigs and lost wretches in short, musty straw? Oh dear, oh dear! It's a wonder your life and your wits didn't end together. He's waking. Speak to him."]], "1095": [[0, 4, "Please don't make fun of me. I'm a very foolish, silly old man, over eighty, not an hour more or less, and to be honest, I'm afraid I'm not in my right mind."], [5, 11, "I think I should know you, and know this man, but I'm not sure, because I've no idea what place this is, and no matter how hard I try I can't remember these clothes, or where I slept last night. Don't laugh at me, for as surely as I'm a man, I think this lady is my child Cordelia."]], "1154": [[0, 2, "I've sworn my love to both these sisters. Each is suspicious of the other, as people who've been stung are of the snake. Which of them shall I take?"], [3, 14, "Both? One? Neither? Neither can be enjoyed if both are still alive. Taking the widow will enrage and madden her sister Goneril, and I'll hardly be able to win my side of the game while her husband is alive. So for now we'll use his authority for the battle. When that's over, let her who wants to be rid of him think up a way to get rid of him quickly. As for the mercy he intends to show Lear and Cordelia, once the battle is over and they're in our power, they'll never see his pardon. My position depends on me defending it, not debating it."]], "1226": [[0, 2, "Draw your sword, so that if my words offend a noble heart, your arm can win you justice. Here is mine."], [3, 15, "Look, it is my right as a knight, by my oath and my profession, to declare this: in spite of your strength, youth, position and high rank, in spite of your victorious sword and brand-new fortune, your courage and your spirit, you are a traitor. False to your gods, your brother and your father, a conspirator against this noble and illustrious prince, and from the very top of your head to the dust beneath your feet, a traitor spotted with venom like a toad. If you say 'No', this sword, this arm and all my courage are ready to prove on your heart, which I'm speaking to, that you lie."]], "1244": [[0, 3, "By looking after him, my lord. Listen to a short story, and when it's told, oh, I wish my heart would burst! To escape the bloody proclamation that hunted me so closely (oh, how sweet life is…"], [4, 10, "…that we'd rather suffer the pain of death every hour than die all at once!) I learned to change into a madman's rags and take on an appearance that even dogs despised. In this disguise I met my father with his bleeding eye sockets, which had just lost their precious stones. I became his guide, led him, begged for him, saved him from despair."], [11, 18, "I never, oh, what a mistake, revealed myself to him until about half an hour ago, when I was armed. Not sure, though hoping, that this would succeed, I asked his blessing, and told him the story of my journey from beginning to end. But his cracked heart, oh dear, too weak to bear the struggle between the two extremes of joy and grief, burst smiling."]], "1247": [[0, 3, "This would have seemed the limit to people who don't love sorrow. But one more sorrow, adding too much, would make it much greater and go beyond the extreme."], [4, 9, "While I was crying out loud in grief, a man came who had seen me at my lowest and avoided my hateful company. But then, finding out who it was who had suffered so much, he threw his strong arms round my neck and roared as if he would burst the sky. He threw himself on my father's body…"], [10, 14, "…and told the most pitiful story about Lear and himself that anyone ever heard. As he told it, his grief grew overwhelming, and the strings of his heart began to crack. Then the trumpets sounded twice, and there I left him unconscious."]], "1305": [[0, 1, "That's only a trifle here. You lords and noble friends, know what I intend."], [2, 10, "Whatever comfort can be given to this great ruined man will be given. As for me, I'll hand back my absolute power to this old king for the rest of his life. [To Edgar and Kent] You will have your rights restored, with extra honours, more than your noble deeds deserve. All friends will taste the rewards of their virtue, and all enemies the cup of what they deserve. Oh, look, look!"]], "39": [[0, 4, "So be it. Let your honesty be your dowry. For by the sacred light of the sun, by the mysteries of Hecate and the night, by all the stars and planets that make us live and die…"], [5, 12, "I here renounce all my care as a father, all kinship and shared blood, and from now on I will treat you as a stranger to my heart and to me for ever. The savage Scythian, or the cannibal who eats his own children, will be as welcome, pitied and helped by me as you, who were once my daughter."]], "67": [[0, 2, "This is very strange. Just a moment ago she was your favourite, the subject of your praise, the comfort of your old age…"], [3, 10, "…the best and dearest. Can she in a moment have done something so monstrous as to strip off so many layers of your favour? Surely her offence must be so unnatural that it is monstrous, or else the love you used to declare has gone bad. To believe that of her would need a faith that reason could never give me without a miracle."]], "68": [[0, 6, "I still beg your majesty, since I lack that smooth and slippery skill of saying things I don't mean (for what I really intend, I do before I talk about it), that you make it clear it was no wicked stain, murder or foul deed, no unchaste act or dishonourable step, that has robbed me of your grace and favour."], [7, 10, "It was only because I lack the very things that make me richer for lacking them: an eye always begging for favours, and a tongue I'm glad not to have, even though not having it has cost me your love."]], "128": [[0, 2, "These recent eclipses of the sun and moon mean no good for us. Though science can explain them this way and that, nature still suffers the effects that follow. Love cools…"], [3, 12, "…friendships end, brothers fall out. In cities there are riots, in the countryside quarrels, in palaces treason, and the bond between son and father is broken. This villain of mine fits the prediction: there's son against father. The King goes against his own nature: there's father against child. We have seen the best of our times. Plots, hypocrisy, treachery and every kind of destructive disorder follow us restlessly to our graves. Find this villain, Edmund. You won't lose by it. Do it carefully. And noble, true-hearted Kent banished! His crime, honesty! It's strange."]], "130": [[0, 4, "This is the wonderful stupidity of the world: when things go badly for us, often because of our own excesses, we blame our disasters on the sun, the moon and the stars, as if we were villains by necessity, fools because heaven forced us, rogues, thieves and traitors because of the planets…"], [5, 12, "…drunks, liars and adulterers because we had to obey the stars, and evil in everything because a god pushed us. What a marvellous excuse for lecherous man, to blame his goatish lust on a star! My father slept with my mother under the Dragon's Tail, and I was born under the Great Bear, so it follows that I'm rough and lustful. Rubbish! I'd have been what I am if the most virginal star in the sky had twinkled on my illegitimate conception."]], "239": [[0, 6, "Listen, uncle: Have more than you show, say less than you know, lend less than you own, ride more than you walk, don't believe everything you hear, don't bet everything on one throw…"], [7, 10, "…give up drink and whores and stay indoors, and you'll end up with more than twenty to the score."]], "265": [[0, 6, "Sir, it's not only this Fool of yours, who's allowed to say anything, but others of your insolent followers too, who every hour complain and quarrel, breaking out into gross and unbearable riots. Sir, I thought that by telling you about this I'd get it safely put right. But now I'm starting to fear, from what you yourself have recently said and done…"], [7, 13, "…that you protect this behaviour and encourage it by allowing it. If you do, the fault won't escape blame, and the remedies won't be delayed. Those remedies, taken out of concern for the good of the state, might offend you, which would normally be shameful, but necessity will then call them sensible action."]], "373": [[0, 8, "...persuade me to murder your lordship. I told him the avenging gods aim all their thunder at those who kill their fathers, and spoke of how many strong bonds tie a child to his father. Sir, in short, when he saw how much I hated his unnatural plan, he lunged fiercely with his drawn sword at my unprotected body and cut my arm."], [9, 12, "But when he saw my courage roused, confident that I was in the right and ready to fight, or perhaps scared by the noise I made, he suddenly ran away."]], "375": [[0, 9, "When I tried to talk him out of it and found him set on doing it, I threatened angrily to expose him. He answered, 'You penniless bastard! Do you think that if I stood against you, anyone would believe your word because they trusted your virtue or worth? No. I'd deny it all, as I'd deny this, even if you showed my own handwriting. I'd turn it all back on you as your scheming, your plot and your damned trickery."], [10, 13, "You'd have to think the world very stupid if they didn't believe that the profits you'd get from my death were obvious, powerful reasons for you to want it.'"]], "453": [[0, 2, "I never did. The King his master recently decided to hit me because he misunderstood me."], [3, 9, "Then this man, siding with him and flattering his anger, tripped me from behind. When I was down, he insulted me, abused me and made himself out such a hero that he won praise from the King for attacking a man who didn't fight back. Thrilled by this terrible exploit, he drew his sword on me again here."]], "518": [[0, 4, "The King wants to speak with Cornwall. The dear father wants to speak with his daughter, and commands her service. Have they been told this? My breath and blood! Fiery? The fiery Duke? Tell the hot Duke that... No, not yet. Maybe he isn't well."], [5, 11, "Illness always makes us neglect the duties we are bound to when healthy. We aren't ourselves when nature, overpowered, forces the mind to suffer along with the body. I'll be patient. I'm angry with my own hastier impulse for taking a sick man's fit as the act of a healthy one. Damn my royal state! Why..."]], "544": [[0, 5, "No, Regan, you will never have my curse. Your gentle nature will never let you be harsh. Her eyes are fierce, but yours comfort and don't burn. It's not in you to resent my pleasures, cut down my followers, trade hasty words, reduce my allowance…"], [6, 11, "…and, finally, bolt the door against my coming in. You know better the duties of nature, the bonds of a child, the obligations of courtesy and the debts of gratitude. You haven't forgotten the half of the kingdom I gave you."]], "564": [[0, 7, "Please, daughter, don't drive me mad. I won't trouble you, my child. Goodbye. We'll never meet again, never see each other again. But you are still my flesh, my blood, my daughter. Or rather a disease in my flesh that I have to call mine. You are a boil, a plague sore, a swollen tumour in my diseased blood. But I won't scold you."], [8, 13, "Let shame come when it will, I won't call for it. I won't ask Jupiter, the thunder-bearer, to strike you, or tell tales about you to him, the highest judge. Improve when you can. Become better in your own time. I can be patient. I can stay with Regan, I and my hundred knights."]], "613": [[0, 3, "Rumble all you like! Spit, fire! Pour, rain! Rain, wind, thunder and fire are not my daughters. I don't accuse you elements of unkindness. I never gave you a kingdom or called you my children."], [4, 10, "You owe me no obedience. So let your horrible will fall on me. Here I stand, your slave, a poor, sick, weak and despised old man. And yet I call you slavish servants, who have joined with two wicked daughters to throw your armies from the heavens against a head as old and white as this! Oh! Oh! It's foul!"]], "620": [[0, 4, "Let the great gods who keep up this dreadful uproar over our heads find their enemies now. Tremble, you wretch, who have secret crimes inside you that justice hasn't whipped! Hide, you bloody hand…"], [5, 11, "…you liar who breaks his oath, you pretender to virtue who commits incest! Shake to pieces, you villain, who under a secret, convenient disguise have plotted against men's lives! Close-hidden sins, burst out of what hides you, and beg mercy from these terrible officers of justice. I am a man more sinned against than sinning."]], "627": [[0, 7, "This is a fine night to cool down a prostitute. I'll make a prophecy before I go. When priests talk more than they practise, when brewers spoil their malt with water, when nobles teach their tailors fashion, when no heretics are burned, only lovers burning with disease; when every law case is fair, no squire is in debt and no knight is poor;"], [8, 16, "…when slander doesn't live on people's tongues, and pickpockets don't come into crowds; when moneylenders count their gold in the open, and pimps and whores build churches: then the kingdom of Britain will fall into great confusion. Then the time will come, for anyone who lives to see it, when feet will be used for walking. Merlin will make this prophecy, for I live before his time."]], "679": [[0, 3, "Poor Tom, who eats the swimming frog, the toad, the tadpole, the wall lizard and the water newt. In the fury of his heart, when the foul devil rages, he eats cow dung as salad, swallows old rats and dead dogs from ditches, and drinks the green scum on stagnant ponds."], [4, 9, "He's whipped from parish to parish, put in the stocks, punished and imprisoned. He used to have three suits for his back, six shirts for his body, a horse to ride and a sword to wear. But mice and rats and such small animals have been Tom's food for seven long years. Beware of the devil who follows me. Quiet, Smulkin! Quiet, you devil!"]], "755": [[0, 4, "Good friend, please, pick him up in your arms. I've overheard a plot to kill him. There's a stretcher ready. Lay him in it and drive towards Dover, friend, where you'll find both welcome and protection. Pick up your master."], [5, 9, "If you delay half an hour, his life, and yours, and the life of anyone who tries to defend him, will certainly be lost. Pick him up, pick him up, and follow me, and I'll quickly take you to some supplies."]], "1172": [[0, 6, "No, no, no, no! Come, let's go to prison. We two alone will sing like birds in a cage. When you ask me for a blessing, I'll kneel down and ask you for forgiveness. So we'll live, and pray, and sing, and tell old stories, and laugh at the courtiers in their gilded clothes like butterflies, and hear poor wretches talk about court news. And we'll talk with them too…"], [7, 11, "…about who's losing and who's winning, who's in favour and who's out, and take on ourselves the mystery of things, as if we were God's spies. And in a walled prison we'll outlast the gangs and factions of great people, who rise and fall like the tides with the moon."]], "1183": [[0, 6, "Sir, I thought it right to send the old and miserable King to be kept under a chosen guard. His age has a power, and his title even more, to win the hearts of the common people to his side and turn the lances of the soldiers we've conscripted against our own eyes, though we command them. I sent the Queen with him…"], [7, 14, "…for the same reason. They'll be ready tomorrow, or later, to appear wherever you hold your trial. At this moment we are sweating and bleeding. Friends have lost friends, and even the best causes, in the heat of the moment, are cursed by those who feel their sharpness. The question of Cordelia and her father needs a more suitable place."]], "1227": [[0, 4, "Wisdom says I should ask your name. But since you look so fine and warlike, and your speech shows some sign of good breeding, I scorn and reject the delay I could safely and properly claim under the rules of knighthood."], [5, 9, "I throw those accusations of treason back at your head, and crush your heart with the hellish lie. Since they only glance off and hardly bruise, this sword of mine will open a way for them straight into your heart, where they'll stay for ever. Trumpets, sound!"]]};

her parents should hand over property before death. Advice books warned fathers not to give everything to their children while still alive."], ["Bedlam beggars", "Bethlehem Hospital in London housed the insane. Released inmates, real or pretended, wandered as beggars. Edgar's 'Poor Tom' would have been a familiar sight."], ["The Fool", "Licensed fools could say what others dared not. Lear's Fool tells him the truth through jokes, songs and riddles. He vanishes after Act 3; the part may have been doubled with Cordelia."], ["Two versions", "The play survives in a Quarto (1608) and the First Folio (1623), with hundreds of differences. The Folio cuts the mock trial, for example. Most editions, like this one, combine both."], ["The happy ending", "From 1681 to 1838 the stage used Nahum Tate's version, in which Cordelia lives and marries Edgar. Samuel Johnson found the real ending almost too painful to reread."]], "critics": {"suffering": [["A. C. Bradley, Shakespearean Tragedy (1904)", "Paraphrased: Lear is redeemed through suffering; he dies in an ecstasy, believing Cordelia lives."], ["Samuel Johnson (1765)", "Paraphrased: so shocked by Cordelia's death that he could not bear to reread the last scenes until editing them."]], "justice": [["Jan Kott, Shakespeare Our Contemporary (1964)", "Paraphrased: an absurdist play, like Beckett; the gods are absent and suffering has no meaning."], ["G. Wilson Knight, The Wheel of Fire (1930)", "Paraphrased: the comedy of the grotesque; human dignity mocked by a cruel universe."]], "nature": [["John F. Danby, Shakespeare's Doctrine of Nature (1949)", "Paraphrased: two meanings of Nature clash: the ordered, kindly nature of Lear and Cordelia, and the ruthless, competitive nature of Edmund."]], "family": [["Coppélia Kahn, 'The Absent Mother in King Lear' (1986)", "Paraphrased: there are no mothers in the play; Lear's crisis is a man's fear of dependence on women."], ["Feminist critics", "Paraphrased: Goneril and Regan are monsters, but their complaints about Lear's knights may be fair; the play's view of women is harsh."]], "power": [["Historicist critics", "Paraphrased: the play explores the dangers of dividing a kingdom, a live issue under King James."]], "madness": [["Charles Lamb (1811)", "Paraphrased: Lear cannot be acted; the storm is in his mind, and any staging shrinks it."]], "betrayal": [["Many critics", "Paraphrased: the villains' alliances are fragile; Goneril, Regan and Edmund destroy each other as surely as they destroy their victims."]], "reconcile": [["A. C. Bradley", "Paraphrased: Lear's reunion with Cordelia shows suffering has purified him; this is the play's redemptive heart."]], "sight": [["Many critics", "Paraphrased: the subplot doubles the main plot. Gloster's physical blinding mirrors Lear's mental blindness."]], "appearance": [["Stanley Cavell, 'The Avoidance of Love' (1969)", "Paraphrased: Lear's tragedy is his fear of being truly seen and loved; he prefers flattery because real love would expose him."]]}, "insults": [{"id": 51, "f": "O vassal! miscreant", "who": "Lear", "n": "To Kent, for telling the truth."}, {"id": 66, "f": "whom nature is asham'd", "who": "Lear", "n": "On his own daughter Cordelia."}, {"id": 216, "f": "you whoreson dog! you slave", "who": "Lear", "n": "To Oswald."}, {"id": 220, "f": "you base football player", "who": "Kent", "n": "To Oswald: football was a rough low-class game."}, {"id": 281, "f": "Detested kite", "who": "Lear", "n": "To Goneril: a kite is a scavenging bird."}, {"id": 276, "f": "Degenerate bastard", "who": "Lear", "n": "To Goneril."}, {"id": 414, "f": "A knave; a rascal; an eater of broken meats", "who": "Kent", "n": "His famous list of insults for Oswald."}, {"id": 436, "f": "Thou whoreson zed", "who": "Kent", "n": "Z was thought an unnecessary letter."}, {"id": 375, "f": "Thou unpossessing bastard", "who": "Edgar (as quoted by Edmund)", "n": "Edmund's invented insult, put in Edgar's mouth."}, {"id": 564, "f": "thou art a boil", "w to Dover", "Gloster goes home"], "a4s6": ["Gloster dies in the fall", "Gloster survives and endures", "Gloster recognises Edgar"], "a4s7": ["Lear rejects Cordelia", "Lear and Cordelia are reconciled", "Lear dies"], "a5s2": ["Cordelia's army wins", "Cordelia's army loses", "There is a truce"], "a5s3": ["Lear and Cordelia are saved", "Cordelia is killed", "Lear escapes to France"]}, "contrast": [{"t": "Cordelia and her sisters", "pts": ["Goneril and Regan flatter with grand words; Cordelia says 'Nothing'.", "The sisters' love is a performance for land; Cordelia's is a bond.", "At the end Cordelia forgives; the sisters destroy each other."], "ids": [22, 32]}, {"t": "Lear and Gloster", "pts": ["Both old fathers misjudge their children.", "Lear goes mad; Gloster is blinded.", "Both are cared for by the child they wronged."], "ids": [31, 838]}, {"t": "Edgar and Edmund", "pts": ["Edgar is trusting and honest; Edmund is cunning and ruthless.", "Edgar falls to 'nothing' and rises; Edmund rises and falls.", "Edgar believes 'The gods are just'; Edmund worships Nature."], "ids": [97, 1239]}, {"t": "Kent and Oswald", "pts": ["Both are servants: Kent loyal and blunt, Oswald fawning and self-serving.", "Kent serves Lear in disguise; Oswald serves Goneril's plots.", "Kent beats Oswald; Edgar kills him."], "ids": [414, 219]}, {"t": "The Fool and Poor Tom", "pts": ["Both speak 'madness' that contains wisdom.", "The Fool is a licensed truth-teller; Tom is feigned madness.", "Both share the storm with Lear and teach him."], "ids": [337, 683]}], "keyfacts": [["Full title", "The Tragedy of King Lear (the 1608 Quarto calls it a 'True Chronicle History')"], ["Written", "About 1605–06; performed at court on 26 December 1606; printed in 1608 (Quarto) and 1623 (Folio)"], ["Genre", "Tragedy, with a double plot: Lear and his daughters, Gloster and his sons"], ["Setting", "Pagan Britain in a legendary past: palaces and castles, then the storm-swept heath, then the coast near Dover"], ["Protagonist", "Lear, an old king who gives away his kingdom but wants to keep the respect owed to a king"], ["Antagonists", "Goneril and Regan, who take his power, and Edmund, who plots against his brother and father"], ["Main conflict", "Lear rewards flattery and banishes honesty; once powerless, he is cast out by the daughters he trusted. In the subplot Gloster makes the same mistake with his sons"], ["Rising action", "Kent and Cordelia banished; Edgar framed; the knights cut down; Kent stocked; Lear shut out in the storm"], ["Climax", "Act III: Lear's madness in the storm, and the blinding of Gloster, the play's moral low point"], ["Falling action", "Dover cliff; Lear and Cordelia reunited; the battle lost; Edmund's alliances collapse"], ["Resolution", "Edgar kills Edmund; Goneril poisons Regan and kills herself; Cordelia is hanged; Lear dies over her body. Albany, Kent and Edgar are left, and Kent will not stay"], ["Main themes", "Justice and the gods; authority and chaos; nature; family and ingratitude; suffering; reconciliation"], ["Motifs", "Sight and blindness; madness and wisdom; nothing; animals; clothes and nakedness; betrayal"], ["Symbols", "The storm; Gloster's eyes; the crown and coronet; Lear's crown of weeds; Fortune's wheel"], ["Foreshadowing", "'Nothing will come of nothing'; Lear's 'O, let me not be mad'; Gloster's list of disasters after the eclipses; the Fool's warnings that Regan will be no kinder"]], "analysis": {"LEAR": ["Lear begins as a king who has never been told no. He stages the love test because he wants public proof of love, and he confuses words with feeling. When Cordelia will not perform, his rage is instant and total. Kent sees the problem: Lear needs to 'see better'.", "His mistake is to think he can give away power and keep its privileges, 'the name, and all the additions to a king'. Goneril and Regan expose how much of his authority was simply power. Each cut to his knights is also a cut to his sense of who he is: 'Who is it that can tell me who I am?'", "The storm breaks him and remakes him. Out on the heath he feels cold and pity for the first time, prays for 'poor naked wretches', and sees in Poor Tom what a human being is without wealth. In his madness at Dover he speaks hard truths about justice and authority that the sane king never saw.", "In the reunion with Cordelia he speaks plainly, kneels, and asks forgiveness. The ending refuses to reward this growth: he dies holding her body, perhaps believing she still breathes. Audiences divide over whether his last moment is despair or a kind of joy."], "CORDELIA": ["Cordelia is honest to the point of stubbornness. She will not compete in flattery, and she reminds Lear that a husband will deserve half her love. Some readers see a little of her father's pride in her refusal to bend.", "She is absent for most of the play, but her goodness is felt through others: France's love, Kent's loyalty, and the Gentleman's description of her tears. She returns with an army, not to conquer but for 'love, dear love'.", "Her forgiveness ('No cause, no cause') is the emotional heart of the play. Her death, after Edmund's reprieve comes too late, is what makes the ending so hard to bear. Her innocence raises the play's biggest question about justice."], "GONERIL": ["Goneril is the boldest of the villains. She acts first, cutting Lear's knights and ordering her servants to neglect him, and she openly scorns her husband as a coward.", "Her complaints about the riotous knights may have some truth, but her methods are cold. As the play goes on, power turns to appetite: she desires Edmund, plots to have Albany killed, and poisons her own sister.", "Exposed by her letter, she leaves and kills herself. Her refusal to answer ('Ask me not what I know') is defiant to the end."], "REGAN": ["Regan seems at first to follow her sister, but she often goes further. She tops Goneril's flattery, demands Kent stay in the stocks all night, and reduces Lear's followers to 'What need one?'", "Her cruelty is most visible in the blinding: she plucks Gloster's beard, kills the servant who defends him, and sends the blind man out to 'smell his way to Dover'.", "Widowed, she competes with Goneril for Edmund and is poisoned by her. The sisters' alliance collapses because they want the same man and the same power."], "EDMUND": ["Edmund is clever, witty and frank with the audience. His soliloquies invite us to enjoy his schemes, and his complaint about being called 'base' has real force in a society that denied bastards any rights.", "He follows 'Nature' in the sense of appetite and self-interest. He frames Edgar, betrays his father, and plays Goneril and Regan against each other, always choosing whatever benefits him.", "At the end, wounded, he takes comfort that he was loved and tries to save Lear and Cordelia, 'despite of mine own nature'. Whether this is real change or too little too late is a good question to debate."], "GLOSTER": ["Gloster opens the play joking about Edmund's conception, which shows a carelessness about the son he wronged by his birth. He believes Edmund's forged letter instantly, mirroring Lear's misjudgement.", "He becomes braver as the play goes on, choosing to help Lear even when forbidden. The price is his eyes. Blinded, he sees the truth about his sons.", "His despair at Dover ('As flies to wanton boys') is answered by Edgar's care. He learns to endure, and dies when his heart bursts between joy and grief at learning who his guide was."], "EDGAR": ["Edgar begins as a trusting, rather passive son who is easily fooled. To survive he becomes Poor Tom, the lowest figure in the play, and his feigned madness shares the stage with Lear's real one.", "He grows through suffering. He cares for his blind father, saves him from suicide with the Dover cliff trick, and kills Oswald. He also speaks many of the play's lessons, such as 'Ripeness is all'.", "He defeats Edmund in single combat and is left to help rule. Some find his moral comments ('The gods are just') too neat for the horrors they explain."], "KENT": ["Kent is loyalty in its purest form. He opposes Lear precisely because he serves him, and accepts banishment rather than stay silent.", "In disguise as Caius, he serves Lear again, beats Oswald, and suffers the stocks. His bluntness is a virtue but also gets him into trouble.", "At the end he reveals himself, but Lear barely recognises him. He refuses to rule and implies he will soon follow his master in death."], "FOOL": ["The Fool is allowed to tell the King the truth, and he does so through riddles, songs and jokes. Almost every jest points at Lear's folly in giving away his kingdom.", "He is loyal and affectionate, following Lear into the storm. His humour grows darker as Lear's mind fails.", "He disappears after Act III with the line 'And I'll go to bed at noon'. Lear's 'my poor fool is hang'd' at the end may refer to Cordelia, but it also reminds us of him."]}, "motifs": [["Sight and blindness", "Kent tells Lear to 'see better'; Gloster says he 'stumbled when I saw'. The two fathers are blind to their children until they lose something: Lear his reason, Gloster his eyes. The play keeps asking what true seeing is.", [6, 31, 34, 44]], ["Madness and wisdom", "The Fool's nonsense carries truth, Edgar's pretended madness hides a sane man, and Lear's real madness lets him say things about justice he never saw as king. 'Reason in madness', as Edgar puts it.", [17, 22, 41, 42]], ["Nothing", "Cordelia's 'Nothing' starts the tragedy. Lear ends with nothing; the Fool calls him a zero; Edgar says 'Edgar I nothing am'. Losing everything is how characters find out what they are.", [3, 15, 19, 54]], ["Animals", "Lear's daughters are serpents, kites, wolves, tigers and pelicans; Albany fears humans will prey on each other like sea monsters. Animal images suggest what humans become without love and law.", [16, 29, 38, 39]], ["Clothes and nakedness", "Rich robes hide sin and rags reveal it. Lear tears off his clothes to be like Poor Tom, and his last words ask for a button to be undone. Clothes stand for the comforts and lies of power.", [29, 41, 60]], ["Betrayal", "Children betray fathers, a brother betrays a brother, wives betray husbands. Betrayers then betray each other, while Kent, the Fool, Edgar and Cordelia show loyalty that costs them.", [9, 32, 57, 58]]], "symbols2": [["The storm", "The storm reflects Lear's inner turmoil and the chaos in the kingdom. It also shows a power far greater than any king's, and it humbles him. Some see it as nature itself raging at the daughters' crimes."], ["Gloster's eyes", "Their loss makes the play's sight imagery horribly real. Only after he is blind does Gloster understand who betrayed him."], ["The divided map and the coronet", "Lear divides Britain on a map and has the crown split between his sons-in-law. Breaking the kingdom into pieces symbolises the breaking of the family and of order."], ["Lear's crown of weeds", "At Dover, mad Lear wears wild flowers and weeds as a crown: a king of nature, not of the court, whose real kingdom is now gone."], ["Fortune's wheel", "Kent asks Fortune to turn her wheel; Edmund says 'the wheel is come full circle'; Lear feels bound on a 'wheel of fire'. Rise and fall are part of the play's shape."]], "bigq": [["Do the gods care what happens to people in this play?", ["The villains all die by the end", "But Cordelia, Gloster and Lear die too", "Gloster: the gods kill us 'for their sport'", "Edgar: 'The gods are just'", "Albany prays 'The gods defend her' just before Cordelia's body arrives"], [35, 50, 53, 54]], ["Is Lear 'more sinned against than sinning'?", ["He stages the love test and believes flattery", "He banishes Cordelia and Kent in rage", "He wants power without its duties", "But his daughters' cruelty far exceeds his faults: 'more sinned against than sinning'"], [0, 3, 5, 24]], ["What does Lear understand at the end that he could not see at the start?", ["The storm teaches him pity for the poor", "Poor Tom shows him 'unaccommodated man'", "He asks Cordelia for forgiveness", "But he dies in grief: is learning enough?"], [27, 29, 46, 54]], ["Is Edmund made a villain by the way society treats him?", ["His case against 'the plague of custom' is real", "His wit draws the audience in", "He destroys his brother and father without remorse", "He tries to do good as he dies"], [9, 10, 52, 58]], ["What does the subplot add?", ["Gloster's story doubles Lear's", "Physical blindness mirrors mental blindness", "Edgar's care for Gloster mirrors Cordelia's for Lear", "Two fathers meet at Dover to share their suffering"], [11, 34, 44, 59]], ["Why is the ending so bleak, and is there any hope?", ["Edmund's reprieve comes too late", "'Never' five times: grief beyond words", "Earlier versions let Cordelia live", "Edgar and Albany survive to rebuild", "The last lines ask for honest speech"], [53, 54, 55]]], "symbols": {"Eyes and sight": "\\beyes?\\b|\\bsee\\b|\\bsight\\b|\\bblind\\b", "Nothing": "\\bnothing\\b", "Nature": "\\bnature\\b|\\bnatural\\b|unnatural", "Betrayal": "\\btraitors?\\b|\\btreason|\\bbetray", "Storm and weather": "\\bstorm\\b|\\btempest\\b|\\bwinds?\\b|\\brain\\b|\\bthunder\\b", "Animals": "\\bdogs?\\b|\\bwolf|\\bserpent|\\btigers?\\b|\\bfox\\b|\\bkite\\b|\\bpelican"}, "stagerules": [["hovel|farmhouse", "hovel"], ["heath|open country", "heath"], ["camp|tent", "camp"], ["field", "field"], ["dover|country near", "cliff"], ["gloster's castle|castle", "castle"], ["palace", "palace"]], "solo": {"97": 1, "130": 1, "152": 1, "167": 1, "477": 1, "473": 1, "635": 1, "759": 1, "832": 1, "1154": 1}, "iago": [["a1s2", "Swears to take Edgar's land and forges a letter from Edgar."], ["a1s2", "Shows Gloster the letter and offers to let him overhear proof."], ["a1s2", "Warns Edgar to hide from their father, armed."], ["a2s1", "Stages a fake fight, makes Edgar flee and wounds himself."], ["a2s1", "Tells Gloster Edgar wanted him dead; Edgar is outlawed."], [ /* ---------- pagination: fill each screen, split long speeches between pages ---------- */

function paginate(p){
  const blocks=sceneBlocks(p);
  measure.className="pg";measure.style.width=pg.clientWidth+"px";measure.style.maxWidth="none";
  const H=pg.clientHeight-2,pages=[];let page=[];measure.innerHTML="";
  const fits=()=>measure.scrollHeight<=H;
  const flush=()=>{if(page.length)pages.push(page);page=[];measure.innerHTML=""};
  const add=bk=>{measure.insertAdjacentHTML("beforeend",blockHTML(bk,p));return measure.lastElementChild};
  for(const bk0 of blocks){
    let bk=bk0,guard=0;
    while(guard++<500){
      const el=add(bk);
      if(fits()){page.push(bk);break}
      el.remove();
      if(bk.t==="sp"&&bk.u1-bk.u0>1){
        let best=0;
        for(const pass of [1,0]){ // split between parts if possible, else between lines
          for(let u=bk.u1-1;u>bk.u0;u--){if(pass&&!bk.starts.has(bk.units[u][0]))continue;const e=add(Object.assign({},bk,{u1:u}));const ok=fits();e.remove();if(ok){best=u;break}}

      }
      if(page.length){flush();continue}

    }
  }

  const txt=()=>notesIds().map(k=>{const sp=speech[k],m=marks[k];return `${where(sp)}\n${sp.lines.map(l=>l.replace(/^~/,"")).join("\n")}${m.note?`\nNote: ${m.note}`:""}`}).join("\n\n");
  $("nf-copy").onclick=()=>copyText("MY KING LEAR NOTES\n\n"+txt());
  $("nf-print").onclick=()=>printArea("My King Lear notes",notesIds().map(k=>{const sp=speech[k],m=marks[k];return `<div class="pi"><small>${esc(where(sp))}${(m.th||[]).length?" · "+m.th.map(x=>esc(QUOTES.themes[x][0])).join(", "):""}</small><div>${sp.lines.map(l=>esc(l.replace(/^~/,""))).join("<br>")}</div>${m.note?`<i>${esc(m.note)}</i>`:""}</div>`}).join(""));
  $("nf-share").onclick=()=>shareIds(notesIds());
}
function printArea(tl,html){let pa=$("printarea");if(!pa){pa=document.createElement("div");pa.id="printarea";document.body.appendChild(pa)}
  pa.innerHTML=`<h1>${esc(tl)}</h1>${html}`;document.body.classList.add("printing");const done=()=>{document.body.classList.remove("printing");removeEventListener("afterprint",done)};addEventListener("afterprint",done);
  try{window.print()}catch(e){toast("Printing isn’t available here. Use Copy instead.")}setTimeout(done,60000)}
function shareIds(ids){if(!ids.length){toast("Nothing to share");return}const url=location.href.split("#")[0]+"#share="+ids.slice(0,200).join(".");
  if(navigator.share)navigator.share({title:"King Lear quotes",text:"My King Lear quotes",url}).catch(()=>{});else copyText(url)}
function openShared(ids){if(!ids.length){toast("That link has no quotes in it");return}
  openSheet("Shared quotes",`<p class="intro">Someone shared ${ids.length} line${ids.length===1?"":"s"} with you. Tap one to read it in context.</p><div class="row"><button class="btn primary" id="sh-save">Add all to my notes</button></div>`+ids.map(k=>{const sp=speech[k];return `<div class="item" data-speech="${k}" tabindex="0"><small>${esc(where(sp))}</small><span style="font-family:var(--f-old)">${sp.lines.map(l=>esc(l.replace(/^~/,""))).join("<br>")}</span></div>`}).join(""));
  $("sh-save").onclick=()=>{ids.forEach(k=>{if(!(marks[k]&&marks[k].hl))saveMark(k,{hl:"fav"})});toast(`Added ${ids.length} as favourites`);$("sh-save").disabled=true}}
/* quote image card */
function quoteImage(paras,who,ref){const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#f7f2e7";x.fillRect(0,0,W,H);x.strokeStyle="#1a1a1a";x.lineWidth=3;x.strokeRect(44,44,W-88,H-88);x.fillStyle="#1a1a1a";x.textAlign="center";
  const F=s=>`${s}px Georgia, "Times New Roman", serif`;
  const wrap=(fs)=>{x.font=F(fs);const L=[];paras.forEach((p,pi)=>{let l="";const t=(pi===0?"“":"")+p+(pi===paras.length-1?"”":"");t.split(/\s+/).forEach(w=>{const tt=l?l+" "+w:w;if(x.measureText(tt).width>W-240&&l){L.push(l);l=w}else l=tt});if(l)L.push(l)});return L};
  let fs=58,L=wrap(fs);while(fs>26&&L.length*fs*1.4>H-560){fs-=4;L=wrap(fs)}
  const lh=fs*1.4;let y=(H-L.length*lh)/2-40+fs;x.font=F(fs);L.forEach(l=>{x.fillText(l,W/2,y);y+=lh});
  y+=40;x.font="600 "+F(38);x.fillText("— "+who,W/2,y);x.font=F(30);x.fillStyle="#555";x.fillText(ref,W/2,y+50);
  x.font="italic "+F(28);x.fillText("King Lear · William Shakespeare",W/2,H-100);return c}
function openImage(paras,who,ref){const c=quoteImage(paras,who,ref),url=c.toDataURL("image/png");
  openSheet("Quote image",`<img class="qimg" src="${url}" alt="${esc(paras.join(" "))}, ${esc(who)}"><p class="muted">Press and hold the image to save it, or use the buttons.</p><div class="row"><button class="btn primary" id="qi-dl">Download</button>${navigator.share?`<button class="btn" id="qi-sh">Share</button>`:""}</div>`);
  $("qi-dl").onclick=()=>{try{const a=document.createElement("a");a.href=url;a.download="king-lear-quote.png";document.body.appendChild(a);a.click();a.remove()}catch(e){}toast("Downloading. If nothing appears, press and hold the image.")};
  if($("qi-sh"))$("qi-sh").onclick=()=>c.toBlob(b=>{const f=new File([b],"king-lear-quote.png",{type:"image/png"});const d={files:[f],title:"King Lear quote"};(navigator.canShare&&navigator.canShare(d)?navigator.share(d):navigator.share({title:"King Lear quote",text:`“${paras.join(" ")}” — ${who}, ${ref}`})).catch(()=>{})})}
/* compare two key quotes */
function compareHTML(){const Q=QUOTES.quotes,a=Q[cmp[0]],b=Q[cmp[1]];
  const sel=i=>`<label class="sr" for="cmp${i}">Quote ${i+1}</label><select id="cmp${i}" data-cmp="${i}">${Q.map(q=>`<option value="${q.i}"${q.i===cmp[i]?" selected":""}>${esc(title(speech[q.id].who))}: ${esc(q.text.slice(0,50))}</option>`).join("")}</select>`;
  const card=(q,i)=>{const sp=speech[q.id];return `<div>${sel(i)}<blockquote>“${esc(q.text)}”</blockquote><small>${esc(where(sp))}</small><p>${esc(q.note)}</p>${EX.why[q.i]?`<p><b>Why it matters:</b> ${esc(EX.why[q.i])}</p>`:""}<p class="muted">${q.themes.map(t=>esc(QUOTES.themes[t][0])).join(" · ")}</p><button class="link" data-speech="${q.id}">Read in context</button></div>`};
  const sa=speech[a.id],sb=speech[b.id],pa=sceneOf(a.id),pb=sceneOf(b.id),sh=a.themes.filter(t=>b.themes.includes(t)).map(t=>QUOTES.themes[t][0]);
  const pr=[];if(sa.who===sb.who)pr.push(`Both are spoken by ${title(sa.who)}. What has changed in them between ${sName(pa)} and ${sName(pb)}, and what caused it?`);
  else pr.push(`How do ${title(sa.who)} and ${title(sb.who)} see things differently here? Whose view does the audience trust, and why?`);
  if(sh.length)pr.push(`Both are about ${sh.join(" and ").toLowerCase()}. How does Shakespeare's presentation of this differ between the two?`);else pr.push(`They share no main theme. Is there a link in imagery, tone or situation you could use to connect them?`);
  pr.push(`Compare the language: look at the imagery, the length of the sentences and whether each speaker uses verse or prose.`);
  return `<p class="intro">Pick any two key quotes. Comparing them is a quick way to build an essay paragraph.</p><div class="cmp">${card(a,0)}${card(b,1)}</div><div class="exitem"><b>Shared themes</b><p>${sh.length?esc(sh.join(", ")):"None"}</p></div><div class="exitem"><b>Questions to answer</b><ul>${pr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
function jumpLine(v){const m=String(v).trim().match(/^(\d)\D+(\d)\D+(\d+)$/);if(!m){toast("Type act, scene and line, like 3.3.165");return}
  const p=scenes.find(x=>x.act===+m[1]&&x.sc===+m[2]);if(!p){toast("No such scene");return}const ln=+m[3];
  const sp=p.items.find(i=>i.t==="sp"&&ln>=i.start&&ln<i.start+i.lines.length)||p.items.filter(i=>i.t==="sp").pop();
  closeSheet();const li=Math.max(0,Math.min(sp.lines.length-1,ln-sp.start));goScene(sIdx(p.id),{key:sp.id+":"+li});
  setTimeout(()=>{const pi=partsOf(sp).findIndex(q=>li>=q[0]&&li<=q[1]);const el=pg.querySelector(`.sp[data-id="${sp.id}"] .pt[data-p="${pi}"]`);if(el){el.classList.add("pulse");setTimeout(()=>el.classList.remove("pulse"),3400)}},300)}
function openPicker(){
  let h=`<div class="jump"><label for="jl" class="sr">Go to line</label><input class="sinput" id="jl" inputmode="decimal" placeholder="Go to line, e.g. 3.3.165"><button class="btn" id="jl-go">Go</button></div>`;
  const rc=RECENT.filter(r=>speech[r.id]);if(rc.length)h+=`<div class="eyebrow" style="margin:6px 0 2px">Recently viewed</div>`+rc.map(r=>{const sp=speech[r.id],q=partsOf(sp)[r.pi]||partsOf(sp)[0];
    return `<div class="item" data-recent="${r.id}:${r.pi}" tabindex="0"><small>${esc(where(sp))}</small><span style="font-family:var(--f-old)">${esc(sp.lines[q[0]].replace(/^~/,""))}…</span></div>`}).join("");for(let a=1;a<=5;a++){h+=`<div class="eyebrow" style="margin:10px 0 6px">${LAT[a]}</div><div class="pick">`+
    scenes.filter(p=>p.act===a).map(p=>`<button class="scard${view==="reader"&&cur.k===sIdx(p.id)?" here":""}" data-go="${p.id}"><span class="st">${prog.done[p.id]?"✓":""}</span><b>Scene ${p.scene.toLowerCase()}</b><span>${esc(shortLoc(p))}</span></button>`).join("")+`</div>`}
  openSheet("Go to scene",h);$("jl-go").onclick=()=>jumpLine($("jl").value);$("jl").onkeydown=e=>{if(e.key==="Enter")jumpLine($("jl").value)}}
function openSettings(){
  const segs=(name,opts,val)=>`<div class="segs" data-set="${name}">`+opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join("")+`</div>`;
  const whoOpts=[...whoSet].sort((a,b)=>{const o=Object.keys(COLORS),ia=o.indexOf(a),ib=o.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  openSheet("Settings",`
    <div class="opt"><div class="lbl">On the page</div>${segs("mode",[["orig","Shakespeare only"],["both","Both"],["mod","Modern only"]],S.mode)}<small>With Shakespeare only, tap any line to see its modern English.</small></div>
    <div class="opt"><div class="lbl">Text size</div>${segs("scale",[["1.15","Small"],["1.3","Normal"],["1.5","Large"],["1.75","Extra large"]],S.scale)}</div>
    <div class="opt"><div class="lbl">Theme</div>${segs("theme",[["paper","Paper"],["papernight","Paper night"],["papertimed","Paper, night after 8pm"]],S.theme)}${segs("theme",[["auto","Auto"],["light","Light"],["dark","Dark"],["night","Night"],["timed","Night after 8pm"]],S.theme)}<small>Paper looks like an e-reader: a matte, warm page with crisp black text, and pages that change without sliding. Night is a warm, dim scheme for reading in bed. The "after 8pm" options switch to the night version until 7am.</small></div>
    <div class="opt"><div class="lbl">Line spacing</div>${segs("lh",[["1.4","Compact"],["1.55","Normal"],["1.8","Airy"]],S.lh)}</div>
    <div class="opt"><div class="lbl">Clean page</div>${segs("clean",[["false","Off"],["true","On"]],S.clean)}<small>Hides line numbers, tags and underlines for pure reading. Tapping still works.</small></div>
    <div class="opt"><div class="lbl">One-hand page turns</div>${segs("onehand",[["false","Off"],["true","On"]],S.onehand)}<small>Tap the bottom-left or bottom-right corner to turn pages.</small></div>
    <div class="opt"><label for="focsel" class="lbl">Dim everyone except</label><select id="focsel"><option value="">Nobody (show all normally)</option>${whoOpts.map(w=>`<option value="${esc(w)}"${S.focus===w?" selected":""}>${esc(title(w))}</option>`).join("")}</select><small>Other speakers stay on the page but fade, so you can follow one voice.</small></div>
    <div class="opt"><div class="lbl">Scene summary on the first page</div>${segs("sum",[["true","Show"],["false","Hide"]],S.sum)}</div>
    <div class="opt"><label for="whosel" class="lbl">Follow one character</label><select id="whosel"><option value="">Everyone</option>${whoOpts.map(w=>`<option value="${esc(w)}"${S.who===w?" selected":""}>${esc(title(w))}</option>`).join("")}</select></div>
    <div class="opt"><div class="lbl">How to read</div><small style="margin:0">Swipe left or right to turn pages (arrow keys or the scroll wheel on a computer). Tap an underlined word for its meaning. Tap any other part of the lines for their modern English; long speeches are split into parts, and you can expand to the whole speech. Tap empty space to show or hide the menus. Press and hold a speech (right-click on a computer) for word meanings, notes and highlights. Pinch with two fingers to change the text size. Drag the page slider in the bottom menu to preview pages.</small></div>
    ${backupHTML()}
    <div class="opt"><div class="lbl">Progress</div><button class="btn" id="resetprog">Reset reading progress, quiz scores and flashcards</button><small id="resetmsg"></small></div>`);
  $("sheet-body").querySelectorAll("[data-set] button").forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.set;let v=b.dataset.v;
    if(k==="scale"||k==="lh")v=parseFloat(v);if(k==="sum"||k==="clean"||k==="onehand")v=v==="true";S[k]=v;applySettings();$("sheet-body").querySelectorAll(`[data-set="${k}"] button`).forEach(x=>x.setAttribute("aria-pressed",x===b));repaginate()});
  $("whosel").onchange=e=>{S.who=e.target.value;repaginate()};

}
