<script>
const DATA=[{"t": "scene", "act": 1, "scene": "I", "loc": "A Room of State in King Lear's Palace.", "id": 0}, {"t": "sd", "text": "Enter Kent, Gloster, and Edmund.", "id": 1}, {"t": "sp", "who": "KENT", "lines": ["I thought the King had more affected the Duke of Albany than", "Cornwall."], "id": 2, "m": "I thought the King liked the Duke of Albany more than the Duke of Cornwall."}, {"t": "sp", "who": "GLOSTER", "lines": ["It did always seem so to us; but now, in the division of the", "kingdom, it appears not which of the Dukes he values most, for", "equalities are so weighed that curiosity in neither can make", "choice of either's moiety."], "id": 3, "m": "We always thought so too. But now that he is dividing up the kingdom, you can't tell which duke he values more, because the shares are so evenly balanced that even close scrutiny can't prefer either one's portion."}, {"t": "sp", "who": "KENT", "lines": ["Is not this your son, my lord?"], "id": 4, "m": "Isn't this your son, my lord?"}, {"t": "sp", "who": "GLOSTER", "lines": ["His breeding, sir, hath been at my charge: I have so often", "blush'd to acknowledge him that now I am braz'd to't."], "id": 5, "m": "I have paid for his upbringing, sir. I've blushed so often to admit he's mine that now I'm hardened to it."}, {"t": "sp", "who": "KENT", "lines": ["I cannot conceive you."], "id": 6, "m": "I don't follow you."}, {"t": "sp", "who": "GLOSTER", "lines": ["Sir, this young fellow's mother could: whereupon she grew", "round-wombed, and had indeed, sir, a son for her cradle ere she", "had a husband for her bed. Do you smell a fault?"], "id": 7, "m": "Sir, this young man's mother could 'conceive' all right. Her belly grew round, and she had a son in her cradle before she had a husband in her bed. Do you smell a sin?"}, {"t": "sp", "who": "KENT", "lines": ["I cannot wish the fault undone, the issue of it being so proper."], "id": 8, "m": "I can't wish the sin undone, when the result is so handsome."}, {"t": "sp", "who": "GLOSTER", "lines": ["But I have, sir, a son by order of law, some year elder than", "this, who yet is no dearer in my account: though this knave came", "something saucily into the world before he was sent for, yet was", "his mother fair; there was good sport at his making, and the", "whoreson must be acknowledged.—Do you know this noble gentleman,", "Edmund?"], "id": 9, "m": "But I also have a son born in wedlock, about a year older than this one, and I don't love him any more. Though this rascal came rather cheekily into the world before he was sent for, his mother was beautiful, we had good fun making him, and the bastard has to be acknowledged. Do you know this noble gentleman, Edmund?"}, {"t": "sp", "who": "EDMUND", "lines": ["No, my lord."], "id": 10, "m": "No, my lord."}, {"t": "sp", "who": "GLOSTER", "lines": ["My Lord of Kent: remember him hereafter as my honourable friend."], "id": 11, "m": "This is my Lord of Kent. Remember him from now on as my honoured friend."}, {"t": "sp", "who": "EDMUND", "lines": ["My services to your lordship."], "id": 12, "m": "At your lordship's service."}, {"t": "sp", "who": "KENT", "lines": ["I must love you, and sue to know you better."], "id": 13, "m": "I'm sure I'll like you, and I hope to know you better."}, {"t": "sp", "who": "EDMUND", "lines": ["Sir, I shall study deserving."], "id": 14, "m": "Sir, I'll work hard to deserve it."}, {"t": "sp", "who": "GLOSTER", "lines": ["He hath been out nine years, and away he shall again.—The king", "is coming."], "id": 15, "m": "He has been abroad for nine years, and he'll go away again. The King is coming."}, {"t": "sd", "text": "Sennet within.", "id": 16}, {"t": "sd", "text": "Enter Lear, Cornwall, Albany, Goneril, Regan, Cordelia, and Attendants.", "id": 17}, {"t": "sp", "who": "LEAR", "lines": ["Attend the lords of France and Burgundy,", "Gloster."], "id": 18, "m": "Go and look after the King of France and the Duke of Burgundy, Gloster."}, {"t": "sp", "who": "GLOSTER", "lines": ["I shall, my liege."], "id": 19, "m": "I will, my lord."}, {"t": "sd", "text": "Exeunt Gloster and Edmund.", "id": 20}, {"t": "sp", "who": "LEAR", "lines": ["Meantime we shall express our darker purpose.—", "Give me the map there.—Know that we have divided", "In three our kingdom: and 'tis our fast intent", "To shake all cares and business from our age;", "Conferring them on younger strengths, while we", "Unburden'd crawl toward death.—Our son of Cornwall,", "And you, our no less loving son of Albany,", "We have this hour a constant will to publish", "Our daughters' several dowers, that future strife", "May be prevented now. The princes, France and Burgundy,", "Great rivals in our youngest daughter's love,", "Long in our court have made their amorous sojourn,", "And here are to be answer'd.—Tell me, my daughters,—", "Since now we will divest us both of rule,", "Interest of territory, cares of state,—", "Which of you shall we say doth love us most?", "That we our largest bounty may extend", "Where nature doth with merit challenge.—Goneril,", "Our eldest-born, speak first."], "id": 21, "m": "Meanwhile, I will reveal my secret plan. Give me the map there. You should know that I have divided my kingdom into three, and it is my firm intention to shake all cares and business off my old age, handing them to younger and stronger people while I crawl towards death without a burden. My son-in-law Cornwall, and you, my equally loved son-in-law Albany, I have decided right now to announce the dowry each of my daughters will receive, so that future quarrels are prevented. The King of France and the Duke of Burgundy, great rivals for my youngest daughter's love, have stayed at my court a long time courting her, and they will get their answer today. Tell me, my daughters, since I am now giving up power, land and the cares of state: which of you shall I say loves me most? Then I can give the largest gift to the one whose natural love deserves it most. Goneril, my eldest, speak first."}, {"t": "sp", "who": "GONERIL", "lines": ["Sir, I love you more than words can wield the matter;", "Dearer than eyesight, space, and liberty;", "Beyond what can be valu'd, rich or rare;", "No less than life, with grace, health, beauty, honour;", "As much as child e'er lov'd, or father found;", "A love that makes breath poor and speech unable;", "Beyond all manner of so much I love you."], "id": 22, "m": "Sir, I love you more than words can express. You are dearer to me than eyesight, freedom and the whole wide world; beyond anything that can be valued, however rich or rare; no less than life itself with all its grace, health, beauty and honour; as much as any child ever loved or any father was loved. It is a love that makes breath feeble and speech useless. I love you beyond every way of saying how much."}, {"t": "sp", "who": "CORDELIA", "lines": ["[Aside.] What shall Cordelia speak? Love, and be silent."], "id": 23, "m": "[Aside] What can Cordelia say? Love, and keep quiet."}, {"t": "sp", "who": "LEAR", "lines": ["Of all these bounds, even from this line to this,", "With shadowy forests and with champains rich'd,", "With plenteous rivers and wide-skirted meads,", "We make thee lady: to thine and Albany's issue", "Be this perpetual.—What says our second daughter,", "Our dearest Regan, wife to Cornwall? Speak."], "id": 24, "m": "All this land, from this line to this, with its shady forests and rich plains, its plentiful rivers and wide meadows, I make you lady of. It belongs to your children and Albany's for ever. What does my second daughter say, my dearest Regan, Cornwall's wife? Speak."}, {"t": "sp", "who": "REGAN", "lines": ["Sir, I am made of the selfsame metal that my sister is,", "And prize me at her worth. In my true heart", "I find she names my very deed of love;", "Only she comes too short,—that I profess", "Myself an enemy to all other joys", "Which the most precious square of sense possesses,", "And find I am alone felicitate", "In your dear highness' love."], "id": 25, "m": "Sir, I am made of the same stuff as my sister, and I value myself as highly as her. In my honest heart I find she describes exactly the love I feel, only she doesn't go far enough. For I declare that I hate every other joy that the most refined senses can offer, and that my only happiness is in loving your highness."}, {"t": "sp", "who": "CORDELIA", "lines": ["[Aside.] Then poor Cordelia!", "And yet not so; since, I am sure, my love's", "More richer than my tongue."], "id": 26, "m": "[Aside] Then poor Cordelia! And yet not poor, because I'm sure my love is richer than my words."}, {"t": "sp", "who": "LEAR", "lines": ["To thee and thine hereditary ever", "Remain this ample third of our fair kingdom;", "No less in space, validity, and pleasure", "Than that conferr'd on Goneril.—Now, our joy,", "Although the last, not least; to whose young love", "The vines of France and milk of Burgundy", "Strive to be interess'd; what can you say to draw", "A third more opulent than your sisters? Speak."], "id": 27, "m": "To you and your heirs for ever goes this generous third of my lovely kingdom, no smaller in size, value or pleasure than the part given to Goneril. Now, my joy, last but not least, whose young love the vineyards of France and the pastures of Burgundy are competing to win: what can you say to earn a third richer than your sisters'? Speak."}, {"t": "sp", "who": "CORDELIA", "lines": ["Nothing, my lord."], "id": 28, "m": "Nothing, my lord."}, {"t": "sp", "who": "LEAR", "lines": ["Nothing!"], "id": 29, "m": "Nothing?"}, {"t": "sp", "who": "CORDELIA", "lines": ["Nothing."], "id": 30, "m": "Nothing."}, {"t": "sp", "who": "LEAR", "lines": ["Nothing can come of nothing: speak again."], "id": 31, "m": "Nothing will come of nothing. Speak again."}, {"t": "sp", "who": "CORDELIA", "lines": ["Unhappy that I am, I cannot heave", "My heart into my mouth: I love your majesty", "According to my bond; no more nor less."], "id": 32, "m": "I'm sorry, but I can't heave my heart up into my mouth. I love your majesty as a daughter should, no more and no less."}, {"t": "sp", "who": "LEAR", "lines": ["How, how, Cordelia? mend your speech a little,", "Lest you may mar your fortunes."], "id": 33, "m": "What, Cordelia? Improve your answer a little, or you may ruin your fortune."}, {"t": "sp", "who": "CORDELIA", "lines": ["Good my lord,", "You have begot me, bred me, lov'd me: I", "Return those duties back as are right fit,", "Obey you, love you, and most honour you.", "Why have my sisters husbands if they say", "They love you all? Haply, when I shall wed,", "That lord whose hand must take my plight shall carry", "Half my love with him, half my care and duty:", "Sure I shall never marry like my sisters,", "To love my father all."], "id": 34, "m": "My good lord, you gave me life, brought me up and loved me. I return those duties as is right: I obey you, love you and honour you above all. Why do my sisters have husbands if they say they love only you? When I marry, I expect the man who takes my vow will take half my love with him, and half my care and duty. I will certainly never marry like my sisters and love only my father."}, {"t": "sp", "who": "LEAR", "lines": ["But goes thy heart with this?"], "id": 35, "m": "But do you mean this from the heart?"}, {"t": "sp", "who": "CORDELIA", "lines": ["Ay, good my lord."], "id": 36, "m": "Yes, my good lord."}, {"t": "sp", "who": "LEAR", "lines": ["So young, and so untender?"], "id": 37, "m": "So young, and so hard-hearted?"}, {"t": "sp", "who": "CORDELIA", "lines": ["So young, my lord, and true."], "id": 38, "m": "So young, my lord, and honest."}, {"t": "sp", "who": "LEAR", "lines": ["Let it be so,—thy truth then be thy dower:", "For, by the sacred radiance of the sun,", "The mysteries of Hecate, and the night;", "By all the operation of the orbs,", "From whom we do exist and cease to be;", "Here I disclaim all my paternal care,", "Propinquity, and property of blood,", "And as a stranger to my heart and me", "Hold thee, from this for ever. The barbarous Scythian,", "Or he that makes his generation messes", "To gorge his appetite, shall to my bosom", "Be as well neighbour'd, pitied, and reliev'd,", "As thou my sometime daughter."], "id": 39, "m": "So be it. Let your honesty be your dowry. For by the sacred light of the sun, by the mysteries of Hecate and the night, by all the stars and planets that make us live and die, I here renounce all my care as a father, all kinship and shared blood, and from now on I will treat you as a stranger to my heart and to me for ever. The savage Scythian, or the cannibal who eats his own children, will be as welcome, pitied and helped by me as you, who were once my daughter."}, {"t": "sp", "who": "KENT", "lines": ["Good my liege,—"], "id": 40, "m": "My good lord..."}, {"t": "sp", "who": "LEAR", "lines": ["Peace, Kent!", "Come not between the dragon and his wrath.", "I lov'd her most, and thought to set my rest", "On her kind nursery.—Hence, and avoid my sight!—[To Cordelia.]", "So be my grave my peace, as here I give", "Her father's heart from her!—Call France;—who stirs?", "Call Burgundy!—Cornwall and Albany,", "With my two daughters' dowers digest this third:", "Let pride, which she calls plainness, marry her.", "I do invest you jointly in my power,", "Pre-eminence, and all the large effects", "That troop with majesty.—Ourself, by monthly course,", "With reservation of an hundred knights,", "By you to be sustain'd, shall our abode", "Make with you by due turns. Only we still retain", "The name, and all the additions to a king;", "The sway,", "Revenue, execution of the rest,", "Beloved sons, be yours; which to confirm,", "This coronet part betwixt you.", "[Giving the crown.]"], "id": 41, "m": "Quiet, Kent! Don't come between the dragon and its rage. I loved her most, and hoped to spend my old age in her loving care. [To Cordelia] Go, get out of my sight! As I hope to rest in peace in my grave, I take my father's heart away from her. Call the King of France! Is nobody moving? Call Burgundy! Cornwall and Albany, add this third to my two daughters' dowries. Let her pride, which she calls honesty, find her a husband. I give you both together my power, my rank and all the grand trappings of majesty. I will live with each of you in turn, a month at a time, keeping a hundred knights for whom you will provide. I keep only the name and the honours of a king. The rule, the revenue and the running of everything else are yours, beloved sons. To confirm it, share this crown between you. [He gives them the crown.]"}, {"t": "sp", "who": "KENT", "lines": ["Royal Lear,", "Whom I have ever honour'd as my king,", "Lov'd as my father, as my master follow'd,", "As my great patron thought on in my prayers.—"], "id": 42, "m": "Royal Lear, whom I have always honoured as my king, loved as my father, followed as my master, and remembered in my prayers as my great protector..."}, {"t": "sp", "who": "LEAR", "lines": ["The bow is bent and drawn; make from the shaft."], "id": 43, "m": "The bow is bent and drawn. Keep clear of the arrow."}, {"t": "sp", "who": "KENT", "lines": ["Let it fall rather, though the fork invade", "The region of my heart: be Kent unmannerly", "When Lear is mad. What wouldst thou do, old man?", "Think'st thou that duty shall have dread to speak", "When power to flattery bows? To plainness honour's bound", "When majesty falls to folly. Reverse thy state;", "And in thy best consideration check", "This hideous rashness: answer my life my judgment,", "Thy youngest daughter does not love thee least;", "Nor are those empty-hearted whose low sound", "Reverbs no hollowness."], "id": 44, "m": "Let it fall, then, even if the arrowhead pierces my heart. Kent must be rude when Lear is mad. What are you doing, old man? Do you think duty will be afraid to speak when power gives in to flattery? Honour must speak plainly when a king falls into folly. Keep your power, and think again carefully to stop this terrible rashness. I'd stake my life on my judgement: your youngest daughter does not love you least, and people who speak quietly are not empty-hearted. It's the hollow things that make the loudest echo."}, {"t": "sp", "who": "LEAR", "lines": ["Kent, on thy life, no more."], "id": 45, "m": "Kent, if you value your life, say no more."}, {"t": "sp", "who": "KENT", "lines": ["My life I never held but as a pawn", "To wage against thine enemies; nor fear to lose it,", "Thy safety being the motive."], "id": 46, "m": "I have only ever valued my life as a stake to gamble against your enemies, and I'm not afraid to lose it when your safety is at stake."}, {"t": "sp", "who": "LEAR", "lines": ["Out of my sight!"], "id": 47, "m": "Get out of my sight!"}, {"t": "sp", "who": "KENT", "lines": ["See better, Lear; and let me still remain", "The true blank of thine eye."], "id": 48, "m": "See better, Lear, and let me always be the true centre of your sight."}, {"t": "sp", "who": "LEAR", "lines": ["Now, by Apollo,—"], "id": 49, "m": "Now, by Apollo..."}, {"t": "sp", "who": "KENT", "lines": ["Now by Apollo, king,", "Thou swear'st thy gods in vain."], "id": 50, "m": "Now, by Apollo, king, you swear by your gods for nothing."}, {"t": "sp", "who": "LEAR", "lines": ["O vassal! miscreant!"], "id": 51, "m": "Oh, you slave! You traitor!"}, {"t": "sd", "text": "Laying his hand on his sword.", "id": 52}, {"t": "sp", "who": "ALBANY AND CORNWALL", "lines": ["Dear sir, forbear!"], "id": 53, "m": "Dear sir, stop!"}, {"t": "sp", "who": "KENT", "lines": ["Do;", "Kill thy physician, and the fee bestow", "Upon the foul disease. Revoke thy gift,", "Or, whilst I can vent clamour from my throat,", "I'll tell thee thou dost evil."], "id": 54, "m": "Go on, kill your doctor and pay your fee to the disease that is killing you. Take back your gift, or as long as I can shout, I'll tell you you're doing wrong."}, {"t": "sp", "who": "LEAR", "lines": ["Hear me, recreant!", "On thine allegiance, hear me!—", "Since thou hast sought to make us break our vow,—", "Which we durst never yet,—and with strain'd pride", "To come between our sentence and our power,—", "Which nor our nature nor our place can bear,—", "Our potency made good, take thy reward.", "Five days we do allot thee for provision", "To shield thee from diseases of the world;", "And on the sixth to turn thy hated back", "Upon our kingdom: if, on the tenth day following,", "Thy banish'd trunk be found in our dominions,", "The moment is thy death. Away! by Jupiter,", "This shall not be revok'd."], "id": 55, "m": "Listen to me, you traitor! On your oath of loyalty, listen! Since you have tried to make me break my word, which I have never dared to do, and with arrogant pride have tried to come between my sentence and my power to enforce it, which neither my nature nor my position can tolerate, here is your reward, as my power proves itself. I give you five days to gather supplies to protect you from the hardships of the world, and on the sixth you will turn your hated back on my kingdom. If on the tenth day after that your banished body is found in my lands, you die that moment. Go! By Jupiter, this will not be taken back."}, {"t": "sp", "who": "KENT", "lines": ["Fare thee well, king: sith thus thou wilt appear,", "Freedom lives hence, and banishment is here.—", "[To Cordelia.] The gods to their dear shelter take thee, maid,", "That justly think'st and hast most rightly said!", "[To Regan and Goneril.]", "And your large speeches may your deeds approve,", "That good effects may spring from words of love.—", "Thus Kent, O princes, bids you all adieu;", "He'll shape his old course in a country new."], "id": 56, "m": "Goodbye, king. Since this is how you behave, freedom lives elsewhere and banishment is here. [To Cordelia] May the gods protect you, girl, for you think justly and have spoken rightly. [To Regan and Goneril] And may your grand speeches be proved by your actions, so that good things come from your words of love. So Kent says goodbye to you all, princes. He'll keep up his old ways in a new country."}, {"t": "sd", "text": "Exit.", "id": 57}, {"t": "sd", "text": "Flourish. Re-enter Gloster, with France, Burgundy, and Attendants.", "id": 58}, {"t": "sp", "who": "GLOSTER", "lines": ["Here's France and Burgundy, my noble lord."], "id": 59, "m": "Here are France and Burgundy, my noble lord."}, {"t": "sp", "who": "LEAR", "lines": ["My Lord of Burgundy,", "We first address toward you, who with this king", "Hath rivall'd for our daughter: what in the least", "Will you require in present dower with her,", "Or cease your quest of love?"], "id": 60, "m": "My Lord of Burgundy, I'll speak to you first, since you have competed with this king for my daughter. What is the least dowry you will take with her, or else give up courting her?"}, {"t": "sp", "who": "BURGUNDY", "lines": ["Most royal majesty,", "I crave no more than hath your highness offer'd,", "Nor will you tender less."], "id": 61, "m": "Most royal majesty, I ask no more than your highness offered, and you won't offer less."}, {"t": "sp", "who": "LEAR", "lines": ["Right noble Burgundy,", "When she was dear to us, we did hold her so;", "But now her price is fall'n. Sir, there she stands:", "If aught within that little seeming substance,", "Or all of it, with our displeasure piec'd,", "And nothing more, may fitly like your grace,", "She's there, and she is yours."], "id": 62, "m": "Noble Burgundy, when she was dear to me I valued her that way, but now her price has fallen. There she stands, sir. If anything in that small, pretending creature, or all of her, with my displeasure added and nothing else, pleases your grace, there she is, and she's yours."}, {"t": "sp", "who": "BURGUNDY", "lines": ["I know no answer."], "id": 63, "m": "I don't know what to say."}, {"t": "sp", "who": "LEAR", "lines": ["Will you, with those infirmities she owes,", "Unfriended, new-adopted to our hate,", "Dower'd with our curse, and stranger'd with our oath,", "Take her, or leave her?"], "id": 64, "m": "With all her faults, without friends, newly adopted as the object of my hatred, given my curse as her dowry and made a stranger by my oath, will you take her or leave her?"}, {"t": "sp", "who": "BURGUNDY", "lines": ["Pardon me, royal sir;", "Election makes not up on such conditions."], "id": 65, "m": "Forgive me, royal sir, but no one can choose on such terms."}, {"t": "sp", "who": "LEAR", "lines": ["Then leave her, sir; for, by the power that made me,", "I tell you all her wealth.—[To France] For you, great king,", "I would not from your love make such a stray", "To match you where I hate; therefore beseech you", "To avert your liking a more worthier way", "Than on a wretch whom nature is asham'd", "Almost to acknowledge hers."], "id": 66, "m": "Then leave her, sir. By the god who made me, I've told you all she's worth. [To France] As for you, great king, I would not insult your love so much as to marry you to someone I hate. So I beg you to turn your affection to someone more worthy than a wretch whom nature is almost ashamed to call her own."}, {"t": "sp", "who": "FRANCE", "lines": ["This is most strange,", "That she, who even but now was your best object,", "The argument of your praise, balm of your age,", "Most best, most dearest, should in this trice of time", "Commit a thing so monstrous, to dismantle", "So many folds of favour. Sure her offence", "Must be of such unnatural degree", "That monsters it, or your fore-vouch'd affection", "Fall'n into taint; which to believe of her", "Must be a faith that reason without miracle", "Should never plant in me."], "id": 67, "m": "This is very strange. Just a moment ago she was your favourite, the subject of your praise, the comfort of your old age, the best and dearest. Can she in a moment have done something so monstrous as to strip off so many layers of your favour? Surely her offence must be so unnatural that it is monstrous, or else the love you used to declare has gone bad. To believe that of her would need a faith that reason could never give me without a miracle."}, {"t": "sp", "who": "CORDELIA", "lines": ["I yet beseech your majesty,—", "If for I want that glib and oily art", "To speak and purpose not; since what I well intend,", "I'll do't before I speak,—that you make known", "It is no vicious blot, murder, or foulness,", "No unchaste action or dishonour'd step,", "That hath depriv'd me of your grace and favour;", "But even for want of that for which I am richer,—", "A still-soliciting eye, and such a tongue", "As I am glad I have not, though not to have it", "Hath lost me in your liking."], "id": 68, "m": "I still beg your majesty, since I lack that smooth and slippery skill of saying things I don't mean (for what I really intend, I do before I talk about it), that you make it clear it was no wicked stain, murder or foul deed, no unchaste act or dishonourable step, that has robbed me of your grace and favour. It was only because I lack the very things that make me richer for lacking them: an eye always begging for favours, and a tongue I'm glad not to have, even though not having it has cost me your love."}, {"t": "sp", "who": "LEAR", "lines": ["Better thou", "Hadst not been born than not to have pleas'd me better."], "id": 69, "m": "You'd have been better never to have been born than to have displeased me like this."}, {"t": "sp", "who": "FRANCE", "lines": ["Is it but this,—a tardiness in nature", "Which often leaves the history unspoke", "That it intends to do?—My lord of Burgundy,", "What say you to the lady? Love's not love", "When it is mingled with regards that stands", "Aloof from the entire point. Will you have her?", "She is herself a dowry."], "id": 70, "m": "Is that all it is? A natural shyness which often leaves unspoken what it means to do? My Lord of Burgundy, what do you say to the lady? Love isn't love when it's mixed with calculations that have nothing to do with the real point. Will you have her? She is a dowry in herself."}, {"t": "sp", "who": "BURGUNDY", "lines": ["Royal king,", "Give but that portion which yourself propos'd,", "And here I take Cordelia by the hand,", "Duchess of Burgundy."], "id": 71, "m": "Royal king, just give the share you yourself offered, and here and now I'll take Cordelia's hand as Duchess of Burgundy."}, {"t": "sp", "who": "LEAR", "lines": ["Nothing: I have sworn; I am firm."], "id": 72, "m": "Nothing. I have sworn. I won't change."}, {"t": "sp", "who": "BURGUNDY", "lines": ["I am sorry, then, you have so lost a father", "That you must lose a husband."], "id": 73, "m": "I'm sorry, then, that you have lost a father in such a way that you must also lose a husband."}, {"t": "sp", "who": "CORDELIA", "lines": ["Peace be with Burgundy!", "Since that respects of fortune are his love,", "I shall not be his wife."], "id": 74, "m": "Peace be with Burgundy! Since what he loves is wealth and status, I won't be his wife."}, {"t": "sp", "who": "FRANCE", "lines": ["Fairest Cordelia, that art most rich, being poor;", "Most choice, forsaken; and most lov'd, despis'd!", "Thee and thy virtues here I seize upon:", "Be it lawful, I take up what's cast away.", "Gods, gods! 'tis strange that from their cold'st neglect", "My love should kindle to inflam'd respect.—", "Thy dowerless daughter, king, thrown to my chance,", "Is queen of us, of ours, and our fair France:", "Not all the dukes of waterish Burgundy", "Can buy this unpriz'd precious maid of me.—", "Bid them farewell, Cordelia, though unkind:", "Thou losest here, a better where to find."], "id": 75, "m": "Fairest Cordelia, you are richest because you are poor, most precious because you are rejected, and most loved because you are despised! I take you and your virtues here and now. Let it be lawful to pick up what has been thrown away. Gods, gods! It's strange that their coldest neglect should set my love on fire with burning respect. Your daughter without a dowry, king, thrown to me by chance, is queen of me, of all I have, and of fair France. All the dukes of watery Burgundy could not buy this priceless girl from me. Say goodbye to them, Cordelia, unkind as they are. You lose this place, but you'll find a better one."}, {"t": "sp", "who": "LEAR", "lines": ["Thou hast her, France: let her be thine; for we", "Have no such daughter, nor shall ever see", "That face of hers again.—Therefore be gone", "Without our grace, our love, our benison.—", "Come, noble Burgundy."], "id": 76, "m": "You have her, France. Let her be yours, for I have no such daughter and will never see her face again. So go, without my favour, my love or my blessing. Come, noble Burgundy."}, {"t": "sd", "text": "Flourish. Exeunt Lear, Burgundy, Cornwall, Albany, Gloster, and Attendants.", "id": 77}, {"t": "sp", "who": "FRANCE", "lines": ["Bid farewell to your sisters."], "id": 78, "m": "Say goodbye to your sisters."}, {"t": "sp", "who": "CORDELIA", "lines": ["The jewels of our father, with wash'd eyes", "Cordelia leaves you: I know you what you are;", "And, like a sister, am most loath to call", "Your faults as they are nam'd. Love well our father:", "To your professed bosoms I commit him:", "But yet, alas, stood I within his grace,", "I would prefer him to a better place.", "So, farewell to you both."], "id": 79, "m": "You jewels of our father, Cordelia leaves you with tears in her eyes. I know what you are, and as your sister I'm very unwilling to call your faults by their real names. Look after our father well. I trust him to the love you have so publicly declared. But oh, if I were still in his favour, I'd send him to a better place. So, goodbye to you both."}, {"t": "sp", "who": "REGAN", "lines": ["Prescribe not us our duties."], "id": 80, "m": "Don't tell us our duty."}, {"t": "sp", "who": "GONERIL", "lines": ["Let your study", "Be to content your lord, who hath receiv'd you", "At fortune's alms. You have obedience scanted,", "And well are worth the want that you have wanted."], "id": 81, "m": "Concentrate on pleasing your husband, who has taken you as a charity case. You have failed in obedience, and you deserve to go without the love you failed to give."}, {"t": "sp", "who": "CORDELIA", "lines": ["Time shall unfold what plighted cunning hides:", "Who cover faults, at last shame them derides.", "Well may you prosper!"], "id": 82, "m": "Time will reveal what layered cunning hides. Those who cover up their faults will be shamed in the end. I hope you do well!"}, {"t": "sp", "who": "FRANCE", "lines": ["Come, my fair Cordelia."], "id": 83, "m": "Come, my fair Cordelia."}, {"t": "sd", "text": "Exeunt France and Cordelia.", "id": 84}, {"t": "sp", "who": "GONERIL", "lines": ["Sister, it is not little I have to say of what most nearly", "appertains to us both. I think our father will hence to-night."], "id": 85, "m": "Sister, I have a lot to say about things that concern us both closely. I think our father will leave here tonight."}, {"t": "sp", "who": "REGAN", "lines": ["That's most certain, and with you; next month with us."], "id": 86, "m": "That's certain, and he'll go with you. Next month he'll be with us."}, {"t": "sp", "who": "GONERIL", "lines": ["You see how full of changes his age is; the observation we", "have made of it hath not been little: he always loved our", "sister most; and with what poor judgment he hath now cast her", "off appears too grossly."], "id": 87, "m": "You can see how changeable he is in his old age. We've watched it closely. He always loved our sister most, and the poor judgement he's shown in throwing her off is too obvious."}, {"t": "sp", "who": "REGAN", "lines": ["'Tis the infirmity of his age: yet he hath ever but slenderly", "known himself."], "id": 88, "m": "It's the weakness of old age. But he has never really known himself."}, {"t": "sp", "who": "GONERIL", "lines": ["The best and soundest of his time hath been but rash; then must", "we look to receive from his age, not alone the imperfections of", "long-ingraffed condition, but therewithal the unruly waywardness", "that infirm and choleric years bring with them."], "id": 89, "m": "Even at his best and healthiest he was rash. So now we must expect from his old age not only the faults of a long-rooted temper, but also the uncontrollable moodiness that weak and irritable old age brings with it."}, {"t": "sp", "who": "REGAN", "lines": ["Such unconstant starts are we like to have from him as this of", "Kent's banishment."], "id": 90, "m": "We're likely to get sudden fits from him like this banishment of Kent."}, {"t": "sp", "who": "GONERIL", "lines": ["There is further compliment of leave-taking between France and", "him. Pray you let us hit together: if our father carry authority", "with such dispositions as he bears, this last surrender of his", "will but offend us."], "id": 91, "m": "There's more ceremony of farewell going on between him and France. Please, let's act together. If our father keeps using his authority in moods like this, his handing over of power will only harm us."}, {"t": "sp", "who": "REGAN", "lines": ["We shall further think of it."], "id": 92, "m": "We'll think about it further."}, {"t": "sp", "who": "GONERIL", "lines": ["We must do something, and i' th' heat."], "id": 93, "m": "We must do something, and quickly, while the iron is hot."}, {"t": "sd", "text": "Exeunt.", "id": 94}, {"t": "scene", "act": 1, "scene": "II", "loc": "A Hall in the Earl of Gloster's Castle.", "id": 95}, {"t": "sd", "text": "Enter Edmund with a letter.", "id": 96}, {"t": "sp", "who": "EDMUND", "lines": ["Thou, nature, art my goddess; to thy law", "My services are bound. Wherefore should I", "Stand in the plague of custom, and permit", "The curiosity of nations to deprive me,", "For that I am some twelve or fourteen moonshines", "Lag of a brother? Why bastard? wherefore base?", "When my dimensions are as well compact,", "My mind as generous, and my shape as true", "As honest madam's issue? Why brand they us", "With base? with baseness? bastardy? base, base?", "Who, in the lusty stealth of nature, take", "More composition and fierce quality", "Than doth, within a dull, stale, tired bed,", "Go to the creating a whole tribe of fops", "Got 'tween asleep and wake?—Well then,", "Legitimate Edgar, I must have your land:", "Our father's love is to the bastard Edmund", "As to the legitimate: fine word—legitimate!", "Well, my legitimate, if this letter speed,", "And my invention thrive, Edmund the base", "Shall top the legitimate. I grow; I prosper.—", "Now, gods, stand up for bastards!"], "id": 97, "m": "You, Nature, are my goddess. I serve your law, not man's. Why should I suffer under the plague of custom and let the fussy laws of society cut me out, just because I was born twelve or fourteen months after my brother? Why 'bastard'? Why 'base'? My body is as well made, my mind as noble, my looks as true as any honest wife's child. Why do they brand us with 'base', 'baseness', 'bastardy'? Base, base? We, conceived in the lusty secrecy of nature, get more energy and fierce spirit than a whole tribe of idiots made in a dull, stale, tired marriage bed, half asleep. Well then, legitimate Edgar, I must have your land. Our father loves the bastard Edmund as much as the legitimate son. Fine word, 'legitimate'! Well, my legitimate brother, if this letter works and my plan succeeds, Edmund the base will top the legitimate. I grow, I prosper. Now, gods, stand up for bastards!"}, {"t": "sd", "text": "Enter Gloster.", "id": 98}, {"t": "sp", "who": "GLOSTER", "lines": ["Kent banish'd thus! and France in choler parted!", "And the king gone to-night! subscrib'd his pow'r!", "Confin'd to exhibition! All this done", "Upon the gad!—Edmund, how now! What news?"], "id": 99, "m": "Kent banished like that! The King of France gone off in a rage! And the King leaving tonight, his power signed away, reduced to an allowance! All this done on the spur of the moment! Edmund, hello! What's the news?"}, {"t": "sp", "who": "EDMUND", "lines": ["So please your lordship, none."], "id": 100, "m": "If it please your lordship, none."}, {"t": "sd", "text": "Putting up the letter.", "id": 101}, {"t": "sp", "who": "GLOSTER", "lines": ["Why so earnestly seek you to put up that letter?"], "id": 102, "m": "Why are you so eager to put that letter away?"}, {"t": "sp", "who": "EDMUND", "lines": ["I know no news, my lord."], "id": 103, "m": "I know no news, my lord."}, {"t": "sp", "who": "GLOSTER", "lines": ["What paper were you reading?"], "id": 104, "m": "What paper were you reading?"}, {"t": "sp", "who": "EDMUND", "lines": ["Nothing, my lord."], "id": 105, "m": "Nothing, my lord."}, {"t": "sp", "who": "GLOSTER", "lines": ["No? What needed, then, that terrible dispatch of it into your", "pocket? the quality of nothing hath not such need to hide itself.", "Let's see.", "Come, if it be nothing, I shall not need spectacles."], "id": 106, "m": "No? Then why did you need to hurry it into your pocket so frantically? Nothing doesn't need to hide itself like that. Let's see it. Come, if it's nothing, I won't need my glasses."}, {"t": "sp", "who": "EDMUND", "lines": ["I beseech you, sir, pardon me. It is a letter from my brother", "that I have not all o'er-read; and for so much as I have perus'd,", "I find it not fit for your o'erlooking."], "id": 107, "m": "I beg you, sir, forgive me. It's a letter from my brother that I haven't read all the way through, and from what I have read, I don't think it's fit for you to see."}, {"t": "sp", "who": "GLOSTER", "lines": ["Give me the letter, sir."], "id": 108, "m": "Give me the letter, sir."}, {"t": "sp", "who": "EDMUND", "lines": ["I shall offend, either to detain or give it. The contents, as in", "part I understand them, are to blame."], "id": 109, "m": "I'll give offence whether I keep it or give it to you. The contents, as far as I understand them, are wrong."}, {"t": "sp", "who": "GLOSTER", "lines": ["Let's see, let's see!"], "id": 110, "m": "Let's see, let's see!"}, {"t": "sp", "who": "EDMUND", "lines": ["I hope, for my brother's justification, he wrote this but as an", "essay or taste of my virtue."], "id": 111, "m": "I hope, to be fair to my brother, that he only wrote this as a test of my loyalty."}, {"t": "sp", "who": "GLOSTER", "lines": ["[Reads.] 'This policy and reverence of age makes the world", "bitter to the best of our times; keeps our fortunes from us", "till our oldness cannot relish them. I begin to find an idle", "and fond bondage in the oppression of aged tyranny; who sways,", "not as it hath power, but as it is suffered. Come to me, that", "of this I may speak more. If our father would sleep till I", "waked him, you should enjoy half his revenue for ever, and live", "the beloved of your brother,", "'EDGAR.'", "Hum! Conspiracy?—'Sleep till I waked him,—you should enjoy half", "his revenue.'—My son Edgar! Had he a hand to write this? a heart", "and brain to breed it in? When came this to you? who brought it?"], "id": 112, "m": "[Reads] 'This custom of respecting the old makes life bitter for us in our best years, and keeps our inheritance from us until we're too old to enjoy it. I am starting to find it a useless and foolish slavery to be oppressed by old men's tyranny, which rules not because it has power but because we put up with it. Come to me, so I can tell you more. If our father would sleep until I woke him, you would have half his income for ever and be the beloved of your brother, Edgar.' Hmm! A conspiracy? 'Sleep until I woke him... you would have half his income.' My son Edgar! Did he have the hand to write this? A heart and brain to think it up? When did you get this? Who brought it?"}, {"t": "sp", "who": "EDMUND", "lines": ["It was not brought me, my lord, there's the cunning of it; I", "found it thrown in at the casement of my closet."], "id": 113, "m": "No one brought it to me, my lord, that's the cunning of it. I found it thrown in through the window of my room."}, {"t": "sp", "who": "GLOSTER", "lines": ["You know the character to be your brother's?"], "id": 114, "m": "You recognise the handwriting as your brother's?"}, {"t": "sp", "who": "EDMUND", "lines": ["If the matter were good, my lord, I durst swear it were his; but", "in respect of that, I would fain think it were not."], "id": 115, "m": "If what it said were good, my lord, I'd swear it was his. But given what it says, I'd rather think it wasn't."}, {"t": "sp", "who": "GLOSTER", "lines": ["It is his."], "id": 116, "m": "It's his."}, {"t": "sp", "who": "EDMUND", "lines": ["It is his hand, my lord; but I hope his heart is not in the", "contents."], "id": 117, "m": "It is his handwriting, my lord, but I hope his heart isn't in what it says."}, {"t": "sp", "who": "GLOSTER", "lines": ["Hath he never before sounded you in this business?"], "id": 118, "m": "Has he never tested your opinion on this before?"}, {"t": "sp", "who": "EDMUND", "lines": ["Never, my lord: but I have heard him oft maintain it to be fit", "that, sons at perfect age, and fathers declined, the father", "should be as ward to the son, and the son manage his revenue."], "id": 119, "m": "Never, my lord. But I have often heard him argue that when sons are grown up and fathers are in decline, the father should be like the son's ward, and the son should manage his income."}, {"t": "sp", "who": "GLOSTER", "lines": ["O villain, villain!—His very opinion in the letter! Abhorred", "villain!—Unnatural, detested, brutish villain! worse than", "brutish!—Go, sirrah, seek him; I'll apprehend him. Abominable", "villain!—Where is he?"], "id": 120, "m": "Oh, villain, villain! The very idea in the letter! Hateful villain! Unnatural, detestable, brutal villain! Worse than an animal! Go, boy, find him. I'll arrest him. Disgusting villain! Where is he?"}, {"t": "sp", "who": "EDMUND", "lines": ["I do not well know, my lord. If it shall please you to suspend", "your indignation against my brother till you can derive from him", "better testimony of his intent, you should run a certain course;", "where, if you violently proceed against him, mistaking his", "purpose, it would make a great gap in your own honour, and shake", "in pieces the heart of his obedience. I dare pawn down my life", "for him that he hath writ this to feel my affection to your", "honour, and to no other pretence of danger."], "id": 121, "m": "I don't really know, my lord. If you would please hold back your anger against my brother until you have better proof of what he means, you'd be on safe ground. But if you act violently against him and have mistaken his purpose, it would damage your own honour badly and shatter his obedience. I'd bet my life that he only wrote this to test my love for you, and meant no real danger."}, {"t": "sp", "who": "GLOSTER", "lines": ["Think you so?"], "id": 122, "m": "Do you think so?"}, {"t": "sp", "who": "EDMUND", "lines": ["If your honour judge it meet, I will place you where you shall", "hear us confer of this, and by an auricular assurance have your", "satisfaction;", "and that without any further delay than this very evening."], "id": 123, "m": "If you think it right, I'll hide you where you can hear us talk about this, and you'll have proof with your own ears. And without further delay, this very evening."}, {"t": "sp", "who": "GLOSTER", "lines": ["He cannot be such a monster."], "id": 124, "m": "He can't be such a monster."}, {"t": "sp", "who": "EDMUND", "lines": ["Nor is not, sure."], "id": 125, "m": "And surely he isn't."}, {"t": "sp", "who": "GLOSTER", "lines": ["To his father, that so tenderly and entirely loves him.—Heaven", "and earth!—Edmund, seek him out; wind me into him, I pray you:", "frame the business after your own wisdom. I would unstate myself", "to be in a due resolution."], "id": 126, "m": "To his father, who loves him so tenderly and completely! Heaven and earth! Edmund, find him. Worm your way into his trust for me, please. Handle the business as you think best. I would give up my rank and wealth to know the truth for certain."}, {"t": "sp", "who": "EDMUND", "lines": ["I will seek him, sir, presently; convey the business as I shall", "find means, and acquaint you withal."], "id": 127, "m": "I'll find him at once, sir, manage things as best I can, and let you know."}, {"t": "sp", "who": "GLOSTER", "lines": ["These late eclipses in the sun and moon portend no good to us:", "though the wisdom of nature can reason it thus and thus, yet", "nature finds itself scourged by the sequent effects: love cools,", "friendship falls off, brothers divide: in cities, mutinies; in", "countries, discord; in palaces, treason; and the bond cracked", "'twixt son and father. This villain of mine comes under the", "prediction; there's son against father: the king falls from", "bias of nature; there's father against child. We have seen the", "best of our time: machinations, hollowness, treachery, and all", "ruinous disorders follow us disquietly to our graves.—Find out", "this villain, Edmund; it shall lose thee nothing; do it", "carefully.—And the noble and true-hearted Kent banished! his", "offence, honesty!—'Tis strange."], "id": 128, "m": "These recent eclipses of the sun and moon mean no good for us. Though science can explain them this way and that, nature still suffers the effects that follow. Love cools, friendships end, brothers fall out. In cities there are riots, in the countryside quarrels, in palaces treason, and the bond between son and father is broken. This villain of mine fits the prediction: there's son against father. The King goes against his own nature: there's father against child. We have seen the best of our times. Plots, hypocrisy, treachery and every kind of destructive disorder follow us restlessly to our graves. Find this villain, Edmund. You won't lose by it. Do it carefully. And noble, true-hearted Kent banished! His crime, honesty! It's strange."}, {"t": "sd", "text": "Exit.", "id": 129}, {"t": "sp", "who": "EDMUND", "lines": ["This is the excellent foppery of the world, that, when we are", "sick in fortune,—often the surfeit of our own behaviour,—we", "make guilty of our disasters the sun, the moon, and the stars; as", "if we were villains on necessity; fools by heavenly compulsion;", "knaves, thieves, and treachers by spherical pre-dominance;", "drunkards, liars, and adulterers by an enforced obedience of", "planetary influence; and all that we are evil in, by a divine", "thrusting on: an admirable evasion of whoremaster man, to lay his", "goatish disposition to the charge of a star! My father compounded", "with my mother under the dragon's tail, and my nativity was under", "ursa major; so that it follows I am rough and lecherous.—Tut! I", "should have been that I am, had the maidenliest star in the", "firmament twinkled on my bastardizing."], "id": 130, "m": "This is the wonderful stupidity of the world: when things go badly for us, often because of our own excesses, we blame our disasters on the sun, the moon and the stars, as if we were villains by necessity, fools because heaven forced us, rogues, thieves and traitors because of the planets, drunks, liars and adulterers because we had to obey the stars, and evil in everything because a god pushed us. What a marvellous excuse for lecherous man, to blame his goatish lust on a star! My father slept with my mother under the Dragon's Tail, and I was born under the Great Bear, so it follows that I'm rough and lustful. Rubbish! I'd have been what I am if the most virginal star in the sky had twinkled on my illegitimate conception."}, {"t": "sd", "text": "Enter Edgar.", "id": 131}, {"t": "sp", "who": "EDMUND", "cont": 1, "lines": ["Pat!—he comes, like the catastrophe of the old comedy: my cue", "is villainous melancholy, with a sigh like Tom o' Bedlam.—O,", "these eclipses do portend these divisions! fa, sol, la, mi."], "id": 132, "m": "Right on cue, he comes, like the ending of an old comedy. My cue is gloomy melancholy, with a sigh like a madman from Bedlam. Oh, these eclipses predict these divisions! Fa, sol, la, mi."}, {"t": "sp", "who": "EDGAR", "lines": ["How now, brother Edmund! what serious contemplation are you in?"], "id": 133, "m": "Hello, brother Edmund! What are you thinking about so seriously?"}, {"t": "sp", "who": "EDMUND", "lines": ["I am thinking, brother, of a prediction I read this other day,", "what should follow these eclipses."], "id": 134, "m": "I'm thinking, brother, about a prediction I read the other day about what will follow these eclipses."}, {"t": "sp", "who": "EDGAR", "lines": ["Do you busy yourself with that?"], "id": 135, "m": "Do you bother yourself with that?"}, {"t": "sp", "who": "EDMUND", "lines": ["I promise you, the effects he writes of succeed unhappily: as of", "unnaturalness between the child and the parent; death, dearth,", "dissolutions of ancient amities; divisions in state, menaces and", "maledictions against king and nobles; needless diffidences,", "banishment of friends, dissipation of cohorts, nuptial breaches,", "and I know not what."], "id": 136, "m": "I promise you, the effects he writes about are unhappily coming true: unnatural behaviour between child and parent, death, famine, the end of old friendships, divisions in the state, threats and curses against the King and nobles, groundless suspicions, friends banished, armies breaking up, marriages broken, and I don't know what."}, {"t": "sp", "who": "EDGAR", "lines": ["How long have you been a sectary astronomical?"], "id": 137, "m": "How long have you been a follower of astrology?"}, {"t": "sp", "who": "EDMUND", "lines": ["Come, come! when saw you my father last?"], "id": 138, "m": "Come on! When did you last see our father?"}, {"t": "sp", "who": "EDGAR", "lines": ["The night gone by."], "id": 139, "m": "Last night."}, {"t": "sp", "who": "EDMUND", "lines": ["Spake you with him?"], "id": 140, "m": "Did you talk to him?"}, {"t": "sp", "who": "EDGAR", "lines": ["Ay, two hours together."], "id": 141, "m": "Yes, for two hours."}, {"t": "sp", "who": "EDMUND", "lines": ["Parted you in good terms? Found you no displeasure in him by word", "or countenance?"], "id": 142, "m": "Did you part on good terms? Did you notice any displeasure in what he said or how he looked?"}, {"t": "sp", "who": "EDGAR", "lines": ["None at all."], "id": 143, "m": "None at all."}, {"t": "sp", "who": "EDMUND", "lines": ["Bethink yourself wherein you may have offended him: and at my", "entreaty forbear his presence until some little time hath", "qualified the heat of his displeasure; which at this instant so", "rageth in him that with the mischief of your person it would", "scarcely allay."], "id": 144, "m": "Think about how you might have offended him. And please, I beg you, keep away from him until some time has cooled his anger. Right now it's raging so fiercely in him that even hurting you would hardly calm it."}, {"t": "sp", "who": "EDGAR", "lines": ["Some villain hath done me wrong."], "id": 145, "m": "Some villain has lied about me."}, {"t": "sp", "who": "EDMUND", "lines": ["That's my fear. I pray you have a continent forbearance till the", "speed of his rage goes slower; and, as I say, retire with me to", "my lodging, from whence I will fitly bring you to hear my lord", "speak: pray you, go; there's my key.—If you do stir abroad, go", "armed."], "id": 146, "m": "That's what I'm afraid of. Please keep out of his way until his rage slows down. As I say, come with me to my rooms, and from there I'll bring you at the right moment to hear what my lord says. Please, go. Here's my key. If you go out, go armed."}, {"t": "sp", "who": "EDGAR", "lines": ["Armed, brother!"], "id": 147, "m": "Armed, brother?"}, {"t": "sp", "who": "EDMUND", "lines": ["Brother, I advise you to the best; I am no honest man", "if there be any good meaning toward you: I have told you what I", "have seen and heard but faintly; nothing like the image and", "horror of it: pray you, away!"], "id": 148, "m": "Brother, I'm giving you the best advice. I'm no honest man if anyone means you well. I've told you what I've seen and heard, but only faintly, nothing like the horrible reality. Please, go!"}, {"t": "sp", "who": "EDGAR", "lines": ["Shall I hear from you anon?"], "id": 149, "m": "Will I hear from you soon?"}, {"t": "sp", "who": "EDMUND", "lines": ["I do serve you in this business."], "id": 150, "m": "I'm working for you in this business."}, {"t": "sd", "text": "Exit Edgar.", "id": 151}, {"t": "sp", "who": "EDMUND", "cont": 1, "lines": ["A credulous father! and a brother noble,", "Whose nature is so far from doing harms", "That he suspects none; on whose foolish honesty", "My practices ride easy!—I see the business.", "Let me, if not by birth, have lands by wit:", "All with me's meet that I can fashion fit."], "id": 152, "m": "A father who believes anything, and a noble brother whose nature is so far from doing harm that he suspects none! My plots ride easily on his foolish honesty. I see how to do it. If I can't have land by birth, let me have it by cleverness. Anything is right for me if I can make it serve my purpose."}, {"t": "sd", "text": "Exit.", "id": 153}, {"t": "scene", "act": 1, "scene": "III", "loc": "A Room in the Duke of Albany's Palace.", "id": 154}, {"t": "sd", "text": "Enter Goneril and Oswald.", "id": 155}, {"t": "sp", "who": "GONERIL", "lines": ["Did my father strike my gentleman for chiding of his fool?"], "id": 156, "m": "Did my father hit my gentleman for telling off his Fool?"}, {"t": "sp", "who": "OSWALD", "lines": ["Ay, madam."], "id": 157, "m": "Yes, madam."}, {"t": "sp", "who": "GONERIL", "lines": ["By day and night, he wrongs me; every hour", "He flashes into one gross crime or other,", "That sets us all at odds; I'll not endure it:", "His knights grow riotous, and himself upbraids us", "On every trifle.—When he returns from hunting,", "I will not speak with him; say I am sick.—", "If you come slack of former services,", "You shall do well; the fault of it I'll answer."], "id": 158, "m": "Day and night he wrongs me. Every hour he bursts out with some outrageous offence or other that sets us all quarrelling. I won't put up with it. His knights are getting rowdy, and he himself scolds us over every little thing. When he comes back from hunting I won't speak to him. Say I'm ill. If you serve him less well than you used to, you'll be doing right. I'll answer for it."}, {"t": "sp", "who": "OSWALD", "lines": ["He's coming, madam; I hear him."], "id": 159, "m": "He's coming, madam. I can hear him."}, {"t": "sd", "text": "Horns within.", "id": 160}, {"t": "sp", "who": "GONERIL", "lines": ["Put on what weary negligence you please,", "You and your fellows; I'd have it come to question:", "If he distaste it, let him to our sister,", "Whose mind and mine, I know, in that are one,", "Not to be overruled. Idle old man,", "That still would manage those authorities", "That he hath given away!—Now, by my life,", "Old fools are babes again; and must be us'd", "With checks as flatteries,—when they are seen abus'd.", "Remember what I have said."], "id": 161, "m": "Treat him with as much lazy neglect as you like, you and the other servants. I'd like it to come to a showdown. If he doesn't like it, let him go to my sister, who I know agrees with me that we won't be ruled by him. Silly old man, still wanting to use the powers he has given away! I swear, old fools are babies again, and have to be handled with scolding as well as flattery when they misbehave. Remember what I've said."}, {"t": "sp", "who": "OSWALD", "lines": ["Very well, madam."], "id": 162, "m": "Very well, madam."}, {"t": "sp", "who": "GONERIL", "lines": ["And let his knights have colder looks among you;", "What grows of it, no matter; advise your fellows so;", "I would breed from hence occasions, and I shall,", "That I may speak.—I'll write straight to my sister", "To hold my very course.—Prepare for dinner."], "id": 163, "m": "And let his knights get colder looks from all of you. Never mind what comes of it. Tell the others. I want to create chances to speak my mind, and I will. I'll write at once to my sister to take exactly the same line. Get dinner ready."}, {"t": "sd", "text": "Exeunt.", "id": 164}, {"t": "scene", "act": 1, "scene": "IV", "loc": "A Hall in Albany's Palace.", "id": 165}, {"t": "sd", "text": "Enter Kent, disguised.", "id": 166}, {"t": "sp", "who": "KENT", "lines": ["If but as well I other accents borrow,", "That can my speech defuse, my good intent", "May carry through itself to that full issue", "For which I rais'd my likeness.—Now, banish'd Kent,", "If thou canst serve where thou dost stand condemn'd,", "So may it come, thy master, whom thou lov'st,", "Shall find thee full of labours."], "id": 167, "m": "If I can disguise my voice as well as my appearance, my good plan may succeed completely, which is why I changed how I look. Now, banished Kent, if you can serve the man who condemned you, it may turn out that your master, whom you love, will find you hard-working."}, {"t": "sd", "text": "Horns within. Enter King Lear, Knights, and Attendants.", "id": 168}, {"t": "sp", "who": "LEAR", "lines": ["Let me not stay a jot for dinner; go get it ready."], "id": 169, "m": "Don't keep me waiting a moment for dinner. Go and get it ready."}, {"t": "sd", "text": "Exit an Attendant.", "id": 170}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["How now! what art thou?"], "id": 171, "m": "Hello! Who are you?"}, {"t": "sp", "who": "KENT", "lines": ["A man, sir."], "id": 172, "m": "A man, sir."}, {"t": "sp", "who": "LEAR", "lines": ["What dost thou profess? What wouldst thou with us?"], "id": 173, "m": "What do you do? What do you want with me?"}, {"t": "sp", "who": "KENT", "lines": ["I do profess to be no less than I seem; to serve him truly that", "will put me in trust; to love him that is honest; to converse", "with him that is wise and says little; to fear judgment; to fight", "when I cannot choose; and to eat no fish."], "id": 174, "m": "I claim to be no less than I seem: to serve faithfully anyone who trusts me, to love anyone honest, to keep company with anyone wise who says little, to fear judgement, to fight when I have no choice, and to eat no fish."}, {"t": "sp", "who": "LEAR", "lines": ["What art thou?"], "id": 175, "m": "Who are you?"}, {"t": "sp", "who": "KENT", "lines": ["A very honest-hearted fellow, and as poor as the king."], "id": 176, "m": "A very honest-hearted fellow, and as poor as the King."}, {"t": "sp", "who": "LEAR", "lines": ["If thou be'st as poor for a subject as he's for a king, thou art", "poor enough. What wouldst thou?"], "id": 177, "m": "If you're as poor for a subject as he is for a king, you're poor enough. What do you want?"}, {"t": "sp", "who": "KENT", "lines": ["Service."], "id": 178, "m": "To serve."}, {"t": "sp", "who": "LEAR", "lines": ["Who wouldst thou serve?"], "id": 179, "m": "Whom do you want to serve?"}, {"t": "sp", "who": "KENT", "lines": ["You."], "id": 180, "m": "You."}, {"t": "sp", "who": "LEAR", "lines": ["Dost thou know me, fellow?"], "id": 181, "m": "Do you know me, fellow?"}, {"t": "sp", "who": "KENT", "lines": ["No, sir; but you have that in your countenance which I would fain", "call master."], "id": 182, "m": "No, sir, but you have something in your face that I'd like to call master."}, {"t": "sp", "who": "LEAR", "lines": ["What's that?"], "id": 183, "m": "What's that?"}, {"t": "sp", "who": "KENT", "lines": ["Authority."], "id": 184, "m": "Authority."}, {"t": "sp", "who": "LEAR", "lines": ["What services canst thou do?"], "id": 185, "m": "What jobs can you do?"}, {"t": "sp", "who": "KENT", "lines": ["I can keep honest counsel, ride, run, mar a curious tale in", "telling it and deliver a plain message bluntly. That which", "ordinary men are fit for, I am qualified in, and the best of", "me is diligence."], "id": 186, "m": "I can keep a secret, ride, run, spoil an elaborate story by telling it, and deliver a plain message bluntly. I'm qualified for anything ordinary men can do, and the best thing about me is hard work."}, {"t": "sp", "who": "LEAR", "lines": ["How old art thou?"], "id": 187, "m": "How old are you?"}, {"t": "sp", "who": "KENT", "lines": ["Not so young, sir, to love a woman for singing; nor so old to", "dote on her for anything: I have years on my back forty-eight."], "id": 188, "m": "Not so young, sir, that I'd fall for a woman because she sings, and not so old that I'd dote on her for anything. I'm forty-eight."}, {"t": "sp", "who": "LEAR", "lines": ["Follow me; thou shalt serve me. If I like thee no worse after", "dinner, I will not part from thee yet.—Dinner, ho, dinner!—", "Where's my knave? my fool?—Go you and call my fool hither."], "id": 189, "m": "Follow me. You'll serve me. If I don't like you any less after dinner, I won't part with you yet. Dinner, hey, dinner! Where's my boy, my Fool? Go and call my Fool here."}, {"t": "sd", "text": "Exit an attendant.", "id": 190}, {"t": "sd", "text": "Enter Oswald.", "id": 191}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["You, you, sirrah, where's my daughter?"], "id": 192, "m": "You, you, fellow, where's my daughter?"}, {"t": "sp", "who": "OSWALD", "lines": ["So please you,—"], "id": 193, "m": "If you please..."}, {"t": "sd", "text": "Exit.", "id": 194}, {"t": "sp", "who": "LEAR", "lines": ["What says the fellow there? Call the clotpoll back.—"], "id": 195, "m": "What did that fellow say? Call the blockhead back."}, {"t": "sd", "text": "Exit a Knight.", "id": 196}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["Where's my fool, ho?—I think the world's asleep."], "id": 197, "m": "Where's my Fool, hey? I think the whole world's asleep."}, {"t": "sd", "text": "Re-enter Knight.", "id": 198}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["How now! where's that mongrel?"], "id": 199, "m": "Well? Where's that mongrel?"}, {"t": "sp", "who": "KNIGHT", "lines": ["He says, my lord, your daughter is not well."], "id": 200, "m": "He says, my lord, your daughter isn't well."}, {"t": "sp", "who": "LEAR", "lines": ["Why came not the slave back to me when I called him?"], "id": 201, "m": "Why didn't the slave come back when I called him?"}, {"t": "sp", "who": "KNIGHT", "lines": ["Sir, he answered me in the roundest manner, he would not."], "id": 202, "m": "Sir, he told me flatly that he wouldn't."}, {"t": "sp", "who": "LEAR", "lines": ["He would not!"], "id": 203, "m": "He wouldn't!"}, {"t": "sp", "who": "KNIGHT", "lines": ["My lord, I know not what the matter is; but to my judgment your", "highness is not entertained with that ceremonious affection as", "you were wont; there's a great abatement of kindness appears as", "well in the general dependants as in the duke himself also and", "your daughter."], "id": 204, "m": "My lord, I don't know what's going on, but in my opinion your highness is not being treated with the respect and affection you used to be. There's a great drop in kindness, both among the servants and from the Duke himself and your daughter too."}, {"t": "sp", "who": "LEAR", "lines": ["Ha! say'st thou so?"], "id": 205, "m": "Ha! Do you say so?"}, {"t": "sp", "who": "KNIGHT", "lines": ["I beseech you pardon me, my lord, if I be mistaken; for my duty", "cannot be silent when I think your highness wronged."], "id": 206, "m": "Please forgive me, my lord, if I'm wrong, but my duty can't stay silent when I think your highness is being wronged."}, {"t": "sp", "who": "LEAR", "lines": ["Thou but rememberest me of mine own conception: I have perceived", "a most faint neglect of late; which I have rather blamed as mine", "own jealous curiosity than as a very pretence and purpose of", "unkindness: I will look further into't.—But where's my fool? I", "have not seen him this two days."], "id": 207, "m": "You only remind me of what I've been thinking. I've noticed a slight neglect recently, but I've blamed it on my own over-suspicious mind rather than on any real intention to be unkind. I'll look into it further. But where's my Fool? I haven't seen him for two days."}, {"t": "sp", "who": "KNIGHT", "lines": ["Since my young lady's going into France, sir, the fool hath much", "pined away."], "id": 208, "m": "Since my young lady went to France, sir, the Fool has been wasting away with grief."}, {"t": "sp", "who": "LEAR", "lines": ["No more of that; I have noted it well.—Go you and tell my", "daughter I would speak with her.—"], "id": 209, "m": "No more of that. I've noticed it well. Go and tell my daughter I want to speak to her."}, {"t": "sd", "text": "Exit Attendant.", "id": 210}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["Go you, call hither my fool."], "id": 211, "m": "You, go and call my Fool here."}, {"t": "sd", "text": "Exit another Attendant.", "id": 212}, {"t": "sd", "text": "Re-enter Oswald.", "id": 213}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["O, you, sir, you, come you hither, sir: who am I, sir?"], "id": 214, "m": "Oh, you, sir, you, come here, sir. Who am I, sir?"}, {"t": "sp", "who": "OSWALD", "lines": ["My lady's father."], "id": 215, "m": "My lady's father."}, {"t": "sp", "who": "LEAR", "lines": ["My lady's father! my lord's knave: you whoreson dog! you slave!", "you cur!"], "id": 216, "m": "'My lady's father'! My lord's servant, more like! You son-of-a-whore dog! You slave! You cur!"}, {"t": "sp", "who": "OSWALD", "lines": ["I am none of these, my lord; I beseech your pardon."], "id": 217, "m": "I'm none of those, my lord, if you'll excuse me."}, {"t": "sp", "who": "LEAR", "lines": ["Do you bandy looks with me, you rascal?", "[Striking him.]"], "id": 218, "m": "Are you trading looks with me, you rascal? [He strikes him.]"}, {"t": "sp", "who": "OSWALD", "lines": ["I'll not be struck, my lord."], "id": 219, "m": "I won't be hit, my lord."}, {"t": "sp", "who": "KENT", "lines": ["Nor tripp'd neither, you base football player."], "id": 220, "m": "Or tripped either, you low-class football player. [He trips him.]"}, {"t": "sd", "text": "Tripping up his heels.", "id": 221}, {"t": "sp", "who": "LEAR", "lines": ["I thank thee, fellow; thou servest me, and I'll love thee."], "id": 222, "m": "Thank you, fellow. You serve me well, and I'll love you for it."}, {"t": "sp", "who": "KENT", "lines": ["Come, sir, arise, away! I'll teach you differences: away, away!", "If you will measure your lubber's length again, tarry; but away!", "go to; have you wisdom? so."], "id": 223, "m": "Come on, sir, get up, get out! I'll teach you your place. Away, away! If you want to measure your clumsy length on the floor again, stay. Otherwise, get out! Go on. Have you any sense? That's it."}, {"t": "sd", "text": "Pushes Oswald out.", "id": 224}, {"t": "sp", "who": "LEAR", "lines": ["Now, my friendly knave, I thank thee: there's earnest of thy", "service.", "[Giving Kent money.]"], "id": 225, "m": "Now, my friendly servant, thank you. Here's a down payment for your service. [He gives Kent money.]"}, {"t": "sd", "text": "Enter Fool.", "id": 226}, {"t": "sp", "who": "FOOL", "lines": ["Let me hire him too; here's my coxcomb.", "[Giving Kent his cap.]"], "id": 227, "m": "Let me hire him too. Here's my fool's cap. [He gives Kent his cap.]"}, {"t": "sp", "who": "LEAR", "lines": ["How now, my pretty knave! how dost thou?"], "id": 228, "m": "Hello, my pretty boy! How are you?"}, {"t": "sp", "who": "FOOL", "lines": ["Sirrah, you were best take my coxcomb."], "id": 229, "m": "Fellow, you'd better take my fool's cap."}, {"t": "sp", "who": "KENT", "lines": ["Why, fool?"], "id": 230, "m": "Why, Fool?"}, {"t": "sp", "who": "FOOL", "lines": ["Why, for taking one's part that's out of favour. Nay, an thou", "canst not smile as the wind sits, thou'lt catch cold shortly:", "there, take my coxcomb: why, this fellow hath banish'd two on's", "daughters, and did the third a blessing against his will; if", "thou follow him, thou must needs wear my coxcomb.—How now,", "nuncle! Would I had two coxcombs and two daughters!"], "id": 231, "m": "Why? For taking the side of someone out of favour. If you can't smile whichever way the wind blows, you'll soon catch cold. There, take my cap. This fellow has banished two of his daughters and given the third a blessing without meaning to. If you follow him, you must wear a fool's cap. How are you, uncle? I wish I had two fool's caps and two daughters!"}, {"t": "sp", "who": "LEAR", "lines": ["Why, my boy?"], "id": 232, "m": "Why, my boy?"}, {"t": "sp", "who": "FOOL", "lines": ["If I gave them all my living, I'd keep my coxcombs myself.", "There's mine; beg another of thy daughters."], "id": 233, "m": "If I gave them everything I own, I'd keep my fool's caps for myself. There's mine. Go and beg another from your daughters."}, {"t": "sp", "who": "LEAR", "lines": ["Take heed, sirrah,—the whip."], "id": 234, "m": "Careful, boy. Remember the whip."}, {"t": "sp", "who": "FOOL", "lines": ["Truth's a dog must to kennel; he must be whipped out, when", "the lady brach may stand by the fire and stink."], "id": 235, "m": "Truth is a dog that's sent to its kennel. He's whipped out, while Lady the bitch can stand by the fire and stink."}, {"t": "sp", "who": "LEAR", "lines": ["A pestilent gall to me!"], "id": 236, "m": "A constant sore to me!"}, {"t": "sp", "who": "FOOL", "lines": ["Sirrah, I'll teach thee a speech."], "id": 237, "m": "Fellow, I'll teach you a speech."}, {"t": "sp", "who": "LEAR", "lines": ["Do."], "id": 238, "m": "Go on."}, {"t": "sp", "who": "FOOL", "lines": ["Mark it, nuncle:—", "~Have more than thou showest,", "~Speak less than thou knowest,", "~Lend less than thou owest,", "~Ride more than thou goest,", "~Learn more than thou trowest,", "~Set less than thou throwest;", "~Leave thy drink and thy whore,", "~And keep in-a-door,", "~And thou shalt have more", "~Than two tens to a score."], "id": 239, "m": "Listen, uncle: Have more than you show, say less than you know, lend less than you own, ride more than you walk, don't believe everything you hear, don't bet everything on one throw, give up drink and whores and stay indoors, and you'll end up with more than twenty to the score."}, {"t": "sp", "who": "KENT", "lines": ["This is nothing, fool."], "id": 240, "m": "That's nothing, Fool."}, {"t": "sp", "who": "FOOL", "lines": ["Then 'tis like the breath of an unfee'd lawyer,—you gave me", "nothing for't.—Can you make no use of nothing, nuncle?"], "id": 241, "m": "Then it's like the advice of an unpaid lawyer: you gave me nothing for it. Can you make no use of nothing, uncle?"}, {"t": "sp", "who": "LEAR", "lines": ["Why, no, boy; nothing can be made out of nothing."], "id": 242, "m": "Why, no, boy. Nothing can be made out of nothing."}, {"t": "sp", "who": "FOOL", "lines": ["[to Kent] Pr'ythee tell him, so much the rent of his land", "comes to: he will not believe a fool."], "id": 243, "m": "[To Kent] Please tell him that's how much the rent from his land comes to. He won't believe a fool."}, {"t": "sp", "who": "LEAR", "lines": ["A bitter fool!"], "id": 244, "m": "A bitter Fool!"}, {"t": "sp", "who": "FOOL", "lines": ["Dost thou know the difference, my boy, between a bitter fool and", "a sweet one?"], "id": 245, "m": "Do you know the difference, my boy, between a bitter fool and a sweet one?"}, {"t": "sp", "who": "LEAR", "lines": ["No, lad; teach me."], "id": 246, "m": "No, lad. Teach me."}, {"t": "sp", "who": "FOOL", "lines": ["~That lord that counsell'd thee", "~To give away thy land,", "~Come place him here by me,—", "~Do thou for him stand:", "~The sweet and bitter fool", "~Will presently appear;", "~The one in motley here,", "~The other found out there."], "id": 247, "m": "The lord who advised you to give away your land, come and stand him here by me, or you stand in for him. Then the sweet and the bitter fool will appear at once: one here in a fool's costume, the other over there."}, {"t": "sp", "who": "LEAR", "lines": ["Dost thou call me fool, boy?"], "id": 248, "m": "Are you calling me a fool, boy?"}, {"t": "sp", "who": "FOOL", "lines": ["All thy other titles thou hast given away; that thou wast born", "with."], "id": 249, "m": "You've given away all your other titles. That one you were born with."}, {"t": "sp", "who": "KENT", "lines": ["This is not altogether fool, my lord."], "id": 250, "m": "This isn't completely foolish, my lord."}, {"t": "sp", "who": "FOOL", "lines": ["No, faith; lords and great men will not let me: if I had a", "monopoly out, they would have part on't and loads too: they", "will not let me have all the fool to myself; they'll be", "snatching.—Nuncle, give me an egg, and I'll give thee two", "crowns."], "id": 251, "m": "No, really, lords and great men won't let me be. If I had a monopoly on folly, they'd want a share of it, and the ladies too. They won't let me have all the foolishness to myself. They'll keep snatching. Uncle, give me an egg and I'll give you two crowns."}, {"t": "sp", "who": "LEAR", "lines": ["What two crowns shall they be?"], "id": 252, "m": "What two crowns will they be?"}, {"t": "sp", "who": "FOOL", "lines": ["Why, after I have cut the egg i' the middle and eat up the", "meat, the two crowns of the egg. When thou clovest thy crown i'", "the middle and gav'st away both parts, thou borest thine ass on", "thy back o'er the dirt: thou hadst little wit in thy bald crown", "when thou gavest thy golden one away. If I speak like myself in", "this, let him be whipped that first finds it so."], "id": 253, "m": "Why, after I've cut the egg down the middle and eaten the inside, the two crowns of the shell. When you split your crown down the middle and gave both parts away, you carried your donkey on your back over the mud. You had little sense in your bald crown when you gave your golden one away. If I'm talking like a fool in saying this, let whoever thinks so first be whipped."}, {"t": "sd", "text": "Singing.", "id": 254}, {"t": "sp", "who": "FOOL", "cont": 1, "lines": ["~Fools had ne'er less grace in a year;", "~For wise men are grown foppish,", "~And know not how their wits to wear,", "~Their manners are so apish."], "id": 255, "m": "Fools have never been less popular, because wise men have become foolish, don't know how to use their brains, and behave like apes."}, {"t": "sp", "who": "LEAR", "lines": ["When were you wont to be so full of songs, sirrah?"], "id": 256, "m": "Since when have you been so full of songs, fellow?"}, {"t": "sp", "who": "FOOL", "lines": ["I have used it, nuncle, e'er since thou mad'st thy daughters thy", "mothers; for when thou gav'st them the rod, and puttest down", "thine own breeches,"], "id": 257, "m": "I've been at it, uncle, ever since you made your daughters your mothers. For when you gave them the cane and pulled down your own trousers..."}, {"t": "sd", "text": "Singing.", "id": 258}, {"t": "sp", "who": "FOOL", "cont": 1, "lines": ["~Then they for sudden joy did weep,", "~And I for sorrow sung,", "~That such a king should play bo-peep", "~And go the fools among.", "Pr'ythee, nuncle, keep a schoolmaster that can teach thy fool to", "lie; I would fain learn to lie."], "id": 259, "m": "...then they wept for sudden joy, and I sang for sorrow, that such a king should play peekaboo and go among the fools. Please, uncle, get a teacher who can teach your Fool to lie. I'd love to learn to lie."}, {"t": "sp", "who": "LEAR", "lines": ["An you lie, sirrah, we'll have you whipped."], "id": 260, "m": "If you lie, fellow, we'll have you whipped."}, {"t": "sp", "who": "FOOL", "lines": ["I marvel what kin thou and thy daughters are: they'll have me", "whipped for speaking true; thou'lt have me whipped for lying;", "and sometimes I am whipped for holding my peace. I had rather be", "any kind o' thing than a fool: and yet I would not be thee,", "nuncle: thou hast pared thy wit o' both sides, and left nothing", "i' the middle:—here comes one o' the parings."], "id": 261, "m": "I wonder how you and your daughters are related. They'll have me whipped for telling the truth, you'll have me whipped for lying, and sometimes I'm whipped for keeping quiet. I'd rather be anything than a fool. And yet I wouldn't be you, uncle. You've pared your brains away on both sides and left nothing in the middle. Here comes one of the parings."}, {"t": "sd", "text": "Enter Goneril.", "id": 262}, {"t": "sp", "who": "LEAR", "lines": ["How now, daughter? What makes that frontlet on? Methinks you", "are too much of late i' the frown."], "id": 263, "m": "Well, daughter? Why are you wearing that frown like a headband? You've been frowning too much lately."}, {"t": "sp", "who": "FOOL", "lines": ["Thou wast a pretty fellow when thou hadst no need to care for", "her frowning. Now thou art an O without a figure: I am better", "than thou art; I am a fool, thou art nothing.—Yes, forsooth, I", "will hold my tongue. So your face [To Goneril.] bids me, though", "you say nothing. Mum, mum,", "~He that keeps nor crust nor crum,", "~Weary of all, shall want some.—", "[Pointing to Lear.] That's a shealed peascod."], "id": 264, "m": "You were a fine fellow when you didn't need to care about her frowning. Now you're a zero without a number in front of it. I'm better than you are now. I'm a fool; you're nothing. [To Goneril] Yes, all right, I'll hold my tongue. Your face tells me to, even though you say nothing. Mum, mum. He who keeps neither crust nor crumb, tired of everything, will need some. [Pointing to Lear] That's an empty pea-pod."}, {"t": "sp", "who": "GONERIL", "lines": ["Not only, sir, this your all-licens'd fool,", "But other of your insolent retinue", "Do hourly carp and quarrel; breaking forth", "In rank and not-to-be-endured riots. Sir,", "I had thought, by making this well known unto you,", "To have found a safe redress; but now grow fearful,", "By what yourself too late have spoke and done,", "That you protect this course, and put it on", "By your allowance; which if you should, the fault", "Would not scape censure, nor the redresses sleep,", "Which, in the tender of a wholesome weal,", "Might in their working do you that off
