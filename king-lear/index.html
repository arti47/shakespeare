ack his final decision. [To an officer, who leaves.]"}, {"t": "sp", "who": "REGAN", "lines": ["Our sister's man is certainly miscarried."], "id": 1119, "m": "Our sister's servant has certainly come to some harm."}, {"t": "sp", "who": "EDMUND", "lines": ["Tis to be doubted, madam."], "id": 1120, "m": "That's to be feared, madam."}, {"t": "sp", "who": "REGAN", "lines": ["Now, sweet lord,", "You know the goodness I intend upon you:", "Tell me,—but truly,—but then speak the truth,", "Do you not love my sister?"], "id": 1121, "m": "Now, sweet lord, you know the good things I intend for you. Tell me, but truthfully, tell me the truth: don't you love my sister?"}, {"t": "sp", "who": "EDMUND", "lines": ["In honour'd love."], "id": 1122, "m": "With an honourable love."}, {"t": "sp", "who": "REGAN", "lines": ["But have you never found my brother's way", "To the forfended place?"], "id": 1123, "m": "But have you never found your way into my brother-in-law's place, the forbidden place?"}, {"t": "sp", "who": "EDMUND", "lines": ["That thought abuses you."], "id": 1124, "m": "That thought dishonours you."}, {"t": "sp", "who": "REGAN", "lines": ["I am doubtful that you have been conjunct", "And bosom'd with her, as far as we call hers."], "id": 1125, "m": "I suspect you've been joined with her and intimate with her, as far as anything can be called hers."}, {"t": "sp", "who": "EDMUND", "lines": ["No, by mine honour, madam."], "id": 1126, "m": "No, on my honour, madam."}, {"t": "sp", "who": "REGAN", "lines": ["I never shall endure her: dear my lord,", "Be not familiar with her."], "id": 1127, "m": "I'll never put up with her. My dear lord, don't be familiar with her."}, {"t": "sp", "who": "EDMUND", "lines": ["Fear me not:—", "She and the duke her husband!"], "id": 1128, "m": "Don't worry about me. Here she comes with the Duke her husband!"}, {"t": "sd", "text": "Enter, with drum and colours, Albany, Goneril, and Soldiers.", "id": 1129}, {"t": "sp", "who": "GONERIL", "lines": ["[Aside.] I had rather lose the battle than that sister", "Should loosen him and me."], "id": 1130, "m": "[Aside] I'd rather lose the battle than let that sister come between him and me."}, {"t": "sp", "who": "ALBANY", "lines": ["Our very loving sister, well be-met.—", "Sir, this I heard,—the king is come to his daughter,", "With others whom the rigour of our state", "Forc'd to cry out. Where I could not be honest,", "I never yet was valiant: for this business,", "It toucheth us, as France invades our land,", "Not bolds the king, with others whom, I fear,", "Most just and heavy causes make oppose."], "id": 1131, "m": "Our most loving sister, it's good to meet you. Sir, I've heard this: the King has gone to his daughter, with others whom the harshness of our rule forced to protest. Where I can't be honest, I've never been brave. As for this business, it concerns us because France is invading our land, not because he is encouraging the King and others who, I fear, have very just and serious reasons to oppose us."}, {"t": "sp", "who": "EDMUND", "lines": ["Sir, you speak nobly."], "id": 1132, "m": "Sir, you speak nobly."}, {"t": "sp", "who": "REGAN", "lines": ["Why is this reason'd?"], "id": 1133, "m": "Why are we arguing about this?"}, {"t": "sp", "who": "GONERIL", "lines": ["Combine together 'gainst the enemy;", "For these domestic and particular broils", "Are not the question here."], "id": 1134, "m": "Let's unite against the enemy. These family and private quarrels are not the issue here."}, {"t": "sp", "who": "ALBANY", "lines": ["Let's, then, determine", "With the ancient of war on our proceeding."], "id": 1135, "m": "Then let's decide our plans with the experienced officers."}, {"t": "sp", "who": "EDMUND", "lines": ["I shall attend you presently at your tent."], "id": 1136, "m": "I'll join you shortly at your tent."}, {"t": "sp", "who": "REGAN", "lines": ["Sister, you'll go with us?"], "id": 1137, "m": "Sister, will you come with us?"}, {"t": "sp", "who": "GONERIL", "lines": ["No."], "id": 1138, "m": "No."}, {"t": "sp", "who": "REGAN", "lines": ["'Tis most convenient; pray you, go with us."], "id": 1139, "m": "It's most fitting. Please come with us."}, {"t": "sp", "who": "GONERIL", "lines": ["[Aside.] O, ho, I know the riddle.—I will go."], "id": 1140, "m": "[Aside] Oh, ho, I see what's behind this. [Aloud] I'll come."}, {"t": "sd", "text": "As they are going out, enter Edgar disguised.", "id": 1141}, {"t": "sp", "who": "EDGAR", "lines": ["If e'er your grace had speech with man so poor,", "Hear me one word."], "id": 1142, "m": "If your grace has ever spoken to a man as poor as me, hear one word from me."}, {"t": "sp", "who": "ALBANY", "lines": ["I'll overtake you.—Speak."], "id": 1143, "m": "I'll catch you up. Speak."}, {"t": "sd", "text": "Exeunt Edmund, Regan, Goneril, Officers, Soldiers, and Attendants.", "id": 1144}, {"t": "sp", "who": "EDGAR", "lines": ["Before you fight the battle, ope this letter.", "If you have victory, let the trumpet sound", "For him that brought it: wretched though I seem,", "I can produce a champion that will prove", "What is avouched there. If you miscarry,", "Your business of the world hath so an end,", "And machination ceases. Fortune love you!"], "id": 1145, "m": "Before you fight the battle, open this letter. If you win, let the trumpet sound for the man who brought it. Wretched as I look, I can produce a champion who will prove what it says. If you lose, your business in the world is over, and all plotting stops. May fortune love you!"}, {"t": "sp", "who": "ALBANY", "lines": ["Stay till I have read the letter."], "id": 1146, "m": "Wait until I've read the letter."}, {"t": "sp", "who": "EDGAR", "lines": ["I was forbid it.", "When time shall serve, let but the herald cry,", "And I'll appear again."], "id": 1147, "m": "I was told not to. When the time is right, just let the herald call, and I'll appear again."}, {"t": "sp", "who": "ALBANY", "lines": ["Why, fare thee well: I will o'erlook thy paper."], "id": 1148, "m": "Well, goodbye. I'll read your paper."}, {"t": "sd", "text": "Exit Edgar.", "id": 1149}, {"t": "sd", "text": "Re-enter Edmund.", "id": 1150}, {"t": "sp", "who": "EDMUND", "lines": ["The enemy's in view; draw up your powers.", "Here is the guess of their true strength and forces", "By diligent discovery;—but your haste", "Is now urg'd on you."], "id": 1151, "m": "The enemy is in sight. Get your army into position. Here's an estimate of their real strength and forces, from careful scouting. But now you must hurry."}, {"t": "sp", "who": "ALBANY", "lines": ["We will greet the time."], "id": 1152, "m": "We'll be ready when the time comes."}, {"t": "sd", "text": "Exit.", "id": 1153}, {"t": "sp", "who": "EDMUND", "lines": ["To both these sisters have I sworn my love;", "Each jealous of the other, as the stung", "Are of the adder. Which of them shall I take?", "Both? one? or neither? Neither can be enjoy'd,", "If both remain alive: to take the widow", "Exasperates, makes mad her sister Goneril;", "And hardly shall I carry out my side,", "Her husband being alive. Now, then, we'll use", "His countenance for the battle; which being done,", "Let her who would be rid of him devise", "His speedy taking off. As for the mercy", "Which he intends to Lear and to Cordelia,—", "The battle done, and they within our power,", "Shall never see his pardon: for my state", "Stands on me to defend, not to debate."], "id": 1154, "m": "I've sworn my love to both these sisters. Each is suspicious of the other, as people who've been stung are of the snake. Which of them shall I take? Both? One? Neither? Neither can be enjoyed if both are still alive. Taking the widow will enrage and madden her sister Goneril, and I'll hardly be able to win my side of the game while her husband is alive. So for now we'll use his authority for the battle. When that's over, let her who wants to be rid of him think up a way to get rid of him quickly. As for the mercy he intends to show Lear and Cordelia, once the battle is over and they're in our power, they'll never see his pardon. My position depends on me defending it, not debating it."}, {"t": "sd", "text": "Exit.", "id": 1155}, {"t": "scene", "act": 5, "scene": "II", "loc": "A field between the two Camps.", "id": 1156}, {"t": "sd", "text": "Alarum within. Enter, with drum and colours, Lear, Cordelia, and their Forces, and exeunt.", "id": 1157}, {"t": "sd", "text": "Enter Edgar and Gloster.", "id": 1158}, {"t": "sp", "who": "EDGAR", "lines": ["Here, father, take the shadow of this tree", "For your good host; pray that the right may thrive:", "If ever I return to you again,", "I'll bring you comfort."], "id": 1159, "m": "Here, father, take the shade of this tree as your good host. Pray that the right side wins. If I ever come back to you, I'll bring you comfort."}, {"t": "sp", "who": "GLOSTER", "lines": ["Grace go with you, sir!"], "id": 1160, "m": "God go with you, sir!"}, {"t": "sd", "text": "Exit Edgar", "id": 1161}, {"t": "sd", "text": "Alarum and retreat within. R-enter Edgar.", "id": 1162}, {"t": "sp", "who": "EDGAR", "lines": ["Away, old man,—give me thy hand,—away!", "King Lear hath lost, he and his daughter ta'en:", "Give me thy hand; come on!"], "id": 1163, "m": "Away, old man! Give me your hand. Away! King Lear has lost. He and his daughter are captured. Give me your hand. Come on!"}, {"t": "sp", "who": "GLOSTER", "lines": ["No further, sir; a man may rot even here."], "id": 1164, "m": "No further, sir. A man can rot here as well as anywhere."}, {"t": "sp", "who": "EDGAR", "lines": ["What, in ill thoughts again? Men must endure", "Their going hence, even as their coming hither;", "Ripeness is all:—come on."], "id": 1165, "m": "What, gloomy thoughts again? Men must put up with their leaving this world, just as with their coming into it. Being ready is everything. Come on."}, {"t": "sp", "who": "GLOSTER", "lines": ["And that's true too."], "id": 1166, "m": "And that's true too."}, {"t": "sd", "text": "Exeunt.", "id": 1167}, {"t": "scene", "act": 5, "scene": "III", "loc": "The British Camp near Dover.", "id": 1168}, {"t": "sd", "text": "Enter, in conquest, with drum and colours, Edmund; Lear and Cordelia prisoners; Officers, Soldiers, &c.", "id": 1169}, {"t": "sp", "who": "EDMUND", "lines": ["Some officers take them away: good guard", "Until their greater pleasures first be known", "That are to censure them."], "id": 1170, "m": "Some officers take them away. Guard them well until the wishes of those greater people who will judge them are known."}, {"t": "sp", "who": "CORDELIA", "lines": ["We are not the first", "Who with best meaning have incurr'd the worst.", "For thee, oppressed king, am I cast down;", "Myself could else out-frown false fortune's frown.—", "Shall we not see these daughters and these sisters?"], "id": 1171, "m": "We are not the first who have met the worst while meaning the best. It's for you, oppressed King, that I am cast down. On my own I could outface false fortune's frown. Shall we not see these daughters and these sisters?"}, {"t": "sp", "who": "LEAR", "lines": ["No, no, no, no! Come, let's away to prison:", "We two alone will sing like birds i' the cage:", "When thou dost ask me blessing I'll kneel down", "And ask of thee forgiveness: so we'll live,", "And pray, and sing, and tell old tales, and laugh", "At gilded butterflies, and hear poor rogues", "Talk of court news; and we'll talk with them too,—", "Who loses and who wins; who's in, who's out;—", "And take upon's the mystery of things,", "As if we were God's spies: and we'll wear out,", "In a wall'd prison, packs and sects of great ones", "That ebb and flow by the moon."], "id": 1172, "m": "No, no, no, no! Come, let's go to prison. We two alone will sing like birds in a cage. When you ask me for a blessing, I'll kneel down and ask you for forgiveness. So we'll live, and pray, and sing, and tell old stories, and laugh at the courtiers in their gilded clothes like butterflies, and hear poor wretches talk about court news. And we'll talk with them too, about who's losing and who's winning, who's in favour and who's out, and take on ourselves the mystery of things, as if we were God's spies. And in a walled prison we'll outlast the gangs and factions of great people, who rise and fall like the tides with the moon."}, {"t": "sp", "who": "EDMUND", "lines": ["Take them away."], "id": 1173, "m": "Take them away."}, {"t": "sp", "who": "LEAR", "lines": ["Upon such sacrifices, my Cordelia,", "The gods themselves throw incense. Have I caught thee?", "He that parts us shall bring a brand from heaven", "And fire us hence like foxes. Wipe thine eyes;", "The goodyears shall devour them, flesh and fell,", "Ere they shall make us weep: we'll see 'em starve first.", "Come."], "id": 1174, "m": "On sacrifices like these, my Cordelia, the gods themselves throw incense. Have I caught you? Anyone who parts us will have to bring a burning torch from heaven and smoke us out like foxes. Wipe your eyes. The plague will devour them, flesh and skin, before they make us weep. We'll see them starve first. Come."}, {"t": "sd", "text": "Exeunt Lear and Cordelia, guarded.", "id": 1175}, {"t": "sp", "who": "EDMUND", "lines": ["Come hither, captain; hark.", "Take thou this note [giving a paper]; go follow them to prison:", "One step I have advanc'd thee; if thou dost", "As this instructs thee, thou dost make thy way", "To noble fortunes: know thou this,—that men", "Are as the time is: to be tender-minded", "Does not become a sword:—thy great employment", "Will not bear question; either say thou'lt do't,", "Or thrive by other means."], "id": 1176, "m": "Come here, captain. Listen. Take this note [giving him a paper]. Follow them to prison. I've promoted you one step already. If you do what this tells you, you'll make your way to great fortune. Understand this: men must be like the times they live in. Being soft-hearted doesn't suit a soldier. Your important task allows no questions. Either say you'll do it, or find another way to get on."}, {"t": "sp", "who": "CAPTAIN", "lines": ["I'll do't, my lord."], "id": 1177, "m": "I'll do it, my lord."}, {"t": "sp", "who": "EDMUND", "lines": ["About it; and write happy when thou hast done.", "Mark,—I say, instantly; and carry it so", "As I have set it down."], "id": 1178, "m": "Get on with it, and count yourself lucky when you've done it. Note, I say at once, and do it exactly as I've written it down."}, {"t": "sp", "who": "CAPTAIN", "lines": ["I cannot draw a cart, nor eat dried oats;", "If it be man's work, I'll do't."], "id": 1179, "m": "I can't pull a cart or eat dried oats. If it's a man's work, I'll do it."}, {"t": "sd", "text": "Exit.", "id": 1180}, {"t": "sd", "text": "Flourish. Enter Albany, Goneril, Regan, Officers, and Attendants.", "id": 1181}, {"t": "sp", "who": "ALBANY", "lines": ["Sir, you have show'd to-day your valiant strain,", "And fortune led you well: you have the captives", "Who were the opposites of this day's strife:", "We do require them of you, so to use them", "As we shall find their merits and our safety", "May equally determine."], "id": 1182, "m": "Sir, you've shown your brave nature today, and fortune led you well. You have the captives who were our opponents in today's fight. We require you to hand them over, so we can treat them as their deserts and our safety equally decide."}, {"t": "sp", "who": "EDMUND", "lines": ["Sir, I thought it fit", "To send the old and miserable king", "To some retention and appointed guard;", "Whose age has charms in it, whose title more,", "To pluck the common bosom on his side,", "And turn our impress'd lances in our eyes", "Which do command them. With him I sent the queen;", "My reason all the same; and they are ready", "To-morrow, or at further space, to appear", "Where you shall hold your session. At this time", "We sweat and bleed: the friend hath lost his friend;", "And the best quarrels, in the heat, are curs'd", "By those that feel their sharpness:—", "The question of Cordelia and her father", "Requires a fitter place."], "id": 1183, "m": "Sir, I thought it right to send the old and miserable King to be kept under a chosen guard. His age has a power, and his title even more, to win the hearts of the common people to his side and turn the lances of the soldiers we've conscripted against our own eyes, though we command them. I sent the Queen with him for the same reason. They'll be ready tomorrow, or later, to appear wherever you hold your trial. At this moment we are sweating and bleeding. Friends have lost friends, and even the best causes, in the heat of the moment, are cursed by those who feel their sharpness. The question of Cordelia and her father needs a more suitable place."}, {"t": "sp", "who": "ALBANY", "lines": ["Sir, by your patience,", "I hold you but a subject of this war,", "Not as a brother."], "id": 1184, "m": "Sir, if you'll excuse me, I regard you only as a subordinate in this war, not as an equal."}, {"t": "sp", "who": "REGAN", "lines": ["That's as we list to grace him.", "Methinks our pleasure might have been demanded", "Ere you had spoke so far. He led our powers;", "Bore the commission of my place and person;", "The which immediacy may well stand up", "And call itself your brother."], "id": 1185, "m": "That depends on how we choose to honour him. I think you might have asked what I wanted before you said so much. He led my armies and carried the authority of my rank and person. Being so closely connected with me, he may well stand up and call himself your brother."}, {"t": "sp", "who": "GONERIL", "lines": ["Not so hot:", "In his own grace he doth exalt himself,", "More than in your addition."], "id": 1186, "m": "Not so fast. He's raised high by his own merit, more than by the titles you give him."}, {"t": "sp", "who": "REGAN", "lines": ["In my rights", "By me invested, he compeers the best."], "id": 1187, "m": "With my rights, which I've given him, he is equal to the best."}, {"t": "sp", "who": "GONERIL", "lines": ["That were the most if he should husband you."], "id": 1188, "m": "That would be most true if he married you."}, {"t": "sp", "who": "REGAN", "lines": ["Jesters do oft prove prophets."], "id": 1189, "m": "Jokers often turn out to be prophets."}, {"t": "sp", "who": "GONERIL", "lines": ["Holla, holla!", "That eye that told you so look'd but asquint."], "id": 1190, "m": "Hey, hey! The eye that told you that was squinting."}, {"t": "sp", "who": "REGAN", "lines": ["Lady, I am not well; else I should answer", "From a full-flowing stomach.—General,", "Take thou my soldiers, prisoners, patrimony;", "Dispose of them, of me; the walls are thine:", "Witness the world that I create thee here", "My lord and master."], "id": 1191, "m": "Lady, I'm not well, or I'd answer you with all my anger. General, take my soldiers, prisoners and inheritance. Do what you like with them, and with me. The fortress of my heart is yours. Let the world witness that I make you my lord and master here."}, {"t": "sp", "who": "GONERIL", "lines": ["Mean you to enjoy him?"], "id": 1192, "m": "Do you intend to have him?"}, {"t": "sp", "who": "ALBANY", "lines": ["The let-alone lies not in your good will."], "id": 1193, "m": "Stopping it isn't up to you."}, {"t": "sp", "who": "EDMUND", "lines": ["Nor in thine, lord."], "id": 1194, "m": "Nor up to you, lord."}, {"t": "sp", "who": "ALBANY", "lines": ["Half-blooded fellow, yes."], "id": 1195, "m": "Half-blooded bastard, yes it is."}, {"t": "sp", "who": "REGAN", "lines": ["[To Edmund.] Let the drum strike, and prove my title thine."], "id": 1196, "m": "[To Edmund] Let the drum beat and prove that my title is yours."}, {"t": "sp", "who": "ALBANY", "lines": ["Stay yet; hear reason.—Edmund, I arrest thee", "On capital treason; and, in thine arrest,", "This gilded serpent [pointing to Goneril.],—For your claim, fair", "sister,", "I bar it in the interest of my wife;", "'Tis she is subcontracted to this lord,", "And I, her husband, contradict your bans.", "If you will marry, make your loves to me,—", "My lady is bespoke."], "id": 1197, "m": "Wait. Listen to reason. Edmund, I arrest you for high treason, and along with you this gilded snake [pointing to Goneril]. As for your claim, fair sister, I block it on behalf of my wife. She's already engaged to this lord, and I, her husband, object to your marriage. If you want to marry, court me. My lady is already spoken for."}, {"t": "sp", "who": "GONERIL", "lines": ["An interlude!"], "id": 1198, "m": "What a farce!"}, {"t": "sp", "who": "ALBANY", "lines": ["Thou art arm'd, Gloster:—let the trumpet sound:", "If none appear to prove upon thy person", "Thy heinous, manifest, and many treasons,", "There is my pledge [throwing down a glove]; I'll prove it on thy", "heart,", "Ere I taste bread, thou art in nothing less", "Than I have here proclaim'd thee."], "id": 1199, "m": "You are armed, Gloster. Let the trumpet sound. If no one appears to prove your terrible, obvious and many treasons on your body, there's my challenge [throwing down a glove]. I'll prove on your heart, before I eat bread again, that you are everything I've declared you to be."}, {"t": "sp", "who": "REGAN", "lines": ["Sick, O, sick!"], "id": 1200, "m": "Sick, oh, sick!"}, {"t": "sp", "who": "GONERIL", "lines": ["[Aside.] If not, I'll ne'er trust medicine."], "id": 1201, "m": "[Aside] If you weren't, I'd never trust poison again."}, {"t": "sp", "who": "EDMUND", "lines": ["There's my exchange [throwing down a glove]: what in the world he", "is", "That names me traitor, villain-like he lies:", "Call by thy trumpet: he that dares approach,", "On him, on you, who not? I will maintain", "My truth and honour firmly."], "id": 1202, "m": "There's my answer [throwing down a glove]. Whoever in the world calls me a traitor lies like a villain. Call with your trumpet. Whoever dares come forward, him, or you, or anyone, I'll defend my truth and honour firmly."}, {"t": "sp", "who": "ALBANY", "lines": ["A herald, ho!"], "id": 1203, "m": "A herald, hey!"}, {"t": "sp", "who": "EDMUND", "lines": ["A herald, ho, a herald!"], "id": 1204, "m": "A herald, hey, a herald!"}, {"t": "sp", "who": "ALBANY", "lines": ["Trust to thy single virtue; for thy soldiers,", "All levied in my name, have in my name", "Took their discharge."], "id": 1205, "m": "Rely on your own courage alone, because your soldiers, all recruited in my name, have been dismissed in my name."}, {"t": "sp", "who": "REGAN", "lines": ["My sickness grows upon me."], "id": 1206, "m": "My sickness is getting worse."}, {"t": "sp", "who": "ALBANY", "lines": ["She is not well. Convey her to my tent."], "id": 1207, "m": "She isn't well. Take her to my tent."}, {"t": "sd", "text": "Exit Regan, led.", "id": 1208}, {"t": "sd", "text": "Enter a Herald.", "id": 1209}, {"t": "sp", "who": "ALBANY", "cont": 1, "lines": ["Come hither, herald.—Let the trumpet sound,—", "And read out this."], "id": 1210, "m": "Come here, herald. Let the trumpet sound, and read this out."}, {"t": "sp", "who": "OFFICER", "lines": ["Sound, trumpet!"], "id": 1211, "m": "Sound, trumpet!"}, {"t": "sd", "text": "A trumpet sounds.", "id": 1212}, {"t": "sp", "who": "HERALD", "lines": ["[Reads.] 'If any man of quality or degree within the lists of", "the army will maintain upon Edmund, supposed Earl of Gloster,", "that he is a manifold traitor, let him appear by the third sound", "of the trumpet. He is bold in his defence.'"], "id": 1213, "m": "[Reads] 'If any man of rank or position in the army will declare that Edmund, so-called Earl of Gloster, is a traitor many times over, let him appear by the third sound of the trumpet. Edmund is ready to defend himself.'"}, {"t": "sp", "who": "EDMUND", "lines": ["Sound!"], "id": 1214, "m": "Sound!"}, {"t": "sd", "text": "First trumpet.", "id": 1215}, {"t": "sp", "who": "HERALD", "lines": ["Again!"], "id": 1216, "m": "Again!"}, {"t": "sd", "text": "Second trumpet.", "id": 1217}, {"t": "sp", "who": "HERALD", "lines": ["Again!"], "id": 1218, "m": "Again!"}, {"t": "sd", "text": "Third trumpet. Trumpet answers within. Enter Edgar, armed, preceded by a trumpet.", "id": 1219}, {"t": "sp", "who": "ALBANY", "lines": ["Ask him his purposes, why he appears", "Upon this call o' the trumpet."], "id": 1220, "m": "Ask him what he wants, and why he appears at this call of the trumpet."}, {"t": "sp", "who": "HERALD", "lines": ["What are you?", "Your name, your quality? and why you answer", "This present summons?"], "id": 1221, "m": "Who are you? Your name, your rank? And why do you answer this summons?"}, {"t": "sp", "who": "EDGAR", "lines": ["Know, my name is lost;", "By treason's tooth bare-gnawn and canker-bit.", "Yet am I noble as the adversary", "I come to cope."], "id": 1222, "m": "Know that my name is lost, gnawed bare and eaten away by the tooth of treason. Yet I'm as noble as the opponent I come to fight."}, {"t": "sp", "who": "ALBANY", "lines": ["Which is that adversary?"], "id": 1223, "m": "Who is that opponent?"}, {"t": "sp", "who": "EDGAR", "lines": ["What's he that speaks for Edmund Earl of Gloster?"], "id": 1224, "m": "Who speaks for Edmund, Earl of Gloster?"}, {"t": "sp", "who": "EDMUND", "lines": ["Himself:—what say'st thou to him?"], "id": 1225, "m": "He himself. What do you say to him?"}, {"t": "sp", "who": "EDGAR", "lines": ["Draw thy sword,", "That, if my speech offend a noble heart,", "Thy arm may do thee justice: here is mine.", "Behold, it is the privilege of mine honours,", "My oath, and my profession: I protest,—", "Maugre thy strength, youth, place, and eminence,", "Despite thy victor sword and fire-new fortune,", "Thy valour and thy heart,—thou art a traitor;", "False to thy gods, thy brother, and thy father;", "Conspirant 'gainst this high illustrious prince;", "And, from the extremest upward of thy head", "To the descent and dust beneath thy foot,", "A most toad-spotted traitor. Say thou 'No,'", "This sword, this arm, and my best spirits are bent", "To prove upon thy heart, whereto I speak,", "Thou liest."], "id": 1226, "m": "Draw your sword, so that if my words offend a noble heart, your arm can win you justice. Here is mine. Look, it is my right as a knight, by my oath and my profession, to declare this: in spite of your strength, youth, position and high rank, in spite of your victorious sword and brand-new fortune, your courage and your spirit, you are a traitor. False to your gods, your brother and your father, a conspirator against this noble and illustrious prince, and from the very top of your head to the dust beneath your feet, a traitor spotted with venom like a toad. If you say 'No', this sword, this arm and all my courage are ready to prove on your heart, which I'm speaking to, that you lie."}, {"t": "sp", "who": "EDMUND", "lines": ["In wisdom I should ask thy name;", "But since thy outside looks so fair and warlike,", "And that thy tongue some say of breeding breathes,", "What safe and nicely I might well delay", "By rule of knighthood, I disdain and spurn:", "Back do I toss those treasons to thy head;", "With the hell-hated lie o'erwhelm thy heart;", "Which,—for they yet glance by and scarcely bruise,—", "This sword of mine shall give them instant way,", "Where they shall rest for ever.—Trumpets, speak!"], "id": 1227, "m": "Wisdom says I should ask your name. But since you look so fine and warlike, and your speech shows some sign of good breeding, I scorn and reject the delay I could safely and properly claim under the rules of knighthood. I throw those accusations of treason back at your head, and crush your heart with the hellish lie. Since they only glance off and hardly bruise, this sword of mine will open a way for them straight into your heart, where they'll stay for ever. Trumpets, sound!"}, {"t": "sd", "text": "Alarums. They fight. Edmund falls.", "id": 1228}, {"t": "sp", "who": "ALBANY", "lines": ["Save him, save him!"], "id": 1229, "m": "Spare him, spare him!"}, {"t": "sp", "who": "GONERIL", "lines": ["This is mere practice, Gloster:", "By the law of arms thou wast not bound to answer", "An unknown opposite; thou art not vanquish'd,", "But cozen'd and beguil'd."], "id": 1230, "m": "This is just a trick, Gloster. By the laws of combat you weren't obliged to fight an unknown opponent. You haven't been defeated, but cheated and tricked."}, {"t": "sp", "who": "ALBANY", "lines": ["Shut your mouth, dame,", "Or with this paper shall I stop it:—Hold, sir;", "Thou worse than any name, read thine own evil:—", "No tearing, lady; I perceive you know it."], "id": 1231, "m": "Shut your mouth, woman, or I'll stop it with this paper. Wait, sir. You, worse than any name, read about your own evil. Don't tear it, lady. I see you know it."}, {"t": "sd", "text": "Gives the letter to Edmund.", "id": 1232}, {"t": "sp", "who": "GONERIL", "lines": ["Say if I do,—the laws are mine, not thine:", "Who can arraign me for't?"], "id": 1233, "m": "What if I do? The laws are mine, not yours. Who can put me on trial for it?"}, {"t": "sp", "who": "ALBANY", "lines": ["Most monstrous!", "Know'st thou this paper?"], "id": 1234, "m": "Most monstrous! Do you know this paper?"}, {"t": "sp", "who": "GONERIL", "lines": ["Ask me not what I know."], "id": 1235, "m": "Don't ask me what I know."}, {"t": "sd", "text": "Exit.", "id": 1236}, {"t": "sp", "who": "ALBANY", "lines": ["Go after her: she's desperate; govern her.", "[To an Officer, who goes out.]"], "id": 1237, "m": "Go after her. She's desperate. Keep her under control. [To an officer, who leaves.]"}, {"t": "sp", "who": "EDMUND", "lines": ["What, you have charg'd me with, that have I done;", "And more, much more; the time will bring it out:", "'Tis past, and so am I.—But what art thou", "That hast this fortune on me? If thou'rt noble,", "I do forgive thee."], "id": 1238, "m": "What you've accused me of, I have done, and more, much more. Time will reveal it. It's in the past, and so am I. But who are you, who have won this fortune over me? If you're noble, I forgive you."}, {"t": "sp", "who": "EDGAR", "lines": ["Let's exchange charity.", "I am no less in blood than thou art, Edmund;", "If more, the more thou hast wrong'd me.", "My name is Edgar, and thy father's son.", "The gods are just, and of our pleasant vices", "Make instruments to plague us:", "The dark and vicious place where thee he got", "Cost him his eyes."], "id": 1239, "m": "Let's exchange forgiveness. I'm no lower in birth than you, Edmund. If I'm higher, you've wronged me all the more. My name is Edgar, and I'm your father's son. The gods are just, and they make our pleasant sins into tools to punish us. The dark and sinful place where he conceived you cost him his eyes."}, {"t": "sp", "who": "EDMUND", "lines": ["Thou hast spoken right; 'tis true;", "The wheel is come full circle; I am here."], "id": 1240, "m": "You've spoken rightly. It's true. The wheel has come full circle. Here I am, at the bottom."}, {"t": "sp", "who": "ALBANY", "lines": ["Methought thy very gait did prophesy", "A royal nobleness:—I must embrace thee:", "Let sorrow split my heart if ever I", "Did hate thee or thy father!"], "id": 1241, "m": "I thought your very walk promised a royal nobility. I must embrace you. Let sorrow split my heart if I ever hated you or your father!"}, {"t": "sp", "who": "EDGAR", "lines": ["Worthy prince, I know't."], "id": 1242, "m": "Worthy prince, I know it."}, {"t": "sp", "who": "ALBANY", "lines": ["Where have you hid yourself?", "How have you known the miseries of your father?"], "id": 1243, "m": "Where have you been hiding? How did you know about your father's sufferings?"}, {"t": "sp", "who": "EDGAR", "lines": ["By nursing them, my lord.—List a brief tale;—", "And when 'tis told, O that my heart would burst!—", "The bloody proclamation to escape,", "That follow'd me so near,—O, our lives' sweetness!", "That with the pain of death we'd hourly die", "Rather than die at once!)—taught me to shift", "Into a madman's rags; to assume a semblance", "That very dogs disdain'd; and in this habit", "Met I my father with his bleeding rings,", "Their precious stones new lost; became his guide,", "Led him, begg'd for him, sav'd him from despair;", "Never,—O fault!—reveal'd myself unto him", "Until some half hour past, when I was arm'd;", "Not sure, though hoping of this good success,", "I ask'd his blessing, and from first to last", "Told him my pilgrimage: but his flaw'd heart,—", "Alack, too weak the conflict to support!—", "'Twixt two extremes of passion, joy and grief,", "Burst smilingly."], "id": 1244, "m": "By looking after him, my lord. Listen to a short story, and when it's told, oh, I wish my heart would burst! To escape the bloody proclamation that hunted me so closely (oh, how sweet life is, that we'd rather suffer the pain of death every hour than die all at once!) I learned to change into a madman's rags and take on an appearance that even dogs despised. In this disguise I met my father with his bleeding eye sockets, which had just lost their precious stones. I became his guide, led him, begged for him, saved him from despair. I never, oh, what a mistake, revealed myself to him until about half an hour ago, when I was armed. Not sure, though hoping, that this would succeed, I asked his blessing, and told him the story of my journey from beginning to end. But his cracked heart, oh dear, too weak to bear the struggle between the two extremes of joy and grief, burst smiling."}, {"t": "sp", "who": "EDMUND", "lines": ["This speech of yours hath mov'd me,", "And shall perchance do good: but speak you on;", "You look as you had something more to say."], "id": 1245, "m": "This speech of yours has moved me, and may perhaps do some good. But go on. You look as if you have something more to say."}, {"t": "sp", "who": "ALBANY", "lines": ["If there be more, more woeful, hold it in;", "For I am almost ready to dissolve,", "Hearing of this."], "id": 1246, "m": "If there's more, and sadder, keep it to yourself, because I'm almost ready to melt into tears hearing this."}, {"t": "sp", "who": "EDGAR", "lines": ["This would have seem'd a period", "To such as love not sorrow; but another,", "To amplify too much, would make much more,", "And top extremity.", "Whilst I was big in clamour, came there a man", "Who, having seen me in my worst estate,", "Shunn'd my abhorr'd society; but then, finding", "Who 'twas that so endur'd, with his strong arms", "He fastened on my neck, and bellow'd out", "As he'd burst heaven; threw him on my father;", "Told the most piteous tale of Lear and him", "That ever ear receiv'd: which in recounting", "His grief grew puissant, and the strings of life", "Began to crack: twice then the trumpets sounded,", "And there I left him tranc'd."], "id": 1247, "m": "This would have seemed the limit to people who don't love sorrow. But one more sorrow, adding too much, would make it much greater and go beyond the extreme. While I was crying out loud in grief, a man came who had seen me at my lowest and avoided my hateful company. But then, finding out who it was who had suffered so much, he threw his strong arms round my neck and roared as if he would burst the sky. He threw himself on my father's body and told the most pitiful story about Lear and himself that anyone ever heard. As he told it, his grief grew overwhelming, and the strings of his heart began to crack. Then the trumpets sounded twice, and there I left him unconscious."}, {"t": "sp", "who": "ALBANY", "lines": ["But who was this?"], "id": 1248, "m": "But who was this?"}, {"t": "sp", "who": "EDGAR", "lines": ["Kent, sir, the banish'd Kent; who in disguise", "Follow'd his enemy king and did him service", "Improper for a slave."], "id": 1249, "m": "Kent, sir, the banished Kent, who in disguise followed the King who had made him his enemy, and served him in ways not fit even for a slave."}, {"t": "sd", "text": "Enter a Gentleman hastily, with a bloody knife.", "id": 1250}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Help, help! O, help!"], "id": 1251, "m": "Help, help! Oh, help!"}, {"t": "sp", "who": "EDGAR", "lines": ["What kind of help?"], "id": 1252, "m": "What kind of help?"}, {"t": "sp", "who": "ALBANY", "lines": ["Speak, man."], "id": 1253, "m": "Speak, man."}, {"t": "sp", "who": "EDGAR", "lines": ["What means that bloody knife?"], "id": 1254, "m": "What does that bloody knife mean?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["'Tis hot, it smokes;", "It came even from the heart of—O! she's dead!"], "id": 1255, "m": "It's hot, it's steaming. It's just come from the heart of... oh! She's dead!"}, {"t": "sp", "who": "ALBANY", "lines": ["Who dead? speak, man."], "id": 1256, "m": "Who's dead? Speak, man."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Your lady, sir, your lady: and her sister", "By her is poisoned; she hath confess'd it."], "id": 1257, "m": "Your lady, sir, your lady. And she has poisoned her sister. She confessed it."}, {"t": "sp", "who": "EDMUND", "lines": ["I was contracted to them both: all three", "Now marry in an instant."], "id": 1258, "m": "I was engaged to both of them. Now all three of us will marry in a moment, in death."}, {"t": "sp", "who": "EDGAR", "lines": ["Here comes Kent."], "id": 1259, "m": "Here comes Kent."}, {"t": "sp", "who": "ALBANY", "lines": ["Produce their bodies, be they alive or dead:—", "This judgement of the heavens, that makes us tremble", "Touches us not with pity. [Exit Gentleman.]"], "id": 1260, "m": "Bring out their bodies, whether they're alive or dead. This judgement of the heavens makes us tremble, but it doesn't move us to pity. [The Gentleman leaves.]"}, {"t": "sd", "text": "Enter Kent.", "id": 1261}, {"t": "sp", "who": "ALBANY", "cont": 1, "lines": ["O, is this he?", "The time will not allow the compliment", "That very manners urges."], "id": 1262, "m": "Oh, is this him? This is no time for the courtesies that good manners demand."}, {"t": "sp", "who": "KENT", "lines": ["I am come", "To bid my king and master aye good night:", "Is he not here?"], "id": 1263, "m": "I've come to say good night for ever to my king and master. Isn't he here?"}, {"t": "sp", "who": "ALBANY", "lines": ["Great thing of us forgot!", "Speak, Edmund, where's the king? and where's Cordelia?"], "id": 1264, "m": "A great thing we've forgotten! Speak, Edmund, where's the King? And where's Cordelia?"}, {"t": "sd", "text": "The bodies of Goneril and Regan are brought in.", "id": 1265}, {"t": "sp", "who": "ALBANY", "cont": 1, "lines": ["Seest thou this object, Kent?"], "id": 1266, "m": "Do you see this sight, Kent?"}, {"t": "sp", "who": "KENT", "lines": ["Alack, why thus?"], "id": 1267, "m": "Oh dear, why like this?"}, {"t": "sp", "who": "EDMUND", "lines": ["Yet Edmund was belov'd.", "The one the other poisoned for my sake,", "And after slew herself."], "id": 1268, "m": "Still, Edmund was loved. One poisoned the other for my sake, and then killed herself."}, {"t": "sp", "who": "ALBANY", "lines": ["Even so.—Cover their faces."], "id": 1269, "m": "That's so. Cover their faces."}, {"t": "sp", "who": "EDMUND", "lines": ["I pant for life:—some good I mean to do,", "Despite of mine own nature. Quickly send,—", "Be brief in it,—to the castle; for my writ", "Is on the life of Lear and on Cordelia:—", "Nay, send in time."], "id": 1270, "m": "I'm gasping for life. I mean to do some good, in spite of my own nature. Quickly send, be quick about it, to the castle, because I've given written orders to kill Lear and Cordelia. Send in time!"}, {"t": "sp", "who": "ALBANY", "lines": ["Run, run, O, run!"], "id": 1271, "m": "Run, run, oh, run!"}, {"t": "sp", "who": "EDGAR", "lines": ["To who, my lord?—Who has the office? send", "Thy token of reprieve."], "id": 1272, "m": "To whom, my lord? Who has the order? Send your sign of pardon."}, {"t": "sp", "who": "EDMUND", "lines": ["Well thought on: take my sword,", "Give it the Captain."], "id": 1273, "m": "Well thought of. Take my sword. Give it to the captain."}, {"t": "sp", "who": "ALBANY", "lines": ["Haste thee for thy life."], "id": 1274, "m": "Hurry, for your life."}, {"t": "sd", "text": "Exit Edgar.", "id": 1275}, {"t": "sp", "who": "EDMUND", "lines": ["He hath commission from thy wife and me", "To hang Cordelia in the prison, and", "To lay the blame upon her own despair,", "That she fordid herself."], "id": 1276, "m": "He has orders from your wife and me to hang Cordelia in the prison and blame it on her own despair, saying she killed herself."}, {"t": "sp", "who": "ALBANY", "lines": ["The gods defend her!—Bear him hence awhile."], "id": 1277, "m": "The gods protect her! Carry him away for now."}, {"t": "sd", "text": "Edmund is borne off.", "id": 1278}, {"t": "sd", "text": "Re-enter Lear, with Cordelia dead in his arms; Edgar, Officer, and others following.", "id": 1279}, {"t": "sp", "who": "LEAR", "lines": ["Howl, howl, howl, howl!—O, you are men of stone.", "Had I your tongues and eyes, I'ld use them so", "That heaven's vault should crack.—She's gone for ever!—", "I know when one is dead, and when one lives;", "She's dead as earth.—Lend me a looking glass;", "If that her breath will mist or stain the stone,", "Why, then she lives."], "id": 1280, "m": "Howl, howl, howl, howl! Oh, you are men of stone. If I had your tongues and eyes, I'd use them so that the dome of heaven would crack. She's gone for ever! I know when someone is dead and when someone is alive. She's as dead as earth. Lend me a mirror. If her breath mists or clouds the glass, why, then she's alive."}, {"t": "sp", "who": "KENT", "lines": ["Is this the promis'd end?"], "id": 1281, "m": "Is this the end of the world we were promised?"}, {"t": "sp", "who": "EDGAR", "lines": ["Or image of that horror?"], "id": 1282, "m": "Or a picture of that horror?"}, {"t": "sp", "who": "ALBANY", "lines": ["Fall, and cease!"], "id": 1283, "m": "Let the heavens fall and everything end!"}, {"t": "sp", "who": "LEAR", "lines": ["This feather stirs; she lives! If it be so,", "It is a chance which does redeem all sorrows", "That ever I have felt."], "id": 1284, "m": "This feather moves. She's alive! If it's true, it's a chance that makes up for all the sorrows I have ever felt."}, {"t": "sp", "who": "KENT", "lines": ["O my good master! [Kneeling.]"], "id": 1285, "m": "Oh, my good master! [Kneeling.]"}, {"t": "sp", "who": "LEAR", "lines": ["Pr'ythee, away!"], "id": 1286, "m": "Please, go away!"}, {"t": "sp", "who": "EDGAR", "lines": ["'Tis noble Kent, your friend."], "id": 1287, "m": "It's noble Kent, your friend."}, {"t": "sp", "who": "LEAR", "lines": ["A plague upon you, murderers, traitors all!", "I might have sav'd her; now she's gone for ever!—", "Cordelia, Cordelia! stay a little. Ha!", "What is't thou say'st?—Her voice was ever soft,", "Gentle, and low,—an excellent thing in woman.—", "I kill'd the slave that was a-hanging thee."], "id": 1288, "m": "A plague on you all, murderers, traitors! I might have saved her. Now she's gone for ever! Cordelia, Cordelia! Stay a little. Ha! What are you saying? Her voice was always soft, gentle and low, an excellent thing in a woman. I killed the slave who was hanging you."}, {"t": "sp", "who": "OFFICER", "lines": ["'Tis true, my lords, he did."], "id": 1289, "m": "It's true, my lords, he did."}, {"t": "sp", "who": "LEAR", "lines": ["Did I not, fellow?", "I have seen the day, with my good biting falchion", "I would have made them skip: I am old now,", "And these same crosses spoil me.—Who are you?", "Mine eyes are not o' the best:—I'll tell you straight."], "id": 1290, "m": "Didn't I, fellow? I've seen the day when with my good sharp sword I'd have made them jump. I'm old now, and these troubles weaken me. Who are you? My eyes aren't the best. I'll tell you in a moment."}, {"t": "sp", "who": "KENT", "lines": ["If fortune brag of two she lov'd and hated,", "One of them we behold."], "id": 1291, "m": "If fortune boasted of two people she first loved and then hated, we're looking at one of them."}, {"t": "sp", "who": "LEAR", "lines": ["This is a dull sight. Are you not Kent?"], "id": 1292, "m": "My sight is dim. Aren't you Kent?"}, {"t": "sp", "who": "KENT", "lines": ["The same,", "Your servant Kent.—Where is your servant Caius?"], "id": 1293, "m": "The same, your servant Kent. Where is your servant Caius?"}, {"t": "sp", "who": "LEAR", "lines": ["He's a good fellow, I can tell you that;", "He'll strike, and quickly too:—he's dead and rotten."], "id": 1294, "m": "He's a good fellow, I can tell you that. He'd fight, and quickly too. He's dead and rotten."}, {"t": "sp", "who": "KENT", "lines": ["No, my good lord; I am the very man,—"], "id": 1295, "m": "No, my good lord. I am the very man..."}, {"t": "sp", "who": "LEAR", "lines": ["I'll see that straight."], "id": 1296, "m": "I'll see about that in a moment."}, {"t": "sp", "who": "KENT", "lines": ["That from your first of difference and decay", "Have follow'd your sad steps."], "id": 1297, "m": "...who, from the beginning of your change of fortune and decline, has followed your sad steps."}, {"t": "sp", "who": "LEAR", "lines": ["You are welcome hither."], "id": 1298, "m": "You're welcome here."}, {"t": "sp", "who": "KENT", "lines": ["Nor no man else:—All's cheerless, dark, and deadly.—", "Your eldest daughters have fordone themselves,", "And desperately are dead."], "id": 1299, "m": "Neither I nor anyone else is. Everything is cheerless, dark and deadly. Your eldest daughters have destroyed themselves and died in despair."}, {"t": "sp", "who": "LEAR", "lines": ["Ay, so I think."], "id": 1300, "m": "Yes, so I think."}, {"t": "sp", "who": "ALBANY", "lines": ["He knows not what he says; and vain is it", "That we present us to him."], "id": 1301, "m": "He doesn't know what he's saying, and it's useless for us to introduce ourselves to him."}, {"t": "sp", "who": "EDGAR", "lines": ["Very bootless."], "id": 1302, "m": "Quite useless."}, {"t": "sd", "text": "Enter a Officer.", "id": 1303}, {"t": "sp", "who": "OFFICER", "lines": ["Edmund is dead, my lord."], "id": 1304, "m": "Edmund is dead, my lord."}, {"t": "sp", "who": "ALBANY", "lines": ["That's but a trifle here.—", "You lords and noble friends, know our intent.", "What comfort to this great decay may come", "Shall be applied: for us, we will resign,", "During the life of this old majesty,", "To him our absolute power:—[to Edgar and Kent] you to your", "rights;", "With boot, and such addition as your honours", "Have more than merited.—All friends shall taste", "The wages of their virtue, and all foes", "The cup of their deservings.—O, see, see!"], "id": 1305, "m": "That's only a trifle here. You lords and noble friends, know what I intend. Whatever comfort can be given to this great ruined man will be given. As for me, I'll hand back my absolute power to this old king for the rest of his life. [To Edgar and Kent] You will have your rights restored, with extra honours, more than your noble deeds deserve. All friends will taste the rewards of their virtue, and all enemies the cup of what they deserve. Oh, look, look!"}, {"t": "sp", "who": "LEAR", "lines": ["And my poor fool is hang'd! No, no, no life!", "Why should a dog, a horse, a rat, have life,", "And thou no breath at all? Thou'lt come no more,", "Never, never, never, never, never!—", "Pray you undo this button:—thank you, sir.—", "Do you see this? Look on her!—look!—her lips!—", "Look there, look there!—"], "id": 1306, "m": "And my poor fool is hanged! No, no, no life! Why should a dog, a horse, a rat have life, and you no breath at all? You'll never come back, never, never, never, never, never! Please undo this button. Thank you, sir. Do you see this? Look at her! Look, her lips! Look there, look there! [He dies.]"}, {"t": "sd", "text": "He dies.", "id": 1307}, {"t": "sp", "who": "EDGAR", "lines": ["He faints!—My lord, my lord!—"], "id": 1308, "m": "He's fainted! My lord, my lord!"}, {"t": "sp", "who": "KENT", "lines": ["Break, heart; I pr'ythee break!"], "id": 1309, "m": "Break, heart, I beg you, break!"}, {"t": "sp", "who": "EDGAR", "lines": ["Look up, my lord."], "id": 1310, "m": "Look up, my lord."}, {"t": "sp", "who": "KENT", "lines": ["Vex not his ghost: O, let him pass! he hates him", "That would upon the rack of this rough world", "Stretch him out longer."], "id": 1311, "m": "Don't trouble his spirit. Oh, let him go! He'd hate anyone who wanted to stretch him out any longer on the torture rack of this harsh world."}, {"t": "sp", "who": "EDGAR", "lines": ["He is gone indeed."], "id": 1312, "m": "He really is gone."}, {"t": "sp", "who": "KENT", "lines": ["The wonder is, he hath endur'd so long:", "He but usurp'd his life."], "id": 1313, "m": "The wonder is that he lasted so long. He only held on to his life beyond its time."}, {"t": "sp", "who": "ALBANY", "lines": ["Bear them from hence.—Our present business", "Is general woe.—[To Kent and Edgar.] Friends of my soul, you", "twain", "Rule in this realm, and the gor'd state sustain."], "id": 1314, "m": "Carry them away. Our business now is general mourning. [To Kent and Edgar] You two, dearest friends, rule in this kingdom and hold up the wounded state."}, {"t": "sp", "who": "KENT", "lines": ["I have a journey, sir, shortly to go;", "My master calls me,—I must not say no."], "id": 1315, "m": "I have a journey to go on soon, sir. My master is calling me. I must not say no."}, {"t": "sp", "who": "ALBANY", "lines": ["The weight of this sad time we must obey;", "Speak what we feel, not what we ought to say.", "The oldest have borne most: we that are young", "Shall never see so much, nor live so long."], "id": 1316, "m": "We must bear the weight of this sad time and say what we feel, not what we ought to say. The oldest have suffered most. We who are young will never see so much, or live so long."}, {"t": "sd", "text": "Exeunt, with a dead march.", "id": 1317}];

"a5s1": {
"sum": "In the British camp Regan questions Edmund about Goneril. Albany and Goneril arrive; the sisters watch each other jealously. Edgar, disguised, gives Albany Goneril's letter and promises a champion. Alone, Edmund weighs which sister to take and resolves that Lear and Cordelia will never see Albany's mercy.",

"a5s3": {
"sum": "Lear and Cordelia are led to prison; Lear imagines them as birds in a cage. Edmund secretly orders a captain to kill them. Albany arrests Edmund for treason; Regan, poisoned, is led away. Edgar, armed and unnamed, defeats Edmund. Goneril leaves and kills herself after poisoning Regan. Edgar tells how Gloster died. Dying, Edmund tries to save Lear and Cordelia, but too late. Lear enters with Cordelia dead in his arms, hopes she breathes, and dies. Kent refuses to live on; Albany and Edgar are left to rule.",
"key": [
"Lear's vision of happiness in prison: 'We two alone will sing like birds i' the cage'.",
"Justice falls on the villains, but the innocent die too.",
"'Never, never, never, never, never': the bleakest ending in Shakespeare."
],

"notes": {
"21": "Lear turns love into a public contest with land as the prize. He wants words, not deeds. The love test sets the tragedy in motion.",
"22": "Goneril's speech is a string of hyperboles: she claims love beyond words while using lots of them. Its emptiness is obvious to everyone except Lear.",
"23": "Cordelia's first words are an aside. She cannot turn love into a performance. Silence and 'nothing' become her answer.",
"31": "Lear's warning (from a Latin saying) will come true for him: he gives away everything and is left with 'nothing'. The word echoes through the play.",
"32": "Cordelia loves according to duty, the natural 'bond' between child and parent. Honest, but perhaps also stubborn: she shares some of Lear's pride.",
"41": "Lear sees himself as a dragon, the emblem of British kings. His rage is royal, mythic and destructive.",
"48": "Kent's plea starts the play's sight imagery. Lear cannot 'see' truly while he has eyes and power.",
"97": "A cheeky, defiant ending to Edmund's soliloquy: he draws the audience in as accomplices.",
"128": "Gloster believes the stars cause disorder. His list (love cools, brothers divide, son against father) predicts the whole play.",
"130": "Edmund mocks astrology: people blame stars for their own choices. A modern, sceptical voice, though he uses it for evil.",
"161": "Goneril reverses the parent-child roles. The idea of old age as second childhood runs through the play.",
"270": "Lear's identity crisis. Without power, who is he? The Fool answers: 'Lear's shadow'.",
"283": "One of the most famous lines: ingratitude from a child is worse than a snake's bite. Animal imagery for the daughters begins.",
"338": "Lear's fear of madness. He senses what is coming. Simple, repeated words show his panic.",
"414": "Kent's comic flood of insults against Oswald. Plain speaking is his virtue, but it also gets him into trouble.",
"477": "Edgar becomes nothing to survive. Bedlam beggars were real: released inmates of the Bethlehem hospital for the insane.",
"577": "Lear's broken sentence shows his helplessness: the king who once commanded cannot even name his revenge.",
"611": "The storm speech. Lear commands the weather as if he were still king. The storm outside mirrors the storm in his mind and in the state.",
"620": "Self-pity, but also a step towards understanding guilt and justice.",
"648": "Lear's turning point: he feels for the poor and admits 'I have ta'en too little care of this'. Suffering teaches pity.",
"671": "Faced with Poor Tom, Lear sees what a human being is without clothes, wealth or titles: an animal. He tears off his own clothes.",
"682": "Gloster unknowingly speaks in front of the son he wronged. Dramatic irony.",
"748": "Lear's mad trial asks a real philosophical question. The play never fully answers it.",
"818": "Cornwall's horrific line. The blinding literalises the play's sight imagery. Gloster now 'sees' that Edgar was innocent.",
"812": "An unnamed servant risks his life to stop cruelty. Goodness appears in unexpected places.",
"846": "Gloster's bleakest view: the gods are cruel children. Compare Edgar's 'The gods are just' at the end.",
"842": "Edgar realises there is no bottom to suffering. A key line about the play's relentless pain.",
"838": "Gloster's paradox: he was blind when he could see. Sight and blindness reversed.",
"878": "Albany's moral awakening. His language is now strong and judging.",
"880": "Albany fears humans will eat each other like sea monsters. Animal imagery at its darkest.",
"969": "Edgar paints a cliff in words for his blind father. The scene asks us to imagine, just as Gloster does.",
"982": "Edgar turns the fall into a 'miracle' to give his father a reason to live.",
"1003": "Mad Lear, crowned with weeds, claims his kingship. Tragic and absurd at once.",
"1016": "Lear's madness reveals social truth: the rich buy their way out of justice. 'Reason in madness'.",
"1018": "Lear's sermon on birth: we cry because we come 'to this great stage of fools'.",
"1088": "Lear thinks he is in hell. Fire and torture images express his guilt.",
"1095": "Lear's humility. Plain words, no 'we': the king has become a father.",
"1098": "Cordelia's forgiveness in four words. She does not argue; she loves.",
"1165": "'Ripeness is all': Edgar's philosophy of patient endurance and readiness for death.",
"1172": "Lear finds happiness in prison with Cordelia. The reunited father and daughter need nothing else.",
"1239": "Edgar's moral reading: Gloster's adultery cost him his eyes. Many find this harsh.",
"1240": "Edmund accepts his fall on Fortune's wheel: he began low and ends low.",
"1268": "A touching, revealing line: Edmund, the unloved bastard, finds comfort in being loved, even by murderers.",
"1280": "Lear's entrance with Cordelia's body. The bleakest moment in Shakespeare: no consolation.",
"1288": "Lear remembers Cordelia's gentleness. A quiet line amid the horror.",
"1306": "A whole line of one word repeated: grief beyond rhetoric. The verse breaks down.",
"1316": "The closing lines: speak honestly, 'not what we ought to say'. The survivors are left with grief."
},

const ALIGN={"21": [[0, 3, "Meanwhile, I will reveal my secret plan. Give me the map there. You should know that I have divided my kingdom into three, and it is my firm intention to shake all cares and business off my old age, handing them to younger and stronger people while I crawl towards death without a burden."], [4, 15, "My son-in-law Cornwall, and you, my equally loved son-in-law Albany, I have decided right now to announce the dowry each of my daughters will receive, so that future quarrels are prevented. The King of France and the Duke of Burgundy, great rivals for my youngest daughter's love, have stayed at my court a long time courting her, and they will get their answer today. Tell me, my daughters, since I am now giving up power, land and the cares of state: which of you shall I say loves me most?"], [16, 18, "Then I can give the largest gift to the one whose natural love deserves it most. Goneril, my eldest, speak first."]], "22": [[0, 0, "Sir, I love you more than words can express."], [1, 3, "You are dearer to me than eyesight, freedom and the whole wide world; beyond anything that can be valued, however rich or rare; no less than life itself with all its grace, health, beauty and honour; as much as any child ever loved or any father was loved."], [4, 5, "It is a love that makes breath feeble and speech useless."], [6, 6, "I love you beyond every way of saying how much."]], "25": [[0, 2, "Sir, I am made of the same stuff as my sister, and I value myself as highly as her. In my honest heart I find she describes exactly the love I feel, only she doesn't go far enough."], [3, 7, "For I declare that I hate every other joy that the most refined senses can offer, and that my only happiness is in loving your highness."]], "27": [[0, 1, "To you and your heirs for ever goes this generous third of my lovely kingdom, no smaller in size, value or pleasure than the part given to Goneril."], [2, 7, "Now, my joy, last but not least, whose young love the vineyards of France and the pastures of Burgundy are competing to win: what can you say to earn a third richer than your sisters'? Speak."]], "34": [[0, 3, "My good lord, you gave me life, brought me up and loved me. I return those duties as is right: I obey you, love you and honour you above all."], [4, 7, "Why do my sisters have husbands if they say they love only you? When I marry, I expect the man who takes my vow will take half my love with him, and half my care and duty."], [8, 9, "I will certainly never marry like my sisters and love only my father."]], "39": [[0, 0, "So be it. Let your honesty be your dowry."], [1, 12, "For by the sacred light of the sun, by the mysteries of Hecate and the night, by all the stars and planets that make us live and die, I here renounce all my care as a father, all kinship and shared blood, and from now on I will treat you as a stranger to my heart and to me for ever. The savage Scythian, or the cannibal who eats his own children, will be as welcome, pitied and helped by me as you, who were once my daughter."]], "41": [[0, 0, "Quiet, Kent!"], [1, 1, "Don't come between the dragon and its rage."], [2, 3, "I loved her most, and hoped to spend my old age in her loving care. [To Cordelia] Go, get out of my sight!"], [4, 5, "As I hope to rest in peace in my grave, I take my father's heart away from her. Call the King of France!"], [6, 7, "Is nobody moving? Call Burgundy! Cornwall and Albany, add this third to my two daughters' dowries."], [8, 15, "Let her pride, which she calls honesty, find her a husband. I give you both together my power, my rank and all the grand trappings of majesty. I will live with each of you in turn, a month at a time, keeping a hundred knights for whom you will provide. I keep only the name and the honours of a king."], [16, 19, "The rule, the revenue and the running of everything else are yours, beloved sons. To confirm it, share this crown between you."], [20, 20, "[He gives them the crown.]"]], "44": [[0, 2, "Let it fall, then, even if the arrowhead pierces my heart. Kent must be rude when Lear is mad. What are you doing, old man?"], [3, 5, "Do you think duty will be afraid to speak when power gives in to flattery? Honour must speak plainly when a king falls into folly. Keep your power, and think again carefully to stop this terrible rashness."], [6, 8, "I'd stake my life on my judgement: your youngest daughter does not love you least, and people who speak quietly are not empty-hearted."], [9, 10, "It's the hollow things that make the loudest echo."]], "55": [[0, 0, "Listen to me, you traitor!"], [1, 6, "On your oath of loyalty, listen! Since you have tried to make me break my word, which I have never dared to do, and with arrogant pride have tried to come between my sentence and my power to enforce it, which neither my nature nor my position can tolerate, here is your reward, as my power proves itself."], [7, 13, "I give you five days to gather supplies to protect you from the hardships of the world, and on the sixth you will turn your hated back on my kingdom. If on the tenth day after that your banished body is found in my lands, you die that moment. Go! By Jupiter, this will not be taken back."]], "56": [[0, 3, "Goodbye, king. Since this is how you behave, freedom lives elsewhere and banishment is here. [To Cordelia] May the gods protect you, girl, for you think justly and have spoken rightly."], [4, 7, "[To Regan and Goneril] And may your grand speeches be proved by your actions, so that good things come from your words of love. So Kent says goodbye to you all, princes."], [8, 8, "He'll keep up his old ways in a new country."]], "62": [[0, 1, "Noble Burgundy, when she was dear to me I valued her that way, but now her price has fallen."], [2, 2, "There she stands, sir."], [3, 6, "If anything in that small, pretending creature, or all of her, with my displeasure added and nothing else, pleases your grace, there she is, and she's yours."]], "68": [[0, 6, "I still beg your majesty, since I lack that smooth and slippery skill of saying things I don't mean (for what I really intend, I do before I talk about it), that you make it clear it was no wicked stain, murder or foul deed, no unchaste act or dishonourable step, that has robbed me of your grace and favour."], [7, 10, "It was only because I lack the very things that make me richer for lacking them: an eye always begging for favours, and a tongue I'm glad not to have, even though not having it has cost me your love."]], "70": [[0, 5, "Is that all it is? A natural shyness which often leaves unspoken what it means to do? My Lord of Burgundy, what do you say to the lady? Love isn't love when it's mixed with calculations that have nothing to do with the real point. Will you have her?"], [6, 6, "She is a dowry in herself."]], "75": [[0, 1, "Fairest Cordelia, you are richest because you are poor, most precious because you are rejected, and most loved because you are despised!"], [2, 3, "I take you and your virtues here and now."], [4, 7, "Let it be lawful to pick up what has been thrown away. Gods, gods! It's strange that their coldest neglect should set my love on fire with burning respect. Your daughter without a dowry, king, thrown to me by chance, is queen of me, of all I have, and of fair France."], [8, 10, "All the dukes of watery Burgundy could not buy this priceless girl from me. Say goodbye to them, Cordelia, unkind as they are."], [11, 11, "You lose this place, but you'll find a better one."]], "79": [[0, 1, "You jewels of our father, Cordelia leaves you with tears in her eyes."], [2, 3, "I know what you are, and as your sister I'm very unwilling to call your faults by their real names. Look after our father well."], [4, 4, "I trust him to the love you have so publicly declared."], [5, 6, "But oh, if I were still in his favour, I'd send him to a better place."], [7, 7, "So, goodbye to you both."]], "97": [[0, 5, "You, Nature, are my goddess. I serve your law, not man's. Why should I suffer under the plague of custom and let the fussy laws of society cut me out, just because I was born twelve or fourteen months after my brother? Why 'bastard'? Why 'base'?"], [6, 9, "My body is as well made, my mind as noble, my looks as true as any honest wife's child. Why do they brand us with 'base', 'baseness', 'bastardy'? Base, base?"], [10, 15, "We, conceived in the lusty secrecy of nature, get more energy and fierce spirit than a whole tribe of idiots made in a dull, stale, tired marriage bed, half asleep. Well then, legitimate Edgar, I must have your land."], [16, 17, "Our father loves the bastard Edmund as much as the legitimate son. Fine word, 'legitimate'!"], [18, 21, "Well, my legitimate brother, if this letter works and my plan succeeds, Edmund the base will top the legitimate. I grow, I prosper. Now, gods, stand up for bastards!"]], "99": [[0, 0, "Kent banished like that! The King of France gone off in a rage!"], [1, 1, "And the King leaving tonight, his power signed away, reduced to an allowance!"], [2, 3, "All this done on the spur of the moment! Edmund, hello! What's the news?"]], "106": [[0, 1, "No? Then why did you need to hurry it into your pocket so frantically? Nothing doesn't need to hide itself like that."], [2, 2, "Let's see it."], [3, 3, "Come, if it's nothing, I won't need my glasses."]], "112": [[0, 8, "[Reads] 'This custom of respecting the old makes life bitter for us in our best years, and keeps our inheritance from us until we're too old to enjoy it. I am starting to find it a useless and foolish slavery to be oppressed by old men's tyranny, which rules not because it has power but because we put up with it. Come to me, so I can tell you more. If our father would sleep until I woke him, you would have half his income for ever and be the beloved of your brother, Edgar."], [9, 11, "Hmm! A conspiracy? 'Sleep until I woke him... you would have half his income. My son Edgar! Did he have the hand to write this? A heart and brain to think it up? When did you get this? Who brought it?"]], "121": [[0, 2, "I don't really know, my lord. If you would please hold back your anger against my brother until you have better proof of what he means, you'd be on safe ground."], [3, 7, "But if you act violently against him and have mistaken his purpose, it would damage your own honour badly and shatter his obedience. I'd bet my life that he only wrote this to test my love for you, and meant no real danger."]], "123": [[0, 2, "If you think it right, I'll hide you where you can hear us talk about this, and you'll have proof with your own ears."], [3, 3, "And without further delay, this very evening."]], "126": [[0, 1, "To his father, who loves him so tenderly and completely! Heaven and earth! Edmund, find him. Worm your way into his trust for me, please."], [2, 3, "Handle the business as you think best. I would give up my rank and wealth to know the truth for certain."]], "128": [[0, 0, "These recent eclipses of the sun and moon mean no good for us."], [1, 12, "Though science can explain them this way and that, nature still suffers the effects that follow. Love cools, friendships end, brothers fall out. In cities there are riots, in the countryside quarrels, in palaces treason, and the bond between son and father is broken. This villain of mine fits the prediction: there's son against father. The King goes against his own nature: there's father against child. We have seen the best of our times. Plots, hypocrisy, treachery and every kind of destructive disorder follow us restlessly to our graves. Find this villain, Edmund. You won't lose by it. Do it carefully. And noble, true-hearted Kent banished! His crime, honesty! It's strange."]], "130": [[0, 3, "This is the wonderful stupidity of the world: when things go badly for us, often because of our own excesses, we blame our disasters on the sun, the moon and the stars, as if we were villains by necessity, fools because heaven forced us, rogues, thieves and traitors because of the planets, drunks, liars and adulterers because we had to obey the stars, and evil in everything because a god pushed us."], [4, 12, "What a marvellous excuse for lecherous man, to blame his goatish lust on a star! My father slept with my mother under the Dragon's Tail, and I was born under the Great Bear, so it follows that I'm rough and lustful. Rubbish! I'd have been what I am if the most virginal star in the sky had twinkled on my illegitimate conception."]], "152": [[0, 3, "A father who believes anything, and a noble brother whose nature is so far from doing harm that he suspects none! My plots ride easily on his foolish honesty. I see how to do it."], [4, 4, "If I can't have land by birth, let me have it by cleverness."], [5, 5, "Anything is right for me if I can make it serve my purpose."]], "158": [[0, 2, "Day and night he wrongs me. Every hour he bursts out with some outrageous offence or other that sets us all quarrelling. I won't put up with it."], [3, 7, "His knights are getting rowdy, and he himself scolds us over every little thing. When he comes back from hunting I won't speak to him. Say I'm ill. If you serve him less well than you used to, you'll be doing right. I'll answer for it."]], "161": [[0, 1, "Treat him with as much lazy neglect as you like, you and the other servants."], [2, 8, "I'd like it to come to a showdown. If he doesn't like it, let him go to my sister, who I know agrees with me that we won't be ruled by him. Silly old man, still wanting to use the powers he has given away! I swear, old fools are babies again, and have to be handled with scolding as well as flattery when they misbehave."], [9, 9, "Remember what I've said."]], "163": [[0, 0, "And let his knights get colder looks from all of you."], [1, 1, "Never mind what comes of it. Tell the others."], [2, 4, "I want to create chances to speak my mind, and I will. I'll write at once to my sister to take exactly the same line. Get dinner ready."]], "231": [[0, 1, "Why? For taking the side of someone out of favour. If you can't smile whichever way the wind blows, you'll soon catch cold."], [2, 5, "There, take my cap. This fellow has banished two of his daughters and given the third a blessing without meaning to. If you follow him, you must wear a fool's cap. How are you, uncle? I wish I had two fool's caps and two daughters!"]], "247": [[0, 3, "The lord who advised you to give away your land, come and stand him here by me, or you stand in for him."], [4, 7, "Then the sweet and the bitter fool will appear at once: one here in a fool's costume, the other over there."]], "259": [[0, 3, "...then they wept for sudden joy, and I sang for sorrow, that such a king should play peekaboo and go among the fools."], [4, 5, "Please, uncle, get a teacher who can teach your Fool to lie. I'd love to learn to lie."]], "261": [[0, 1, "I wonder how you and your daughters are related. They'll have me whipped for telling the truth, you'll have me whipped for lying, and sometimes I'm whipped for keeping quiet."], [2, 5, "I'd rather be anything than a fool. And yet I wouldn't be you, uncle. You've pared your brains away on both sides and left nothing in the middle. Here comes one of the parings."]], "266": [[0, 2, "For you know, uncle, the hedge-sparrow fed the cuckoo so long that its own chick bit its head off."], [3, 3, "So out went the candle, and we were left in the dark."]], "270": [[0, 0, "Does anyone here know me? This isn't Lear."], [1, 1, "Does Lear walk like this? Talk like this?"], [2, 4, "Where are his eyes? Either his mind is weakening or his senses are numbed. Ha! Am I awake? It can't be! Who can tell me who I am?"]], "275": [[0, 2, "This pretended amazement, sir, is just like your other recent tricks. Please understand what I mean properly."], [3, 3, "As you are old and respected, you should be wise."], [4, 12, "You keep a hundred knights and squires here, men so disorderly, debauched and bold that our court, infected by their behaviour, looks like a rowdy inn. Gluttony and lust make it more like a tavern or a brothel than an elegant palace. The shame itself calls for an immediate remedy."], [13, 15, "So be asked, by someone who will otherwise take what she asks for, to reduce your followers a little, and let those who remain be men suited to your age, who know their place and yours."]], "276": [[0, 2, "Darkness and devils! Saddle my horses. Gather my followers. Degenerate bastard! I won't trouble you."], [3, 3, "I still have another daughter."]], "279": [[0, 1, "Woe to the man who repents too late! [To Albany] Oh, sir, have you come?"], [2, 5, "Is this what you want? Speak, sir. Get my horses ready. Ingratitude, you stone-hearted devil, you're more hideous when you appear in a child than the sea-monster!"]], "281": [[0, 0, "[To Goneril] Hateful vulture, you lie!"], [1, 2, "My followers are excellent men of rare quality, who know every detail of their duty and take the greatest care to live up to their good names."], [3, 5, "Oh, Cordelia's tiny fault, how ugly you looked in her!"], [6, 8, "Like a crowbar, it wrenched my natural feeling out of its fixed place, drained all the love from my heart and replaced it with bitterness. Oh Lear, Lear, Lear!"], [9, 9, "Beat at this door that let your folly in [striking his head] and your precious judgement out!"], [10, 10, "Go, go, my people."]], "283": [[0, 0, "That may be so, my lord."], [1, 3, "Hear, Nature, hear! Dear goddess, hear! Abandon your plan if you meant to make this creature fertile! Make her womb sterile!"], [4, 5, "Dry up the organs that make children, and from her degraded body let no baby ever be born to honour her!"], [6, 9, "If she must give birth, make her child out of malice, so that it lives to be a perverse, unnatural torment to her!"], [10, 10, "Let it stamp wrinkles on her young forehead and wear channels in her cheeks with falling tears."], [11, 15, "Let it turn all her motherly pains and kindness into laughter and contempt, so that she may feel how much sharper than a serpent's tooth it is to have an ungrateful child! Away, away!"]], "290": [[0, 1, "I'll tell you. Life and death!"], [2, 3, "[To Goneril] I'm ashamed that you have the power to shake my manhood like this, that these hot tears, which burst out of me against my will, should make you seem worth crying over."], [4, 8, "Storms and fogs on you! May the deep, incurable wounds of a father's curse pierce every sense you have! Foolish old eyes, if you weep over this again, I'll pluck you out and throw you, with the water you shed, to soften clay."], [9, 10, "Ha! So be it. I have another daughter who I'm sure is kind and comforting."], [11, 14, "When she hears about you, she'll claw your wolfish face with her nails. You'll find that I'll take back the power you think I've given up for ever."]], "295": [[0, 4, "Uncle Lear, uncle Lear, wait! Take the Fool with you. A fox, when she's caught, and a daughter like this, should certainly be slaughtered, if my cap could buy a noose."], [5, 5, "So the Fool follows after."]], "297": [[0, 0, "This man has had good advice! A hundred knights!"], [1, 5, "It's very wise and safe to let him keep a hundred armed knights, so that on every whim, every rumour, every fancy, every complaint or dislike, he can protect his senility with their power and hold our lives at his mercy. Oswald, I say!"]], "299": [[0, 0, "Safer than trusting too much."], [1, 2, "Let me always remove the dangers I fear rather than always fear being caught by them."], [3, 3, "I know his heart. I've written to my sister what he said."], [4, 5, "If she keeps him and his hundred knights when I've shown how unwise it is..."]], "303": [[0, 0, "Take some men with you and ride off."], [1, 3, "Tell her fully about my personal fears, and add any reasons of your own that make it stronger."], [4, 4, "Go, and hurry back."]], "305": [[0, 0, "No, no, my lord!"], [1, 4, "This milk-and-water gentleness of yours, though I don't condemn it, is, if you'll forgive me, more often blamed for lack of wisdom than praised for its harmful mildness."]], "356": [[0, 0, "The Duke here tonight? So much the better!"], [1, 1, "The best! This fits perfectly into my plan."], [2, 5, "My father has set guards to catch my brother, and I have one tricky thing I must do. Speed and luck, help me! Brother, a word! Come down! Brother, I say!"]], "358": [[0, 0, "My father is watching. Sir, run away from here."], [1, 1, "Someone has told him where you're hiding."], [2, 3, "You have the advantage of the dark now. Haven't you said anything against the Duke of Cornwall?"], [4, 6, "He's coming here, now, at night, in a hurry, and Regan with him. Have you said nothing on his side against the Duke of Albany?"], [7, 7, "Think carefully."]], "360": [[0, 0, "I can hear my father coming."], [1, 3, "Forgive me, but I must pretend to draw my sword on you. Draw! Pretend to defend yourself. Now do it well. Surrender! Come before my father! Lights, here!"], [4, 4, "Run, brother. Torches, torches! So, goodbye."]], "362": [[0, 1, "A little blood drawn from me would make them believe I fought fiercely. [He cuts his arm."], [2, 3, "I've seen drunks do more than this for fun. Father, father! Stop, stop!"], [4, 4, "Won't anyone help?"]], "373": [[0, 0, "...persuade me to murder your lordship."], [1, 2, "I told him the avenging gods aim all their thunder at those who kill their fathers, and spoke of how many strong bonds tie a child to his father."], [3, 8, "Sir, in short, when he saw how much I hated his unnatural plan, he lunged fiercely with his drawn sword at my unprotected body and cut my arm."], [9, 12, "But when he saw my courage roused, confident that I was in the right and ready to fight, or perhaps scared by the noise I made, he suddenly ran away."]], "374": [[0, 0, "Let him run far."], [1, 1, "He won't stay free anywhere in this land, and when he's found, he'll be killed."], [2, 3, "The noble Duke, my master, my chief patron, comes tonight."], [4, 7, "By hi
