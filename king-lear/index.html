"The lowest and most dejected thing of fortune,", "Stands still in esperance, lives not in fear:", "The lamentable change is from the best;", "The worst returns to laughter. Welcome, then,", "Thou unsubstantial air that I embrace!", "The wretch that thou hast blown unto the worst", "Owes nothing to thy blasts.—But who comes here?"], "id": 832, "m": "Still, it's better to be like this, and know you're despised, than to be despised while being flattered. To be at the very bottom, the lowest and most downcast of fortune's creatures, still leaves room for hope and no reason for fear. The sad change is from the best. From the worst you can only return to laughter. Welcome, then, you empty air that I embrace! The wretch you've blown down to the worst owes nothing to your storms. But who's coming?"}, {"t": "sd", "text": "Enter Gloster, led by an Old Man.", "id": 833}, {"t": "sp", "who": "EDGAR", "cont": 1, "lines": ["My father, poorly led?—World, world, O world!", "But that thy strange mutations make us hate thee,", "Life would not yield to age."], "id": 834, "m": "My father, led by a poor man? World, world, oh world! If your strange changes didn't make us hate you, we'd never accept growing old and dying."}, {"t": "sp", "who": "OLD MAN", "lines": ["O my good lord,", "I have been your tenant, and your father's tenant,", "These fourscore years."], "id": 835, "m": "Oh, my good lord, I've been your tenant, and your father's tenant, for eighty years."}, {"t": "sp", "who": "GLOSTER", "lines": ["Away, get thee away; good friend, be gone:", "Thy comforts can do me no good at all;", "Thee they may hurt."], "id": 836, "m": "Go away, get away. Good friend, be gone. Your help can't do me any good at all, and it may hurt you."}, {"t": "sp", "who": "OLD MAN", "lines": ["You cannot see your way."], "id": 837, "m": "You can't see your way."}, {"t": "sp", "who": "GLOSTER", "lines": ["I have no way, and therefore want no eyes;", "I stumbled when I saw: full oft 'tis seen", "Our means secure us, and our mere defects", "Prove our commodities.—O dear son Edgar,", "The food of thy abused father's wrath!", "Might I but live to see thee in my touch,", "I'd say I had eyes again!"], "id": 838, "m": "I have no way to go, so I don't need eyes. I stumbled when I could see. We often find that our advantages make us careless, and our simple disadvantages turn out to be benefits. Oh, dear son Edgar, the victim of your deceived father's anger! If I could only live to see you by touching you, I'd say I had eyes again!"}, {"t": "sp", "who": "OLD MAN", "lines": ["How now! Who's there?"], "id": 839, "m": "What's this? Who's there?"}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] O gods! Who is't can say 'I am at the worst'?", "I am worse than e'er I was."], "id": 840, "m": "[Aside] Oh gods! Who can say 'I'm at the worst'? I'm worse than I've ever been."}, {"t": "sp", "who": "OLD MAN", "lines": ["'Tis poor mad Tom."], "id": 841, "m": "It's poor mad Tom."}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] And worse I may be yet. The worst is not", "So long as we can say 'This is the worst.'"], "id": 842, "m": "[Aside] And I may be worse yet. It's not the worst as long as we can say 'This is the worst.'"}, {"t": "sp", "who": "OLD MAN", "lines": ["Fellow, where goest?"], "id": 843, "m": "Fellow, where are you going?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Is it a beggar-man?"], "id": 844, "m": "Is it a beggar?"}, {"t": "sp", "who": "OLD MAN", "lines": ["Madman and beggar too."], "id": 845, "m": "A madman and a beggar too."}, {"t": "sp", "who": "GLOSTER", "lines": ["He has some reason, else he could not beg.", "I' the last night's storm I such a fellow saw;", "Which made me think a man a worm: my son", "Came then into my mind, and yet my mind", "Was then scarce friends with him: I have heard more since.", "As flies to wanton boys are we to the gods,—", "They kill us for their sport."], "id": 846, "m": "He has some sense left, or he couldn't beg. In last night's storm I saw a fellow like that, who made me think a man is just a worm. My son came into my mind then, though at the time I was hardly friendly towards him. I've heard more since. We are to the gods what flies are to cruel boys. They kill us for fun."}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] How should this be?—", "Bad is the trade that must play fool to sorrow,", "Angering itself and others.—Bless thee, master!"], "id": 847, "m": "[Aside] How can this be? It's a bad business to have to play the fool to someone grieving, upsetting yourself and others. [Aloud] Bless you, master!"}, {"t": "sp", "who": "GLOSTER", "lines": ["Is that the naked fellow?"], "id": 848, "m": "Is that the naked fellow?"}, {"t": "sp", "who": "OLD MAN", "lines": ["Ay, my lord."], "id": 849, "m": "Yes, my lord."}, {"t": "sp", "who": "GLOSTER", "lines": ["Then pr'ythee get thee gone: if for my sake", "Thou wilt o'ertake us, hence a mile or twain,", "I' the way toward Dover, do it for ancient love;", "And bring some covering for this naked soul,", "Which I'll entreat to lead me."], "id": 850, "m": "Then please go. If for my sake you'll catch us up a mile or two from here, on the road to Dover, do it for old times' sake, and bring some clothing for this naked soul, whom I'll ask to lead me."}, {"t": "sp", "who": "OLD MAN", "lines": ["Alack, sir, he is mad."], "id": 851, "m": "Oh dear, sir, he's mad."}, {"t": "sp", "who": "GLOSTER", "lines": ["'Tis the time's plague when madmen lead the blind.", "Do as I bid thee, or rather do thy pleasure;", "Above the rest, be gone."], "id": 852, "m": "It's the sickness of our times when madmen lead the blind. Do as I tell you, or rather, do as you like. Above all, go."}, {"t": "sp", "who": "OLD MAN", "lines": ["I'll bring him the best 'parel that I have,", "Come on't what will."], "id": 853, "m": "I'll bring him the best clothes I have, whatever happens to me for it."}, {"t": "sd", "text": "Exit.", "id": 854}, {"t": "sp", "who": "GLOSTER", "lines": ["Sirrah naked fellow,—"], "id": 855, "m": "You, naked fellow..."}, {"t": "sp", "who": "EDGAR", "lines": ["Poor Tom's a-cold.", "[Aside.] I cannot daub it further."], "id": 856, "m": "Poor Tom's cold. [Aside] I can't keep up this pretence any longer."}, {"t": "sp", "who": "GLOSTER", "lines": ["Come hither, fellow."], "id": 857, "m": "Come here, fellow."}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] And yet I must.—Bless thy sweet eyes, they bleed."], "id": 858, "m": "[Aside] And yet I must. [Aloud] Bless your sweet eyes, they're bleeding."}, {"t": "sp", "who": "GLOSTER", "lines": ["Know'st thou the way to Dover?"], "id": 859, "m": "Do you know the way to Dover?"}, {"t": "sp", "who": "EDGAR", "lines": ["Both stile and gate, horseway and footpath. Poor Tom hath been", "scared out of his good wits:—bless thee, good man's son, from", "the foul fiend! Five fiends have been in poor Tom at once; of", "lust, as Obidicut; Hobbididence, prince of dumbness; Mahu, of", "stealing; Modo, of murder; Flibbertigibbet, of mopping and", "mowing,—who since possesses chambermaids and waiting women. So,", "bless thee, master!"], "id": 860, "m": "Every stile and gate, bridle path and footpath. Poor Tom has been frightened out of his wits. God save you, good man's son, from the foul devil! Five devils have been in Poor Tom at once: Obidicut, of lust; Hobbididence, prince of dumbness; Mahu, of stealing; Modo, of murder; Flibbertigibbet, of grimacing and pulling faces, who has since possessed chambermaids and ladies' maids. So, bless you, master!"}, {"t": "sp", "who": "GLOSTER", "lines": ["Here, take this purse, thou whom the heavens' plagues", "Have humbled to all strokes: that I am wretched", "Makes thee the happier;—heavens, deal so still!", "Let the superfluous and lust-dieted man,", "That slaves your ordinance, that will not see", "Because he does not feel, feel your power quickly;", "So distribution should undo excess,", "And each man have enough.—Dost thou know Dover?"], "id": 861, "m": "Here, take this purse, you whom the heavens' plagues have brought so low that you accept every blow. My misery makes you happier. Heavens, always act like this! Let the man who has too much and feeds his appetites, who treats your laws as his slaves, who won't see because he doesn't feel, feel your power quickly. Then sharing out would undo excess, and every man would have enough. Do you know Dover?"}, {"t": "sp", "who": "EDGAR", "lines": ["Ay, master."], "id": 862, "m": "Yes, master."}, {"t": "sp", "who": "GLOSTER", "lines": ["There is a cliff, whose high and bending head", "Looks fearfully in the confined deep:", "Bring me but to the very brim of it,", "And I'll repair the misery thou dost bear", "With something rich about me: from that place", "I shall no leading need."], "id": 863, "m": "There's a cliff whose high, overhanging top looks fearfully down into the enclosed sea below. Just bring me to the very edge of it, and I'll repair your poverty with something valuable I have on me. From that place I won't need any leading."}, {"t": "sp", "who": "EDGAR", "lines": ["Give me thy arm:", "Poor Tom shall lead thee."], "id": 864, "m": "Give me your arm. Poor Tom will lead you."}, {"t": "sd", "text": "Exeunt.", "id": 865}, {"t": "scene", "act": 4, "scene": "II", "loc": "Before the Duke of Albany's Palace.", "id": 866}, {"t": "sd", "text": "Enter Goneril and Edmund; Oswald meeting them.", "id": 867}, {"t": "sp", "who": "GONERIL", "lines": ["Welcome, my lord: I marvel our mild husband", "Not met us on the way.—Now, where's your master?"], "id": 868, "m": "Welcome, my lord. I'm surprised my mild husband didn't meet us on the way. Now, where's your master?"}, {"t": "sp", "who": "OSWALD", "lines": ["Madam, within; but never man so chang'd.", "I told him of the army that was landed;", "He smil'd at it: I told him you were coming;", "His answer was, 'The worse': Of Gloster's treachery", "And of the loyal service of his son", "When I inform'd him, then he call'd me sot", "And told me I had turn'd the wrong side out:—", "What most he should dislike seems pleasant to him;", "What like, offensive."], "id": 869, "m": "Inside, madam, but I've never seen a man so changed. I told him about the army that had landed. He smiled at it. I told him you were coming. His answer was 'So much the worse.' When I told him about Gloster's treachery and the loyal service of his son, he called me a fool and said I'd got it all inside out. What he should dislike most seems to please him, and what he should like offends him."}, {"t": "sp", "who": "GONERIL", "lines": ["[To Edmund.] Then shall you go no further.", "It is the cowish terror of his spirit,", "That dares not undertake: he'll not feel wrongs", "Which tie him to an answer. Our wishes on the way", "May prove effects. Back, Edmund, to my brother;", "Hasten his musters and conduct his powers:", "I must change arms at home, and give the distaff", "Into my husband's hands. This trusty servant", "Shall pass between us; ere long you are like to hear,", "If you dare venture in your own behalf,", "A mistress's command. [Giving a favour.]", "Wear this; spare speech;", "Decline your head: this kiss, if it durst speak,", "Would stretch thy spirits up into the air:—", "Conceive, and fare thee well."], "id": 870, "m": "[To Edmund] Then you won't go any further. It's the cowardly fear in his spirit that doesn't dare take action. He'll ignore insults that would force him to respond. What we wished for on the way here may come true. Go back, Edmund, to my brother-in-law. Hurry his gathering of troops and lead his army. I must swap weapons at home and give my husband the spinning distaff. This trustworthy servant will carry messages between us. Before long you're likely to hear, if you dare to act for your own advantage, a command from your mistress. [She gives him a token.] Wear this. Don't speak. Bend your head. This kiss, if it dared to speak, would lift your spirits up into the sky. Understand me, and goodbye."}, {"t": "sp", "who": "EDMUND", "lines": ["Yours in the ranks of death!"], "id": 871, "m": "Yours even in the ranks of death!"}, {"t": "sd", "text": "Exit Edmund.", "id": 872}, {"t": "sp", "who": "GONERIL", "lines": ["My most dear Gloster.", "O, the difference of man and man!", "To thee a woman's services are due:", "My fool usurps my body."], "id": 873, "m": "My dearest Gloster! Oh, the difference between one man and another! A woman's services are owed to you. My fool of a husband has taken my body like a usurper."}, {"t": "sp", "who": "OSWALD", "lines": ["Madam, here comes my lord."], "id": 874, "m": "Madam, here comes my lord."}, {"t": "sd", "text": "Exit.", "id": 875}, {"t": "sd", "text": "Enter Albany.", "id": 876}, {"t": "sp", "who": "GONERIL", "lines": ["I have been worth the whistle."], "id": 877, "m": "There was a time when I was worth whistling for."}, {"t": "sp", "who": "ALBANY", "lines": ["O Goneril!", "You are not worth the dust which the rude wind", "Blows in your face! I fear your disposition:", "That nature which contemns it origin", "Cannot be bordered certain in itself;", "She that herself will sliver and disbranch", "From her material sap, perforce must wither", "And come to deadly use."], "id": 878, "m": "Oh Goneril! You're not worth the dust the rough wind blows in your face! I'm afraid of your nature. A creature that despises its own origin can't be kept within any limits. A branch that tears itself away from the tree that feeds it must wither and end up as firewood."}, {"t": "sp", "who": "GONERIL", "lines": ["No more; the text is foolish."], "id": 879, "m": "Enough. That sermon is foolish."}, {"t": "sp", "who": "ALBANY", "lines": ["Wisdom and goodness to the vile seem vile:", "Filths savour but themselves. What have you done?", "Tigers, not daughters, what have you perform'd?", "A father, and a gracious aged man,", "Whose reverence even the head-lugg'd bear would lick,", "Most barbarous, most degenerate, have you madded.", "Could my good brother suffer you to do it?", "A man, a prince, by him so benefited!", "If that the heavens do not their visible spirits", "Send quickly down to tame these vile offences,", "It will come,", "Humanity must perforce prey on itself,", "Like monsters of the deep."], "id": 880, "m": "Wisdom and goodness seem vile to the vile. Filth likes only the taste of itself. What have you done? Tigers, not daughters, what have you done? A father, a gracious old man whose dignity even a bear dragged by its head would lick, you most barbarous, most degenerate women have driven mad. Could my good brother-in-law let you do it? A man, a prince, who owed him so much! If the heavens don't send their spirits down in visible form, quickly, to tame these vile crimes, it will come to this: humanity will be forced to prey on itself, like monsters of the deep."}, {"t": "sp", "who": "GONERIL", "lines": ["Milk-liver'd man!", "That bear'st a cheek for blows, a head for wrongs;", "Who hast not in thy brows an eye discerning", "Thine honour from thy suffering; that not know'st", "Fools do those villains pity who are punish'd", "Ere they have done their mischief. Where's thy drum?", "France spreads his banners in our noiseless land;", "With plumed helm thy slayer begins threats;", "Whiles thou, a moral fool, sitt'st still, and criest", "'Alack, why does he so?'"], "id": 881, "m": "Coward with milk for a liver! You turn your cheek to be hit and your head to be wronged. You haven't got eyes in your head to tell what's honourable from what should be put up with. You don't know that only fools pity villains who are punished before they've done their crime. Where's your drum? The King of France spreads his banners in our silent land, and in his plumed helmet your killer starts threatening, while you, a moralising fool, sit still and cry, 'Oh dear, why does he do this?'"}, {"t": "sp", "who": "ALBANY", "lines": ["See thyself, devil!", "Proper deformity seems not in the fiend", "So horrid as in woman."], "id": 882, "m": "Look at yourself, devil! Ugliness is natural in a devil, so it doesn't seem as horrible there as it does in a woman."}, {"t": "sp", "who": "GONERIL", "lines": ["O vain fool!"], "id": 883, "m": "Oh, you useless fool!"}, {"t": "sp", "who": "ALBANY", "lines": ["Thou changed and self-cover'd thing, for shame!", "Be-monster not thy feature! Were't my fitness", "To let these hands obey my blood.", "They are apt enough to dislocate and tear", "Thy flesh and bones:—howe'er thou art a fiend,", "A woman's shape doth shield thee."], "id": 884, "m": "You changed creature, hiding your true self, for shame! Don't turn your face into a monster's! If it were fitting for me to let these hands obey my anger, they'd be quite ready to tear your flesh and bones apart. Devil though you are, your woman's shape protects you."}, {"t": "sp", "who": "GONERIL", "lines": ["Marry, your manhood now!"], "id": 885, "m": "Oh, what a man you are now!"}, {"t": "sd", "text": "Enter a Messenger.", "id": 886}, {"t": "sp", "who": "ALBANY", "lines": ["What news?"], "id": 887, "m": "What news?"}, {"t": "sp", "who": "MESSENGER", "lines": ["O, my good lord, the Duke of Cornwall's dead;", "Slain by his servant, going to put out", "The other eye of Gloster."], "id": 888, "m": "Oh, my good lord, the Duke of Cornwall is dead, killed by his servant as he was about to put out Gloster's other eye."}, {"t": "sp", "who": "ALBANY", "lines": ["Gloster's eyes!"], "id": 889, "m": "Gloster's eyes!"}, {"t": "sp", "who": "MESSENGER", "lines": ["A servant that he bred, thrill'd with remorse,", "Oppos'd against the act, bending his sword", "To his great master; who, thereat enrag'd,", "Flew on him, and amongst them fell'd him dead;", "But not without that harmful stroke which since", "Hath pluck'd him after."], "id": 890, "m": "A servant he'd brought up, overcome with pity, opposed the act and turned his sword against his great master. Furious at that, the Duke attacked him, and among them they struck him dead, but not before he'd given the Duke the harmful blow that has since dragged him after him to death."}, {"t": "sp", "who": "ALBANY", "lines": ["This shows you are above,", "You justicers, that these our nether crimes", "So speedily can venge!—But, O poor Gloster!", "Lost he his other eye?"], "id": 891, "m": "This shows that you are up there, you heavenly judges, since you can avenge our crimes down here so quickly! But oh, poor Gloster! Did he lose his other eye?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Both, both, my lord.—", "This letter, madam, craves a speedy answer;", "'Tis from your sister."], "id": 892, "m": "Both, both, my lord. This letter, madam, needs a quick answer. It's from your sister."}, {"t": "sp", "who": "GONERIL", "lines": ["[Aside.] One way I like this well;", "But being widow, and my Gloster with her,", "May all the building in my fancy pluck", "Upon my hateful life: another way", "The news is not so tart.—I'll read, and answer."], "id": 893, "m": "[Aside] In one way I like this very much. But now she's a widow, and my Gloster is with her, all the castles I've built in my imagination may come crashing down on my hateful life. In another way, the news isn't so bitter. [Aloud] I'll read it and answer."}, {"t": "sd", "text": "Exit.", "id": 894}, {"t": "sp", "who": "ALBANY", "lines": ["Where was his son when they did take his eyes?"], "id": 895, "m": "Where was his son when they took his eyes?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Come with my lady hither."], "id": 896, "m": "Coming here with my lady."}, {"t": "sp", "who": "ALBANY", "lines": ["He is not here."], "id": 897, "m": "He isn't here."}, {"t": "sp", "who": "MESSENGER", "lines": ["No, my good lord; I met him back again."], "id": 898, "m": "No, my good lord. I met him on his way back."}, {"t": "sp", "who": "ALBANY", "lines": ["Knows he the wickedness?"], "id": 899, "m": "Does he know about this wickedness?"}, {"t": "sp", "who": "MESSENGER", "lines": ["Ay, my good lord. 'Twas he inform'd against him;", "And quit the house on purpose, that their punishment", "Might have the freer course."], "id": 900, "m": "Yes, my good lord. It was he who informed against his father, and he left the house on purpose so that their punishment could go ahead freely."}, {"t": "sp", "who": "ALBANY", "lines": ["Gloster, I live", "To thank thee for the love thou show'dst the king,", "And to revenge thine eyes.—Come hither, friend:", "Tell me what more thou know'st."], "id": 901, "m": "Gloster, I live to thank you for the love you showed the King, and to avenge your eyes. Come here, friend. Tell me what else you know."}, {"t": "sd", "text": "Exeunt.", "id": 902}, {"t": "scene", "act": 4, "scene": "III", "loc": "The French camp near Dover.", "id": 903}, {"t": "sd", "text": "Enter Kent and a Gentleman.", "id": 904}, {"t": "sp", "who": "KENT", "lines": ["Why the king of France is so suddenly gone back know you the", "reason?"], "id": 905, "m": "Do you know why the King of France has gone back so suddenly?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Something he left imperfect in the state, which since his coming", "forth is thought of, which imports to the kingdom so much fear", "and danger that his personal return was most required and", "necessary."], "id": 906, "m": "Something he left unfinished in his own country, which he has thought of since leaving, and which threatens his kingdom with so much fear and danger that his personal return was urgently needed."}, {"t": "sp", "who": "KENT", "lines": ["Who hath he left behind him general?"], "id": 907, "m": "Whom has he left behind as general?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["The Mareschal of France, Monsieur La Far."], "id": 908, "m": "The Marshal of France, Monsieur La Far."}, {"t": "sp", "who": "KENT", "lines": ["Did your letters pierce the queen to any demonstration of grief?"], "id": 909, "m": "Did your letters move the Queen to any show of grief?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Ay, sir; she took them, read them in my presence;", "And now and then an ample tear trill'd down", "Her delicate cheek: it seem'd she was a queen", "Over her passion; who, most rebel-like,", "Sought to be king o'er her."], "id": 910, "m": "Yes, sir. She took them and read them in front of me, and now and then a large tear trickled down her delicate cheek. She seemed to be queen over her emotion, which, like a rebel, tried to be king over her."}, {"t": "sp", "who": "KENT", "lines": ["O, then it mov'd her."], "id": 911, "m": "Oh, so it moved her."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Not to a rage: patience and sorrow strove", "Who should express her goodliest. You have seen", "Sunshine and rain at once: her smiles and tears", "Were like, a better day: those happy smilets", "That play'd on her ripe lip seem'd not to know", "What guests were in her eyes; which parted thence", "As pearls from diamonds dropp'd.—In brief, sorrow", "Would be a rarity most belov'd, if all", "Could so become it."], "id": 912, "m": "Not to rage. Patience and sorrow competed to see which could show her most beautifully. You've seen sunshine and rain at the same time. Her smiles and tears were like that, only lovelier. Those happy little smiles playing on her full lips didn't seem to know what guests were in her eyes, which fell from them like pearls dropping from diamonds. In short, sorrow would be a much-loved treasure if it suited everyone so well."}, {"t": "sp", "who": "KENT", "lines": ["Made she no verbal question?"], "id": 913, "m": "Didn't she say anything?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Faith, once or twice she heav'd the name of 'father'", "Pantingly forth, as if it press'd her heart;", "Cried 'Sisters, sisters!—Shame of ladies! sisters!", "Kent! father! sisters! What, i' the storm? i' the night?", "Let pity not be believ'd!'—There she shook", "The holy water from her heavenly eyes,", "And clamour moisten'd: then away she started", "To deal with grief alone."], "id": 914, "m": "Yes, once or twice she sighed out the word 'father' breathlessly, as if it weighed on her heart. She cried, 'Sisters, sisters! Shame of women! Sisters! Kent! Father! Sisters! What, in the storm? At night? Let pity not be believed to exist!' Then she shook the holy water from her heavenly eyes and soaked her cries with tears. Then she rushed away to deal with her grief alone."}, {"t": "sp", "who": "KENT", "lines": ["It is the stars,", "The stars above us, govern our conditions;", "Else one self mate and mate could not beget", "Such different issues. You spoke not with her since?"], "id": 915, "m": "It's the stars, the stars above us, that control our natures. Otherwise the same husband and wife couldn't produce such different children. Haven't you spoken to her since?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["No."], "id": 916, "m": "No."}, {"t": "sp", "who": "KENT", "lines": ["Was this before the king return'd?"], "id": 917, "m": "Was this before the King of France went back?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["No, since."], "id": 918, "m": "No, after."}, {"t": "sp", "who": "KENT", "lines": ["Well, sir, the poor distressed Lear's i' the town;", "Who sometime, in his better tune, remembers", "What we are come about, and by no means", "Will yield to see his daughter."], "id": 919, "m": "Well, sir, poor, distressed Lear is in the town. Sometimes, in his saner moments, he remembers why we've come, and he absolutely refuses to see his daughter."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Why, good sir?"], "id": 920, "m": "Why, good sir?"}, {"t": "sp", "who": "KENT", "lines": ["A sovereign shame so elbows him: his own unkindness,", "That stripp'd her from his benediction, turn'd her", "To foreign casualties, gave her dear rights", "To his dog-hearted daughters,—these things sting", "His mind so venomously that burning shame", "Detains him from Cordelia."], "id": 921, "m": "An overwhelming shame pushes him away: his own unkindness, which stripped her of his blessing and threw her out to the dangers of a foreign land, and gave her rightful inheritance to his dog-hearted daughters. These things sting his mind so poisonously that burning shame keeps him away from Cordelia."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Alack, poor gentleman!"], "id": 922, "m": "Oh, poor gentleman!"}, {"t": "sp", "who": "KENT", "lines": ["Of Albany's and Cornwall's powers you heard not?"], "id": 923, "m": "Have you heard nothing about Albany's and Cornwall's armies?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["'Tis so; they are a-foot."], "id": 924, "m": "It's true. They're on the march."}, {"t": "sp", "who": "KENT", "lines": ["Well, sir, I'll bring you to our master Lear", "And leave you to attend him: some dear cause", "Will in concealment wrap me up awhile;", "When I am known aright, you shall not grieve", "Lending me this acquaintance. I pray you go", "Along with me."], "id": 925, "m": "Well, sir, I'll take you to our master Lear and leave you to look after him. An important reason will keep me in disguise for a while. When I'm known for who I really am, you won't regret having trusted me. Please come with me."}, {"t": "sd", "text": "Exeunt.", "id": 926}, {"t": "scene", "act": 4, "scene": "IV", "loc": "The French camp. A Tent.", "id": 927}, {"t": "sd", "text": "Enter Cordelia, Physician, and Soldiers.", "id": 928}, {"t": "sp", "who": "CORDELIA", "lines": ["Alack, 'tis he: why, he was met even now", "As mad as the vex'd sea; singing aloud;", "Crown'd with rank fumiter and furrow weeds,", "With harlocks, hemlock, nettles, cuckoo-flowers,", "Darnel, and all the idle weeds that grow", "In our sustaining corn.—A century send forth;", "Search every acre in the high-grown field,", "And bring him to our eye. [Exit an Officer.]", "What can man's wisdom", "In the restoring his bereaved sense?", "He that helps him take all my outward worth."], "id": 929, "m": "Oh dear, it's him. He was seen just now, as mad as the stormy sea, singing loudly, crowned with stinking fumitory and field weeds, with burdock, hemlock, nettles, cuckoo-flowers, darnel and all the useless weeds that grow among the corn that feeds us. Send out a hundred soldiers. Search every acre of the high-grown fields and bring him to me. [An officer leaves.] What can human knowledge do to restore his lost mind? Whoever helps him can take all my worldly wealth."}, {"t": "sp", "who": "PHYSICIAN", "lines": ["There is means, madam:", "Our foster nurse of nature is repose,", "The which he lacks; that to provoke in him", "Are many simples operative, whose power", "Will close the eye of anguish."], "id": 930, "m": "There is a way, madam. Sleep is nature's nurse, and he lacks it. There are many effective herbs to bring sleep on, whose power will close the eye of pain."}, {"t": "sp", "who": "CORDELIA", "lines": ["All bless'd secrets,", "All you unpublish'd virtues of the earth,", "Spring with my tears! be aidant and remediate", "In the good man's distress!—Seek, seek for him;", "Lest his ungovern'd rage dissolve the life", "That wants the means to lead it."], "id": 931, "m": "All you blessed secrets, all you undiscovered healing powers of the earth, spring up, watered by my tears! Help and cure this good man's suffering! Search, search for him, in case his uncontrolled rage ends the life that lacks the reason to guide it."}, {"t": "sd", "text": "Enter a Messenger.", "id": 932}, {"t": "sp", "who": "MESSENGER", "lines": ["News, madam;", "The British powers are marching hitherward."], "id": 933, "m": "News, madam. The British armies are marching this way."}, {"t": "sp", "who": "CORDELIA", "lines": ["'Tis known before; our preparation stands", "In expectation of them.—O dear father,", "It is thy business that I go about;", "Therefore great France", "My mourning and important tears hath pitied.", "No blown ambition doth our arms incite,", "But love, dear love, and our ag'd father's right:", "Soon may I hear and see him!"], "id": 934, "m": "We knew that already. Our forces are ready and waiting for them. Oh, dear father, it's your business I'm about. That's why the great King of France has pitied my mourning and my pleading tears. No swollen ambition drives our army, only love, dear love, and our old father's rights. May I soon hear and see him!"}, {"t": "sd", "text": "Exeunt.", "id": 935}, {"t": "scene", "act": 4, "scene": "V", "loc": "A Room in Gloster's Castle.", "id": 936}, {"t": "sd", "text": "Enter Regan and Oswald.", "id": 937}, {"t": "sp", "who": "REGAN", "lines": ["But are my brother's powers set forth?"], "id": 938, "m": "But has my brother-in-law's army set out?"}, {"t": "sp", "who": "OSWALD", "lines": ["Ay, madam."], "id": 939, "m": "Yes, madam."}, {"t": "sp", "who": "REGAN", "lines": ["Himself in person there?"], "id": 940, "m": "Is he there in person?"}, {"t": "sp", "who": "OSWALD", "lines": ["Madam, with much ado.", "Your sister is the better soldier."], "id": 941, "m": "Madam, after a lot of fuss. Your sister is the better soldier."}, {"t": "sp", "who": "REGAN", "lines": ["Lord Edmund spake not with your lord at home?"], "id": 942, "m": "Didn't Lord Edmund speak with your lord at home?"}, {"t": "sp", "who": "OSWALD", "lines": ["No, madam."], "id": 943, "m": "No, madam."}, {"t": "sp", "who": "REGAN", "lines": ["What might import my sister's letter to him?"], "id": 944, "m": "What could my sister's letter to him be about?"}, {"t": "sp", "who": "OSWALD", "lines": ["I know not, lady."], "id": 945, "m": "I don't know, lady."}, {"t": "sp", "who": "REGAN", "lines": ["Faith, he is posted hence on serious matter.", "It was great ignorance, Gloster's eyes being out,", "To let him live: where he arrives he moves", "All hearts against us: Edmund, I think, is gone,", "In pity of his misery, to despatch", "His nighted life; moreover, to descry", "The strength o' the enemy."], "id": 946, "m": "Well, he has rushed off on serious business. It was very stupid, once Gloster's eyes were out, to let him live. Wherever he goes he turns everyone's hearts against us. I think Edmund has gone, out of pity for his misery, to end his darkened life, and also to spy out the enemy's strength."}, {"t": "sp", "who": "OSWALD", "lines": ["I must needs after him, madam, with my letter."], "id": 947, "m": "I must go after him, madam, with my letter."}, {"t": "sp", "who": "REGAN", "lines": ["Our troops set forth to-morrow: stay with us;", "The ways are dangerous."], "id": 948, "m": "Our troops set out tomorrow. Stay with us. The roads are dangerous."}, {"t": "sp", "who": "OSWALD", "lines": ["I may not, madam:", "My lady charg'd my duty in this business."], "id": 949, "m": "I can't, madam. My lady ordered me to do this as my duty."}, {"t": "sp", "who": "REGAN", "lines": ["Why should she write to Edmund? Might not you", "Transport her purposes by word? Belike,", "Something,—I know not what:—I'll love thee much—", "Let me unseal the letter."], "id": 950, "m": "Why should she write to Edmund? Couldn't you carry her message by word of mouth? Perhaps something... I don't know what. I'll be very grateful to you. Let me open the letter."}, {"t": "sp", "who": "OSWALD", "lines": ["Madam, I had rather,—"], "id": 951, "m": "Madam, I'd rather..."}, {"t": "sp", "who": "REGAN", "lines": ["I know your lady does not love her husband;", "I am sure of that: and at her late being here", "She gave strange eyeliads and most speaking looks", "To noble Edmund. I know you are of her bosom."], "id": 952, "m": "I know your lady doesn't love her husband. I'm sure of that. When she was here recently she gave strange glances and very meaningful looks to noble Edmund. I know you're in her confidence."}, {"t": "sp", "who": "OSWALD", "lines": ["I, madam?"], "id": 953, "m": "I, madam?"}, {"t": "sp", "who": "REGAN", "lines": ["I speak in understanding; you are, I know't:", "Therefore I do advise you, take this note:", "My lord is dead; Edmund and I have talk'd;", "And more convenient is he for my hand", "Than for your lady's.—You may gather more.", "If you do find him, pray you give him this;", "And when your mistress hears thus much from you,", "I pray desire her call her wisdom to her", "So, fare you well.", "If you do chance to hear of that blind traitor,", "Preferment falls on him that cuts him off."], "id": 954, "m": "I know what I'm saying. You are. I know it. So I advise you, take note of this. My husband is dead. Edmund and I have talked, and he's more suitable to marry me than your lady. You can work out the rest. If you find him, please give him this. And when you tell your mistress all this, please tell her to come to her senses. So, goodbye. If you happen to hear of that blind traitor, promotion awaits the man who kills him."}, {"t": "sp", "who": "OSWALD", "lines": ["Would I could meet him, madam! I should show", "What party I do follow."], "id": 955, "m": "I wish I could meet him, madam! I'd show which side I'm on."}, {"t": "sp", "who": "REGAN", "lines": ["Fare thee well."], "id": 956, "m": "Goodbye."}, {"t": "sd", "text": "Exeunt.", "id": 957}, {"t": "scene", "act": 4, "scene": "VI", "loc": "The country near Dover.", "id": 958}, {"t": "sd", "text": "Enter Gloster, and Edgar dressed like a peasant.", "id": 959}, {"t": "sp", "who": "GLOSTER", "lines": ["When shall I come to the top of that same hill?"], "id": 960, "m": "When will I reach the top of that hill?"}, {"t": "sp", "who": "EDGAR", "lines": ["You do climb up it now: look, how we labour."], "id": 961, "m": "You're climbing it now. Feel how hard we're working."}, {"t": "sp", "who": "GLOSTER", "lines": ["Methinks the ground is even."], "id": 962, "m": "I think the ground is level."}, {"t": "sp", "who": "EDGAR", "lines": ["Horrible steep.", "Hark, do you hear the sea?"], "id": 963, "m": "It's horribly steep. Listen, can you hear the sea?"}, {"t": "sp", "who": "GLOSTER", "lines": ["No, truly."], "id": 964, "m": "No, honestly."}, {"t": "sp", "who": "EDGAR", "lines": ["Why, then, your other senses grow imperfect", "By your eyes' anguish."], "id": 965, "m": "Why, then, your other senses are getting worse because of the pain in your eyes."}, {"t": "sp", "who": "GLOSTER", "lines": ["So may it be indeed:", "Methinks thy voice is alter'd; and thou speak'st", "In better phrase and matter than thou didst."], "id": 966, "m": "That may well be. I think your voice has changed, and you speak with better words and more sense than you did."}, {"t": "sp", "who": "EDGAR", "lines": ["You are much deceiv'd: in nothing am I chang'd", "But in my garments."], "id": 967, "m": "You're very much mistaken. Nothing about me has changed except my clothes."}, {"t": "sp", "who": "GLOSTER", "lines": ["Methinks you're better spoken."], "id": 968, "m": "I think you speak better."}, {"t": "sp", "who": "EDGAR", "lines": ["Come on, sir; here's the place:—stand still.—How fearful", "And dizzy 'tis to cast one's eyes so low!", "The crows and choughs that wing the midway air", "Show scarce so gross as beetles: half way down", "Hangs one that gathers samphire—dreadful trade!", "Methinks he seems no bigger than his head:", "The fishermen that walk upon the beach", "Appear like mice; and yond tall anchoring bark,", "Diminish'd to her cock; her cock a buoy", "Almost too small for sight: the murmuring surge", "That on the unnumber'd idle pebble chafes", "Cannot be heard so high.—I'll look no more;", "Lest my brain turn, and the deficient sight", "Topple down headlong."], "id": 969, "m": "Come on, sir, here's the place. Stand still. How frightening and dizzying it is to look so far down! The crows and jackdaws flying halfway down hardly look as big as beetles. Halfway down hangs a man gathering samphire. What a dreadful job! He seems no bigger than his head. The fishermen walking on the beach look like mice, and that tall ship at anchor over there has shrunk to the size of her little rowing boat, and her rowing boat to a buoy almost too small to see. The murmuring waves that rub against the countless pebbles can't be heard from this high up. I won't look any more, in case my brain spins and my failing sight sends me toppling headfirst."}, {"t": "sp", "who": "GLOSTER", "lines": ["Set me where you stand."], "id": 970, "m": "Put me where you're standing."}, {"t": "sp", "who": "EDGAR", "lines": ["Give me your hand:—you are now within a foot", "Of th' extreme verge: for all beneath the moon", "Would I not leap upright."], "id": 971, "m": "Give me your hand. You're now within a foot of the very edge. I wouldn't jump up and down here for everything under the moon."}, {"t": "sp", "who": "GLOSTER", "lines": ["Let go my hand.", "Here, friend, 's another purse; in it a jewel", "Well worth a poor man's taking: fairies and gods", "Prosper it with thee! Go thou further off;", "Bid me farewell, and let me hear thee going."], "id": 972, "m": "Let go of my hand. Here, friend, is another purse. There's a jewel in it worth a poor man's having. May fairies and gods make it prosper for you! Go further away. Say goodbye to me, and let me hear you going."}, {"t": "sp", "who": "EDGAR", "lines": ["Now fare ye well, good sir."], "id": 973, "m": "Goodbye then, good sir."}, {"t": "sd", "text": "Seems to go.", "id": 974}, {"t": "sp", "who": "GLOSTER", "lines": ["With all my heart."], "id": 975, "m": "With all my heart."}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] Why I do trifle thus with his despair", "Is done to cure it."], "id": 976, "m": "[Aside] The reason I'm playing with his despair like this is to cure it."}, {"t": "sp", "who": "GLOSTER", "lines": ["O you mighty gods!", "This world I do renounce, and, in your sights,", "Shake patiently my great affliction off:", "If I could bear it longer, and not fall", "To quarrel with your great opposeless wills,", "My snuff and loathed part of nature should", "Burn itself out. If Edgar live, O, bless him!—", "Now, fellow, fare thee well."], "id": 977, "m": "Oh, you mighty gods! I give up this world, and in your sight I patiently shake off my great suffering. If I could bear it any longer without falling into rebellion against your great, unstoppable wills, the burnt-out, hated stub of my life would burn itself out naturally. If Edgar is alive, oh, bless him! Now, fellow, goodbye."}, {"t": "sp", "who": "EDGAR", "lines": ["Gone, sir:—farewell.—"], "id": 978, "m": "I'm gone, sir. Goodbye. [Gloster falls forward.]"}, {"t": "sd", "text": "Gloster leaps, and falls along.", "id": 979}, {"t": "sp", "who": "EDGAR", "cont": 1, "lines": ["And yet I know not how conceit may rob", "The treasury of life when life itself", "Yields to the theft: had he been where he thought,", "By this had thought been past.—Alive or dead?", "Ho you, sir! friend! Hear you, sir?—speak!—", "Thus might he pass indeed:—yet he revives.—", "What are you, sir?"], "id": 980, "m": "And yet I don't know whether imagination can rob life of its treasure when life itself gives in to the theft. If he'd been where he thought he was, by now he'd be past all thought. Alive or dead? Hey, you, sir! Friend! Do you hear me, sir? Speak! He might really die like this. But he's coming round. Who are you, sir?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Away, and let me die."], "id": 981, "m": "Go away, and let me die."}, {"t": "sp", "who": "EDGAR", "lines": ["Hadst thou been aught but gossamer, feathers, air,", "So many fathom down precipitating,", "Thou'dst shiver'd like an egg: but thou dost breathe;", "Hast heavy substance; bleed'st not; speak'st; art sound.", "Ten masts at each make not the altitude", "Which thou hast perpendicularly fell:", "Thy life is a miracle.—Speak yet again."], "id": 982, "m": "If you'd been made of anything except gossamer, feathers or air, falling so many fathoms down, you'd have smashed like an egg. But you're breathing, you have a solid body, you're not bleeding, you're speaking, you're in one piece. Ten masts on top of each other wouldn't reach the height you've fallen straight down. Your life is a miracle. Speak again."}, {"t": "sp", "who": "GLOSTER", "lines": ["But have I fall'n, or no?"], "id": 983, "m": "But have I fallen, or not?"}, {"t": "sp", "who": "EDGAR", "lines": ["From the dread summit of this chalky bourn.", "Look up a-height;—the shrill-gorg'd lark so far", "Cannot be seen or heard: do but look up."], "id": 984, "m": "From the dreadful top of this chalk cliff. Look up there. The shrill-voiced lark can't be seen or heard from so far up. Just look up."}, {"t": "sp", "who": "GLOSTER", "lines": ["Alack, I have no eyes.—", "Is wretchedness depriv'd that benefit", "To end itself by death? 'Twas yet some comfort", "When misery could beguile the tyrant's rage", "And frustrate his proud will."], "id": 985, "m": "Oh dear, I have no eyes. Is misery denied even the comfort of ending itself in death? It was some comfort once, when misery could cheat the tyrant's rage and defeat his proud will by suicide."}, {"t": "sp", "who": "EDGAR", "lines": ["Give me your arm:", "Up:—so.—How is't? Feel you your legs? You stand."], "id": 986, "m": "Give me your arm. Up. That's it. How are you? Can you feel your legs? You're standing."}, {"t": "sp", "who": "GLOSTER", "lines": ["Too well, too well."], "id": 987, "m": "Too well, too well."}, {"t": "sp", "who": "EDGAR", "lines": ["This is above all strangeness.", "Upon the crown o' the cliff what thing was that", "Which parted from you?"], "id": 988, "m": "This is beyond all strangeness. On the top of the cliff, what was that thing that left you?"}, {"t": "sp", "who": "GLOSTER", "lines": ["A poor unfortunate beggar."], "id": 989, "m": "A poor unfortunate beggar."}, {"t": "sp", "who": "EDGAR", "lines": ["As I stood here below, methought his eyes", "Were two full moons; he had a thousand noses,", "Horns whelk'd and wav'd like the enridged sea:", "It was some fiend; therefore, thou happy father,", "Think that the clearest gods, who make them honours", "Of men's impossibility, have preserv'd thee."], "id": 990, "m": "As I stood down here, I thought his eyes were like two full moons. He had a thousand noses and horns twisted and waving like the rippling sea. It was some devil. So, you lucky father, believe that the pure gods, who earn their glory by doing what is impossible for men, have saved you."}, {"t": "sp", "who": "GLOSTER", "lines": ["I do remember now: henceforth I'll bear", "Affliction till it do cry out itself,", "'Enough, enough,' and die. That thing you speak of,", "I took it for a man; often 'twould say,", "'The fiend, the fiend':—he led me to that place."], "id": 991, "m": "I remember now. From now on I'll bear suffering until it cries out itself, 'Enough, enough,' and dies. That thing you're talking about, I thought it was a man. It often said 'The devil, the devil.' He led me to that place."}, {"t": "sp", "who": "EDGAR", "lines": ["Bear free and patient thoughts.—But who comes here?"], "id": 992, "m": "Keep your thoughts free and patient. But who's coming here?"}, {"t": "sd", "text": "Enter Lear, fantastically dressed up with flowers.", "id": 993}, {"t": "sp", "who": "EDGAR", "cont": 1, "lines": ["The safer sense will ne'er accommodate", "His master thus."], "id": 994, "m": "A sane mind would never let its owner dress like this."}, {"t": "sp", "who": "LEAR", "lines": ["No, they cannot touch me for coining;", "I am the king himself."], "id": 995, "m": "No, they can't arrest me for making coins. I am the King himself."}, {"t": "sp", "who": "EDGAR", "lines": ["O thou side-piercing sight!"], "id": 996, "m": "Oh, heart-breaking sight!"}, {"t": "sp", "who": "LEAR", "lines": ["Nature 's above art in that respect.—There's your press money.", "That fellow handles his bow like a crow-keeper: draw me a", "clothier's yard.—Look, look, a mouse! Peace, peace;—this piece", "of toasted cheese will do't. There's my gauntlet; I'll prove it", "on a giant.—Bring up the brown bills. O, well flown, bird!—i'", "the clout, i' the clout: hewgh!—Give the word."], "id": 997, "m": "Nature is better than art in that respect. There's your enlistment money. That fellow handles his bow like a scarecrow. Draw it back a full yard for me. Look, look, a mouse! Quiet, quiet. This piece of toasted cheese will catch it. There's my glove. I'll challenge a giant with it. Bring up the pikemen. Oh, well flown, bird! In the target, in the target! Whoosh! Give the password."}, {"t": "sp", "who": "EDGAR", "lines": ["Sweet marjoram."], "id": 998, "m": "Sweet marjoram."}, {"t": "sp", "who": "LEAR", "lines": ["Pass."], "id": 999, "m": "Pass."}, {"t": "sp", "who": "GLOSTER", "lines": ["I know that voice."], "id": 1000, "m": "I know that voice."}, {"t": "sp", "who": "LEAR", "lines": ["Ha! Goneril with a white beard!—They flattered me like a dog;", "and told me I had white hairs in my beard ere the black ones were", "there. To say 'ay' and 'no' to everything I said!—'Ay' and 'no',", "too, was no good divinity. When the rain came to wet me once, and", "the wind to make me chatter; when the thunder would not peace at", "my bidding; there I found 'em, there I smelt 'em out. Go to, they", "are not men o' their words: they told me I was everything; 'tis a", "lie—I am not ague-proof."], "id": 1001, "m": "Ha! Goneril with a white beard! They flattered me like a dog and told me I had the wisdom of white hairs in my beard before the black ones had even grown. To say 'yes' and 'no' to everything I said! Saying 'yes' and 'no' at once was bad religion too. When the rain came to soak me once, and the wind to make my teeth chatter, when the thunder wouldn't be quiet when I ordered it, then I found them out, then I smelled them out. Go on, they're not men of their word. They told me I was everything. It's a lie. I'm not immune to fever."}, {"t": "sp", "who": "GLOSTER", "lines": ["The trick of that voice I do well remember:", "Is't not the king?"], "id": 1002, "m": "I remember the sound of that voice well. Isn't it the King?"}, {"t": "sp", "who": "LEAR", "lines": ["Ay, every inch a king:", "When I do stare, see how the subject quakes.", "I pardon that man's life.—What was thy cause?—", "Adultery?—", "Thou shalt not die: die for adultery! No:", "The wren goes to't, and the small gilded fly", "Does lecher in my sight.", "Let copulation thrive; for Gloster's bastard son", "Was kinder to his father than my daughters", "Got 'tween the lawful sheets.", "To't, luxury, pell-mell! for I lack soldiers.—", "Behold yond simpering dame,", "Whose face between her forks presages snow;", "That minces virtue, and does shake the head", "To hear of pleasure's name;—", "The fitchew nor the soiled horse goes to't", "With a more riotous appetite.", "Down from the waist they are centaurs,", "Though women all above:", "But to the girdle do the gods inherit,", "Beneath is all the fiend's; there's hell, there's darkness,", "There is the sulphurous pit; burning, scalding, stench,", "consumption; fie, fie, fie! pah, pah!", "Give me an ounce of civet, good apothecary, to sweeten my", "imagination: there's money for thee."], "id": 1003, "m": "Yes, every inch a king. When I stare, see how my subject trembles. I pardon that man's life. What was your crime? Adultery? You won't die. Die for adultery? No. The wren does it, and the little golden fly has sex right in front of me. Let copulation flourish, for Gloster's bastard son was kinder to his father than my daughters, conceived between lawful sheets. Go to it, lust, all together, for I need soldiers. Look at that simpering lady over there, whose face suggests she's frigid between her legs, who acts the virtuous woman and shakes her head at the very mention of pleasure. The polecat and the well-fed horse don't go at it with a wilder appetite. From the waist down they are centaurs, though they're women above. The gods own them down to the belt; below is all the devil's. There's hell, there's darkness, there's the sulphurous pit, burning, scalding, stink, disease. Shame, shame, shame! Ugh, ugh! Give me an ounce of perfume, good chemist, to sweeten my imagination. There's money for you."}, {"t": "sp", "who": "GLOSTER", "lines": ["O, let me kiss that hand!"], "id": 1004, "m": "Oh, let me kiss that hand!"}, {"t": "sp", "who": "LEAR", "lines": ["Let me wipe it first; it smells of mortality."], "id": 1005, "m": "Let me wipe it first. It smells of death."}, {"t": "sp", "who": "GLOSTER", "lines": ["O ruin'd piece of nature! This great world", "Shall so wear out to naught.—Dost thou know me?"], "id": 1006, "m": "Oh, ruined masterpiece of nature! The whole great world will wear out to nothing like this. Do you know me?"}, {"t": "sp", "who": "LEAR", "lines": ["I remember thine eyes well enough. Dost thou squiny at me?", "No, do thy worst, blind Cupid; I'll not love.—Read thou this", "challenge; mark but the penning of it."], "id": 1007, "m": "I remember your eyes well enough. Are you squinting at me? No, do your worst, blind Cupid. I won't fall in love. Read this challenge. Just look at the handwriting."}, {"t": "sp", "who": "GLOSTER", "lines": ["Were all the letters suns, I could not see one."], "id": 1008, "m": "Even if all the letters were suns, I couldn't see one."}, {"t": "sp", "who": "EDGAR", "lines": ["I would not take this from report;—it is,", "And my heart breaks at it."], "id": 1009, "m": "[Aside] I wouldn't believe this if I were told it. But it's real, and my heart breaks at it."}, {"t": "sp", "who": "LEAR", "lines": ["Read."], "id": 1010, "m": "Read."}, {"t": "sp", "who": "GLOSTER", "lines": ["What, with the case of eyes?"], "id": 1011, "m": "What, with the sockets of my eyes?"}, {"t": "sp", "who": "LEAR", "lines": ["O, ho, are you there with me? No eyes in your head, nor no money", "in your purse? Your eyes are in a heavy case, your purse in a", "light: yet you see how this world goes."], "id": 1012, "m": "Oh, ho, is that how it is with you? No eyes in your head, and no money in your purse? Your eyes are in a sad state and your purse is light. Yet you see how the world goes."}, {"t": "sp", "who": "GLOSTER", "lines": ["I see it feelingly."], "id": 1013, "m": "I see it by feeling."}, {"t": "sp", "who": "LEAR", "lines": ["What, art mad? A man may see how the world goes with no eyes.", "Look with thine ears: see how yond justice rails upon yond simple", "thief. Hark, in thine ear: change places; and, handy-dandy, which", "is the justice, which is the thief?—Thou hast seen a farmer's", "dog bark at a beggar?"], "id": 1014, "m": "What, are you mad? A man can see how the world goes without eyes. Look with your ears. See how that judge over there abuses that simple thief. Listen, in your ear: swap them round, and, take your pick, which is the judge and which is the thief? Have you seen a farmer's dog bark at a beggar?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Ay, sir."], "id": 1015, "m": "Yes, sir."}, {"t": "sp", "who": "LEAR", "lines": ["And the creature run from the cur? There thou mightst behold", "the great image of authority: a dog's obeyed in office.—", "Thou rascal beadle, hold thy bloody hand!", "Why dost thou lash that whore? Strip thine own back;", "Thou hotly lust'st to use her in that kind", "For which thou whipp'st her. The usurer hangs the cozener.", "Through tatter'd clothes small vices do appear;", "Robes and furr'd gowns hide all. Plate sin with gold,", "And the strong lance of justice hurtless breaks;", "Arm it in rags, a pygmy's straw does pierce it.", "None does offend, none.—I say none; I'll able 'em:", "Take that of me, my friend, who have the power", "To seal the accuser's lips. Get thee glass eyes;", "And, like a scurvy politician, seem", "To see the things thou dost not.—Now, now, now, now:", "Pull off my boots: harder, harder:—so."], "id": 1016, "m": "And the poor man run from the dog? There you could see the great image of authority: even a dog is obeyed when it holds office. You rascal of a constable, stop your bloody hand! Why are you whipping that whore? Strip your own back. You burn with lust to use her in the very way you're whipping her for. The moneylender hangs the cheat. Small sins show through ragged clothes. Robes and fur gowns hide everything. Cover sin in gold plate and the strong lance of justice breaks harmlessly against it. Dress it in rags and a pygmy's straw can pierce it. Nobody does wrong, nobody, I say nobody. I'll vouch for them. Take that from me, my friend, who has the power to seal the accuser's lips. Get yourself glass eyes, and, like a vile politician, pretend to see the things you don't. Now, now, now, now. Pull off my boots. Harder, harder. That's it."}, {"t": "sp", "who": "EDGAR", "lines": ["O, matter and impertinency mix'd!", "Reason, in madness!"], "id": 1017, "m": "Oh, sense and nonsense mixed! Reason in madness!"}, {"t": "sp", "who": "LEAR", "lines": ["If thou wilt weep my fortunes, take my eyes.", "I know thee well enough; thy name is Gloster:", "Thou must be patient; we came crying hither:", "Thou know'st, the first time that we smell the air", "We wawl and cry.—I will preach to thee: mark."], "id": 1018, "m": "If you want to weep over my misfortunes, take my eyes. I know you well enough. Your name is Gloster. You must be patient. We came into the world crying. You know, the first time we smell the air, we wail and cry. I'll preach to you. Listen."}, {"t": "sp", "who": "GLOSTER", "lines": ["Alack, alack the day!"], "id": 1019, "m": "Oh, oh, what a day!"}, {"t": "sp", "who": "LEAR", "lines": ["When we are born, we cry that we are come", "To this great stage of fools—This' a good block:—", "It were a delicate stratagem to shoe", "A troop of horse with felt: I'll put't in proof,;", "And when I have stol'n upon these sons-in-law,", "Then kill, kill, kill, kill, kill, kill!"], "id": 1020, "m": "When we're born, we cry because we've come to this great stage full of fools. This is a good hat. It would be a clever trick to shoe a troop of horses with felt. I'll try it out, and when I've crept up on these sons-in-law, then kill, kill, kill, kill, kill, kill!"}, {"t": "sd", "text": "Enter a Gentleman, with Attendants", "id": 1021}, {"t": "sp", "who": "GENTLEMAN", "lines": ["O, here he is: lay hand upon him.—Sir,", "Your most dear daughter,—"], "id": 1022, "m": "Oh, here he is. Take hold of him. Sir, your most dear daughter..."}, {"t": "sp", "who": "LEAR", "lines": ["No rescue? What, a prisoner? I am even", "The natural fool of fortune.—Use me well;", "You shall have ransom. Let me have surgeons;", "I am cut to the brains."], "id": 1023, "m": "No rescue? What, a prisoner? I'm the born plaything of fortune. Treat me well. You'll have a ransom. Get me surgeons. I'm wounded in the brain."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["You shall have anything."], "id": 1024, "m": "You'll have anything you want."}, {"t": "sp", "who": "LEAR", "lines": ["No seconds? all myself?", "Why, this would make a man a man of salt,", "To use his eyes for garden water-pots,", "Ay, and for laying Autumn's dust."], "id": 1025, "m": "No one to back me up? All by myself? Why, this would turn a man into a man of salt tears, using his eyes as garden watering cans to settle the autumn dust."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Good sir,—"], "id": 1026, "m": "Good sir..."}, {"t": "sp", "who": "LEAR", "lines": ["I will die bravely, like a smug bridegroom. What!", "I will be jovial: come, come, I am a king,", "My masters, know you that."], "id": 1027, "m": "I'll die bravely, like a neatly dressed bridegroom. What! I'll be cheerful. Come, come, I'm a king, gentlemen, do you know that?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["You are a royal one, and we obey you."], "id": 1028, "m": "You're a royal one, and we obey you."}, {"t": "sp", "who": "LEAR", "lines": ["Then there's life in't. Nay, an you get it, you shall get it", "by running. Sa, sa, sa, sa!"], "id": 1029, "m": "Then there's still hope. Come on, if you want to catch me, you'll have to run for it. Sa, sa, sa, sa!"}, {"t": "sd", "text": "Exit running. Attendants follow.", "id": 1030}, {"t": "sp", "who": "GENTLEMAN", "lines": ["A sight most pitiful in the meanest wretch,", "Past speaking of in a king!—Thou hast one daughter", "Who redeems nature from the general curse", "Which twain have brought her to."], "id": 1031, "m": "A most pitiful sight in the lowest wretch, beyond words in a king! You have one daughter who saves human nature from the general curse that the other two have brought on it."}, {"t": "sp", "who": "EDGAR", "lines": ["Hail, gentle sir."], "id": 1032, "m": "Greetings, kind sir."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Sir, speed you. What's your will?"], "id": 1033, "m": "God speed you, sir. What do you want?"}, {"t": "sp", "who": "EDGAR", "lines": ["Do you hear aught, sir, of a battle toward?"], "id": 1034, "m": "Have you heard anything, sir, about a coming battle?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Most sure and vulgar: every one hears that", "Which can distinguish sound."], "id": 1035, "m": "It's certain and common knowledge. Everyone who can hear has heard it."}, {"t": "sp", "who": "EDGAR", "lines": ["But, by your favour,", "How near's the other army?"], "id": 1036, "m": "But, if you don't mind, how close is the other army?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Near and on speedy foot; the main descry", "Stands on the hourly thought."], "id": 1037, "m": "Close and moving fast. We expect to see the main army any hour now."}, {"t": "sp", "who": "EDGAR", "lines": ["I thank you sir: that's all."], "id": 1038, "m": "Thank you, sir. That's all."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Though that the queen on special cause is here,", "Her army is mov'd on."], "id": 1039, "m": "Although the Queen is staying here for a special reason, her army has moved on."}, {"t": "sp", "who": "EDGAR", "lines": ["I thank you, sir."], "id": 1040, "m": "Thank you, sir."}, {"t": "sd", "text": "Exit Gentleman.", "id": 1041}, {"t": "sp", "who": "GLOSTER", "lines": ["You ever-gentle gods, take my breath from me;", "Let not my worser spirit tempt me again", "To die before you please!"], "id": 1042, "m": "You ever-gentle gods, take my breath from me when you choose. Don't let my worse side tempt me again to die before you want me to!"}, {"t": "sp", "who": "EDGAR", "lines": ["Well pray you, father."], "id": 1043, "m": "That's a good prayer, father."}, {"t": "sp", "who": "GLOSTER", "lines": ["Now, good sir, what are you?"], "id": 1044, "m": "Now, good sir, who are you?"}, {"t": "sp", "who": "EDGAR", "lines": ["A most poor man, made tame to fortune's blows;", "Who, by the art of known and feeling sorrows,", "Am pregnant to good pity. Give me your hand,", "I'll lead you to some biding."], "id": 1045, "m": "A very poor man, made humble by fortune's blows, who, through the lesson of sorrows I've known and felt, am ready to feel pity. Give me your hand. I'll lead you to some shelter."}, {"t": "sp", "who": "GLOSTER", "lines": ["Hearty thanks:", "The bounty and the benison of heaven", "To boot, and boot!"], "id": 1046, "m": "Heartfelt thanks. And may heaven's generosity and blessing be added to my thanks, again and again!"}, {"t": "sd", "text": "Enter Oswald.", "id": 1047}, {"t": "sp", "who": "OSWALD", "lines": ["A proclaim'd prize! Most happy!", "That eyeless head of thine was first fram'd flesh", "To raise my fortunes.—Thou old unhappy traitor,", "Briefly thyself remember:—the sword is out", "That must destroy thee."], "id": 1048, "m": "A wanted man with a price on his head! What luck! That eyeless head of yours was born to make my fortune. You unhappy old traitor, say your prayers quickly. The sword is drawn that will kill you."}, {"t": "sp", "who": "GLOSTER", "lines": ["Now let thy friendly hand", "Put strength enough to it."], "id": 1049, "m": "Then let your friendly hand put enough strength into it."}, {"t": "sd", "text": "Edgar interposes.", "id": 1050}, {"t": "sp", "who": "OSWALD", "lines": ["Wherefore, bold peasant,", "Dar'st thou support a publish'd traitor? Hence;", "Lest that the infection of his fortune take", "Like hold on thee. Let go his arm."], "id": 1051, "m": "Why, you bold peasant, do you dare to help a declared traitor? Get away, in case the plague of his bad luck catches you too. Let go of his arm."}, {"t": "sp", "who": "EDGAR", "lines": ["Chill not let go, zir, without vurther 'casion."], "id": 1052, "m": "I won't let go, zir, without vurther reason."}, {"t": "sp", "who": "OSWALD", "lines": ["Let go, slave, or thou diest!"], "id": 1053, "m": "Let go, slave, or you die!"}, {"t": "sp", "who": "EDGAR", "lines": ["Good gentleman, go your gait, and let poor voke pass. An chud", "ha' bin zwaggered out of my life, 'twould not ha' bin zo long as", "'tis by a vortnight. Nay, come not near the old man; keep out,", "che vore ye, or ise try whether your costard or my bat be the", "harder: chill be plain with you."], "id": 1054, "m": "Good gentleman, go your way, and let poor volk pass. If I could have been bullied out of my life, I'd have been dead a vortnight ago. No, don't come near the old man. Keep away, I warn you, or I'll find out whether your head or my stick is harder. I'll be plain with you."}, {"t": "sp", "who": "OSWALD", "lines": ["Out, dunghill!"], "id": 1055, "m": "Get out, you dung heap!"}, {"t": "sp", "who": "EDGAR", "lines": ["Chill pick your teeth, zir. Come! No matter vor your foins."], "id": 1056, "m": "I'll knock your teeth out, zir. Come on! I don't care about your fancy sword thrusts. [They fight, and Edgar knocks him down.]"}, {"t": "sd", "text": "They fight, and Edgar knocks him down.", "id": 1057}, {"t": "sp", "who": "OSWALD", "lines": ["Slave, thou hast slain me:—villain, take my purse:", "If ever thou wilt thrive, bury my body;", "And give the letters which thou find'st about me", "To Edmund Earl of Gloster; seek him out", "Upon the British party: O, untimely death!", "[Dies.]"], "id": 1058, "m": "Slave, you've killed me. Villain, take my purse. If you ever want to do well, bury my body, and give the letters you find on me to Edmund, Earl of Gloster. Look for him with the British army. Oh, death before my time! [He dies.]"}, {"t": "sp", "who": "EDGAR", "lines": ["I know thee well: a serviceable villain;", "As duteous to the vices of thy mistress", "As badness would desire."], "id": 1059, "m": "I know you well: a villain eager to serve, as dutiful to your mistress's vices as wickedness could want."}, {"t": "sp", "who": "GLOSTER", "lines": ["What, is he dead?"], "id": 1060, "m": "What, is he dead?"}, {"t": "sp", "who": "EDGAR", "lines": ["Sit you down, father; rest you.—", "Let's see these pockets; the letters that he speaks of", "May be my friends.—He's dead; I am only sorry", "He had no other death's-man. Let us see:—", "Leave, gentle wax; and, manners, blame us not:", "To know our enemies' minds, we'd rip their hearts;", "Their papers is more lawful.", "[Reads.] 'Let our reciprocal vows be remembered. You have many", "opportunities to cut him off: if your will want not, time and", "place will be fruitfully offered. There is nothing done if he", "return the conqueror: then am I the prisoner, and his bed my", "gaol; from the loathed warmth whereof deliver me, and supply the", "place for your labour.", "'Your (wife, so I would say) affectionate servant,", "'Goneril.'", "O indistinguish'd space of woman's will!", "A plot upon her virtuous husband's life;", "And the exchange my brother!—Here in the sands", "Thee I'll rake up, the post unsanctified", "Of murderous lechers: and in the mature time", "With this ungracious paper strike the sight", "Of the death-practis'd duke: for him 'tis well", "That of thy death and business I can tell."], "id": 1061, "m": "Sit down, father. Rest. Let's look in these pockets. The letters he talks about may help me. He's dead. I'm only sorry he had no other executioner. Let's see. Excuse me, gentle seal, and, good manners, don't blame us. To know our enemies' minds we'd tear out their hearts. Opening their letters is more lawful. [He reads] 'Remember the vows we made to each other. You have many chances to kill him. If you have the will, time and place will be offered generously. Nothing will have been done if he comes back the winner. Then I'll be the prisoner and his bed my jail. Rescue me from its hateful warmth, and take his place as your reward. Your (wife, I wish I could say) loving servant, Goneril.' Oh, the boundless range of a woman's lust! A plot against her good husband's life, and my brother to replace him! Here in the sand I'll bury you, unholy messenger of murderous lovers. And when the time is right, I'll show this wicked letter to the Duke whose death was plotted. It's lucky for him that I can tell him of your death and your errand."}, {"t": "sd", "text": "Exit Edgar, dragging out the body.", "id": 1062}, {"t": "sp", "who": "GLOSTER", "lines": ["The king is mad: how stiff is my vile sense,", "That I stand up, and have ingenious feeling", "Of my huge sorrows! Better I were distract:", "So should my thoughts be sever'd from my griefs,", "And woes by wrong imaginations lose", "The knowledge of themselves."], "id": 1063, "m": "The King is mad. How stubborn my hateful mind is, that I stay upright and keep a clear awareness of my huge sorrows! Better if I were mad. Then my thoughts would be cut off from my griefs, and through false imaginings my sufferings would forget themselves."}, {"t": "sp", "who": "EDGAR", "lines": ["Give me your hand:"], "id": 1064, "m": "Give me your hand. [Drums far off.]"}, {"t": "sd", "text": "A drum afar off.", "id": 1065}, {"t": "sp", "who": "EDGAR", "cont": 1, "lines": ["Far off methinks I hear the beaten drum:", "Come, father, I'll bestow you with a friend."], "id": 1066, "m": "I think I hear drums beating far away. Come, father, I'll leave you with a friend."}, {"t": "sd", "text": "Exeunt.", "id": 1067}, {"t": "scene", "act": 4, "scene": "VII", "loc": "A Tent in the French Camp. Lear on a bed, asleep, soft music playing; Physician, Gentleman, and others attending.", "id": 1068}, {"t": "sd", "text": "Enter Cordelia, and Kent.", "id": 1069}, {"t": "sp", "who": "CORDELIA", "lines": ["O thou good Kent, how shall I live and work", "To match thy goodness? My life will be too short", "And every measure fail me."], "id": 1070, "m": "Oh, good Kent, how can I live and work enough to match your goodness? My life will be too short, and every effort will fall short."}, {"t": "sp", "who": "KENT", "lines": ["To be acknowledg'd, madam, is o'erpaid.", "All my reports go with the modest truth;", "Nor more nor clipp'd, but so."], "id": 1071, "m": "To be thanked, madam, is more than enough payment. Everything I've told you is the plain truth, no more and no less, just as it was."}, {"t": "sp", "who": "CORDELIA", "lines": ["Be better suited:", "These weeds are memories of those worser hours:", "I pr'ythee, put them off."], "id": 1072, "m": "Put on better clothes. These are reminders of those worse times. Please take them off."}, {"t": "sp", "who": "KENT", "lines": ["Pardon, dear madam;", "Yet to be known shortens my made intent:", "My boon I make it that you know me not", "Till time and I think meet."], "id": 1073, "m": "Forgive me, dear madam. To be recognised now would spoil the plan I've made. I ask as a favour that you don't acknowledge me until the time is right and I think so."}, {"t": "sp", "who": "CORDELIA", "lines": ["Then be't so, my good lord. [To the Physician.] How, does the", "king?"], "id": 1074, "m": "Then so be it, my good lord. [To the Physician] How is the King?"}, {"t": "sp", "who": "PHYSICIAN", "lines": ["Madam, sleeps still."], "id": 1075, "m": "Still asleep, madam."}, {"t": "sp", "who": "CORDELIA", "lines": ["O you kind gods,", "Cure this great breach in his abused nature!", "The untun'd and jarring senses, O, wind up", "Of this child-changed father!"], "id": 1076, "m": "Oh, you kind gods, heal this great wound in his abused nature! Oh, tune again the jangled, untuned senses of this father, changed by his children!"}, {"t": "sp", "who": "PHYSICIAN", "lines": ["So please your majesty", "That we may wake the king: he hath slept long."], "id": 1077, "m": "If your majesty agrees, we may wake the King. He has slept a long time."}, {"t": "sp", "who": "CORDELIA", "lines": ["Be govern'd by your knowledge, and proceed", "I' the sway of your own will. Is he array'd?"], "id": 1078, "m": "Be guided by your knowledge, and do as you think best. Is he dressed?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Ay, madam. In the heaviness of sleep", "We put fresh garments on him."], "id": 1079, "m": "Yes, madam. While he was deeply asleep, we put fresh clothes on him."}, {"t": "sp", "who": "PHYSICIAN", "lines": ["Be by, good madam, when we do awake him;", "I doubt not of his temperance."], "id": 1080, "m": "Stay close, good madam, when we wake him. I'm sure he'll be calm."}, {"t": "sp", "who": "CORDELIA", "lines": ["Very well."], "id": 1081, "m": "Very well."}, {"t": "sp", "who": "PHYSICIAN", "lines": ["Please you draw near.—Louder the music there!"], "id": 1082, "m": "Please come closer. Louder with the music there!"}, {"t": "sp", "who": "CORDELIA", "lines": ["O my dear father! Restoration hang", "Thy medicine on my lips; and let this kiss", "Repair those violent harms that my two sisters", "Have in thy reverence made!"], "id": 1083, "m": "Oh, my dear father! May healing put its medicine on my lips, and may this kiss repair the violent harm my two sisters have done to your dignity!"}, {"t": "sp", "who": "KENT", "lines": ["Kind and dear princess!"], "id": 1084, "m": "Kind and dear princess!"}, {"t": "sp", "who": "CORDELIA", "lines": ["Had you not been their father, these white flakes", "Had challeng'd pity of them. Was this a face", "To be oppos'd against the warring winds?", "To stand against the deep dread-bolted thunder?", "In the most terrible and nimble stroke", "Of quick cross lightning? to watch—,poor perdu!—", "With this thin helm? Mine enemy's dog,", "Though he had bit me, should have stood that night", "Against my fire; and wast thou fain, poor father,", "To hovel thee with swine and rogues forlorn,", "In short and musty straw? Alack, alack!", "'Tis wonder that thy life and wits at once", "Had not concluded all.—He wakes; speak to him."], "id": 1085, "m": "Even if you hadn't been their father, these white hairs should have moved them to pity. Was this a face to be set against the warring winds? To stand against the deep, terrible thunderbolts, in the most terrible and rapid strokes of zigzag lightning? To keep watch, like a poor lost sentry, with this thin covering of hair for a helmet? My enemy's dog, even if it had bitten me, should have stood by my fire that night. And were you forced, poor father, to shelter with pigs and lost wretches in short, musty straw? Oh dear, oh dear! It's a wonder your life and your wits didn't end together. He's waking. Speak to him."}, {"t": "sp", "who": "PHYSICIAN", "lines": ["Madam, do you; 'tis fittest."], "id": 1086, "m": "Madam, you do it. It's most fitting."}, {"t": "sp", "who": "CORDELIA", "lines": ["How does my royal lord? How fares your majesty?"], "id": 1087, "m": "How is my royal lord? How is your majesty?"}, {"t": "sp", "who": "LEAR", "lines": ["You do me wrong to take me out o' the grave:—", "Thou art a soul in bliss; but I am bound", "Upon a wheel of fire, that mine own tears", "Do scald like molten lead."], "id": 1088, "m": "You do me wrong to take me out of the grave. You are a soul in heaven, but I am tied to a wheel of fire, and my own tears scald like molten lead."}, {"t": "sp", "who": "CORDELIA", "lines": ["Sir, do you know me?"], "id": 1089, "m": "Sir, do you know me?"}, {"t": "sp", "who": "LEAR", "lines": ["You are a spirit, I know: when did you die?"], "id": 1090, "m": "You're a spirit, I know. When did you die?"}, {"t": "sp", "who": "CORDELIA", "lines": ["Still, still, far wide!"], "id": 1091, "m": "Still, still far from his senses!"}, {"t": "sp", "who": "PHYSICIAN", "lines": ["He's scarce awake: let him alone awhile."], "id": 1092, "m": "He's hardly awake. Leave him alone for a while."}, {"t": "sp", "who": "LEAR", "lines": ["Where have I been? Where am I?—Fair daylight,—", "I am mightily abus'd.—I should e'en die with pity,", "To see another thus.—I know not what to say.—", "I will not swear these are my hands:—let's see;", "I feel this pin prick. Would I were assur'd", "Of my condition!"], "id": 1093, "m": "Where have I been? Where am I? Bright daylight? I've been badly deceived. I'd die of pity to see someone else like this. I don't know what to say. I won't swear these are my hands. Let's see. I feel this pin prick. I wish I were sure of my condition!"}, {"t": "sp", "who": "CORDELIA", "lines": ["O, look upon me, sir,", "And hold your hands in benediction o'er me.—", "No, sir, you must not kneel."], "id": 1094, "m": "Oh, look at me, sir, and hold your hands over me in blessing. No, sir, you mustn't kneel."}, {"t": "sp", "who": "LEAR", "lines": ["Pray, do not mock me:", "I am a very foolish fond old man,", "Fourscore and upward, not an hour more nor less;", "And, to deal plainly,", "I fear I am not in my perfect mind.", "Methinks I should know you, and know this man;", "Yet I am doubtful: for I am mainly ignorant", "What place this is; and all the skill I have", "Remembers not these garments; nor I know not", "Where I did lodge last night. Do not laugh at me;", "For, as I am a man, I think this lady", "To be my child Cordelia."], "id": 1095, "m": "Please don't make fun of me. I'm a very foolish, silly old man, over eighty, not an hour more or less, and to be honest, I'm afraid I'm not in my right mind. I think I should know you, and know this man, but I'm not sure, because I've no idea what place this is, and no matter how hard I try I can't remember these clothes, or where I slept last night. Don't laugh at me, for as surely as I'm a man, I think this lady is my child Cordelia."}, {"t": "sp", "who": "CORDELIA", "lines": ["And so I am. I am."], "id": 1096, "m": "And so I am. I am."}, {"t": "sp", "who": "LEAR", "lines": ["Be your tears wet? yes, faith. I pray, weep not:", "If you have poison for me, I will drink it.", "I know you do not love me; for your sisters", "Have, as I do remember, done me wrong:", "You have some cause, they have not."], "id": 1097, "m": "Are your tears wet? Yes, they are. Please don't cry. If you have poison for me, I'll drink it. I know you don't love me, because your sisters, as far as I can remember, have wronged me. You have some reason. They have none."}, {"t": "sp", "who": "CORDELIA", "lines": ["No cause, no cause."], "id": 1098, "m": "No reason, no reason."}, {"t": "sp", "who": "LEAR", "lines": ["Am I in France?"], "id": 1099, "m": "Am I in France?"}, {"t": "sp", "who": "KENT", "lines": ["In your own kingdom, sir."], "id": 1100, "m": "In your own kingdom, sir."}, {"t": "sp", "who": "LEAR", "lines": ["Do not abuse me."], "id": 1101, "m": "Don't trick me."}, {"t": "sp", "who": "PHYSICIAN", "lines": ["Be comforted, good madam: the great rage,", "You see, is kill'd in him: and yet it is danger", "To make him even o'er the time he has lost.", "Desire him to go in; trouble him no more", "Till further settling."], "id": 1102, "m": "Take comfort, good madam. The great madness, you see, has been killed in him. But it's still dangerous to make him go over the time he's lost. Ask him to go in, and don't trouble him any more until he's more settled."}, {"t": "sp", "who": "CORDELIA", "lines": ["Will't please your highness walk?"], "id": 1103, "m": "Will your highness walk?"}, {"t": "sp", "who": "LEAR", "lines": ["You must bear with me:", "Pray you now, forget and forgive: I am old and foolish."], "id": 1104, "m": "You must be patient with me. Please, now, forget and forgive. I'm old and foolish."}, {"t": "sd", "text": "Exeunt Lear, Cordelia, Physician, and Attendants.", "id": 1105}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Holds it true, sir, that the Duke of Cornwall was so slain?"], "id": 1106, "m": "Is it true, sir, that the Duke of Cornwall was killed like that?"}, {"t": "sp", "who": "KENT", "lines": ["Most certain, sir."], "id": 1107, "m": "Quite certain, sir."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Who is conductor of his people?"], "id": 1108, "m": "Who's commanding his army?"}, {"t": "sp", "who": "KENT", "lines": ["As 'tis said, the bastard son of Gloster."], "id": 1109, "m": "They say it's Gloster's bastard son."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["They say Edgar, his banished son, is with the Earl of Kent", "in Germany."], "id": 1110, "m": "They say Edgar, his banished son, is with the Earl of Kent in Germany."}, {"t": "sp", "who": "KENT", "lines": ["Report is changeable. 'Tis time to look about; the powers of", "the kingdom approach apace."], "id": 1111, "m": "Rumours change. It's time to be on our guard. The armies of the kingdom are coming fast."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["The arbitrement is like to be bloody.", "Fare you well, sir."], "id": 1112, "m": "The battle is likely to be bloody. Goodbye, sir."}, {"t": "sd", "text": "Exit.", "id": 1113}, {"t": "sp", "who": "KENT", "lines": ["My point and period will be throughly wrought,", "Or well or ill, as this day's battle's fought."], "id": 1114, "m": "My life's purpose and its end will be completely worked out, for good or ill, according to how today's battle is fought."}, {"t": "sd", "text": "Exit.", "id": 1115}, {"t": "scene", "act": 5, "scene": "I", "loc": "The Camp of the British Forces near Dover.", "id": 1116}, {"t": "sd", "text": "Enter, with drum and colours, Edmund, Regan, Officers, Soldiers, and others.", "id": 1117}, {"t": "sp", "who": "EDMUND", "lines": ["Know of the duke if his last purpose hold,", "Or whether since he is advis'd by aught", "To change the course: he's full of alteration", "And self-reproving:—bring his constant pleasure.", "[To an Officer, who goes out.]"], "id": 1118, "m": "Find out from the Duke whether his latest plan still stands, or whether something has since persuaded him to change course. He's full of changes and self-doubt. Bring b
