uld as well be brought", "To knee his throne, and, squire-like, pension beg", "To keep base life afoot.—Return with her?", "Persuade me rather to be slave and sumpter", "To this detested groom.", "[Pointing to Oswald.]"], "id": 562, "m": "Go back to her, with fifty men dismissed? No, I'd rather give up all roofs and choose to fight against the hostile weather, and be the companion of the wolf and the owl. Need's sharp pinch! Go back with her? Why, I could just as easily be brought to kneel at the throne of that hot-blooded King of France, who took my youngest without a dowry, and beg like a servant for an allowance to keep my miserable life going. Go back with her? Rather persuade me to be a slave and a packhorse to this hateful servant. [He points at Oswald.]"}, {"t": "sp", "who": "GONERIL", "lines": ["At your choice, sir."], "id": 563, "m": "As you choose, sir."}, {"t": "sp", "who": "LEAR", "lines": ["I pr'ythee, daughter, do not make me mad:", "I will not trouble thee, my child; farewell:", "We'll no more meet, no more see one another:—", "But yet thou art my flesh, my blood, my daughter;", "Or rather a disease that's in my flesh,", "Which I must needs call mine: thou art a boil,", "A plague sore, an embossed carbuncle", "In my corrupted blood. But I'll not chide thee;", "Let shame come when it will, I do not call it:", "I do not bid the thunder-bearer shoot", "Nor tell tales of thee to high-judging Jove:", "Mend when thou canst; be better at thy leisure:", "I can be patient; I can stay with Regan,", "I and my hundred knights."], "id": 564, "m": "Please, daughter, don't drive me mad. I won't trouble you, my child. Goodbye. We'll never meet again, never see each other again. But you are still my flesh, my blood, my daughter. Or rather a disease in my flesh that I have to call mine. You are a boil, a plague sore, a swollen tumour in my diseased blood. But I won't scold you. Let shame come when it will, I won't call for it. I won't ask Jupiter, the thunder-bearer, to strike you, or tell tales about you to him, the highest judge. Improve when you can. Become better in your own time. I can be patient. I can stay with Regan, I and my hundred knights."}, {"t": "sp", "who": "REGAN", "lines": ["Not altogether so:", "I look'd not for you yet, nor am provided", "For your fit welcome. Give ear, sir, to my sister;", "For those that mingle reason with your passion", "Must be content to think you old, and so—", "But she knows what she does."], "id": 565, "m": "Not quite. I wasn't expecting you yet, and I'm not ready to welcome you properly. Listen to my sister, sir. Those who see your passion with reason must conclude that you are old, and so... But she knows what she's doing."}, {"t": "sp", "who": "LEAR", "lines": ["Is this well spoken?"], "id": 566, "m": "Is this said sincerely?"}, {"t": "sp", "who": "REGAN", "lines": ["I dare avouch it, sir: what, fifty followers?", "Is it not well? What should you need of more?", "Yea, or so many, sith that both charge and danger", "Speak 'gainst so great a number? How in one house", "Should many people, under two commands,", "Hold amity? 'Tis hard; almost impossible."], "id": 567, "m": "I dare say it is, sir. What, fifty followers? Isn't that enough? What do you need more for? Or even that many, since both cost and danger argue against so many? How can many people in one house, under two masters, keep the peace? It's hard, almost impossible."}, {"t": "sp", "who": "GONERIL", "lines": ["Why might not you, my lord, receive attendance", "From those that she calls servants, or from mine?"], "id": 568, "m": "Why couldn't you, my lord, be looked after by her servants, or by mine?"}, {"t": "sp", "who": "REGAN", "lines": ["Why not, my lord? If then they chanc'd to slack you,", "We could control them. If you will come to me,—", "For now I spy a danger,—I entreat you", "To bring but five-and-twenty: to no more", "Will I give place or notice."], "id": 569, "m": "Why not, my lord? If they happened to neglect you, we could control them. If you come to me, since I now see a danger, I beg you to bring only twenty-five. I won't make room for or recognise any more."}, {"t": "sp", "who": "LEAR", "lines": ["I gave you all,—"], "id": 570, "m": "I gave you everything..."}, {"t": "sp", "who": "REGAN", "lines": ["And in good time you gave it."], "id": 571, "m": "And it was high time you gave it."}, {"t": "sp", "who": "LEAR", "lines": ["Made you my guardians, my depositaries;", "But kept a reservation to be follow'd", "With such a number. What, must I come to you", "With five-and-twenty, Regan? said you so?"], "id": 572, "m": "...made you my guardians, the keepers of my wealth, but kept the condition that I'd be followed by a certain number. What, must I come to you with twenty-five, Regan? Is that what you said?"}, {"t": "sp", "who": "REGAN", "lines": ["And speak't again my lord; no more with me."], "id": 573, "m": "And I say it again, my lord. No more with me."}, {"t": "sp", "who": "LEAR", "lines": ["Those wicked creatures yet do look well-favour'd", "When others are more wicked; not being the worst", "Stands in some rank of praise.—", "[To Goneril.] I'll go with thee:", "Thy fifty yet doth double five-and-twenty,", "And thou art twice her love."], "id": 574, "m": "Wicked creatures still look good when others are even more wicked. Not being the worst deserves some praise. [To Goneril] I'll go with you. Your fifty is still double twenty-five, so your love is twice hers."}, {"t": "sp", "who": "GONERIL", "lines": ["Hear, me, my lord:", "What need you five-and-twenty, ten, or five,", "To follow in a house where twice so many", "Have a command to tend you?"], "id": 575, "m": "Listen to me, my lord. Why do you need twenty-five, ten or five followers, in a house where twice as many have orders to serve you?"}, {"t": "sp", "who": "REGAN", "lines": ["What need one?"], "id": 576, "m": "Why do you need one?"}, {"t": "sp", "who": "LEAR", "lines": ["O, reason not the need: our basest beggars", "Are in the poorest thing superfluous:", "Allow not nature more than nature needs,", "Man's life is cheap as beast's: thou art a lady;", "If only to go warm were gorgeous,", "Why, nature needs not what thou gorgeous wear'st", "Which scarcely keeps thee warm.—But, for true need,—", "You heavens, give me that patience, patience I need!", "You see me here, you gods, a poor old man,", "As full of grief as age; wretched in both!", "If it be you that stirs these daughters' hearts", "Against their father, fool me not so much", "To bear it tamely; touch me with noble anger,", "And let not women's weapons, water-drops,", "Stain my man's cheeks!—No, you unnatural hags,", "I will have such revenges on you both", "That all the world shall,—I will do such things,—", "What they are yet, I know not; but they shall be", "The terrors of the earth. You think I'll weep;", "No, I'll not weep:—", "I have full cause of weeping; but this heart", "Shall break into a hundred thousand flaws", "Or ere I'll weep.—O fool, I shall go mad!"], "id": 577, "m": "Oh, don't argue about need! Our lowest beggars have something more than they need, even if it's the poorest thing. If you don't allow human nature more than it needs, a man's life is as cheap as an animal's. You are a lady. If being warm were all it took to be gorgeous, nature wouldn't need the gorgeous clothes you wear, which hardly keep you warm. But as for true need... You heavens, give me patience, patience is what I need! You see me here, you gods, a poor old man, as full of grief as of years, wretched in both! If it's you who stir these daughters' hearts against their father, don't make me such a fool as to take it meekly. Fill me with noble anger, and don't let women's weapons, tears, stain my man's cheeks! No, you unnatural witches, I'll have such revenge on you both that the whole world will... I will do such things... What they are I don't know yet, but they'll be the terror of the earth. You think I'll weep. No, I won't weep. I have every reason to weep, but this heart will break into a hundred thousand pieces before I weep. Oh Fool, I'll go mad!"}, {"t": "sd", "text": "Exeunt Lear, Gloster, Kent, and Fool. Storm heard at a distance.", "id": 578}, {"t": "sp", "who": "CORNWALL", "lines": ["Let us withdraw; 'twill be a storm."], "id": 579, "m": "Let's go inside. There's going to be a storm."}, {"t": "sp", "who": "REGAN", "lines": ["This house is little: the old man and his people", "Cannot be well bestow'd."], "id": 580, "m": "This house is small. The old man and his people can't be properly lodged."}, {"t": "sp", "who": "GONERIL", "lines": ["'Tis his own blame; hath put himself from rest", "And must needs taste his folly."], "id": 581, "m": "It's his own fault. He's shut himself out from comfort and must suffer for his folly."}, {"t": "sp", "who": "REGAN", "lines": ["For his particular, I'll receive him gladly,", "But not one follower."], "id": 582, "m": "As for him personally, I'll take him in gladly, but not a single follower."}, {"t": "sp", "who": "GONERIL", "lines": ["So am I purpos'd.", "Where is my lord of Gloster?"], "id": 583, "m": "That's my intention too. Where is my lord of Gloster?"}, {"t": "sp", "who": "CORNWALL", "lines": ["Followed the old man forth:—he is return'd."], "id": 584, "m": "He followed the old man out. He's back."}, {"t": "sd", "text": "Re-enter Gloster.", "id": 585}, {"t": "sp", "who": "GLOSTER", "lines": ["The king is in high rage."], "id": 586, "m": "The King is in a terrible rage."}, {"t": "sp", "who": "CORNWALL", "lines": ["Whither is he going?"], "id": 587, "m": "Where's he going?"}, {"t": "sp", "who": "GLOSTER", "lines": ["He calls to horse; but will I know not whither."], "id": 588, "m": "He's calling for his horses, but I don't know where he's going."}, {"t": "sp", "who": "CORNWALL", "lines": ["'Tis best to give him way; he leads himself."], "id": 589, "m": "It's best to let him go. He's his own guide."}, {"t": "sp", "who": "GONERIL", "lines": ["My lord, entreat him by no means to stay."], "id": 590, "m": "My lord, don't beg him to stay on any account."}, {"t": "sp", "who": "GLOSTER", "lines": ["Alack, the night comes on, and the high winds", "Do sorely ruffle; for many miles about", "There's scarce a bush."], "id": 591, "m": "Oh dear, night is falling, and the high winds are raging. For many miles around there's hardly a bush."}, {"t": "sp", "who": "REGAN", "lines": ["O, sir, to wilful men", "The injuries that they themselves procure", "Must be their schoolmasters. Shut up your doors:", "He is attended with a desperate train;", "And what they may incense him to, being apt", "To have his ear abus'd, wisdom bids fear."], "id": 592, "m": "Oh, sir, stubborn men must be taught by the injuries they bring on themselves. Lock your doors. He has a desperate gang with him, and since he's ready to listen to lies, wisdom tells us to fear what they might stir him up to do."}, {"t": "sp", "who": "CORNWALL", "lines": ["Shut up your doors, my lord; 'tis a wild night:", "My Regan counsels well: come out o' the storm."], "id": 593, "m": "Lock your doors, my lord. It's a wild night. My Regan gives good advice. Come in out of the storm."}, {"t": "sd", "text": "Exeunt.", "id": 594}, {"t": "scene", "act": 3, "scene": "I", "loc": "A Heath.", "id": 595}, {"t": "sd", "text": "A storm with thunder and lightning. Enter Kent and a Gentleman, meeting.", "id": 596}, {"t": "sp", "who": "KENT", "lines": ["Who's there, besides foul weather?"], "id": 597, "m": "Who's there, apart from the foul weather?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["One minded like the weather, most unquietly."], "id": 598, "m": "Someone whose mind is like the weather: very troubled."}, {"t": "sp", "who": "KENT", "lines": ["I know you. Where's the king?"], "id": 599, "m": "I know you. Where's the King?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Contending with the fretful elements;", "Bids the wind blow the earth into the sea,", "Or swell the curled waters 'bove the main,", "That things might change or cease; tears his white hair,", "Which the impetuous blasts, with eyeless rage,", "Catch in their fury and make nothing of;", "Strives in his little world of man to outscorn", "The to-and-fro-conflicting wind and rain.", "This night, wherein the cub-drawn bear would couch,", "The lion and the belly-pinched wolf", "Keep their fur dry, unbonneted he runs,", "And bids what will take all."], "id": 600, "m": "Fighting with the furious elements. He orders the wind to blow the land into the sea, or to raise the curling waves above the mainland, so that everything might change or end. He tears his white hair, which the violent gusts, in their blind rage, catch up and toss about like nothing. In his little human world he tries to outdo the wind and rain beating back and forth. On this night, when even the bear with her cubs sucked dry would stay in her den, and the lion and the starving wolf keep their fur dry, he runs about with no hat and dares whatever will to take everything."}, {"t": "sp", "who": "KENT", "lines": ["But who is with him?"], "id": 601, "m": "But who is with him?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["None but the fool, who labours to out-jest", "His heart-struck injuries."], "id": 602, "m": "No one but the Fool, who works hard to joke away the injuries that have broken his heart."}, {"t": "sp", "who": "KENT", "lines": ["Sir, I do know you;", "And dare, upon the warrant of my note,", "Commend a dear thing to you. There is division,", "Although as yet the face of it be cover'd", "With mutual cunning, 'twixt Albany and Cornwall;", "Who have,—as who have not, that their great stars", "Throne and set high?—servants, who seem no less,", "Which are to France the spies and speculations", "Intelligent of our state; what hath been seen,", "Either in snuffs and packings of the dukes;", "Or the hard rein which both of them have borne", "Against the old kind king; or something deeper,", "Whereof, perchance, these are but furnishings;—", "But, true it is, from France there comes a power", "Into this scatter'd kingdom; who already,", "Wise in our negligence, have secret feet", "In some of our best ports, and are at point", "To show their open banner.—Now to you:", "If on my credit you dare build so far", "To make your speed to Dover, you shall find", "Some that will thank you making just report", "Of how unnatural and bemadding sorrow", "The king hath cause to plain.", "I am a gentleman of blood and breeding;", "And from some knowledge and assurance offer", "This office to you."], "id": 603, "m": "Sir, I know you, and on the strength of what I've observed of you I dare to trust you with something important. There is a split, though so far both sides are hiding it with cunning, between Albany and Cornwall. Like everyone whose lucky stars have raised them high, they have servants who seem loyal but are really spies for France, sending information about our state: whether about the dukes' quarrels and plots, or the harsh treatment both have given the kind old King, or something deeper, of which these are perhaps just the outward signs. But it's true that an army is coming from France into this divided kingdom. Taking advantage of our carelessness, they have already secretly landed at some of our best ports and are about to show their flag openly. Now, as for you: if you trust me enough to hurry to Dover, you'll find someone who will thank you for giving an accurate report of the unnatural, maddening sorrow the King has reason to complain of. I'm a gentleman of good family and upbringing, and I offer you this task because I know and trust you."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["I will talk further with you."], "id": 604, "m": "I'll talk to you more about this."}, {"t": "sp", "who": "KENT", "lines": ["No, do not.", "For confirmation that I am much more", "Than my out wall, open this purse, and take", "What it contains. If you shall see Cordelia,—", "As fear not but you shall,—show her this ring;", "And she will tell you who your fellow is", "That yet you do not know. Fie on this storm!", "I will go seek the king."], "id": 605, "m": "No, don't. To prove I'm much more than I look on the outside, open this purse and take what's in it. If you see Cordelia, and don't worry, you will, show her this ring, and she'll tell you who your companion is, whom you don't yet know. Curse this storm! I'll go and look for the King."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Give me your hand: have you no more to say?"], "id": 606, "m": "Give me your hand. Have you nothing more to say?"}, {"t": "sp", "who": "KENT", "lines": ["Few words, but, to effect, more than all yet,—", "That, when we have found the king,—in which your pain", "That way, I'll this,—he that first lights on him", "Holla the other."], "id": 607, "m": "Only a few words, but more important than all the rest: when we find the King, and you search that way while I search this, whoever finds him first must shout to the other."}, {"t": "sd", "text": "Exeunt severally.", "id": 608}, {"t": "scene", "act": 3, "scene": "II", "loc": "Another part of the heath. Storm continues.", "id": 609}, {"t": "sd", "text": "Enter Lear and Fool.", "id": 610}, {"t": "sp", "who": "LEAR", "lines": ["Blow, winds, and crack your cheeks! rage! blow!", "You cataracts and hurricanoes, spout", "Till you have drench'd our steeples, drown'd the cocks!", "You sulphurous and thought-executing fires,", "Vaunt couriers to oak-cleaving thunderbolts,", "Singe my white head! And thou, all-shaking thunder,", "Strike flat the thick rotundity o' the world!", "Crack nature's moulds, all germens spill at once,", "That make ingrateful man!"], "id": 611, "m": "Blow, winds, and crack your cheeks! Rage! Blow! You waterspouts and hurricanes, pour down until you have drowned our church spires and the weathercocks on top! You sulphurous lightning, quick as thought, forerunners of the thunderbolts that split oak trees, singe my white head! And you, thunder that shakes everything, strike the round, solid world flat! Crack the moulds nature makes things in, spill all the seeds at once that make ungrateful man!"}, {"t": "sp", "who": "FOOL", "lines": ["O nuncle, court holy water in a dry house is better than this", "rain water out o' door. Good nuncle, in; and ask thy daughters", "blessing: here's a night pities nether wise men nor fools."], "id": 612, "m": "Oh uncle, flattering words at court in a dry house are better than this rainwater outdoors. Good uncle, go in, and ask your daughters' blessing. This is a night that pities neither wise men nor fools."}, {"t": "sp", "who": "LEAR", "lines": ["Rumble thy bellyful! Spit, fire! spout, rain!", "Nor rain, wind, thunder, fire are my daughters:", "I tax not you, you elements, with unkindness;", "I never gave you kingdom, call'd you children;", "You owe me no subscription: then let fall", "Your horrible pleasure; here I stand, your slave,", "A poor, infirm, weak, and despis'd old man:—", "But yet I call you servile ministers,", "That will with two pernicious daughters join", "Your high-engender'd battles 'gainst a head", "So old and white as this! O! O! 'tis foul!"], "id": 613, "m": "Rumble all you like! Spit, fire! Pour, rain! Rain, wind, thunder and fire are not my daughters. I don't accuse you elements of unkindness. I never gave you a kingdom or called you my children. You owe me no obedience. So let your horrible will fall on me. Here I stand, your slave, a poor, sick, weak and despised old man. And yet I call you slavish servants, who have joined with two wicked daughters to throw your armies from the heavens against a head as old and white as this! Oh! Oh! It's foul!"}, {"t": "sp", "who": "FOOL", "lines": ["He that has a house to put 's head in has a good head-piece.", "~The codpiece that will house", "~Before the head has any,", "~The head and he shall louse:", "~So beggars marry many.", "~The man that makes his toe", "~What he his heart should make", "~Shall of a corn cry woe,", "~And turn his sleep to wake.", "—for there was never yet fair woman but she made mouths in a", "glass."], "id": 614, "m": "A man with a house to put his head in has a good helmet. The man who houses his penis before he has a house for his head will end up lousy, both of them; that's how beggars get married. The man who treats his toe as he should treat his heart will cry out with the pain of a corn and lose his sleep. For there was never yet a pretty woman who didn't make faces in a mirror."}, {"t": "sp", "who": "LEAR", "lines": ["No, I will be the pattern of all patience;", "I will say nothing."], "id": 615, "m": "No, I will be the model of patience. I won't say anything."}, {"t": "sd", "text": "Enter Kent.", "id": 616}, {"t": "sp", "who": "KENT", "lines": ["Who's there?"], "id": 617, "m": "Who's there?"}, {"t": "sp", "who": "FOOL", "lines": ["Marry, here's grace and a codpiece; that's a wise man and a fool."], "id": 618, "m": "Well, here's royalty and a codpiece: that's a wise man and a fool."}, {"t": "sp", "who": "KENT", "lines": ["Alas, sir, are you here? Things that love night", "Love not such nights as these; the wrathful skies", "Gallow the very wanderers of the dark,", "And make them keep their caves; since I was man,", "Such sheets of fire, such bursts of horrid thunder,", "Such groans of roaring wind and rain I never", "Remember to have heard: man's nature cannot carry", "Th' affliction nor the fear."], "id": 619, "m": "Oh dear, sir, are you here? Even creatures that love the night don't love nights like this. The angry skies frighten even the animals that roam in the dark and make them stay in their caves. In all my adult life I don't remember ever hearing such sheets of lightning, such bursts of horrible thunder, such groans of roaring wind and rain. Human nature can't bear the suffering or the fear."}, {"t": "sp", "who": "LEAR", "lines": ["Let the great gods,", "That keep this dreadful pother o'er our heads,", "Find out their enemies now. Tremble, thou wretch,", "That hast within thee undivulged crimes", "Unwhipp'd of justice: hide thee, thou bloody hand;", "Thou perjur'd, and thou simular man of virtue", "That art incestuous: caitiff, to pieces shake", "That under covert and convenient seeming", "Hast practis'd on man's life: close pent-up guilts,", "Rive your concealing continents, and cry", "These dreadful summoners grace.—I am a man", "More sinn'd against than sinning."], "id": 620, "m": "Let the great gods who keep up this dreadful uproar over our heads find their enemies now. Tremble, you wretch, who have secret crimes inside you that justice hasn't whipped! Hide, you bloody hand, you liar who breaks his oath, you pretender to virtue who commits incest! Shake to pieces, you villain, who under a secret, convenient disguise have plotted against men's lives! Close-hidden sins, burst out of what hides you, and beg mercy from these terrible officers of justice. I am a man more sinned against than sinning."}, {"t": "sp", "who": "KENT", "lines": ["Alack, bareheaded!", "Gracious my lord, hard by here is a hovel;", "Some friendship will it lend you 'gainst the tempest:", "Repose you there, whilst I to this hard house,—", "More harder than the stones whereof 'tis rais'd;", "Which even but now, demanding after you,", "Denied me to come in,—return, and force", "Their scanted courtesy."], "id": 621, "m": "Oh dear, bareheaded! My gracious lord, near here there's a hut. It will give you some shelter from the storm. Rest there while I go back to that hard house, harder than the stones it's built of, which only just now refused to let me in when I asked for you, and force them to show the courtesy they've held back."}, {"t": "sp", "who": "LEAR", "lines": ["My wits begin to turn.—", "Come on, my boy. how dost, my boy? art cold?", "I am cold myself.—Where is this straw, my fellow?", "The art of our necessities is strange,", "That can make vile things precious. Come, your hovel.—", "Poor fool and knave, I have one part in my heart", "That's sorry yet for thee."], "id": 622, "m": "My mind is starting to go. Come on, my boy. How are you, my boy? Are you cold? I'm cold myself. Where is this straw, my friend? Need has a strange skill: it can make worthless things precious. Come, to your hut. Poor Fool and boy, there's a part of my heart that still feels sorry for you."}, {"t": "sd", "text": "Singing.", "id": 623}, {"t": "sp", "who": "FOOL", "cont": 1, "lines": ["~He that has and a little tiny wit—", "~With hey, ho, the wind and the rain,—", "~Must make content with his fortunes fit,", "~For the rain it raineth every day."], "id": 624, "m": "He who has only a little tiny brain, with hey, ho, the wind and the rain, must be happy with the fortune that fits it, for the rain it rains every day."}, {"t": "sp", "who": "LEAR", "lines": ["True, boy.—Come, bring us to this hovel."], "id": 625, "m": "True, boy. Come, take us to this hut."}, {"t": "sd", "text": "Exeunt Lear and Kent.", "id": 626}, {"t": "sp", "who": "FOOL", "lines": ["This is a brave night to cool a courtezan.—", "I'll speak a prophecy ere I go:—", "~When priests are more in word than matter;", "~When brewers mar their malt with water;", "~When nobles are their tailors' tutors;", "~No heretics burn'd, but wenches' suitors;", "~When every case in law is right;", "~No squire in debt nor no poor knight;", "~When slanders do not live in tongues;", "~Nor cutpurses come not to throngs;", "~When usurers tell their gold i' the field;", "~And bawds and whores do churches build;—", "~Then shall the realm of Albion", "~Come to great confusion:", "~Then comes the time, who lives to see't,", "~That going shall be us'd with feet.", "This prophecy Merlin shall make; for I live before his time."], "id": 627, "m": "This is a fine night to cool down a prostitute. I'll make a prophecy before I go. When priests talk more than they practise, when brewers spoil their malt with water, when nobles teach their tailors fashion, when no heretics are burned, only lovers burning with disease; when every law case is fair, no squire is in debt and no knight is poor; when slander doesn't live on people's tongues, and pickpockets don't come into crowds; when moneylenders count their gold in the open, and pimps and whores build churches: then the kingdom of Britain will fall into great confusion. Then the time will come, for anyone who lives to see it, when feet will be used for walking. Merlin will make this prophecy, for I live before his time."}, {"t": "sd", "text": "Exit.", "id": 628}, {"t": "scene", "act": 3, "scene": "III", "loc": "A Room in Gloster's Castle.", "id": 629}, {"t": "sd", "text": "Enter Gloster and Edmund.", "id": 630}, {"t": "sp", "who": "GLOSTER", "lines": ["Alack, alack, Edmund, I like not this unnatural dealing. When I", "desired their leave that I might pity him, they took from me the", "use of mine own house; charged me on pain of perpetual displeasure,", "neither to speak of him, entreat for him, nor any way sustain him."], "id": 631, "m": "Oh dear, oh dear, Edmund, I don't like this unnatural behaviour. When I asked their permission to help him, they took away the use of my own house and ordered me, on pain of their lasting displeasure, not to speak of him, plead for him or help him in any way."}, {"t": "sp", "who": "EDMUND", "lines": ["Most savage and unnatural!"], "id": 632, "m": "Most savage and unnatural!"}, {"t": "sp", "who": "GLOSTER", "lines": ["Go to; say you nothing. There is division betwixt the dukes,", "and a worse matter than that: I have received a letter this", "night;—'tis dangerous to be spoken;—I have locked the letter in", "my closet: these injuries the king now bears will be revenged", "home; there's part of a power already footed: we must incline to", "the king. I will seek him, and privily relieve him: go you and", "maintain talk with the duke, that my charity be not of him", "perceived: if he ask for me, I am ill, and gone to bed. If I", "die for it, as no less is threatened me, the king my old master", "must be relieved. There is some strange thing toward, Edmund;", "pray you be careful."], "id": 633, "m": "Hush. Don't say anything. There's a split between the dukes, and something worse than that. I received a letter tonight. It's dangerous to speak about. I've locked it in my room. These injuries the King is suffering will be fully avenged. Part of an army has already landed. We must take the King's side. I'll look for him and secretly help him. You go and keep the Duke talking, so he doesn't notice my kindness. If he asks for me, I'm ill and gone to bed. Even if I die for it, as I've been threatened, the King my old master must be helped. Something strange is about to happen, Edmund. Please be careful."}, {"t": "sd", "text": "Exit.", "id": 634}, {"t": "sp", "who": "EDMUND", "lines": ["This courtesy, forbid thee, shall the duke", "Instantly know; and of that letter too:—", "This seems a fair deserving, and must draw me", "That which my father loses,—no less than all:", "The younger rises when the old doth fall."], "id": 635, "m": "The Duke will know at once about this kindness you were forbidden to show, and about that letter too. This looks like a reward worth having, and it should bring me what my father loses: nothing less than everything. The young rise when the old fall."}, {"t": "sd", "text": "Exit.", "id": 636}, {"t": "scene", "act": 3, "scene": "IV", "loc": "A part of the Heath with a Hovel. Storm continues.", "id": 637}, {"t": "sd", "text": "Enter Lear, Kent, and Fool.", "id": 638}, {"t": "sp", "who": "KENT", "lines": ["Here is the place, my lord; good my lord, enter:", "The tyranny of the open night's too rough", "For nature to endure."], "id": 639, "m": "Here's the place, my lord. My good lord, go in. The cruelty of the open night is too rough for human nature to bear."}, {"t": "sp", "who": "LEAR", "lines": ["Let me alone."], "id": 640, "m": "Leave me alone."}, {"t": "sp", "who": "KENT", "lines": ["Good my lord, enter here."], "id": 641, "m": "My good lord, go in here."}, {"t": "sp", "who": "LEAR", "lines": ["Wilt break my heart?"], "id": 642, "m": "Will you break my heart?"}, {"t": "sp", "who": "KENT", "lines": ["I had rather break mine own. Good my lord, enter."], "id": 643, "m": "I'd rather break my own. My good lord, go in."}, {"t": "sp", "who": "LEAR", "lines": ["Thou think'st 'tis much that this contentious storm", "Invades us to the skin: so 'tis to thee", "But where the greater malady is fix'd,", "The lesser is scarce felt. Thou'dst shun a bear;", "But if thy flight lay toward the raging sea,", "Thou'dst meet the bear i' the mouth. When the mind's free,", "The body's delicate: the tempest in my mind", "Doth from my senses take all feeling else", "Save what beats there.—Filial ingratitude!", "Is it not as this mouth should tear this hand", "For lifting food to't?—But I will punish home:—", "No, I will weep no more.—In such a night", "To shut me out!—Pour on; I will endure:—", "In such a night as this! O Regan, Goneril!—", "Your old kind father, whose frank heart gave all,—", "O, that way madness lies; let me shun that;", "No more of that."], "id": 644, "m": "You think it's a big thing that this violent storm soaks us to the skin. So it is to you. But where a greater illness has taken hold, the lesser one is hardly felt. You'd run from a bear, but if your escape led towards the raging sea, you'd turn and face the bear's mouth. When the mind is free of trouble, the body is sensitive. The storm in my mind takes away all feeling from my senses except what beats there. Children's ingratitude! Isn't it as if this mouth should tear this hand for lifting food to it? But I'll punish them fully. No, I won't weep any more. To shut me out on a night like this! Pour on, I'll endure it. On a night like this! Oh Regan, Goneril! Your kind old father, whose generous heart gave you everything... Oh, that way madness lies. Let me avoid that. No more of that."}, {"t": "sp", "who": "KENT", "lines": ["Good my lord, enter here."], "id": 645, "m": "My good lord, go in here."}, {"t": "sp", "who": "LEAR", "lines": ["Pr'ythee go in thyself; seek thine own ease:", "This tempest will not give me leave to ponder", "On things would hurt me more.—But I'll go in.—", "[To the Fool.] In, boy; go first.—You houseless poverty,—", "Nay, get thee in. I'll pray, and then I'll sleep.—"], "id": 646, "m": "Please, go in yourself. Look after your own comfort. This storm won't give me time to think about things that would hurt me more. But I'll go in. [To the Fool] In, boy, you go first. You homeless poverty... No, go in. I'll pray, and then I'll sleep."}, {"t": "sd", "text": "Fool goes in.", "id": 647}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["Poor naked wretches, wheresoe'er you are,", "That bide the pelting of this pitiless storm,", "How shall your houseless heads and unfed sides,", "Your loop'd and window'd raggedness, defend you", "From seasons such as these? O, I have ta'en", "Too little care of this! Take physic, pomp;", "Expose thyself to feel what wretches feel,", "That thou mayst shake the superflux to them", "And show the heavens more just."], "id": 648, "m": "Poor naked wretches, wherever you are, who put up with the beating of this pitiless storm, how will your homeless heads and starving bodies, your clothes full of holes, protect you from weather like this? Oh, I have taken too little care of this! Take this medicine, you great and powerful: expose yourselves to feel what wretches feel, so that you may shake off your surplus to them and show that the heavens are more just."}, {"t": "sp", "who": "EDGAR", "lines": ["[Within.] Fathom and half, fathom and half! Poor Tom!"], "id": 649, "m": "[From inside] Nine feet deep, nine feet deep! Poor Tom!"}, {"t": "sd", "text": "The Fool runs out from the hovel.", "id": 650}, {"t": "sp", "who": "FOOL", "lines": ["Come not in here, nuncle, here's a spirit.", "Help me, help me!"], "id": 651, "m": "Don't come in here, uncle. There's a ghost. Help me, help me!"}, {"t": "sp", "who": "KENT", "lines": ["Give me thy hand.—Who's there?"], "id": 652, "m": "Give me your hand. Who's there?"}, {"t": "sp", "who": "FOOL", "lines": ["A spirit, a spirit: he says his name's poor Tom."], "id": 653, "m": "A ghost, a ghost. He says his name's Poor Tom."}, {"t": "sp", "who": "KENT", "lines": ["What art thou that dost grumble there i' the straw?", "Come forth."], "id": 654, "m": "Who are you, grumbling there in the straw? Come out."}, {"t": "sd", "text": "Enter Edgar, disguised as a madman.", "id": 655}, {"t": "sp", "who": "EDGAR", "lines": ["Away! the foul fiend follows me!—", "Through the sharp hawthorn blows the cold wind.—", "Hum! go to thy cold bed, and warm thee."], "id": 656, "m": "Get away! The foul devil is following me! The cold wind blows through the sharp hawthorn. Hmm! Go to your cold bed and warm yourself."}, {"t": "sp", "who": "LEAR", "lines": ["Didst thou give all to thy two daughters?", "And art thou come to this?"], "id": 657, "m": "Did you give everything to your two daughters? Is that how you came to this?"}, {"t": "sp", "who": "EDGAR", "lines": ["Who gives anything to poor Tom? whom the foul fiend hath led", "through fire and through flame, through ford and whirlpool, o'er", "bog and quagmire; that hath laid knives under his pillow and", "halters in his pew, set ratsbane by his porridge; made him proud", "of heart, to ride on a bay trotting horse over four-inched", "bridges, to course his own shadow for a traitor.—Bless thy five", "wits!—Tom's a-cold.—O, do de, do de, do de.—Bless thee from", "whirlwinds, star-blasting, and taking! Do poor Tom some charity,", "whom the foul fiend vexes:—there could I have him now,—and", "there,—and there again, and there."], "id": 658, "m": "Who gives anything to Poor Tom? The foul devil has led him through fire and flame, through fords and whirlpools, over bogs and swamps. He has put knives under his pillow and nooses in his church pew, and set rat poison by his porridge, to tempt him to kill himself. He made him proud enough to ride a bay horse over four-inch-wide bridges and chase his own shadow as if it were a traitor. Bless your five senses! Tom's cold. Oh, do de, do de, do de. God protect you from whirlwinds, evil stars and infection! Give Poor Tom some charity, whom the foul devil torments. There, I could catch him now, and there, and there again, and there."}, {"t": "sd", "text": "Storm continues.", "id": 659}, {"t": "sp", "who": "LEAR", "lines": ["What, have his daughters brought him to this pass?—", "Couldst thou save nothing? Didst thou give 'em all?"], "id": 660, "m": "What, have his daughters brought him to this state? Couldn't you save anything? Did you give them everything?"}, {"t": "sp", "who": "FOOL", "lines": ["Nay, he reserv'd a blanket, else we had been all shamed."], "id": 661, "m": "No, he kept a blanket, or we'd all have been embarrassed."}, {"t": "sp", "who": "LEAR", "lines": ["Now all the plagues that in the pendulous air", "Hang fated o'er men's faults light on thy daughters!"], "id": 662, "m": "Now may all the plagues that hang in the air, destined to punish men's sins, fall on your daughters!"}, {"t": "sp", "who": "KENT", "lines": ["He hath no daughters, sir."], "id": 663, "m": "He has no daughters, sir."}, {"t": "sp", "who": "LEAR", "lines": ["Death, traitor! nothing could have subdu'd nature", "To such a lowness but his unkind daughters.—", "Is it the fashion that discarded fathers", "Should have thus little mercy on their flesh?", "Judicious punishment! 'twas this flesh begot", "Those pelican daughters."], "id": 664, "m": "Death, traitor! Nothing could have brought a man so low except his unkind daughters. Is it the fashion now that rejected fathers should show so little mercy to their own flesh? A fitting punishment! It was this flesh that fathered those pelican daughters who feed on their parent's blood."}, {"t": "sp", "who": "EDGAR", "lines": ["Pillicock sat on Pillicock-hill:—", "Halloo, halloo, loo loo!"], "id": 665, "m": "Pillicock sat on Pillicock Hill. Halloo, halloo, loo, loo!"}, {"t": "sp", "who": "FOOL", "lines": ["This cold night will turn us all to fools and madmen."], "id": 666, "m": "This cold night will turn us all into fools and madmen."}, {"t": "sp", "who": "EDGAR", "lines": ["Take heed o' th' foul fiend: obey thy parents; keep thy word", "justly; swear not; commit not with man's sworn spouse; set not", "thy sweet heart on proud array. Tom's a-cold."], "id": 667, "m": "Beware of the foul devil. Obey your parents, keep your word honestly, don't swear, don't sleep with another man's wife, don't set your heart on fine clothes. Tom's cold."}, {"t": "sp", "who": "LEAR", "lines": ["What hast thou been?"], "id": 668, "m": "What were you before?"}, {"t": "sp", "who": "EDGAR", "lines": ["A serving-man, proud in heart and mind; that curled my hair;", "wore gloves in my cap; served the lust of my mistress' heart, and", "did the act of darkness with her; swore as many oaths as I spake", "words, and broke them in the sweet face of heaven: one that", "slept in the contriving of lust, and waked to do it: wine loved", "I deeply, dice dearly; and in woman out-paramour'd the Turk;", "false of heart, light of ear, bloody of hand; hog in sloth, fox", "in stealth, wolf in greediness, dog in madness, lion in prey.", "Let not the creaking of shoes nor the rustling of silks betray", "thy poor heart to woman: keep thy foot out of brothel, thy hand", "out of placket, thy pen from lender's book, and defy the foul", "fiend.—Still through the hawthorn blows the cold wind: says", "suum, mun, nonny. Dolphin my boy, boy, sessa! let him trot by."], "id": 669, "m": "A servant, proud in heart and mind. I curled my hair, wore my mistress's gloves in my cap, satisfied my mistress's lust and did the act of darkness with her. I swore as many oaths as I spoke words and broke them in the sweet face of heaven. I fell asleep plotting lust and woke up to do it. I loved wine deeply and dice dearly, and had more women than the Sultan of Turkey. I was false-hearted, ready to believe gossip, quick to kill; a hog in laziness, a fox in sneakiness, a wolf in greed, a dog in madness, a lion in hunting prey. Don't let the creak of shoes or the rustle of silk dresses betray your poor heart to a woman. Keep your foot out of brothels, your hand out of petticoats, your name out of moneylenders' books, and defy the foul devil. Still the cold wind blows through the hawthorn, saying suum, mun, nonny. Dolphin, my boy, my boy, stop! Let him trot by."}, {"t": "sd", "text": "Storm still continues.", "id": 670}, {"t": "sp", "who": "LEAR", "lines": ["Why, thou wert better in thy grave than to answer with thy", "uncovered body this extremity of the skies.—Is man no more than", "this? Consider him well. Thou owest the worm no silk, the beast", "no hide, the sheep no wool, the cat no perfume.—Ha! here's three", "on's are sophisticated! Thou art the thing itself:", "unaccommodated man is no more but such a poor, bare, forked", "animal as thou art.—Off, off, you lendings!—Come, unbutton", "here.", "[Tears off his clothes.]"], "id": 671, "m": "Why, you'd be better in your grave than facing this extreme weather with your body uncovered. Is man no more than this? Look at him closely. You owe the silkworm no silk, the animal no leather, the sheep no wool, the civet cat no perfume. Ha! Three of us here are artificial! You are the real thing. Man without the comforts of civilisation is no more than a poor, bare, two-legged animal like you. Off, off, you borrowed clothes! Come, unbutton here. [He tears off his clothes.]"}, {"t": "sp", "who": "FOOL", "lines": ["Pr'ythee, nuncle, be contented; 'tis a naughty night to swim", "in.—Now a little fire in a wild field were like an old lecher's", "heart,—a small spark, all the rest on's body cold.—Look, here", "comes a walking fire."], "id": 672, "m": "Please, uncle, calm down. It's a nasty night to swim in. A little fire in a wild field now would be like an old lecher's heart: a small spark, and all the rest of his body cold. Look, here comes a walking fire."}, {"t": "sp", "who": "EDGAR", "lines": ["This is the foul fiend Flibbertigibbet: he begins at curfew,", "and walks till the first cock; he gives the web and the pin,", "squints the eye, and makes the harelip; mildews the white wheat,", "and hurts the poor creature of earth.", "~Swithold footed thrice the old;", "~He met the nightmare, and her nine-fold;", "~Bid her alight", "~And her troth plight,", "~And aroint thee, witch, aroint thee!"], "id": 673, "m": "This is the foul devil Flibbertigibbet. He starts at curfew and walks until the first cock crows. He gives people cataracts in the eye, makes them squint, gives them harelips, rots the white wheat with mildew and hurts the poor creatures of the earth. Saint Withold walked over the hill three times. He met the nightmare demon and her nine imps, told her to get off the sleeper and promise to do no harm, and be gone, witch, be gone!"}, {"t": "sp", "who": "KENT", "lines": ["How fares your grace?"], "id": 674, "m": "How is your grace?"}, {"t": "sd", "text": "Enter Gloster with a torch.", "id": 675}, {"t": "sp", "who": "LEAR", "lines": ["What's he?"], "id": 676, "m": "Who's that?"}, {"t": "sp", "who": "KENT", "lines": ["Who's there? What is't you seek?"], "id": 677, "m": "Who's there? What are you looking for?"}, {"t": "sp", "who": "GLOSTER", "lines": ["What are you there? Your names?"], "id": 678, "m": "Who are you there? Your names?"}, {"t": "sp", "who": "EDGAR", "lines": ["Poor Tom; that eats the swimming frog, the toad, the todpole, the", "wall-newt and the water; that in the fury of his heart, when the", "foul fiend rages, eats cow-dung for sallets; swallows the old rat", "and the ditch-dog; drinks the green mantle of the standing pool;", "who is whipped from tithing to tithing, and stocked, punished,", "and imprisoned; who hath had three suits to his back, six shirts", "to his body, horse to ride, and weapons to wear;—", "~But mice and rats, and such small deer,", "~Have been Tom's food for seven long year.", "Beware my follower.—Peace, Smulkin; peace, thou fiend!"], "id": 679, "m": "Poor Tom, who eats the swimming frog, the toad, the tadpole, the wall lizard and the water newt. In the fury of his heart, when the foul devil rages, he eats cow dung as salad, swallows old rats and dead dogs from ditches, and drinks the green scum on stagnant ponds. He's whipped from parish to parish, put in the stocks, punished and imprisoned. He used to have three suits for his back, six shirts for his body, a horse to ride and a sword to wear. But mice and rats and such small animals have been Tom's food for seven long years. Beware of the devil who follows me. Quiet, Smulkin! Quiet, you devil!"}, {"t": "sp", "who": "GLOSTER", "lines": ["What, hath your grace no better company?"], "id": 680, "m": "What, has your grace no better company than this?"}, {"t": "sp", "who": "EDGAR", "lines": ["The prince of darkness is a gentleman:", "Modo he's call'd, and Mahu."], "id": 681, "m": "The Prince of Darkness is a gentleman. He's called Modo, and Mahu."}, {"t": "sp", "who": "GLOSTER", "lines": ["Our flesh and blood, my lord, is grown so vile", "That it doth hate what gets it."], "id": 682, "m": "Our children, my lord, have become so wicked that they hate the parents who made them."}, {"t": "sp", "who": "EDGAR", "lines": ["Poor Tom's a-cold."], "id": 683, "m": "Poor Tom's cold."}, {"t": "sp", "who": "GLOSTER", "lines": ["Go in with me: my duty cannot suffer", "To obey in all your daughters' hard commands;", "Though their injunction be to bar my doors,", "And let this tyrannous night take hold upon you,", "Yet have I ventur'd to come seek you out", "And bring you where both fire and food is ready."], "id": 684, "m": "Come in with me. My duty won't let me obey all your daughters' harsh orders. Though they have ordered me to lock my doors and let this cruel night take hold of you, I have dared to come and find you, and bring you where there is both a fire and food ready."}, {"t": "sp", "who": "LEAR", "lines": ["First let me talk with this philosopher.—", "What is the cause of thunder?"], "id": 685, "m": "First let me talk to this philosopher. What is the cause of thunder?"}, {"t": "sp", "who": "KENT", "lines": ["Good my lord, take his offer; go into the house."], "id": 686, "m": "My good lord, accept his offer. Go into the house."}, {"t": "sp", "who": "LEAR", "lines": ["I'll talk a word with this same learned Theban.—", "What is your study?"], "id": 687, "m": "I'll have a word with this same learned scholar. What do you study?"}, {"t": "sp", "who": "EDGAR", "lines": ["How to prevent the fiend and to kill vermin."], "id": 688, "m": "How to keep off the devil and kill vermin."}, {"t": "sp", "who": "LEAR", "lines": ["Let me ask you one word in private."], "id": 689, "m": "Let me ask you a word in private."}, {"t": "sp", "who": "KENT", "lines": ["Importune him once more to go, my lord;", "His wits begin to unsettle."], "id": 690, "m": "Urge him once more to go, my lord. His mind is starting to go."}, {"t": "sp", "who": "GLOSTER", "lines": ["Canst thou blame him?", "His daughters seek his death:—ah, that good Kent!—", "He said it would be thus,—poor banish'd man!—", "Thou say'st the king grows mad; I'll tell thee, friend,", "I am almost mad myself: I had a son,", "Now outlaw'd from my blood; he sought my life", "But lately, very late: I lov'd him, friend,—", "No father his son dearer: true to tell thee,"], "id": 691, "m": "Can you blame him? His daughters want him dead. Ah, that good Kent! He said it would be like this, poor banished man! You say the King is going mad. I tell you, friend, I'm almost mad myself. I had a son, now disowned and outlawed. He tried to kill me only recently, very recently. I loved him, friend. No father ever loved his son more. To tell you the truth..."}, {"t": "sd", "text": "Storm continues.", "id": 692}, {"t": "sp", "who": "GLOSTER", "cont": 1, "lines": ["The grief hath craz'd my wits.—What a night's this!—", "I do beseech your grace,—"], "id": 693, "m": "...the grief has driven me out of my mind. What a night this is! I beg your grace..."}, {"t": "sp", "who": "LEAR", "lines": ["O, cry you mercy, sir.—", "Noble philosopher, your company."], "id": 694, "m": "Oh, I beg your pardon, sir. Noble philosopher, keep me company."}, {"t": "sp", "who": "EDGAR", "lines": ["Tom's a-cold."], "id": 695, "m": "Tom's cold."}, {"t": "sp", "who": "GLOSTER", "lines": ["In, fellow, there, into the hovel; keep thee warm."], "id": 696, "m": "In you go, fellow, there, into the hut. Keep warm."}, {"t": "sp", "who": "LEAR", "lines": ["Come, let's in all."], "id": 697, "m": "Come, let's all go in."}, {"t": "sp", "who": "KENT", "lines": ["This way, my lord."], "id": 698, "m": "This way, my lord."}, {"t": "sp", "who": "LEAR", "lines": ["With him;", "I will keep still with my philosopher."], "id": 699, "m": "With him. I'll stay with my philosopher."}, {"t": "sp", "who": "KENT", "lines": ["Good my lord, soothe him; let him take the fellow."], "id": 700, "m": "My good lord, humour him. Let him take the fellow."}, {"t": "sp", "who": "GLOSTER", "lines": ["Take him you on."], "id": 701, "m": "You take him along."}, {"t": "sp", "who": "KENT", "lines": ["Sirrah, come on; go along with us."], "id": 702, "m": "Come on, fellow, come with us."}, {"t": "sp", "who": "LEAR", "lines": ["Come, good Athenian."], "id": 703, "m": "Come, good Athenian."}, {"t": "sp", "who": "GLOSTER", "lines": ["No words, no words: hush."], "id": 704, "m": "No talking, no talking. Hush."}, {"t": "sp", "who": "EDGAR", "lines": ["~Child Rowland to the dark tower came,", "~His word was still—Fie, foh, and fum,", "~I smell the blood of a British man."], "id": 705, "m": "Young Roland came to the dark tower. His words were always: 'Fie, foh and fum, I smell the blood of a British man.'"}, {"t": "sd", "text": "Exeunt.", "id": 706}, {"t": "scene", "act": 3, "scene": "V", "loc": "A Room in Gloster's Castle.", "id": 707}, {"t": "sd", "text": "Enter Cornwall and Edmund.", "id": 708}, {"t": "sp", "who": "CORNWALL", "lines": ["I will have my revenge ere I depart his house."], "id": 709, "m": "I'll have my revenge before I leave his house."}, {"t": "sp", "who": "EDMUND", "lines": ["How, my lord, I may be censured, that nature thus gives way to", "loyalty, something fears me to think of."], "id": 710, "m": "It frightens me a little, my lord, to think how I may be judged for putting loyalty above a son's natural feeling like this."}, {"t": "sp", "who": "CORNWALL", "lines": ["I now perceive it was not altogether your brother's evil", "disposition made him seek his death; but a provoking merit, set", "a-work by a reproveable badness in himself."], "id": 711, "m": "I see now that it wasn't only your brother's evil nature that made him want your father dead. It was your father's own guilt that provoked him, stirred up by a wickedness that deserved punishment."}, {"t": "sp", "who": "EDMUND", "lines": ["How malicious is my fortune, that I must repent to be just! This", "is the letter he spoke of, which approves him an intelligent", "party to the advantages of France. O heavens! that this treason", "were not—or not I the detector!"], "id": 712, "m": "How cruel my fate is, that I must regret doing what's right! This is the letter he mentioned, which proves he is a spy helping France. Oh heavens! If only this treason didn't exist, or I weren't the one who discovered it!"}, {"t": "sp", "who": "CORNWALL", "lines": ["Go with me to the duchess."], "id": 713, "m": "Come with me to the Duchess."}, {"t": "sp", "who": "EDMUND", "lines": ["If the matter of this paper be certain, you have mighty business", "in hand."], "id": 714, "m": "If what this letter says is true, you have important business on your hands."}, {"t": "sp", "who": "CORNWALL", "lines": ["True or false, it hath made thee earl of Gloster. Seek out", "where thy father is, that he may be ready for our apprehension."], "id": 715, "m": "True or false, it has made you Earl of Gloster. Find out where your father is, so he's ready for us to arrest."}, {"t": "sp", "who": "EDMUND", "lines": ["[Aside.] If I find him comforting the king, it will stuff his", "suspicion more fully.—I will persever in my course of loyalty,", "though the conflict be sore between that and my blood."], "id": 716, "m": "[Aside] If I find him helping the King, it will make the Duke's suspicion even stronger. [Aloud] I will keep on loyally, even though the struggle between loyalty and my feelings as a son is painful."}, {"t": "sp", "who": "CORNWALL", "lines": ["I will lay trust upon thee; and thou shalt find a dearer father", "in my love."], "id": 717, "m": "I'll put my trust in you, and you'll find a more loving father in my love."}, {"t": "sd", "text": "Exeunt.", "id": 718}, {"t": "scene", "act": 3, "scene": "VI", "loc": "A Chamber in a Farmhouse adjoining the Castle.", "id": 719}, {"t": "sd", "text": "Enter Gloster, Lear, Kent, Fool, and Edgar.", "id": 720}, {"t": "sp", "who": "GLOSTER", "lines": ["Here is better than the open air; take it thankfully. I will", "piece out the comfort with what addition I can: I will not be", "long from you."], "id": 721, "m": "This is better than the open air. Take it gratefully. I'll add whatever comforts I can. I won't be gone long."}, {"t": "sp", "who": "KENT", "lines": ["All the power of his wits have given way to his impatience:—", "the gods reward your kindness!"], "id": 722, "m": "All the power of his mind has given way to his suffering. May the gods reward your kindness!"}, {"t": "sd", "text": "Exit Gloster.", "id": 723}, {"t": "sp", "who": "EDGAR", "lines": ["Frateretto calls me; and tells me Nero is an angler in the lake", "of darkness.—Pray, innocent, and beware the foul fiend."], "id": 724, "m": "Frateretto is calling me, and tells me Nero is fishing in the lake of hell. Pray, you innocent, and beware of the foul devil."}, {"t": "sp", "who": "FOOL", "lines": ["Pr'ythee, nuncle, tell me whether a madman be a gentleman or a", "yeoman."], "id": 725, "m": "Please, uncle, tell me: is a madman a gentleman or a farmer?"}, {"t": "sp", "who": "LEAR", "lines": ["A king, a king!"], "id": 726, "m": "A king, a king!"}, {"t": "sp", "who": "FOOL", "lines": ["No, he's a yeoman that has a gentleman to his son; for he's a mad", "yeoman that sees his son a gentleman before him."], "id": 727, "m": "No, he's a farmer who has a gentleman for a son. For a farmer is mad if he lets his son become a gentleman before him."}, {"t": "sp", "who": "LEAR", "lines": ["To have a thousand with red burning spits", "Come hissing in upon 'em,—"], "id": 728, "m": "To have a thousand devils with red-hot roasting spits come hissing in on them..."}, {"t": "sp", "who": "EDGAR", "lines": ["The foul fiend bites my back."], "id": 729, "m": "The foul devil is biting my back."}, {"t": "sp", "who": "FOOL", "lines": ["He's mad that trusts in the tameness of a wolf, a horse's health,", "a boy's love, or a whore's oath."], "id": 730, "m": "Anyone is mad who trusts a tame wolf, a horse's health, a boy's love or a whore's promise."}, {"t": "sp", "who": "LEAR", "lines": ["It shall be done; I will arraign them straight.—", "[To Edgar.] Come, sit thou here, most learned justicer—", "[To the Fool.] Thou, sapient sir, sit here. Now, you she-foxes!—"], "id": 731, "m": "It will be done. I'll put them on trial at once. [To Edgar] Come, sit here, most learned judge. [To the Fool] You, wise sir, sit here. Now, you vixens!"}, {"t": "sp", "who": "EDGAR", "lines": ["Look, where he stands and glares!—Want'st thou eyes at trial,", "madam?", "~Come o'er the bourn, Bessy, to me,—"], "id": 732, "m": "Look how he stands and glares! Do you want people to look at you during your trial, madam? Come over the stream, Bessy, to me..."}, {"t": "sp", "who": "FOOL", "lines": ["~Her boat hath a leak,", "~And she must not speak", "~Why she dares not come over to thee."], "id": 733, "m": "Her boat has a leak, and she mustn't say why she daren't come over to you."}, {"t": "sp", "who": "EDGAR", "lines": ["The foul fiend haunts poor Tom in the voice of a nightingale.", "Hoppedance cries in Tom's belly for two white herring. Croak not,", "black angel; I have no food for thee."], "id": 734, "m": "The foul devil haunts Poor Tom in the voice of a nightingale. Hoppedance is crying in Tom's belly for two fresh herrings. Don't croak, black angel, I have no food for you."}, {"t": "sp", "who": "KENT", "lines": ["How do you, sir? Stand you not so amaz'd;", "Will you lie down and rest upon the cushions?"], "id": 735, "m": "How are you, sir? Don't stand there so bewildered. Will you lie down and rest on the cushions?"}, {"t": "sp", "who": "LEAR", "lines": ["I'll see their trial first.—Bring in their evidence.", "[To Edgar.] Thou, robed man of justice, take thy place;—", "[To the Fool.] And thou, his yokefellow of equity,", "Bench by his side:—[To Kent.] you are o' the commission,", "Sit you too."], "id": 736, "m": "I'll see their trial first. Bring in the evidence. [To Edgar] You, man of justice in your robes, take your place. [To the Fool] And you, his partner in judgement, sit by his side. [To Kent] You're one of the judges. Sit down too."}, {"t": "sp", "who": "EDGAR", "lines": ["~Let us deal justly.", "~Sleepest or wakest thou, jolly shepherd?", "~Thy sheep be in the corn;", "~And for one blast of thy minikin mouth", "~Thy sheep shall take no harm.", "Purr! the cat is gray."], "id": 737, "m": "Let's be fair. Are you asleep or awake, jolly shepherd? Your sheep are in the corn, and if you give one blow on your dainty pipe, your sheep will come to no harm. Purr! The cat is grey."}, {"t": "sp", "who": "LEAR", "lines": ["Arraign her first; 'tis Goneril. I here take my oath before", "this honourable assembly, she kicked the poor king her father."], "id": 738, "m": "Try her first. It's Goneril. I swear before this honourable court that she kicked the poor King, her father."}, {"t": "sp", "who": "FOOL", "lines": ["Come hither, mistress. Is your name Goneril?"], "id": 739, "m": "Come here, madam. Is your name Goneril?"}, {"t": "sp", "who": "LEAR", "lines": ["She cannot deny it."], "id": 740, "m": "She can't deny it."}, {"t": "sp", "who": "FOOL", "lines": ["Cry you mercy, I took you for a joint-stool."], "id": 741, "m": "I beg your pardon, I thought you were a stool."}, {"t": "sp", "who": "LEAR", "lines": ["And here's another, whose warp'd looks proclaim", "What store her heart is made on.—Stop her there!", "Arms, arms! sword! fire!—Corruption in the place!—", "False justicer, why hast thou let her 'scape?"], "id": 742, "m": "And here's another, whose twisted looks show what her heart is made of. Stop her there! Weapons, weapons! Sword! Fire! The court is corrupt! Lying judge, why have you let her escape?"}, {"t": "sp", "who": "EDGAR", "lines": ["Bless thy five wits!"], "id": 743, "m": "Bless your five senses!"}, {"t": "sp", "who": "KENT", "lines": ["O pity!—Sir, where is the patience now", "That you so oft have boasted to retain?"], "id": 744, "m": "Oh, pity! Sir, where is the patience now that you so often boasted you had?"}, {"t": "sp", "who": "EDGAR", "lines": ["[Aside.] My tears begin to take his part so much", "They'll mar my counterfeiting."], "id": 745, "m": "[Aside] My tears are taking his side so much that they'll spoil my act."}, {"t": "sp", "who": "LEAR", "lines": ["The little dogs and all,", "Tray, Blanch, and Sweetheart, see, they bark at me."], "id": 746, "m": "The little dogs and all, Tray, Blanch and Sweetheart, look, they're barking at me."}, {"t": "sp", "who": "EDGAR", "lines": ["Tom will throw his head at them.—Avaunt, you curs!", "~Be thy mouth or black or white,", "~Tooth that poisons if it bite;", "~Mastiff, greyhound, mongrel grim,", "~Hound or spaniel, brach or lym,", "~Or bobtail tike or trundle-tail,—", "~Tom will make them weep and wail;", "~For, with throwing thus my head,", "~Dogs leap the hatch, and all are fled.", "Do de, de, de. Sessa! Come, march to wakes and fairs and market-", "towns. Poor Tom, thy horn is dry."], "id": 747, "m": "Tom will throw his head at them. Get away, you dogs! Whether your mouth is black or white, with a tooth that poisons when it bites, mastiff, greyhound, grim mongrel, hound or spaniel, bitch or bloodhound, short-tailed cur or curly-tailed, Tom will make them weep and wail. For when I throw my head like this, the dogs jump over the gate and all run away. Do de, de, de. Stop! Come, march to festivals, fairs and market towns. Poor Tom, your drinking horn is dry."}, {"t": "sp", "who": "LEAR", "lines": ["Then let them anatomize Regan; see what breeds about her", "heart. Is there any cause in nature that makes these hard", "hearts?—[To Edgar.] You, sir, I entertain you for one of my", "hundred; only I do not like the fashion of your garments: you'll", "say they are Persian; but let them be changed."], "id": 748, "m": "Then let them cut Regan open and see what grows around her heart. Is there any cause in nature that makes hearts this hard? [To Edgar] You, sir, I'll take you on as one of my hundred knights. Only I don't like the style of your clothes. You'll say they're Persian silk, but get them changed."}, {"t": "sp", "who": "KENT", "lines": ["Now, good my lord, lie here and rest awhile."], "id": 749, "m": "Now, my good lord, lie here and rest a while."}, {"t": "sp", "who": "LEAR", "lines": ["Make no noise, make no noise; draw the curtains:", "So, so. We'll go to supper i' the morning."], "id": 750, "m": "Don't make any noise, don't make any noise. Draw the bed curtains. So, so. We'll go to supper in the morning."}, {"t": "sp", "who": "FOOL", "lines": ["And I'll go to bed at noon."], "id": 751, "m": "And I'll go to bed at noon."}, {"t": "sd", "text": "Re-enter Gloster.", "id": 752}, {"t": "sp", "who": "GLOSTER", "lines": ["Come hither, friend: where is the king my master?"], "id": 753, "m": "Come here, friend. Where is the King my master?"}, {"t": "sp", "who": "KENT", "lines": ["Here, sir; but trouble him not,—his wits are gone."], "id": 754, "m": "Here, sir, but don't disturb him. His mind is gone."}, {"t": "sp", "who": "GLOSTER", "lines": ["Good friend, I pr'ythee, take him in thy arms;", "I have o'erheard a plot of death upon him;", "There is a litter ready; lay him in't", "And drive towards Dover, friend, where thou shalt meet", "Both welcome and protection. Take up thy master;", "If thou shouldst dally half an hour, his life,", "With thine, and all that offer to defend him,", "Stand in assured loss: take up, take up;", "And follow me, that will to some provision", "Give thee quick conduct."], "id": 755, "m": "Good friend, please, pick him up in your arms. I've overheard a plot to kill him. There's a stretcher ready. Lay him in it and drive towards Dover, friend, where you'll find both welcome and protection. Pick up your master. If you delay half an hour, his life, and yours, and the life of anyone who tries to defend him, will certainly be lost. Pick him up, pick him up, and follow me, and I'll quickly take you to some supplies."}, {"t": "sp", "who": "KENT", "lines": ["Oppressed nature sleeps:—", "This rest might yet have balm'd thy broken sinews,", "Which, if convenience will not allow,", "Stand in hard cure.—Come, help to bear thy master;", "[To the Fool.] Thou must not stay behind."], "id": 756, "m": "His overburdened nature is sleeping. This rest might have healed his shattered nerves, which will be hard to cure if circumstances don't allow it. Come, help carry your master. [To the Fool] You mustn't stay behind."}, {"t": "sp", "who": "GLOSTER", "lines": ["Come, come, away!"], "id": 757, "m": "Come, come, let's go!"}, {"t": "sd", "text": "Exeunt Kent, Gloster, and the Fool, bearing off Lear.", "id": 758}, {"t": "sp", "who": "EDGAR", "lines": ["When we our betters see bearing our woes,", "We scarcely think our miseries our foes.", "Who alone suffers suffers most i' the mind,", "Leaving free things and happy shows behind:", "But then the mind much sufferance doth o'erskip", "When grief hath mates, and bearing fellowship.", "How light and portable my pain seems now,", "When that which makes me bend makes the king bow;", "He childed as I fathered!—Tom, away!", "Mark the high noises; and thyself bewray,", "When false opinion, whose wrong thought defiles thee,", "In thy just proof repeals and reconciles thee.", "What will hap more to-night, safe 'scape the king!", "Lurk, lurk."], "id": 759, "m": "When we see our superiors suffering our sorrows, we hardly think of our own misery as our enemy. Someone who suffers alone suffers most in his mind, leaving freedom and happy sights behind. But the mind skips over much of its suffering when grief has companions and pain is shared. How light and bearable my pain seems now, when what makes me bend makes the King bow down: he has his children, as I have my father! Tom, go! Pay attention to the great events, and reveal yourself when the false opinion whose mistaken thought dishonours you calls you back and makes peace with you once you've been proved innocent. Whatever else happens tonight, may the King escape safely! Hide, hide."}, {"t": "sd", "text": "Exit.", "id": 760}, {"t": "scene", "act": 3, "scene": "VII", "loc": "A Room in Gloster's Castle.", "id": 761}, {"t": "sd", "text": "Enter Cornwall, Regan, Goneril, Edmund, and Servants.", "id": 762}, {"t": "sp", "who": "CORNWALL", "lines": ["Post speedily to my lord your husband, show him this letter:—", "the army of France is landed.—Seek out the traitor Gloster."], "id": 763, "m": "Ride quickly to my lord your husband. Show him this letter. The French army has landed. Find the traitor Gloster."}, {"t": "sd", "text": "Exeunt some of the Servants.", "id": 764}, {"t": "sp", "who": "REGAN", "lines": ["Hang him instantly."], "id": 765, "m": "Hang him at once."}, {"t": "sp", "who": "GONERIL", "lines": ["Pluck out his eyes."], "id": 766, "m": "Pluck out his eyes."}, {"t": "sp", "who": "CORNWALL", "lines": ["Leave him to my displeasure.—Edmund, keep you our sister", "company: the revenges we are bound to take upon your traitorous", "father are not fit for your beholding. Advise the duke where you", "are going, to a most festinate preparation: we are bound to the", "like. Our posts shall be swift and intelligent betwixt us.", "Farewell, dear sister:—farewell, my lord of Gloster."], "id": 767, "m": "Leave him to my anger. Edmund, keep our sister company. The revenge we must take on your traitorous father is not fit for you to watch. Tell the Duke, where you're going, to prepare as fast as possible. We're bound to do the same. Our messengers will travel quickly and carry news between us. Goodbye, dear sister. Goodbye, my lord of Gloster."}, {"t": "sd", "text": "Enter Oswald.", "id": 768}, {"t": "sp", "who": "CORNWALL", "cont": 1, "lines": ["How now! Where's the king?"], "id": 769, "m": "Well? Where's the King?"}, {"t": "sp", "who": "OSWALD", "lines": ["My lord of Gloster hath convey'd him hence:", "Some five or six and thirty of his knights,", "Hot questrists after him, met him at gate;", "Who, with some other of the lord's dependants,", "Are gone with him towards Dover: where they boast", "To have well-armed friends."], "id": 770, "m": "My lord of Gloster has taken him away. Some thirty-five or thirty-six of his knights, searching eagerly for him, met him at the gate, and they, with some of the lord's servants, have gone with him towards Dover, where they claim to have well-armed friends."}, {"t": "sp", "who": "CORNWALL", "lines": ["Get horses for your mistress."], "id": 771, "m": "Get horses for your mistress."}, {"t": "sp", "who": "GONERIL", "lines": ["Farewell, sweet lord, and sister."], "id": 772, "m": "Goodbye, sweet lord, and sister."}, {"t": "sp", "who": "CORNWALL", "lines": ["Edmund, farewell."], "id": 773, "m": "Edmund, goodbye."}, {"t": "sd", "text": "Exeunt Goneril, Edmund, and Oswald.", "id": 774}, {"t": "sp", "who": "CORNWALL", "cont": 1, "lines": ["Go seek the traitor Gloster,", "Pinion him like a thief, bring him before us."], "id": 775, "m": "Go and find the traitor Gloster. Tie his arms like a thief's and bring him before us."}, {"t": "sd", "text": "Exeunt other Servants.", "id": 776}, {"t": "sp", "who": "CORNWALL", "cont": 1, "lines": ["Though well we may not pass upon his life", "Without the form of justice, yet our power", "Shall do a courtesy to our wrath, which men", "May blame, but not control.—Who's there? the traitor?"], "id": 777, "m": "Although we can't sentence him to death without the formality of a trial, our power will give way to our anger, which men may blame but can't stop. Who's there? The traitor?"}, {"t": "sd", "text": "Re-enter servants, with Gloster.", "id": 778}, {"t": "sp", "who": "REGAN", "lines": ["Ingrateful fox! 'tis he."], "id": 779, "m": "Ungrateful fox! It's him."}, {"t": "sp", "who": "CORNWALL", "lines": ["Bind fast his corky arms."], "id": 780, "m": "Tie up his withered arms."}, {"t": "sp", "who": "GLOSTER", "lines": ["What mean your graces?—Good my friends, consider", "You are my guests: do me no foul play, friends."], "id": 781, "m": "What do your graces mean? My good friends, remember you are my guests. Don't do anything wicked to me, friends."}, {"t": "sp", "who": "CORNWALL", "lines": ["Bind him, I say."], "id": 782, "m": "Tie him up, I say."}, {"t": "sd", "text": "Servants bind him.", "id": 783}, {"t": "sp", "who": "REGAN", "lines": ["Hard, hard.—O filthy traitor!"], "id": 784, "m": "Tight, tight. Oh, filthy traitor!"}, {"t": "sp", "who": "GLOSTER", "lines": ["Unmerciful lady as you are, I'm none."], "id": 785, "m": "Merciless lady that you are, I'm no traitor."}, {"t": "sp", "who": "CORNWALL", "lines": ["To this chair bind him.—Villain, thou shalt find,—"], "id": 786, "m": "Tie him to this chair. Villain, you'll find... [Regan plucks his beard.]"}, {"t": "sd", "text": "Regan plucks his beard.", "id": 787}, {"t": "sp", "who": "GLOSTER", "lines": ["By the kind gods, 'tis most ignobly done", "To pluck me by the beard."], "id": 788, "m": "By the kind gods, it's a most dishonourable thing to pluck me by the beard."}, {"t": "sp", "who": "REGAN", "lines": ["So white, and such a traitor!"], "id": 789, "m": "So white-haired, and such a traitor!"}, {"t": "sp", "who": "GLOSTER", "lines": ["Naughty lady,", "These hairs which thou dost ravish from my chin", "Will quicken, and accuse thee: I am your host:", "With robber's hands my hospitable favours", "You should not ruffle thus. What will you do?"], "id": 790, "m": "Wicked lady, these hairs you're tearing from my chin will come to life and accuse you. I am your host. You shouldn't tear at my hospitable face with a robber's hands like this. What will you do?"}, {"t": "sp", "who": "CORNWALL", "lines": ["Come, sir, what letters had you late from France?"], "id": 791, "m": "Come, sir, what letters have you had recently from France?"}, {"t": "sp", "who": "REGAN", "lines": ["Be simple-answer'd, for we know the truth."], "id": 792, "m": "Answer straight, because we know the truth."}, {"t": "sp", "who": "CORNWALL", "lines": ["And what confederacy have you with the traitors", "Late footed in the kingdom?"], "id": 793, "m": "And what conspiracy do you have with the traitors who have recently landed in the kingdom?"}, {"t": "sp", "who": "REGAN", "lines": ["To whose hands have you sent the lunatic king?", "Speak."], "id": 794, "m": "Into whose hands have you sent the lunatic King? Speak."}, {"t": "sp", "who": "GLOSTER", "lines": ["I have a letter guessingly set down,", "Which came from one that's of a neutral heart,", "And not from one oppos'd."], "id": 795, "m": "I have a letter that only guesses at things, which came from someone neutral, not from an enemy."}, {"t": "sp", "who": "CORNWALL", "lines": ["Cunning."], "id": 796, "m": "Clever."}, {"t": "sp", "who": "REGAN", "lines": ["And false."], "id": 797, "m": "And lying."}, {"t": "sp", "who": "CORNWALL", "lines": ["Where hast thou sent the king?"], "id": 798, "m": "Where have you sent the King?"}, {"t": "sp", "who": "GLOSTER", "lines": ["To Dover."], "id": 799, "m": "To Dover."}, {"t": "sp", "who": "REGAN", "lines": ["Wherefore to Dover? Wast thou not charg'd at peril,—"], "id": 800, "m": "Why to Dover? Weren't you ordered, on pain of..."}, {"t": "sp", "who": "CORNWALL", "lines": ["Wherefore to Dover? Let him first answer that."], "id": 801, "m": "Why to Dover? Let him answer that first."}, {"t": "sp", "who": "GLOSTER", "lines": ["I am tied to the stake, and I must stand the course."], "id": 802, "m": "I'm tied to the stake like a bear, and I must stand the attack of the dogs."}, {"t": "sp", "who": "REGAN", "lines": ["Wherefore to Dover, sir?"], "id": 803, "m": "Why to Dover, sir?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Because I would not see thy cruel nails", "Pluck out his poor old eyes; nor thy fierce sister", "In his anointed flesh stick boarish fangs.", "The sea, with such a storm as his bare head", "In hell-black night endur'd, would have buoy'd up,", "And quench'd the stelled fires; yet, poor old heart,", "He holp the heavens to rain.", "If wolves had at thy gate howl'd that stern time,", "Thou shouldst have said, 'Good porter, turn the key.'", "All cruels else subscrib'd:—but I shall see", "The winged vengeance overtake such children."], "id": 804, "m": "Because I didn't want to see your cruel nails pluck out his poor old eyes, or your fierce sister stick her boar's tusks into his holy, anointed flesh. The sea, in a storm like the one his bare head endured on this hell-black night, would have risen up and put out the stars. Yet, poor old heart, he added his tears to the rain. If wolves had howled at your gate in that dreadful time, you should have said, 'Good porter, unlock the door.' Every other cruel creature would have given way. But I will see heaven's winged vengeance catch up with children like these."}, {"t": "sp", "who": "CORNWALL", "lines": ["See't shalt thou never.—Fellows, hold the chair.", "Upon these eyes of thine I'll set my foot."], "id": 805, "m": "You'll never see it. Fellows, hold the chair. I'll put my foot on these eyes of yours."}, {"t": "sd", "text": "Gloster is held down in his chair, while Cornwall plucks out one of his eyes and sets his foot on it.", "id": 806}, {"t": "sp", "who": "GLOSTER", "lines": ["He that will think to live till he be old,", "Give me some help!—O cruel!—O ye gods!"], "id": 807, "m": "Anyone who hopes to live till he's old, help me! Oh, cruel! Oh, you gods!"}, {"t": "sp", "who": "REGAN", "lines": ["One side will mock another; the other too!"], "id": 808, "m": "One side will mock the other. The other one too!"}, {"t": "sp", "who": "CORNWALL", "lines": ["If you see vengeance,—"], "id": 809, "m": "If you see vengeance..."}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["Hold your hand, my lord:", "I have serv'd you ever since I was a child;", "But better service have I never done you", "Than now to bid you hold."], "id": 810, "m": "Stop, my lord! I've served you ever since I was a child, but I've never done you better service than now, telling you to stop."}, {"t": "sp", "who": "REGAN", "lines": ["How now, you dog!"], "id": 811, "m": "What, you dog!"}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["If you did wear a beard upon your chin,", "I'd shake it on this quarrel. What do you mean?"], "id": 812, "m": "If you had a beard on your chin, I'd pull it over this quarrel. What do you mean by this?"}, {"t": "sp", "who": "CORNWALL", "lines": ["My villain!", "[Draws, and runs at him.]"], "id": 813, "m": "My own servant! [He draws his sword and runs at him.]"}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["Nay, then, come on, and take the chance of anger.", "[Draws. They fight. Cornwall is wounded.]"], "id": 814, "m": "Well then, come on, and take your chances in a fight. [He draws. They fight. Cornwall is wounded.]"}, {"t": "sp", "who": "REGAN", "lines": ["Give me thy sword [to another servant.]—A peasant stand up thus?"], "id": 815, "m": "[To another servant] Give me your sword. A peasant stand up to us like this? [She takes a sword and stabs him from behind.]"}, {"t": "sd", "text": "Snatches a sword, comes behind, and stabs him.", "id": 816}, {"t": "sp", "who": "FIRST SERVANT", "lines": ["O, I am slain!—My lord, you have one eye left", "To see some mischief on thim. O!", "[Dies.]"], "id": 817, "m": "Oh, I'm killed! My lord, you still have one eye left to see him get some harm. Oh! [He dies.]"}, {"t": "sp", "who": "CORNWALL", "lines": ["Lest it see more, prevent it.—Out, vile jelly!", "Where is thy lustre now?", "[Tears out Gloster's other eye and throws it on the ground.]"], "id": 818, "m": "In case it sees more, let's stop it. Out, vile jelly! Where's your shine now? [He tears out Gloster's other eye and throws it on the ground.]"}, {"t": "sp", "who": "GLOSTER", "lines": ["All dark and comfortless.—Where's my son Edmund?", "Edmund, enkindle all the sparks of nature", "To quit this horrid act."], "id": 819, "m": "All dark and without comfort. Where's my son Edmund? Edmund, light up all the sparks of a son's love to avenge this horrible act."}, {"t": "sp", "who": "REGAN", "lines": ["Out, treacherous villain!", "Thou call'st on him that hates thee: it was he", "That made the overture of thy treasons to us;", "Who is too good to pity thee."], "id": 820, "m": "Out, treacherous villain! You're calling on someone who hates you. It was he who revealed your treasons to us. He is too good to pity you."}, {"t": "sp", "who": "GLOSTER", "lines": ["O my follies! Then Edgar was abus'd.—", "Kind gods, forgive me that, and prosper him!"], "id": 821, "m": "Oh, my foolishness! Then Edgar was wronged. Kind gods, forgive me for that, and let him prosper!"}, {"t": "sp", "who": "REGAN", "lines": ["Go thrust him out at gates, and let him smell", "His way to Dover.—How is't, my lord? How look you?"], "id": 822, "m": "Go and throw him out of the gates, and let him smell his way to Dover. How is it, my lord? How are you?"}, {"t": "sp", "who": "CORNWALL", "lines": ["I have receiv'd a hurt:—follow me, lady.—", "Turn out that eyeless villain;—throw this slave", "Upon the dunghill.—Regan, I bleed apace:", "Untimely comes this hurt: give me your arm."], "id": 823, "m": "I've been wounded. Follow me, lady. Throw out that eyeless villain. Throw this slave on the dunghill. Regan, I'm bleeding fast. This wound comes at a bad time. Give me your arm."}, {"t": "sd", "text": "Exit Cornwall, led by Regan; Servants unbind Gloster and lead him out.", "id": 824}, {"t": "sp", "who": "SECOND SERVANT", "lines": ["I'll never care what wickedness I do,", "If this man come to good."], "id": 825, "m": "I'll never care what wickedness I do if this man comes to a good end."}, {"t": "sp", "who": "THIRD SERVANT", "lines": ["If she live long,", "And in the end meet the old course of death,", "Women will all turn monsters."], "id": 826, "m": "If she lives long and dies a natural death in the end, all women will turn into monsters."}, {"t": "sp", "who": "SECOND SERVANT", "lines": ["Let's follow the old earl, and get the Bedlam", "To lead him where he would: his roguish madness", "Allows itself to anything."], "id": 827, "m": "Let's follow the old earl and get the Bedlam madman to lead him wherever he wants. His wandering madness lets him do anything."}, {"t": "sp", "who": "THIRD SERVANT", "lines": ["Go thou: I'll fetch some flax and whites of eggs", "To apply to his bleeding face. Now heaven help him!"], "id": 828, "m": "You go. I'll fetch some linen and egg whites to put on his bleeding face. Now may heaven help him!"}, {"t": "sd", "text": "Exeunt severally.", "id": 829}, {"t": "scene", "act": 4, "scene": "I", "loc": "The heath.", "id": 830}, {"t": "sd", "text": "Enter Edgar.", "id": 831}, {"t": "sp", "who": "EDGAR", "lines": ["Yet better thus, and known to be contemn'd,", "Than still contemn'd and flatter'd. To be worst,",
