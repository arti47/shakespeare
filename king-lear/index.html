ence", "Which else were shame, that then necessity", "Will call discreet proceeding."], "id": 265, "m": "Sir, it's not only this Fool of yours, who's allowed to say anything, but others of your insolent followers too, who every hour complain and quarrel, breaking out into gross and unbearable riots. Sir, I thought that by telling you about this I'd get it safely put right. But now I'm starting to fear, from what you yourself have recently said and done, that you protect this behaviour and encourage it by allowing it. If you do, the fault won't escape blame, and the remedies won't be delayed. Those remedies, taken out of concern for the good of the state, might offend you, which would normally be shameful, but necessity will then call them sensible action."}, {"t": "sp", "who": "FOOL", "lines": ["For you know, nuncle,", "~The hedge-sparrow fed the cuckoo so long", "~That it had it head bit off by it young.", "So out went the candle, and we were left darkling."], "id": 266, "m": "For you know, uncle, the hedge-sparrow fed the cuckoo so long that its own chick bit its head off. So out went the candle, and we were left in the dark."}, {"t": "sp", "who": "LEAR", "lines": ["Are you our daughter?"], "id": 267, "m": "Are you my daughter?"}, {"t": "sp", "who": "GONERIL", "lines": ["Come, sir,", "I would you would make use of that good wisdom,", "Whereof I know you are fraught; and put away", "These dispositions, that of late transform you", "From what you rightly are."], "id": 268, "m": "Come, sir, I wish you would use that good sense I know you're full of, and put aside these moods that recently have changed you from what you really are."}, {"t": "sp", "who": "FOOL", "lines": ["May not an ass know when the cart draws the horse?—Whoop, Jug! I", "love thee!"], "id": 269, "m": "Can't even a donkey tell when the cart is pulling the horse? Whoopee, Jug! I love you!"}, {"t": "sp", "who": "LEAR", "lines": ["Doth any here know me?—This is not Lear;", "Doth Lear walk thus? speak thus? Where are his eyes?", "Either his notion weakens, his discernings", "Are lethargied.—Ha! waking? 'Tis not so!—", "Who is it that can tell me who I am?"], "id": 270, "m": "Does anyone here know me? This isn't Lear. Does Lear walk like this? Talk like this? Where are his eyes? Either his mind is weakening or his senses are numbed. Ha! Am I awake? It can't be! Who can tell me who I am?"}, {"t": "sp", "who": "FOOL", "lines": ["Lear's shadow."], "id": 271, "m": "Lear's shadow."}, {"t": "sp", "who": "LEAR", "lines": ["I would learn that; for, by the marks of sovereignty,", "Knowledge, and reason,", "I should be false persuaded I had daughters."], "id": 272, "m": "I'd like to know that, for by the signs of kingship, knowledge and reason, I'd be misled into thinking I had daughters."}, {"t": "sp", "who": "FOOL", "lines": ["Which they will make an obedient father."], "id": 273, "m": "Daughters who will make an obedient father of you."}, {"t": "sp", "who": "LEAR", "lines": ["Your name, fair gentlewoman?"], "id": 274, "m": "What's your name, fair lady?"}, {"t": "sp", "who": "GONERIL", "lines": ["This admiration, sir, is much o' the favour", "Of other your new pranks. I do beseech you", "To understand my purposes aright:", "As you are old and reverend, you should be wise.", "Here do you keep a hundred knights and squires;", "Men so disorder'd, so debosh'd, and bold", "That this our court, infected with their manners,", "Shows like a riotous inn: epicurism and lust", "Make it more like a tavern or a brothel", "Than a grac'd palace. The shame itself doth speak", "For instant remedy: be, then, desir'd", "By her that else will take the thing she begs", "A little to disquantity your train;", "And the remainder, that shall still depend,", "To be such men as may besort your age,", "Which know themselves, and you."], "id": 275, "m": "This pretended amazement, sir, is just like your other recent tricks. Please understand what I mean properly. As you are old and respected, you should be wise. You keep a hundred knights and squires here, men so disorderly, debauched and bold that our court, infected by their behaviour, looks like a rowdy inn. Gluttony and lust make it more like a tavern or a brothel than an elegant palace. The shame itself calls for an immediate remedy. So be asked, by someone who will otherwise take what she asks for, to reduce your followers a little, and let those who remain be men suited to your age, who know their place and yours."}, {"t": "sp", "who": "LEAR", "lines": ["Darkness and devils!—", "Saddle my horses; call my train together.—", "Degenerate bastard! I'll not trouble thee:", "Yet have I left a daughter."], "id": 276, "m": "Darkness and devils! Saddle my horses. Gather my followers. Degenerate bastard! I won't trouble you. I still have another daughter."}, {"t": "sp", "who": "GONERIL", "lines": ["You strike my people; and your disorder'd rabble", "Make servants of their betters."], "id": 277, "m": "You hit my servants, and your disorderly mob treat their superiors like servants."}, {"t": "sd", "text": "Enter Albany.", "id": 278}, {"t": "sp", "who": "LEAR", "lines": ["Woe that too late repents!—", "[To Albany.] O, sir, are you come?", "Is it your will? Speak, sir.—Prepare my horses.—", "Ingratitude, thou marble-hearted fiend,", "More hideous when thou show'st thee in a child", "Than the sea-monster!"], "id": 279, "m": "Woe to the man who repents too late! [To Albany] Oh, sir, have you come? Is this what you want? Speak, sir. Get my horses ready. Ingratitude, you stone-hearted devil, you're more hideous when you appear in a child than the sea-monster!"}, {"t": "sp", "who": "ALBANY", "lines": ["Pray, sir, be patient."], "id": 280, "m": "Please, sir, be patient."}, {"t": "sp", "who": "LEAR", "lines": ["[to Goneril] Detested kite, thou liest!:", "My train are men of choice and rarest parts,", "That all particulars of duty know;", "And in the most exact regard support", "The worships of their name.—O most small fault,", "How ugly didst thou in Cordelia show!", "Which, like an engine, wrench'd my frame of nature", "From the fix'd place; drew from my heart all love,", "And added to the gall. O Lear, Lear, Lear!", "Beat at this gate that let thy folly in  [Striking his head.]", "And thy dear judgment out!—Go, go, my people."], "id": 281, "m": "[To Goneril] Hateful vulture, you lie! My followers are excellent men of rare quality, who know every detail of their duty and take the greatest care to live up to their good names. Oh, Cordelia's tiny fault, how ugly you looked in her! Like a crowbar, it wrenched my natural feeling out of its fixed place, drained all the love from my heart and replaced it with bitterness. Oh Lear, Lear, Lear! Beat at this door that let your folly in [striking his head] and your precious judgement out! Go, go, my people."}, {"t": "sp", "who": "ALBANY", "lines": ["My lord, I am guiltless, as I am ignorant", "Of what hath mov'd you."], "id": 282, "m": "My lord, I'm innocent, as I don't even know what has upset you."}, {"t": "sp", "who": "LEAR", "lines": ["It may be so, my lord.", "Hear, nature, hear; dear goddess, hear", "Suspend thy purpose, if thou didst intend", "To make this creature fruitful!", "Into her womb convey sterility!", "Dry up in her the organs of increase;", "And from her derogate body never spring", "A babe to honour her! If she must teem,", "Create her child of spleen, that it may live", "And be a thwart disnatur'd torment to her!", "Let it stamp wrinkles in her brow of youth;", "With cadent tears fret channels in her cheeks;", "Turn all her mother's pains and benefits", "To laughter and contempt; that she may feel", "How sharper than a serpent's tooth it is", "To have a thankless child!—Away, away!"], "id": 283, "m": "That may be so, my lord. Hear, Nature, hear! Dear goddess, hear! Abandon your plan if you meant to make this creature fertile! Make her womb sterile! Dry up the organs that make children, and from her degraded body let no baby ever be born to honour her! If she must give birth, make her child out of malice, so that it lives to be a perverse, unnatural torment to her! Let it stamp wrinkles on her young forehead and wear channels in her cheeks with falling tears. Let it turn all her motherly pains and kindness into laughter and contempt, so that she may feel how much sharper than a serpent's tooth it is to have an ungrateful child! Away, away!"}, {"t": "sd", "text": "Exit.", "id": 284}, {"t": "sp", "who": "ALBANY", "lines": ["Now, gods that we adore, whereof comes this?"], "id": 285, "m": "Now, by the gods we worship, what's caused this?"}, {"t": "sp", "who": "GONERIL", "lines": ["Never afflict yourself to know more of it;", "But let his disposition have that scope", "That dotage gives it."], "id": 286, "m": "Don't bother to find out any more. Just let his mood run as far as his senility takes it."}, {"t": "sd", "text": "Re-enter Lear.", "id": 287}, {"t": "sp", "who": "LEAR", "lines": ["What, fifty of my followers at a clap!", "Within a fortnight!"], "id": 288, "m": "What, fifty of my followers at one stroke? Within a fortnight?"}, {"t": "sp", "who": "ALBANY", "lines": ["What's the matter, sir?"], "id": 289, "m": "What's the matter, sir?"}, {"t": "sp", "who": "LEAR", "lines": ["I'll tell thee.—Life and death!—[To Goneril] I am asham'd", "That thou hast power to shake my manhood thus;", "That these hot tears, which break from me perforce,", "Should make thee worth them.—Blasts and fogs upon thee!", "Th' untented woundings of a father's curse", "Pierce every sense about thee!—Old fond eyes,", "Beweep this cause again, I'll pluck you out,", "And cast you, with the waters that you lose,", "To temper clay. Ha!", "Let it be so: I have another daughter,", "Who, I am sure, is kind and comfortable:", "When she shall hear this of thee, with her nails", "She'll flay thy wolvish visage. Thou shalt find", "That I'll resume the shape which thou dost think", "I have cast off for ever."], "id": 290, "m": "I'll tell you. Life and death! [To Goneril] I'm ashamed that you have the power to shake my manhood like this, that these hot tears, which burst out of me against my will, should make you seem worth crying over. Storms and fogs on you! May the deep, incurable wounds of a father's curse pierce every sense you have! Foolish old eyes, if you weep over this again, I'll pluck you out and throw you, with the water you shed, to soften clay. Ha! So be it. I have another daughter who I'm sure is kind and comforting. When she hears about you, she'll claw your wolfish face with her nails. You'll find that I'll take back the power you think I've given up for ever."}, {"t": "sd", "text": "Exeunt Lear, Kent, and Attendants.", "id": 291}, {"t": "sp", "who": "GONERIL", "lines": ["Do you mark that?"], "id": 292, "m": "Did you hear that?"}, {"t": "sp", "who": "ALBANY", "lines": ["I cannot be so partial, Goneril,", "To the great love I bear you,—"], "id": 293, "m": "I can't be so biased, Goneril, by the great love I have for you..."}, {"t": "sp", "who": "GONERIL", "lines": ["Pray you, content.—What, Oswald, ho!", "[To the Fool] You, sir, more knave than fool, after your master."], "id": 294, "m": "Please, be quiet. Oswald, hey! [To the Fool] You, sir, more rogue than fool, follow your master."}, {"t": "sp", "who": "FOOL", "lines": ["Nuncle Lear, nuncle Lear, tarry,—take the fool with thee.—", "~A fox when one has caught her,", "~And such a daughter,", "~Should sure to the slaughter,", "~If my cap would buy a halter;", "~So the fool follows after."], "id": 295, "m": "Uncle Lear, uncle Lear, wait! Take the Fool with you. A fox, when she's caught, and a daughter like this, should certainly be slaughtered, if my cap could buy a noose. So the Fool follows after."}, {"t": "sd", "text": "Exit.", "id": 296}, {"t": "sp", "who": "GONERIL", "lines": ["This man hath had good counsel.—A hundred knights!", "'Tis politic and safe to let him keep", "At point a hundred knights: yes, that on every dream,", "Each buzz, each fancy, each complaint, dislike,", "He may enguard his dotage with their powers,", "And hold our lives in mercy.—Oswald, I say!—"], "id": 297, "m": "This man has had good advice! A hundred knights! It's very wise and safe to let him keep a hundred armed knights, so that on every whim, every rumour, every fancy, every complaint or dislike, he can protect his senility with their power and hold our lives at his mercy. Oswald, I say!"}, {"t": "sp", "who": "ALBANY", "lines": ["Well, you may fear too far."], "id": 298, "m": "Well, you may be too afraid."}, {"t": "sp", "who": "GONERIL", "lines": ["Safer than trust too far:", "Let me still take away the harms I fear,", "Not fear still to be taken: I know his heart.", "What he hath utter'd I have writ my sister:", "If she sustain him and his hundred knights,", "When I have show'd th' unfitness,—"], "id": 299, "m": "Safer than trusting too much. Let me always remove the dangers I fear rather than always fear being caught by them. I know his heart. I've written to my sister what he said. If she keeps him and his hundred knights when I've shown how unwise it is..."}, {"t": "sd", "text": "Re-enter Oswald.", "id": 300}, {"t": "sp", "who": "GONERIL", "cont": 1, "lines": ["How now, Oswald!", "What, have you writ that letter to my sister?"], "id": 301, "m": "Ah, Oswald! Have you written that letter to my sister?"}, {"t": "sp", "who": "OSWALD", "lines": ["Ay, madam."], "id": 302, "m": "Yes, madam."}, {"t": "sp", "who": "GONERIL", "lines": ["Take you some company, and away to horse:", "Inform her full of my particular fear;", "And thereto add such reasons of your own", "As may compact it more. Get you gone;", "And hasten your return."], "id": 303, "m": "Take some men with you and ride off. Tell her fully about my personal fears, and add any reasons of your own that make it stronger. Go, and hurry back."}, {"t": "sd", "text": "Exit Oswald.", "id": 304}, {"t": "sp", "who": "GONERIL", "cont": 1, "lines": ["No, no, my lord!", "This milky gentleness and course of yours,", "Though I condemn it not, yet, under pardon,", "You are much more attask'd for want of wisdom", "Than prais'd for harmful mildness."], "id": 305, "m": "No, no, my lord! This milk-and-water gentleness of yours, though I don't condemn it, is, if you'll forgive me, more often blamed for lack of wisdom than praised for its harmful mildness."}, {"t": "sp", "who": "ALBANY", "lines": ["How far your eyes may pierce I cannot tell:", "Striving to better, oft we mar what's well."], "id": 306, "m": "I can't tell how far you can see ahead. In trying to make things better, we often spoil what's fine."}, {"t": "sp", "who": "GONERIL", "lines": ["Nay then,—"], "id": 307, "m": "Well then..."}, {"t": "sp", "who": "ALBANY", "lines": ["Well, well; the event."], "id": 308, "m": "Well, well. We'll see what happens."}, {"t": "sd", "text": "Exeunt.", "id": 309}, {"t": "scene", "act": 1, "scene": "V", "loc": "Court before the Duke of Albany's Palace.", "id": 310}, {"t": "sd", "text": "Enter Lear, Kent, and Fool.", "id": 311}, {"t": "sp", "who": "LEAR", "lines": ["Go you before to Gloster with these letters: acquaint my", "daughter no further with anything you know than comes from her", "demand out of the letter. If your diligence be not speedy, I", "shall be there afore you."], "id": 312, "m": "Go ahead to Gloster with these letters. Don't tell my daughter anything you know except what she asks you about after reading the letter. If you're not quick, I'll be there before you."}, {"t": "sp", "who": "KENT", "lines": ["I will not sleep, my lord, till I have delivered your letter."], "id": 313, "m": "I won't sleep, my lord, until I've delivered your letter."}, {"t": "sd", "text": "Exit.", "id": 314}, {"t": "sp", "who": "FOOL", "lines": ["If a man's brains were in's heels, were't not in danger of kibes?"], "id": 315, "m": "If a man's brains were in his heels, wouldn't they be in danger of chilblains?"}, {"t": "sp", "who": "LEAR", "lines": ["Ay, boy."], "id": 316, "m": "Yes, boy."}, {"t": "sp", "who": "FOOL", "lines": ["Then I pr'ythee be merry; thy wit shall not go slipshod."], "id": 317, "m": "Then please cheer up. Your brains will never need slippers."}, {"t": "sp", "who": "LEAR", "lines": ["Ha, ha, ha!"], "id": 318, "m": "Ha, ha, ha!"}, {"t": "sp", "who": "FOOL", "lines": ["Shalt see thy other daughter will use thee kindly; for though", "she's as like this as a crab's like an apple, yet I can tell", "what I can tell."], "id": 319, "m": "You'll see your other daughter will treat you kindly. For although she's as like this one as a crab apple is like an apple, I can tell what I can tell."}, {"t": "sp", "who": "LEAR", "lines": ["What canst tell, boy?"], "id": 320, "m": "What can you tell, boy?"}, {"t": "sp", "who": "FOOL", "lines": ["She'll taste as like this as a crab does to a crab. Thou", "canst tell why one's nose stands i' the middle on's face?"], "id": 321, "m": "She'll taste as like this one as one crab apple to another. Can you tell why a person's nose is in the middle of his face?"}, {"t": "sp", "who": "LEAR", "lines": ["No."], "id": 322, "m": "No."}, {"t": "sp", "who": "FOOL", "lines": ["Why, to keep one's eyes of either side's nose, that what a man", "cannot smell out, he may spy into."], "id": 323, "m": "Why, to keep his eyes on either side of his nose, so that what a man can't smell out, he can see."}, {"t": "sp", "who": "LEAR", "lines": ["I did her wrong,—"], "id": 324, "m": "I did her wrong..."}, {"t": "sp", "who": "FOOL", "lines": ["Canst tell how an oyster makes his shell?"], "id": 325, "m": "Can you tell how an oyster makes its shell?"}, {"t": "sp", "who": "LEAR", "lines": ["No."], "id": 326, "m": "No."}, {"t": "sp", "who": "FOOL", "lines": ["Nor I neither; but I can tell why a snail has a house."], "id": 327, "m": "Nor can I. But I can tell why a snail has a house."}, {"t": "sp", "who": "LEAR", "lines": ["Why?"], "id": 328, "m": "Why?"}, {"t": "sp", "who": "FOOL", "lines": ["Why, to put's head in; not to give it away to his daughters, and", "leave his horns without a case."], "id": 329, "m": "Why, to put his head in, not to give it away to his daughters and leave his horns without a cover."}, {"t": "sp", "who": "LEAR", "lines": ["I will forget my nature. So kind a father!—Be my horses ready?"], "id": 330, "m": "I'll stop being a loving father. Such a kind father! Are my horses ready?"}, {"t": "sp", "who": "FOOL", "lines": ["Thy asses are gone about 'em. The reason why the seven stars are", "no more than seven is a pretty reason."], "id": 331, "m": "Your donkeys have gone to get them. The reason why the seven stars are no more than seven is a pretty reason."}, {"t": "sp", "who": "LEAR", "lines": ["Because they are not eight?"], "id": 332, "m": "Because they're not eight?"}, {"t": "sp", "who": "FOOL", "lines": ["Yes indeed: thou wouldst make a good fool."], "id": 333, "m": "Yes, exactly. You'd make a good fool."}, {"t": "sp", "who": "LEAR", "lines": ["To tak't again perforce!—Monster ingratitude!"], "id": 334, "m": "To take it back by force! Monstrous ingratitude!"}, {"t": "sp", "who": "FOOL", "lines": ["If thou wert my fool, nuncle, I'ld have thee beaten for being", "old before thy time."], "id": 335, "m": "If you were my fool, uncle, I'd have you beaten for being old before your time."}, {"t": "sp", "who": "LEAR", "lines": ["How's that?"], "id": 336, "m": "What do you mean?"}, {"t": "sp", "who": "FOOL", "lines": ["Thou shouldst not have been old till thou hadst been wise."], "id": 337, "m": "You shouldn't have grown old until you'd grown wise."}, {"t": "sp", "who": "LEAR", "lines": ["O, let me not be mad, not mad, sweet heaven!", "Keep me in temper; I would not be mad!—"], "id": 338, "m": "Oh, don't let me go mad, not mad, sweet heaven! Keep me sane. I don't want to be mad!"}, {"t": "sd", "text": "Enter Gentleman.", "id": 339}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["How now? are the horses ready?"], "id": 340, "m": "Well? Are the horses ready?"}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Ready, my lord."], "id": 341, "m": "Ready, my lord."}, {"t": "sp", "who": "LEAR", "lines": ["Come, boy."], "id": 342, "m": "Come, boy."}, {"t": "sp", "who": "FOOL", "lines": ["She that's a maid now, and laughs at my departure,", "Shall not be a maid long, unless things be cut shorter."], "id": 343, "m": "[To the audience] Any girl who's a virgin now and laughs at me leaving won't be a virgin long, unless things are cut shorter."}, {"t": "sd", "text": "Exeunt.", "id": 344}, {"t": "scene", "act": 2, "scene": "I", "loc": "A court within the Castle of the Earl of Gloster.", "id": 345}, {"t": "sd", "text": "Enter Edmund and Curan, meeting.", "id": 346}, {"t": "sp", "who": "EDMUND", "lines": ["Save thee, Curan."], "id": 347, "m": "God save you, Curan."}, {"t": "sp", "who": "CURAN", "lines": ["And you, sir. I have been with your father, and given him", "notice that the Duke of Cornwall and Regan his duchess will be", "here with him this night."], "id": 348, "m": "And you, sir. I've been with your father and told him that the Duke of Cornwall and his duchess Regan will be here with him tonight."}, {"t": "sp", "who": "EDMUND", "lines": ["How comes that?"], "id": 349, "m": "Why is that?"}, {"t": "sp", "who": "CURAN", "lines": ["Nay, I know not.—You have heard of the news abroad; I mean the", "whispered ones, for they are yet but ear-kissing arguments?"], "id": 350, "m": "I don't know. Have you heard the news that's going round? I mean the whispered news, because it's still only gossip murmured in people's ears."}, {"t": "sp", "who": "EDMUND", "lines": ["Not I: pray you, what are they?"], "id": 351, "m": "Not I. Please, what is it?"}, {"t": "sp", "who": "CURAN", "lines": ["Have you heard of no likely wars toward, 'twixt the two dukes", "of Cornwall and Albany?"], "id": 352, "m": "Haven't you heard about a likely war coming between the Dukes of Cornwall and Albany?"}, {"t": "sp", "who": "EDMUND", "lines": ["Not a word."], "id": 353, "m": "Not a word."}, {"t": "sp", "who": "CURAN", "lines": ["You may do, then, in time. Fare you well, sir."], "id": 354, "m": "Then you may hear in time. Goodbye, sir."}, {"t": "sd", "text": "Exit.", "id": 355}, {"t": "sp", "who": "EDMUND", "lines": ["The Duke be here to-night? The better! best!", "This weaves itself perforce into my business.", "My father hath set guard to take my brother;", "And I have one thing, of a queasy question,", "Which I must act:—briefness and fortune work!—", "Brother, a word!—descend:—brother, I say!"], "id": 356, "m": "The Duke here tonight? So much the better! The best! This fits perfectly into my plan. My father has set guards to catch my brother, and I have one tricky thing I must do. Speed and luck, help me! Brother, a word! Come down! Brother, I say!"}, {"t": "sd", "text": "Enter Edgar.", "id": 357}, {"t": "sp", "who": "EDMUND", "cont": 1, "lines": ["My father watches:—sir, fly this place;", "Intelligence is given where you are hid;", "You have now the good advantage of the night.—", "Have you not spoken 'gainst the Duke of Cornwall?", "He's coming hither; now, i' the night, i' the haste,", "And Regan with him: have you nothing said", "Upon his party 'gainst the Duke of Albany?", "Advise yourself."], "id": 358, "m": "My father is watching. Sir, run away from here. Someone has told him where you're hiding. You have the advantage of the dark now. Haven't you said anything against the Duke of Cornwall? He's coming here, now, at night, in a hurry, and Regan with him. Have you said nothing on his side against the Duke of Albany? Think carefully."}, {"t": "sp", "who": "EDGAR", "lines": ["I am sure on't, not a word."], "id": 359, "m": "I'm sure of it. Not a word."}, {"t": "sp", "who": "EDMUND", "lines": ["I hear my father coming:—pardon me;", "In cunning I must draw my sword upon you:—", "Draw: seem to defend yourself: now quit you well.—", "Yield:—come before my father.—Light, ho, here!", "Fly, brother.—Torches, torches!—So farewell."], "id": 360, "m": "I can hear my father coming. Forgive me, but I must pretend to draw my sword on you. Draw! Pretend to defend yourself. Now do it well. Surrender! Come before my father! Lights, here! Run, brother. Torches, torches! So, goodbye."}, {"t": "sd", "text": "Exit Edgar.", "id": 361}, {"t": "sp", "who": "EDMUND", "cont": 1, "lines": ["Some blood drawn on me would beget opinion", "Of my more fierce endeavour: [Wounds his arm.]", "I have seen drunkards", "Do more than this in sport.—Father, father!", "Stop, stop! No help?"], "id": 362, "m": "A little blood drawn from me would make them believe I fought fiercely. [He cuts his arm.] I've seen drunks do more than this for fun. Father, father! Stop, stop! Won't anyone help?"}, {"t": "sd", "text": "Enter Gloster, and Servants with torches.", "id": 363}, {"t": "sp", "who": "GLOSTER", "lines": ["Now, Edmund, where's the villain?"], "id": 364, "m": "Now, Edmund, where's the villain?"}, {"t": "sp", "who": "EDMUND", "lines": ["Here stood he in the dark, his sharp sword out,", "Mumbling of wicked charms, conjuring the moon", "To stand auspicious mistress,—"], "id": 365, "m": "He stood here in the dark, his sharp sword drawn, mumbling wicked spells and calling on the moon to be his lucky goddess..."}, {"t": "sp", "who": "GLOSTER", "lines": ["But where is he?"], "id": 366, "m": "But where is he?"}, {"t": "sp", "who": "EDMUND", "lines": ["Look, sir, I bleed."], "id": 367, "m": "Look, sir, I'm bleeding."}, {"t": "sp", "who": "GLOSTER", "lines": ["Where is the villain, Edmund?"], "id": 368, "m": "Where is the villain, Edmund?"}, {"t": "sp", "who": "EDMUND", "lines": ["Fled this way, sir. When by no means he could,—"], "id": 369, "m": "He ran off this way, sir, when he couldn't in any way..."}, {"t": "sp", "who": "GLOSTER", "lines": ["Pursue him, ho!—Go after."], "id": 370, "m": "Chase him, hey! Go after him."}, {"t": "sd", "text": "Exeunt Servants.", "id": 371}, {"t": "sp", "who": "GLOSTER", "cont": 1, "lines": ["—By no means what?"], "id": 372, "m": "In any way what?"}, {"t": "sp", "who": "EDMUND", "lines": ["Persuade me to the murder of your lordship;", "But that I told him the revenging gods", "'Gainst parricides did all their thunders bend;", "Spoke with how manifold and strong a bond", "The child was bound to the father;—sir, in fine,", "Seeing how loathly opposite I stood", "To his unnatural purpose, in fell motion", "With his prepared sword, he charges home", "My unprovided body, lanc'd mine arm;", "But when he saw my best alarum'd spirits,", "Bold in the quarrel's right, rous'd to the encounter,", "Or whether gasted by the noise I made,", "Full suddenly he fled."], "id": 373, "m": "...persuade me to murder your lordship. I told him the avenging gods aim all their thunder at those who kill their fathers, and spoke of how many strong bonds tie a child to his father. Sir, in short, when he saw how much I hated his unnatural plan, he lunged fiercely with his drawn sword at my unprotected body and cut my arm. But when he saw my courage roused, confident that I was in the right and ready to fight, or perhaps scared by the noise I made, he suddenly ran away."}, {"t": "sp", "who": "GLOSTER", "lines": ["Let him fly far;", "Not in this land shall he remain uncaught;", "And found—dispatch'd.—The noble duke my master,", "My worthy arch and patron, comes to-night:", "By his authority I will proclaim it,", "That he which finds him shall deserve our thanks,", "Bringing the murderous coward to the stake;", "He that conceals him, death."], "id": 374, "m": "Let him run far. He won't stay free anywhere in this land, and when he's found, he'll be killed. The noble Duke, my master, my chief patron, comes tonight. By his authority I'll proclaim that whoever finds him will earn our thanks for bringing the murderous coward to execution, and whoever hides him will die."}, {"t": "sp", "who": "EDMUND", "lines": ["When I dissuaded him from his intent,", "And found him pight to do it, with curst speech", "I threaten'd to discover him: he replied,", "'Thou unpossessing bastard! dost thou think,", "If I would stand against thee, would the reposal", "Of any trust, virtue, or worth in thee", "Make thy words faith'd? No: what I should deny", "As this I would; ay, though thou didst produce", "My very character, I'd turn it all", "To thy suggestion, plot, and damned practice:", "And thou must make a dullard of the world,", "If they not thought the profits of my death", "Were very pregnant and potential spurs", "To make thee seek it."], "id": 375, "m": "When I tried to talk him out of it and found him set on doing it, I threatened angrily to expose him. He answered, 'You penniless bastard! Do you think that if I stood against you, anyone would believe your word because they trusted your virtue or worth? No. I'd deny it all, as I'd deny this, even if you showed my own handwriting. I'd turn it all back on you as your scheming, your plot and your damned trickery. You'd have to think the world very stupid if they didn't believe that the profits you'd get from my death were obvious, powerful reasons for you to want it.'"}, {"t": "sp", "who": "GLOSTER", "lines": ["Strong and fast'ned villain!", "Would he deny his letter?—I never got him."], "id": 376, "m": "Hardened, determined villain! Would he deny his own letter? He's no son of mine."}, {"t": "sd", "text": "Trumpets within.", "id": 377}, {"t": "sp", "who": "GLOSTER", "cont": 1, "lines": ["Hark, the duke's trumpets! I know not why he comes.—", "All ports I'll bar; the villain shall not scape;", "The duke must grant me that: besides, his picture", "I will send far and near, that all the kingdom", "May have due note of him; and of my land,", "Loyal and natural boy, I'll work the means", "To make thee capable."], "id": 378, "m": "Listen, the Duke's trumpets! I don't know why he's coming. I'll block all the ports. The villain won't escape. The Duke must allow me that. Besides, I'll send his picture far and wide so the whole kingdom will know him. And as for my land, my loyal and natural son, I'll find a way to make you able to inherit it."}, {"t": "sd", "text": "Enter Cornwall, Regan, and Attendants.", "id": 379}, {"t": "sp", "who": "CORNWALL", "lines": ["How now, my noble friend! since I came hither,—", "Which I can call but now,—I have heard strange news."], "id": 380, "m": "Well, my noble friend! Since I arrived, which was only just now, I've heard strange news."}, {"t": "sp", "who": "REGAN", "lines": ["If it be true, all vengeance comes too short", "Which can pursue the offender. How dost, my lord?"], "id": 381, "m": "If it's true, no punishment is enough for the offender. How are you, my lord?"}, {"t": "sp", "who": "GLOSTER", "lines": ["O madam, my old heart is crack'd,—it's crack'd!"], "id": 382, "m": "Oh, madam, my old heart is broken, it's broken!"}, {"t": "sp", "who": "REGAN", "lines": ["What, did my father's godson seek your life?", "He whom my father nam'd? your Edgar?"], "id": 383, "m": "What, did my father's godson try to kill you? The one my father named? Your Edgar?"}, {"t": "sp", "who": "GLOSTER", "lines": ["O lady, lady, shame would have it hid!"], "id": 384, "m": "Oh, lady, lady, I'd hide it out of shame!"}, {"t": "sp", "who": "REGAN", "lines": ["Was he not companion with the riotous knights", "That tend upon my father?"], "id": 385, "m": "Wasn't he friends with the rowdy knights who serve my father?"}, {"t": "sp", "who": "GLOSTER", "lines": ["I know not, madam:—", "It is too bad, too bad."], "id": 386, "m": "I don't know, madam. It's too bad, too bad."}, {"t": "sp", "who": "EDMUND", "lines": ["Yes, madam, he was of that consort."], "id": 387, "m": "Yes, madam, he was one of that gang."}, {"t": "sp", "who": "REGAN", "lines": ["No marvel then though he were ill affected:", "'Tis they have put him on the old man's death,", "To have the expense and waste of his revenues.", "I have this present evening from my sister", "Been well inform'd of them; and with such cautions", "That if they come to sojourn at my house,", "I'll not be there."], "id": 388, "m": "No wonder he went bad, then. It's they who have put him up to killing the old man, so they can spend and waste his income. This very evening my sister told me all about them, with such warnings that if they come to stay at my house, I won't be there."}, {"t": "sp", "who": "CORNWALL", "lines": ["Nor I, assure thee, Regan.—", "Edmund, I hear that you have shown your father", "A childlike office."], "id": 389, "m": "Nor I, I promise you, Regan. Edmund, I hear you have done your father a true son's service."}, {"t": "sp", "who": "EDMUND", "lines": ["'Twas my duty, sir."], "id": 390, "m": "It was my duty, sir."}, {"t": "sp", "who": "GLOSTER", "lines": ["He did bewray his practice; and receiv'd", "This hurt you see, striving to apprehend him."], "id": 391, "m": "He exposed Edgar's plot, and got this wound you see trying to arrest him."}, {"t": "sp", "who": "CORNWALL", "lines": ["Is he pursu'd?"], "id": 392, "m": "Is he being hunted?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Ay, my good lord."], "id": 393, "m": "Yes, my good lord."}, {"t": "sp", "who": "CORNWALL", "lines": ["If he be taken, he shall never more", "Be fear'd of doing harm: make your own purpose,", "How in my strength you please.—For you, Edmund,", "Whose virtue and obedience doth this instant", "So much commend itself, you shall be ours:", "Natures of such deep trust we shall much need;", "You we first seize on."], "id": 394, "m": "If he's caught, he'll never be feared again. Make your plans, using my power however you like. As for you, Edmund, whose goodness and obedience show so well right now, you'll serve me. I'll need men I can trust so deeply. You're the first I take."}, {"t": "sp", "who": "EDMUND", "lines": ["I shall serve you, sir,", "Truly, however else."], "id": 395, "m": "I'll serve you faithfully, sir, whatever else I do."}, {"t": "sp", "who": "GLOSTER", "lines": ["For him I thank your grace."], "id": 396, "m": "I thank your grace for him."}, {"t": "sp", "who": "CORNWALL", "lines": ["You know not why we came to visit you,—"], "id": 397, "m": "You don't know why we've come to visit you..."}, {"t": "sp", "who": "REGAN", "lines": ["Thus out of season, threading dark-ey'd night:", "Occasions, noble Gloster, of some poise,", "Wherein we must have use of your advice:—", "Our father he hath writ, so hath our sister,", "Of differences, which I best thought it fit", "To answer from our home; the several messengers", "From hence attend despatch. Our good old friend,", "Lay comforts to your bosom; and bestow", "Your needful counsel to our business,", "Which craves the instant use."], "id": 398, "m": "...so unexpectedly, travelling through the dark night. There are matters of some weight, noble Gloster, on which we need your advice. Our father has written, and so has our sister, about their quarrels, and I thought it best to answer away from our home. The messengers are waiting here to be sent back. Our good old friend, comfort yourself, and give us the advice our business needs, as it needs it right away."}, {"t": "sp", "who": "GLOSTER", "lines": ["I serve you, madam:", "Your graces are right welcome."], "id": 399, "m": "I'm at your service, madam. Your graces are very welcome."}, {"t": "sd", "text": "Exeunt.", "id": 400}, {"t": "scene", "act": 2, "scene": "II", "loc": "Before Gloster's Castle.", "id": 401}, {"t": "sd", "text": "Enter Kent and Oswald, severally.", "id": 402}, {"t": "sp", "who": "OSWALD", "lines": ["Good dawning to thee, friend: art of this house?"], "id": 403, "m": "Good morning to you, friend. Do you belong to this house?"}, {"t": "sp", "who": "KENT", "lines": ["Ay."], "id": 404, "m": "Yes."}, {"t": "sp", "who": "OSWALD", "lines": ["Where may we set our horses?"], "id": 405, "m": "Where can we put our horses?"}, {"t": "sp", "who": "KENT", "lines": ["I' the mire."], "id": 406, "m": "In the mud."}, {"t": "sp", "who": "OSWALD", "lines": ["Pr'ythee, if thou lov'st me, tell me."], "id": 407, "m": "Please, if you love me, tell me."}, {"t": "sp", "who": "KENT", "lines": ["I love thee not."], "id": 408, "m": "I don't love you."}, {"t": "sp", "who": "OSWALD", "lines": ["Why then, I care not for thee."], "id": 409, "m": "Well then, I don't care about you."}, {"t": "sp", "who": "KENT", "lines": ["If I had thee in Lipsbury pinfold, I would make thee care for me."], "id": 410, "m": "If I had you between my teeth, I'd make you care about me."}, {"t": "sp", "who": "OSWALD", "lines": ["Why dost thou use me thus? I know thee not."], "id": 411, "m": "Why are you treating me like this? I don't know you."}, {"t": "sp", "who": "KENT", "lines": ["Fellow, I know thee."], "id": 412, "m": "Fellow, I know you."}, {"t": "sp", "who": "OSWALD", "lines": ["What dost thou know me for?"], "id": 413, "m": "What do you know me as?"}, {"t": "sp", "who": "KENT", "lines": ["A knave; a rascal; an eater of broken meats; a base, proud,", "shallow, beggarly, three-suited, hundred-pound, filthy,", "worsted-stocking knave; a lily-livered, action-taking, whoreson,", "glass-gazing, superserviceable, finical rogue;", "one-trunk-inheriting slave; one that wouldst be a bawd in way of", "good service, and art nothing but the composition of a", "knave, beggar, coward, pander, and the son and heir of a mongrel", "bitch: one whom I will beat into clamorous whining, if thou", "denyest the least syllable of thy addition."], "id": 414, "m": "A rogue, a rascal, an eater of leftover scraps. A low, proud, shallow, beggarly servant with three suits and a hundred-pound income, a filthy rogue in cheap wool stockings. A lily-livered, cowardly, lawsuit-running son of a whore, a mirror-gazing, over-eager, fussy rogue, a slave whose whole inheritance fits in one trunk. Someone who'd be a pimp if it pleased his master, and who is nothing but a mixture of rogue, beggar, coward and pimp, and the son and heir of a mongrel bitch. I'll beat you till you whine and howl if you deny the smallest syllable of these titles."}, {"t": "sp", "who": "OSWALD", "lines": ["Why, what a monstrous fellow art thou, thus to rail on one that's", "neither known of thee nor knows thee?"], "id": 415, "m": "What a monstrous fellow you are, to insult someone you don't know and who doesn't know you!"}, {"t": "sp", "who": "KENT", "lines": ["What a brazen-faced varlet art thou, to deny thou knowest me! Is", "it two days ago since I beat thee and tripped up thy heels before", "the king? Draw, you rogue: for, though it be night, yet the moon", "shines; I'll make a sop o' the moonshine of you: draw, you", "whoreson cullionly barbermonger, draw!", "[Drawing his sword.]"], "id": 416, "m": "What a shameless rascal you are to deny you know me! Is it two days since I tripped you up and beat you in front of the King? Draw, you rogue. Although it's night, the moon is shining. I'll soak you full of moonshine like bread in soup. Draw, you son-of-a-whore, contemptible dandy, draw! [He draws his sword.]"}, {"t": "sp", "who": "OSWALD", "lines": ["Away! I have nothing to do with thee."], "id": 417, "m": "Get away! I have nothing to do with you."}, {"t": "sp", "who": "KENT", "lines": ["Draw, you rascal: you come with letters against the king; and", "take vanity the puppet's part against the royalty of her father:", "draw, you rogue, or I'll so carbonado your shanks:—", "draw, you rascal; come your ways!"], "id": 418, "m": "Draw, you rascal. You come with letters against the King, and take the side of that puppet Vanity against the royalty of her father. Draw, you rogue, or I'll slice your legs like meat for grilling. Draw, you rascal. Come on!"}, {"t": "sp", "who": "OSWALD", "lines": ["Help, ho! murder! help!"], "id": 419, "m": "Help, hey! Murder! Help!"}, {"t": "sp", "who": "KENT", "lines": ["Strike, you slave; stand, rogue, stand; you neat slave, strike!"], "id": 420, "m": "Fight, you slave! Stand still, rogue, stand still! You dressed-up slave, fight!"}, {"t": "sd", "text": "Beating him.", "id": 421}, {"t": "sp", "who": "OSWALD", "lines": ["Help, ho! murder! murder!"], "id": 422, "m": "Help, hey! Murder! Murder!"}, {"t": "sd", "text": "Enter Edmund, Cornwall, Regan, Gloster, and Servants.", "id": 423}, {"t": "sp", "who": "EDMUND", "lines": ["How now! What's the matter?"], "id": 424, "m": "What's this? What's the matter?"}, {"t": "sp", "who": "KENT", "lines": ["With you, goodman boy, an you please: come, I'll flesh you; come", "on, young master."], "id": 425, "m": "I'll fight you, young sir, if you like. Come on, I'll give you your first taste of blood. Come on, young master."}, {"t": "sp", "who": "GLOSTER", "lines": ["Weapons! arms! What's the matter here?"], "id": 426, "m": "Weapons! Swords! What's going on here?"}, {"t": "sp", "who": "CORNWALL", "lines": ["Keep peace, upon your lives;", "He dies that strikes again. What is the matter?"], "id": 427, "m": "Keep the peace, on your lives! The next man who strikes dies. What's the matter?"}, {"t": "sp", "who": "REGAN", "lines": ["The messengers from our sister and the king."], "id": 428, "m": "The messengers from our sister and the King."}, {"t": "sp", "who": "CORNWALL", "lines": ["What is your difference? speak."], "id": 429, "m": "What's your quarrel? Speak."}, {"t": "sp", "who": "OSWALD", "lines": ["I am scarce in breath, my lord."], "id": 430, "m": "I'm out of breath, my lord."}, {"t": "sp", "who": "KENT", "lines": ["No marvel, you have so bestirr'd your valour. You cowardly", "rascal, nature disclaims in thee; a tailor made thee."], "id": 431, "m": "No wonder, you've worked your courage so hard. You cowardly rascal, nature disowns you. A tailor made you."}, {"t": "sp", "who": "CORNWALL", "lines": ["Thou art a strange fellow: a tailor make a man?"], "id": 432, "m": "You're a strange fellow. A tailor make a man?"}, {"t": "sp", "who": "KENT", "lines": ["Ay, a tailor, sir: a stonecutter or a painter could not have", "made him so ill, though he had been but two hours at the trade."], "id": 433, "m": "Yes, a tailor, sir. A sculptor or a painter couldn't have made him so badly, even after only two hours of training."}, {"t": "sp", "who": "CORNWALL", "lines": ["Speak yet, how grew your quarrel?"], "id": 434, "m": "Go on, tell me how your quarrel started."}, {"t": "sp", "who": "OSWALD", "lines": ["This ancient ruffian, sir, whose life I have spared at suit of", "his grey", "beard,—"], "id": 435, "m": "This old ruffian, sir, whose life I spared because of his grey beard..."}, {"t": "sp", "who": "KENT", "lines": ["Thou whoreson zed! thou unnecessary letter!—My lord, if you'll", "give me leave, I will tread this unbolted villain into mortar and", "daub the walls of a jakes with him.—Spare my grey beard, you", "wagtail?"], "id": 436, "m": "You son-of-a-whore Z! You useless letter! My lord, if you'll let me, I'll stamp this lumpy villain into mortar and plaster the walls of a toilet with him. Spare my grey beard, you bobbing wagtail?"}, {"t": "sp", "who": "CORNWALL", "lines": ["Peace, sirrah!", "You beastly knave, know you no reverence?"], "id": 437, "m": "Quiet, fellow! You beastly rogue, have you no respect?"}, {"t": "sp", "who": "KENT", "lines": ["Yes, sir; but anger hath a privilege."], "id": 438, "m": "Yes, sir, but anger has its privileges."}, {"t": "sp", "who": "CORNWALL", "lines": ["Why art thou angry?"], "id": 439, "m": "Why are you angry?"}, {"t": "sp", "who": "KENT", "lines": ["That such a slave as this should wear a sword,", "Who wears no honesty. Such smiling rogues as these,", "Like rats, oft bite the holy cords a-twain", "Which are too intrinse t' unloose; smooth every passion", "That in the natures of their lords rebel;", "Bring oil to fire, snow to their colder moods;", "Renege, affirm, and turn their halcyon beaks", "With every gale and vary of their masters,", "Knowing naught, like dogs, but following.—", "A plague upon your epileptic visage!", "Smile you my speeches, as I were a fool?", "Goose, an I had you upon Sarum plain,", "I'd drive ye cackling home to Camelot."], "id": 440, "m": "That a slave like this should wear a sword when he has no honesty. Smiling rogues like him, like rats, often bite through the holy bonds that are too tight to untie. They flatter every passion that rebels in their masters' natures, bring oil to their fire and snow to their colder moods. They deny, agree and turn their beaks like a weathervane bird with every change in their masters' moods, knowing nothing, like dogs, except how to follow. A plague on your twitching face! Are you smirking at my speeches as if I were a fool? You goose, if I had you on Salisbury Plain, I'd chase you cackling all the way home to Camelot."}, {"t": "sp", "who": "CORNWALL", "lines": ["What, art thou mad, old fellow?"], "id": 441, "m": "What, are you mad, old fellow?"}, {"t": "sp", "who": "GLOSTER", "lines": ["How fell you out?", "Say that."], "id": 442, "m": "How did you fall out? Tell us that."}, {"t": "sp", "who": "KENT", "lines": ["No contraries hold more antipathy", "Than I and such a knave."], "id": 443, "m": "No two opposites hate each other more than I and a rogue like this."}, {"t": "sp", "who": "CORNWALL", "lines": ["Why dost thou call him knave? What is his fault?"], "id": 444, "m": "Why do you call him a rogue? What has he done wrong?"}, {"t": "sp", "who": "KENT", "lines": ["His countenance likes me not."], "id": 445, "m": "I don't like his face."}, {"t": "sp", "who": "CORNWALL", "lines": ["No more perchance does mine, or his, or hers."], "id": 446, "m": "Perhaps you don't like mine either, or his, or hers."}, {"t": "sp", "who": "KENT", "lines": ["Sir, 'tis my occupation to be plain:", "I have seen better faces in my time", "Than stands on any shoulder that I see", "Before me at this instant."], "id": 447, "m": "Sir, it's my job to be blunt. I've seen better faces in my time than any on the shoulders I see in front of me right now."}, {"t": "sp", "who": "CORNWALL", "lines": ["This is some fellow", "Who, having been prais'd for bluntness, doth affect", "A saucy roughness, and constrains the garb", "Quite from his nature: he cannot flatter, he,—", "An honest mind and plain,—he must speak truth!", "An they will take it, so; if not, he's plain.", "These kind of knaves I know which in this plainness", "Harbour more craft and more corrupter ends", "Than twenty silly-ducking observants", "That stretch their duties nicely."], "id": 448, "m": "This is some fellow who, having been praised for his bluntness, puts on a cheeky roughness and twists his manner away from his true nature. He can't flatter, not he! An honest, plain mind, he must speak the truth! If they'll take it, fine. If not, he's just plain. I know rogues like this, who hide more cunning and more corrupt aims in their plainness than twenty silly, bowing servants who carry out their duties with fussy care."}, {"t": "sp", "who": "KENT", "lines": ["Sir, in good faith, in sincere verity,", "Under the allowance of your great aspect,", "Whose influence, like the wreath of radiant fire", "On flickering Phoebus' front,—"], "id": 449, "m": "Sir, in good faith and sincere truth, with the permission of your great presence, whose influence, like the ring of shining fire on the bright sun's forehead..."}, {"t": "sp", "who": "CORNWALL", "lines": ["What mean'st by this?"], "id": 450, "m": "What do you mean by this?"}, {"t": "sp", "who": "KENT", "lines": ["To go out of my dialect, which you discommend so much. I know,", "sir, I am no flatterer: he that beguiled you in a plain accent", "was a plain knave; which, for my part, I will not be, though I", "should win your displeasure to entreat me to't."], "id": 451, "m": "To get away from my usual way of speaking, which you dislike so much. I know, sir, I'm no flatterer. The man who tricked you with plain speaking was a plain rogue, which I won't be, even if I could get you to stop being displeased and beg me to be one."}, {"t": "sp", "who": "CORNWALL", "lines": ["What was the offence you gave him?"], "id": 452, "m": "How did you offend him?"}, {"t": "sp", "who": "OSWALD", "lines": ["I never gave him any:", "It pleas'd the king his master very late", "To strike at me, upon his misconstruction;", "When he, compact, and flattering his displeasure,", "Tripp'd me behind; being down, insulted, rail'd", "And put upon him such a deal of man,", "That worthied him, got praises of the king", "For him attempting who was self-subdu'd;", "And, in the fleshment of this dread exploit,", "Drew on me here again."], "id": 453, "m": "I never did. The King his master recently decided to hit me because he misunderstood me. Then this man, siding with him and flattering his anger, tripped me from behind. When I was down, he insulted me, abused me and made himself out such a hero that he won praise from the King for attacking a man who didn't fight back. Thrilled by this terrible exploit, he drew his sword on me again here."}, {"t": "sp", "who": "KENT", "lines": ["None of these rogues and cowards", "But Ajax is their fool."], "id": 454, "m": "Rogues and cowards like these all make Ajax look like a fool next to them."}, {"t": "sp", "who": "CORNWALL", "lines": ["Fetch forth the stocks!—", "You stubborn ancient knave, you reverent braggart,", "We'll teach you,—"], "id": 455, "m": "Bring out the stocks! You stubborn old rogue, you respected boaster, we'll teach you..."}, {"t": "sp", "who": "KENT", "lines": ["Sir, I am too old to learn:", "Call not your stocks for me: I serve the king;", "On whose employment I was sent to you:", "You shall do small respect, show too bold malice", "Against the grace and person of my master,", "Stocking his messenger."], "id": 456, "m": "Sir, I'm too old to learn. Don't send for the stocks for me. I serve the King, who sent me on business to you. You'll show little respect and too bold a malice against the dignity and person of my master if you put his messenger in the stocks."}, {"t": "sp", "who": "CORNWALL", "lines": ["Fetch forth the stocks!—As I have life and honour,", "there shall he sit till noon."], "id": 457, "m": "Bring out the stocks! As I live and value my honour, he'll sit there till noon."}, {"t": "sp", "who": "REGAN", "lines": ["Till noon! Till night, my lord; and all night too!"], "id": 458, "m": "Till noon! Till night, my lord, and all night too!"}, {"t": "sp", "who": "KENT", "lines": ["Why, madam, if I were your father's dog,", "You should not use me so."], "id": 459, "m": "Why, madam, if I were your father's dog, you shouldn't treat me like this."}, {"t": "sp", "who": "REGAN", "lines": ["Sir, being his knave, I will."], "id": 460, "m": "Sir, since you're his servant, I will."}, {"t": "sp", "who": "CORNWALL", "lines": ["This is a fellow of the self-same colour", "Our sister speaks of.—Come, bring away the stocks!"], "id": 461, "m": "This is a fellow of exactly the same type our sister writes about. Come, bring the stocks!"}, {"t": "sd", "text": "Stocks brought out.", "id": 462}, {"t": "sp", "who": "GLOSTER", "lines": ["Let me beseech your grace not to do so:", "His fault is much, and the good king his master", "Will check him for't: your purpos'd low correction", "Is such as basest and contemned'st wretches", "For pilferings and most common trespasses,", "Are punish'd with: the king must take it ill", "That he, so slightly valu'd in his messenger,", "Should have him thus restrain'd."], "id": 463, "m": "Let me beg your grace not to do this. His fault is great, and his good master the King will punish him for it. The low punishment you intend is the kind used for the lowest, most despised wretches for petty theft and the commonest crimes. The King must take it badly that he is so little respected that his messenger is treated like this."}, {"t": "sp", "who": "CORNWALL", "lines": ["I'll answer that."], "id": 464, "m": "I'll answer for that."}, {"t": "sp", "who": "REGAN", "lines": ["My sister may receive it much more worse,", "To have her gentleman abus'd, assaulted,", "For following her affairs.—Put in his legs.—"], "id": 465, "m": "My sister may take it much worse that her gentleman was abused and attacked for carrying out her business. Put his legs in."}, {"t": "sd", "text": "Kent is put in the stocks.", "id": 466}, {"t": "sp", "who": "REGAN", "cont": 1, "lines": ["Come, my good lord, away."], "id": 467, "m": "Come, my good lord, let's go."}, {"t": "sd", "text": "Exeunt all but Gloster and Kent.", "id": 468}, {"t": "sp", "who": "GLOSTER", "lines": ["I am sorry for thee, friend; 'tis the duke's pleasure,", "Whose disposition, all the world well knows,", "Will not be rubb'd nor stopp'd; I'll entreat for thee."], "id": 469, "m": "I'm sorry for you, friend. It's the Duke's wish, and everyone knows his temper won't be blocked or stopped. I'll plead for you."}, {"t": "sp", "who": "KENT", "lines": ["Pray do not, sir: I have watch'd, and travell'd hard;", "Some time I shall sleep out, the rest I'll whistle.", "A good man's fortune may grow out at heels:", "Give you good morrow!"], "id": 470, "m": "Please don't, sir. I've gone without sleep and travelled hard. I'll spend some of the time sleeping and the rest whistling. Even a good man's luck can wear out at the heels. Good morning to you!"}, {"t": "sp", "who": "GLOSTER", "lines": ["The duke's to blame in this: 'twill be ill taken."], "id": 471, "m": "The Duke is to blame for this. It will go down badly."}, {"t": "sd", "text": "Exit.", "id": 472}, {"t": "sp", "who": "KENT", "lines": ["Good king, that must approve the common saw,—", "Thou out of heaven's benediction com'st", "To the warm sun!", "Approach, thou beacon to this under globe,", "That by thy comfortable beams I may", "Peruse this letter.—Nothing almost sees miracles", "But misery:—I know 'tis from Cordelia,", "Who hath most fortunately been inform'd", "Of my obscured course; and shall find time", "From this enormous state,—seeking to give", "Losses their remedies,—All weary and o'erwatch'd,", "Take vantage, heavy eyes, not to behold", "This shameful lodging.", "Fortune, good night: smile once more, turn thy wheel!"], "id": 473, "m": "Good King, you're proving the old saying true: you are going from heaven's blessing out into the hot sun! Come up, you sun, beacon to this world below, so that by your comforting rays I can read this letter. Almost nobody sees miracles except the miserable. I know it's from Cordelia, who has very luckily been told of my disguise, and who will find a chance to fix this monstrous situation and put right what has gone wrong. Weary and exhausted, heavy eyes, take the chance not to look at this shameful lodging. Fortune, good night. Smile once more and turn your wheel!"}, {"t": "sd", "text": "He sleeps.", "id": 474}, {"t": "scene", "act": 2, "scene": "III", "loc": "The open Country.", "id": 475}, {"t": "sd", "text": "Enter Edgar.", "id": 476}, {"t": "sp", "who": "EDGAR", "lines": ["I heard myself proclaim'd;", "And by the happy hollow of a tree", "Escap'd the hunt. No port is free; no place", "That guard and most unusual vigilance", "Does not attend my taking. While I may scape,", "I will preserve myself: and am bethought", "To take the basest and most poorest shape", "That ever penury, in contempt of man,", "Brought near to beast: my face I'll grime with filth;", "Blanket my loins; elf all my hair in knots;", "And with presented nakedness outface", "The winds and persecutions of the sky.", "The country gives me proof and precedent", "Of Bedlam beggars, who, with roaring voices,", "Strike in their numb'd and mortified bare arms", "Pins, wooden pricks, nails, sprigs of rosemary;", "And with this horrible object, from low farms,", "Poor pelting villages, sheep-cotes, and mills,", "Sometime with lunatic bans, sometime with prayers,", "Enforce their charity.—Poor Turlygod! poor Tom!", "That's something yet:—Edgar I nothing am."], "id": 477, "m": "I heard myself declared an outlaw, and escaped the hunt by hiding in a lucky hollow tree. No port is open, and there's no place without guards and unusually close watch waiting to catch me. While I can escape, I'll save myself. I've decided to take on the lowest and poorest appearance that poverty ever brought close to an animal in contempt of man. I'll smear my face with filth, wear only a blanket round my waist, tangle all my hair into knots, and with my body bare I'll face the winds and storms of the sky. The countryside gives me the example of Bedlam beggars, madmen who with roaring voices stick pins, wooden skewers, nails and sprigs of rosemary into their numb, deadened bare arms, and with this horrible sight, sometimes with mad curses, sometimes with prayers, force charity out of poor farms, wretched villages, sheepfolds and mills. Poor Turlygod! Poor Tom! That's something at least. As Edgar, I am nothing."}, {"t": "sd", "text": "Exit.", "id": 478}, {"t": "scene", "act": 2, "scene": "IV", "loc": "Before Gloster's Castle; Kent in the stocks.", "id": 479}, {"t": "sd", "text": "Enter Lear, Fool, and Gentleman.", "id": 480}, {"t": "sp", "who": "LEAR", "lines": ["'Tis strange that they should so depart from home,", "And not send back my messenger."], "id": 481, "m": "It's strange that they should leave home like that and not send my messenger back."}, {"t": "sp", "who": "GENTLEMAN", "lines": ["As I learn'd,", "The night before there was no purpose in them", "Of this remove."], "id": 482, "m": "As I heard it, the night before they had no plan to move."}, {"t": "sp", "who": "KENT", "lines": ["Hail to thee, noble master!"], "id": 483, "m": "Greetings, noble master!"}, {"t": "sp", "who": "LEAR", "lines": ["Ha!", "Mak'st thou this shame thy pastime?"], "id": 484, "m": "Ha! Are you doing this shameful thing for fun?"}, {"t": "sp", "who": "KENT", "lines": ["No, my lord."], "id": 485, "m": "No, my lord."}, {"t": "sp", "who": "FOOL", "lines": ["Ha, ha! he wears cruel garters. Horses are tied by the", "head; dogs and bears by the neck, monkeys by the loins, and", "men by the legs: when a man is over-lusty at legs, then he", "wears wooden nether-stocks."], "id": 486, "m": "Ha, ha! He's wearing cruel garters. Horses are tied by the head, dogs and bears by the neck, monkeys by the waist and men by the legs. When a man is too ready to run, he wears wooden stockings."}, {"t": "sp", "who": "LEAR", "lines": ["What's he that hath so much thy place mistook", "To set thee here?"], "id": 487, "m": "Who misjudged your rank so much as to put you here?"}, {"t": "sp", "who": "KENT", "lines": ["It is both he and she,", "Your son and daughter."], "id": 488, "m": "It was both he and she: your son-in-law and your daughter."}, {"t": "sp", "who": "LEAR", "lines": ["No."], "id": 489, "m": "No."}, {"t": "sp", "who": "KENT", "lines": ["Yes."], "id": 490, "m": "Yes."}, {"t": "sp", "who": "LEAR", "lines": ["No, I say."], "id": 491, "m": "No, I say."}, {"t": "sp", "who": "KENT", "lines": ["I say, yea."], "id": 492, "m": "I say yes."}, {"t": "sp", "who": "LEAR", "lines": ["No, no; they would not."], "id": 493, "m": "No, no, they wouldn't."}, {"t": "sp", "who": "KENT", "lines": ["Yes, they have."], "id": 494, "m": "Yes, they have."}, {"t": "sp", "who": "LEAR", "lines": ["By Jupiter, I swear no."], "id": 495, "m": "By Jupiter, I swear no."}, {"t": "sp", "who": "KENT", "lines": ["By Juno, I swear ay."], "id": 496, "m": "By Juno, I swear yes."}, {"t": "sp", "who": "LEAR", "lines": ["They durst not do't.", "They would not, could not do't; 'tis worse than murder,", "To do upon respect such violent outrage:", "Resolve me, with all modest haste, which way", "Thou mightst deserve or they impose this usage,", "Coming from us."], "id": 497, "m": "They wouldn't dare do it. They wouldn't, couldn't do it. It's worse than murder to do such violent outrage to the respect owed to me. Tell me, as quickly as you decently can, how you could deserve or they could impose this treatment, when you came from me."}, {"t": "sp", "who": "KENT", "lines": ["My lord, when at their home", "I did commend your highness' letters to them,", "Ere I was risen from the place that show'd", "My duty kneeling, came there a reeking post,", "Stew'd in his haste, half breathless, panting forth", "From Goneril his mistress salutations;", "Deliver'd letters, spite of intermission,", "Which presently they read: on whose contents,", "They summon'd up their meiny, straight took horse;", "Commanded me to follow and attend", "The leisure of their answer; gave me cold looks:", "And meeting here the other messenger,", "Whose welcome I perceiv'd had poison'd mine,—", "Being the very fellow which of late", "Display'd so saucily against your highness,—", "Having more man than wit about me, drew:", "He rais'd the house with loud and coward cries.", "Your son and daughter found this trespass worth", "The shame which here it suffers."], "id": 498, "m": "My lord, when I delivered your highness's letters to them at their home, before I'd even got up from kneeling to show my duty, a sweating messenger arrived, steaming from his hurry, half out of breath, gasping out greetings from his mistress Goneril. He handed over letters, interrupting me, which they read at once. Because of what they said, they called their servants together and got straight on their horses. They ordered me to follow and wait until they had time to answer, and gave me cold looks. Then, meeting the other messenger here, whose welcome I could see had poisoned mine, and who was the very fellow who recently behaved so insolently to your highness, I had more courage than sense and drew my sword. He woke the house with loud, cowardly screams. Your son-in-law and daughter thought this offence deserved the shame it's suffering here."}, {"t": "sp", "who": "FOOL", "lines": ["Winter's not gone yet, if the wild geese fly that way.", "~Fathers that wear rags", "~Do make their children blind;", "~But fathers that bear bags", "~Shall see their children kind.", "~Fortune, that arrant whore,", "~Ne'er turns the key to th' poor.", "But for all this, thou shalt have as many dolours for thy", "daughters as thou canst tell in a year."], "id": 499, "m": "Winter isn't over yet if the wild geese are flying that way. Fathers who wear rags make their children blind, but fathers who carry money bags will see their children kind. Fortune, that total whore, never opens the door to the poor. But for all this, you'll have as many sorrows from your daughters as you can count in a year."}, {"t": "sp", "who": "LEAR", "lines": ["O, how this mother swells up toward my heart!", "Hysterica passio,—down, thou climbing sorrow,", "Thy element's below!—Where is this daughter?"], "id": 500, "m": "Oh, how this hysteria swells up towards my heart! Rising sickness, get down, you climbing sorrow, your place is lower down! Where is this daughter?"}, {"t": "sp", "who": "KENT", "lines": ["With the earl, sir, here within."], "id": 501, "m": "With the Earl, sir, inside."}, {"t": "sp", "who": "LEAR", "lines": ["Follow me not;", "Stay here."], "id": 502, "m": "Don't follow me. Stay here."}, {"t": "sd", "text": "Exit.", "id": 503}, {"t": "sp", "who": "GENTLEMAN", "lines": ["Made you no more offence but what you speak of?"], "id": 504, "m": "Did you do nothing more wrong than what you've told us?"}, {"t": "sp", "who": "KENT", "lines": ["None.", "How chance the king comes with so small a number?"], "id": 505, "m": "Nothing. How is it the King comes with so few followers?"}, {"t": "sp", "who": "FOOL", "lines": ["An thou hadst been set i' the stocks for that question,", "thou hadst well deserved it."], "id": 506, "m": "If you'd been put in the stocks for asking that, you'd have deserved it."}, {"t": "sp", "who": "KENT", "lines": ["Why, fool?"], "id": 507, "m": "Why, Fool?"}, {"t": "sp", "who": "FOOL", "lines": ["We'll set thee to school to an ant, to teach thee there's no", "labouring in the winter. All that follow their noses are led by", "their eyes but blind men; and there's not a nose among twenty", "but can smell him that's stinking. Let go thy hold when a great", "wheel runs down a hill, lest it break thy neck with following", "it; but the great one that goes up the hill, let him draw thee", "after.", "When a wise man gives thee better counsel, give me mine again: I", "would have none but knaves follow it, since a fool gives it.", "~That sir which serves and seeks for gain,", "~And follows but for form,", "~Will pack when it begins to rain,", "~And leave thee in the storm.", "~But I will tarry; the fool will stay,", "~And let the wise man fly:", "~The knave turns fool that runs away;", "~The fool no knave, perdy."], "id": 508, "m": "We'll send you to school with an ant, to teach you there's no work in winter. Everyone who follows his nose is led by his eyes, except blind men, and there isn't one nose in twenty that can't smell a man who stinks of bad luck. Let go when a great wheel is running downhill, in case it breaks your neck as you follow it. But when a great man is going up the hill, let him pull you up after him. When a wise man gives you better advice, give me mine back. I'd want only rogues to follow it, since a fool gives it. The man who serves for profit and follows only for show will pack up when it starts to rain and leave you in the storm. But I will wait, the Fool will stay, and let the wise man run away. The rogue who runs away turns out the fool; the fool, by God, is no rogue."}, {"t": "sp", "who": "KENT", "lines": ["Where learn'd you this, fool?"], "id": 509, "m": "Where did you learn this, Fool?"}, {"t": "sp", "who": "FOOL", "lines": ["Not i' the stocks, fool."], "id": 510, "m": "Not in the stocks, fool."}, {"t": "sd", "text": "Re-enter Lear, with Gloster.", "id": 511}, {"t": "sp", "who": "LEAR", "lines": ["Deny to speak with me? They are sick? they are weary?", "They have travell'd all the night? Mere fetches;", "The images of revolt and flying off.", "Fetch me a better answer."], "id": 512, "m": "Refuse to speak to me? They're ill? They're tired? They've travelled all night? Just excuses, signs of rebellion and desertion. Get me a better answer."}, {"t": "sp", "who": "GLOSTER", "lines": ["My dear lord,", "You know the fiery quality of the duke;", "How unremovable and fix'd he is", "In his own course."], "id": 513, "m": "My dear lord, you know how fiery the Duke is, how immovable and fixed he is in his own way."}, {"t": "sp", "who": "LEAR", "lines": ["Vengeance! plague! death! confusion!—", "Fiery? What quality? why, Gloster, Gloster,", "I'd speak with the Duke of Cornwall and his wife."], "id": 514, "m": "Vengeance! Plague! Death! Destruction! Fiery? What kind of temper? Why, Gloster, Gloster, I want to speak to the Duke of Cornwall and his wife."}, {"t": "sp", "who": "GLOSTER", "lines": ["Well, my good lord, I have inform'd them so."], "id": 515, "m": "Well, my good lord, I've told them so."}, {"t": "sp", "who": "LEAR", "lines": ["Inform'd them! Dost thou understand me, man?"], "id": 516, "m": "Told them! Do you understand me, man?"}, {"t": "sp", "who": "GLOSTER", "lines": ["Ay, my good lord."], "id": 517, "m": "Yes, my good lord."}, {"t": "sp", "who": "LEAR", "lines": ["The King would speak with Cornwall; the dear father", "Would with his daughter speak, commands her service:", "Are they inform'd of this?—My breath and blood!—", "Fiery? the fiery duke?—Tell the hot duke that—", "No, but not yet: may be he is not well:", "Infirmity doth still neglect all office", "Whereto our health is bound: we are not ourselves", "When nature, being oppress'd, commands the mind", "To suffer with the body: I'll forbear;", "And am fallen out with my more headier will,", "To take the indispos'd and sickly fit", "For the sound man.—Death on my state! Wherefore"], "id": 518, "m": "The King wants to speak with Cornwall. The dear father wants to speak with his daughter, and commands her service. Have they been told this? My breath and blood! Fiery? The fiery Duke? Tell the hot Duke that... No, not yet. Maybe he isn't well. Illness always makes us neglect the duties we are bound to when healthy. We aren't ourselves when nature, overpowered, forces the mind to suffer along with the body. I'll be patient. I'm angry with my own hastier impulse for taking a sick man's fit as the act of a healthy one. Damn my royal state! Why..."}, {"t": "sd", "text": "Looking on Kent.", "id": 519}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["Should he sit here? This act persuades me", "That this remotion of the duke and her", "Is practice only. Give me my servant forth.", "Go tell the duke and's wife I'd speak with them,", "Now, presently: bid them come forth and hear me,", "Or at their chamber door I'll beat the drum", "Till it cry 'Sleep to death.'"], "id": 520, "m": "[Looking at Kent] ...should he sit here? This act convinces me that this moving away of the Duke and her is only a trick. Release my servant. Go and tell the Duke and his wife I want to speak to them, now, at once. Tell them to come out and hear me, or I'll beat the drum at their bedroom door until it kills their sleep."}, {"t": "sp", "who": "GLOSTER", "lines": ["I would have all well betwixt you."], "id": 521, "m": "I wish all were well between you."}, {"t": "sd", "text": "Exit.", "id": 522}, {"t": "sp", "who": "LEAR", "lines": ["O me, my heart, my rising heart!—but down!"], "id": 523, "m": "Oh, my heart, my rising heart! But get down!"}, {"t": "sp", "who": "FOOL", "lines": ["Cry to it, nuncle, as the cockney did to the eels when she", "put 'em i' the paste alive; she knapped 'em o' the coxcombs with", "a stick and cried 'Down, wantons, down!' 'Twas her brother that,", "in pure kindness to his horse, buttered his hay."], "id": 524, "m": "Shout at it, uncle, as the silly cook did to the eels when she put them in the pie alive. She whacked them on the head with a stick and shouted 'Down, you naughty things, down!' It was her brother who, out of pure kindness to his horse, buttered its hay."}, {"t": "sd", "text": "Enter Cornwall, Regan, Gloster, and Servants.", "id": 525}, {"t": "sp", "who": "LEAR", "lines": ["Good-morrow to you both."], "id": 526, "m": "Good morning to you both."}, {"t": "sp", "who": "CORNWALL", "lines": ["Hail to your grace!"], "id": 527, "m": "Greetings to your grace!"}, {"t": "sd", "text": "Kent is set at liberty.", "id": 528}, {"t": "sp", "who": "REGAN", "lines": ["I am glad to see your highness."], "id": 529, "m": "I'm glad to see your highness."}, {"t": "sp", "who": "LEAR", "lines": ["Regan, I think you are; I know what reason", "I have to think so: if thou shouldst not be glad,", "I would divorce me from thy mother's tomb,", "Sepulchring an adultress.—[To Kent] O, are you free?", "Some other time for that.—Beloved Regan,", "Thy sister's naught: O Regan, she hath tied", "Sharp-tooth'd unkindness, like a vulture, here,—"], "id": 530, "m": "Regan, I think you are. I know why I have reason to think so. If you weren't glad, I'd divorce myself from your mother's tomb, because it would hold an adulteress. [To Kent] Oh, are you free? We'll talk about that another time. Beloved Regan, your sister is wicked. Oh Regan, she has tied sharp-toothed unkindness here, like a vulture... [He points to his heart.]"}, {"t": "sd", "text": "Points to his heart.", "id": 531}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["I can scarce speak to thee; thou'lt not believe", "With how deprav'd a quality—O Regan!"], "id": 532, "m": "I can hardly speak to you. You won't believe how depraved a way... Oh Regan!"}, {"t": "sp", "who": "REGAN", "lines": ["I pray you, sir, take patience: I have hope", "You less know how to value her desert", "Than she to scant her duty."], "id": 533, "m": "Please, sir, be patient. I think it's more likely that you don't know how to value her worth than that she would fall short in her duty."}, {"t": "sp", "who": "LEAR", "lines": ["Say, how is that?"], "id": 534, "m": "What? What do you mean?"}, {"t": "sp", "who": "REGAN", "lines": ["I cannot think my sister in the least", "Would fail her obligation: if, sir, perchance", "She have restrain'd the riots of your followers,", "'Tis on such ground, and to such wholesome end,", "As clears her from all blame."], "id": 535, "m": "I can't believe my sister would fail in her obligation in the slightest. If, sir, she has perhaps restrained the riots of your followers, it was for such good reasons and such healthy ends that she can't be blamed at all."}, {"t": "sp", "who": "LEAR", "lines": ["My curses on her!"], "id": 536, "m": "My curses on her!"}, {"t": "sp", "who": "REGAN", "lines": ["O, sir, you are old;", "Nature in you stands on the very verge", "Of her confine: you should be rul'd and led", "By some discretion, that discerns your state", "Better than you yourself. Therefore, I pray you,", "That to our sister you do make return;", "Say you have wrong'd her, sir."], "id": 537, "m": "Oh, sir, you are old. Your life is at the very edge of its limit. You should be ruled and guided by someone sensible who understands your condition better than you do yourself. So please go back to our sister. Tell her you've wronged her, sir."}, {"t": "sp", "who": "LEAR", "lines": ["Ask her forgiveness?", "Do you but mark how this becomes the house:", "'Dear daughter, I confess that I am old;", "[Kneeling.]", "Age is unnecessary: on my knees I beg", "That you'll vouchsafe me raiment, bed, and food.'"], "id": 538, "m": "Ask her forgiveness? Just look how well this suits the royal family: [kneeling] 'Dear daughter, I confess that I am old. Old people are useless. On my knees I beg you to grant me clothes, a bed and food.'"}, {"t": "sp", "who": "REGAN", "lines": ["Good sir, no more! These are unsightly tricks:", "Return you to my sister."], "id": 539, "m": "Good sir, no more of this! These are ugly tricks. Go back to my sister."}, {"t": "sp", "who": "LEAR", "lines": ["[Rising.] Never, Regan:", "She hath abated me of half my train;", "Look'd black upon me; struck me with her tongue,", "Most serpent-like, upon the very heart:—", "All the stor'd vengeances of heaven fall", "On her ingrateful top! Strike her young bones,", "You taking airs, with lameness!"], "id": 540, "m": "[Rising] Never, Regan. She has cut my followers by half, looked darkly at me, and stung me with her tongue, like a snake, right in the heart. May all the stored-up vengeance of heaven fall on her ungrateful head! Strike her unborn children's bones with lameness, you infectious airs!"}, {"t": "sp", "who": "CORNWALL", "lines": ["Fie, sir, fie!"], "id": 541, "m": "Shame, sir, shame!"}, {"t": "sp", "who": "LEAR", "lines": ["You nimble lightnings, dart your blinding flames", "Into her scornful eyes! Infect her beauty,", "You fen-suck'd fogs, drawn by the powerful sun,", "To fall and blast her pride!"], "id": 542, "m": "You quick lightning, dart your blinding flames into her scornful eyes! Infect her beauty, you fogs sucked up from the marshes by the powerful sun, fall and wither her pride!"}, {"t": "sp", "who": "REGAN", "lines": ["O the blest gods!", "So will you wish on me when the rash mood is on."], "id": 543, "m": "Oh, blessed gods! You'll wish the same on me when your rash mood takes you."}, {"t": "sp", "who": "LEAR", "lines": ["No, Regan, thou shalt never have my curse:", "Thy tender-hefted nature shall not give", "Thee o'er to harshness: her eyes are fierce; but thine", "Do comfort, and not burn. 'Tis not in thee", "To grudge my pleasures, to cut off my train,", "To bandy hasty words, to scant my sizes,", "And, in conclusion, to oppose the bolt", "Against my coming in: thou better know'st", "The offices of nature, bond of childhood,", "Effects of courtesy, dues of gratitude;", "Thy half o' the kingdom hast thou not forgot,", "Wherein I thee endow'd."], "id": 544, "m": "No, Regan, you will never have my curse. Your gentle nature will never let you be harsh. Her eyes are fierce, but yours comfort and don't burn. It's not in you to resent my pleasures, cut down my followers, trade hasty words, reduce my allowance, and, finally, bolt the door against my coming in. You know better the duties of nature, the bonds of a child, the obligations of courtesy and the debts of gratitude. You haven't forgotten the half of the kingdom I gave you."}, {"t": "sp", "who": "REGAN", "lines": ["Good sir, to the purpose."], "id": 545, "m": "Good sir, get to the point."}, {"t": "sp", "who": "LEAR", "lines": ["Who put my man i' the stocks?"], "id": 546, "m": "Who put my man in the stocks?"}, {"t": "sd", "text": "Tucket within.", "id": 547}, {"t": "sp", "who": "CORNWALL", "lines": ["What trumpet's that?"], "id": 548, "m": "What trumpet is that?"}, {"t": "sp", "who": "REGAN", "lines": ["I know't—my sister's: this approves her letter,", "That she would soon be here."], "id": 549, "m": "I know it: my sister's. This confirms her letter saying she'd be here soon."}, {"t": "sd", "text": "Enter Oswald.", "id": 550}, {"t": "sp", "who": "REGAN", "cont": 1, "lines": ["Is your lady come?"], "id": 551, "m": "Has your lady come?"}, {"t": "sp", "who": "LEAR", "lines": ["This is a slave, whose easy-borrowed pride", "Dwells in the fickle grace of her he follows.—", "Out, varlet, from my sight!"], "id": 552, "m": "This is a slave whose cheaply borrowed pride depends on the fickle favour of the woman he serves. Get out of my sight, you rascal!"}, {"t": "sp", "who": "CORNWALL", "lines": ["What means your grace?"], "id": 553, "m": "What does your grace mean?"}, {"t": "sp", "who": "LEAR", "lines": ["Who stock'd my servant? Regan, I have good hope", "Thou didst not know on't.—Who comes here? O heavens!"], "id": 554, "m": "Who put my servant in the stocks? Regan, I hope you didn't know about it. Who's coming? Oh heavens!"}, {"t": "sd", "text": "Enter Goneril.", "id": 555}, {"t": "sp", "who": "LEAR", "cont": 1, "lines": ["If you do love old men, if your sweet sway", "Allow obedience, if yourselves are old,", "Make it your cause; send down, and take my part!—", "[To Goneril.] Art not asham'd to look upon this beard?—", "O Regan, wilt thou take her by the hand?"], "id": 556, "m": "If you love old men, if your gentle rule approves of obedience, if you are old yourselves, make my cause yours. Send down your power and take my side! [To Goneril] Aren't you ashamed to look at this beard? Oh Regan, will you take her by the hand?"}, {"t": "sp", "who": "GONERIL", "lines": ["Why not by the hand, sir? How have I offended?", "All's not offence that indiscretion finds", "And dotage terms so."], "id": 557, "m": "Why not by the hand, sir? How have I offended? Not everything is an offence just because poor judgement finds it so and senility calls it so."}, {"t": "sp", "who": "LEAR", "lines": ["O sides, you are too tough!", "Will you yet hold?—How came my man i' the stocks?"], "id": 558, "m": "Oh, my ribs, you're too tough! Will you still hold my heart in? How did my man come to be in the stocks?"}, {"t": "sp", "who": "CORNWALL", "lines": ["I set him there, sir: but his own disorders", "Deserv'd much less advancement."], "id": 559, "m": "I put him there, sir. But his own bad behaviour deserved much less honour than that."}, {"t": "sp", "who": "LEAR", "lines": ["You? did you?"], "id": 560, "m": "You? Did you?"}, {"t": "sp", "who": "REGAN", "lines": ["I pray you, father, being weak, seem so.", "If, till the expiration of your month,", "You will return and sojourn with my sister,", "Dismissing half your train, come then to me:", "I am now from home, and out of that provision", "Which shall be needful for your entertainment."], "id": 561, "m": "Please, father, since you are weak, behave like it. If you go back and stay with my sister until the end of your month, dismissing half your followers, then come to me. I'm away from home now and don't have the supplies needed to look after you."}, {"t": "sp", "who": "LEAR", "lines": ["Return to her, and fifty men dismiss'd?", "No, rather I abjure all roofs, and choose", "To wage against the enmity o' the air;", "To be a comrade with the wolf and owl,—", "Necessity's sharp pinch!—Return with her?", "Why, the hot-blooded France, that dowerless took", "Our youngest born, I co
